# Ievēlētie Saraksti un to avoti. Slug nemainās pēc publicēšanas (ir Solījumu ID sākumā).
#
# avoti[].veids: cvk | paplasinata
# avoti[].fails: teksts repo (sources/); citātus pārbauda pret to. Bez faila no avota citēt nevar.
# CVK avotam:
#   nodalas — CVK nodaļu virsraksti (viena nodaļa = viena ekstrakcijas izpilde = viens PR);
#   neizrakstit — virsraksti, ar kuriem sākas teksts ārpus nodaļām (noslēgums).
# Paplašinātajam avotam (sk. sources/README.md):
#   atbilst_cvk — paplašinātās nodaļa → CVK nodaļa, kuras izpildē to apstrādā;
#                 nodaļas, kuru te nav, apstrādā pēdējā izpildē "Ārpus CVK nodaļām";
#   izlaist — sadaļas, kas nav šī avota teksts (piem., iekļauta CVK programmas kopija);
#   nav_jaizraksta — sadaļas, kuras metode neizraksta (pārskatā pelēkas).
#
# frakcija: Saraksta Frakcijas kods 15. Saeimā tieši kā Saeimas balsojumu datos (data.gov.lv `saeimas-sedes`,
#   lauks FRACTION; sk. `npm run balsojums`). Pievieno, kad 15. Saeimas frakcijas izveidotas — kodus ņem no
#   pirmā 15. Saeimas balsojumu faila, neuzmin. 14. Saeimas kodi (JV, NA, AS, LPV, PRO, ZZS) uz Sarakstiem netiek kartēti.

