    veids: zinas
solijumi:
  - id: as-kritiskas-infrastrukturas-noturiba
    virziens: par
    pamatojums: >-
      Stiprina kritiskās infrastruktūras noturību, ierobežojot Krievijai vai Baltkrievijai piederīgu personu
      ietekmi kritiskās infrastruktūras subjektos un atceļot Ministru kabineta atļauju ar noklusējumu.
  - id: as-noturiba-pret-agresiju-un-hibriduzbrukumiem
    virziens: par
    pamatojums: >-
      Likumprojekta mērķis ir novērst Krievijai vai Baltkrievijai piederīgu personu apdraudošu ietekmi
      kritiskajā infrastruktūrā un nacionālajai drošībai nozīmīgās organizācijās, kas tieši stiprina
      noturību pret Krievijas hibrīdietekmi.
piezimes: >-
  Galīgais lasījums 14. Saeimā Vērtēšanas periodā Statusu nemaina (vertesana.md); abi Solījumi ir
  Nepārbaudāmi. Saturs pēc saeima.lv/lawdata.json likumprojekta apraksta (statuss 13.10.2026: "Nodots
  Juridiskā biroja vadītājam", izsludināšanas datuma nav); likumi.lv Nacionālās drošības likuma
  konsolidētajā tekstā 13.10.2026 jaunākie grozījumi ir 03.09.2026 likums. Izsludināšana — atsevišķs Notikums.
jautajums: "Balsojuma dati vēl nav publicēti (npm run --silent balsojums -- 2026-10-08 \"1372/Lp14), 3.lasījums\")."
