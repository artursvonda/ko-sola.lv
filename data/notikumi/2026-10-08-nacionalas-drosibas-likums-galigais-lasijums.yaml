id: 2026-10-08-nacionalas-drosibas-likums-galigais-lasijums
datums: 2026-10-08
nosaukums: Saeima galīgajā lasījumā pieņem grozījumus Nacionālās drošības likumā (1372/Lp14)
apraksts: >-
  14. Saeima 2026. gada 8. oktobrī trešajā (galīgajā) lasījumā pieņēma Ministru kabineta 22.05.2026
  iesniegto likumprojektu "Grozījumi Nacionālās drošības likumā" (1372/Lp14). Pēc Saeimas likumprojekta
  apraksta tas pilnveido kritiskās infrastruktūras un nacionālajai drošībai nozīmīgu komercsabiedrību,
  biedrību un nodibinājumu apdraudējuma izvērtēšanas un novēršanas mehānismu, nosaka īpašus ierobežojumus
  D kategorijas kritiskās infrastruktūras subjektiem, lai novērstu Krievijai vai Baltkrievijai piederīgu
  personu apdraudošu ietekmi, izsmeļošāk definē patiesā labuma guvēja statusu (10 % līdzdalības slieksnis)
  un atceļ iespēju saņemt Ministru kabineta atļauju ar noklusējumu. Likums vēl nav izsludināts.
avoti:
  - url: https://titania.saeima.lv/LIVS14/saeimalivs14.nsf/webSasaiste?OpenView&restricttocategory=1372/Lp14
