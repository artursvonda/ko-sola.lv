id: 2026-11-26-saeima-airbaltic-galvojuma-grozijumi
datums: 2026-11-26
nosaukums: Saeima pieņem grozījumus airBaltic finanšu stabilizācijas likumā par valsts galvojumu līdz 175 milj. eiro
apraksts: >-
  Saeima 26.11.2026 pieņēma grozījumus "Air Baltic Corporation AS" finanšu stabilizācijas pasākumu
  likumā, kas paredz valsts galvojumu uzņēmuma saistībām līdz 175 000 000 eiro darbības
  nepārtrauktības nodrošināšanai restrukturizācijas laikā. Galvojumu valsts vārdā sniedz finanšu
  ministrs, ja Satiksmes ministrija Ministru kabinetā iesniegusi finansiālo un juridisko pamatojumu,
  galvojums kalpo tikai otrās finansējuma tranšes nosacījumiem, no tā izrietošās saistības attiecina
  uz fiskālo rezervi un Saeima to apstiprinājusi ar atsevišķu lēmumu. Likums izsludināts 27.11.2026
  (Latvijas Vēstnesis Nr. 229B) un stājas spēkā nākamajā dienā pēc izsludināšanas.
