    veids: zinas
solijumi:
  - id: sv-airbaltic-finansesanas-partrauksana
    virziens: pret
    pamatojums: >-
      Saeima pieņem likumu, kas paredz valsts galvojumu airBaltic saistībām līdz 175 milj. eiro, —
      jaunu valsts atbalsta instrumentu, nevis valsts finansējuma pārtraukšanu.
piezimes: >-
  Vēstnesī (OP 2026/229B.1): "Likums Saeimā pieņemts 2026. gada 26. novembrī", parakstīts Rīgā
  27.11.2026, stājas spēkā nākamajā dienā pēc izsludināšanas; tātad 26.11 bija galīgais lasījums
  (steidzams). Likumprojekta numurs Vēstnesī nav minēts (LIVS nerāpo). Izsludināšana nav atsevišķs
  Notikums, jo Statusu nemaina (vertesana.md). Statuss nemainās: galvojuma izsniegšanai vajadzīgs
  atsevišķs Saeimas lēmums un finanšu ministra rīcība; Solījums "pārtraukt finansēt" nav galīgi
  padarīts nereāls. likumi.lv saite nav atvērta (robots.txt). Saistīts: MK 24.11.2026 konceptuālais
  atbalsts galvojumam. Norāde — LSM ziņa (tikai saite).
jautajums: >-
  Balsojuma dati nav pieejami routine vidē (npm run balsojums -- 2026-11-26 "Air Baltic").
