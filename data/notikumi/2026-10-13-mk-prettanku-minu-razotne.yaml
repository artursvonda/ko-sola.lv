id: 2026-10-13-mk-prettanku-minu-razotne
datums: 2026-10-13
nosaukums: MK apstiprina prettanku mīnu ražotnes izveidi Latvijā kopā ar "Dynamit Nobel Defence"
apraksts: >-
  Ministru kabinets 13.10.2026 sēdē apstiprināja jaunas prettanku mīnu ražotnes izveidi Latvijā (AM
  virzīts). Ražotni veidos SIA "Valsts aizsardzības korporācija" kopā ar Vācijas militārās
  industrijas uzņēmumu "Dynamit Nobel Defence", ar kuru 2026. gada februārī parakstīts saprašanās
  memorands; šogad plānots noslēgt sadarbības līgumu par tehnoloģiju un zināšanu pārnesi. Ražotne
  nodrošinās pilnu ražošanas un piegādes ciklu NBS vajadzībām, arī kaujas galviņu pildīšanu, un
  drošu piekļuvi kritisko izejvielu un iekārtu piegādātājiem; liela daļa produkcijas plānota
  eksportam. Darbību plānots sākt 2028. gadā.
