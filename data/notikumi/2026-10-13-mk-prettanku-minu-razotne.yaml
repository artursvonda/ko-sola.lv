solijumi:
  - id: jv-vietejas-militaras-industrijas-attistiba
    virziens: par
    pamatojums: >-
      MK apstiprina jaunas militārās ražotnes (prettanku mīnas un to komponentes) izveidi Latvijā ar
      valsts aizsardzības korporācijas līdzdalību un tehnoloģiju pārnesi vietējai industrijai.
  - id: na-vietejas-militaras-industrijas-attistiba
    virziens: par
    pamatojums: >-
      MK apstiprina jaunas militārās ražotnes (prettanku mīnas un to komponentes) izveidi Latvijā ar
      valsts aizsardzības korporācijas līdzdalību un tehnoloģiju pārnesi vietējai industrijai.
  - id: as-aizsardzibas-industrijas-stiprinasana
    virziens: par
    pamatojums: >-
      MK apstiprina jaunas prettanku mīnu ražotnes izveidi Latvijā, kas paplašina vietējās
      aizsardzības industrijas ražošanas jaudu un iesaista Latvijas industriju.
  - id: pro-drosas-aizsardzibas-piegades-kedes
    virziens: par
    pamatojums: >-
      Ražotne kopā ar Vācijas uzņēmumu paredz pilnu ražošanas un piegādes ciklu NBS vajadzībām un
      drošu piekļuvi kritisko izejvielu un iekārtu piegādātājiem, ko MK relīze sauc par piegādes ķēdes
      noturības stiprināšanu.
piezimes: >-
  Avots ir MK un AM relīze (13.10.2026). MK sēdes protokollēmums un TAP dokuments nav atrasti; relīze
  nesaka lēmuma veidu (rīkojums, protokollēmums vai informatīvais ziņojums), dokumenta numuru, ražotnes
  atrašanās vietu, investīciju apjomu vai eksporta daļu skaitliski.
