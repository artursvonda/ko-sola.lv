id: 2026-10-22-elektronisko-sakaru-nacionala-viesabonesana
datums: 2026-10-22
nosaukums: Saeima galīgajā lasījumā pieņem grozījumus Elektronisko sakaru likumā par nacionālo viesabonēšanu krīzēs (1565/Lp14)
apraksts: >-
  14. Saeima 2026. gada 22. oktobrī galīgajā lasījumā pieņēma steidzamus grozījumus Elektronisko sakaru likumā,
  kas ievieš nacionālo viesabonēšanu mobilajiem sakariem: ja kāda operatora tīkls ilgstoši nav pieejams, cits
  operators pārņem tā klientu zvanus un īsziņas. Nacionālo viesabonēšanu aktivizē pēc krīzes vadības
  institūcijas lēmuma; ierīces automātiski pieslēdzas tīklam ar pārklājumu, saglabājot balss zvanus un SMS.
  Mobilo sakaru operatoriem tā jāievieš līdz 2027. gada 1. jūlijam. Likums vēl nav izsludināts.
