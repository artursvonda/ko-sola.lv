id: 2026-11-04-izsludinati-eppl-groz-valsts-valoda
datums: 2026-11-04
nosaukums: Izsludināti Elektronisko plašsaziņas līdzekļu likuma grozījumi par valsts valodu radio, televīzijā un reklāmā
apraksts: >-
  Valsts prezidents 2026. gada 4. novembrī izsludināja 14. Saeimas 22. oktobrī pieņemtos grozījumus
  Elektronisko plašsaziņas līdzekļu likumā ("Latvijas Vēstnesis" Nr. 213). Radio programmas apraides
  atļauju izsniedz apraidei tikai valsts valodā vai citas ES dalībvalsts valodā (18. p. 2.2 d., spēkā no
  21.07.2033); elektroniskā plašsaziņas līdzekļa radio programma ir valsts valodā vai citas ES dalībvalsts
  valodā, raidījumus vai to fragmentus citā svešvalodā tulko valsts valodā (28. p. 2.1 d., spēkā no
  21.01.2034; neatbilstošas atļaujas Padome anulē). Filmas un televīzijas raidījumus svešvalodās ieskāņo,
  dublē vai subtitrē valsts valodā, bērniem paredzētās filmas dublē vai ieskāņo valsts valodā (28. p. 3. un
  4. d., spēkā no 01.09.2027; izņēmumi, piem., tiešraidēm un retranslācijai); raidījumos ievieto reklāmu
  valsts valodā (28. p. 6. d., spēkā no 01.01.2027). Grozījumi arī ierobežo sankcionētu izpildītāju un
  autoru mūzikas izmantošanu. Pārējās normas stājas spēkā nākamajā dienā pēc izsludināšanas.
avoti:
  - url: https://www.vestnesis.lv/op/2026/213.6
    veids: vestnesis
solijumi:
  - id: jv-valsts-valodas-tiesiskais-regulejums
    virziens: par
    pamatojums: >-
      Izsludinātie grozījumi stiprina tiesisko regulējumu valsts valodas lietošanai elektroniskajos
      plašsaziņas līdzekļos: radio programmas tikai valsts vai ES valodā, obligāts tulkojums valsts valodā
      filmām un TV raidījumiem, reklāma valsts valodā.
  - id: jv-valsts-valodas-lietojums-visas-jomas
    virziens: par
    pamatojums: >-
      Grozījumi paplašina obligātu valsts valodas lietojumu radio, televīzijas un reklāmas jomā.
piezimes: >-
  Saturs pēc Vēstneša publikācijas (213.6). Likumprojekta numurs un 22.10.2026 galīgā lasījuma balsojums
  nav noskaidroti (LIVS nerāpo; galīgais lasījums 14. Saeimā Procesā nedod). jv-valsts-valodas-lietojums-visas-jomas
  ir Nepārbaudāms — Statusa maiņas nav.
jautajums: >-
  jv-valsts-valodas-tiesiskais-regulejums: vai šis izsludinātais likums ir Izpildīts (Solījuma piezīme —
  Pārbaudāms pēc tā, vai pieņemti normatīvo aktu grozījumi, kas stiprina šīs tiesības) vai tikai Daļēji
  izpildīts / bez Statusa maiņas, jo Solījums ("stiprināsim tiesisko regulējumu ... lietošanu") ir plašs, bet
  grozījumi skar tikai elektroniskos plašsaziņas līdzekļus un daļa stājas spēkā 2027.–2034. gadā? Statuss nav mainīts.
