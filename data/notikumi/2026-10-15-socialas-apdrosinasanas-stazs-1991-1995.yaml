    veids: zinas
solijumi:
  - id: as-pensiju-sasaiste-ar-bernu-audzinasanu
    virziens: par
    pamatojums: >-
      Ļauj ar brīvprātīgu iemaksu ieskaitīt pensiju apdrošināšanas stāžā laiku, kad māte 1991.–1995. gadā
      audzinājusi bērnu līdz astoņu gadu vecumam, — paplašina pensiju sistēmas sasaisti ar bērnu
      audzināšanu, bet tikai šim periodam; galīgais lasījums 14. Saeimā pirms 03.11.2026 Statusu nemaina.
piezimes: >-
  Galīgais lasījums (2.lasījums, steidzams) 14. Saeimā pēc vēlēšanām — Statusu nemaina (vertesana.md);
  Statusu var mainīt izsludināšana (atsevišķs Notikums). LIVS saite ierakstīta, bet nav atvērta (robots.txt);
  saturs pēc Saeimas preses relīzes.
jautajums: "Balsojuma dati vēl nav publicēti (npm run --silent balsojums -- 2026-10-15 \"1568/Lp14), 2.lasījums\")"
