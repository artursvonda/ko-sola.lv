id: 2026-10-15-socialas-apdrosinasanas-stazs-1991-1995
datums: 2026-10-15
nosaukums: Saeima pieņem grozījumus likumā "Par valsts sociālo apdrošināšanu" par stāžu 1991.–1995. gadā (1568/Lp14)
apraksts: >-
  14. Saeima 2026. gada 15. oktobrī galīgajā lasījumā pieņēma steidzamus grozījumus likumā "Par valsts
  sociālo apdrošināšanu". Tie ļauj brīvprātīgi veikt sociālās apdrošināšanas iemaksas par noteiktiem
  darba stāžam pielīdzināmiem periodiem no 1991. gada 1. janvāra līdz 1995. gada 31. decembrim, lai tos
  ieskaitītu pensiju un bezdarba apdrošināšanas stāžā: studijas pēc vidējās izglītības, pēcdiploma
  izglītība vai kvalifikācijas paaugstināšana; personas ar I grupas invaliditāti, bērna ar invaliditāti
  līdz 16 gadiem vai 80 gadus sasniegušas personas kopšana; laiks, kurā māte audzinājusi bērnu līdz
  astoņu gadu vecumam. Periodiem jābūt pierādītiem saskaņā ar likumu "Par valsts pensijām" un tie
  nedrīkst sakrist ar citiem sociālās apdrošināšanas periodiem. Iemaksa — 1% no attiecīgā gada minimālās
  mēneša darba algas par katru mēnesi; iemaksas varēs veikt no 2027. gada 1. oktobra.
