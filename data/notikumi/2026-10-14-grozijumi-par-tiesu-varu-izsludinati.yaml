id: 2026-10-14-grozijumi-par-tiesu-varu-izsludinati
datums: 2026-10-14
nosaukums: Izsludināti grozījumi likumā "Par tiesu varu" — tieslietu ministra pilnvaras pāriet Tieslietu padomei
apraksts: >-
  Latvijas Vēstnesī Nr. 198 (14.10.2026) izsludināti 14. Saeimas 2026. gada 1. oktobrī pieņemtie grozījumi
  likumā "Par tiesu varu". Vairākos pantos (32., 33., 39., 40., 57., 60., 61., 73.2, 75., 77. p.) tieslietu
  ministra priekšlikums vai lēmums aizstāts ar Tieslietu padomes iniciatīvu vai lēmumu vai svītrots; par
  rajona (pilsētas) tiesu reorganizāciju lemj Tieslietu padome (33.4 p.). Jaunajā 89.1 pantā Tieslietu padome
  ir koleģiāla institūcija, kas pārstāv tiesu varu attiecībās ar citām valsts institūcijām un lemj arī par
  tiesnešu karjeru un tiesu budžetu; ja Saeima neieceļ vai neapstiprina tiesnesi, Tieslietu padome var
  iesniegt pieteikumu Satversmes tiesā (89.11 p.). Rajona (pilsētu) tiesu un apgabaltiesu budžeta
  pieprasījumu projektu sagatavo Tiesu administrācija, Tieslietu padome to var papildināt vai grozīt, un
  Tiesu administrācija to ar padomes viedokli nosūta Tieslietu ministrijai iesniegšanai Finanšu ministrijā
  (50.2 p. (3)). Tieslietu padome īsteno Tiesu administrācijas funkcionālo pakļautību tiesu darba
  organizācijas, tiesu budžeta plānošanas un administrēšanas, tiesnešu pašpārvaldes atbalsta un tiesu
  personāla jautājumos (107.1 p. (1.1)); tiesu darbinieki darba tiesiskās attiecības nodibina ar Tiesu
  administrāciju, atlīdzība — Tieslietu padomes noteiktā kārtībā (106. p.). Ieviesti tiesas jurista (98.5 p.)
  un tiesas padomnieka (98.6 p.) amati. Likums stājas spēkā 2027. gada 1. janvārī (atsevišķas normas —
  pārejas noteikumos vēlāk).
