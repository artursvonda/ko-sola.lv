solijumi:
  - id: pro-tiesu-varas-neatkariba-no-izpildvaras
    virziens: par
    pamatojums: >-
      Tiesu budžeta pieprasījumu Tieslietu padome var grozīt, un tiesu atbalsta funkcijās (darba organizācija,
      budžeta plānošana un administrēšana, personāls) Tiesu administrācija funkcionāli pakļauta Tieslietu
      padomei, — tiesu varas loma abās Solījuma jomās pieaug; tomēr pieprasījums joprojām iet caur Tieslietu
      ministriju uz Finanšu ministriju, un Tiesu administrācijas institucionālo padotību tieslietu ministram
      (MK noteikumi Nr. 585, 1. p.) likums nemaina.
  - id: pro-politiskas-ietekmes-mazinasana-tiesu-sistema
    virziens: par
    pamatojums: >-
      Vairākas tieslietu ministra (izpildvaras) pilnvaras attiecībā uz tiesām pāriet Tieslietu padomei, un tiesu
      administrēšanā Tiesu administrācija funkcionāli pakļauta Tieslietu padomei (107.1 p. (1.1)).
  - id: pro-neatkariga-tiesnesu-atlase
    virziens: par
    pamatojums: >-
      Tieslietu padome var vērsties Satversmes tiesā, ja Saeima neieceļ vai neapstiprina tiesnesi, un par
      tiesnešu karjeras jautājumiem balso tikai padomes locekļi tiesneši.
  - id: jv-tiesu-neatkariba
    virziens: par
    pamatojums: >-
      Vairākas tieslietu ministra pilnvaras attiecībā uz tiesām pāriet tiesu varas institūcijai — Tieslietu
      padomei, kas lemj arī par tiesnešu karjeru un tiesu budžetu.
piezimes: >-
  Galīgais lasījums 14. Saeimā 01.10.2026 — pirms vēlēšanām, atsevišķs Notikums nav pievienots; likumprojekta
  numurs un balsojums nav noskaidroti (LIVS nerāpo). Saturs pēc likumi.lv grozījumu teksta; 33. (2), 40. (2),
  57., 60., 61. panta priekšmets nav pārbaudīts. Tiesu administrācijas statuss — MK noteikumi Nr. 585
  (20.09.2022) "Tiesu administrācijas nolikums", 1. p.: tieslietu ministra padotībā esoša tiešās pārvaldes iestāde.
jautajums: >-
  pro-tiesu-varas-neatkariba-no-izpildvaras: vai tas ir Daļēji izpildīts (vai Izpildīts)? Abās jomās tiesu
  varas loma pieaug, bet neatkarība no izpildvaras nav pilnīga: budžeta pieprasījums joprojām iet caur TM uz FM
  (nav noteikts, ka TM/FM/MK to nedrīkst mainīt), un Tiesu administrācija paliek institucionāli tieslietu
  ministra padotībā (tikai funkcionāli pakļauta TP). Statuss nav mainīts. Likums spēkā 01.01.2027.
