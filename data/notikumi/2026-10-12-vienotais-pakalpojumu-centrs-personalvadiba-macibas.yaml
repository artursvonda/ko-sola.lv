id: 2026-10-12-vienotais-pakalpojumu-centrs-personalvadiba-macibas
datums: 2026-10-12
nosaukums: MK noteikumi par personālvadības un mācību pakalpojumiem valsts pārvaldes vienotajā pakalpojumu centrā
apraksts: >-
  Ministru kabineta 2026. gada 6. oktobra noteikumi Nr. 617 (prot. Nr. 57 1. §) "Valsts kancelejas
  un Valsts administrācijas skolas pakalpojumu sniegšanas kārtība valsts pārvaldes vienotā
  pakalpojumu centra ietvaros", izdoti saskaņā ar Valsts civildienesta likuma 5.¹ panta otro daļu,
  publicēti "Latvijas Vēstnesī" 12.10.2026 un stājas spēkā 13.10.2026. Valsts kanceleja valsts
  pārvaldes vienotā pakalpojumu centra ietvaros iestādēm (izņemot valsts drošības iestādes) sniedz
  cilvēkresursu pārvaldības pakalpojumus (atlase, ievadīšana darbā, nodarbinātības tiesiskās
  attiecības, darba snieguma vadība, mobilitāte) centralizētā CVP sistēmā, bet Valsts
  administrācijas skola — mācību un attīstības pakalpojumus MA sistēmā. Ministrijas un to padotības
  iestādes cilvēkresursu pārvaldības pakalpojumu sāk saņemt pakāpeniski: FM, VARAM un VM —
  01.12.2026, KM un IZM — 01.01.2027, LM, IeM, ĀM, SM un TM — 01.03.2027; AM — pēc kiberdrošības
  pārbaudes. Tiešās valsts pārvaldes iestādes mācību un attīstības pakalpojumu sāk saņemt līdz
  15.10.2026. Pašvaldības un citas institūcijas var pievienoties pēc vienošanās.
avoti:
  - url: https://www.vestnesis.lv/op/2026/196.13
    veids: vestnesis
  - url: https://likumi.lv/ta/id/371507
    veids: likumi
solijumi:
  - id: jv-kopigi-pakalpojumu-centri
    virziens: par
    pamatojums: >-
      Noteikumi normatīvi izveido kopīgu personālvadības (cilvēkresursu pārvaldības) pakalpojumu
      centru Valsts kancelejā, kam jāpievienojas visām ministrijām un to padotības iestādēm — viena
      no paplašinātajā programmā uzskaitītajām jomām.
  - id: lpv-administrativo-atbalsta-funkciju-centralizacija
    virziens: par
    pamatojums: >-
      Noteikumi centralizē valsts iestāžu cilvēkresursu pārvaldības un mācību un attīstības atbalsta
      funkcijas Valsts kancelejā un Valsts administrācijas skolā, obligāti tiešās valsts pārvaldes
      iestādēm.
piezimes: >-
  Notikuma datums — publicēšana "Latvijas Vēstnesī" (12.10.2026), jo MK noteikumi kā normatīvs
  stājas spēkā pēc publicēšanas (vertesana.md: "normatīvs pieņemts un izsludināts"); MK tos pieņēma
  06.10.2026, abi datumi Vērtēšanas periodā. Sākumstāvoklis pirms vēlēšanām: vienotā pakalpojumu
  centra grāmatvedības daļu Valsts kase sniedz kopš 2024. gada (MK 22.10.2024. noteikumi Nr. 653,
  https://likumi.lv/ta/id/355802); Valsts civildienesta likuma 5.¹ pants (spēkā no 10.04.2026)
  noteica, ka Valsts kanceleja un Valsts administrācijas skola sniedz pakalpojumus centra ietvaros;
  daļai iestāžu Valsts kanceleja un Valsts administrācijas skola jau sniedza pakalpojumus pēc
  starpresoru vienošanās (noteikumu 55.–56. p.). Noteikumus parakstījis Ministru prezidents
  A. Kulbergs (iepriekšējā valdība pēc vēlēšanām).
jautajums: >-
  lpv-administrativo-atbalsta-funkciju-centralizacija: Solījuma piezīmēs pārbaudes kritērijs ir
  binārs ("centralizētas plašāk nekā vēlēšanu dienā"), pēc kura šie noteikumi varētu dot Izpildīts;
  piedāvāts Daļēji izpildīts, jo centralizētas tikai personālvadības un mācību funkcijas (ne
  iepirkumi, IT u. c.) un pievienošanās notiek līdz 01.03.2027. Lūdzu apstiprināt Daļēji izpildīts
  vai mainīt uz Izpildīts.
