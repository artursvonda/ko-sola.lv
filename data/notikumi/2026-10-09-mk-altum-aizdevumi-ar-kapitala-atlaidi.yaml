id: 2026-10-09-mk-altum-aizdevumi-ar-kapitala-atlaidi
datums: 2026-10-09
nosaukums: MK atbalsta investīciju fonda modeli ar Altum aizdevumiem ar kapitāla atlaidi
apraksts: >-
  Ministru kabinets ar 2026. gada 9. oktobra rīkojumu Nr. 628 (prot. Nr. 57 62. §) "Par konceptuālo
  ziņojumu "Par finansējuma modeli kā fiskāli neitrālu instrumentu mērogojamu investīciju projektu
  attīstībai"" atbalstīja ziņojumā (ierobežotas pieejamības informācija) ietverto risinājuma pirmo
  modeli — investīciju fonda veidošanu, izmantojot AS "Attīstības finanšu institūcija Altum"
  aizdevumus ar kapitāla atlaidi un sasaistot tos ar produktivitātes un nodokļu atdeves rādītājiem
  projekta pēcuzraudzības periodā. Par modeļa ieviešanu atbildīga Ekonomikas ministrija. Rīkojums
  finansējuma apmēru nenosaka; publicēts "Latvijas Vēstnesī" 12.10.2026.
avoti:
  - url: https://www.vestnesis.lv/op/2026/196.32
    veids: vestnesis
solijumi:
  - id: jv-lielo-investiciju-aizdevumi-100-milj
    virziens: par
    pamatojums: >-
      MK formāli atbalsta tieši solīto instrumentu — investīciju aizdevumus ar kapitāla atlaidi (caur
      Altum) — un nosaka EM par atbildīgo par ieviešanu; solītais apjoms (100 miljoni eiro gadā) vēl
      nav piešķirts.
piezimes: >-
  Konceptuālais ziņojums ir ierobežotas pieejamības informācija, tāpēc fonda apjoms, finansējuma
  avots un atbalsta kritēriji nav zināmi. Rīkojumu parakstījuši Ministru prezidents A. Kulbergs un
  ekonomikas ministrs V. Valainis (iepriekšējā valdība pēc vēlēšanām).
jautajums: ""
