id: 2026-11-04-izsludinats-latgales-vestniecibas-gors-likums
datums: 2026-11-04
nosaukums: Izsludināts Latgales vēstniecības GORS likums
apraksts: >-
  Valsts prezidents 2026. gada 4. novembrī izsludināja 14. Saeimas 15. oktobrī pieņemto Latgales
  vēstniecības GORS likumu ("Latvijas Vēstnesis" Nr. 213). Likuma 2. panta pirmā daļa nosaka, ka
  Latgales vēstniecība GORS ir valsts, reģionālās un pašvaldības nozīmes kultūras centrs; likums nosaka tā
  pārvaldību un uzraudzību. Rēzeknes valstspilsētas pašvaldība nedrīkst atsavināt, ieķīlāt vai citādi
  apgrūtināt īpašumu Pils ielā 4, izņemot nodošanu valstij; centra darbību nodrošina pašvaldības dibināta
  kapitālsabiedrība saskaņā ar deleģēšanas līgumu, un būtiskiem lēmumiem (plānošanas dokumenti, valdes
  maiņa) nepieciešams Kultūras ministrijas saskaņojums. Likums stājas spēkā nākamajā dienā pēc
  izsludināšanas (05.11.2026).
avoti:
  - url: https://www.vestnesis.lv/op/2026/213.1
    veids: vestnesis
  - url: https://www.likumi.lv/ta/id/372069
    veids: likumi
solijumi:
  - id: jv-gors-nacionalas-nozimes-kulturas-centrs
    virziens: par
    pamatojums: >-
      Spēkā stājies likums nosaka GORS par valsts nozīmes kultūras centru ar Kultūras ministrijas
      uzraudzību — tieši Solījumā minētais iznākums (GORS kā nacionālas nozīmes kultūras centrs).
  - id: jv-unikalo-kulturtelpu-stiprinasana
    virziens: par
    pamatojums: >-
      Likums nostiprina GORS — Latgales kultūras centra — statusu un aizsargā tā īpašumu, stiprinot
      latgaliešu kultūrtelpu.
piezimes: >-
  Galīgais lasījums 15.10.2026 (1481/Lp14) — atsevišķs Notikums zarā
  notikums/2026-10-15-latgales-vestniecibas-gors-likums (PR #117, nav merge). Izsludināšanas datums
  pēc Vēstneša publikācijas ("Rīgā 2026. gada 4. novembrī"). Likumā lietots jēdziens "valsts ...
  nozīmes", Solījumā — "nacionālas nozīmes"; uzskatīti par vienu iznākumu. likumi.lv saite no Vēstneša
  lapas, nav atvērta.
jautajums: ""
