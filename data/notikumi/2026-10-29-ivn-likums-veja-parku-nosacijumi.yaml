    veids: zinas
solijumi:
  - id: pro-ietekmes-uz-sabiedribu-novertejums-projektiem
    virziens: par
    pamatojums: >-
      Vēja parku ierosinājumu noraidīšanu likums sasaista ar kumulatīvās ietekmes novērtējumu arī uz ainavu
      un iedzīvotāju dzīves kvalitāti — tieši Solījumā prasītais novērtējuma tvērums vēja parkiem; 14.
      Saeimas galīgais lasījums pirms 03.11.2026 Statusu nemaina (vertesana.md).
piezimes: >-
  Saturs pēc Saeimas preses relīzes (29.10.2026); likumprojekta numurs relīzē nav nosaukts. Pēc
  izsludināšanas jāvērtē, vai tas atbilst pro-ietekmes-uz-sabiedribu-novertejums-projektiem iznākumam
  (relīze apraksta tikai vēja parkus, ne visus lielos infrastruktūras projektus). LSM ziņa bija norāde.
