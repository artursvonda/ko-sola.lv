id: 2026-10-29-ivn-likums-veja-parku-nosacijumi
datums: 2026-10-29
nosaukums: Saeima galīgajā lasījumā pieņem grozījumus Ietekmes uz vidi novērtējuma likumā ar nosacījumiem vēja parku noraidīšanai
apraksts: >-
  14. Saeima 2026. gada 29. oktobrī trešajā, galīgajā lasījumā pieņēma grozījumus Ietekmes uz vidi
  novērtējuma likumā. Saskaņā ar Saeimas preses relīzi Valsts vides dienests nepieņems ierosinājumu, ja
  konkrētajā pašvaldībā jau būs izbūvētas vai apstiprinātas vēja elektrostacijas ar kopējo jaudu vismaz
  150 MW un kumulatīvās ietekmes novērtējums liecinās, ka jauna iekārta var būtiski negatīvi ietekmēt vidi,
  ainavu vai iedzīvotāju dzīves kvalitāti. Vēja parku projektiem bez galīgā lēmuma būs nepieciešams
  pašvaldības atzinums par atbilstību teritorijas plānojumam; par plānoto darbību informē īpašumu
  īpašniekus līdz 2 km no izpētes teritorijas. Vēja parkiem no 35 MW mazāk apdzīvotos lauku pagastos paredzēta
  vienkāršota novērtējuma kārtība. Grozījumi stāsies spēkā 2027. gada 1. janvārī. Likums vēl nav izsludināts.
