id: 2026-11-11-arhitekturas-likums
datums: 2026-11-11
nosaukums: Izsludināts Arhitektūras likums (1549/Lp14)
apraksts: >-
  Valsts prezidents 2026. gada 11. novembrī izsludināja 14. Saeimas 29. oktobrī steidzamības kārtā divos
  lasījumos pieņemto Arhitektūras likumu. Likuma mērķis ir radīt nosacījumus augstas kvalitātes
  būvkultūrai un arhitektoniski telpiskās vides un ainavas veidošanai, nodrošinot ikviena tiesības dzīvot
  labvēlīgā, klimatnoturīgā vidē un veicinot kultūras, sociālo, ekonomisko un dabas ilgtspēju (2. pants).
  Tas nosaka arhitektūras principus — funkcionāli, estētiski un tehniski kvalitatīvus risinājumus,
  telpiskās kvalitātes, kultūras vērtību, ilgtspējīgas paliekošas vērtības un sabiedrības intereses
  principu (4. pants) —, Kultūras ministrijas un pašvaldību kompetenci (tostarp pašvaldības arhitektūras
  kvalitātes politiku un sabiedrības līdzdalību dzīves vides veidošanā), arhitektūras konkursus, mākslas
  un dizaina integrēšanu publiski finansētās sabiedriski nozīmīgās publiskās ēkās (10. pants) un arhitektu
  un ainavu arhitektu profesionālo darbību un sertifikāciju. Likums stājas spēkā 2027. gada 1. janvārī,
  10. pants — 2027. gada 1. novembrī.
avoti:
  - url: https://www.vestnesis.lv/op/2026/218.1
    veids: vestnesis
  - url: https://likumi.lv/ta/id/372256-arhitekturas-likums
    veids: likumi
  - url: https://www.saeima.lv/lv/aktualitates/jaunais-arhitekturas-likums-stiprinas-kvalitativas-dzives-vides-veidosanu/
    veids: saeima
solijumi:
  - id: pro-arhitekturas-likums
    virziens: par
    pamatojums: >-
      Izsludināts solītais jaunais Arhitektūras likums; tas tieši ietver ilgtspēju (2. pants, 4. panta
      3. punkts) un estētiku un kvalitāti (4. pants), bet "Jaunais Eiropas Bauhaus" un iekļaušana nav
      nosaukti — tuvākais ir sociālā ilgtspēja, sabiedrības interese un sabiedrības līdzdalība.
  - id: jv-jauna-eiropas-bauhaus-principi
    virziens: par
    pamatojums: >-
      Likums nosaka augstas kvalitātes arhitektūru un būvkultūru kā valsts un pašvaldību politikas mērķi un
      paredz mākslas un dizaina integrēšanu publiskās ēkās — tieši solītais "augstas kvalitātes arhitektūras
      un dizaina risinājumu" virziens kultūrvidē.
piezimes: >-
  Galīgais lasījums (2.lasījums, steidzams) 14. Saeimā 29.10.2026 — Vērtēšanas periodā, bet atsevišķs
  Notikums nav pievienots (izsludināšana ir noteicošā). Vēstneša publikācija ar WebFetch neatvērās (atgrieza
  sākumlapu); laidiena 11.11.2026 Nr. 218 saturā tā ir pirmā (op/2026/218.1). Saturs pēc likumi.lv un
  Saeimas relīzes; likumprojekta numurs — no Saeimas relīzes saites uz LIVS (neatvērta).
jautajums: >-
  pro-arhitekturas-likums: Izpildīts vai Daļēji izpildīts? Solīts jauns Arhitektūras likums, "kas balstīts
  Jaunā Eiropas Bauhaus principos (ilgtspējība, iekļaušana, estētika)". Likums pieņemts un izsludināts;
  ilgtspēja un estētika tekstā ir tieši, bet iekļaušana (arī vides pieejamība, universālais dizains) un
  "Jaunais Eiropas Bauhaus" nav minēti — ir tikai sociālā ilgtspēja, sabiedrības interese un līdzdalība.
  Ja galvenais iznākums ir pats likums → Izpildīts (2026-11-11, stājas spēkā 01.01.2027); ja iekļaušana
  ir uzskaitītā daļa, kas trūkst → Daļēji izpildīts. Statuss nav mainīts, līdz redaktors izlemj.
