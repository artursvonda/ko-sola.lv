    veids: zinas
solijumi:
  - id: jv-nekustama-ipasuma-nodoklis-pasvaldibam
    virziens: par
    pamatojums: >-
      MK lēma, ka no 2029. gada pašvaldības pašas lems par NĪN likmēm un/vai nodokļa bāzes pieauguma
      ierobežojumiem, un uzdeva FM sagatavot normatīvo aktu grozījumus — solis ceļā uz paplašinātām
      pašvaldību tiesībām lemt par NĪN likmēm.
piezimes: >-
  Avots ir FM/MK relīze (24.11.2026); MK sēdes protokollēmums un TAP dokuments nav skatīti
  (tapportals.mk.gov.lv netiek atvērts — robots.txt). Relīze nenosauc grozāmo likumu (tikai
  "normatīvo aktu grozījumi"). Statusa maiņas nav: MK uzdevums sagatavot grozījumus nav ne
  likumprojekts Saeimā, ne TAP publicēts projekts (vertesana.md, Procesā).
