id: 2026-11-24-mk-pasvaldibas-lems-par-nin-no-2029
datums: 2026-11-24
nosaukums: MK lemj, ka no 2029. gada pašvaldības pašas lems par NĪN likmēm un nodokļa bāzes pieauguma ierobežojumiem
apraksts: >-
  Ministru kabinets 24.11.2026 sēdē, izskatot Finanšu ministrijas informatīvo ziņojumu "Par
  2027.–2030. gada budžeta bāzi un izdevumu pārskatīšanas rezultātiem", lēma, ka no 2029. gada
  pašvaldības savos saistošajos noteikumos lems par nekustamā īpašuma nodokļa likmēm un/vai nodokļa
  bāzes pieauguma ierobežojumiem, lai jaunās kadastrālās vērtības neradītu būtisku nodokļa
  pieaugumu iedzīvotājiem. Finanšu ministrijai līdz 2027. gada 1. martam, konsultējoties ar Latvijas
  Pašvaldību savienību, jāsagatavo normatīvo aktu grozījumi; valdībai līdz 2027. gada 15. jūnijam
  jāpilnveido kadastrālās vērtēšanas regulējums un jāapstiprina jaunā kadastrālo vērtību bāze, ko
  plānots piemērot no 2029. gada. Relīze saista izmaiņas ar plānoto jauno pašvaldību finanšu
  izlīdzināšanas modeli, kurā NĪN ieņēmumi tiktu izslēgti no izlīdzināšanas aprēķina un pilnībā
  atstāti pašvaldību rīcībā. Konkrētas likmes un ierobežojumi vēl nav noteikti.
