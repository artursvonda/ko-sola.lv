id: 2026-11-11-mk-latvenergo-strategiskais-merkis
datums: 2026-11-11
nosaukums: MK no jauna nosaka "Latvenergo" vispārējo stratēģisko mērķi un dod vispārēju atļauju iegūt līdzdalību
apraksts: >-
  Ministru kabineta 2026. gada 11. novembra rīkojums Nr. 724 (prot. Nr. 63 70. §) "Par akciju
  sabiedrības "Latvenergo" vispārējo stratēģisko mērķi un vispārēju atļauju akciju sabiedrībai
  "Latvenergo" iegūt līdzdalību vai izšķirošo ietekmi kapitālsabiedrībās", publicēts "Latvijas
  Vēstnesī" 12.11.2026 Nr. 219. 1. punkts nosaka "Latvenergo" vispārējo stratēģisko mērķi — sekmēt
  klimatneitrālas Latvijas konkurētspēju un izaugsmi un palielināt "Latvenergo" koncerna vērtību
  mājas tirgū Baltijā un ārpus tā, ilgtspējīgi, inovatīvi un ekonomiski pamatoti attīstot preces un
  pakalpojumus enerģijas un ar to saistītu biznesu vērtību ķēdēs un efektīvi pārvaldot valsts
  attīstībai un drošībai stratēģiski nozīmīgus resursus un infrastruktūru. 2.–3. punkts uz pieciem
  gadiem atļauj "Latvenergo" un tā meitas sabiedrībām iegūt līdzdalību vai izšķirošo ietekmi
  kapitālsabiedrībās ES, ES kandidātvalstīs un EEZ enerģijas ražošanas, piegādes, uzglabāšanas,
  tirdzniecības un saistītās jomās, datu centru un RIS3 jomu projektos, kā arī no tām iziet; darījumu
  vērtība nepārsniedz 15% no koncerna aktīviem, tie nedrīkst negatīvi ietekmēt vispārējās valdības
  budžeta deficitu, un Ekonomikas ministrija par tiem ziņo MK četru mēnešu laikā pēc atļaujas termiņa.
  4. punkts atzīst par spēku zaudējušu MK 09.11.2021 rīkojumu Nr. 802 "Par akciju sabiedrības
  "Latvenergo" vispārējo stratēģisko mērķi". Rīkojums stājas spēkā parakstīšanas brīdī.
avoti:
