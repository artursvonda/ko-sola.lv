    veids: vestnesis
  - url: https://www.em.gov.lv/lv/latvenergo
    veids: cits
solijumi:
  - id: lpv-energouznemumi-bez-maksimalas-pelnas-merka
    virziens: pret
    pamatojums: >-
      MK no jauna nosaka valsts enerģētikas uzņēmuma "Latvenergo" vispārējo stratēģisko mērķi ar tādu
      pašu formulējumu kā atceltajā 2021. gada rīkojumā Nr. 802 ("palielināt Latvenergo koncerna
      vērtību"), tātad mērķi nemaina un neparedz atteikšanos no peļņas vai vērtības palielināšanas
      principa (peļņa un dividendes rīkojumā nav minētas).
  - id: sv-energouznemumi-bez-pelnas
    virziens: pret
    pamatojums: >-
      MK "Latvenergo" mērķi nosaka kā koncerna vērtības palielināšanu, nemainot 2021. gada mērķi;
      zemākā cena patērētājam vai atteikšanās no peļņas mērķī nav minēta.
piezimes: >-
  Notikuma datums — pieņemšana un spēkā stāšanās (11.11.2026; MK rīkojums stājas spēkā parakstīšanas
  brīdī); publicēts "Latvijas Vēstnesī" 12.11.2026. Statusa maiņa netiek ierosināta, tāpēc
  izsludināšana kā atsevišķs Notikums nav vajadzīga. Rīkojumu parakstījuši Ministru prezidents
  A. Kulbergs (arī tieslietu ministra pienākumu izpildītājs) un ekonomikas ministrs V. Valainis.
  Salīdzinājums ar atcelto rīkojumu Nr. 802: tā tekstu likumi.lv neatvēru; Ekonomikas ministrijas lapā
  "AS "Latvenergo"" kā rīkojumā Nr. 802 noteiktais mērķis norādīts tāds pats formulējums, kāds ir
  jaunā rīkojuma 1. punktā. Akcionāra gaidu vēstulē 2027.–2031. gadam (akcionāru sapulce 17.09.2025,
  latvenergo.lv) tas pats mērķis papildināts ar finanšu mērķiem (ROE >7%, dividendes ne mazāk kā 35%
  no peļņas); jaunais rīkojums tos nemin un nemaina. Telekomunikācijas, LMT un "Tet" rīkojumā nav
  minētas.
jautajums: >-
  Vai šis Notikums tieši attiecas uz Solījumiem par "maksimālas peļņas principa" likvidēšanu
  (lpv-energouznemumi-bez-maksimalas-pelnas-merka, sv-energouznemumi-bez-pelnas)? Rīkojums ir tieši
  Solījuma piezīmēs minētais instruments (dalībnieka noteiktais stratēģiskais mērķis), bet tajā ir
  "palielināt koncerna vērtību", nevis "maksimāla peļņa". Ieteikums: atstāt ar virzienu "pret" bez
  Statusa maiņas (mērķis atjaunots nemainīts; tā nav "oficiāla atteikšanās", kas dotu Nav izpildīts),
  vai izņemt kā netiešu, ja vērtības palielināšanu neuzskata par peļņas principu. Lūdzu arī
  apstiprināt, ka rīkojuma Nr. 802 mērķa formulējums sakrīt (pārbaudīts tikai EM lapā, ne likumi.lv
  tekstā).
