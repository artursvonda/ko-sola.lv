id: 2026-10-09-valsts-sporta-fonda-likums
datums: 2026-10-09
nosaukums: Izsludināts Valsts sporta fonda likums (1380/Lp14)
apraksts: >-
  Valsts prezidents 2026. gada 9. oktobrī izsludināja 14. Saeimas 1. oktobrī steidzamības kārtā pieņemto
  Valsts sporta fonda likumu. Tas izveido Valsts sporta fondu — atvasinātu publisko tiesību juridisko
  personu izglītības un zinātnes ministra pārraudzībā, kas atklātos konkursos un mērķprogrammās finansē
  bērnu un jauniešu sportu, regulāras fiziskās aktivitātes un tautas sportu, augstu sasniegumu sportu,
  sporta infrastruktūru, sporta speciālistu izglītību, sporta organizāciju attīstību, inovācijas, kā arī
  veterānu un senioru sportu. Finansējuma avoti — valsts budžets, ziedojumi un dāvinājumi, ES un
  starptautiskie līdzekļi, saimnieciskās darbības ienākumi; konkrēta nodokļu ieņēmumu daļa fondam nav
  noteikta. Pārejas noteikumi uzliek Ministru kabinetam, sagatavojot valsts budžetu 2027. gadam un turpmāk,
  katru gadu plānot likuma mērķiem finansējumu vismaz 5 000 000 euro apmērā; MK nolikumu apstiprina līdz
  30.11.2026, fonds sāk darbību ne vēlāk kā 01.06.2027. Likums stājās spēkā 2026. gada 10. oktobrī.
avoti:
  - url: https://www.vestnesis.lv/op/2026/195.1
    veids: vestnesis
  - url: https://likumi.lv/ta/id/371488-valsts-sporta-fonda-likums
    veids: likumi
  - url: https://www.saeima.lv/lv/aktualitates/saeimas-zinas/36232-saeima-atbalsta-jauna-sporta-finansesanas-instrumenta-izveidi
    veids: saeima
solijumi:
  - id: sv-valsts-atbalsta-sportam-palielinasana
    virziens: par
    pamatojums: >-
      Likums uzliek MK no 2027. gada budžeta katru gadu plānot vismaz 5 milj. euro sporta fonda mērķiem,
      tostarp sporta infrastruktūrai, — formāls solis valsts atbalsta sportam palielināšanai, bet pats
      pieaugums vēl jānodrošina budžeta likumā.
  - id: pro-sporta-fonda-nodoklu-ienemumi
    virziens: par
    pamatojums: >-
      Izveido Solījumā minēto valsts sporta fondu, taču nenosaka tam nekādu nodokļu ieņēmumu daļu (ne 3%
      no alkohola, tabakas, izložu un azartspēļu nodokļiem); VKKF finansējumu likums neskar.
  - id: as-sporta-infrastrukturas-finansesana
    virziens: par
    pamatojums: >-
      Izveido pastāvīgu sporta finansēšanas instrumentu ar sporta infrastruktūru kā vienu no prioritātēm
      un likumā noteiktu minimālo ikgadējo finansējumu.
  - id: as-tautas-sporta-paplasinasana
    virziens: par
    pamatojums: Tautas sports un regulāras fiziskās aktivitātes ir viena no likumā noteiktajām fonda atbalsta prioritātēm.
  - id: lpv-tautas-sporta-atbalsts
    virziens: par
    pamatojums: Tautas sports un regulāras fiziskās aktivitātes ir viena no likumā noteiktajām fonda atbalsta prioritātēm.
  - id: jv-sporta-un-kustiga-dzivesveida-atbalsts
    virziens: par
    pamatojums: >-
      Fonda prioritātes ir bērnu un jauniešu sports, regulāras fiziskās aktivitātes un tautas sports, kā
      arī senioru sports.
piezimes: >-
  Galīgais lasījums (2.lasījums, steidzams) 14. Saeimā 01.10.2026 — pirms vēlēšanām, atsevišķs Notikums nav
  pievienots. Vēstneša publikācija nav atvērta (Crawl-delay); saturs pēc likumi.lv un Saeimas relīzes.
jautajums: >-
  pro-sporta-fonda-nodoklu-ienemumi: vai fonda izveide bez nodokļu ieņēmumu piesaistes ir formāls solis
  (Procesā), vai tikai priekšnoteikums (Statuss paliek Nav vērtēts)? Melnrakstā Statuss nav mainīts.
