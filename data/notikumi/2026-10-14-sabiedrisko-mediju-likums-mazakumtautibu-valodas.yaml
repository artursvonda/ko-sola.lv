id: 2026-10-14-sabiedrisko-mediju-likums-mazakumtautibu-valodas
datums: 2026-10-14
nosaukums: Izsludināti sabiedrisko mediju likuma grozījumi, kas ierobežo saturu mazākumtautību valodās
apraksts: >-
  Valsts prezidents 2026. gada 14. oktobrī izsludināja 14. Saeimas 1. oktobrī pieņemtos grozījumus
  Sabiedrisko elektronisko plašsaziņas līdzekļu un to pārvaldības likumā ("Latvijas Vēstnesis" Nr. 198).
  Līdzšinējais 3. panta 7. punkts noteica, ka sabiedriskie mediji veido raidījumus, to fragmentus un
  citus pakalpojumus mazākumtautību valodās; jaunajā redakcijā sabiedriskie mediji, ievērojot
  samērīgumu, var veidot mazākumtautību valodās saturu, kas nav pašpietiekams, piederības Latvijai un
  sabiedrības integrācijas veicināšanai. Pašpietiekamu saturu mazākumtautību valodās drīkst veidot
  vienīgi izņēmuma gadījumos — ārkārtējā situācijā, izņēmuma stāvoklī vai acīmredzami nepatiesas,
  demokrātiju un valsti apdraudošas informācijas atspēkošanai (7.¹ punkts), ņemot vērā valsts drošības
  apdraudējuma intensitāti un raksturu (7.² punkts). 8. panta ceturtā daļa: ja Latvijas Sabiedriskais
  medijs veido vairākas programmas, daļu vienas radio un vienas televīzijas programmas raidlaika var
  veltīt saturam svešvalodās, arī mazākumtautību valodās (tajā skaitā filmām, seriāliem un izrādēm ar
  subtitriem latviešu valodā), ievērojot 3. panta 7., 7.¹ un 7.² punktu; 8. panta trešā daļa pieļauj
  mākslinieciskās izteiksmes līdzekļus svešvalodās. Grozījumi stājas spēkā 2027. gada 1. janvārī.
