solijumi:
  - id: na-sabiedriskie-mediji-neatkarigs-avots
    virziens: par
    pamatojums: >-
      Likums sašaurina sabiedrisko mediju saturu mazākumtautību valodās (pienākums aizstāts ar tiesībām
      veidot tikai ne-pašpietiekamu saturu, pašpietiekamu — tikai izņēmuma gadījumos), tādējādi
      nostiprinot sabiedriskos medijus kā informācijas avotu latviešu valodā.
  - id: sv-mazakumtautibu-valodu-kulturu-saglabasana
    virziens: pret
    pamatojums: >-
      Likums atceļ sabiedrisko mediju pienākumu veidot saturu mazākumtautību valodās un pašpietiekamu
      saturu šajās valodās atļauj tikai izņēmuma gadījumos, mazinot mazākumtautību valodu klātbūtni
      sabiedriskajos medijos.
piezimes: >-
  Notikuma datums — izsludināšana "Latvijas Vēstnesī" (14.10.2026); Saeima likumu pieņēma
  01.10.2026 (pirms vēlēšanām); izsludināšana ir Vērtēšanas periodā; likums stājas spēkā 01.01.2027. Abi iekļautie Solījumi
  ir Nepārbaudāmi — Statusa maiņu nav. Iepriekšējā 3. panta 7. punkta redakcija ("veido raidījumus …
  mazākumtautību valodās") — konsolidētajā likuma tekstā https://likumi.lv/ta/id/319096. Likumprojekta
  numurs (…/Lp14) un galīgā lasījuma balsojums šajā Notikumā nav norādīti (izsludināšanas Notikums).
