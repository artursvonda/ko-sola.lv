solijumi:
  - id: lpv-latgales-drosiba-un-attistiba
    virziens: par
    pamatojums: >-
      Likums ar mērķi stiprināt drošību un labklājību izveido īpašu tiesisko regulējumu, finansiālā
      atbalsta prioritāti un atbalsta fondu austrumu teritorijai, kurā ietilpst visi Latgales novadi un
      valstspilsētas.
piezimes: >-
  Galīgais lasījums 14. Saeimā 29.10.2026 (pēc vēlēšanām) — atsevišķs Notikums nav pievienots; balsojums
  izsludināšanas Notikumam nav vajadzīgs. Likumprojekta numurs 1426/Lp14 pēc lvportals.lv ziņas saites uz
  Saeimas likumprojektu (LIVS nav atvērts). likumi.lv konsolidētā redakcija meklēšanā vēl nebija atrodama;
  saturs pēc Latvijas Vēstneša publikācijas.
