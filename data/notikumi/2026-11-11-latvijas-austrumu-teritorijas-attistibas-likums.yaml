id: 2026-11-11-latvijas-austrumu-teritorijas-attistibas-likums
datums: 2026-11-11
nosaukums: Izsludināts Latvijas austrumu teritorijas attīstības likums (1426/Lp14)
apraksts: >-
  Valsts prezidents 2026. gada 11. novembrī izsludināja 14. Saeimas 29. oktobrī pieņemto Latvijas
  austrumu teritorijas attīstības likumu. Tā mērķis ir stiprināt Latvijas austrumu teritorijas noturību,
  iedzīvotāju noturēšanu, drošību un labklājību ar īpašu tiesisko regulējumu, attīstības principiem un
  finansiālu atbalstu. Austrumu teritorija ir Alūksnes, Augšdaugavas, Balvu, Gulbenes, Jēkabpils,
  Krāslavas, Līvānu, Ludzas, Madonas, Preiļu, Rēzeknes, Smiltenes un Valkas novads, Daugavpils un
  Rēzekne. Likums paredz pašvaldībām prioritāru piekļuvi ES un ārvalstu finanšu instrumentiem noteiktās
  jomās (transports un mobilitāte, izglītība, uzņēmējdarbība un investīcijas, enerģētika un digitālā
  infrastruktūra, kultūra u. c.) un paaugstinātu atbalsta intensitāti bez noteiktiem apmēriem; kā
  programmēšanas principu min īpašu nodokļu politiku, bet konkrētus nodokļu atvieglojumus nenosaka.
  Izveido valsts budžeta programmu "Latvijas austrumu teritorijas attīstības atbalsta fonds" (apmēru
  nosaka ikgadējais budžeta likums, kritērijus — MK) un tematisko komiteju pie MK; MK ik trīs gadus
  apstiprina attīstības programmu un ziņo Saeimai. Pārejas noteikumi: fonds sāk darbību 01.05.2027,
  MK noteikumi — līdz 30.04.2027, pirmais ziņojums Saeimai — līdz 30.09.2029; komiteja uzrauga rīcības
  plānu Latvijas austrumu pierobežas ekonomiskajai izaugsmei un drošības stiprināšanai 2025.–2027. gadam.
  Likums stājas spēkā 2026. gada 12. novembrī.
