id: 2026-10-28-mk-autobusu-reisi-krievija-baltkrievija
datums: 2026-10-28
nosaukums: MK aizliedz neregulāros starptautiskos autobusu reisus pāri robežai ar Krieviju un Baltkrieviju
apraksts: >-
  Ar Ministru kabineta 2026. gada 28. oktobra rīkojumu Nr. 683 (prot. Nr. 60 13. §), publicētu "Latvijas
  Vēstnesī" 29.10.2026 (Nr. 209), no 01.11.2026 līdz 31.10.2027 visiem pārvadātājiem neatkarīgi no
  uzņēmuma vai transportlīdzekļa reģistrācijas valsts aizliegts veikt starptautiskos neregulāros
  pasažieru pārvadājumus ar autobusiem, šķērsojot Latvijas–Baltkrievijas un Latvijas–Krievijas robežu
  Pāternieku, Grebņevas un Terehovas robežšķērsošanas vietās. Rīkojumā kā iemesls minēti nacionālās
  drošības riski: organizētos grupu braucienos uz Baltkrieviju un Krieviju dalībnieki tiek pakļauti
  izlūkošanai un vervēšanai. Rīkojums izdots saskaņā ar Valsts robežas likuma 8. panta pirmo daļu un
  Nacionālās drošības likuma 3. panta otrās daļas 1. punktu un 10. panta otrās daļas 2. punktu.
avoti:
  - url: https://www.vestnesis.lv/op/2026/209.13
    veids: vestnesis
solijumi:
  - id: jv-versanas-pret-krievijas-hibridapdraudejumiem
    virziens: par
    pamatojums: >-
      Rīkojums ir valsts drošības pasākums, kas tieši vērsts pret Krievijas un Baltkrievijas izlūkošanas
      un vervēšanas risku organizētos grupu braucienos, — vēršanās pret Krievijas īstenotiem
      apdraudējumiem valsts un sabiedrības drošībai.
piezimes: >-
  Notikuma datums — rīkojuma pieņemšana (28.10.2026), Vērtēšanas periodā; publicēts 29.10.2026, spēkā no
  01.11.2026 līdz 31.10.2027. Rīkojumā nav lietots vārds "hibrīdapdraudējumi"; sasaiste ar Solījumu —
  pēc rīkojumā minētā iemesla (izlūkošana un vervēšana). Solījums ir Nepārbaudāms — Statusa maiņas nav.
  Rīkojumu pieņēmusi iepriekšējā valdība pēc vēlēšanām. Vai tas aizstāj vai pagarina agrāku līdzīgu aizliegumu, avotā nav norādīts.
jautajums: ""
