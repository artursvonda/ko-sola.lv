solijumi:
  - id: jv-gors-nacionalas-nozimes-kulturas-centrs
    virziens: par
    pamatojums: >-
      Likums nosaka GORS kā aizsargātu valsts, reģionālās un pašvaldības nozīmes kultūras centru Kultūras
      ministrijas uzraudzībā ar mērķi saglabāt Latgales kultūrtelpu — tieši Solījuma iznākums, bet 14. Saeimas
      galīgais lasījums Vērtēšanas periodā pirms 03.11.2026 Statusu nemaina (Izpildīts var dot izsludināšana).
  - id: jv-unikalo-kulturtelpu-stiprinasana
    virziens: par
    pamatojums: >-
      Likumā noteiktais GORS darbības mērķis ir Latgales kultūrvēsturiskās vides un kultūrtelpas saglabāšana
      un ilgtspējīga attīstība.
piezimes: >-
  Saturs pēc Saeimas preses relīzes; LIVS (titania.saeima.lv) nav atvērts (robots.txt). Likums vēl nav
