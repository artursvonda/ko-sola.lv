id: 2026-10-15-latgales-vestniecibas-gors-likums
datums: 2026-10-15
nosaukums: Saeima galīgajā lasījumā pieņem Latgales vēstniecības GORS likumu (1481/Lp14)
apraksts: >-
  14. Saeima 2026. gada 15. oktobrī galīgajā lasījumā pieņēma Latgales vēstniecības GORS likumu. Likums
  paredz īpaši aizsargāt koncertzāli GORS kā nozīmīgu valsts, reģionālās un pašvaldības nozīmes kultūras
  centru un nodrošināt tās darbības nepārtrauktību; tās darbības mērķis ir sekmēt Latgales identitātes,
  kultūrvēsturiskās vides un kultūrtelpas saglabāšanu un ilgtspējīgu attīstību un profesionālās mākslas
  pieejamību Latgalē. GORS paliek Rēzeknes pašvaldības pārziņā, bet būtiskos pārvaldības jautājumos
  nepieciešams Kultūras ministrijas saskaņojums; ministrija uzrauga GORS darbību, saskaņo tā stratēģiju,
  darbības plānu un budžeta projektu un varēs deleģēt pārvaldniekam valsts pārvaldes uzdevumus kultūras
  jomā, tostarp latgaliešu rakstu valodas un latgaliskās identitātes saglabāšanā. Pašvaldība nedrīkst
  atsavināt, ieķīlāt vai citādi apgrūtināt GORS ēku un tai nepieciešamo zemi. Likums stāsies spēkā nākamajā
  dienā pēc izsludināšanas.
