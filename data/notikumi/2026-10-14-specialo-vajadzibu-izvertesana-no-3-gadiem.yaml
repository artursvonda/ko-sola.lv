solijumi:
  - id: jv-baasik-agrina-atbalsta-sistema
    virziens: par
    pamatojums: >-
      Likumā nostiprina agrīnās attīstības izvērtēšanu (no dzimšanas pie ģimenes ārsta, speciālās vajadzības no
      triju gadu vecuma pirmsskolā) ar atbalsta pasākumiem un informācijas sistēmu, kā arī izmēģinājumprojektu ar
      bērnu attīstības multiprofesionālajām komandām — Solījumā minētās agrīna atbalsta sistēmas pamatelementi.
  - id: as-agrina-bernu-vajadzibu-diagnostika
    virziens: par
    pamatojums: >-
      Izglītības iestādēm uzliek izvērtēt bērnu speciālās vajadzības jau no triju gadu vecuma (līdz šim — uzsākot
      obligāto pirmsskolas izglītību), tātad agrīnāk.
piezimes: >-
  Viens Notikums ar pieciem avotiem: likumi pieņemti vienā Saeimas sēdē, izsludināti vienā Vēstneša laidienā,
  savstarpēji saistīti (Bērnu tiesību aizsardzības likuma pārejas noteikumu 61. punkts piemēro visu piecu likumu
  normas izmēģinājumprojektā kā vienotu regulējumu). Galīgais lasījums 14. Saeimā 01.10.2026 — pirms vēlēšanām,
  atsevišķs Notikums nav pievienots. Vispārējās izglītības likuma pārejas noteikumu 64. punkts: Valsts kanceleja
  līdz 31.03.2027 nodrošina pedagogu kompetences pilnveides programmu "bērna spēju un prasmju testa" izmantošanai.
jautajums: >-
  jv-baasik-agrina-atbalsta-sistema: Statuss nav mainīts. CVK citātā mēra nav; paplašinātās programmas 5. nodaļa
  sola "agrīna atbalsta sistēmu … balstītu savlaicīgā izvērtēšanā, agrīnā intervencē un speciālistu komandas
  atbalstā". Izvērtēšana un atbalsta pasākumi likumā noteikti obligāti (spēkā no 01.07.2028; robežgadījums
  "Pieņemts, bet stājas spēkā vēlāk"), bet multiprofesionālās komandas — tikai izmēģinājumprojektā, pašvaldībām
  "var izveidot", turpinājums atkarīgs no MK ziņojuma 2030. gadā. Vai tas ir Izpildīts, Daļēji izpildīts (komandas
  nav pastāvīgi noteiktas) vai Procesā (likums nosaka arī jaunus MK noteikumus un izmēģinājumprojektu)?
