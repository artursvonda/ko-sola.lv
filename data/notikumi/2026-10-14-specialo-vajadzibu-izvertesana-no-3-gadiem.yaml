id: 2026-10-14-specialo-vajadzibu-izvertesana-no-3-gadiem
datums: 2026-10-14
nosaukums: Izsludināta likumu pakete par bērnu speciālo vajadzību izvērtēšanu no triju gadu vecuma
apraksts: >-
  Valsts prezidents 2026. gada 14. oktobrī izsludināja piecus 14. Saeimas 1. oktobrī pieņemtus likumus par bērnu
  attīstības vajadzību agrīnu izvērtēšanu. Grozījumi Bērnu tiesību aizsardzības likumā uzliek valstij un pašvaldībai
  nodrošināt speciālo vajadzību izvērtējumu bērniem no triju gadu vecuma ar individuāliem pedagoģiskā un
  psiholoģiskā atbalsta pasākumiem, kā arī agrīnu attīstības izvērtējumu no dzimšanas līdz pirmsskolas programmas
  apguvei (pie ģimenes ārsta profilaktiskās apskates ietvaros), un izveido Vienoto risku analīzes un vadības
  informācijas sistēmu bērnu attīstības vajadzību atbalstam. Grozījumi Vispārējās izglītības likumā (jauns 26.¹
  pants) un Starptautisko skolu likumā uzliek izglītības iestādēm izvērtēt speciālās vajadzības pirmsskolas
  izglītojamiem no triju gadu vecuma pēc MK metodikas un nodrošināt atbalsta pasākumus; Izglītības likumā izslēgta
  līdzšinējā norma par izvērtēšanu, uzsākot obligāto pirmsskolas izglītību (30. p. 3.⁴ daļa); Pacientu tiesību
  likums atļauj izmantot pacienta datus bērna attīstības risku savlaicīgai identificēšanai. Pamatnormas stājas
  spēkā (piemērojamas) 2028. gada 1. jūlijā. No 2026. gada 1. decembra līdz 2029. gada 31. decembrim pašvaldības
  sadarbībā ar Valsts kanceleju īsteno izmēģinājumprojektu: agrīnās attīstības izvērtēšanas metodikas ieviešana
  (līdz 30.06.2028; dalībniekiem jaunās normas piemēro jau no 01.12.2026) un bērnu attīstības multiprofesionālo
  komandu izveide (no 01.02.2027; pašvaldības "var izveidot"). MK līdz 30.11.2026 izdod informācijas sistēmas
  noteikumus un metodiku, līdz 31.01.2027 — prasības multiprofesionālajām komandām; ziņojumi Saeimai līdz
  31.01.2028 un 31.03.2030.
