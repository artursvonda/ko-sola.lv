id: 2026-10-16-specializeto-audzugimenu-atbalsts-veselibas-apdrosinasana
datums: 2026-10-16
nosaukums: MK noteikumi par veselības apdrošināšanu un jaunu specializāciju specializētajām audžuģimenēm
apraksts: >-
  Ministru kabineta 2026. gada 13. oktobra noteikumi Nr. 621 (prot. Nr. 58 18. §) "Grozījumi Ministru
  kabineta 2018. gada 26. jūnija noteikumos Nr. 354 "Audžuģimenes noteikumi"" un Nr. 620 (prot. Nr. 58
  17. §) "Grozījumi Ministru kabineta 2018. gada 26. jūnija noteikumos Nr. 355 "Ārpusģimenes aprūpes
  atbalsta centra noteikumi"", publicēti "Latvijas Vēstnesī" 16.10.2026. Specializētās audžuģimenes
  papildus līdzšinējam atbalstam saņem veselības apdrošināšanas karti (ja tajā ievietots bērns vai
  kopš bērna uzturēšanās izbeigšanas nav pagājuši vairāk kā seši mēneši) un kompensāciju par gadam
  iegādātu civiltiesiskās atbildības apdrošināšanu ne vairāk kā 70 euro apmērā (ja iegādes dienā
  audžuģimenē ievietots bērns). Ieviests jauns specializācijas veids — audžuģimene bērnam ar uzvedības
  traucējumiem vai atkarību problēmām (bērniem no 11 gadu vecuma) — ar tādu pašu atlīdzības formulu
  kā audžuģimenei bērnam ar smagiem funkcionāliem traucējumiem (divas minimālās mēneša algas mēnesī
  proporcionāli dienām) un bāriņtiesas organizētu starpinstitūciju sanāksmi pirms bērna ievietošanas.
  Bērnu aizsardzības centrs iepērk veselības apdrošināšanu atbalsta centru vajadzībām; atbalsta
  centri slēdz apdrošināšanas līgumu, izsniedz kartes un izmaksā kompensāciju. Atlīdzības apmērs
  līdzšinējiem specializācijas veidiem un atbalsts audžuģimenēm bez specializācijas nemainās.
