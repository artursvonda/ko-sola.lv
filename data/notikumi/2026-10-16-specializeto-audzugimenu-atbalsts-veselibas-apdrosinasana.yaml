solijumi:
  - id: pro-atbalsts-audzugimenem
    virziens: par
    pamatojums: >-
      Specializētajām audžuģimenēm noteikti divi jauni atbalsta veidi — veselības apdrošināšana un
      kompensācija par civiltiesiskās atbildības apdrošināšanu līdz 70 euro —, tātad atbalsts
      specializētajām audžuģimenēm palielināts; audžuģimenēm bez specializācijas atbalsts nemainās.
  - id: pro-latvija-bez-bernu-namiem
    virziens: par
    pamatojums: >-
      Jauns specializētās audžuģimenes veids bērniem ar uzvedības traucējumiem vai atkarību problēmām
      un papildu atbalsts specializētajām audžuģimenēm paplašina ģimenisku ārpusģimenes aprūpi bērniem
      ar īpašām vajadzībām.
piezimes: >-
  Viens Notikums ar abiem noteikumiem: pieņemti vienā MK sēdē (prot. Nr. 58 17. un 18. §), publicēti
  vienā laidienā un ir viena izmaiņu kopuma daļas — Nr. 621 nosaka specializēto audžuģimeņu tiesības uz
  veselības apdrošināšanu un kompensāciju, Nr. 620 — kā to iepērk Bērnu aizsardzības centrs un
  nodrošina atbalsta centri. Notikuma datums — publicēšana "Latvijas Vēstnesī" (16.10.2026); MK
  noteikumi stājas spēkā nākamajā dienā (17.10.2026). Faktiska veselības apdrošināšanas karšu
  izsniegšana atkarīga no Bērnu aizsardzības centra iepirkuma (Nr. 620 4.1, 12.11.1, 31. p.). Nr. 621
  87.1 punkts nosaka, ka atlīdzībā par specializētās audžuģimenes pienākumiem "tiek ietverti arī
  atbalsta centra izdevumi par veselības apdrošināšanas prēmiju maksājumiem"; atlīdzības formulas
  (87.1., 87.2. apakšp.) nemainās. Noteikumus parakstījis Ministru prezidents A. Kulbergs (iepriekšējā
  valdība pēc vēlēšanām).
jautajums: >-
  pro-atbalsts-audzugimenem (Pārbaudāms, Nav vērtēts): vai šis Notikums dod Daļēji izpildīts (atbalsts
  palielināts specializētajām audžuģimenēm — veselības apdrošināšana un kompensācija līdz 70 euro —,
  bet ne audžuģimenēm bez specializācijas; atlīdzība un pabalsti nemainās), Izpildīts (Solījumā nav
  mēra — jebkurš palielinājums), vai Statuss paliek, līdz palielina atbalstu arī audžuģimenēm? Papildus:
  vai 87.1 punkts ("atlīdzībā … tiek ietverti arī … izdevumi par veselības apdrošināšanas prēmiju
  maksājumiem") nozīmē, ka prēmija tiek segta no izmaksājamās atlīdzības (tad jaunais atbalsts mazāks),
  vai tikai finansējuma uzskaiti — anotācija TAP nav pārbaudīta. Statuss nav mainīts.
