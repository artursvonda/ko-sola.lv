id: 2026-11-12-mk-daudzdzivoklu-eku-atjaunosanas-atbalsta-programma
datums: 2026-11-12
nosaukums: MK noteikumi par daudzdzīvokļu māju energoefektivitātes atbalsta programmu procentu likmes subsīdiju veidā
apraksts: >-
  Ministru kabineta 2026. gada 10. novembra noteikumi Nr. 678 (prot. Nr. 63 32. §) "Noteikumi par
  energoefektivitātes paaugstināšanas pasākumu īstenošanu daudzdzīvokļu dzīvojamās mājās atbalsta
  programmas procentu likmes subsīdiju veidā", publicēti "Latvijas Vēstnesī" 12.11.2026 (Nr. 219).
  Programmu administrē AS "Attīstības finanšu institūcija Altum"; mērķgrupa — dzīvokļu īpašnieki
  mājās ar diviem vai vairāk dzīvokļiem, projektam jāsasniedz vismaz 30 % primārās enerģijas
  ietaupījums. Atbalsts: procentu likmes subsīdija līdz 20 gadiem — 1,6 procentpunkti gadā, 1,8
  procentpunkti kvartālā esošām mājām vai Latgales plānošanas reģionā, 2 procentpunkti, ja izmanto
  rūpnieciski ražotus koka karkasa paneļus (piemēro lielāko); un garantija, kas sedz līdz 80 % no
  cita finansētāja aizdevuma attiecināmajām izmaksām, līdz 5 600 000 euro projektam. Attiecināmi arī
  vides un informācijas pieejamības pasākumi, ja tie tehniski un funkcionāli saistīti ar projektu.
  Finansējums — programmai pieejamais Eiropas Savienības kohēzijas politikas programmas 2021.–2027.
  gadam finanšu instrumentu finansējums un atmaksātais 2014.–2020. gada plānošanas perioda publiskais
  finansējums (līdz 6 695 000 euro no 2025. gada, līdz 3 644 000 euro 2026.–2028. gadā, līdz
  23 960 000 euro 2029.–2042. gadā); finansējumu iegulda un lēmumus pieņem līdz 31.12.2030.
