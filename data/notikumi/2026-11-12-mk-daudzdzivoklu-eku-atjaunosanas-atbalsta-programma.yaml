    veids: mk
  - url: https://www.lsm.lv/raksts/zinas/ekonomika/10.11.2026-apstiprina-jauno-atbalsta-programmu-daudzdzivoklu-dzivojamo-eku-energoefektivitates-paaugstinasanai.a671362/
    veids: zinas
solijumi:
  - id: jv-privatais-finansejums-energoefektivitatei
    virziens: par
    pamatojums: >-
      Noteikumi izveido jaunus finanšu un riska mazināšanas rīkus energoefektivitātes pasākumiem —
      procentu likmes subsīdiju un Altum garantiju līdz 80 % no cita finansētāja aizdevuma.
  - id: pro-majoklu-buvniecibas-un-renovacijas-programmas
    virziens: par
    pamatojums: >-
      Noteikumi izveido valsts programmu esošo daudzdzīvokļu māju atjaunošanai energoefektivitātei ar
      paaugstinātu subsīdiju Latgales plānošanas reģionā; jaunu mājokļu būvniecību tie neaptver.
  - id: jv-paplasinats-atbalsts-eku-atjaunosanai
    virziens: par
    pamatojums: >-
      Noteikumi ievieš jaunu valsts atbalsta veidu daudzdzīvokļu māju atjaunošanai (procentu likmes
      subsīdija un garantija) ar papildu finansējumu.
  - id: na-atbalsts-eku-renovacijai
    virziens: par
    pamatojums: >-
      Noteikumi ievieš jaunu atbalstu daudzdzīvokļu māju renovācijai, kas sasniedz vismaz 30 %
      primārās enerģijas ietaupījumu.
piezimes: >-
  Notikuma datums — publicēšana "Latvijas Vēstnesī" (12.11.2026), jo MK noteikumi stājas spēkā
  nākamajā dienā pēc izsludināšanas (13.11.2026; noteikumos cits termiņš nav noteikts, izmaksas
  attiecināmas no spēkā stāšanās dienas, 9. p.); MK tos pieņēma 10.11.2026, abi datumi Vērtēšanas
  periodā. Pēc MK paziņojuma atbalsts būs pieejams no 04.01.2027, vispirms uzaicinot pieteicējus,
  kuru projekti jau ir esošās (ES fondu grantu) programmas rindā, un līdzšinējais grantu modelis
  "lielā mērā izsmēlis" savu potenciālu; paziņojumā minēti 14,4 milj. EUR no ES fondu 2021.–2027.
  gada plānošanas perioda un līdz 34,3 milj. EUR atgūstamā publiskā finansējuma līdz 2042. gadam
  (atbalsts vismaz 9000 mājsaimniecībām). Noteikumu tekstā ES fondu 2021.–2027. gada summa nav
  norādīta (6.1. p. atsaucas uz citu normatīvo aktu). Noteikumi liftus un pandusus atsevišķi nemin;
  tajos nav normu par citu noteikumu atzīšanu par spēku zaudējušiem. Noteikumus parakstījuši Ministru
  prezidents, tieslietu ministra pienākumu izpildītājs A. Kulbergs un ekonomikas ministrs V. Valainis.
jautajums: >-
  jv-paplasinats-atbalsts-eku-atjaunosanai un na-atbalsts-eku-renovacijai: Statuss nav mainīts. Vai
  procentu likmes subsīdiju programma paplašina valsts atbalstu ēku atjaunošanai (papildina esošo ES
  fondu grantu programmu) vai to aizstāj, jo MK paziņojumā grantu modelis raksturots kā "lielā mērā
  izsmēlis" savu potenciālu un pirmie uzaicināti grantu rindas projekti? Ja paplašina — Izpildīts
  (izsludināts normatīvs); ja aizstāj — Statuss nemainās.
