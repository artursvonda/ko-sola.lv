id: 2026-10-30-ilgtspejas-informacijas-atklasanas-likums
datums: 2026-10-30
nosaukums: Izsludināti grozījumi Ilgtspējas informācijas atklāšanas likumā — augstāki ziņošanas sliekšņi
apraksts: >-
  "Latvijas Vēstnesī" 2026. gada 30. oktobrī (Nr. 210) izsludināti 14. Saeimas 22. oktobrī pieņemtie
  grozījumi Ilgtspējas informācijas atklāšanas likumā. Tie paaugstina sliekšņus uzņēmumiem, kam jāatklāj
  ilgtspējas informācija (3. pantā — neto apgrozījums virs 450 000 000 euro un vidēji vairāk nekā 1000
  darbinieku; citos punktos sliekšņi paaugstināti līdz 200 un 450 miljoniem euro). Jaunais 4.1 pants nosaka
  "aizsargātās sabiedrības" — vērtību ķēdes uzņēmumus ar ne vairāk kā 1000 darbiniekiem —, kas drīkst
  atteikties sniegt informāciju, kura pārsniedz Komisijas deleģētajā regulā (ES) 2026/1560 noteiktos
  brīvprātīgos standartus; līguma noteikumi, kas to paredz, šajā daļā nav spēkā. Grozījumi paredz arī
  izņēmumus komercnoslēpuma un citas aizsargātas informācijas atklāšanai un atvieglojumus grupām.
avoti:
  - url: https://www.vestnesis.lv/op/2026/210.4
    veids: vestnesis
solijumi:
  - id: jv-administrativa-sloga-samazinasana
    virziens: par
    pamatojums: >-
      Grozījumi samazina ilgtspējas ziņošanas pienākumu loku (augstāki sliekšņi) un ļauj uzņēmumiem ar ne
      vairāk kā 1000 darbiniekiem atteikties no vērtību ķēdes informācijas prasībām virs brīvprātīgajiem
      standartiem — administratīvā sloga samazinājums uzņēmumiem.
piezimes: >-
  Spēkā stāšanās datums vestnesis.lv lapas tekstā nebija redzams (teksts ielādējās līdz 7. pantam; PDF un
  likumi.lv — robots.txt). Solījums ir Nepārbaudāms — Statusa maiņas nav. Avotā nav norādīts, ka tā ir ES
  regulējuma vienkāršošanas (Omnibus) transponēšana, un nav minēti mazie un vidējie uzņēmumi vai "Zaļais
  kurss".
jautajums: ""
