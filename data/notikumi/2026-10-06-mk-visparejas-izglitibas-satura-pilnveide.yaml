    veids: zinas
solijumi:
  - id: na-gimenes-veselibas-maciba
    virziens: par
    pamatojums: >-
      MK uzdod VIAA ģimenes veselības mācības satura izstrādi un ieviešanu skolās ar termiņiem
      (modulis līdz 30.04.2027, ieviešana no 01.09.2027, pilnīga — no 01.09.2028).
  - id: jv-veselibas-macibas-pilnveide-skolas
    virziens: par
    pamatojums: >-
      MK uzdod izstrādāt veselībpratības saturu skolām, konsultējoties ar VM un veselības nozari;
      ziņojuma moduļa tematiskie bloki (ģimene, identitāte, attiecības, pubertāte) tieši nenosauc
      solītās tēmas (uzturs, atkarības, pirmā palīdzība, skrīnings).
  - id: na-vestures-un-valstiskas-audzinasanas-saturs
    virziens: par
    pamatojums: >-
      MK uzdod turpināt Latvijas vēstures satura stiprināšanu, no 01.09.2027 noteikt aktualizētos
      vēstures programmu paraugus par valsts noteiktajiem un rosināt vēsturi kā patstāvīgu priekšmetu
      4.–6. klasē.
  - id: sv-gimenes-vertibu-popularizesana
    virziens: par
    pamatojums: >-
      MK uzdod izstrādāt ģimenes vērtību un veselībpratības moduli vispārējās izglītības saturā.
  - id: jv-macibu-lidzekli-un-gramata-katra-prieksmeta
    virziens: par
    pamatojums: >-
      MK uzdod IZM līdz 31.03.2027 izstrādāt priekšlikumus valsts iesaistei mācību līdzekļu, arī
      mācību grāmatu, izstrādē un pieejamībā, lai katram skolēnam būtu nepieciešamie mācību līdzekļi.
  - id: lpv-bazes-macibu-lidzekli-visos-prieksmetos
    virziens: par
    pamatojums: >-
      MK uzdod IZM līdz 31.03.2027 izstrādāt priekšlikumus valsts iesaistei mācību līdzekļu, arī
      mācību grāmatu, izstrādē un pieejamībā, lai katram skolēnam būtu nepieciešamie mācību līdzekļi.
  - id: sv-pilnvertigi-macibu-materiali
    virziens: par
    pamatojums: >-
      MK uzdod izstrādāt priekšlikumus mācību līdzekļu un metodiskā atbalsta materiālu nodrošināšanai
      un aprēķināt tiem nepieciešamo papildu finansējumu.
  - id: as-skola2030-pilnveide
    virziens: par
    pamatojums: >-
      MK atbalsta vispārējās izglītības satura pilnveidi esošo valsts izglītības standartu struktūrā
      (ziņojumā — "skola2030 pārskatīšana") un aktualizēto programmu paraugu noteikšanu par valsts
      noteiktajiem no 01.09.2027.
  - id: sv-skola2030-reformu-atcelsana
    virziens: pret
    pamatojums: >-
      MK izvēlas saturu pilnveidot, ievērojot esošo valsts izglītības standartu struktūru un
      pamatprincipus, nevis atcelt Skola2030; atcelšanas ceļš paliek atvērts, tāpēc Statuss nemainās.
piezimes: >-
  "Latvijas Vēstnesī" 12.10.2026 publicēts Ministru kabineta sēdes protokols (op/2026/196.34), kas,
  iespējams, ir šis protokols — nav pārbaudīts (vestnesis.lv nav atvērts), tāpēc avotos nav. Ziņojumā
  ģimenes veselības mācība veidota kā modulis "Ģimenes vērtības un veselībpratība" sociālajās zinībās
  ar starppriekšmetu saikni, nevis kā atsevišķs priekšmets.
jautajums: >-
  Redaktors izlēma (PR #115): (2) mācību līdzekļu Solījumi — nav Procesā; (3) as-skola2030-pilnveide
  — Procesā. Atvērts: (1) jv-veselibas-macibas-pilnveide-skolas — atbilde "pilnībā nav izpildīts":
  vai tas nozīmē Statusu nemainīt (melnraksts) vai Procesā? (4) pro-seksuali-reproduktiva-izglitiba —
  relevants; piedāvājums: iekļaut ar virziens par (modulis ietver pubertāti un attiecības), Statusu
  nemainīt, jo saturs vēl nav izstrādāts.
