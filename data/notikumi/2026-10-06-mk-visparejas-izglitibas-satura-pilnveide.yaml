id: 2026-10-06-mk-visparejas-izglitibas-satura-pilnveide
datums: 2026-10-06
nosaukums: MK atbalsta vispārējās izglītības satura pilnveidi un ģimenes vērtību un veselībpratības moduli
apraksts: >-
  Ministru kabinets 06.10.2026 sēdē (prot. Nr. 57 48. §, TAP 26-TA-2353) pieņēma zināšanai IZM
  informatīvo ziņojumu "Vispārējās izglītības satura pilnveide" un atbalstīja satura pilnveidi,
  ievērojot valsts izglītības standartu struktūru un pamatprincipus (ziņojumā — Valdības rīcības
  plāna 47.4. pasākums "Uzsākta vispārējās izglītības satura skola2030 pārskatīšana"). VIAA uzdots
  turpināt Latvijas vēstures satura stiprināšanu, kolektīvās dziedāšanas un ģimenes veselības
  mācības satura izstrādi un ieviešanu: līdz 30.04.2027, konsultējoties ar VM, izstrādāt ģimenes
  vērtību un veselībpratības moduļa saturu; no 01.09.2027 aktualizētos sociālo zinību, vēstures un
  mūzikas programmu paraugus noteikt par valsts noteiktajiem; līdz 30.11.2026 izveidot izglītības
  satura ekspertu padomes; rosināt vēsturi kā patstāvīgu priekšmetu 4.–6. klasē (priekšlikumi IZM
  līdz 31.03.2027). IZM uzdots līdz 31.12.2026 izvērtēt obligātus programmu paraugus pamatizglītībā,
  līdz 31.12.2027 — prasības mācību stundu skaitam, izvērtēt mājas darbu praksi un iesniegt
  priekšlikumus MK, līdz 31.03.2027 izstrādāt priekšlikumus valsts iesaistei mācību līdzekļu (arī
  mācību grāmatu) izstrādē un pieejamībā, kā arī aprēķināt papildu finansējumu mācību līdzekļiem;
  9. un 10. punktu īsteno fiskāli neitrāli IZM budžeta ietvaros.
