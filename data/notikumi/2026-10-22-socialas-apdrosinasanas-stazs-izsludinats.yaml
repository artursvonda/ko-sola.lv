    veids: vestnesis
  - url: https://likumi.lv/ta/id/371795
    veids: likumi
solijumi:
  - id: as-pensiju-sasaiste-ar-bernu-audzinasanu
    virziens: par
    pamatojums: >-
      Likums ļauj ar brīvprātīgu iemaksu ieskaitīt pensiju apdrošināšanas stāžā laiku, kurā māte
      1991.–1995. gadā audzinājusi bērnu līdz astoņu gadu vecumam, — paplašina pensiju sistēmas sasaisti ar
      bērnu audzināšanu, bet tikai šim periodam un par personas iemaksu.
  - id: lpv-berna-kopsanas-atvalinajums-darba-staza
    virziens: par
    pamatojums: >-
      Likums ļauj ieskaitīt sociālās apdrošināšanas stāžā 1991.–1995. gada periodu, kurā māte audzinājusi
      bērnu līdz astoņu gadu vecumam (ar brīvprātīgu iemaksu), — daļa no bērna kopšanas laika ieskaitīšanas
      stāžā, ko Solījums paredz.
piezimes: >-
  Notikuma datums — izsludināšana (22.10.2026), Vērtēšanas periodā. Galīgā lasījuma Notikums (1568/Lp14,
  15.10.2026) ir zarā notikums/2026-10-15-socialas-apdrosinasanas-stazs-1991-1995 (nav apvienots main).
  Sākumstāvoklis (kā bērna kopšanas periodi jau tiek ieskaitīti stāžā pēc likuma "Par valsts pensijām")
  šajā Notikumā nav pārbaudīts. Saturs pēc Vēstneša publikācijas.
jautajums: >-
  Statuss nav mainīts. as-pensiju-sasaiste-ar-bernu-audzinasanu un lpv-berna-kopsanas-atvalinajums-darba-staza:
  vai izsludinātais likums ir "Daļēji izpildīts" (daļējs iznākums, kas stājas spēkā 01.07.2027 — tikai
  1991.–1995. gads, tikai par brīvprātīgu iemaksu), vai tikai solis bez Statusa maiņas, jo nav skaidrs, cik
  lielā mērā bērna kopšanas periodi stāžā jau ieskaitīti pirms tam? Lūdzu izvēlēties.
