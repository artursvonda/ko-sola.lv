id: 2026-10-22-socialas-apdrosinasanas-stazs-izsludinats
datums: 2026-10-22
nosaukums: Izsludināti grozījumi likumā "Par valsts sociālo apdrošināšanu" — brīvprātīgas iemaksas par stāžu 1991.–1995. gadā
apraksts: >-
  "Latvijas Vēstnesī" 22.10.2026 (Nr. 204) izsludināti 14. Saeimas 15.10.2026 pieņemtie grozījumi likumā
  "Par valsts sociālo apdrošināšanu". Jaunā 5. panta 3.5 daļa ļauj brīvprātīgi pievienoties pensiju un
  bezdarba apdrošināšanai par Latvijā uzkrātiem darba stāžam pielīdzināmiem periodiem no 01.01.1991 līdz
  31.12.1995, ja tie pierādīti saskaņā ar likumu "Par valsts pensijām" un nesakrīt ar citiem sociālās
  apdrošināšanas periodiem: studijas Latvijas augstskolā vai citā pēcvidusskolas izglītības iestādē,
  pēcdiploma izglītība un kvalifikācijas paaugstināšana, I grupas personas ar invaliditāti, bērna ar
  invaliditāti līdz 16 gadiem vai 80 gadus sasniegušas personas kopšana un laiks, kurā māte Latvijā
  audzinājusi bērnu līdz astoņu gadu vecumam. Iemaksa — 1% no attiecīgajā gadā spēkā esošās minimālās
  mēneša darba algas par katru periodu mēnesi (pārejas noteikumu 107. p.); iemaksas var veikt no
  01.10.2027 (109. p.), kārtību MK nosaka līdz 30.06.2027 (108. p.). Likums stājas spēkā 01.04.2027,
  5. panta grozījumi — 01.07.2027. Likums arī izslēdz iesācēju mikrouzņēmumu nodokļa maksātājus no
  1. panta 3. punkta "m" apakšpunkta tvēruma.
avoti:
