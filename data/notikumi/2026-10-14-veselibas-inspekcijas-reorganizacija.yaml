id: 2026-10-14-veselibas-inspekcijas-reorganizacija
datums: 2026-10-14
nosaukums: MK nolemj reorganizēt Veselības inspekciju, farmācijas uzraudzības funkcijas nododot Zāļu valsts aģentūrai
apraksts: >-
  Ministru kabinets ar 2026. gada 14. oktobra rīkojumu Nr. 648 (prot. Nr. 58 29. §), pamatojoties uz
  Valsts pārvaldes iekārtas likuma 15. panta trešās daļas 3. punktu, nolēma reorganizēt Veselības
  ministrijas padotībā esošo Veselības inspekciju un līdz 2027. gada 1. aprīlim nodot rīkojuma 2. punktā
  noteiktās funkcijas un uzdevumus Zāļu valsts aģentūrai. Tās ir farmācijas jomas uzraudzības funkcijas:
  zāļu un aktīvo vielu, narkotisko un psihotropo vielu un prekursoru, spirta aprites, zāļu reklāmas un
  izplatīšanas uzraudzība, kā arī ambulatorās ārstēšanas zāļu un medicīnisko ierīču kompensācijas
  kārtības uzraudzība. Zāļu valsts aģentūra ar 01.04.2027 ir Veselības inspekcijas tiesību, saistību,
  finanšu līdzekļu, mantas un lietvedības pārņēmēja šajās funkcijās. Ministram līdz 20.10.2026 jāizveido
  reorganizācijas komisija, likumu grozījumi MK jāiesniedz līdz 01.11.2026, noteikumu projekti — līdz
  01.12.2026. Publicēts "Latvijas Vēstnesī" 16.10.2026.
avoti:
  - url: https://www.vestnesis.lv/op/2026/200.24
    veids: vestnesis
solijumi:
  - id: jv-instituciju-ar-lidzigam-funkcijam-apvienosana
    virziens: par
    pamatojums: >-
      Veselības inspekcijas farmācijas uzraudzības funkcijas tiek nodotas Zāļu valsts aģentūrai, kas jau
      darbojas zāļu jomā, — divu iestāžu savietojamu funkciju apvienošana vienā iestādē.
  - id: lpv-valsts-iestazu-un-ministriju-apvienosana
    virziens: par
    pamatojums: >-
      Valsts iestāžu reorganizācija, kurā iestādes ar radniecīgām (farmācijas uzraudzības) funkcijām tiek
      apvienotas Zāļu valsts aģentūrā.
piezimes: >-
  Lēmumu pieņēma iepriekšējā valdība pēc vēlēšanām (parakstījuši Ministru prezidents A. Kulbergs un
  veselības ministrs H. Abu Meri). Rīkojums nenosaka, vai Veselības inspekcija pēc 01.04.2027 turpina
  darbu ar pārējām funkcijām; 6.2. punkts paredz grozīt arī Veselības inspekcijas nolikumu.
jautajums: >-
  Statuss nav mainīts abiem Solījumiem. Vai farmācijas funkciju nodošana citai iestādei (reorganizācija;
  rīkojums nenosaka, vai Veselības inspekcija turpina darbu) ir "iestāžu apvienošana" šo Solījumu nozīmē? Ja jā —
  MK rīkojums ir formāls solis ar termiņu 01.04.2027 → Procesā (vertesana.md); ja nē — izņemt Solījumus
  vai atstāt bez Statusa maiņas.
