id: 2026-10-07-kriminallikums-aizliegta-vienosanas-iepirkuma
datums: 2026-10-07
nosaukums: Izsludināta kriminālatbildība par aizliegtu vienošanos iepirkumā (Krimināllikuma 211.¹ un 211.² pants)
apraksts: >-
  Valsts prezidents 2026. gada 7. oktobrī izsludināja 14. Saeimas 24. septembrī pieņemto likumu
  "Grozījums Krimināllikumā", kas papildina Krimināllikumu ar 211.¹ pantu "Aizliegta vienošanās
  iepirkumā" un 211.² pantu. Par pieteikuma vai piedāvājuma saskaņošanu ar citu tirgus dalībnieku vai
  vienošanos par neiesniegšanu vai dalības noteikumiem liela apmēra iepirkumā paredzēta brīvības
  atņemšana līdz trim gadiem, publiskā iepirkumā — līdz pieciem gadiem, kā arī tiesību uz
  komercdarbību vai noteiktu amatu atņemšana. Personu, kas pirmā labprātīgi paziņo un aktīvi veicina
  atklāšanu, var atbrīvot no kriminālatbildības; juridiskajai personai par šo nodarījumu piespiedu
  ietekmēšanas līdzekļus nepiemēro. Tajā pašā dienā izsludinātais grozījums likumā "Par Krimināllikuma
  spēkā stāšanās un piemērošanas kārtību" (20.² pants) nosaka, ka liels apmērs ir līgumcena (bez PVN)
  vismaz 750 000 euro vai būvdarbu līgumam 1 000 000 euro. Abi likumi stājas spēkā 2026. gada 15. oktobrī.
avoti:
  - url: https://www.vestnesis.lv/op/2026/193.7
    veids: vestnesis
  - url: https://www.vestnesis.lv/op/2026/193.8
    veids: vestnesis
solijumi:
  - id: pro-personiska-atbildiba-par-karteliem
    virziens: par
    pamatojums: >-
      Ievieš personisku (kriminālu) atbildību fiziskajām personām par karteļa vienošanos iepirkumā,
      kas nav atkarīga no uzņēmuma pastāvēšanas, taču aptver tikai iepirkuma karteļus (liela apmēra vai
      publiskā iepirkumā), nevis dalību karteļos kopumā.
  - id: jv-pret-korupciju-un-interesu-konfliktiem
    virziens: par
    pamatojums: >-
      Pilnveido tiesisko regulējumu konkurences tiesību pārkāpumu apkarošanai, ieviešot kriminālatbildību
      par aizliegtu vienošanos iepirkumā.
piezimes: >-
  Likumprojekta numurs Vēstneša publikācijā nav norādīts, un saeima.lv/lawdata.json to vairs nesatur
  (izsludinātie likumprojekti sarakstā nav); galīgais lasījums 14. Saeimā 24.09.2026 (pirms vēlēšanām)
  atsevišķs Notikums nav pievienots.
jautajums: >-
  pro-personiska-atbildiba-par-karteliem: piedāvāts Daļēji izpildīts — atbildība ieviesta tikai par
  karteļiem iepirkumos (liela apmēra ≥ 750 000 / 1 000 000 euro vai publiskā iepirkumā), ne par dalību
  karteļos kopumā, un tā attiecas uz personām, kas vienošanos izdarījušas, ne uz patiesā labuma guvējiem
  vai valdes locekļiem kā tādiem. Solījums gan atrodas programmas sadaļā par publiskajiem iepirkumiem.
  Apstiprināt Daļēji izpildīts, mainīt uz Izpildīts vai Statusu nemainīt?
