id: 2026-10-29-valsts-kontrole-saeimas-finansu-revizija
datums: 2026-10-29
nosaukums: Saeima galīgajā lasījumā pieņem grozījumus Valsts kontroles likumā par finanšu revīziju Saeimā
apraksts: >-
  14. Saeima 2026. gada 29. oktobrī galīgajā lasījumā pieņēma grozījumus Valsts kontroles likumā. Saskaņā
  ar Saeimas preses relīzi Valsts kontrole Saeimā būs tiesīga veikt finanšu revīziju par parlamenta
  sagatavotā gada pārskata pareizību; revīzija aptvers arī valsts konsolidētajā gada pārskatā iekļauto
  Saeimas finanšu informāciju. Revīzijas plāno pēc Valsts kontroles riska novērtējuma un būtiskuma
  pieejas, tāpēc tās nav obligātas katru gadu. Lietderības vai atbilstības revīzijas Saeimā Valsts
  kontrolei veikt nav tiesību. Likums vēl nav izsludināts.
avoti:
  - url: https://www.saeima.lv/lv/aktualitates/saeimas-finansu-parskatu-turpmak-vares-revidet-valsts-kontrole/
