    veids: zinas
solijumi:
  - id: sv-valsts-kontroles-revizija-saeimas-budzetam
    virziens: par
    pamatojums: >-
      Grozījumi dod Valsts kontrolei tiesības revidēt Saeimas gada pārskatu (finanšu revīzija), kas tieši
      tuvina Solījuma iznākumu — Valsts kontroles revīziju Saeimas budžetam; lietderības un atbilstības
      revīzijas izslēgtas. 14. Saeimas galīgais lasījums pirms 03.11.2026 Statusu nemaina (vertesana.md);
      Statusu var mainīt izsludināšana.
piezimes: >-
  Saturs pēc Saeimas preses relīzes (29.10.2026); likumprojekta numurs relīzē nav nosaukts (relīzes saitē
  uz LIVS — 1555/Lp14, nav pārbaudīts; LIVS nav atvērts, robots.txt). Spēkā stāšanās datums relīzē nav
  norādīts. Pēc izsludināšanas jāvērtē, vai finanšu revīzija bez lietderības un atbilstības revīzijām ir
  Izpildīts vai Daļēji izpildīts. LSM ziņa bija norāde.
