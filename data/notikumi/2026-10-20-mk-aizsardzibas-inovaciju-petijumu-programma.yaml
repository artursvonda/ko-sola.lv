id: 2026-10-20-mk-aizsardzibas-inovaciju-petijumu-programma
datums: 2026-10-20
nosaukums: MK apstiprina valsts pētījumu programmu "Aizsardzības inovāciju pētījumu programma" 2026.–2029. gadam
apraksts: >-
  Ar Ministru kabineta 2026. gada 20. oktobra rīkojumu Nr. 659 (publicēts "Latvijas Vēstnesī" 22.10.2026,
  Nr. 204) apstiprināta valsts pētījumu programma "Aizsardzības inovāciju pētījumu programma" 2026.–2029.
  gadam. Mērķis — lietišķās pētniecības rezultātā attīstīt inovatīvas tehnoloģijas, risinājumus un
  produktus valsts aizsardzības vajadzībām. Pētniecības jomas: mākslīgais intelekts un kiberaizsardzība;
  autonomās sistēmas un aizsardzība pret bezpilota sistēmām; kvantu tehnoloģijas; kosmosā balstīti sakaru
  un novērošanas risinājumi; militārā medicīna; personāla noturība un militārā mobilitāte. Finansējums —
  kopā 6 000 000 eiro (1 500 000 eiro gadā) no Aizsardzības ministrijas budžeta apakšprogrammas 22.12.00;
  atbildīgā institūcija — Aizsardzības ministrija.
avoti:
  - url: https://www.vestnesis.lv/op/2026/204.27
    veids: vestnesis
solijumi:
  - id: jv-aizsardzibas-tehnologiju-attistiba
    virziens: par
    pamatojums: >-
      Programma ar valsts finansējumu attīsta aizsardzības inovācijas, tostarp autonomās sistēmas un
      aizsardzību pret bezpilota sistēmām, kam Solījums pievērš īpašu uzmanību.
  - id: jv-prioritaro-tehnologiju-attistiba
    virziens: par
    pamatojums: >-
      Programma finansē pētījumus Solījumā nosauktajās prioritārajās tehnoloģijās — aizsardzības
      tehnoloģijās, kvantu tehnoloģijās, autonomajās sistēmās un mākslīgajā intelektā.
  - id: jv-zinatnes-bazes-finansejuma-pilnveide
    virziens: par
    pamatojums: >-
      Izveidota jauna valsts pētījumu programma ar 6 milj. eiro finansējumu — Solījumā minēto valsts
      pētījumu programmu stiprināšana.
piezimes: >-
  Vēstneša publikācijā: "Rīgā 2026. gada 20. oktobrī (prot. Nr. 58 46. §)", Vērtēšanas periodā. MK sēdes
  20.10.2026 protokols ir Nr. 59 (LV 26.10.2026, 206.1), tāpēc protokola numurs vai datums avotā var būt
  neprecīzs; `datums` — pēc rīkojuma galvas.
  Visi trīs Solījumi ir Nepārbaudāmi — Statusa maiņu nav. Rīkojumu parakstījusi iepriekšējā valdība pēc
  vēlēšanām.
