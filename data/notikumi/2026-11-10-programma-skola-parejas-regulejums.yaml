solijumi:
  - id: jv-programma-skola-finansesanas-modelis
    virziens: pret
    pamatojums: >-
      Noteikumi 2026./2027. mācību gadā atceļ vienu no modeļa "Programma skolā" finansēšanas
      nosacījumiem (vismaz 15 izglītījamie klašu grupā), tāpēc šajā mācību gadā modelis netiek
      piemērots pilnā apjomā; pēc mācību gada nosacījums atkal piemērojams.
piezimes: >-
  Notikuma datums — MK pieņemšana (10.11.2026); publicēšana "Latvijas Vēstnesī" 19.11.2026, spēkā
  pēc vispārējā noteikuma nākamajā dienā (noteikumos cits termiņš nav norādīts). Statuss nav mainīts,
  tāpēc izsludināšana nav atsevišķs Notikums. Abus noteikumus parakstījuši Ministru prezidents
  (tieslietu ministra p. i.) A. Kulbergs un izglītības un zinātnes ministre I. Indriksone. MK
  paziņojumā minēta arī apropriācijas pārdale; tās summa noteikumos nav. LSM ziņa — tikai norāde.
jautajums: >-
  Virziens: vai pārejas regulējums ir "pret" Solījumam "Īstenosim pilnā apjomā jauno finansēšanas
  modeli «Programma skolā»" (vienu modeļa nosacījumu 2026./2027. mācību gadā nepiemēro), vai "par"
  (modeļa ieviešanas solis, pamatprincipi nemainās), vai Solījumu neiekļaut? Statuss nav mainīts.
