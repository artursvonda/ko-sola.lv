id: 2026-11-10-programma-skola-parejas-regulejums
datums: 2026-11-10
nosaukums: MK nosaka pārejas regulējumu finansēšanas modeļa "Programma skolā" ieviešanai
apraksts: >-
  Ministru kabinets 2026. gada 10. novembrī (prot. Nr. 63 18. un 19. §) pieņēma noteikumus Nr. 680
  "Grozījums Ministru kabineta 2026. gada 14. aprīļa noteikumos Nr. 204" (kritēriji un kārtība, kādā
  valsts piedalās pedagogu darba samaksas finansēšanā vispārējās pamatizglītības un vispārējās vidējās
  izglītības pakāpē) un noteikumus Nr. 679 "Grozījums Ministru kabineta 2020. gada 25. augusta
  noteikumos Nr. 538" (kārtība, kādā valsts finansē darba samaksu pedagogiem privātajās izglītības
  iestādēs); abi publicēti "Latvijas Vēstnesī" 19.11.2026 Nr. 223. Noteikumi Nr. 680 papildina
  noteikumus Nr. 204 ar 22.1 punktu: 2026./2027. mācību gadā netiek piemērota 10. punkta prasība par
  vismaz 15 izglītījamiem katrā klašu grupā (1.–3., 4.–6., 7.–9. klase), ievērojot pieļaujamās
  svārstības; IZM pārrēķina valsts budžeta finansējumu pedagogu darba samaksai skolām, kurām šīs
  prasības dēļ finansējums kādai klašu grupai nebija piešķirts. Noteikumi Nr. 679 paredz tādu pašu
  pārrēķinu privātajām izglītības iestādēm par laiku no 01.09.2026 līdz 31.08.2027 ar izglītības un
  zinātnes ministra rīkojumu.
