id: 2026-11-24-mk-airbaltic-valsts-galvojums
datums: 2026-11-24
nosaukums: MK konceptuāli atbalsta valsts galvojumu līdz 175 milj. eiro airBaltic privātā finansējuma piesaistei
apraksts: >-
  Ministru kabinets 24.11.2026 konceptuāli atbalstīja valsts galvojumu līdz 175 miljoniem eiro, lai
  "Air Baltic Corporation" AS piesaistītu privāto finansējumu uzņēmuma darbības nepārtrauktības
  nodrošināšanai un restrukturizācijas procesa turpināšanai. Valdība uzdeva steidzamības kārtībā
  virzīt izskatīšanai Saeimā grozījumus "Air Baltic Corporation AS" finanšu stabilizācijas pasākumu
  likumā, kas paredz pilnvarot Ministru kabinetu lemt par galvojuma izsniegšanu. Finansējumu sniegtu
  privātie aizdevēji, bet valsts galvotu daļu saistību; galvojumu var izsniegt tikai pēc Saeimas
  pilnvarojuma un nepieciešamajiem saskaņojumiem, tostarp Eiropas Komisijas apstiprinājuma, un
  atbilstoši ES valsts atbalsta noteikumiem. Kopš 14.09.2026 airBaltic finanšu reorganizācija notiek
  ASV tiesā (Chapter 11), pabeigšana plānota 2027. gada vidū.
