    veids: zinas
solijumi:
  - id: sv-airbaltic-finansesanas-partrauksana
    virziens: pret
    pamatojums: >-
      MK konceptuāli atbalsta jaunu valsts atbalstu airBaltic — valsts galvojumu līdz 175 milj. eiro,
      kas var radīt valsts finanšu saistības —, nevis valsts finansējuma pārtraukšanu.
piezimes: >-
  Avots ir MK relīze (24.11.2026). MK sēdes protokollēmums, TAP dokuments un likumprojekta numurs nav
  atrasti; relīze nenosauc, kura ministrija grozījumus sagatavo un iesniedz (relīzi publicējusi
  Satiksmes ministrija). Statuss nemainās: konceptuāls atbalsts un uzdevums virzīt grozījumus nav
  formāls solis (likumprojekts vēl nav iesniegts Saeimā), un tas nav galīgs lēmums — galvojumam
  vajadzīgs Saeimas pilnvarojums un EK apstiprinājums. Galvojums nav tiešs aizdevums no budžeta
  (finansējumu sniedz privātie aizdevēji), bet relīze norāda, ka tas var radīt valsts finanšu
  saistības un tam jāatbilst valsts atbalsta noteikumiem; tāpēc virziens "pret" Solījumam pārtraukt
  finansēt airBaltic. Saeimas galīgais lasījums (26.11.2026) ir atsevišķs Notikums. Norāde uz faktu —
  LSM ziņa (tikai saite).
