id: 2026-10-16-mk-kritisko-zalu-rezerves
datums: 2026-10-16
nosaukums: MK noteikumi par kritisko zāļu rezervēm
apraksts: >-
  Ministru kabineta 2026. gada 13. oktobra noteikumi Nr. 631 (prot. Nr. 58 66. §) "Noteikumi par
  kritisko zāļu rezervēm", izdoti saskaņā ar Farmācijas likuma 5. panta 28. punktu, publicēti
  "Latvijas Vēstnesī" 16.10.2026. Noteikumi nosaka kritisko zāļu sarakstā iekļauto zāļu (resursu)
  rezervju veidošanas, izmantošanas un aprites kārtību; kritisko zāļu saraksta nomenklatūra un
  nepieciešamais rezervju apjoms noteikts pielikumā (ierobežotas pieejamības informācija). Rezerves
  izveido un uztur Nacionālais veselības dienests, slēdzot līgumus ar zāļu lieltirgotavām (nepiemērojot
  zemākās cenas principu); valsts vai sabiedrības apdraudējuma laikā par rezervju pārvietošanu,
  reģionālo apgādi un nodošanu Nacionālo bruņoto spēku vajadzībām lemj Valsts operatīvā medicīniskā
  komisija, kas var arī ierosināt veselības ministram saraksta un rezervju apjoma izmaiņas. Pēc MK
  paziņojuma, rezervēm 2026.–2028. gadā paredzēti 3 miljoni eiro gadā no Aizsardzības ministrijas
  budžeta.
