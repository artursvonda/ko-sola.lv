    veids: zinas
solijumi:
  - id: pro-kritisko-medikamentu-saraksts-un-rezerves
    virziens: par
    pamatojums: >-
      Noteikumi normatīvi nosaka gan kritisko zāļu sarakstu (pielikumā), gan šo zāļu rezervju
      veidošanas, uzturēšanas un izmantošanas kārtību — abus Solījumā minētos objektus.
  - id: jv-veselibas-sektora-krizes-gataviba
    virziens: par
    pamatojums: >-
      Noteikumi paredz kritisko zāļu rezervju izveidi un to apgādi valsts vai sabiedrības apdraudējuma
      laikā, kas ir Solījumā minētā medikamentu rezervju pieejamība krīzēm.
piezimes: >-
  Notikuma datums — publicēšana "Latvijas Vēstnesī" (16.10.2026), jo MK noteikumi stājas spēkā
  nākamajā dienā pēc izsludināšanas (17.10.2026; noteikumos cits termiņš nav noteikts); MK tos pieņēma
  13.10.2026, abi datumi Vērtēšanas periodā. Noteikumi ir jauns akts: tajos nav normu par citu
  noteikumu atzīšanu par spēku zaudējušiem, un MK paziņojums rezerves raksturo kā jaunveidojamas,
  papildinot valsts materiālās rezerves un ārstniecības iestāžu krājumus. Kritisko zāļu saraksts ir
  ierobežotas pieejamības informācija (pēc MK paziņojuma — zāles 20 slimību grupām). Noteikumus
  parakstījuši Ministru prezidents A. Kulbergs un veselības ministrs H. Abu Meri (iepriekšējā valdība
  pēc vēlēšanām).
