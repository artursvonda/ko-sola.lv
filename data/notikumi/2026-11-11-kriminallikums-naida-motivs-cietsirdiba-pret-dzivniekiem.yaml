id: 2026-11-11-kriminallikums-naida-motivs-cietsirdiba-pret-dzivniekiem
datums: 2026-11-11
nosaukums: Izsludināti grozījumi Krimināllikumā par slepkavību naida motīva dēļ un cietsirdību pret dzīvniekiem
apraksts: >-
  Valsts prezidents 2026. gada 11. novembrī izsludināja 14. Saeimas 29. oktobrī pieņemto likumu
  "Grozījumi Krimināllikumā" (Latvijas Vēstnesis Nr. 218). Krimināllikuma 117. pants (slepkavība
  pastiprinošos apstākļos) papildināts ar 13. punktu — slepkavība, kas izdarīta rasistisku, nacionālu,
  etnisku vai reliģisku motīvu vai sociālā naida, tai skaitā dzimuma, dēļ. 230. pants izteikts jaunā
  redakcijā "Cietsirdīga izturēšanās pret dzīvnieku, dzīvnieka spīdzināšana un seksuāla rakstura
  darbības ar dzīvnieku": 1. daļā paredzēta brīvības atņemšana līdz četriem gadiem un dzīvnieku turēšanas
  tiesību atņemšana līdz trim gadiem, 2. daļā (personu grupa, būtisks kaitējums, dzīvnieka nāve vai
  sakropļošana) — līdz pieciem gadiem un turēšanas tiesību atņemšana līdz pieciem gadiem, 3. daļā
  (publiskā vietā vai nepilngadīgā klātbūtnē) — līdz sešiem gadiem un turēšanas tiesību atņemšana līdz
  pieciem gadiem. 193. panta otrās daļas dispozīcijā vārds "nelikumīgu" aizstāts ar "ļaunprātīgu"
  (pārejas noteikumu 37. punkts: neattiecas uz personām, kas notiesātas pirms grozījuma spēkā stāšanās).
  Likums stājas spēkā 2026. gada 25. novembrī.
avoti:
  - url: https://www.vestnesis.lv/op/2026/218.8
    veids: vestnesis
  - url: https://likumi.lv/ta/id/372257
    veids: likumi
solijumi:
  - id: pro-sankcijas-par-dzivnieku-ciesanam
    virziens: par
    pamatojums: >-
      Pastiprina kriminālsankcijas par cietsirdīgu izturešanos pret dzīvniekiem (230. panta 1. daļā
      brīvības atņemšana līdz četriem gadiem iepriekšējo trīs vietā) un paredz atbildību par seksuāla
      rakstura darbībām ar dzīvnieku.
  - id: pro-naida-runas-regulejuma-pilnveide
    virziens: par
    pamatojums: >-
      Precīzē atbildību par naida noziegumiem, nosakot rasistisku, nacionālu, etnisku, reliģisku vai
      sociālā naida (arī dzimuma dēļ) motīvu kā slepkavību kvalificējošu apstākli, bet neskar naida runas
      regulējumu.
piezimes: >-
  Spēkā stāšanās datums (25.11.2026) — pēc likumi.lv; likumā tas nav noteikts, tāpēc likums stājas spēkā
  14. dienā pēc izsludināšanas. Iepriekšējā 230. panta redakcija (2024. gada grozījumi, likumi.lv ta/id/352942,
  spēkā no 04.07.2024) pēc LV portāla skaidrojuma
  (https://lvportals.lv/skaidrojumi/365347-pastiprina-kriminalatbildibu-par-cietsirdigu-izturesanos-pret-dzivniekiem--2024)
  1. daļā paredzēja brīvības atņemšanu līdz trim gadiem; 2. un 3. daļas maksimālās sankcijas (5 un 6 gadi,
  turēšanas tiesību atņemšana līdz 5 gadiem) nav mainītas. Likumprojekta numurs Vēstneša publikācijā nav
  norādīts; galīgais lasījums 14. Saeimā 29.10.2026 atsevišķs Notikums nav pievienots.
jautajums: >-
  (1) pro-naida-runas-regulejuma-pilnveide: vērtēšanas avots ir CVK citāts ("regulējumu naida runas
  novēršanai"), ko 117. panta grozījums neskar; paplašinātās programmas "precizējot atbildību" (arī naida
  noziegumiem) — vai to uzskatīt par mēru (metode.md §4) un piešķirt Daļēji izpildīts? Statuss nav mainīts.
  (2) pro-sankcijas-par-dzivnieku-ciesanam: piedāvāts Daļēji izpildīts (pastiprināta tikai kriminālatbildība
  par sakropļošanu/spīdzināšanu, ne sankcijas par citām nevajadzīgām ciešanām, piem., pārvadāšanā un
  kautuvēs) — apstiprini vai maini uz Izpildīts; un vai iepriekšējā 1. daļas sankcija (3 gadi) jāpārbauda
  likumi.lv konsolidētajā redakcijā.
