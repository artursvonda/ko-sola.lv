# Atbildīgās iestādes un to Amatpersonas (lēmums: "Atbildīgais: iestāde, persona un opozīcijas solījumi", #12).
# Slēgts saraksts: jaunu iestādi — tikai ar PR. Slug nemainās pēc publicēšanas (ir Solījumu failos).
#
# Ministrijas: Ministru kabineta iekārtas likuma 5. panta 1. daļa (14 ministrijas). Nosaukums — kā ministrijas mājaslapā.
# isais_nosaukums: FM, ĀM, KEM, LM, VARAM redzēti oficiālās lapās; pārējie — vispārpieņemtie saīsinājumi.
# pecteces_no: iestādes, kuru Amatpersonas meklē, ja datums ir pirms šīs iestādes izveides (ministriju pārveide).
#
# amatpersonas — politiski atbildīgais (ministrs / Ministru prezidents / Saeimas priekšsēdētājs), laika secībā,
#   tikai tie, kas amatā vēlēšanu dienā (2026-10-03) vai vēlāk:
#   no / lidz: amatā šajā iestādē bez pārtraukuma (lidz nav = joprojām amatā); avots — oficiāls.
#   pi: true — pienākumu izpildītājs (vakance). partija — teksts, partijas_avots — oficiāls;
#   saraksts — tikai, ja partija ir ievēlēta Saraksta daļa (data/saraksti.yaml).
#   Ja fakts nav pārbaudīts oficiālā avotā — jautajums (bloķē merge), nevis minējums.
# Kulberga valdība apstiprināta 2026-05-28 (https://www.mk.gov.lv/lv/ministru-kabineta-sastavs).

