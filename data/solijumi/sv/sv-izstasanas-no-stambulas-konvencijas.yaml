    citats: "novērst un nepieļaut ģimenes vērtības graujošu ideoloģiju (Stambulas konvencija un tml.) izglītībā, medijos un likumdošanā"
nesakritiba: ""
piezimes: "Redaktora lēmums: nodoms izstāties no Stambulas konvencijas, pārbaudāms. Izpildīts = pilnvaru laikā Latvija izstājas no konvencijas (to denonsē) vai Saeima pieņem lēmumu par izstāšanos. Pārējā teikuma daļa (izglītībā, medijos un likumdošanā) ir konteksts. Iestāde: Saeima, jo izstāšanos izlemj Saeima ar likumu; 2025. gadā izstāšanās likumprojektu skatīja Saeimas Ārlietu komisija un Saeima to pieņēma galīgajā lasījumā 30.10.2025 (lvportals.lv/dienaskartiba/382333). Oficiālā avotā nav pārbaudīts, kura ministrija būtu atbildīga, ja izstāšanos virzītu valdība."
jautajums: ""
