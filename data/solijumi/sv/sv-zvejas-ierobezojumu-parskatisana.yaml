nesakritiba: ""
piezimes: "Punkts dalīts (§1): zvejas ierobežojumu pārskatīšana un atbalsts zivju pārstrādei var saņemt atšķirīgus statusus. Galvenajā teikumā bez -ot daļas paliek vispārīgs darbības vārds („aizstāvēt intereses”), tāpēc Solījums ir -ot daļa (§1). Robežgadījums: „nepamatotu” nav definēts; pārbaudāms, vai panākta zvejas ierobežojumu pārskatīšana (mīkstināšana) Baltijas jūrā. ZM — zivsaimniecība, Latvijas pozīcija ES (§6a)."
jautajums: ""
