id: sv-rail-baltica-atbildigo-noskaidrosana
saraksts: sv
nosaukums: Atbildīgo personu noskaidrošana par Rail Baltica līdzekļu izšķērdēšanu
parbaudams: true
temas:
  galvena: transports
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: sm
  papildu: []
avoti:
  - veids: cvk
    vieta: "EKONOMIKA"
    citats: "pārtraukt Rail Baltica finansēšanu, iesaldēt būvniecību un noskaidrot atbildīgās personas par līdzekļu izšķērdēšanu"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-rail-baltica-finansesanas-partrauksana. Citēts viss punkts, jo projekts nosaukts tikai tā sākumā. Robežgadījums: pārbaudāms, vai oficiālā izvērtējumā (piem., revīzijā, izmeklēšanā) nosauktas personas, kas atbildīgas par līdzekļu izšķērdēšanu; mehānisms avotā nav nosaukts. Iestāde: SM — projekta uzraudzība; atbildīgo noskaidrošana var būt arī Saeimas izmeklēšanas komisijas, Valsts kontroles vai tiesībsargājošo iestāžu kompetencē. Iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
