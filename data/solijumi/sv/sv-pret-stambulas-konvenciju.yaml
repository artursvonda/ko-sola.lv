id: sv-pret-stambulas-konvenciju
saraksts: sv
nosaukums: Nostāja pret Stambulas konvenciju izglītībā, medijos un likumdošanā
parbaudams: false
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu: [gimenes-un-demografija]
iestades:
  galvena: lm
  papildu: [izm, km]
avoti:
  - veids: cvk
    vieta: "DEMOGRĀFIJA"
    citats: "novērst un nepieļaut ģimenes vērtības graujošu ideoloģiju (Stambulas konvencija un tml.) izglītībā, medijos un likumdošanā"
nesakritiba: ""
piezimes: "Uzskaitījums (izglītībā, medijos, likumdošanā) zem viena darbības vārda — viens Solījums (§1). Nepārbaudāms: avots nenosauc konkrētu iznākumu (piem., izstāšanos no Stambulas konvencijas), Stambulas konvencija minēta kā piemērs. Iestāde: LM — vardarbības ģimenē novēršanas politika; IZM un KM papildu — izglītība un mediji; nav pārbaudīts oficiālā avotā, kura iestāde atbildīga par Stambulas konvenciju."
jautajums: "Vai šo uzskatīt par apņemšanos izstāties no Stambulas konvencijas (tad pārbaudāms, jāmaina nosaukums un, iespējams, iestāde) vai par nepārbaudāmu vērtību deklarāciju, kā izrakstīts?"
