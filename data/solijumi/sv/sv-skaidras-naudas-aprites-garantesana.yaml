piezimes: "Nav apvienots ar sv-digitalas-valutas-neatbalstisana: atsevišķs darbības vārds un iznākums. Pārbaudāms (robežgadījums): objekts konkrēts — ierosinātais kritērijs (redaktoram apstiprināt): izpildīts, ja pilnvaru laikā skaidras naudas lietošana netiek ierobežota vairāk un/vai tās pieņemšana vai pieejamība nostiprināta regulējumā; nav izpildīts, ja ieviesti jauni skaidras naudas lietošanas ierobežojumi. FM — finanšu sektora politika; iestāde nav pārbaudīta oficiālā avotā."
