piezimes: "Punkts dalīts 4 Solījumos (§1): katrai darbībai savs darbības vārds un iznākums. Robežgadījums: mēra nav, bet rādītājs konkrēts (pacientu līdzmaksājumu apmērs) — pārbaudāms, vai līdzmaksājumi samazināti. Avots nenosaka, kuri līdzmaksājumi (pacientu iemaksas, zāļu līdzmaksājumi). VM — pacientu iemaksu un kompensācijas regulējums."
