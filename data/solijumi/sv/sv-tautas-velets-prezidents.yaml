nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-bijuso-prezidentu-privilegiju-likvidesana. Avotā nav darbības vārda; nolasīts kā apņemšanās ieviest Valsts prezidenta tiešas vēlēšanas. Pārbaudāms: Satversmes grozījumi pieņemti vai nē (Valsts prezidentu ievēl Saeima — Satversmes 35. pants). Saeima — Satversmes grozījumi tikai Saeimas (vai tautas nobalsošanas) rokās (§6a). Vai grozījumiem vajadzīga tautas nobalsošana, nav pārbaudīts."
