id: sv-atkritumu-dedzinatavas-ne-pie-majam
saraksts: sv
nosaukums: Atkritumu dedzināšanas rūpnīcu nebūvēšana dzīvojamo māju tuvumā
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: kem
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "EKONOMIKA"
    citats: "neatbalstīt atkritumu dedzināšanas rūpnīcu būvniecību dzīvojamo māju tuvumā"
nesakritiba: ""
piezimes: "Punkts dalīts (§1): dedzināšanas rūpnīcas un atkritumu imports var saņemt atšķirīgus statusus. Robežgadījums: pārbaudāms pēc iznākuma (kā sv-pensijas-vecuma-necelsana) — vai pilnvaru laikā atļauta vai uzsākta šādas rūpnīcas būvniecība dzīvojamo māju tuvumā; „tuvumā” nav definēts. Iestāde: KEM — vides aizsardzība, VARAM papildu — teritorijas plānošana; vides funkciju sadalījums starp KEM un VARAM nav pārbaudīts oficiālā avotā."
jautajums: ""
