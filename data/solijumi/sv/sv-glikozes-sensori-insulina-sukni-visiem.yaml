nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-pacientu-lidzmaksajumu-samazinasana. Sensori un sūkņi — uzskaitījums zem viena darbības vārda, nedalīts (§1); ja kompensēts tikai viens, vērtējams kā daļēji izpildīts. Pārbaudāms: kompensācija pieejama diabēta pacientiem neatkarīgi no vecuma vai nē. Pašreizējie vecuma ierobežojumi nav pārbaudīti. VM — kompensējamo medicīnisko ierīču sistēma."
