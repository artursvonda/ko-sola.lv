    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "ierobežot deputātu kompensācijas"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-jaukta-velesanu-sistema. Pārbaudāms (robežgadījums): mēra nav, bet objekts konkrēts — kompensāciju apmērs vai piešķiršanas nosacījumi regulējumā samazināti vai nē. „Deputātu” nolasīts kā Saeimas deputāti (punkts ir par Saeimu); avots nenosauc, kuras kompensācijas. Saeima — deputātu atlīdzību nosaka Saeimas pieņemts regulējums (§6a); konkrētais regulējums nav pārbaudīts."
jautajums: ""
