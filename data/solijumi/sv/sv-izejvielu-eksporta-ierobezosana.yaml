piezimes: "Galvenajā teikumā bez -ot daļas paliek vispārīgs darbības vārds („attīstīt pilna cikla ražošanu”), tāpēc Solījums ir -ot daļa; citēts viss teikums (§1). Robežgadījums: izejvielas nav nosauktas; pārbaudāms, vai ieviests kāds izejvielu eksporta ierobežojums. EM — ārējās tirdzniecības un rūpniecības politika; iestāde nav pārbaudīta oficiālā avotā. Nav pārbaudīts, cik lielā mērā eksporta ierobežojumi ir ES kompetencē."
