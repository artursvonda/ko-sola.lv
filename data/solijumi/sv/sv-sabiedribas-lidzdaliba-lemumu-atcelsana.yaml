piezimes: "Nepārbaudāms (robežgadījums): „paplašināt efektivitāti” bez konkrēta mehānisma vai mēra; avots nenosauc, kāds līdzdalības instruments tiktu ieviests vai mainīts. VK — sabiedrības līdzdalība valsts pārvaldē; VARAM papildu — pašvaldību regulējums. Iestāde nav pārbaudīta oficiālā avotā."
