nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-sprk-lomas-parskatisana. Nepārbaudāms (robežgadījums): „prakse” un „slēpts nodokļu slogs” nav definēti, uzņēmumi nav nosaukti. Alternatīva — Pārbaudāms, ja iznākumu definē, piem., kā valsts uzņēmumu dividenžu ieņēmumu samazināšanu par labu zemākiem tarifiem. FM — valsts kapitālsabiedrību dividenžu politika un budžets; iestāde nav pārbaudīta oficiālā avotā."
