piezimes: "Punkts dalīts trīs Solījumos (§1): IIN sadale, pašvaldību IIN daļa 95% un UIN pārdale var saņemt atšķirīgus statusus. Pārbaudāms: IIN sadales princips ieviests vai nē. FM — nodokļu regulējums un pašvaldību finansēšana; VARAM papildu — pašvaldības. Iestāde nav pārbaudīta oficiālā avotā."
