piezimes: "Punkts dalīts (§1) 3 Solījumos: audits, ministriju apvienošana („apvienojot” — konkrēta darbība ar savu iznākumu), ierēdņu skaita samazināšana. „Pārskatot iestāžu funkcijas” apraksta audita saturu, nav dalīts. Pārbaudāms: audits veikts vai nē. VK — valsts pārvaldes reforma (§6a)."
