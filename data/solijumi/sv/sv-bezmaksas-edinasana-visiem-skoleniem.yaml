nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-bezmaksas-transports-visiem-skoleniem: ēdināšana un transports ir atšķirīgi iznākumi dažādu iestāžu kompetencē, statusi var atšķirties; daļām nav sava darbības vārda, tāpēc citēts viss teikums (§3). Pārbaudāms: valsts līdzfinansējums bezmaksas ēdināšanai attiecas uz visiem skolēniem vai nē. Ekstraktors nav pārbaudījis, kurām klasēm līdzfinansējums pašlaik ir. IZM — iestāde nav pārbaudīta oficiālā avotā."
