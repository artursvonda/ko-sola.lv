id: sv-sprk-lomas-parskatisana
saraksts: sv
nosaukums: SPRK lomas un tarifu saskaņošanas procedūru pārskatīšana
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [energetika]
iestades:
  galvena: em
  papildu: [kem]
avoti:
  - veids: cvk
    vieta: "EKONOMIKA"
    citats: "pārskatīt Sabiedrisko pakalpojumu regulēšanas komisijas lomu un tarifu saskaņošanas procedūras"
nesakritiba: ""
piezimes: "Punkts dalīts trīs Solījumos (§1): SPRK lomas pārskatīšana, dividenžu prakses likvidēšana un regulatora orientācija uz lietotājiem var saņemt atšķirīgus statusus. Robežgadījums: „pārskatīt” + konkrēts objekts (§2) — pārbaudāms, vai grozīts regulējums par SPRK lomu vai tarifu saskaņošanas procedūrām. SPRK ir neatkarīga, tāpēc pēc §6a — ministrija, kas var mainīt regulējumu: EM, KEM papildu — enerģētikas tarifi. Iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
