piezimes: "Punkts dalīts (§1) 3 Solījumos: SIF likvidācija, IIN daļas novirzīšana organizācijām, tas pats princips partijām (atsevišķi darbības vārdi, var būt atšķirīgi statusi). Pārbaudāms: fonds likvidēts vai nē. Tēma — pilsoniskās sabiedrības finansēšana. KM — sabiedrības integrācijas politika; nav pārbaudīts oficiālā avotā, kuras ministrijas pārraudzībā ir SIF (alternatīva — VK)."
