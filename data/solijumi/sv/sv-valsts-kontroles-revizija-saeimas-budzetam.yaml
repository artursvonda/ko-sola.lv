    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "nodrošināt Valsts kontroles revīziju Saeimas budžetam"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-jaukta-velesanu-sistema. Pārbaudāms: Valsts kontrole veic Saeimas budžeta revīziju vai nē. Nav pārbaudīts, vai Valsts kontrole jau tagad revidē Saeimas budžetu un vai tam vajadzīgas regulējuma izmaiņas. Saeima — Valsts kontrole ir neatkarīga, regulējumu var mainīt Saeima (§6a)."
