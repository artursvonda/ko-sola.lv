piezimes: "Nepārbaudāms: „ģeopolitiskā vajāšana” avotā nav definēta, nav konkrēta pasākuma. Iestāde VK — pagaidu izvēle (valdības kopējā kompetence), jo nav skaidrs, uz kādu politiku punkts attiecas."
jautajums: "Ko nozīmē „ģeopolitiskā vajāšana” un kura ir Atbildīgā iestāde? Avots to nedefinē. Iespējams, tas attiecas uz sankciju piemērošanu vai pārbaudēm uzņēmējiem saistībā ar Krieviju/Baltkrieviju (tad — ĀM sankciju politika vai FM finanšu sektora uzraudzība), bet tas ir minējums, avotā nav pārbaudīts. Ieteikums: ja nav skaidra avota — iestades.galvena: neskaidrs, papildu: []; ja redaktors zina kontekstu — attiecīgā ministrija."
