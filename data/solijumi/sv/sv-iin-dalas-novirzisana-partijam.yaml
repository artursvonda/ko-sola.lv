id: sv-iin-dalas-novirzisana-partijam
saraksts: sv
nosaukums: IIN daļas novirzīšanas princips partiju finansēšanā
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu: [nodokli-un-budzets]
iestades:
  galvena: fm
  papildu: [vk]
avoti:
  - veids: cvk
    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "līdzīgu principu ieviest arī partiju finansēšanā"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-sabiedribas-integracijas-fonda-likvidesana; teikuma daļai ir savs darbības vārds, tāpēc citēta tikai tā. „Līdzīgs princips” nolasīts no iepriekšējās teikuma daļas: iedzīvotājs novirza IIN daļu izvēlētai partijai. Pārbaudāms: mehānisms ieviests partiju finansēšanā vai nē. Nav skaidrs, vai tas aizstātu vai papildinātu esošo partiju finansēšanas kārtību. FM — IIN mehānisms; VK papildu — partiju finansēšanas uzraudzība (KNAB ir Ministru kabineta pārraudzībā). Iestāde nav pārbaudīta oficiālā avotā; alternatīva — Saeima vai TM."
jautajums: ""
