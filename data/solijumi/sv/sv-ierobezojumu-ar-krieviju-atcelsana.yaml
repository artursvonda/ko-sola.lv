nesakritiba: ""
piezimes: "Redaktora lēmums: „ģeopolitiskā vajāšana” nozīmē aizliegumus un ierobežojumus sadarboties ar Krieviju, eksportēt uz to un importēt no tās. Pārbaudāms: iznākums (ierobežojumi atcelti vai mīkstināti) notiek vai nē. Liela daļa ierobežojumu ir ES sankcijas, kas nav nacionālā kompetencē; tāpēc ierosinātais kritērijs (redaktoram apstiprināt): „izpildīts” = pilnvaru laikā atcelti Latvijas nacionālie sadarbības, eksporta vai importa ierobežojumi ar Krieviju vai Latvija ES līmenī oficiāli iestājas par ES sankciju atcelšanu (piem., nebalso par to pagarināšanu); „daļēji izpildīts” = atcelta vai mīkstināta tikai daļa nacionālo ierobežojumu. Iestāde: ĀM — Starptautisko un Latvijas Republikas nacionālo sankciju likuma 12. pants („Ārlietu ministrija ir koordinējošā iestāde par sankciju noteikšanu Latvijā”), nacionālās sankcijas nosaka Ministru kabinets, arī pēc ārlietu ministra priekšlikuma (3. pants) (likumi.lv/ta/id/280278, redakcija uz 01.04.2026). Nav pārbaudīts, vai daļa nacionālo tirdzniecības ierobežojumu (piem., importa aizliegumi) noteikti citos likumos citu ministriju kompetencē."
