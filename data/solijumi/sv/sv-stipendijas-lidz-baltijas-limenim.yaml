piezimes: "Nav dalīts (§1): uzskaitījums zem viena darbības vārda; „nesamazinot saņēmēju skaitu” — nosacījums, kas ietilpst iznākumā. Pārbaudāms: mērs — Baltijas valstu līmenis; nav precizēts, vai tas nozīmē Igaunijas, Lietuvas vai abu vidējo līmeni, tas redaktoram jānosaka vērtējot. Ekstraktors nav pārbaudījis pašreizējo stipendiju apmēru un veidus. IZM — augstākā izglītība."
