id: sv-bijuso-prezidentu-privilegiju-likvidesana
saraksts: sv
nosaukums: Bijušo Valsts prezidentu privilēģiju likvidēšana
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: saeima
  papildu: []
avoti:
  - veids: cvk
    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "likvidēt visas bijušo prezidentu privilēģijas"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-tautas-velets-prezidents. Pārbaudāms: privilēģijas atceltas vai nē; ja atceltas tikai daļa — daļēji izpildīts („visas”). Avots nenosauc, kuras privilēģijas; spēkā esošais regulējums (kurš likums tās nosaka) nav pārbaudīts. Saeima — regulējums par Valsts prezidentu ir likuma līmenī, un Valsts prezidenta kanceleja nav ministrijas padotībā (§6a); iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
