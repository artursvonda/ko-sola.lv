nesakritiba: ""
piezimes: "Galvenajā teikumā bez -ot daļas paliek vispārīga deklarācija („nodrošināt pieejamu, taisnīgu, uz pacientu orientētu veselības aprūpes sistēmu”) bez mēra, tāpēc Solījums ir -ot daļa; citēts viss teikums (§1). Pārbaudāms: slimnīcu tīkla pārklājums saglabāts (slimnīcas netiek slēgtas vai apvienotas tā, ka pārklājums samazinās) vai nē; robežgadījums — avots nenosaka pārklājuma rādītāju. VM — slimnīcu tīkla plānošana; iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
