avoti:
  - veids: cvk
    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "centralizēt valsts un pašvaldību iepirkumus, atsakoties no nelietderīgiem iepirkumiem (logotipu maiņa u.c.)"
nesakritiba: ""
piezimes: "Nedalīts (§1): „atsakoties no nelietderīgiem iepirkumiem” apraksta mērķi, nevis atsevišķu mērāmu iznākumu (nelietderīgi iepirkumi nav definēti, logotipu maiņa — tikai piemērs). Pārbaudāms (robežgadījums): mēra nav — izpildīts, ja pieņemti lēmumi, kas centralizē valsts un pašvaldību iepirkumus (piem., obligāti centralizēti iepirkumi); esošā centralizācijas pakāpe nav pārbaudīta. Nav apvienots ar sv-vietejas-produkcijas-ipatsvars-iepirkumos (cits iznākums). FM — publisko iepirkumu politika; iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
