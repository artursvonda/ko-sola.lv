piezimes: "Nepārbaudāms: „aktīvi jāveicina”, „jāaizstāv” bez konkrēta pasākuma vai mēra. Abas darbības nedalītas, jo abas ir vispārīgas un attiecas uz vienu iestādi. ĀM — avotā nosaukta un ārējās ekonomiskās attiecības; EM papildu — eksporta atbalsts. Iestāde nav pārbaudīta oficiālā avotā."
