id: sv-mazo-lauku-skolu-saglabasana
saraksts: sv
nosaukums: Mazo lauku skolu saglabāšana, apvienojot administrāciju un mācībspēkus
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [regioni-un-pasvaldibas]
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: "IZGLĪTĪBA, ZINĀTNE, KULTŪRA UN SPORTS"
    citats: "nosargāt mazās lauku skolas, apvienojot administratīvo aparātu un mācībspēku bāzi"
nesakritiba: ""
piezimes: "Nav dalīts (§1): „-ot” daļa apraksta veidu, kā skolas saglabāt. Robežgadījums: skaita vai kritērija nav, bet iznākums konkrēts — mazās lauku skolas netiek slēgtas vai reorganizētas skolu tīkla izmaiņu dēļ; vērtējams pēc skolu tīkla. Alternatīva — Nepārbaudāms. IZM — skolu tīkla kritēriji; skolu dibinātājas lielākoties ir pašvaldības (§6a — ministrija, kas var mainīt regulējumu)."
jautajums: ""
