piezimes: "Pārbaudāms pēc iznākuma (kā sv-pensijas-vecuma-necelsana): vai Saeimas pilnvaru laikā kāds valsts stratēģiskais uzņēmums tika daļēji vai pilnībā privatizēts. Robežgadījums: „stratēģisko uzņēmumu” loks avotā nav definēts. VK — valdības kopējā kompetence, jo kapitāla daļas tur dažādas ministrijas; iestāde nav pārbaudīta oficiālā avotā."
