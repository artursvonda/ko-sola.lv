id: sv-nmpd-un-vugd-apvienosana
saraksts: sv
nosaukums: NMPD un VUGD apvienošana
parbaudams: true
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [veseliba]
iestades:
  galvena: iem
  papildu: [vm]
avoti:
  - veids: cvk
    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "apvienot NMPD un VUGD"
nesakritiba: ""
piezimes: "Punkts dalīts (§1) 3 Solījumos: dienestu apvienošana, aizsardzības budžeta pārdale, papildu finansējums medicīnai un glābšanas dienestiem („nodrošinot …” — konkrēts iznākums, kas var notikt arī bez pārdales). Pārbaudāms: dienesti apvienoti vai nē. Iestāde: VUGD ir IeM, NMPD — VM padotībā; galvenā IeM (glābšanas dienesti — iekšējā drošība), VM papildu. Starpnozaru; alternatīva — VK."
jautajums: ""
