id: sv-uin-pardale-pasvaldibam
saraksts: sv
nosaukums: Lēmums par UIN pārdali par labu pašvaldībām
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [nodokli-un-budzets]
iestades:
  galvena: fm
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "EKONOMIKA"
    citats: "lemt par UIN pārdali par labu pašvaldībām"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-iin-sadale-darbavieta-dzivesvieta. Robežgadījums: „lemt par” — nodoms, līdzīgs „izvērtēsim X” (§2); pārbaudāms, vai jautājums par UIN daļas novirzīšanu pašvaldībām tika izlemts (izvērtēts un pieņemts lēmums). Alternatīva — „izpildīts” tikai tad, ja UIN daļa novirzīta pašvaldībām. FM — nodokļu regulējums; VARAM papildu. Iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
