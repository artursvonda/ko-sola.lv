piezimes: "Robežgadījums: „ierobežojumi” nav nosaukti, bet objekts konkrēts (tālmācības un mājmācības regulējums) — pārbaudāms, vai normatīvajos aktos noteiktie ierobežojumi atcelti vai mīkstināti. Nav dalīts (§1): uzskaitījums zem viena darbības vārda. Ekstraktors nav pārbaudījis, kādi ierobežojumi pašlaik noteikti. IZM — izglītības regulējums."
