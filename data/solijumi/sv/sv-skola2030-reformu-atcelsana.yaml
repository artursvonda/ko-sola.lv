piezimes: "Punkts dalīts (§1), sk. sv-pilnvertigi-macibu-materiali: atcelšana un mācību materiāli var saņemt atšķirīgus statusus. Pārbaudāms: nosaukta konkrēta reforma (Skola2030); „citas skolu reformas” nav nosauktas — vērtē pēc Skola2030. Ekstraktors nav pārbaudījis, kuros normatīvajos aktos (piem., mācību standartos) Skola2030 ieviestais saturs nostiprināts, tāpēc kritērijs „atcelts” redaktoram jāprecizē. IZM — vispārējās izglītības saturs."
