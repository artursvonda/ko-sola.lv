id: sv-ses-ierobezosana-lauksaimniecibas-zeme
saraksts: sv
nosaukums: Saules elektrostaciju parku ierobežošana lauksaimniecības zemēs
parbaudams: true
temas:
  galvena: lauksaimnieciba-un-zivsaimnieciba
  papildu: [energetika]
iestades:
  galvena: zm
  papildu: [kem]
avoti:
  - veids: cvk
    vieta: "EKONOMIKA"
    citats: "veicināt lauksaimniecības zemju lietderīgāku izmantošanu, tostarp ierobežojot to izmantošanu saules elektrostaciju parku izvietošanai"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-zemes-fonda-stiprinasana. Daļā „veicināt lauksaimniecības zemju lietderīgāku izmantošanu” bez -ot daļas paliek vispārīgs darbības vārds, tāpēc Solījums ir -ot daļa (§1). Pārbaudāms: ieviests ierobežojums saules elektrostaciju parkiem lauksaimniecības zemēs vai nē. ZM — lauksaimniecības zeme; KEM papildu — enerģētika. Iestāde nav pārbaudīta oficiālā avotā."
jautajums: ""
