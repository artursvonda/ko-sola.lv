piezimes: "Galvenajā teikumā bez -ot daļas paliek vispārīgs darbības vārds („nodrošināt atbildību”), tāpēc Solījums ir -ot daļa; citēts viss teikums (§1). Kontroles mehānisms un klientu aizsardzība — uzskaitījums zem viena darbības vārda, nedalīts. Pārbaudāms: valsts līmeņa kontroles mehānisms ieviests vai nē. EM — mājokļu politika; iestāde nav pārbaudīta oficiālā avotā."
