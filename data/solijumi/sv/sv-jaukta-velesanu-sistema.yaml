nesakritiba: ""
piezimes: "Punkts dalīts (§1) 4 Solījumos: vēlēšanu sistēma, deputātu skaits, kompensācijas, Valsts kontroles revīzija (atsevišķi darbības vārdi, var būt atšķirīgi statusi). Avots nenosauc, kurām vēlēšanām; punkta turpinājums ir par Saeimu, tāpēc nolasīts kā Saeimas vēlēšanu sistēma. Avots arī nedefinē „jaukto” sistēmu (piem., daļa deputātu vienmandāta apgabalos). Pārbaudāms: Satversmes 6. pants paredz proporcionālas vēlēšanas — sistēmas maiņa (Satversmes un/vai Saeimas vēlēšanu likuma grozījumi) pieņemta vai nē. Vai vajadzīga tautas nobalsošana, nav pārbaudīts. Saeima (§6a)."
