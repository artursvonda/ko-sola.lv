piezimes: "Punkts dalīts (§1), sk. sv-bezmaksas-edinasana-visiem-skoleniem; citēts viss teikums (§3). Pārbaudāms: valsts līdzfinansējums bezmaksas sabiedriskajam transportam visiem skolēniem ieviests vai nē. Ekstraktors nav pārbaudījis pašreizējos skolēnu braukšanas atvieglojumus. SM — sabiedriskā transporta pakalpojumi; skolēnu pārvadājumus, iespējams, organizē arī pašvaldības. Iestāde nav pārbaudīta oficiālā avotā."
