piezimes: "Punkts dalīts (§1), sk. sv-pacientu-lidzmaksajumu-samazinasana. Robežgadījums: „pilnā apjomā” var nozīmēt kompensāciju visām medikamenta reģistrētajām indikācijām vai 100% kompensāciju; avots to nepaskaidro. Pārbaudāms, ja redaktors izvēlas vienu no nozīmēm; alternatīva — Nepārbaudāms. VM — kompensējamo zāļu sistēma."
