id: sv-privatskolu-macibas-mazakumtautibu-valodas
saraksts: sv
nosaukums: Privātskolām iespēja izvēlēties mācības mazākumtautību valodās
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [valoda-kultura-un-mediji]
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: "IZGLĪTĪBA, ZINĀTNE, KULTŪRA UN SPORTS"
    citats: "nodrošināt akadēmisko brīvību privātskolās, izvēloties apmācību arī mazākumtautību valodās ar iespēju turpināt augstāko izglītību valsts valodā"
nesakritiba: ""
piezimes: "Galvenais teikums („nodrošināt akadēmisko brīvību privātskolās”) ir vispārīgs; Solījums ir „-ot” daļa (§1), citēts viss teikums. „ar iespēju turpināt augstāko izglītību valsts valodā” — nosacījums/skaidrojums, nav dalīts. Pārbaudāms: privātskolām tiesības izvēlēties mācību valodu (mazākumtautību valodas) piešķirtas vai nē (regulējuma maiņa). Ekstraktors nav pārbaudījis pašreizējo mācību valodas regulējumu privātskolām. IZM — izglītības regulējums."
jautajums: ""
