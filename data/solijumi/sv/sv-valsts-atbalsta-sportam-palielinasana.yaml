    pamatojums: >-
      Izsludinātais Valsts sporta fonda likums uzliek MK, sagatavojot 2027. gada un turpmākos budžetus,
      plānot vismaz 5 milj. euro gadā sporta fonda mērķiem — formāls solis; valsts atbalsta pieaugums vēl
      nav iekļauts budžeta likumā, tāpēc Procesā, ne Izpildīts (vertesana.md).
