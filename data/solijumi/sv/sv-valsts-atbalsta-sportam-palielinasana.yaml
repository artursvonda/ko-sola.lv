piezimes: "Nav dalīts (§1): „-ot” daļa apraksta veidu, kā atbalstu palielināt. Robežgadījums: mērķa skaitļa nav, bet rādītājs konkrēts (valsts finansējums sportam) — pārbaudāms, vai tas pieaudzis. Alternatīva — Nepārbaudāms. Tēma: sports ietilpst valoda-kultura-un-mediji (data/temas.yaml). IZM — sporta politika; iestāde nav pārbaudīta oficiālā avotā."
