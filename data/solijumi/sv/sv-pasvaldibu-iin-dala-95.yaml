nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-iin-sadale-darbavieta-dzivesvieta. Pārbaudāms: konkrēts mērs (95%). „Atjaunot” norāda uz agrāku proporciju; tās vēsture nav pārbaudīta. FM — pašvaldību finansēšana; VARAM papildu. Iestāde nav pārbaudīta oficiālā avotā."
