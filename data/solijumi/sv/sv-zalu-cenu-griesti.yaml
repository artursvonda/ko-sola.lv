nesakritiba: ""
piezimes: "Punkts dalīts (§1): cenu griesti un farmaceita pakalpojuma maksas atcelšana — atsevišķi darbības vārdi un iznākumi (sk. sv-farmaceita-pakalpojuma-maksas-atcelsana). Pārbaudāms: zāļu cenu griesti noteikti normatīvā vai nē. Avots nenosaka, vai griesti attiecas uz visām zālēm vai tikai kompensējamām; pašreizējais cenu regulējums nav pārbaudīts. VM — zāļu cenu regulējums."
jautajums: ""
