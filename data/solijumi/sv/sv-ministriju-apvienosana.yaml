    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "veikt valsts pārvaldes funkcionālo auditu, pārskatot iestāžu funkcijas un apvienojot atsevišķas ministrijas"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-valsts-parvaldes-funkcionalais-audits; citēts kopā ar galveno darbības vārdu, jo „apvienojot atsevišķas ministrijas” vienu pašu grūti saprast. Pārbaudāms: apvienotas vismaz divas ministrijas (ministriju skaits samazinās) vai nē; avots nenosauc, kuras ministrijas. VK — valsts pārvaldes reforma (§6a)."
