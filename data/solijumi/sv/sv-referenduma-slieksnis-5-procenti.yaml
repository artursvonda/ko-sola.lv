avoti:
  - veids: cvk
    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "samazināt nepieciešamo balsu skaitu referendumu rīkošanai līdz 5% no iepriekšējās Saeimas vēlēšanās nobalsojušo skaita"
nesakritiba: ""
piezimes: "Pārbaudāms: konkrēts mērs (5% no iepriekšējās Saeimas vēlēšanās nobalsojušo). „Balsu skaits referendumu rīkošanai” nolasīts kā parakstu skaits tautas nobalsošanas ierosināšanai; avots nesaka, vai tas attiecas uz visiem referendumu veidiem. Spēkā esošais slieksnis un vai vajadzīgi Satversmes grozījumi — nav pārbaudīts. Saeima (§6a)."
