piezimes: "Pārbaudāms: zelta krājumi atgriezti un glabājas Latvijas Bankā vai nē. „Atgriešana un glabāšana” — viens iznākums, nedalīts. Iestāde: Latvijas Banka ir neatkarīga, tāpēc pēc §6a izvēlēta FM (finanšu sektora regulējums); alternatīva — Saeima (Latvijas Bankas likums). Iestāde nav pārbaudīta oficiālā avotā."
