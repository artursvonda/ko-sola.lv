id: sv-aizsardzibas-budzeta-pardale-iekseja-drosiba
saraksts: sv
nosaukums: Aizsardzības budžeta pārdale iekšējai drošībai un infrastruktūrai
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [iekseja-drosiba-un-tiesiskums, nodokli-un-budzets]
iestades:
  galvena: fm
  papildu: [am, iem]
avoti:
  - veids: cvk
    vieta: "VALSTS PĀRVALDE UN TAUTAS VARA"
    citats: "pārdalīt aizsardzības budžetu iekšējās drošības garantēšanai un infrastruktūrai"
nesakritiba: ""
piezimes: "Punkts dalīts (§1), sk. sv-nmpd-un-vugd-apvienosana. Pārbaudāms: daļa aizsardzības budžeta budžeta likumā pārdalīta iekšējai drošībai un infrastruktūrai vai nē; avots nenosauc apjomu. „Infrastruktūrai” — nav skaidrs, vai iekšējās drošības vai vispārīgai infrastruktūrai. FM — valsts budžets; AM un IeM papildu."
jautajums: ""
