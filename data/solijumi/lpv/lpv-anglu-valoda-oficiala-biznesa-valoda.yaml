piezimes: "CVK punkts dalīts (§1): vispārīgais angļu valodas statuss un tiesības iesniegt VID atskaites angļu valodā (lpv-vid-atskaites-anglu-valoda-arvalstu-uznemumiem) var saņemt atšķirīgus statusus. Robežgadījums: avots nepasaka, ko „oficiālā starptautiskā biznesa valoda” nozīmē juridiski → Pārbaudāms, ja normatīvajos aktos noteikts šāds angļu valodas statuss uzņēmējdarbībā; alternatīva — Nepārbaudāms vai apvienot ar VID atskaišu Solījumu (otrais teikums kā vienīgais konkrētais iznākums). Paplašinātajā programmā atbilstoša punkta nav. Iestāde nav pārbaudīta: valsts valodas politika (Valsts valodas likums) → pieņemts IZM; uzņēmējdarbības vide → EM (papildu); alternatīva — TM."
