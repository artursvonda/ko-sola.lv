id: lpv-ierednu-efektivitates-raditaji-kpi
saraksts: lpv
nosaukums: Izmērāmi darba efektivitātes rādītāji (KPI) ierēdņiem
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: vk
  papildu: []
avoti:
  - veids: cvk
    vieta: EFEKTĪVA VALSTS PĀRVALDE
    citats: noteiksim skaidrus, izmērāmus un uz valsts izaugsmi vērstus darba efektivitātes rādītājus ierēdņiem
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Strukturālās reformas
    citats: "KPI ieviešana: Visiem ierēdņiem nodefinēti īsti un pierādāmi veiktspējas indikatori, kuri ir vērsti uz attīstību"
nesakritiba: ""
piezimes: "Abi avoti sola to pašu iznākumu (§4); „visiem” paplašinātajā programmā — precizējums, ne cits apjoms, tāpēc Nesakritības nav. Pārbaudāms: rādītāji noteikti un piemēroti ierēdņiem vai nē. Ekstraktors nav pārbaudījis, kāda darba izpildes novērtēšanas sistēma valsts pārvaldē jau pastāv; vērtējot jānosaka, kas ir jauns. Nav apvienots ar lpv-termineti-ligumi-iestazu-vadibai-kpi (KPI tur ir nosacījums iestāžu vadības līgumu pagarināšanai — cits iznākums). Iestāde nav pārbaudīta: valsts pārvaldes cilvēkresursu politika → VK."
jautajums: ""
