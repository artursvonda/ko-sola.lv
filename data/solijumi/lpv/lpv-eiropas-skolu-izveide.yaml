piezimes: "Dalīts no reemigrācijas punkta uzskaitījuma (§1). Pārbaudāms robežgadījumā: skolas izveidotas vai nē; skaits nav norādīts. Ekstraktors nezina, vai \"Eiropas skolas\" nozīmē Eiropas skolu sistēmas akreditētas skolas. Nav apvienots ar lpv-anglu-valodas-skolu-izveide (6. nod. — ārvalstnieku ģimenēm, cits iznākums). Iestāde nav pārbaudīta: IZM."
