nesakritiba: ""
piezimes: 'Dalīts no veselīga dzīvesveida veicināšanas (sk. lpv-veseliga-dzivesveida-veicinasana). Nepārbaudāms: "atbalstīsim" bez konkrēta pasākuma vai mēra. Tēma: sports → valoda-kultura-un-mediji (pēc data/temas.yaml), papildu veseliba. Paplašinātās 6. nod. sporta objekti (stadions, Siguldas trase, slēpošanas kūrorts) — konkrēti lielie objekti, nav tautas sports → nav tas pats Solījums (§0.3). Iestāde nav pārbaudīta: sporta politika → IZM.'
jautajums: ""
