    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Nozaru specifiskie uzlabojumi un ārējā ekonomika
    citats: Vēstnieks ir galvenais atbildīgais par ekonomisko attiecību veicināšanu. Vēstniecībām primāri ir jānodarbojas ar Latvijas eksporta veicināšanu, nevis reprezentatīviem un tehniskiem konsulāriem jautājumiem
nesakritiba: ""
piezimes: "Divi teikumi par vienu iznākumu (vēstnieka atbildība un vēstniecību prioritāte — eksports un ekonomiskās attiecības) → viens Solījums. Robežgadījums: Pārbaudāms, ja vēstnieku un vēstniecību uzdevumi formāli noteikti (normatīvi vai ĀM lēmumā), kā lpv-ekonomikas-ministrs-atbildigs-par-inovacijam; alternatīva — Nepārbaudāms („primāri” bez mēra). Darbinieku piesaiste — atsevišķs Solījums (lpv-vestniecibas-juristi-un-uznemeji). Iestāde nav pārbaudīta: ĀM."
jautajums: ""
