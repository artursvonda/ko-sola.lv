id: lpv-administrativo-atbalsta-funkciju-centralizacija
saraksts: lpv
nosaukums: Valsts iestāžu administratīvo atbalsta funkciju centralizēšana
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: vk
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Kompakta, moderna un izmaksu efektīva valsts pārvalde
    citats: Veikt ātru valsts iestāžu auditu funkciju dublēšanās novēršanai un administratīvo atbalsta funkciju centralizēšanai
nesakritiba: ""
piezimes: "Atdalīts no lpv-valsts-iestazu-funkciju-audits (§1): centralizēšanai ir savs iznākums, kas var notikt vai nenotikt neatkarīgi no audita; daļai nav sava darbības vārda → citēts teikums līdz attiecīgajai daļai (§3). Robežgadījums: funkcijas nav nosauktas → Pārbaudāms kā „vai administratīvās atbalsta funkcijas centralizētas plašāk nekā vēlēšanu dienā”; alternatīva — Nepārbaudāms. Ekstraktors nav pārbaudījis, kas jau centralizēts. Iestāde nav pārbaudīta: VK."
jautajums: ""
