piezimes: 'Pārbaudāms (§2: "iestāsimies par X", X konkrēts). Solītais ir Latvijas atbalsts — vērtē Latvijas valdības pozīcijas un balsojumus ES par Ukrainas iestāšanās procesu, ne to, vai Ukraina iestājas ES Vērtēšanas periodā (to Latvija viena nevar panākt). Iestāde nav pārbaudīta: ES paplašināšanās — ārpolitika → ĀM (§6a izņēmums).'
