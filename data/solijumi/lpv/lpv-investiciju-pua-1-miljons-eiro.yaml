id: lpv-investiciju-pua-1-miljons-eiro
saraksts: lpv
nosaukums: "Investīciju PUA par 1 milj. eiro ar 50% ziedojumu bērnu dzimstības fondā"
parbaudams: true
temas:
  galvena: migracija-un-diaspora
  papildu: [gimenes-un-demografija, ekonomika-un-darbs]
iestades:
  galvena: iem
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "ĢIMEŅU ATBALSTS UN KRISTĪGĀS VĒRTĪBAS"
    citats: "PUA saņems katrs investors, kurš Latvijā ieguldīs vismaz 1 milj. eiro, 50% investējot nekustamajā īpašumā vai uzņēmuma kapitālā, bet 50% ziedojot valsts izveidotā bērnu dzimstības veicināšanas fondā"
  - veids: paplasinata
    vieta: "2. Demogrāfija un Darbaspēks › Demogrāfiskie un investīciju stimuli"
    citats: "“Investīciju PUA” modelis ar 1 000 000 eiro paketi, kurā 500 000 eiro tiek investēti nekustamajā īpašumā vai uzņēmuma kapitālā, bet 500 000 eiro – novirzīti tiešam ziedojumam valsts fondā bērnu dzimstības un daudzbērnu ģimeņu atbalstam"
nesakritiba: ""
piezimes: "Abi avoti sola to pašu modeli (1 milj. eiro, 50/50 ieguldījums un ziedojums valsts fondā) → viens Solījums. Valsts fonda izveide ir modeļa daļa, nav dalīta. Fonda mērķa formulējuma atšķirība (\"bērnu dzimstības veicināšanas\" ↔ \"bērnu dzimstības un daudzbērnu ģimeņu atbalstam\") PUA iznākumu nemaina → nav Nesakritība. Tēma pēc tā, ko maina lasītājam — uzturēšanās atļaujas (§6). Iestāde nav pārbaudīta: uzturēšanās atļaujas (Imigrācijas likums) → IeM; fonds → FM (papildu)."
jautajums: ""
