piezimes: "\"pasargājot bērnus …\", \"audzinot tos …\" — mērķis, nenosauc atsevišķu darbību ar savu iznākumu → nedala (§1). Pārbaudāms: konvencija denonsēta vai nē. Ekstraktors nav pārbaudījis izstāšanās procesa pašreizējo stāvokli. Iestāde nav pārbaudīta: izstāšanos no starptautiska līguma nosaka Saeimas pieņemts likums → Saeima (alternatīvas — ĀM kā starptautisko līgumu procedūras atbildīgā vai LM kā konvencijas īstenošanas atbildīgā)."
