piezimes: "Atdalīts no lpv-anglu-valoda-oficiala-biznesa-valoda (§1). Pārbaudāms: tiesības noteiktas normatīvajos aktos vai nē. Avots nepasaka, vai „ārvalstu uzņēmumi” ietver arī Latvijā reģistrētus ārvalstu kapitāla uzņēmumus. Paplašinātajā programmā atbilstoša punkta nav (VID modernizācija — cits iznākums). Iestāde nav pārbaudīta: VID → FM."
