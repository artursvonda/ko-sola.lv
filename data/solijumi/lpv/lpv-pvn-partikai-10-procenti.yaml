id: lpv-pvn-partikai-10-procenti
saraksts: lpv
nosaukums: "Samazinātā PVN likme 10% plašākam pārtikas produktu klāstam"
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: cvk
    vieta: "VALSTS ATTĪSTĪBA › Zemi un stabili nodokļi"
    citats: "Samazināsim PVN likmi apkurei, plašākam pārtikas produktu klāstam, bērnu higiēnas un zīdaiņu precēm, tūrisma un ēdināšanas nozarēm līdz 10%"
  - veids: paplasinata
    vieta: "1. Nodokļi un Pensijas › Mazāki nodokļi – lielākie ienākumi"
    citats: "Samazināta PVN likme plašākam pārtikas produktu klāstam"
  - veids: paplasinata
    vieta: "1. Nodokļi un Pensijas › Mazāki nodokļi – lielākie ienākumi"
    citats: "Nepieciešams piemērot samazināto 12% likmi nevis uz noteiktu periodu (piemēram, vienu gadu, kā tas ir šobrīd), bet gan pastāvīgi"
nesakritiba: "CVK sola PVN likmi plašākam pārtikas produktu klāstam līdz 10%; paplašinātā programma — samazināto 12% likmi piemērot pastāvīgi."
piezimes: "Paplašinātā programma CVK PVN teikumu sadala atsevišķos punktos (pārtika; tūrisms un ēdināšana) → seko dalījumam, CVK citāts katrā Solījumā (§4). Vērtē pēc CVK (10%). Punkta daļa \"ātra rīcība krīzes gadījumos\" / \"nodrošināt spēju ātri reaģēt krīzes situācijās\" — bez konkrēta iznākuma, nav atsevišķs Solījums. Iestāde nav pārbaudīta: FM."
