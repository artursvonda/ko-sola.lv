nesakritiba: ""
piezimes: "Dalīts no obligātā finanšu un uzņēmējdarbības pratības kursa (lpv-obligats-finansu-pratibas-kurss-skolas) — cits iznākums. Citāts tāds pats kā kursa Solījumā (daļām kopīgs darbības vārds, §3). Paplašinātajā programmā atbilstības nav. Pārbaudāms: normatīva izmaiņa (vidējā izglītība obligāta vai nē). Iestāde nav pārbaudīta: IZM."
