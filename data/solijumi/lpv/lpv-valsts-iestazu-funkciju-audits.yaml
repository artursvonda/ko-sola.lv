nesakritiba: ""
piezimes: "Nodaļas ievada pirmais teikums ir apņemšanās (ne tikai vīzija) → izrakstīts. Abi punkti sola to pašu iznākumu — valsts iestāžu (funkciju) auditu (§4). Mērķi atšķiras: ievadā — „lai prioritāri kāpinātu atalgojumu” medicīnas, izglītības un drošības darbiniekiem (atsevišķs Solījums lpv-prioritars-atalgojums-medicinai-izglitibai-drosibai), sadaļā „Kompakta …” — lai samazinātu uzturēšanas izmaksas un „pārvirzītu budžeta prioritāti no atalgojuma uz mērķtiecīgu attīstību”; tas ir pamatojums, ne iznākums, tāpēc nav Nesakritībā (§4), bet redaktoram jāzina. „grupēšana” — iestāžu apvienošana, ietverta lpv-valsts-iestazu-un-ministriju-apvienosana. Administratīvo atbalsta funkciju centralizēšana — atsevišķs Solījums (lpv-administrativo-atbalsta-funkciju-centralizacija). „vienlaikus mazinot manuālo darbu ar modernām tehnoloģijām” — veids, nedala. Pārbaudāms: audits veikts vai nē. Iestāde nav pārbaudīta: valsts pārvaldes funkciju izvērtēšana → VK."
