avoti:
  - veids: paplasinata
    vieta: "7. Startup un Innovācijas › Jaunuzņēmumu un starptautiskās konkurētspējas stiprināšana"
    citats: "Mazināt riskus un birokrātiju agrīnajā uzņēmējdarbības posmā, ieviešot atvieglotus aizdevumus, nodokļu stimulus “biznesa eņģeļiem” (IIN atvieglojumus un atbrīvojumu kapitāla pieaugumam), izveidojot vienotu birokrātijas navigatoru, kā arī pieļaujot daļas 2. un 3. līmeņa pensiju fondu līdzekļu ieguldīšanu šajā sektorā"
nesakritiba: ""
piezimes: "Galvenā daļa (\"mazināt riskus un birokrātiju\") vispārīga → Solījumi ir \"-ot\" daļas (§1), citēts teikums līdz attiecīgajai daļai. \"ieviešot atvieglotus aizdevumus\" — bez konkrēta mēra, nav atsevišķs Solījums. Iestāde nav pārbaudīta: pensiju fondu ieguldījumu regulējums → FM; 2. līmenis → LM (papildu)."
