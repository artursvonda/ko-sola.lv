id: lpv-pensiju-fondu-ieguldijumi-jaunuznemumos
saraksts: lpv
nosaukums: "Atļauja daļu 2. un 3. pensiju līmeņa līdzekļu ieguldīt jaunuzņēmumos"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [socialais-atbalsts-un-pensijas]
iestades:
