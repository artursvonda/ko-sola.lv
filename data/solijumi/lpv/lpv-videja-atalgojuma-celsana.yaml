avoti:
  - veids: cvk
    vieta: VESELĪBA UN LABKLĀJĪBA
    citats: Veicinot ekonomiku, celsim vidējo atalgojumu valstī un pensijas
nesakritiba: ""
piezimes: 'Teikums dalīts: vidējais atalgojums un pensijas — atšķirīgi iznākumi un iestādes, statusi var atšķirties (§1); daļām nav sava darbības vārda → citēts viss teikums (§3). "Veicinot ekonomiku" — veids, nedala. Robežgadījums: mēra nav, bet vidējais atalgojums ir izmērāms (pieaudzis vai nē) → Pārbaudāms; nav norādīts, vai domāts nominālais vai reālais pieaugums — redaktoram. Paplašinātās programmas ievada teikums ("reformas, kas prioritāri cels cilvēku algas") — ievads (§1), nav citēts. Iestāde nav pārbaudīta: tautsaimniecības politika → EM.'
jautajums: ""
