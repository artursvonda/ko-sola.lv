nesakritiba: ""
piezimes: "Nepārbaudāms: „efektīva apguve” un „nepieļaujot līdzekļu izšķērdēšanu” bez mēra (apguves apjoma vai termiņa). „nepieļaujot līdzekļu izšķērdēšanu” — veids, nedala. Nav apvienots ar paplašinātās 3. nod. ES fondu punktiem (lpv-es-fondu-proceduru-vienkarsosana, lpv-es-fondu-uzraudzibas-vienas-pieturas-agentura, lpv-es-fondu-strategija-obligata-pieteiksanas, lpv-pieteikumu-fonds-es-programmam): tie sola konkrētus instrumentus — cits iznākums (§4), kā norādīts jau iepriekšējā izpildē. Iestāde nav pārbaudīta: ES fondu vadība → FM."
jautajums: ""
