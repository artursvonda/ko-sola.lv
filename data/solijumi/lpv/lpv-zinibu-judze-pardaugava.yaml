    citats: "Zinības jūdzē Pārdaugavā, vienots tēls un infrastruktūra. Veicināt ciešāku sinerģiju starp universitātēm, attīstot koplietojamu zinātnes bibliotēku, modernu sporta stadionu un kopmītņu tīklu"
