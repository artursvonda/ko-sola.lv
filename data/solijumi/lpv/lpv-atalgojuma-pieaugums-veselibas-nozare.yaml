  - veids: cvk
    vieta: VESELĪBA UN LABKLĀJĪBA
    citats: veicināsim atalgojuma pieaugumu veselības nozarē
nesakritiba: ""
piezimes: 'Dalīts no finansējuma palielināšanas (sk. lpv-lielaks-finansejums-medicinas-aprupei). Robežgadījums: "veicināsim", bet objekts konkrēts (atalgojums veselības nozarē) un pieaugums izmērāms → Pārbaudāms (§2: X panākts vai nē); alternatīva — Nepārbaudāms. Paplašinātās 8. nod. ievada teikums ("Veiksim valsts iestāžu auditēšanu un grupēšanu, lai prioritāri kāpinātu atalgojumu un uzlabotu darba apstākļus medicīnas, izglītības un drošības jomu darbiniekiem") nav pievienots: tas ir nodaļas ievads, aptver arī izglītības un drošības darbiniekus un sola citu mehānismu (auditu un grupēšanu) → nav tas pats Solījums (§0.3), atstāts nodaļai EFEKTĪVA VALSTS PĀRVALDE (tāpat kā lpv-cienigs-atalgojums-drosibas-strukturas). Iestāde nav pārbaudīta: VM.'
jautajums: ""
