piezimes: 'Pārbaudāms: atalgojuma pieaugums izmērāms (§2), lai gan mērs nav norādīts. "Lai nodrošinātu izglītības kvalitāti" — mērķis, nav citēts. Paplašinātās 8. nod. ievada teikums ("Veiksim valsts iestāžu auditēšanu un grupēšanu, lai prioritāri kāpinātu atalgojumu un uzlabotu darba apstākļus medicīnas, izglītības un drošības jomu darbiniekiem") nav pievienots: tas ir nodaļas ievads, aptver arī medicīnas un drošības darbiniekus un sola citu mehānismu → nav tas pats Solījums (§0.3), atstāts nodaļai EFEKTĪVA VALSTS PĀRVALDE (tāpat kā lpv-atalgojuma-pieaugums-veselibas-nozare, lpv-cienigs-atalgojums-drosibas-strukturas). Iestāde nav pārbaudīta: IZM.'
jautajums: ""
