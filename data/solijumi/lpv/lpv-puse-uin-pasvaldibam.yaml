piezimes: "\"Lai veicinātu reģionu attīstību\" — mērķis, nav citēts. Iestāde nav pārbaudīta: nodokļu ieņēmumu sadale starp valsti un pašvaldībām → FM; pašvaldību finanšu politika → VARAM (papildu)."
