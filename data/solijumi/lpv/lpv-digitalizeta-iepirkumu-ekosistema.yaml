id: lpv-digitalizeta-iepirkumu-ekosistema
saraksts: lpv
nosaukums: Pilnībā digitalizēta publisko iepirkumu ekosistēma ar automātisku vērtēšanu
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: fm
  papildu: [varam]
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Pārvaldes efektivitāte un digitalizācija
    citats: Pāreja uz pilnībā digitalizētu ekosistēmu, kas automātiski vērtē pretendentu reputāciju, dzīves cikla izmaksas un līgumu izpildes kvalitāti reāllaikā
nesakritiba: ""
piezimes: "Atdalīts no lpv-publisko-iepirkumu-reformas-pabeigsana (§1). Pārbaudāms: sistēma, kas automātiski vērtē pretendentu reputāciju, dzīves cikla izmaksas un līgumu izpildi, ieviesta vai nē; trīs vērtējuma elementi nav dalīti (viena sistēma). Iestāde nav pārbaudīta: publisko iepirkumu politika → FM; elektronisko iepirkumu sistēmas uzturēšana, iespējams, VARAM padotībā (papildu)."
jautajums: ""
