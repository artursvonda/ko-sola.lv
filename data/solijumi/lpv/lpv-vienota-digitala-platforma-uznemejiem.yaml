id: lpv-vienota-digitala-platforma-uznemejiem
saraksts: lpv
nosaukums: Vienota tiešsaistes platforma visām uzņēmēju vajadzībām
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
iestades:
  galvena: varam
  papildu: [em]
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Pārvaldes efektivitāte un digitalizācija
    citats: "Vienota digitālā ekosistēma uzņēmējiem: Izveidosim vienu “online” platformu visām uzņēmēju vajadzībām"
nesakritiba: ""
piezimes: "Pārbaudāms: platforma izveidota vai nē. Nākamais teikums (MI vadīta datu nolasīšana no valsts reģistriem, palīdzība iesniegumu aizpildīšanā, dokumentu aprite starp iestādēm) — platformas apraksts, nav dalīts. Nav apvienots ar lpv-vienots-birokratijas-navigators (7. nod., jaunuzņēmumiem) — šaurāks, cits iznākums; alternatīva — apvienot. Ekstraktors nav pārbaudījis, cik lielā mērā esošie valsts portāli to jau nodrošina. Iestāde nav pārbaudīta: valsts digitālie pakalpojumi → VARAM; uzņēmējdarbības vide → EM (papildu)."
jautajums: ""
