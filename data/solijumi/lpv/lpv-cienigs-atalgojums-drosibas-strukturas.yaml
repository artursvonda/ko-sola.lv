id: lpv-cienigs-atalgojums-drosibas-strukturas
saraksts: lpv
nosaukums: Cienīgs atalgojums drošības struktūrās strādājošajiem
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [aizsardziba]
iestades:
  galvena: iem
  papildu: [am]
avoti:
  - veids: cvk
    vieta: DROŠĪBA
    citats: Drošības struktūrās strādājošie saņems cienīgu atalgojumu par savu darbu
nesakritiba: ""
piezimes: 'Atsevišķs teikums ar savu apgalvojumu → atsevišķs Solījums no vienotās atalgojuma sistēmas (atalgojuma līmenis ↔ sistēmas vienotība). Nepārbaudāms: "cienīgs" bez mēra vai salīdzinājuma bāzes. Paplašinātās 8. nod. ievada teikums ("Veiksim valsts iestāžu auditēšanu un grupēšanu, lai prioritāri kāpinātu atalgojumu … drošības jomu darbiniekiem") nav pievienots: tas aptver arī medicīnas un izglītības darbiniekus un sola citu mehānismu → nav tas pats Solījums (§0.3), atstāts nodaļai EFEKTĪVA VALSTS PĀRVALDE. Iestāde nav pārbaudīta: drošības struktūras — galvenokārt IeM dienesti, militārpersonas — AM (papildu).'
jautajums: ""
