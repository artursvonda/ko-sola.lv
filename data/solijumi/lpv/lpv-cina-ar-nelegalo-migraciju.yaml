piezimes: 'Nepārbaudāms: "bezprecedenta cīņu" bez konkrēta pasākuma vai mēra. "lai Latvijas robežas būtu drošas" — mērķis, nav citēts. Tēma: robeža → iekseja-drosiba-un-tiesiskums (§6); imigrācija → migracija-un-diaspora (papildu); alternatīva — migracija-un-diaspora kā galvenā. Iestāde nav pārbaudīta: robežsardze un imigrācijas regulējums → IeM.'
