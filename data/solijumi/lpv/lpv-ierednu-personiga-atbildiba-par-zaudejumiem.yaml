id: lpv-ierednu-personiga-atbildiba-par-zaudejumiem
saraksts: lpv
nosaukums: Ierēdņu personīgā atbildība par zaudējumiem nolaidības dēļ
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: vk
  papildu: [tm]
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Strukturālās reformas
    citats: Stingra individuālā atbildība par nepamatotu lēmumu vilcināšanu vai bezdarbību, ieviešot “personīgās atbildības principu” gadījumos, kad valstij vai uzņēmējiem tiek radīti zaudējumi ierēdņa nolaidības dēļ
nesakritiba: ""
piezimes: "Pārbaudāms: „personīgās atbildības princips” ieviests normatīvajos aktos vai nē. Ekstraktors nav pārbaudījis, kāda amatpersonu atbildība par zaudējumiem jau pastāv; vērtējot jānosaka, kas ir jauns. Iestāde nav pārbaudīta: valsts civildienests un disciplinārā atbildība → VK; zaudējumu atlīdzināšanas regulējums → TM (papildu)."
jautajums: ""
