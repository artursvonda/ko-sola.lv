avoti:
  - veids: cvk
    vieta: VESELĪBA UN LABKLĀJĪBA
    citats: Attīstīsim medicīnas tūrismu, piesaistot ārvalstu pacientus
nesakritiba: ""
piezimes: '"piesaistot ārvalstu pacientus" — apraksta veidu (medicīnas tūrisma būtība), nedala (§1). Nepārbaudāms: "attīstīsim" bez mēra. Tēma: ko maina lasītājam — pakalpojumu eksports/tūrisms → ekonomika-un-darbs, papildu veseliba. Paplašinātās 6. nod. (tūrisms) medicīnas tūrisms nav minēts → nav paplašinātās avota. Iestāde nav pārbaudīta: tūrisma un eksporta veicināšana → EM; veselības pakalpojumu sniedzēji → VM (papildu); alternatīva — VM galvenā.'
jautajums: ""
