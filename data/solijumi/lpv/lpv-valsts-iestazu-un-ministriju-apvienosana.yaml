id: lpv-valsts-iestazu-un-ministriju-apvienosana
saraksts: lpv
nosaukums: Valsts iestāžu un ministriju apvienošana
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: vk
  papildu: []
avoti:
  - veids: cvk
    vieta: EFEKTĪVA VALSTS PĀRVALDE
    citats: apvienosim valsts iestādes un ministrijas
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Kompakta, moderna un izmaksu efektīva valsts pārvalde
    citats: Īstenosim valsts pārvaldes reformu, apvienojot iestādes ar radniecīgām funkcijām
nesakritiba: CVK sola apvienot valsts iestādes un ministrijas; paplašinātā programma — apvienot iestādes ar radniecīgām funkcijām, ministrijas nenosaucot.
piezimes: "CVK teikums dalīts (§1): apvienošana un efektivitātes rādītāji ierēdņiem (lpv-ierednu-efektivitates-raditaji-kpi) — atšķirīgi iznākumi, katram savs darbības vārds. „Lai samazinātu birokrātiju un izdevumus valsts pārvaldē” — mērķis. Paplašinātās „Īstenosim valsts pārvaldes reformu” — vispārīgs, Solījums ir „-ot” daļa (§1). Robežgadījums: nav nosaukts, kuras iestādes un ministrijas → Pārbaudāms kā „vai valsts iestādes un ministrijas apvienotas (to skaits samazinājies)”; alternatīva — Nepārbaudāms. Konkrētas apvienošanas ir atsevišķi Solījumi ar savu iznākumu: lpv-iem-un-am-apvienosana (CVK DROŠĪBA), lpv-kp-sprk-ptac-apvienosana, lpv-valsts-nekustamo-ipasumu-parvaldibas-centralizacija, lpv-liaa-rita-turisma-funkciju-apvienosana. Iestāde nav pārbaudīta: valsts pārvaldes reforma → VK (§6a)."
jautajums: ""
