piezimes: "Atdalīts no lpv-vestniecibu-galvenais-uzdevums-eksports (§1): darbinieku piesaiste var notikt vai nenotikt neatkarīgi no uzdevumu maiņas. Robežgadījums: skaits nav norādīts → Pārbaudāms kā „vai vēstniecībās papildus piesaistīti šādi darbinieki”; alternatīva — Nepārbaudāms. Iestāde nav pārbaudīta: ĀM."
