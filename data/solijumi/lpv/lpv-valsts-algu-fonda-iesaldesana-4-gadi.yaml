id: lpv-valsts-algu-fonda-iesaldesana-4-gadi
saraksts: lpv
nosaukums: Valsts iestāžu un kapitālsabiedrību algu fonda iesaldēšana uz 4 gadiem
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [valsts-parvalde]
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Pārvaldes efektivitāte un digitalizācija
    citats: "Resursu iesaldēšana: Uz 4 gadiem tiek iesaldēts visu valsts iestāžu un kapitālsabiedrību algu fonds. Pieaugums iespējams tikai caur funkciju auditu un štatu optimizāciju"
nesakritiba: ""
piezimes: "Pārbaudāms: algu fonds četrus gadus nav palielināts, izņemot no funkciju audita un štatu optimizācijas. Otrais teikums ir nosacījums, kas nosaka vērtēšanu → iekļauts citātā (§3). Iespējama spriedze ar lpv-prioritars-atalgojums-medicinai-izglitibai-drosibai un CVK atalgojuma Solījumiem (veselība, pedagogi, drošības struktūras), ja šo darbinieku algas maksā valsts iestādes vai kapitālsabiedrības — avots to neskaidro; Nesakritība nav ierakstīta, jo tie ir citi Solījumi. Iestāde nav pārbaudīta: valsts budžets un atlīdzība → FM; kapitālsabiedrību atlīdzību ietekmē arī kapitāla daļu turētāji (nozaru ministrijas)."
jautajums: ""
