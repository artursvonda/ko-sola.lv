id: lpv-majokla-atbalsts-gimenem-no-pua-ziedojumiem
saraksts: lpv
nosaukums: "Atbalsts ģimenēm ar bērniem jauna mājokļa iegūšanai no PUA ziedojumiem"
parbaudams: true
temas:
  galvena: majokli
  papildu: [gimenes-un-demografija]
iestades:
  galvena: em
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "ĢIMEŅU ATBALSTS UN KRISTĪGĀS VĒRTĪBAS"
    citats: "palīdzēsim Latvijas ģimenēm ar bērniem iegūt jaunu mājokli. Atbalsts tiks nodrošināts caur ziedojumiem, ko valsts iegūs no pastāvīgo uzturēšanās atļauju (PUA) programmas"
nesakritiba: ""
piezimes: "CVK punkts sadalīts 2 Solījumos: mājokļa atbalsts ģimenēm (šis) un PUA programma ar ziedojumu fondā (lpv-investiciju-pua-1-miljons-eiro) — statuss var atšķirties (PUA programma var būt ieviesta, bet mājokļa atbalsts no fonda — nē). \"Lai veicinātu bērnu dzimstību\" — mērķis. Robežgadījums: mēra nav, bet nosaukts konkrēts mehānisms (mājokļa atbalsts no PUA ziedojumiem) → Pārbaudāms. Paplašinātās programmas PUA punktā fonda mērķis ir \"bērnu dzimstības un daudzbērnu ģimeņu atbalstam\", mājoklis nav minēts → paplašinātās citāts šeit nav pievienots. Iestāde nav pārbaudīta: mājokļu politika → EM; ģimeņu atbalsts → LM (papildu)."
jautajums: ""
