id: lpv-degvielas-cenu-stabilizesanas-mehanismi
saraksts: lpv
nosaukums: "Degvielas cenu stabilizēšanas mehānismi (degviela ne dārgāka kā Lietuvā)"
parbaudams: true
temas:
  galvena: energetika
  papildu: [ekonomika-un-darbs, nodokli-un-budzets]
iestades:
  galvena: em
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "VALSTS ATTĪSTĪBA › Zemi un stabili nodokļi"
    citats: "Izstrādāsim mehānismus degvielas cenu stabilizēšanai"
  - veids: paplasinata
    vieta: "5. Enerģētika un dabas resursu suverenitāte › Enerģētiskā neatkarība un cenu pieejamība"
    citats: "Izstrādāt mehānismus degvielas cenu stabilizēšanai, novēršot situāciju, kad Latvijā degviela ir dārgāka nekā Lietuvā"
nesakritiba: "CVK sola izstrādāt degvielas cenu stabilizēšanas mehānismus bez mēra; paplašinātā programma pievieno mēru — lai degviela Latvijā nebūtu dārgāka nekā Lietuvā."
piezimes: "Paplašinātās 5. nod. punkts ir šīs izpildes nodaļa. CVK citātā nav mēra, paplašinātajā ir → vērtē pēc tā (§4). Divi CVK teikumi ar saviem darbības vārdiem → atsevišķi Solījumi (akcīzes elastība — sk. lpv-elastiga-akcizes-pieeja-krizes). Iestāde nav pārbaudīta: degvielas tirgus → EM; akcīzes nodoklis → FM (papildu); iespējama arī KEM."
jautajums: ""
