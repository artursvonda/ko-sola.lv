piezimes: "Galvenā daļa („tiks nojaukti … torņi”) — metafora → Solījums ir „-ot” daļa, citēts teikums līdz tai (§1). „nodrošinot, lai neviens darbinieks/ierēdnis nebūtu neaizvietojams, un paplašinātu redzējumu” — mērķis, nedala. Pārbaudāms: obligāta rotācija noteikta un piemērota vai nē. Iestāde nav pārbaudīta: valsts civildienests → VK."
