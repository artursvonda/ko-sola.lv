piezimes: "„izmantojot MI dokumentu automatizācijai” — veids, nedala; MI lietošana — lpv-mi-asistenti-valsts-parvalde-pasvaldibas. Pārbaudāms: normatīvi noteiktais termiņš samazināts līdz 10 darba dienām vai nē. Avots nenosauc, kuri „oficiālie dokumenti” domāti. Iestāde nav pārbaudīta: iesniegumu izskatīšanas termiņu regulējums → pieņemts VK; alternatīva — TM."
