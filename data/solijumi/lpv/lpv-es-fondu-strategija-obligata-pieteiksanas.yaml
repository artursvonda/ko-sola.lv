piezimes: "Nepārbaudāms robežgadījumā: avots nenosaka, kam pieteikšanās obligāta, un nedod mēru (minēts tikai, ka Latvija piesakās divreiz mazāk nekā pārējās Baltijas valstis). Ja stratēģija ir konkrēts dokuments — varētu būt pārbaudāms. Iestāde nav pārbaudīta: ES fondu vadība → FM; Horizon Europe → IZM (papildu); CEF, LIFE, Interreg — citas ministrijas."
