id: lpv-kp-sprk-ptac-apvienosana
saraksts: lpv
nosaukums: Konkurences padomes, SPRK un PTAC apvienošana vienā iestādē
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Kompakta, moderna un izmaksu efektīva valsts pārvalde
    citats: Apvienot Konkurences Padomi, Sabiedrisko pakalpojumu regulēšanas komisiju un Patērētāju tiesību aizsardzības centrs vienā iestādē, kas strādā pēc vienas pieturas aģentūras principa
nesakritiba: ""
piezimes: "Atdalīts no vispārīgās iestāžu apvienošanas (lpv-valsts-iestazu-un-ministriju-apvienosana): konkrēts iznākums ar nosauktām iestādēm, statuss var atšķirties (§1). Nav apvienots ar lpv-sprk-proaktiva-cenu-prognozesana (5. nod.) — cits iznākums. Pārbaudāms: trīs iestādes apvienotas vai nē. Iestāde nav pārbaudīta: Konkurences padome un PTAC — pieņemts, ka EM pārraudzībā; SPRK — likumā noteikta neatkarīga iestāde (§6a: ministrija, kas var mainīt regulējumu) → EM; alternatīva — Saeima."
jautajums: ""
