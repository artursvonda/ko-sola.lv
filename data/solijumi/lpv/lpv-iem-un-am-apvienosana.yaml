id: lpv-iem-un-am-apvienosana
saraksts: lpv
nosaukums: Iekšlietu un Aizsardzības ministriju apvienošana
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [aizsardziba, iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: vk
  papildu: [am, iem]
avoti:
  - veids: cvk
    vieta: DROŠĪBA
    citats: Apvienosim Iekšlietu un Aizsardzības ministrijas
nesakritiba: ""
piezimes: 'Teikums dalīts (§1): ministriju apvienošana un vienotā atalgojuma sistēma (lpv-vienota-atalgojuma-sistema-drosibas-dienestiem) var saņemt atšķirīgus statusus. "lai garantētu valsts drošību" — mērķis, nav atsevišķs Solījums. Pārbaudāms: iestāžu apvienošana. Tēma: ministriju struktūras maiņa → valsts-parvalde; aizsardzība un iekšējā drošība — papildu. Iestāde nav pārbaudīta: valdības struktūras maiņa → VK (§6a, valsts pārvaldes reforma); AM un IeM — papildu.'
jautajums: ""
