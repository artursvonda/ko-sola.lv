    citats: "Jaunais princips: “Vispirms konsultē, tad palīdzi” Valsts iestādes tiek pārveidotas par partneri, likvidējot līdzšinējo sodīšanas politiku"
nesakritiba: ""
piezimes: "Nodaļas ievadā, bet formulēts kā apņemšanās (jauns princips) → izrakstīts. Nepārbaudāms: „pārveidotas par partneri” un „likvidējot līdzšinējo sodīšanas politiku” bez konkrēta normatīva, iestādēm vai mēra. Ekstraktors nav pārbaudījis, vai līdzīgs „vispirms konsultē” princips jau ir spēkā. Tēma: iestāžu attieksme pret uzņēmējiem un iedzīvotājiem → valsts-parvalde; ekonomika-un-darbs — papildu. Iestāde nav pārbaudīta: valsts pārvaldes principi → VK."
jautajums: ""
