nesakritiba: ""
piezimes: "CVK teikums ar trim likmēm dalīts trīs Solījumos (§1: katrai likmei var būt cits statuss); daļām nav sava darbības vārda, bet teikums avotā sadalīts atsevišķās rindkopās → citēts ievads ar darbības vārdu un attiecīgā rindkopa (divi citāti). Paplašinātajā programmā likme 10% ir tabulas blakus šūnā; citāts nedrīkst šķērsot šūnas, tāpēc citēts nodokļa nosaukums. Paplašinātā programma precizē, ka reinvestētajai peļņai saglabājas 0%; CVK to nemin, bet arī nenoliedz → nav ierakstīts kā Nesakritība. Iestāde nav pārbaudīta: nodokļu politika → FM."
