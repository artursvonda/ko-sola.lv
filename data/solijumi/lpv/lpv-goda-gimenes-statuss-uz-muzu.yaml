id: lpv-goda-gimenes-statuss-uz-muzu
saraksts: lpv
nosaukums: "Goda ģimenes statuss uz mūžu vecākiem ar trīs vai vairāk bērniem"
parbaudams: true
temas:
  galvena: gimenes-un-demografija
  papildu: []
iestades:
  galvena: lm
  papildu: []
avoti:
  - veids: cvk
    vieta: "ĢIMEŅU ATBALSTS UN KRISTĪGĀS VĒRTĪBAS"
    citats: "Saglabāsim Goda ģimenes statusu uz mūžu vecākiem, kuri audzina vai jau ir izaudzinājuši trīs vai vairāk bērnus"
  - veids: paplasinata
    vieta: "2. Demogrāfija un Darbaspēks › Demogrāfiskie un investīciju stimuli"
    citats: "Saglabāt Goda ģimeņu programmas bonusus un atvieglojumus arī pēc tam, kad bērns sasniedz 18 gadu vecumu, ja ģimene ir izaudzinājusi trīs vai vairāk bērnus"
nesakritiba: "CVK sola Goda ģimenes statusu uz mūžu; paplašinātā programma — saglabāt programmas bonusus un atvieglojumus arī pēc bērna 18 gadu vecuma, bez \"uz mūžu\"."
piezimes: "Abi avoti sola to pašu iznākumu (daudzbērnu ģimene nezaudē Goda ģimenes priekšrocības, bērniem pieaugot) → viens Solījums (§4); vērtē pēc CVK. \"tādējādi apliecinot …\" — pamatojums, nav citēts. Iestāde nav pārbaudīta: ekstraktors nezina, kura ministrija pašlaik atbild par Goda ģimenes programmu; pieņemta LM (ģimenes politika)."
jautajums: ""
