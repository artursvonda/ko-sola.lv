nosaukums: Iepirkumu „Fast-track” stratēģiskiem projektiem — lēmumi nedēļu laikā
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: fm
  papildu: [vk]
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Pārvaldes efektivitāte un digitalizācija
    citats: "Iepirkumu “Fast-track”: Reformēt iepirkumu procedūras, ieviešot operatīvu koordināciju starp ministriju stratēģiskiem projektiem, lai lēmumi tiktu pieņemti operatīvi nedēļu, nevis mēnešu laikā"
nesakritiba: ""
piezimes: "Robežgadījums: Pārbaudāms, jo ir mērs (lēmumi nedēļu, nevis mēnešu laikā) — vērtē, vai ieviesta paātrināta iepirkumu kārtība ministriju stratēģiskajiem projektiem; alternatīva — Nepārbaudāms (procedūras un projekti nav nosaukti). Nav apvienots ar lpv-publisko-iepirkumu-reformas-pabeigsana un lpv-digitalizeta-iepirkumu-ekosistema — cits iznākums. Iestāde nav pārbaudīta: iepirkumu regulējums → FM; starpministriju koordinācija → VK (papildu)."
jautajums: ""
