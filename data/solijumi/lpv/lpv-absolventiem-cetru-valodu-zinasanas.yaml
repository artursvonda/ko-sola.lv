piezimes: 'Formulēts kā prasība, nevis darbība. Pārbaudāms robežgadījumā: ir skaitlis (vismaz četras valodas) — vērtē, vai izglītības standarts vai prasības skolas beigšanai paredz vismaz četras valodas; alternatīva — Nepārbaudāms (nav nosaukta rīcība). Avots nenorāda, vai "skola" ir pamatskola vai vidusskola un vai latviešu/dzimtā valoda tiek skaitīta. Nav apvienots ar lpv-anglu-valodas-skolu-izveide (cits iznākums). Iestāde nav pārbaudīta: IZM.'
