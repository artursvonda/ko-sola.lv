id: lpv-latgales-drosiba-un-attistiba
saraksts: lpv
nosaukums: Īpaša uzmanība Latgales drošībai un ekonomiskajai attīstībai
parbaudams: false
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: varam
  papildu: [iem]
avoti:
  - veids: cvk
    vieta: STIPRA UN NEATKARĪGA LATVIJA
    citats: īpašu uzmanību pievērsīsim Latgales drošībai un ekonomiskajai attīstībai
nesakritiba: ""
piezimes: 'Drošība un ekonomiskā attīstība — uzskaitījums zem viena darbības vārda → nedala (§1). "Ņemot vērā, ka esam Eiropas Savienības ārējā robeža" — pamatojums, nav citēts. Nepārbaudāms: "pievērsīsim uzmanību" bez konkrēta pasākuma vai mēra. Iestāde nav pārbaudīta: reģionālā attīstība → VARAM; drošība pie ārējās robežas → IeM (papildu); iespējama arī AM.'
jautajums: ""
