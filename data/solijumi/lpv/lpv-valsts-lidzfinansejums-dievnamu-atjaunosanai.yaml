piezimes: "Robežgadījums: apjoms nav norādīts, bet iznākums konkrēts (valsts līdzfinansējums dievnamu atjaunošanai piešķirts vai nē) → Pārbaudāms. \"dievnamu atjaunošanai un kultūrvēsturiskā mantojuma saglabāšanai\" — uzskaitījums zem viena darbības vārda, nedala (§1). Ekstraktors nezina, vai šāds līdzfinansējums jau pastāv — vērtējot jānoskaidro sākumstāvoklis. Iestāde nav pārbaudīta: kultūras mantojums → KM."
