    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža › Pārvaldes efektivitāte un digitalizācija
    citats: Pabeigt 2017. gadā iesākto publisko iepirkumu sistēmas reformu, nodrošinot tās galīgo ieviešanu un efektivitāti
nesakritiba: ""
piezimes: "Punkts dalīts (§1): reformas pabeigšana un pilnībā digitalizēta iepirkumu ekosistēma (lpv-digitalizeta-iepirkumu-ekosistema) var saņemt atšķirīgus statusus. Nepārbaudāms: avots nenosauc, kas ir „2017. gadā iesāktā reforma” un kad tā uzskatāma par pabeigtu; ekstraktors to nezina. Alternatīva — apvienot ar digitalizēto ekosistēmu kā reformas saturu. Nav apvienots ar lpv-cina-ar-korupciju (CVK DROŠĪBA) — cits iznākums. Iestāde nav pārbaudīta: publisko iepirkumu politika → FM."
jautajums: ""
