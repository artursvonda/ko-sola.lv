nesakritiba: ""
piezimes: 'Dalīts no vidējā atalgojuma celšanas (sk. lpv-videja-atalgojuma-celsana); citēts viss teikums (§3). Robežgadījums: mēra nav, bet pensiju apmērs ir izmērāms → Pārbaudāms. Nav norādīts, vai solīts pieaugums virs likumā paredzētās ikgadējās indeksācijas — redaktoram vērtējot. Paplašinātās 1. nod. "Pensijas" punkti (2. un 3. pensiju līmenis) — citi iznākumi, nav tas pats Solījums (§0.3). Iestāde nav pārbaudīta: LM.'
