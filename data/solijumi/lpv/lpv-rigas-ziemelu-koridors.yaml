piezimes: "Divas vietas CVK nodaļā par to pašu objektu → viens Solījums ar diviem citātiem (§1). Via Baltica un \"citas automaģistrāles\" tajā pašā teikumā — atsevišķi Solījumi (savi iznākumi). Paplašinātās 4. nod. apvienotā tilta ideja (integrēts ar Ziemeļu koridoru) — atsevišķs Solījums. \"īstenosim\" — avots nenosaka, vai jāpabeidz 4 gados. Iestāde nav pārbaudīta: SM."
