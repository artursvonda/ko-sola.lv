nesakritiba: ""
piezimes: 'Nepārbaudāms: "reālu cīņu" bez konkrēta pasākuma vai mēra; jomas (iepirkumi, valsts uzņēmumi) tikai precizē virzienu, nedala. Nav apvienots ar paplašinātās 8. nod. publisko iepirkumu sistēmas reformu un "Fast-track" — cits, konkrēts iznākums, atstāts nodaļai EFEKTĪVA VALSTS PĀRVALDE. Tēma: korupcija → iekseja-drosiba-un-tiesiskums; valsts uzņēmumi → ekonomika-un-darbs (papildu). Iestāde nav pārbaudīta: KNAB ir Ministru kabineta pārraudzībā (Ministru prezidents) → VK; valsts iepirkumu regulējums → FM (papildu); alternatīva — TM.'
jautajums: ""
