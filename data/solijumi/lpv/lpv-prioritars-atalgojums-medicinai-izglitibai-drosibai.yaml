id: lpv-prioritars-atalgojums-medicinai-izglitibai-drosibai
saraksts: lpv
nosaukums: Prioritāra algu celšana medicīnas, izglītības un drošības darbiniekiem
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [veseliba, izglitiba-un-zinatne]
iestades:
  galvena: fm
  papildu: [vm, izm]
avoti:
  - veids: paplasinata
    vieta: 8. Valsts pārvaldes efektivitāte un birokrātijas demontāža
    citats: Veiksim valsts iestāžu auditēšanu un grupēšanu, lai prioritāri kāpinātu atalgojumu un uzlabotu darba apstākļus medicīnas, izglītības un drošības jomu darbiniekiem
nesakritiba: ""
piezimes: "„lai prioritāri kāpinātu atalgojumu …” nosauc konkrētu iznākumu, kas var notikt arī bez audita → atsevišķs Solījums; daļai nav sava darbības vārda → citēts viss teikums (§1, §3). Nav apvienots ar CVK Solījumiem lpv-atalgojuma-pieaugums-veselibas-nozare, lpv-pedagogu-atalgojuma-palielinasana, lpv-cienigs-atalgojums-drosibas-strukturas: šeit iznākums ir trīs jomu atalgojuma prioritāte pārējās valsts pārvaldes priekšā (tā pati nodaļa sola iesaldēt valsts iestāžu algu fondu uz 4 gadiem, lpv-valsts-algu-fonda-iesaldesana-4-gadi), finansēta no audita un grupēšanas; nozaru algas var pieaugt (CVK Solījumi izpildīti) arī bez šādas prioritātes → statuss var atšķirties (§4). Alternatīva — pievienot šo citātu visiem trim CVK Solījumiem ar Nesakritību („prioritāri”, mehānisms, „izglītības jomu darbinieki” ↔ „pedagogi”). Robežgadījums: Pārbaudāms, ja vērtē, vai šo trīs jomu atalgojums pieaudzis vairāk nekā pārējā valsts pārvaldē; alternatīva — Nepārbaudāms („prioritāri” bez mēra). „uzlabotu darba apstākļus” — bez mēra, nav atsevišķs Solījums. Avots nepasaka, vai „medicīnas darbinieki” ietver arī slimnīcu (kapitālsabiedrību) darbiniekus. Tēma: valsts pārvaldes atlīdzības politika → valsts-parvalde; veselība un izglītība — papildu (drošībai vietas nepietiek, maks. 2). Iestāde nav pārbaudīta: atlīdzības politika valsts pārvaldē → FM; VM un IZM — papildu; IeM un AM nav norādītas (maks. 2)."
jautajums: ""
