    citats: Veidosim visciešāko aliansi ar ASV – militārajā, ekonomikas un starptautisko attiecību jomā
nesakritiba: ""
piezimes: 'Uzskaitījums zem viena darbības vārda bez atsevišķiem mērķiem → nedala (§1). Nepārbaudāms: "visciešākā alianse" nav mēra vai konkrēta iznākuma. Paplašinātās 4. nod. sadaļas "Stratēģiskā partnerība ar ASV" punkti (vismaz 50% aizsardzības iepirkumu ASV kompānijām, Sēlijas poligons, dubultnodokļi, reiss Rīga–Ņujorka) ir citi, konkrēti iznākumi → nav apvienoti, atstāti savām nodaļām. Iestāde nav pārbaudīta (starpnozaru).'
jautajums: ""
