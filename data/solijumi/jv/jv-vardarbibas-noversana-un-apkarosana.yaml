id: jv-vardarbibas-noversana-un-apkarosana
saraksts: jv
nosaukums: Vardarbības novēršana un apkarošana ģimenē, skolā un darba vidē
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [gimenes-un-demografija]
iestades:
  galvena: iem
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "10. Tiesiskums"
    citats: "Iestāsimies par cilvēktiesībām, bērnu tiesībām un vardarbības novēršanu ģimenē, skolā un darba vidē"
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Cilvēktiesību aizsardzība un vardarbības izskaušana"
    citats: "Turpināsim novērst un apkarot vardarbību, īpaši pret bērniem, sievietēm, kā arī jebkuru vardarbību ģimenē un ārpus tās"
nesakritiba: ""
piezimes: "CVK 2. teikums dalīts pēc paplašinātās programmas punktiem (§4; sk. jv-pamattiesibu-un-cilvektiesibu-aizstaviba); citēts viss teikums (§3). Paplašinātās programmas punkta „-ot” daļa „pilnveidojot atbalsta grozu …” nosauc konkrētu darbību ar savu iznākumu — atsevišķs Solījums jv-atbalsta-grozs-vardarbiba-cietusajiem (§1); citēts punkts līdz šai daļai. „ģimenē, skolā un darba vidē” ↔ „ģimenē un ārpus tās” — nav uzskatīts par būtisku Nesakritību. Nav apvienots ar jv-vardarbibas-noversana-un-labbutiba-skolas (8. nodaļa; tur — programma katrā skolā, cits iznākums) un jv-stambulas-konvencijas-dalibas-saglabasana. Nepārbaudāms: bez mēra. Atbildīgā iestāde nav droša: IeM (vardarbības apkarošana — policija), LM papildu (cietušo atbalsts; pieņēmums, nav pārbaudīts); iesaistīta arī TM."
jautajums: ""
