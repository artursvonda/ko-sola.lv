nesakritiba: ""
piezimes: "Dalīts no CVK teikuma pēc paplašinātās programmas dalījuma (§4; sk. jv-pakalpojumu-viens-ipasnieks); citēts teikums līdz šai daļai (§3). „-ot” daļa („izmaksas un efektivitāti salīdzinot ar privātā sektora praksi”) — veids, kā vērtēt digitalizāciju, nav dalīta (robežgadījums). Nepārbaudāms: „jēgpilnu digitalizāciju”, „digitālu pieejamību” bez mēra (kuri pakalpojumi, cik). Nav apvienots ar jv-datu-izmantosana-un-digitala-transformacija (tur — iekšējie pārvaldes procesi). 9. nodaļas „Pilnveidosim pašvaldību e-pakalpojumu klāstu …” — cits iznākums (pašvaldību e-pakalpojumi un klātienes atbalsts), atsevišķs Solījums jv-klatienes-atbalsts-vpvkac (9. nodaļas izpilde). VARAM (pieņēmums, nav pārbaudīts)."
