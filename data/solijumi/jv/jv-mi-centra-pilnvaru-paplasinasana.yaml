id: jv-mi-centra-pilnvaru-paplasinasana
saraksts: jv
nosaukums: Mākslīgā intelekta centra pilnvaru paplašināšana
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Tehnoloģijas un mākslīgais intelekts"
    citats: "Paplašināsim jaunizveidotā MI centra pilnvaras"
nesakritiba: ""
piezimes: "Punktā divi darbības vārdi ar atšķirīgu iznākumu (pilnvaras — regulējums; finansējums — budžets) — dalīts (§1); finansējums — jv-mi-centra-finansejums. „sekmējot pētniecību un privātā sektora iesaisti” — mērķis. Vērtēšanas avots — paplašinātā programma (CVK citāta nav). Pārbaudāms: centra pilnvaras regulējumā paplašinātas vai nē. Atbildīgā iestāde neskaidra: VARAM (pieņēmums, nav pārbaudīts, kuras ministrijas pārraudzībā ir MI centrs)."
jautajums: ""
