nesakritiba: "CVK programma sola tikai „Attīstīsim kapitāla tirgu” bez mēra, bet paplašinātā programma — „nodrošināsim Baltijas kapitāla tirgus sasaisti ar Eiropas depozitārijiem” (vērtē pēc šī)."
piezimes: "Dalīts no paplašinātās programmas punkta par kapitāla tirgu (§1 piemērs). CVK „Attīstīsim kapitāla tirgu” pievienots kā paplašinātās programmas dalījuma attiecīgā daļa (§4) — tas pats citāts arī jv-kapitalsabiedribu-akciju-kotacija-birza (redaktora lēmums: atsevišķu Nepārbaudāmu Solījumu neveidot). Pārbaudāms: konkrēts objekts (sasaiste ar Eiropas depozitārijiem). Kapitāla tirgus regulējums — FM (pieņēmums, nav pārbaudīts)."
