piezimes: "Apvienots (§4): abi avoti — latviešu valodas lietojums visās jomās. „pastiprinot mijiedarbību starp izglītības un kultūras jomu” — veids, nav dalīts. Punkta otrais teikums — jv-latviesu-valodas-apguves-iespejas. „latvisku vidi” šajā punktā attiecināts uz valodas lietojumu; CVK „latvisku kultūrvidi” — atsevišķi (jv-latviska-kulturvide). Nepārbaudāms. Prioritāte „Kvalitatīvs un atbildīgs valsts valodas lietojums visās jomās …” pārklāta šeit. IZM (valodas politika; pieņēmums, nav pārbaudīts)."
