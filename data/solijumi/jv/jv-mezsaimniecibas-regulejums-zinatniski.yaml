id: jv-mezsaimniecibas-regulejums-zinatniski
saraksts: jv
nosaukums: "Mežsaimniecības regulējums par ciršanas caurmēru, balstīts zinātniskos aprēķinos"
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: zm
  papildu: []
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Uzturēsim dabas kapitālu, zinātnē balstītu mežu, jūras un ūdeņu pārvaldību"
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Vide, mežsaimniecība, lauksaimniecība"
    citats: "Pilnveidosim mežsaimniecības regulējumu, balstoties zinātniskos aprēķinos par koku ciršanas caurmēru ietekmi uz mežaudžu ražību"
nesakritiba: "CVK programma sola „Uzturēsim … zinātnē balstītu mežu … pārvaldību” bez konkrēta iznākuma, bet paplašinātā programma — „Pilnveidosim mežsaimniecības regulējumu, balstoties zinātniskos aprēķinos par koku ciršanas caurmēru …”; vērtē pēc šī."
piezimes: "CVK 1. teikums (viens darbības vārds „Uzturēsim”, uzskaitījums) sadalīts pēc paplašinātās programmas dalījuma (§4): dabas kapitāls (jv-dabas-kapitals-30-procenti-teritorijas), meži (jv-mezsaimniecibas-regulejums-zinatniski), jūras un ūdeņu pārvaldība (jv-zila-ekonomika-akvakultura-zvejnieciba); pārējais uzskaitījums, kam paplašinātajā programmā atsevišķa punkta nav, — jv-ilgtspejiga-lauksaimnieciba-un-zala-pareja. Daļai nav sava darbības vārda; kopīgais „pārvaldību” ir aiz uzskaitījuma — citēts teikums līdz tam (§3). „veicinot nozares konkurētspēju eksporta tirgos” — mērķis, nav dalīts. Robežgadījums pārbaudāmībai: Pārbaudāms pēc tā, vai mežsaimniecības regulējums (ciršanas caurmērs) grozīts, balstoties uz zinātniskiem aprēķiniem. Meža politika — ZM (pieņēmums, nav pārbaudīts). Prioritāte „Zinātnē balstīta mežsaimniecība, … meža nozares konkurētspēja eksporta tirgos” pārklāta šeit un jv-es-finansejums-mezsaimniecibai-pec-2027."
jautajums: ""
