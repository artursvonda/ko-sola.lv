piezimes: "Tikai paplašinātā programma. Punktā četri darbības vārdi ar atšķirīgu iznākumu — dalīts (§1): vienotā skola (šeit), valodas apguve augstā līmenī (jv-valsts-valoda-augsta-limeni-skolas), latviska skolu vide (jv-latviska-skolu-vide), vēršanās pret nelojāliem darbiniekiem (jv-versanas-pret-nelojaliem-izglitibas-darbiniekiem). Avots nedefinē „vienotas skolas pieeju”. Nepārbaudāms: „turpināsim darbu pie” bez iznākuma vai termiņa. IZM."
