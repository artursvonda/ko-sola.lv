nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Nosaukumā konvencija saukta tās vispārpieņemtajā vārdā (Stambulas konvencija). Nav apvienots ar jv-vardarbibas-noversana-un-apkarosana — konkrēts, cits iznākums. Pārbaudāms („iestāsimies par X”, X konkrēts — §2): Latvija četru gadu beigās ir konvencijas dalībvalsts vai nē. Atbildīgā iestāde nav droša: Saeima (lēmums par starptautiska līguma saistību izbeigšanu vai saglabāšanu pieņemams ar likumu; pieņēmums, nav pārbaudīts)."
