id: jv-liaa-vienas-pieturas-agentura
saraksts: jv
nosaukums: LIAA pārveide par vienas pieturas aģentūru investoriem un eksportētājiem
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Veidosim paātrinātus investīciju koridorus enerģētikā, aizsardzībā, mākslīgajā intelektā un citās stratēģiskās nozarēs, stiprinot LIAA kā vienas pieturas aģentūru"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Stiprināsim Latvijas Investīciju un attīstības aģentūru un paplašināsim tās sniegtos pakalpojumus, pārveidojot to par vienas pieturas aģentūru investoriem, eksportētājiem un jaunuzņēmumiem"
nesakritiba: ""
piezimes: "CVK „-ot” daļa ar konkrētu darbību un nosauktu iestādi — atsevišķs Solījums (§1); citēts viss teikums. Paplašinātās programmas punktā „stiprināsim” un „paplašināsim pakalpojumus” vispārīgi, konkrētais iznākums — pārveide par vienas pieturas aģentūru („-ot” daļa), nav dalīts. Pārbaudāms: LIAA darbojas kā vienas pieturas aģentūra investoriem, eksportētājiem un jaunuzņēmumiem vai nē. LIAA — EM padotībā."
jautajums: ""
