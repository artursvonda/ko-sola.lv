    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Vide, mežsaimniecība, lauksaimniecība"
    citats: "Ieviesīsim mūsdienīgu pārvaldības modeli vides un dabas aizsardzības institūcijās, tā pamatā būs iestāžu digitalizācija un princips «konsultē vispirms»"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Robežgadījums pārbaudāmībai: „mūsdienīgu pārvaldības modeli” pats par sevi ir vispārīgs, bet princips «konsultē vispirms» ir konkrēts — Pārbaudāms pēc tā, vai princips ieviests vides un dabas aizsardzības iestāžu darbībā. Vides un dabas aizsardzības iestādes — VARAM (pieņēmums, nav pārbaudīts)."
