piezimes: "CVK teikuma galvenā daļa („Ieguldīsim spēcīgas pilsoniskas sabiedrības un noturīgas demokrātijas attīstībā”) — vispārīga; uzskaitījums pēc kola dalīts pēc paplašinātās programmas punktiem (§4): biedrības un nodibinājumi (jv-biedribu-un-nodibinajumu-atbalsts), jauniešu iniciatīvas (jv-jauniesu-iniciativas), pilsoniskais dialogs (jv-pilsoniskais-dialogs), mediju saturs (jv-mediju-saturs-latviesu-valoda); citēta daļa pēc kola līdz attiecīgajam objektam (§3). Tikai CVK: paplašinātās programmas Demokrātijas fonds (jv-demokratijas-fonds) — konkrēts cits iznākums (§4), nav apvienots. Nepārbaudāms. Atbildīgā iestāde nav droša — KM (pieņēmums, nav pārbaudīts)."
