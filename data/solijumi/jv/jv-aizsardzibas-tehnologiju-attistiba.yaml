    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Attīstīsim tehnoloģisko pārākumu, Latviju kā inovāciju laboratoriju ar pieejamu valsts, ES, NATO un citu finansējumu, īpašu uzmanību pievēršot autonomo sistēmu tehnoloģijām, 5G un 6G risinājumiem, elektroniskajai karadarbībai un pretgaisa aizsardzības sistēmām"
nesakritiba: ""
piezimes: "Nepārbaudāms: „attīstīsim” bez mēra; uzskaitījums zem viena darbības vārda nav dalīts. Nav apvienots ar jv-pretgaisa-dronu-un-pretdronu-spejas (tur — aizsardzības spējas, šeit — tehnoloģiju un inovāciju vide). CVK nodaļas „7. Zinātne, inovācijas un tehnoloģijas” teikums „Prioritāri attīstīsim aizsardzības tehnoloģijas …” atstāts 7. nodaļas izpildei (jv-prioritaro-tehnologiju-attistiba, nav apvienots)."
