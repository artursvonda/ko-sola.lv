id: jv-apstrades-rupniecibas-pievienota-vertiba-40
saraksts: jv
nosaukums: Apstrādes rūpniecības pievienotās vērtības pieaugums par 40%
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķis ir produktīvākā ekonomika Baltijā: vismaz 3,5% IKP izaugsme gadā, augstākā darba samaksa, investīcijas virs 30% no IKP un pāreja uz augstas pievienotās vērtības ekonomiku"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Panāksim pastāvīgu produktivitātes pieaugumu virs 3% gadā, palielinot apstrādes rūpniecības pievienoto vērtību par 40%"
nesakritiba: "CVK programmā mērķis ir „pāreja uz augstas pievienotās vērtības ekonomiku” bez mēra, bet paplašinātajā programmā — „palielinot apstrādes rūpniecības pievienoto vērtību par 40%”; vērtē pēc šī mēra."
piezimes: "„-ot” daļa ar konkrētu mēru un savu iznākumu — atsevišķs Solījums no produktivitātes pieauguma (§1); citēts punkts līdz šai daļai. CVK „pāreja uz augstas pievienotās vērtības ekonomiku” pievienota arī jv-produktivitates-pieaugums-virs-3 (§4). Pārbaudāms: apstrādes rūpniecības pievienotā vērtība; bāzes gads un cenu veids (salīdzināmās/faktiskās) nav norādīti. Rūpniecības politika — EM."
jautajums: ""
