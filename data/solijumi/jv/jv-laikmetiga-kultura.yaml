    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība"
    citats: "Veidosim latvisku kultūrvidi, atbalstīsim kultūras mantojuma saglabāšanu un pieejamību, izcilu un daudzveidīgu laikmetīgo kultūru"
nesakritiba: ""
piezimes: "CVK teikums dalīts (§1; objekti ar atšķirīgu iznākumu): latviska kultūrvide (jv-latviska-kulturvide), kultūras mantojums (jv-kulturas-mantojuma-saglabasana-un-pieejamiba), laikmetīgā kultūra (jv-laikmetiga-kultura), kultūras un radošās industrijas (jv-kulturas-un-radoso-industriju-konkuretspeja); citēts teikums līdz attiecīgajai daļai (§3). Tikai CVK: paplašinātajā programmā tiešas atbilsmes nav; konkrētie laikmetīgās mākslas punkti („Arsenāls”, Laikmetīgās mākslas muzejs) — atsevišķi Solījumi ar citu iznākumu. Nepārbaudāms. KM."
