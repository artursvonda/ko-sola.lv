id: jv-balsts-programmas-paplasinasana
saraksts: jv
nosaukums: "Programmas «Balsts» paplašināšana reģionos, arī divu bērnu ģimenēm"
parbaudams: true
temas:
  galvena: majokli
  papildu: [gimenes-un-demografija, regioni-un-pasvaldibas]
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Reģionos stiprināsim pašvaldību spēju attīstīties, skolu, veselības, sociālo pakalpojumu un mājokļu pieejamību"
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Paplašināsim valsts galvojumu programmu «Balsts» mājokļa būvniecībai vai iegādei reģionos, attiecinot to arī uz divu bērnu ģimenēm"
nesakritiba: "CVK programma sola „stiprināsim … mājokļu pieejamību” reģionos bez konkrēta iznākuma, bet paplašinātā programma — paplašināt programmu «Balsts» reģionos, „attiecinot to arī uz divu bērnu ģimenēm”; vērtē pēc šī."
piezimes: "CVK reģionu teikuma „mājokļu pieejamību” pievienota abiem paplašinātās programmas mājokļu pieejamības punktiem (§4; arī jv-zemas-ires-majoklu-programma); daļai nav sava darbības vārda — citēts teikums līdz „pieejamību” (§3). Pārbaudāms: programma paplašināta un attiecināta uz divu bērnu ģimenēm vai nē. Mājokļu politika — EM (pieņēmums, nav pārbaudīts)."
jautajums: ""
