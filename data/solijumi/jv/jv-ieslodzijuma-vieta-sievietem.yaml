    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Cilvēktiesību aizsardzība un vardarbības izskaušana"
    citats: "Izveidosim mūsdienīgu un drošu ieslodzījuma vietu sievietēm, kas sekmē uzvedības maiņu un nodrošina pilnvērtīgu vidi bērniem, kuri līdz četru gadu vecumam uzturas ieslodzījuma vietā kopā ar mammu"
