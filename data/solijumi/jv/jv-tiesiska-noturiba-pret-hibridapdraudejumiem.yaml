piezimes: "Tikai paplašinātā programma. „-ot” daļa „nodrošinot ātru tiesisko reakciju, ciešu valsts institūciju sadarbību un sabiedrības kritiskās domāšanas attīstību” apraksta veidu, nav dalīta. Nav apvienots ar jv-sabiedribas-noturiba-pret-informacijas-manipulaciju (2. nodaļa; tur — sabiedrības noturība, šeit — tiesiskā noturība). Prioritāte „Tiesiskā noturība pret hibrīdapdraudējumiem …” pārklāta šeit. Nepārbaudāms: „stiprināsim” bez mēra. TM (tiesību sistēma; pieņēmums, nav pārbaudīts)."
