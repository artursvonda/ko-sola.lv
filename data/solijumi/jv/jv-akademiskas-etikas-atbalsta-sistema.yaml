nesakritiba: ""
piezimes: "„-ot” daļa ar savu iznākumu — atsevišķs Solījums (§1); citēts viss punkts. Vērtēšanas avots — paplašinātā programma (CVK citāta nav; CVK „ētikas lēmumos” attiecas uz jauno zinātnieku lomu, sk. jv-jauno-zinatnieku-akademija). Robežgadījums pārbaudāmībai: objekts nosaukts (nacionāla atbalsta sistēma), bet „attīstot” nenosauc izveidi vai mēru — Nepārbaudāms. IZM."
