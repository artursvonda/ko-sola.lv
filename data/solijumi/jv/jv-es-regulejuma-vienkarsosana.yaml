id: jv-es-regulejuma-vienkarsosana
saraksts: jv
nosaukums: ES regulējuma vienkāršošana un administratīvā sloga samazināšana par 25%
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [arpolitika]
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "Veicināsim Latvijas uzņēmēju ieiešanu ārvalstu tirgos, ES konkurētspēju un regulējuma vienkāršošanu"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Paātrināsim Eiropas Savienības tiesiskā regulējuma vienkāršošanu, atbrīvojot mūsu uzņēmumu potenciālu, uzlabojot uzņēmējdarbības vidi un veicinot konkurētspēju, samazinot administratīvo slogu vismaz par 25%, īpaši mazajiem un vidējiem uzņēmumiem"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Veicināsim Eiropas Savienības spēku un konkurētspēju, pilnveidojot vienoto tirgu, stiprinot rūpniecību un inovāciju ekosistēmu, attīstot Eiropas izcilību jaunajās tehnoloģijās, tai skaitā mākslīgā intelekta un kvantu tehnoloģijās, kā arī vienkāršojot regulējumu, procedūras un mazinot šķēršļus Eiropas Savienības iekšienē"
nesakritiba: "CVK programma sola veicināt „regulējuma vienkāršošanu” bez mēra, bet paplašinātā programma — „samazinot administratīvo slogu vismaz par 25%”; vērtē pēc šī mēra."
piezimes: "CVK teikums dalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts viss teikums (§3). CVK teikumā (blakus „ES konkurētspēju”) regulējums nav skaidri nosaukts par ES regulējumu; paplašinātajā programmā — ES regulējums. „samazinot administratīvo slogu vismaz par 25%” ir vienkāršošanas mērs, nav dalīts; pārējās „-ot” daļas — mērķis. Pārbaudāms pēc mēra (administratīvā sloga samazinājums vismaz par 25%); bāzes līmenis un mērīšanas veids nav norādīts. CVK 4. nodaļas „Samazināsim administratīvo slogu, īpaši mazajiem uzņēmumiem” (nacionāls) — atstāts 4. nodaļas izpildei. EM — uzņēmējdarbības vides nozare (pieņēmums)."
jautajums: ""
