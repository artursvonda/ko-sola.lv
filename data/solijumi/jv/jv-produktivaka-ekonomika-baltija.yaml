avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķis ir produktīvākā ekonomika Baltijā"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Veidosim Latviju par produktīvāko ekonomiku Baltijas valstu vidū līdz 2035. gadam"
nesakritiba: "CVK programmā „Mērķis ir produktīvākā ekonomika Baltijā” bez termiņa, bet paplašinātajā programmā — „Veidosim Latviju par produktīvāko ekonomiku Baltijas valstu vidū līdz 2035. gadam” (termiņš pēc 15. Saeimas pilnvaru beigām)."
piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4): produktīvākā ekonomika (šeit), IKP izaugsme (jv-ikp-izaugsme-3-5-gada), darba samaksa (jv-augstaka-darba-samaksa-baltija), investīcijas (jv-investicijas-virs-30-no-ikp), pāreja uz augstas pievienotās vērtības ekonomiku (jv-produktivitates-pieaugums-virs-3, jv-apstrades-rupniecibas-pievienota-vertiba-40). Pārbaudāms: Baltijas valstu salīdzinājums pēc produktivitātes rādītāja (piem., darba ražīgums); konkrēts rādītājs avotā nav nosaukts. Redaktors: vērtē pilnvaru beigās pēc progresa uz mērķi (pēc CVK; var tikt izpildīts arī pirms pilnvaru beigām) — paplašinātās programmas termiņš 2035. gads ir pēc 15. Saeimas pilnvaru beigām. Tautsaimniecības attīstības politika — EM (pieņēmums). Prioritāte „Latvijas ekonomika kā produktīvākā Baltijas valstu vidū līdz 2035. gadam” pārklāta šeit."
jautajums: ""
