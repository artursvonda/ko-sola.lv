piezimes: "Tikai paplašinātā programma. „-ot” daļa ar savu iznākumu — atsevišķs Solījums no pārejas uz rezultātos balstītu budžetēšanu (jv-rezultatos-balstita-budzetesana), statusi var atšķirties (§1); citēta teikuma daļa no galvenā darbības vārda. „par to ziņojot parlamentam” — tās pašas pārvaldības daļa, nav dalīta. Robežgadījums pārbaudāmībai: „digitalizētu un caurspīdīgu” bez konkrēta rīka vai mēra — Nepārbaudāms. FM (pieņēmums, nav pārbaudīts)."
