avoti:
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Sabiedrības iesaiste, noturība un atbalsts cilvēkiem; diasporas potenciāla izmantošana"
    citats: "Stiprināsim sabiedrības noturību un līdzdalību cīņā pret Krievijas un citu totalitāru valstu īstenotu informācijas manipulāciju un iejaukšanos demokrātiskajos procesos"
nesakritiba: ""
piezimes: "Nepārbaudāms: „stiprināsim” bez mēra. Atbildīgā iestāde — Valsts kanceleja (stratēģiskās komunikācijas koordinācija); robežgadījums, iesaistītas arī ĀM un KM. 8. nodaļas punkts „Stiprināsim sabiedrības noturību sadarbībā ar NVO sektoru un plašsaziņas līdzekļiem, … atmasko dezinformāciju” — tuvs, bet ar citu saturu (kompetences krīzes situācijām, sadarbība ar NVO un medijiem); 8. nodaļas izpildē nav apvienots (plašāks un cits saturs) — atsevišķs Solījums jv-sabiedribas-noturiba-ar-nvo-un-medijiem."
jautajums: ""
