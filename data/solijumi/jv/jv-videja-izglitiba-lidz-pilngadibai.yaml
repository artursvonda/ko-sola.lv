    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kvalitatīva, pieejama izglītība katram bērnam"
    citats: "Pārveidosim izglītības standartu vidējam izglītības posmam, novēršot padziļināto kursu dublēšanos ar studijām augstskolās un panākot, ka Latvijas jaunieši vidējo izglītību iegūst līdz ar pilngadības iestāšanos līdzīgi kā citās Eiropas valstīs"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. „-ot” daļa ar konkrētu iznākumu (izglītības ilgums/struktūra), kam statuss var atšķirties no standarta pārveides (jv-videjas-izglitibas-standarta-parveide) — dalīts (§1), citēts viss punkts. Pārbaudāms: vidējās izglītības ieguve noteikta līdz pilngadībai vai nē. IZM."
