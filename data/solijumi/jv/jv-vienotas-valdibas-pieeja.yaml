piezimes: "CVK teikums (viens darbības vārds, četri objekti ar atšķirīgu iznākumu) dalīts pēc paplašinātās programmas punktiem (§4): vienotas valdības pieeja (šeit), kopīgi pakalpojumu centri (jv-kopigi-pakalpojumu-centri), funkciju nepārklāšanās (jv-ministriju-funkciju-parskatisana), pārmaiņu komandas (jv-ieviesanas-vienibas-lielajam-reformam); citēts teikums līdz attiecīgajai daļai (§3). Punkta „Stiprināsim Valsts kancelejas lomu un ieviesīsim …” otrā daļa — šeit, pirmā — jv-valsts-kancelejas-lomas-stiprinasana. Paplašinātās „-ot” daļa „ieviešot vienotas valdības konceptu” — tas pats Solījums (citēts viss punkts); galvenais teikums — jv-publiska-sektora-gudra-sarausanas. Robežgadījums pārbaudāmībai: avots nedefinē vienotas valdības modeli, bet tas ir nosaukts konkrēts pārvaldības modelis — Pārbaudāms pēc tā, vai valdība to formāli ieviesa (piem., ar MK lēmumu). Prioritāte „Vienotas valdības pieeja, …” pārklāta šeit un saistītajos Solījumos. Valdības kopējā kompetence — VK (§6a)."
