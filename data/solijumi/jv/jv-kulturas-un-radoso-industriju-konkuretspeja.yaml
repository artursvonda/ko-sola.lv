  papildu: [em]
avoti:
  - veids: cvk
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība"
    citats: "Veidosim latvisku kultūrvidi, atbalstīsim kultūras mantojuma saglabāšanu un pieejamību, izcilu un daudzveidīgu laikmetīgo kultūru un starptautiski konkurētspējīgu kultūras un radošo industriju"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kultūra"
    citats: "Atbalstīsim Latvijas kultūras un radošo industriju eksportu"
nesakritiba: ""
piezimes: "CVK teikums dalīts (§1; objekti ar atšķirīgu iznākumu): latviska kultūrvide (jv-latviska-kulturvide), kultūras mantojums (jv-kulturas-mantojuma-saglabasana-un-pieejamiba), laikmetīgā kultūra (jv-laikmetiga-kultura), kultūras un radošās industrijas (jv-kulturas-un-radoso-industriju-konkuretspeja); citēts teikums līdz attiecīgajai daļai (§3). Apvienots (§4): CVK starptautiskā konkurētspēja un paplašinātās programmas eksports — tas pats iznākums. Punkta pirmais teikums — jv-radoso-partneribu-atbalsts. Nepārbaudāms. KM, EM papildu (eksports; pieņēmums, nav pārbaudīts)."
