parbaudams: true
temas:
  galvena: gimenes-un-demografija
  papildu: [valoda-kultura-un-mediji]
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Demogrāfija un ģimeņu veselība"
    citats: "Noteiksim stingrākus ierobežojumus sociālo tīklu regulējumā bērniem, ierobežojot piekļuvi sociālo tīklu platformām un bērniem kaitīgam saturam internetā"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kvalitatīva, pieejama izglītība katram bērnam"
    citats: "Noteiksim stingrākus ierobežojumus sociālo tīklu regulējumā bērniem, ierobežojot piekļuvi sociālo tīklu platformām un bērniem kaitīgam saturam internetā"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma; tas pats punkts burtiski 5. un 8. nodaļā (§0.3) — viens Solījums ar diviem citātiem. „ierobežojot piekļuvi …” apraksta ierobežojumu saturu, nav dalīts. Pārbaudāms: stingrāks regulējums pieņemts vai nē. Atbildīgā iestāde nav droša: sociālo tīklu un digitālo platformu regulējums ir sadalīts (digitālā politika, elektroniskie sakari, mediju politika, arī ES līmeņa regulējums); izvēlēta VARAM (pieņēmums, nav pārbaudīts)."
jautajums: ""
