piezimes: "Vērtēšanas avots — paplašinātās programmas 4. nodaļa (CVK citāta nav). Tas pats punkts 6. nodaļā — citāts (§0.3); „darījumu” ↔ „lietu” kārtošanai — sinonīmi. Pārbaudāms: viena platforma darbojas vai nē. Atbildīgā iestāde neskaidra: VARAM (valsts digitālie pakalpojumi), EM papildu (uzņēmējdarbības vide) — pieņēmums, nav pārbaudīts."
