parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: varam
  papildu: [fm]
avoti:
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Tehnoloģijas un mākslīgais intelekts"
    citats: "Paplašināsim jaunizveidotā MI centra pilnvaras un palielināsim tā finansējumu līdz vairākiem miljoniem eiro gadā"
nesakritiba: ""
piezimes: "Dalīts no jv-mi-centra-pilnvaru-paplasinasana (§1); citēts no punkta sākuma, lai redzams, kura iestāde. Vērtēšanas avots — paplašinātā programma (CVK citāta nav). Pārbaudāms: centra gada finansējums palielināts līdz vairākiem miljoniem eiro; „vairāki miljoni” nav precīzs mērs (vismaz 2 milj. eiro — interpretācija). VARAM (pieņēmums, nav pārbaudīts), FM papildu (budžets)."
