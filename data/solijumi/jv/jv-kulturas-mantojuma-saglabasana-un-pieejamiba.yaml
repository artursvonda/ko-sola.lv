nesakritiba: "CVK sola atbalstīt „kultūras mantojuma saglabāšanu un pieejamību”, paplašinātā programma — paplašināt „kultūras, kultūrizglītības un kultūras mantojuma pieejamību un sabiedrības līdzdalību kultūrā” (plašāks tvērums, saglabāšana nav minēta)."
piezimes: "CVK teikums dalīts (§1; objekti ar atšķirīgu iznākumu): latviska kultūrvide (jv-latviska-kulturvide), kultūras mantojums (jv-kulturas-mantojuma-saglabasana-un-pieejamiba), laikmetīgā kultūra (jv-laikmetiga-kultura), kultūras un radošās industrijas (jv-kulturas-un-radoso-industriju-konkuretspeja); citēts teikums līdz attiecīgajai daļai (§3). Apvienots (§4): abi avoti — kultūras mantojuma pieejamība; paplašinātās programmas tvērums plašāks. „tajā skaitā veidojot mērķētu kultūras piedāvājumu mazāk aktīvām sabiedrības grupām, piemēram, senioriem” — veids, nav dalīts. Kultūras pieminekļu saglabāšana — atsevišķs, konkrētāks punkts (jv-kulturas-piemineklu-saglabasana-un-kulturvietas). Nepārbaudāms. KM."
