id: jv-galvenie-attistibas-raditaji-nozarem
saraksts: jv
nosaukums: 3–5 galvenie attīstības rādītāji katrā nozarē
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: vk
  papildu: []
avoti:
  - veids: cvk
    vieta: "6. Valsts pārvalde"
    citats: "Katrā nozarē noteiksim galvenos attīstības rādītājus"
  - veids: paplasinata
    vieta: "6. Valsts pārvalde › Apņemšanās un uzdevumi › Vienotas valdības pārvaldes modelis"
    citats: "Ieviesīsim rezultātos balstītu pārvaldību, katrā nozarē nosakot trīs līdz piecus galvenos attīstības rādītājus"
nesakritiba: "CVK programmā „noteiksim galvenos attīstības rādītājus” bez skaita, bet paplašinātajā programmā — „trīs līdz piecus galvenos attīstības rādītājus” katrā nozarē."
piezimes: "Paplašinātās programmas punkta galvenais teikums „Ieviesīsim rezultātos balstītu pārvaldību” ir ietvars; „-ot” daļas ar savu iznākumu — atsevišķi Solījumi (§1): rādītāji (šeit), vadītāju vērtēšana (jv-vaditaju-vertesana-pec-rezultatiem), datu publiskošana (jv-snieguma-datu-publiskosana); citēts punkts līdz attiecīgajai daļai. CVK teikums dalīts tāpat (divi darbības vārdi). Pārbaudāms: katrai nozarei noteikti galvenie attīstības rādītāji vai nē; CVK skaita nav, vērtē pēc paplašinātās mēra 3–5 (§4). Valdības kopējā pārvaldība — VK (pieņēmums, nav pārbaudīts)."
jautajums: ""
