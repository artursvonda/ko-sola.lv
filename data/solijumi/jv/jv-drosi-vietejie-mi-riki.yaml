id: jv-drosi-vietejie-mi-riki
saraksts: jv
nosaukums: Uzticami Latvijas tehnoloģiskie risinājumi un droši vietējie MI rīki
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [izglitiba-un-zinatne]
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Ieviesīsim nacionālu mākslīgā intelekta attīstības plānu un uzticamus Latvijas tehnoloģiskos risinājumus"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Tehnoloģijas un mākslīgais intelekts"
    citats: "izveidosim drošus, uz vietējiem tehnoloģiskajiem risinājumiem balstītus MI rīkus"
nesakritiba: "CVK programma sola „uzticamus Latvijas tehnoloģiskos risinājumus” (plašs tvērums), bet paplašinātā programma — tikai „uz vietējiem tehnoloģiskajiem risinājumiem balstītus MI rīkus”."
piezimes: "Dalīts no MI attīstības plāna (§1, sk. jv-maksliga-intelekta-attistibas-plans). CVK teikuma daļai nav sava darbības vārda — citēts viss teikums (§3). Robežgadījums pārbaudāmībai: nav nosaukts konkrēts rīks vai skaits, bet objekts konkrēts (vietējos risinājumos balstīti MI rīki izveidoti vai nē) — Pārbaudāms. Atbildīgā iestāde neskaidra: VARAM (digitālā transformācija; pieņēmums, nav pārbaudīts)."
jautajums: ""
