id: jv-aizsardzibas-finansejums-5-no-ikp
saraksts: jv
nosaukums: Aizsardzības finansējums 5% no IKP
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [nodokli-un-budzets]
iestades:
  galvena: am
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Nodrošināsim aizsardzības finansējumu 5% no IKP"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Stiprināsim valsts aizsardzības spējas, ik gadu ieguldot aizsardzībā 5% no iekšzemes kopprodukta"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Ieguldīsim 5% no iekšzemes kopprodukta valsts aizsardzībā"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nodrošināsim finansējumu iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta"
nesakritiba: "CVK programma sola „aizsardzības finansējumu 5% no IKP”, bet paplašinātās programmas nodaļā „3. Finanses” — „finansējumu iekšējās un ārējās drošības investīcijām vismaz 5%”, t. i., plašāku rādītāju (ietver arī iekšējo drošību)."
piezimes: "Paplašinātās programmas 1. nodaļas punkta otrā daļa („mērķtiecīgi attīstīsim pašmāju militāro industriju”) un 2. nodaļas „-ot” daļa („attīstot pašmāju militāro industriju”) — Solījumā jv-vietejas-militaras-industrijas-attistiba. Vērtē pēc CVK rādītāja (aizsardzības finansējums)."
jautajums: ""
