id: jv-bernu-retraumatizacijas-mazinasana
saraksts: jv
nosaukums: Bērna retraumatizācijas mazināšana ģimenes strīdu un šķiršanās lietās
parbaudams: true
temas:
  galvena: gimenes-un-demografija
  papildu: [iekseja-drosiba-un-tiesiskums, demokratija-un-cilvektiesibas]
iestades:
  galvena: tm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "10. Tiesiskums"
    citats: "Iestāsimies par cilvēktiesībām, bērnu tiesībām"
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Cilvēktiesību aizsardzība un vardarbības izskaušana"
    citats: "Mazināsim bērna retraumatizāciju un institucionālo vardarbību, lai neiesaistītu bērnu atkārtotos procesos un procesuālajās darbībās ģimenes strīdu un laulības šķiršanas lietās"
nesakritiba: "CVK sola iestāties par „bērnu tiesībām” bez mēra, paplašinātā programma — mazināt bērna retraumatizāciju, „lai neiesaistītu bērnu atkārtotos procesos un procesuālajās darbībās ģimenes strīdu un laulības šķiršanas lietās”."
piezimes: "CVK 2. teikums dalīts pēc paplašinātās programmas punktiem (§4; sk. jv-pamattiesibu-un-cilvektiesibu-aizstaviba); citēts teikums līdz attiecīgajai daļai (§3). CVK „bērnu tiesībām” piesaistīts šim punktam, jo paplašinātās programmas Prioritāte „Bērniem draudzīga tiesiskā vide un retraumatizācijas mazināšana …” to konkretizē; robežgadījums — CVK tvērums plašāks, redaktors var nošķirt. Robežgadījums pārbaudāmībai: CVK citātā mēra nav, paplašinātajā — bērns netiek iesaistīts atkārtotos procesos; vērtē pēc šī mēra (§4) — Pārbaudāms. TM (procesuālais regulējums), LM papildu (bērnu tiesību aizsardzība; pieņēmums, nav pārbaudīts)."
jautajums: ""
