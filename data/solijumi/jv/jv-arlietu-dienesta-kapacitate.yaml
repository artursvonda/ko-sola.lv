    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Sabiedrības iesaiste, noturība un atbalsts cilvēkiem; diasporas potenciāla izmantošana"
    citats: "Stiprināsim Latvijas klātbūtni pasaulē, veicinot diasporas iesaisti ekonomiskajā diplomātijā, paplašinot diplomātisko pārstāvniecību tīklu un paaugstinot ārlietu dienesta profesionālo kapacitāti"
nesakritiba: ""
piezimes: "Galvenais teikums („Stiprināsim Latvijas klātbūtni pasaulē”) vispārīgs; „-ot” daļa ar savu objektu (ārlietu dienests) — atsevišķs Solījums (§1). Nepārbaudāms: „paaugstinot kapacitāti” bez mēra."
