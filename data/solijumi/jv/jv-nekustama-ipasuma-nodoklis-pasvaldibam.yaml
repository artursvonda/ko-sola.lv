id: jv-nekustama-ipasuma-nodoklis-pasvaldibam
saraksts: jv
nosaukums: NĪN kā pilnvērtīgs pašvaldību nodoklis ar plašākām tiesībām noteikt likmes
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [regioni-un-pasvaldibas, majokli]
iestades:
  galvena: fm
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Padarīsim nekustamā īpašuma nodokli par pilnvērtīgu pašvaldību nodokli ar prognozējamību un sociālo taisnīgumu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Pārveidosim nekustamā īpašuma nodokli kā pilnvērtīgu pašvaldību nodokli, paplašinot pašvaldību tiesības lemt par nodokļa likmēm, vienlaikus nodrošinot iedzīvotājiem prognozējamību un sociālo taisnīgumu"
nesakritiba: "CVK programma sola padarīt nekustamā īpašuma nodokli par „pilnvērtīgu pašvaldību nodokli” bez konkrēta mēra, bet paplašinātā programma precizē — „paplašinot pašvaldību tiesības lemt par nodokļa likmēm” (vērtē pēc šī)."
piezimes: "„-ot” daļa „paplašinot pašvaldību tiesības lemt par nodokļa likmēm” apraksta, kā nodoklis kļūs par pilnvērtīgu pašvaldību nodokli, — nav dalīta (§1), bet ir mērs, pēc kura vērtē (§4): Pārbaudāms pēc tā, vai likumā paplašinātas pašvaldību tiesības noteikt NĪN likmes. „Prognozējamība un sociālais taisnīgums” — nosacījums bez mēra. NĪN regulējums — FM (pieņēmums), VARAM papildu (pašvaldību finanses). Mājokļi papildu — nodoklis skar mājokļu īpašniekus."
jautajums: ""
