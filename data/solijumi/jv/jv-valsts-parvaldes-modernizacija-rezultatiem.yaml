nesakritiba: ""
piezimes: "Nepārbaudāms: „modernizēsim” bez konkrēta iznākuma vai mēra. „-ot” daļas („mainot fokusu …”, „veidojot to …”) apraksta modernizācijas virzienu, nav dalītas. Punkts „Balstīsim pārmaiņu procesu uz … pakalpojumu kvalitāti” apraksta tās pašas modernizācijas („pārmaiņu procesa”) orientāciju — pievienots kā citāts, nevis atsevišķs Solījums. Konkrētie rezultātu pārvaldības elementi — atsevišķi Solījumi (jv-galvenie-attistibas-raditaji-nozarem, jv-vaditaju-vertesana-pec-rezultatiem, jv-snieguma-datu-publiskosana, jv-atbildiga-amatpersona-par-modernizaciju). Prioritāte „Pāreja no procesu orientētas uz rezultātos balstītu publisko pārvaldību” pārklāta šeit. Valsts pārvaldes reforma — VK (§6a piemērs)."
