avoti:
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Panāksim pastāvīgu produktivitātes pieaugumu virs 3% gadā, palielinot apstrādes rūpniecības pievienoto vērtību par 40% un trīskāršojot Latvijas aizsardzības industrijas eksporta apjomu"
nesakritiba: ""
piezimes: "„-ot” daļa ar konkrētu mēru un savu iznākumu — atsevišķs Solījums (§1); citēts viss punkts. Vērtēšanas avots — paplašinātā programma (CVK citāta nav). CVK 1. nodaļas palīgteikums „lai ieguldījumi … stiprinātu arī Latvijas ražošanu, zinātni un eksportu” Solījumā jv-vietejas-militaras-industrijas-attistiba ir mērķis, šeit nav pievienots. Pārbaudāms: aizsardzības industrijas eksporta apjoms; bāzes gads nav norādīts. AM, EM papildu (kā jv-vietejas-militaras-industrijas-attistiba). Prioritāte „… trīskāršojot Latvijas aizsardzības industrijas eksporta apjomus” pārklāta šeit."
jautajums: ""
