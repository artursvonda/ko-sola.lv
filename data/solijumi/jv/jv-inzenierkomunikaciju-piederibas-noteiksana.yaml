id: jv-inzenierkomunikaciju-piederibas-noteiksana
saraksts: jv
nosaukums: "Siltumtīklu un ūdensvadu piederības noteikšana normatīvajos aktos"
parbaudams: true
temas:
  galvena: majokli
  papildu: [energetika]
iestades:
  galvena: em
  papildu: [kem, varam]
avoti:
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Likvidēsim administratīvos un tiesiskos šķēršļus ēku inženierkomunikāciju sakārtošanai, normatīvajos aktos nosakot siltumtīklu un ūdensvada piederību, tajā skaitā atrisinot tranzīttīklu problēmu"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Galvenais teikums („Likvidēsim … šķēršļus”) ir vispārīgs — Solījums ir „-ot” daļa (§1); citēts viss punkts; „tajā skaitā atrisinot tranzīttīklu problēmu” — daļa no tā paša iznākuma, nav dalīta. Nav apvienots ar jv-tiklu-piederiba-operatoriem-pasvaldibam: tas nosaka konkrētu piederību (operatori vai pašvaldība), šis — piederības noteikšanu vispār; statusi var atšķirties. Pārbaudāms: piederība noteikta normatīvajos aktos vai nē. Iestāde — robežgadījums: ēkas — EM, siltumapgāde — KEM, ūdenssaimniecība — VARAM papildu (pieņēmums, nav pārbaudīts)."
jautajums: ""
