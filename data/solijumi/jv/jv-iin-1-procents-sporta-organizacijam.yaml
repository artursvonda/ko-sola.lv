    citats: "Noteiksim iespēju iedzīvotājiem brīvprātīgi novirzīt līdz vienam procentam no samaksātā iedzīvotāju ienākuma nodokļa sporta organizācijām, sporta klubiem, federācijām vai biedrībām"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Pārbaudāms: iespēja noteikta normatīvajos aktos vai nē. 8. nodaļas punkts „Radīsim jaunus instrumentus privātā sektora un privātpersonu iesaistei kultūras, sporta un pilsoniskās sabiedrības līdzdalības iniciatīvu atbalstīšanā …” — plašāks, cits iznākums, atstāts 8. nodaļas izpildei. IIN regulējums — FM, IZM papildu (sports; pieņēmums, nav pārbaudīts). Prioritāte „Sabiedrības līdzdalība sporta organizāciju finansēšanā un sporta kopienu ilgtspēja” pārklāta šeit."
jautajums: ""
