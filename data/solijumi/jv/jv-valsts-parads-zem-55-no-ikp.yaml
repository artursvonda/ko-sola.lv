id: jv-valsts-parads-zem-55-no-ikp
saraksts: jv
nosaukums: Valsts ārējais parāds zem 55% no IKP
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nepārsniegsim valsts parāda līmeni virs 55% no iekšzemes kopprodukta"
nesakritiba: "CVK programma sola „valsts ārējā parāda līmeni zem 55% no IKP”, bet paplašinātā programma — „Nepārsniegsim valsts parāda līmeni virs 55%”, t. i., citu rādītāju (viss valsts parāds, ne tikai ārējais)."
piezimes: "Paplašinātā programma CVK teikumu sadala divos punktos (parāda līmenis; eirozonas fiskālie noteikumi) — seko tās dalījumam (§4); otrs Solījums — jv-fiskali-atbildiga-budzeta-politika. CVK teikuma parāda daļai nav sava darbības vārda — citēts teikums līdz „no IKP”. Vērtē pēc CVK rādītāja (ārējais parāds). Prioritāte „Valsts parāda līmeņa nepalienāšana virs 55% …” pārklāta šeit."
jautajums: ""
