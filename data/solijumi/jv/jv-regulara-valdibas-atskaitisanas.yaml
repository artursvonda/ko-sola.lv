piezimes: "Tikai paplašinātā programma. Atsevišķs darbības vārds punktā — atsevišķs Solījums no publiskošanas (jv-snieguma-datu-publiskosana). Pārbaudāms: ieviesta regulāra valdības atskaitīšanās par rezultātiem vai nē; biežums un forma (Saeimai vai sabiedrībai) nav noteikti. Prioritāte „Cilvēkcentrēti pakalpojumi, publiska atskaitīšanās …” daļēji pārklāta šeit. VK (pieņēmums, nav pārbaudīts)."
