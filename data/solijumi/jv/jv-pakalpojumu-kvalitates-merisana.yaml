id: jv-pakalpojumu-kvalitates-merisana
saraksts: jv
nosaukums: Pakalpojumu kvalitātes mērīšana pēc lietotāja pieredzes, rezultāta un izmaksām
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: "6. Valsts pārvalde"
    citats: "Veidosim pakalpojumus cilvēka dzīves situācijām – ar skaidru atbildību, digitālu pieejamību, lietotāja pieredzes mērījumiem un caurskatāmām izmaksām"
  - veids: paplasinata
    vieta: "6. Valsts pārvalde › Apņemšanās un uzdevumi › Publiskie pakalpojumi"
    citats: "Veidosim cilvēkcentrētu pakalpojumu sniegšanas modeli, pakalpojumam nosakot «vienu īpašnieku», kvalitāti mērot pēc lietotāja pieredzes, sasniegtā rezultāta un izmaksām"
nesakritiba: ""
piezimes: "„-ot” daļa ar savu iznākumu — atsevišķs Solījums (§1; sk. jv-pakalpojumu-viens-ipasnieks). CVK „lietotāja pieredzes mērījumiem un caurskatāmām izmaksām” — viens iznākums ar paplašinātās „kvalitāti mērot pēc lietotāja pieredzes, sasniegtā rezultāta un izmaksām”; atšķirība („caurskatāmas izmaksas” ↔ izmaksas kā kvalitātes mērs, papildus „sasniegtā rezultāta”) nav uzskatīta par būtisku Nesakritību. Pārbaudāms: ieviesta publisko pakalpojumu kvalitātes mērīšana pēc lietotāja pieredzes un izmaksām vai nē. VARAM (pieņēmums, nav pārbaudīts)."
jautajums: ""
