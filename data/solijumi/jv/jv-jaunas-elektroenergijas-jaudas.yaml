nesakritiba: ""
piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Paplašinātās programmas punktā otrs darbības vārds („stiprināsim enerģijas tīklu pārvaldību”) — atsevišķs Solījums jv-energijas-tiklu-parvaldiba. Robežgadījums pārbaudāmībai: „attīstīsim” bez mēra, bet objekts konkrēts — jaunas elektroenerģijas ražošanas jaudas (uzstādītā jauda pieaug vai nē); Pārbaudāms. „uz komerciāliem principiem balstītas” nav uzskatīts par būtisku Nesakritību. KEM."
