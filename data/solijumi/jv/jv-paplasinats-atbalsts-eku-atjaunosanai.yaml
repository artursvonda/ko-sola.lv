avoti:
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Samazināsim birokrātiskās prasības un saskaņošanas procedūras māju renovācijas un energoefektivitātes projektiem, nodrošinot paplašinātu atbalstu ēku atjaunošanai"
nesakritiba: ""
piezimes: "Dalīts no birokrātijas mazināšanas punkta (sk. jv-renovacijas-birokratijas-mazinasana); „-ot” daļa — citēts viss punkts (§1). Nav apvienots ar jv-privatais-finansejums-energoefektivitatei (tur — privātā finansējuma rīki) un jv-siltinasanas-risinajumi-tipveida-majam. Robežgadījums pārbaudāmībai: „paplašinātu” ir salīdzinājums ar esošo — Pārbaudāms pēc tā, vai valsts atbalsta apjoms vai tvērums ēku atjaunošanai palielināts. Ēku atjaunošana — EM, KEM papildu (energoefektivitāte; pieņēmums, nav pārbaudīts)."
jautajums: ""
