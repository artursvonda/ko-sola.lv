    citats: "Turpināsim atbalstīt Latvijas eksportējošos uzņēmējus, veicinot ārvalstu investīciju piesaisti un sekmējot ieiešanu perspektīvajos tirgos, īpaši Āzijā, Līča reģionā, Āfrikā un Dienvidamerikā"
nesakritiba: ""
piezimes: "CVK teikums dalīts pēc paplašinātās programmas dalījuma (ārvalstu tirgi / ES konkurētspēja / regulējuma vienkāršošana, §4). Nepārbaudāms: „veicināsim”/„gādāsim” bez mēra; nosauktie reģioni (Āzija, Līča reģions u. c.) konkretizē, bet nav mērs. „Stiprināsim … ekonomisko drošību” un „Turpināsim atbalstīt … uzņēmējus” — vispārīgi, Solījumi ir „-ot” daļas (§1): „dažādojot eksporta tirgus” un „sekmējot ieiešanu perspektīvajos tirgos” — šeit; „slēdzot jaunus brīvās tirdzniecības līgumus” / „sekmējot … jaunu līgumu slēgšanu” — jv-jauni-es-brivas-tirdzniecibas-ligumi; „veicinot ārvalstu investīciju piesaisti” — jv-arvalstu-investiciju-piesaiste; „veidojot jaunas ekonomiskās un izejvielu partnerības” — jv-ekonomiskas-un-izejvielu-partneribas. EM (eksporta atbalsts) galvenā, ĀM (ekonomiskā diplomātija) papildu."
jautajums: ""
