nesakritiba: ""
piezimes: "CVK teikums (viens darbības vārds, uzskaitījums) sadalīts pēc paplašinātās programmas dalījuma (§4): eksportspējīgi uzņēmumi (šeit), industriālie parki (jv-industrialo-parku-attistiba), zinātņietilpīgi produkti (jv-zinatnietilpigu-produktu-atbalsts), kapitāla tirgus (jv-pensiju-kapitals-vietejos-uznemumos, jv-kapitalsabiedribu-akciju-kotacija-birza), valsts pasūtījums (jv-valsts-iepirkums-inovacijam). Paplašinātās 4. nodaļas punkts apvienots kā mērķēta atbalsta uzņēmumiem konkretizācija; „uzņēmumi ar vislielāko izaugsmes potenciālu” ↔ „eksportspējīgi uzņēmumi” — cits tvērums, nav uzskatīts par būtisku Nesakritību (Nepārbaudāms). „sistemātiski mazinot administratīvo slogu …” — Solījumā jv-administrativa-sloga-samazinasana. 2. nodaļas punkta galvenais teikums (§0.3) — tas pats Solījums; tā „-ot” daļas ir citos Solījumos (jv-arvalstu-investiciju-piesaiste, jv-ieiesana-arvalstu-tirgos). Robežgadījums pārbaudāmībai: „Izveidosim … sistēmu” — bet „elastīga finanšu instrumentu sistēma” nav konkrēta iestāde vai instruments; Nepārbaudāms. Paplašinātās programmas punkts „Novirzīsim 100 miljonus eiro gadā …” — atsevišķs Solījums ar mēru (jv-lielo-investiciju-aizdevumi-100-milj)."
