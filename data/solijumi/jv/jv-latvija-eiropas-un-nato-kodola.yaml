piezimes: "Nepārbaudāms: virziena deklarācija bez mēra; „kā drošu, brīvu un konkurētspējīgu valsti” apraksta mērķi. Paplašinātā programma nemin NATO — šaurāks tvērums nav uzskatīts par būtisku Nesakritību (Nepārbaudāms, vērtē pēc CVK). Paplašinātās programmas punkta otrā daļa („audzēsim Eiropas Savienības ekonomisko drošību un konkurētspēju pasaulē”) — Solījumā jv-es-konkuretspeja-un-ekonomiska-drosiba. Prioritāte „Latvija Eiropas kodolā …” pārklāta šeit."
