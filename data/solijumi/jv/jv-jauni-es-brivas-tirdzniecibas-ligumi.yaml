avoti:
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Gādāsim par Latvijas uzņēmēju mērķtiecīgu ieiešanu ārvalstu tirgos, sekmējot Eiropas Savienības brīvās tirdzniecības līgumu iespēju izmantošanu un jaunu līgumu slēgšanu"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Stiprināsim Eiropas Savienības un Latvijas ekonomisko drošību, dažādojot eksporta tirgus, slēdzot jaunus brīvās tirdzniecības līgumus"
nesakritiba: ""
piezimes: "„-ot” daļa ar konkrētu darbību un savu iznākumu (jauni ES brīvās tirdzniecības līgumi) — atsevišķs Solījums (§1). Pārbaudāms: ES noslēdz jaunus brīvās tirdzniecības līgumus vai nē (skaita mēra nav). „sekmējot … slēgšanu” ↔ „slēdzot” nav uzskatīts par būtisku Nesakritību — iznākums tas pats (līgumus slēdz ES). „sekmējot … iespēju izmantošanu” apraksta veidu, nav dalīts. ES tirdzniecības politikas pozīcija — ĀM (pieņēmums, nav pārbaudīts), EM papildu."
jautajums: ""
