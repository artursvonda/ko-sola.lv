id: jv-jauni-es-brivas-tirdzniecibas-ligumi
saraksts: jv
nosaukums: Jaunu ES brīvās tirdzniecības līgumu noslēgšana
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [arpolitika]
iestades:
  galvena: arm
