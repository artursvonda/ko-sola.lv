id: jv-sankciju-pret-krieviju-pastiprinasana
saraksts: jv
nosaukums: ES un nacionālo sankciju pret Krieviju pastiprināšana
parbaudams: true
temas:
  galvena: arpolitika
  papildu: []
iestades:
  galvena: arm
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Konsekventi uzturēsim prasību, lai agresors maksātu pilnu cenu par pastrādātajiem noziegumiem – iestājoties par Krievijas vājināšanu un izolāciju, starptautisko taisnīgumu, pastiprinot starptautisko spiedienu un Eiropas Savienības un nacionālās sankcijas"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Turpināsim visaptverošu atbalstu Ukrainai, tostarp Krievijas vājināšanu un izolāciju, pastiprinot starptautisko spiedienu, Eiropas Savienības un nacionālās sankcijas"
nesakritiba: ""
piezimes: "„-ot” daļa ar konkrētu darbību un savu iznākumu (pieņemtas stingrākas ES vai nacionālās sankcijas) — atsevišķs Solījums. Robežgadījums pārbaudāmībai: „pastiprinot” bez mēra, bet objekts konkrēts (sankciju režīmi) — Pārbaudāms pēc tā, vai pieņemtas jaunas/stingrākas sankcijas. CVK nodaļā „2. Ārpolitika un latvieši pasaulē” ir „stiprināsim sankcijas” — atstāts 2. nodaļas izpildei."
jautajums: ""
