avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "Uzturēsim starptautisko spiedienu pret Krieviju, stiprināsim sankcijas"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Konsekventi uzturēsim prasību, lai agresors maksātu pilnu cenu par pastrādātajiem noziegumiem – iestājoties par Krievijas vājināšanu un izolāciju, starptautisko taisnīgumu, pastiprinot starptautisko spiedienu un Eiropas Savienības un nacionālās sankcijas"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Turpināsim visaptverošu atbalstu Ukrainai, tostarp Krievijas vājināšanu un izolāciju, pastiprinot starptautisko spiedienu, Eiropas Savienības un nacionālās sankcijas"
nesakritiba: ""
piezimes: "Vērtēšanas avots — CVK programma (pievienota 2. nodaļas izpildē); CVK citāts sākts no teikuma sākuma, lai redzams, ka sankcijas — pret Krieviju. Nosaukums pielāgots CVK („stiprināsim sankcijas”); paplašinātās programmas „Eiropas Savienības un nacionālās sankcijas” precizē sankciju veidu — nav uzskatīts par būtisku Nesakritību. Paplašinātajā programmā „-ot” daļa ar konkrētu darbību un savu iznākumu — atsevišķs Solījums. Robežgadījums pārbaudāmībai: bez mēra, bet objekts konkrēts (sankciju režīmi) — Pārbaudāms pēc tā, vai pieņemtas jaunas/stingrākas sankcijas. Starptautiskais spiediens — jv-krievijas-atbildiba-un-izolacija. 10. nodaļas punkts par vēršanos pret „starptautisko sankciju apiešanu” — cits iznākums (izpilde), atstāts 10. nodaļas izpildei."
jautajums: ""
