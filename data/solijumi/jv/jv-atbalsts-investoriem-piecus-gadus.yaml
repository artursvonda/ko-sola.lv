    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Godīga konkurence un investīciju vides tiesiskā drošība"
    citats: "Turpināsim atbalstu vismaz piecus gadus pēc projekta uzsākšanas"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Atsevišķs teikums ar savu darbības vārdu un mēru punktā par stratēģiskā investora statusu (sk. jv-strategiska-investora-statuss) (§1). Avots nenosaka, kurš atbalsts — no konteksta saprasts kā iepriekšējos teikumos nosauktais atbalsts investoriem (kontaktpunkts, konsultants, paātrinātas atļaujas). Pārbaudāms: atbalsts investoriem paredzēts vismaz piecus gadus pēc projekta uzsākšanas vai nē. EM (pieņēmums, nav pārbaudīts)."
