id: jv-zinatne-balstita-inovaciju-ekonomika
saraksts: jv
nosaukums: Zinātnē balstīta inovāciju ekonomika kā valsts attīstības prioritāte
parbaudams: false
temas:
  galvena: ekonomika-un-darbs
  papildu: [izglitiba-un-zinatne]
iestades:
  galvena: em
  papildu: [izm]
avoti:
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "attīstīsim zinātnē balstītu inovāciju ekonomiku kā vienu no valsts attīstības prioritātēm"
nesakritiba: ""
piezimes: "Dalīts no jv-nepartraukts-pecdoktoranturas-finansejums (§1): atsevišķs darbības vārds ar citu iznākumu. Vērtēšanas avots — paplašinātā programma (CVK citāta nav). Nepārbaudāms: „attīstīsim” bez mēra; „kā vienu no valsts attīstības prioritātēm” nenosauc konkrētu plānošanas dokumentu. Nav apvienots ar jv-petniecibas-rezultatu-komercializacija un jv-zinatnietilpigu-produktu-atbalsts (tur — konkrētāki atbalsta virzieni). Inovāciju politika — EM, IZM papildu (kā jv-zinatnietilpigu-produktu-atbalsts; pieņēmums, nav pārbaudīts)."
jautajums: ""
