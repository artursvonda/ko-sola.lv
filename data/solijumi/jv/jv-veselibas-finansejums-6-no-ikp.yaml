piezimes: "Paplašinātās programmas punkts dalīts: finansējums (šeit) un fonda izveide (jv-nacionalais-veselibas-apdrosinasanas-fonds) — atšķirīgi statusi (§1). „stabilu” nav uzskatīts par būtisku Nesakritību. Avoti nenosaka, vai 6% ir publiskais (valsts budžeta) vai kopējais veselības finansējums. Veselības budžets — VM, FM papildu (budžeta lēmums; pieņēmums, nav pārbaudīts). Prioritāte „Efektīva pārvaldība un prognozējams veselības finansējums, ne mazāk kā 6% …” pārklāta šeit un jv-nacionalais-veselibas-apdrosinasanas-fonds."
