piezimes: "Galvenais teikums („Turpināsim atbalstīt Latvijas eksportējošos uzņēmējus”) — 4. nodaļas izpildē pievienots jv-atbalsts-eksportspejigiem-uznemumiem; „-ot” daļa ar savu iznākumu (ārvalstu investīcijas) — atsevišķs Solījums (§1). Nepārbaudāms: „veicinot” bez mēra. CVK 4. nodaļas mērķis „investīcijas virs 30% no IKP” — cits iznākums (kopējās investīcijas), jv-investicijas-virs-30-no-ikp."
