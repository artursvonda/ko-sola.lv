avoti:
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Ar efektīvu atbalstu patentēšanai un jaunuzņēmumu ekosistēmai radīsim augsti apmaksātas darba vietas un stiprināsim Latvijas kā augsto tehnoloģiju valsts pozīcijas"
nesakritiba: ""
piezimes: "Paplašinātās programmas punkta „Veidosim ciešu sinerģiju starp universitātēm un industriju …” otrais teikums — cits iznākums, atsevišķs Solījums (§1). Vērtēšanas avots — paplašinātā programma (CVK citāta nav: CVK „patentēšanu, … jaunuzņēmumus” ir Zinātniskās darbības likuma mērķi, sk. jv-zinatniskas-darbibas-likums). Nepārbaudāms: „efektīvu atbalstu” bez mēra; „radīsim augsti apmaksātas darba vietas”, „stiprināsim … pozīcijas” — mērķi bez mēra. Jaunuzņēmumu atbalsts — EM, IZM papildu (pētniecība; pieņēmums, nav pārbaudīts; patentēšana skar arī TM). Prioritāte „Pētniecības rezultātu komercializācija, patentēšana, industriālā doktorantūra un jaunuzņēmumu ekosistēma” pārklāta šeit, jv-petniecibas-rezultatu-komercializacija un jv-petniecibai-un-attistibai-3-no-ikp."
jautajums: ""
