nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Punkta pirmais teikums „Stiprināsim senioru neatkarību un dzīves kvalitāti, lai cilvēki pēc iespējas ilgāk varētu dzīvot savās mājās un kopienā” — mērķis, ko konkretizē otrais teikums; nav izrakstīts atsevišķi. Mājas aprūpe minēta arī jv-majas-paliativa-hospisa-aprupe (veselības un sociālās aprūpes sistēmas punkts) — atstāts atsevišķi, jo šeit iznākums ietver atbalstu aprūpētājām ģimenēm. Nepārbaudāms: „stiprināsim” bez mēra. LM. Prioritāte „Aktīva senioru līdzdalība sabiedrībā, cieņpilnas vecumdienas un sociālā drošība” pārklāta šeit un pensiju Solījumos."
jautajums: ""
