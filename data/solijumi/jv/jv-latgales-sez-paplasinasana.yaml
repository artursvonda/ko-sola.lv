    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Spēcīgi reģioni, droša pierobeža, vienādas iespējas visā Latvijā"
    citats: "Īstenosim rīcības plānu Latvijas austrumu teritoriju ekonomiskajai izaugsmei un drošībai, paplašinot Latgales speciālās ekonomiskās zonas darbību"
nesakritiba: ""
piezimes: "Paplašinātās programmas punkts dalīts (§1): divas „-ot” daļas ar konkrētu, atšķirīgu iznākumu — Latgales SEZ paplašināšana (šeit) un nodokļu atlaides 100 km joslā (jv-nodoklu-atlaides-pierobeza-100-km). Galvenais teikums „Īstenosim rīcības plānu …” atsevišķs Solījums nav — plāna saturs šajā punktā ir šīs divas darbības (robežgadījums). Pārbaudāms: SEZ darbība paplašināta (teritorija vai atvieglojumi) vai nē. Latgales SEZ — VARAM, FM papildu (nodokļu atvieglojumi; pieņēmums, nav pārbaudīts). Prioritāte „Latvijas austrumu pierobežas stiprināšana nacionālās drošības interesē” pārklāta šeit un citos pierobežas Solījumos."
jautajums: ""
