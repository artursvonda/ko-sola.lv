    vieta: "7. Zinātne, inovācijas un tehnoloģijas"
    citats: "Izstrādāsim jaunu Zinātniskās darbības likumu, kas sekmēs patentēšanu, licencēšanu, komercializāciju, jaunuzņēmumus un universitāšu sadarbību ar industriju"
nesakritiba: ""
piezimes: "Pārbaudāms: jauns likums izstrādāts (un pieņemts) vai nē; „kas sekmēs …” — likuma mērķi, nav dalīti. Paplašinātās programmas Apņemšanās likuma nav (minēts tikai Pamatojumā, kas netiek izrakstīts). Nav apvienots ar jv-universitasu-un-industrijas-sadarbiba, jv-patentesanas-un-jaunuznemumu-atbalsts un jv-petniecibas-rezultatu-komercializacija (tur — politikas virziens, šeit — konkrēts likums). Zinātniskās darbības likums — IZM kompetencē."
