    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Spēcīgi reģioni, droša pierobeža, vienādas iespējas visā Latvijā"
    citats: "Pilnveidosim pašvaldību e-pakalpojumu klāstu, reģionu iedzīvotājiem obligāti saglabājot klātienes atbalstu Valsts un pašvaldību vienotajos klientu apkalpošanas centros"
nesakritiba: ""
piezimes: "Galvenais teikums („Pilnveidosim pašvaldību e-pakalpojumu klāstu”) ir vispārīgs — Solījums ir „-ot” daļa (§1); citēts viss punkts. 6. nodaļas izpildē atstāts šai nodaļai (sk. jv-publisko-pakalpojumu-digitalizacija). Pārbaudāms: klātienes atbalsts VPVKAC reģionos saglabāts (centri nav slēgti, klātienes apkalpošana pieejama) vai nē. VPVKAC tīkls — VARAM (pieņēmums, nav pārbaudīts). Prioritāte „Reģionālā mājokļu programma, pakalpojumu digitalizācija un klātienes atbalsts vienas pieturas aģentūrās” pārklāta šeit un mājokļu Solījumos."
