id: jv-strategiska-investora-statuss
saraksts: jv
nosaukums: Stratēģiskā investora statuss un «investora zaļais koridors»
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
iestades:
  galvena: em
  papildu: [vk]
avoti:
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Godīga konkurence un investīciju vides tiesiskā drošība"
    citats: "Uzlabosim uzņēmējdarbības vidi, ieviešot stratēģiskā investora statusu un «investora zaļo koridoru» – vienotu valdības kontaktpunktu, kas pārstāv investoru visās ministrijās un iestādēs"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Galvenais teikums („Uzlabosim uzņēmējdarbības vidi”) ir vispārīgs — Solījums ir „-ot” daļa (§1); citēts viss teikums. Punkta pārējie teikumi ar saviem darbības vārdiem: personīgs konsultants (jv-personigs-valsts-konsultants-investoriem), paātrinātas atļaujas (pievienots jv-paatrinati-investiciju-koridori), atbalsts piecus gadus (jv-atbalsts-investoriem-piecus-gadus). Nav apvienots ar jv-paatrinati-investiciju-koridori un jv-liaa-vienas-pieturas-agentura — jauns saturs (statuss, vienots valdības kontaktpunkts); robežgadījums ar LIAA vienas pieturas aģentūru, redaktors var apvienot. Pārbaudāms: statuss un kontaktpunkts ieviesti vai nē. EM (investīciju vide), VK papildu (valdības kontaktpunkts; pieņēmums, nav pārbaudīts)."
jautajums: ""
