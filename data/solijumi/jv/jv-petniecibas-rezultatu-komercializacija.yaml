id: jv-petniecibas-rezultatu-komercializacija
saraksts: jv
nosaukums: Atbalsts pētniecības rezultātu komercializācijai
parbaudams: false
temas:
  galvena: izglitiba-un-zinatne
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: izm
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "7. Zinātne, inovācijas un tehnoloģijas"
    citats: "Stiprināsim Latvijas zinātnes neatkarību, starptautisko konkurētspēju un komercializāciju"
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Stiprināsim Latvijas zinātnes pienesumu tautsaimniecībai, mērķtiecīgi atbalstot pētniecības rezultātu komercializāciju"
nesakritiba: ""
piezimes: "CVK teikums dalīts pēc paplašinātās programmas dalījuma (§4; sk. jv-zinatnes-neatkariba-un-konkuretspeja); daļai nav sava darbības vārda — citēts viss teikums (§3). Paplašinātās programmas punktā galvenais teikums vispārīgs, konkrētākais — „-ot” daļa (komercializācijas atbalsts), nav dalīts. Nepārbaudāms: „stiprināsim”, „atbalstot” bez mēra. Nav apvienots ar jv-zinatnietilpigu-produktu-atbalsts (tur — uzņēmējdarbības atbalsts zinātņietilpīgiem produktiem 4. nodaļā; šeit — pētniecības rezultātu komercializācija zinātnes politikā), jv-patentesanas-un-jaunuznemumu-atbalsts un jv-zinatniskas-darbibas-likums (likums ar savu iznākumu). Zinātnes politika — IZM, EM papildu (inovācijas; pieņēmums, nav pārbaudīts)."
jautajums: ""
