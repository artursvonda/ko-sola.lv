nesakritiba: ""
piezimes: "Vērtēšanas avots — paplašinātā programma (CVK citāta nav: CVK „universitāšu sadarbību ar industriju” ir Zinātniskās darbības likuma mērķis, sk. jv-zinatniskas-darbibas-likums). Punkta otrais teikums — atsevišķs Solījums jv-patentesanas-un-jaunuznemumu-atbalsts. „tā radot konkurētspējīgos produktus” — mērķis. Nepārbaudāms: „veidosim ciešu sinerģiju” bez mēra. Nav apvienots ar jv-zinatnietilpigu-produktu-atbalsts (tur — uzņēmējdarbības atbalsts, šeit — universitāšu sadarbība). Augstskolas — IZM, EM papildu (industrija; pieņēmums, nav pārbaudīts)."
jautajums: ""
