avoti:
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Spēcīgi reģioni, droša pierobeža, vienādas iespējas visā Latvijā"
    citats: "Īstenosim rīcības plānu Latvijas austrumu teritoriju ekonomiskajai izaugsmei un drošībai, paplašinot Latgales speciālās ekonomiskās zonas darbību un nodrošinot nodokļu atlaides uzņēmumiem, kas rada jaunas darba vietas līdz 100 kilometru attālumā no Eiropas Savienības ārējās robežas"
nesakritiba: ""
piezimes: "Dalīts no austrumu teritoriju rīcības plāna punkta (sk. jv-latgales-sez-paplasinasana); citēts viss punkts, jo daļa ir „-ot” konstrukcija (§1). Pārbaudāms: nodokļu atlaides ieviestas vai nē. Nodokļi — FM, VARAM papildu (reģionālā politika; pieņēmums, nav pārbaudīts). Prioritāte „Nodokļu stimuli, cilvēkkapitāla piesaiste un infrastruktūras sasniedzamība līdz 100 kilometriem no Eiropas Savienības ārējās robežas” pārklāta šeit un jv-celu-finansejums-pierobeza."
jautajums: ""
