id: jv-programma-darba-tirgus-kompetencem
saraksts: jv
nosaukums: "Programma darba tirgum nepieciešamo kompetenču apguvei"
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: izm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība"
    citats: "Pārejai uz augstas produktivitātes ekonomiku nodrošināsim vienotu Latvijas cilvēkkapitāla pārvaldību un programmu darba tirgum nepieciešamo kompetenču apguvei"
nesakritiba: ""
piezimes: "CVK teikums dalīts (divi objekti ar atšķirīgu iznākumu): cilvēkkapitāla pārvaldība (jv-vienota-cilvekkapitala-parvaldiba), programma kompetenču apguvei (jv-programma-darba-tirgus-kompetencem); citēts teikums līdz attiecīgajai daļai (§3). Tikai CVK: paplašinātajā programmā šādas programmas nav; tuvākie punkti (individuālie mācīšanās konti, stars.gov.lv) nosauc citus konkrētus instrumentus — nav apvienoti (jv-individualie-macisanas-konti, jv-stars-platformas-paplasinasana). Pārbaudāms: programma izveidota vai nē. IZM, LM papildu (pieaugušo pārkvalifikācija; pieņēmums, nav pārbaudīts)."
jautajums: ""
