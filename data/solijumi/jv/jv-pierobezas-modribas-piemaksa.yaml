    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Civilā aizsardzība un vietējā drošība"
    citats: "Ieviesīsim «pierobežas modrības piemaksu» valsts un pašvaldību funkcijām kritiski svarīgajiem speciālistiem – policistiem, ugunsdzēsējiem, ārstniecības personālam un pedagogiem"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. „garantējot sabiedrisko pakalpojumu nepārtrauktību un pieejamību” — mērķis, nav dalīts. Pārbaudāms: piemaksa ieviesta vai nē. Tēma pēc tā, ko maina lasītājam (pakalpojumu pieejamība pierobežā). Iestāde — robežgadījums (starpnozaru: policisti, ugunsdzēsēji — IeM; ārstniecības personāls — VM; pedagogi — IZM): atlīdzības regulējums — FM, IeM un VARAM papildu (pieņēmums, nav pārbaudīts)."
jautajums: ""
