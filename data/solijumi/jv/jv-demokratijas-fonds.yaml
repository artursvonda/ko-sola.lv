piezimes: "Tikai paplašinātā programma. „kas caurspīdīgi, neatkarīgi … pieņem lēmumus par atbalstu …” — fonda apraksts, nav dalīts. Nav apvienots ar CVK „atbalstīsim biedrību un nodibinājumu darbu” (jv-biedribu-un-nodibinajumu-atbalsts) — konkrēts cits iznākums (§4). Pārbaudāms: fonds pārveidots vai nē. Atbildīgā iestāde — KM (Sabiedrības integrācijas fonda pārraudzība; pieņēmums, nav pārbaudīts)."
