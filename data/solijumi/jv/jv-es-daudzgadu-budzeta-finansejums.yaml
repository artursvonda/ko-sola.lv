id: jv-es-daudzgadu-budzeta-finansejums
saraksts: jv
nosaukums: ES daudzgadu budžeta finansējums drošībai, kohēzijai, lauksaimniecībai u. c.
parbaudams: true
temas:
  galvena: arpolitika
  papildu: [nodokli-un-budzets, regioni-un-pasvaldibas]
iestades:
  galvena: fm
  papildu: [arm]
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: 'ES daudzgadu budžeta sarunās aizstāvēsim finansējumu drošībai, robežai, kohēzijai, lauksaimniecībai, "Rail Baltica", pētniecībai un inovācijām'
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Turpināsim iestāties par Latvijas interesēm un konkurētspēju Eiropas Savienības daudzgadu budžeta sarunās, nodrošinot nepieciešamo finansējumu drošībai un aizsardzībai, kohēzijai, lauksaimniecībai, «Rail Baltica», rūpniecības, tehnoloģiju, inovāciju un pētniecības attīstībai"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Turpināsim iestāties par Latvijas interesēm un konkurētspēju Eiropas Savienības daudzgadu budžeta sarunās, nodrošinot nepieciešamo finansējumu drošībai un aizsardzībai, kohēzijai, lauksaimniecībai, «Rail Baltica», rūpniecības, tehnoloģiju, inovāciju un pētniecības attīstībai"
nesakritiba: "CVK programma sola aizstāvēt finansējumu „drošībai, robežai, kohēzijai, lauksaimniecībai, … pētniecībai un inovācijām”, bet paplašinātā programma — „drošībai un aizsardzībai, kohēzijai, lauksaimniecībai, … rūpniecības, tehnoloģiju, inovāciju un pētniecības attīstībai” (papildus aizsardzība, rūpniecība un tehnoloģijas; robeža — atsevišķā punktā)."
piezimes: "Nedalīts: uzskaitījums zem viena darbības vārda („aizstāvēsim finansējumu”) bez atsevišķiem mērķiem (§1); paplašinātā programma to arī nedala. CVK „robežai” — pēc paplašinātās programmas dalījuma (robežai atsevišķs punkts, §4) Solījumā jv-es-finansejums-austrumu-robezai; CVK citāts attiecas uz abiem. Robežgadījums pārbaudāmībai: mēra nav, bet objekts konkrēts (finansējums nosauktām jomām ES daudzgadu budžetā) — Pārbaudāms pēc tā, vai pieņemtajā ES daudzgadu budžetā šīm jomām finansējums saglabāts. Paplašinātās programmas punkts sadaļās „Ārējā drošība” un „Latvija Eiropas kodolā …” atkārtojas — divi citāti. ES budžeta pozīcija — FM (pieņēmums, nav pārbaudīts), ĀM papildu. CVK 9. nodaļas „Pieprasīsim ES tiešmaksājumu pieaugumu …” — cits iznākums ar mēru, atstāts 9. nodaļas izpildei. Prioritāte „Latvijas interešu aizstāvība Eiropas Savienības daudzgadu budžetā …” pārklāta šeit."
jautajums: ""
