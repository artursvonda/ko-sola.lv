avoti:
  - veids: cvk
    vieta: "7. Zinātne, inovācijas un tehnoloģijas"
    citats: "Virzīsimies uz ieguldījumiem pētniecībā un attīstībā 3% no IKP, stiprinot valsts pētījumu programmas, bāzes finansējumu, nepārtrauktu pēcdoktorantūras finansējumu un industriālo doktorantūru"
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Nodrošināsim nepārtrauktu pēcdoktorantūras finansējumu"
nesakritiba: ""
piezimes: "CVK teikuma „-ot” daļa dalīta pēc paplašinātās programmas dalījuma (§4; sk. jv-petniecibai-un-attistibai-3-no-ikp); daļai nav sava darbības vārda — citēts viss teikums (§3). Paplašinātās programmas punkta otrā daļa „attīstīsim zinātnē balstītu inovāciju ekonomiku …” — atsevišķs Solījums jv-zinatne-balstita-inovaciju-ekonomika (§1). Pārbaudāms: pēcdoktorantūras finansējums pieejams bez pārtraukumiem starp programmām vai nē. IZM. Prioritāte „Nepārtraukts pēcdoktorantūras finansējums …” pārklāta šeit."
jautajums: ""
