id: jv-slepta-korupcija-tirgosanas-ar-ietekmi
saraksts: jv
nosaukums: Regulējums pret tirgošanos ar ietekmi un amatpersonu «piebarošanu»
parbaudams: true
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: []
iestades:
  galvena: tm
  papildu: [vk]
avoti:
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Godīga konkurence un investīciju vides tiesiskā drošība"
    citats: "Pilnveidosim tiesisko regulējumu un kontroles mehānismus, novēršot un atklājot slēptās korupcijas izpausmes – tirgošanos ar ietekmi un amatpersonu slēptu materiālo stimulēšanu («piebarošanu»)"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Nav apvienots ar jv-pret-korupciju-un-interesu-konfliktiem — konkrēts, cits iznākums (nosauktas slēptās korupcijas izpausmes). Robežgadījums pārbaudāmībai: „pilnveidosim” bez mēra, bet objekts konkrēts — regulējums vai kontroles mehānismi tirgošanās ar ietekmi un slēptas materiālās stimulēšanas novēršanai pieņemti vai nē (kā jv-mezsaimniecibas-regulejums-zinatniski); Pārbaudāms. Atbildīgā iestāde nav droša: TM (krimināltiesiskais regulējums), VK papildu (KNAB; pieņēmums, nav pārbaudīts)."
jautajums: ""
