id: jv-petniecibai-un-attistibai-3-no-ikp
saraksts: jv
nosaukums: Ieguldījumi pētniecībā un attīstībā 3% no IKP
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [nodokli-un-budzets, ekonomika-un-darbs]
iestades:
  galvena: izm
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "7. Zinātne, inovācijas un tehnoloģijas"
    citats: "Virzīsimies uz ieguldījumiem pētniecībā un attīstībā 3% no IKP"
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Virzīsimies uz 3% no iekšzemes kopprodukta ieguldījumu pētniecībā un attīstībā, tajā skaitā 1,5% no publiskā un 1,5% no privātā sektora"
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Palielināsim finansējumu zinātnei, pētniecībai un attīstībai"
nesakritiba: "CVK programma sola virzīties uz 3% no IKP kopumā, bet paplašinātā programma — uz 3%, „tajā skaitā 1,5% no publiskā un 1,5% no privātā sektora”."
piezimes: "CVK „-ot” daļas: „bāzes finansējumu” un „nepārtrauktu pēcdoktorantūras finansējumu” — atsevišķi Solījumi pēc paplašinātās programmas dalījuma (§4; jv-zinatnes-bazes-finansejuma-pilnveide, jv-nepartraukts-pecdoktoranturas-finansejums); „valsts pētījumu programmas” un „industriālo doktorantūru” paplašinātās programmas Apņemšanās nav — apraksta veidu, kā virzīties uz 3%, nav dalīti (§1). Paplašinātās programmas punkts „Palielināsim finansējumu zinātnei, pētniecībai un attīstībai kā nozīmīgam ekonomikas un izaugsmes virzītājam” — tas pats iznākums (ieguldījumu pētniecībā un attīstībā pieaugums) bez mēra, apvienots (§4); „kā nozīmīgam … virzītājam” — pamatojums. Robežgadījums pārbaudāmībai: „virzīsimies uz” ir nodoms, bet mērs konkrēts (3% no IKP; paplašinātajā — 1,5% publiskais) — Pārbaudāms pēc sasniegtā līmeņa un virzības; termiņš nav norādīts. Zinātnes finansējums — IZM, FM papildu (budžets; pieņēmums, nav pārbaudīts). Prioritāte „… virzība uz 3% no iekšzemes kopprodukta ieguldījumiem pētniecībā un attīstībā” pārklāta šeit."
jautajums: ""
