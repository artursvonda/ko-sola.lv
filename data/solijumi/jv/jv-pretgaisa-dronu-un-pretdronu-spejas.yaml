id: jv-pretgaisa-dronu-un-pretdronu-spejas
saraksts: jv
nosaukums: Pretgaisa, dronu un pretdronu spēju stiprināšana
parbaudams: false
temas:
  galvena: aizsardziba
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: am
  papildu: [iem]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Stiprināsim pretgaisa, dronu un pretdronu, un citas mūsdienīgas aizsardzības spējas, izmantojot Ukrainas pieredzi"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība"
    citats: "Pārņemsim Ukrainas kaujās gūto pieredzi, attīstot pretdronu spējas un nodrošinot Latvijas iedzīvotāju un kritiskās infrastruktūras aizsardzību no bezpilota gaisa kuģu apdraudējuma"
nesakritiba: ""
piezimes: "Nepārbaudāms: „stiprināsim”/„attīstot” bez mēra; uzskaitījums zem viena darbības vārda nav dalīts (metodes §1). Paplašinātās programmas punkts ir CVK teikuma daļa (pretdronu spējas, Ukrainas pieredze) ar mērķi (iedzīvotāju un kritiskās infrastruktūras aizsardzība) — tas pats Solījums; šaurāks tvērums nav uzskatīts par būtisku Nesakritību. Punkts atrodas iekšējās drošības sadaļā — IeM papildu."
jautajums: ""
