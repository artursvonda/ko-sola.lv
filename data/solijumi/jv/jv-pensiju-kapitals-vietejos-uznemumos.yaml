id: jv-pensiju-kapitals-vietejos-uznemumos
saraksts: jv
nosaukums: Pensiju kapitāla novirzīšana vietējos uzņēmumos
parbaudams: false
temas:
  galvena: ekonomika-un-darbs
  papildu: [socialais-atbalsts-un-pensijas]
iestades:
  galvena: fm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķēti atbalstīsim eksportspējīgus uzņēmumus, industriālos parkus, zinātņietilpīgus produktus, kapitāla tirgu"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Sekmēsim pensiju kapitāla novirzīšanu vietējos uzņēmumos, izmantojot augstāka riska finanšu instrumentus un vēlīnās stadijas riska kapitālu"
nesakritiba: "CVK programma sola „Mērķēti atbalstīsim … kapitāla tirgu” bez konkrēta iznākuma, bet paplašinātā programma — „Sekmēsim pensiju kapitāla novirzīšanu vietējos uzņēmumos”."
piezimes: "CVK „kapitāla tirgu” pievienots paplašinātās 4. nodaļas kapitāla tirgus punktiem (§4; redaktora lēmums 3. nodaļā — CVK vispārīgo kapitāla tirgus teikumu pievienot konkrētajiem Solījumiem): šeit un jv-kapitalsabiedribu-akciju-kotacija-birza. Daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Robežgadījums pārbaudāmībai: objekts samērā konkrēts, bet „sekmēsim” bez mēra (nav apjoma vai īpatsvara) — Nepārbaudāms. „izmantojot …” apraksta veidu, nav dalīts. Kapitāla tirgus — FM, LM papildu (fondētās pensijas; pieņēmums, nav pārbaudīts). Prioritāte „Liela mēroga investīciju un eksporta izrāviens, … mobilizējot Latvijas iekšējo kapitāla tirgu” pārklāta šeit."
jautajums: ""
