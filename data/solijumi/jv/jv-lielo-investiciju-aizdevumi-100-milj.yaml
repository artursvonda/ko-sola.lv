piezimes: "Vērtēšanas avots — paplašinātā programma (CVK citāta nav; CVK „Mērķēti atbalstīsim eksportspējīgus uzņēmumus” nav pievienots — punkts attiecas uz lielajiem uzņēmumiem, ne eksportspēju). „tādējādi piedāvājot … atbalstu lielo uzņēmumu straujākai mērogošanai” — mērķis, nav dalīts. Pārbaudāms: 100 miljoni eiro gadā piešķirti šādiem aizdevumiem vai nē. Uzņēmējdarbības atbalsta programmas — EM, FM papildu (budžets; pieņēmums, nav pārbaudīts)."
