    pamatojums: >-
      MK rīkojums Nr. 628 ir datēts formāls solis ceļā uz iznākumu: valdība atbalsta investīciju
      fonda modeli ar Altum aizdevumiem ar kapitāla atlaidi un uzdod EM to ieviest; finansējums
      (100 miljoni eiro gadā) vēl nav piešķirts, tāpēc ne Izpildīts (vertesana.md: Procesā).
