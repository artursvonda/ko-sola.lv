piezimes: "Tikai paplašinātā programma. Uzskaitījums zem viena darbības vārda nav dalīts (§1); „veicinot līderību” — mērķis. Nepārbaudāms: „veicināsim” bez konkrēta iznākuma. Nav apvienots ar jv-civildienesta-vadibas-kapacitate (tur — kapacitāte reformu īstenošanai) un jv-vaditaju-vertesana-pec-rezultatiem (tur — ministru un iestāžu vadītāju vērtēšana pēc nozaru rezultātiem); robežgadījums. VK (valsts pārvaldes cilvēkresursu politika; pieņēmums, nav pārbaudīts)."
