avoti:
  - veids: cvk
    vieta: "5. Veselība, labklājība un demogrāfija"
    citats: "Stiprināsim mediķu izglītību, cieņpilnu atalgojumu un krīzes gatavību"
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Investīcijas veselībā, pakalpojumu pieejamība un noturība"
    citats: "Stiprināsim veselības sektora gatavību krīzēm, nodrošinot medikamentu un medicīnas rezervju pieejamību, un nepārtrauktus veselības aprūpes pakalpojumus ārkārtas situācijās"
nesakritiba: ""
piezimes: "CVK teikuma daļai „krīzes gatavību” nav sava darbības vārda — citēts viss teikums (§3). „nodrošinot medikamentu un medicīnas rezervju pieejamību, un nepārtrauktus … pakalpojumus” apraksta, kā stiprinās gatavību (bez mēra), nav dalīts. Nepārbaudāms: „stiprināsim” bez mēra. 1. nodaļas jv-valsts-materialo-rezervju-sistema (jauna valsts materiālo rezervju sistēma ar vienu aģentūru) — cits iznākums. VM."
