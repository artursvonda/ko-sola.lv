id: jv-remigracijas-veicinasana
saraksts: jv
nosaukums: Remigrācijas veicināšana
parbaudams: false
temas:
  galvena: migracija-un-diaspora
  papildu: [izglitiba-un-zinatne]
iestades:
  galvena: arm
  papildu: [varam, izm]
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "veicināsim pilsoņu atgriešanos Latvijā"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Sekmēsim diasporas ilgtermiņa saikni ar Latviju, remigrāciju"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Sabiedrības iesaiste, noturība un atbalsts cilvēkiem; diasporas potenciāla izmantošana"
    citats: "Sekmēsim remigrāciju, mobilitāti un iekļaušanos izglītības sistēmā, turpinot mērķtiecīgu sadarbību ar diasporas kopienām, attīstot pilsoniskās līdzdalības iespējas un vienkāršojot procesus valsts un pašvaldību līmenī"
nesakritiba: ""
piezimes: "Nepārbaudāms: „veicināsim”/„sekmēsim” bez mēra (nav remigrantu skaita). Mobilitāte un iekļaušanās izglītības sistēmā — uzskaitījums zem viena darbības vārda, attiecas uz remigrāciju, nav dalīts; „-ot” daļas apraksta veidu (arī „attīstot pilsoniskās līdzdalības iespējas” — bez konkrēta objekta), nav dalītas. Atbildīgā iestāde neskaidra: ĀM kā diasporas politikas koordinētāja (pieņēmums), VARAM (reģionālā remigrācija) un IZM (iekļaušanās izglītībā) papildu."
jautajums: ""
