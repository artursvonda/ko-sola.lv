id: jv-militarais-atbalsts-ukrainai-0-25-ikp
saraksts: jv
nosaukums: Militārais atbalsts Ukrainai vismaz 0,25% no IKP gadā
parbaudams: true
temas:
  galvena: arpolitika
  papildu: [aizsardziba]
iestades:
  galvena: am
  papildu: []
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "Turpināsim visaptverošu politisku, militāru un diplomātisku atbalstu Ukrainai"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Turpināsim visaptverošu atbalstu Ukrainai, tostarp militāro atbalstu vismaz 0,25% no iekšzemes kopprodukta gadā"
nesakritiba: "CVK programma sola „militāru … atbalstu Ukrainai” bez apjoma, bet paplašinātā programma — „militāro atbalstu vismaz 0,25% no iekšzemes kopprodukta gadā”; vērtē pēc šī mēra."
piezimes: "Paplašinātā programma CVK teikuma saturu sadala: vispārīgs visaptverošs atbalsts (jv-visaptveross-atbalsts-ukrainai) un militārais atbalsts ar mēru — sekots šim dalījumam, CVK citāts pievienots abiem (§4). Vērtēšanas avots — CVK; tajā mēra nav, tāpēc vērtē pēc paplašinātās programmas mēra (0,25% no IKP gadā). Militāro atbalstu Ukrainai nodrošina AM."
jautajums: ""
