piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Atsevišķs darbības vārds paplašinātās programmas punktā — atsevišķs Solījums no jaunām jaudām. „nodrošinot nepieciešamo finansējumu infrastruktūras modernizācijai” apraksta veidu bez apjoma, nav dalīts. Nepārbaudāms: „stiprināsim”/„attīstīsim tīklus” bez mēra; „nepieciešamo finansējumu” nav kvantificēts. KEM."
