avoti:
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Stiprināsim Eiropas Savienības un Latvijas ekonomisko drošību, dažādojot eksporta tirgus, slēdzot jaunus brīvās tirdzniecības līgumus un veidojot jaunas ekonomiskās un izejvielu partnerības"
nesakritiba: ""
piezimes: "Galvenais teikums („Stiprināsim … ekonomisko drošību”) vispārīgs — Solījumi ir „-ot” daļas (§1); citēts teikums līdz šai daļai. Robežgadījums pārbaudāmībai: „jaunas partnerības” bez nosauktiem partneriem, skaita vai juridiskās formas — Nepārbaudāms. Nav skaidrs, vai partnerības veido ES vai Latvija; ĀM (ārējās ekonomiskās attiecības, pieņēmums) galvenā, EM papildu."
jautajums: ""
