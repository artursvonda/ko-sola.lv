id: jv-pedagogu-atalgojums-pec-mk-grafika
saraksts: jv
nosaukums: "Pedagogu atalgojums atbilstoši MK pieņemtajam paaugstināšanas grafikam"
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: []
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība"
    citats: "Nodrošināsim kvalitatīvu, drošu un iekļaujošu izglītību katram bērnam, mūsdienīgus, pieejamus mācību līdzekļus un taisnīgu, konkurētspējīgu atalgojumu visiem pedagogiem"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kvalitatīva, pieejama izglītība katram bērnam"
    citats: "Stiprināsim pedagogu motivāciju, autonomiju un profesijas prestižu, nodrošinot konkurētspējīgu atalgojumu, atbilstoši Evikas Siliņas vadītā Ministru kabineta pieņemtajam atalgojuma paaugstināšanas grafikam"
nesakritiba: "CVK sola „taisnīgu, konkurētspējīgu atalgojumu visiem pedagogiem” bez mēra, paplašinātā programma — „konkurētspējīgu atalgojumu, atbilstoši Evikas Siliņas vadītā Ministru kabineta pieņemtajam atalgojuma paaugstināšanas grafikam”."
piezimes: "CVK teikums (viens darbības vārds, trīs objekti ar atšķirīgu iznākumu) dalīts pēc paplašinātās programmas punktiem (§4): izglītības kvalitāte (jv-kvalitativa-izglitiba-katram-bernam), mācību līdzekļi (jv-macibu-lidzekli-un-gramata-katra-prieksmeta), pedagogu atalgojums (jv-pedagogu-atalgojums-pec-mk-grafika); citēts teikums līdz attiecīgajai daļai (§3). Paplašinātās programmas galvenais teikums („Stiprināsim pedagogu motivāciju, autonomiju un profesijas prestižu”) vispārīgs — Solījums ir „-ot” daļa (§1), citēts viss punkts. Pārbaudāms: atalgojums paaugstināts atbilstoši grafikam vai nē; grafika termiņi un apmēri avotā nav doti (jāatrod MK lēmumā). IZM."
jautajums: ""
