nesakritiba: ""
piezimes: "Vērtēšanas avots — CVK programma (nodaļa „2. Ārpolitika un latvieši pasaulē”, pievienota 2. nodaļas izpildē). Nepārbaudāms: „visaptverošs atbalsts” bez mēra; uzskaitījums („politisku, militāru un diplomātisku”) zem viena darbības vārda nav dalīts; „līdz taisnīgam mieram” — atbalsta ilgums, ne atsevišķs iznākums (paplašinātajā programmā nav minēts; nav uzskatīts par būtisku Nesakritību). Mērs militārajam atbalstam (vismaz 0,25% no IKP gadā) — atsevišķs Solījums jv-militarais-atbalsts-ukrainai-0-25-ikp (paplašinātās programmas dalījums; CVK citāts pievienots arī tam, §4). CVK teikuma daļa „… un Ukrainas eiroatlantiskajai integrācijai” — jv-ukrainas-eiroatlantiska-integracija."
