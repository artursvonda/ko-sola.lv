    citats: "Veidosim cilvēkcentrētu pakalpojumu sniegšanas modeli, pakalpojumam nosakot «vienu īpašnieku»"
nesakritiba: ""
piezimes: "CVK teikums (viens darbības vārds, īpašību uzskaitījums) dalīts pēc paplašinātās programmas dalījuma (§4): skaidra atbildība (šeit, paplašinātās „vienu īpašnieku”), digitāla pieejamība (jv-publisko-pakalpojumu-digitalizacija), lietotāja pieredzes mērījumi un izmaksas (jv-pakalpojumu-kvalitates-merisana); citēts teikums līdz attiecīgajai daļai (§3). Paplašinātās punkta galvenais teikums („Veidosim cilvēkcentrētu pakalpojumu sniegšanas modeli”) ir ietvars, ko konkretizē „-ot” daļas — tās ir atsevišķi Solījumi (§1); CVK „pakalpojumus cilvēka dzīves situācijām” — tāpat ietvars, atsevišķi nav izrakstīts. Pārbaudāms: pakalpojumiem noteikts viens atbildīgais („īpašnieks”) vai nē. Prioritāte „Cilvēkcentrēti pakalpojumi …” daļēji pārklāta šeit un saistītajos Solījumos. Publisko pakalpojumu politika — VARAM (pieņēmums, nav pārbaudīts)."
jautajums: ""
