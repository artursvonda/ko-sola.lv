  galvena: izglitiba-un-zinatne
  papildu: [socialais-atbalsts-un-pensijas]
iestades:
  galvena: izm
  papildu: [lm]
avoti:
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Labklājība un vecuma pensiju sistēma"
    citats: "Atbalstīsim un veicināsim senioriem pieejamu mūžizglītības sistēmu, arī senioru skolas, digitālās un veselībpratības programmas"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Darba tirgus vajadzībām atbilstoša mūžizglītība"
    citats: "Rūpējoties par sudraba ekonomikas attīstību, veidosim īpaši mērķētu piedāvājumu senioriem"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Nepārbaudāms: „atbalstīsim un veicināsim” bez mēra. 8. nodaļas punkts „Rūpējoties par sudraba ekonomikas attīstību, veidosim īpaši mērķētu piedāvājumu senioriem” — tas pats Solījums, citāts pievienots 8. nodaļas izpildē: atrodas mūžizglītības sadaļā, tātad piedāvājums ir mūžizglītības piedāvājums senioriem, lai gan mūžizglītība tieši nav nosaukta; „Rūpējoties par sudraba ekonomikas attīstību” — mērķis. IZM, LM papildu (pieņēmums, nav pārbaudīts)."
jautajums: ""
