  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "Stiprināsim diasporas saikni ar Latviju, veicināsim pilsoņu atgriešanos Latvijā, latviešu valodas un kultūras saglabāšanu"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Sekmēsim diasporas ilgtermiņa saikni ar Latviju, remigrāciju, stiprinot latviešu valodu un kultūru kā vienojošu pamatu"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Sabiedrības iesaiste, noturība un atbalsts cilvēkiem; diasporas potenciāla izmantošana"
    citats: "Veicināsim diasporas ilgtermiņa saikni ar Latviju, stiprinot latviešu valodu, kultūru un nacionālo identitāti kā vienojošu pamatu"
nesakritiba: ""
piezimes: "CVK teikums dalīts pēc paplašinātās programmas dalījuma (saikne ar valodu un kultūru / remigrācija / ekonomiskā diplomātija, §4). Paplašinātajā programmā latviešu valodas un kultūras stiprināšana ir saiknes „vienojošs pamats” („-ot” daļa apraksta veidu) — apvienots ar CVK „latviešu valodas un kultūras saglabāšanu”; CVK citāts līdz šai daļai (§3). Nepārbaudāms: bez mēra. Diasporas politikas koordinācija — ĀM (pieņēmums, nav pārbaudīts avotā); IZM (valodas apguve), KM (kultūra) papildu."
