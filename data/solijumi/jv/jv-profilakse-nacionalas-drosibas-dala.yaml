    citats: "Noteiksim profilaksi par vienu no veselības politikas prioritātēm"
nesakritiba: "CVK programma sola „Profilaksi un veselībpratību padarīsim par nacionālās drošības daļu”, bet paplašinātā programma — „Noteiksim profilaksi par vienu no veselības politikas prioritātēm” (cits ietvars: veselības politika, ne nacionālā drošība; veselībpratību nemin); Statuss pēc CVK."
piezimes: "Apvienots (§4): abi avoti sola profilakses nostiprināšanu politikas plānošanā; atšķiras ietvars. Paplašinātās programmas punkta otrais teikums (nodokļu ieņēmumu novirzīšana) — atsevišķs Solījums jv-akcizes-ienemumi-veselibai. 3. punkta „balstoties Ziemeļvalstu pieejā par veselībpratību kā daļu no valsts drošības un sabiedrības noturības” apraksta veselības mācības pieeju (jv-veselibas-macibas-pilnveide-skolas), šeit nav pievienots. Robežgadījums pārbaudāmībai: iznākums pārbaudāms nacionālās drošības plānošanas dokumentos (vai profilakse un veselībpratība tajos iekļauta) — Pārbaudāms. VM, VK papildu (nacionālās drošības plānošana; pieņēmums, nav pārbaudīts)."
