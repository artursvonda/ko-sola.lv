id: jv-administrativa-sloga-samazinasana
saraksts: jv
nosaukums: Administratīvā sloga samazināšana uzņēmumiem, īpaši mazajiem
parbaudams: false
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Samazināsim administratīvo slogu, īpaši mazajiem uzņēmumiem"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Izveidosim elastīgu finanšu instrumentu sistēmu, mērķtiecīgi atbalstot uzņēmumus ar vislielāko izaugsmes potenciālu, sistemātiski mazinot administratīvo slogu mazajiem un vidējiem uzņēmumiem"
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Godīga konkurence un investīciju vides tiesiskā drošība"
    citats: "Veicināsim godīgu konkurenci, mazinot administratīvo slogu uzņēmējdarbībā un atsakoties no lieka birokrātiskā regulējuma"
nesakritiba: ""
piezimes: "Paplašinātās 4. nodaļas punkta „-ot” daļa „sistemātiski mazinot administratīvo slogu mazajiem un vidējiem uzņēmumiem” — tas pats Solījums; citēts punkts līdz šai daļai. 10. nodaļas punkta „-ot” daļa (§0.3) — tas pats Solījums; galvenais teikums „Veicināsim godīgu konkurenci” 10. nodaļas izpildē nav izrakstīts atsevišķi — vispārīgs darbības vārds, Solījums ir tikai „-ot” daļa (§1). Robežgadījums pārbaudāmībai: „Samazināsim” norāda virzienu, bet nav mēra un vienota rādītāja — Nepārbaudāms. ES regulējuma vienkāršošana ar mēru (vismaz 25%) — cits Solījums (jv-es-regulejuma-vienkarsosana). Uzņēmējdarbības vide — EM (pieņēmums, nav pārbaudīts)."
jautajums: ""
