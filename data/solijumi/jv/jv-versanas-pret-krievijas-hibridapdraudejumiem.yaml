id: jv-versanas-pret-krievijas-hibridapdraudejumiem
saraksts: jv
nosaukums: Vēršanās pret Krievijas hibrīdapdraudējumiem un sankciju apiešanu
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [arpolitika]
iestades:
  galvena: iem
  papildu: [fm]
avoti:
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Valsts aizsardzība pret ārējiem riskiem (hibrīdkarš, dezinformācija)"
    citats: "Turpināsim stiprināt valsts un sabiedrības drošību, stingri vēršoties pret Krievijas īstenotajiem hibrīdapdraudējumiem, dezinformācijas kampaņām, jebkāda veida atbalsta sniegšanu Krievijai un starptautisko sankciju apiešanu"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Galvenais teikums („Turpināsim stiprināt valsts un sabiedrības drošību”) ir vispārīgs — Solījums ir „-ot” daļa (§1); citēts viss punkts. Uzskaitījums zem viena darbības vārda nav dalīts (§1). Nav apvienots ar jv-cina-pret-krievijas-dezinformaciju (tur — starptautiskajās organizācijās un tiesās), jv-sankciju-pret-krieviju-pastiprinasana (tur — sankciju stiprināšana, šeit — to apiešanas apkarošana) un jv-sabiedribas-noturiba-pret-informacijas-manipulaciju (sabiedrības noturība). Nepārbaudāms: bez konkrēta iznākuma. Atbildīgā iestāde nav droša: IeM (valsts drošības iestādes), FM papildu (sankciju apiešanas kontrole muitā; pieņēmums, nav pārbaudīts); iesaistīta arī ĀM."
jautajums: ""
