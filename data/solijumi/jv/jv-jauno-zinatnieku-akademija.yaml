id: jv-jauno-zinatnieku-akademija
saraksts: jv
nosaukums: Jauno zinātnieku akadēmija kā partneris zinātnes politikā
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: []
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: "7. Zinātne, inovācijas un tehnoloģijas"
    citats: "Stiprināsim jauno zinātnieku lomu zinātnes politikas, kvalitātes un ētikas lēmumos"
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Stiprināsim jauno zinātnieku lomu lēmumu pieņemšanā, ieviešot Jauno zinātnieku akadēmiju kā partneri zinātnes politikas, kvalitātes un ētikas jautājumu veidošanā"
nesakritiba: "CVK programma sola „Stiprināsim jauno zinātnieku lomu” bez konkrēta mehānisma, bet paplašinātā programma — „ieviešot Jauno zinātnieku akadēmiju kā partneri”."
piezimes: "Paplašinātās programmas punktā galvenais teikums vispārīgs — Solījums ir „-ot” daļa (§1). Otrā „-ot” daļa („attīstot nacionālu akadēmiskās ētikas … sistēmu”) — atsevišķs Solījums jv-akademiskas-etikas-atbalsta-sistema. CVK citātā mēra nav — vērtē pēc paplašinātās programmas (§4). Pārbaudāms: Jauno zinātnieku akadēmija ieviesta kā partneris zinātnes politikas veidošanā vai nē (nav pārbaudīts, vai šāda akadēmija jau pastāv). IZM. Prioritāte „Jauno zinātnieku iesaiste zinātnes politikas, kvalitātes un ētikas lēmumos” pārklāta šeit."
jautajums: ""
