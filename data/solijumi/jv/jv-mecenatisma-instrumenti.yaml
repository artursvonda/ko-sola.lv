piezimes: "Tikai paplašinātā programma. „dodot jaunus impulsus mecenātismam un sponsorēšanai” — mērķis, nav citēts. Nav apvienots ar jv-iin-1-procents-sporta-organizacijam (5. nodaļa; tur — konkrēts IIN mehānisms tikai sportam). Robežgadījums pārbaudāmībai: instrumenti nav nosaukti, bet iznākums — jauns instruments ieviests vai nē — Pārbaudāms. Atbildīgā iestāde nav droša (kultūra, sports, NVO; iespējami nodokļu instrumenti); KM, FM un IZM papildu (pieņēmums, nav pārbaudīts)."
