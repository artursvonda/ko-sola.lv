id: jv-es-finansejums-austrumu-robezai
saraksts: jv
nosaukums: Lielāks ES finansējums austrumu robežas drošībai
parbaudams: true
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [arpolitika]
iestades:
  galvena: iem
  papildu: []
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "ES daudzgadu budžeta sarunās aizstāvēsim finansējumu drošībai, robežai"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība"
    citats: "Iestāsimies par lielāka Eiropas Savienības finansējuma pieejamību austrumu robežas un reģiona drošībai"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Panāksim turpmāku Eiropas Savienības aktīvu atbalstu un finansējumu ārējo robežu aizsardzībai un pierobežas reģionu attīstībai"
nesakritiba: "CVK programma sola ES daudzgadu budžeta sarunās „aizstāvēsim finansējumu … robežai” bez mēra, paplašinātās programmas 1. nodaļā — „Iestāsimies par lielāka Eiropas Savienības finansējuma pieejamību”, 2. nodaļā — „Panāksim turpmāku … finansējumu” (vērtē pēc „lielāka”)."
piezimes: "Vērtēšanas avots — CVK programma (pievienota 2. nodaļas izpildē); tajā mēra nav, tāpēc vērtē pēc paplašinātās programmas 1. nodaļas „lielāka” (§4) — Pārbaudāms pēc tā, vai ES finansējums austrumu robežai palielinājās. CVK teikuma „robežai” daļa pievienota šim Solījumam pēc paplašinātās programmas dalījuma (tās ES daudzgadu budžeta punkts robežu nemin, robežai — atsevišķs punkts, §4); pārējais teikums — jv-es-daudzgadu-budzeta-finansejums. 2. nodaļas punkta daļa „pierobežas reģionu attīstībai” — atsevišķs Solījums jv-es-finansejums-pierobezas-regioniem (cits iznākums un Atbildīgā iestāde, §1). ES līmeņa solījums — nozares ministrija (robeža — IeM)."
jautajums: ""
