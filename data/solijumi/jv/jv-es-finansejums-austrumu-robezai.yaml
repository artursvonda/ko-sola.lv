id: jv-es-finansejums-austrumu-robezai
saraksts: jv
nosaukums: Lielāks ES finansējums austrumu robežas drošībai
parbaudams: true
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [arpolitika]
iestades:
  galvena: iem
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība"
    citats: "Iestāsimies par lielāka Eiropas Savienības finansējuma pieejamību austrumu robežas un reģiona drošībai"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Panāksim turpmāku Eiropas Savienības aktīvu atbalstu un finansējumu ārējo robežu aizsardzībai un pierobežas reģionu attīstībai"
nesakritiba: "1. nodaļā sola „Iestāsimies par lielāka Eiropas Savienības finansējuma pieejamību” „austrumu robežas un reģiona drošībai”, bet 2. nodaļā — „Panāksim turpmāku … finansējumu” „ārējo robežu aizsardzībai un pierobežas reģionu attīstībai” (stiprāka apņemšanās, bet „turpmāku”, ne „lielāka”; tvērumā arī pierobežas reģionu attīstība)."
piezimes: "„Iestāsimies par X” ar konkrētu X (lielāks ES finansējums robežas drošībai) — Pārbaudāms pēc tā, vai ES finansējums austrumu robežai palielinājās. Vērtēšanas avots — 1. nodaļas punkts (CVK citāta nav). ES līmeņa solījums — nozares ministrija (robeža — IeM). CVK nodaļas „2. Ārpolitika un latvieši pasaulē” teikums „ES daudzgadu budžeta sarunās aizstāvēsim finansējumu drošībai, robežai …” atstāts 2. nodaļas izpildei."
jautajums: ""
