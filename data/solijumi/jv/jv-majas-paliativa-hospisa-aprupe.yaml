id: jv-majas-paliativa-hospisa-aprupe
saraksts: jv
nosaukums: "Mājas, paliatīvās un hospisa aprūpes pakalpojumu attīstība"
parbaudams: false
temas:
  galvena: veseliba
  papildu: [socialais-atbalsts-un-pensijas]
iestades:
  galvena: vm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "5. Veselība, labklājība un demogrāfija"
    citats: "stiprināsim primāro aprūpi, ģimenes ārstu pieejamību, slimnīcu pakalpojumus, zāļu pieejamību, onkoloģijas, sirds un asinsvadu, garīgās veselības, rehabilitācijas, paliatīvās aprūpes un hospisa pakalpojumus"
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Investīcijas veselībā, pakalpojumu pieejamība un noturība"
    citats: "Izveidosim vienotu, cilvēkam saprotamu veselības un sociālās aprūpes sistēmu, attīstot pieejamus mājas aprūpes, paliatīvās un hospisa aprūpes pakalpojumus"
nesakritiba: ""
piezimes: "Paplašinātās programmas punkta „-ot” daļa nosauc konkrētus pakalpojumus ar savu iznākumu — atsevišķs Solījums no vienotas veselības un sociālās aprūpes sistēmas (jv-veselibas-un-socialas-aprupes-integracija) (§1); citēts punkts līdz „-ot” daļas beigām. CVK daļai „paliatīvās aprūpes un hospisa pakalpojumus” nav sava darbības vārda — citēta visa „stiprināsim …” daļa (§3). CVK mājas aprūpi nemin — nav uzskatīts par būtisku Nesakritību. Mājas aprūpe minēta arī punktā par senioriem (jv-majas-aprupe-un-atbalsts-aprupetajiem) — tur kopā ar atbalstu aprūpētājām ģimenēm, atstāts atsevišķi. Nepārbaudāms: „stiprināsim”/„attīstot pieejamus” bez mēra. VM, LM papildu (mājas aprūpe ir arī sociālais pakalpojums; pieņēmums, nav pārbaudīts)."
jautajums: ""
