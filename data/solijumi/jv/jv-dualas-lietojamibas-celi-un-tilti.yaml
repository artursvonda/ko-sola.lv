id: jv-dualas-lietojamibas-celi-un-tilti
saraksts: jv
nosaukums: "Duālas lietojamības ceļu un tiltu infrastruktūra reģionos"
parbaudams: false
temas:
  galvena: transports
  papildu: [aizsardziba]
iestades:
  galvena: sm
  papildu: [am]
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: 'Satiksmē nodrošināsim "Rail Baltica", reģionālo ceļu, dzelzceļa, ostu, sabiedriskā transporta un digitālās infrastruktūras attīstību ar skaidru atbildību, termiņiem un izmaksu kontroli'
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Satiksme un pasažieru pārvadājumi"
    citats: "Attīstīsim duālas lietojamības ceļu un tiltu infrastruktūru reģionos"
nesakritiba: ""
piezimes: "CVK satiksmes teikums (viens darbības vārds, uzskaitījums bez sava darbības vārda katrai daļai) sadalīts pēc paplašinātās programmas dalījuma (§4); citēts viss teikums, jo kopīgais „attīstību” ir teikuma beigās (§3). Daļas: «Rail Baltica» (jv-rail-baltica-pamatsavienojums), reģionālie ceļi (jv-melna-seguma-autocelu-ipatsvars, jv-celu-finansejums-pierobeza, jv-dualas-lietojamibas-celi-un-tilti), dzelzceļš (jv-dzelzcela-pasazieru-parvadajumi), ostas (jv-ostu-konkuretspeja), sabiedriskais transports (jv-sabiedriska-transporta-reforma, jv-vienota-bilesu-sistema), digitālā infrastruktūra (jv-digitalas-infrastrukturas-attistiba). „ar skaidru atbildību, termiņiem un izmaksu kontroli” — veids, nav dalīts. Nepārbaudāms: „Attīstīsim” bez konkrēta objekta vai mēra. SM, AM papildu (militārā mobilitāte; pieņēmums, nav pārbaudīts)."
jautajums: ""
