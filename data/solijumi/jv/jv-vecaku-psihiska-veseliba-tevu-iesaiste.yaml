piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4, sk. jv-demografijas-politika); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Uzskaitījums zem viena darbības vārda, nav dalīts (§1). Nepārbaudāms: „stiprināsim” bez mēra. Starpnozaru: VM (psihiskā veselība), LM papildu (ģimenes atbalsts); pieņēmums, nav pārbaudīts."
