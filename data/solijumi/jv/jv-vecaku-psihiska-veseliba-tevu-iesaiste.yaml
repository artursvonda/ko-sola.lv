    vieta: "5. Veselība, labklājība un demogrāfija"
    citats: "Demogrāfijas politiku veidosim kā rūpes par stiprām ģimenēm, grūtniecību, dzemdībām, bērnu veselību, neauglības ārstēšanu, vecāku psihisko veselību, tēvu iesaisti"
  - veids: paplasinata
