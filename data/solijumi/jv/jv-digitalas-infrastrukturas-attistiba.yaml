avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: 'Satiksmē nodrošināsim "Rail Baltica", reģionālo ceļu, dzelzceļa, ostu, sabiedriskā transporta un digitālās infrastruktūras attīstību ar skaidru atbildību, termiņiem un izmaksu kontroli'
nesakritiba: ""
piezimes: "CVK satiksmes teikums (viens darbības vārds, uzskaitījums bez sava darbības vārda katrai daļai) sadalīts pēc paplašinātās programmas dalījuma (§4); citēts viss teikums, jo kopīgais „attīstību” ir teikuma beigās (§3). Daļas: «Rail Baltica» (jv-rail-baltica-pamatsavienojums), reģionālie ceļi (jv-melna-seguma-autocelu-ipatsvars, jv-celu-finansejums-pierobeza, jv-dualas-lietojamibas-celi-un-tilti), dzelzceļš (jv-dzelzcela-pasazieru-parvadajumi), ostas (jv-ostu-konkuretspeja), sabiedriskais transports (jv-sabiedriska-transporta-reforma, jv-vienota-bilesu-sistema), digitālā infrastruktūra (jv-digitalas-infrastrukturas-attistiba). „ar skaidru atbildību, termiņiem un izmaksu kontroli” — veids, nav dalīts. Tikai CVK: paplašinātās programmas 9. nodaļas „Apņemšanās un uzdevumi” digitālās infrastruktūras punkta nav. Nepārbaudāms: „attīstību” bez mēra. Tēma — robežgadījums (tematiski tuvākā: infrastruktūra). Elektroniskie sakari — SM (pieņēmums, nav pārbaudīts). Prioritāte „Ātrgaitas internets un pilnvērtīgs mobilo sakaru pārklājums visā valsts teritorijā” pārklāta šeit (Prioritātes netiek izrakstītas)."
jautajums: ""
