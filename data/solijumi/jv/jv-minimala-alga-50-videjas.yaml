id: jv-minimala-alga-50-videjas
saraksts: jv
nosaukums: Minimālā alga 50% no vidējās bruto darba samaksas
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [nodokli-un-budzets]
iestades:
  galvena: lm
  papildu: []
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Celsim minimālo algu līdz 50% no vidējās bruto darba samaksas"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Paaugstināsim minimālās darba algas līmeni, virzoties uz mērķi sasniegt 50% no vidējās bruto darba samaksas valstī"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Palielināsim vidējo darba algu valstī līdz 2500 eiro un minimālo algu līdz 1250 eiro"
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Labklājība un vecuma pensiju sistēma"
    citats: "Palielināsim vidējo darba algu valstī līdz 2500 eiro un minimālo algu līdz 1250 eiro"
nesakritiba: "CVK sola celt līdz 50%; paplašinātā programma 3. nodaļā — tikai virzīties uz šo mērķi, bet 4. un 5. nodaļā — minimālo algu „līdz 1250 eiro” (cits mērs)."
piezimes: "Vērtē pēc CVK mēra (50% no vidējās bruto darba samaksas). 4. un 5. nodaļas punkts (tas pats teksts abās nodaļās) minimālās algas daļā ir tas pats Solījums (§0.3, §4 piemērs „līdz 50%” ↔ „1250 eiro”); daļai par minimālo algu nav sava darbības vārda — citēts no punkta sākuma. Vidējās darba algas daļa („līdz 2500 eiro”) — cits iznākums, jv-augstaka-darba-samaksa-baltija. CVK „-ot” daļa „mazinot darbaspēka nodokļu slogu zemāko ienākumu saņēmējiem” ir mērķis, nav dalīta. Prioritāte „Darbaspēka nodokļu sloga mazināšana …, ceļot minimālo algu un neapliekamo minimumu” pārklāta šeit un jv-neapliekamais-minimums-80-minimalas-algas. Atbildīgā iestāde — LM (minimālās algas noteikšana; pieņēmums, nav pārbaudīts)."
jautajums: ""
