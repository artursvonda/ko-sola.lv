id: jv-melna-seguma-autocelu-ipatsvars
saraksts: jv
nosaukums: "Lielāks melnā seguma autoceļu īpatsvars reģionos"
parbaudams: true
temas:
  galvena: transports
  papildu: [regioni-un-pasvaldibas]
iestades:
  galvena: sm
  papildu: []
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: 'Satiksmē nodrošināsim "Rail Baltica", reģionālo ceļu, dzelzceļa, ostu, sabiedriskā transporta un digitālās infrastruktūras attīstību ar skaidru atbildību, termiņiem un izmaksu kontroli'
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Satiksme un pasažieru pārvadājumi"
    citats: "Atjaunosim un palielināsim melnā seguma autoceļu īpatsvaru reģionos"
nesakritiba: "CVK programma sola „nodrošināsim … reģionālo ceļu … attīstību” bez mēra, bet paplašinātā programma — „palielināsim melnā seguma autoceļu īpatsvaru reģionos”; vērtē pēc šī."
piezimes: "CVK satiksmes teikums (viens darbības vārds, uzskaitījums bez sava darbības vārda katrai daļai) sadalīts pēc paplašinātās programmas dalījuma (§4); citēts viss teikums, jo kopīgais „attīstību” ir teikuma beigās (§3). Daļas: «Rail Baltica» (jv-rail-baltica-pamatsavienojums), reģionālie ceļi (jv-melna-seguma-autocelu-ipatsvars, jv-celu-finansejums-pierobeza, jv-dualas-lietojamibas-celi-un-tilti), dzelzceļš (jv-dzelzcela-pasazieru-parvadajumi), ostas (jv-ostu-konkuretspeja), sabiedriskais transports (jv-sabiedriska-transporta-reforma, jv-vienota-bilesu-sistema), digitālā infrastruktūra (jv-digitalas-infrastrukturas-attistiba). „ar skaidru atbildību, termiņiem un izmaksu kontroli” — veids, nav dalīts. „nodrošinot pagastu centru, skolu un uzņēmumu savienojumus ar novada centriem” — mērķis, nav dalīts. Pārbaudāms: melnā seguma autoceļu īpatsvars reģionos palielinājies vai nē. SM (pieņēmums, nav pārbaudīts)."
jautajums: ""
