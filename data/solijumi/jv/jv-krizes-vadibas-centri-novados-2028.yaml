piezimes: "Tikai paplašinātā programma; „-ot” daļa definē „autonomu” centru aprīkojumu — citēts viss punkts, nav dalīts. Pārbaudāms: termiņš (2028) un aptvērums (katrs novada centrs). Nav apvienots ar jv-civilas-aizsardzibas-sistemas-pilnveide (vispārīgs, bez mēra). Civilā aizsardzība — IeM, VARAM papildu (pašvaldības; pieņēmums, nav pārbaudīts). Prioritāte „Autonomi krīzes vadības centri, patvertņu tīkls un vienota iekšējās drošības sadarbība pašvaldībās” pārklāta šeit, jv-patvertnes-pasvaldibu-publiskajas-ekas un jv-pasvaldibas-policijas-integracija."
