id: jv-zemas-ires-majoklu-programma
saraksts: jv
nosaukums: "Valsts līdzfinansēta zemas īres maksas mājokļu būvniecība pašvaldībās"
parbaudams: true
temas:
  galvena: majokli
  papildu: [regioni-un-pasvaldibas]
iestades:
  galvena: em
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Reģionos stiprināsim pašvaldību spēju attīstīties, skolu, veselības, sociālo pakalpojumu un mājokļu pieejamību"
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Turpināsim valsts līdzfinansētu programmu zemas īres maksu mājokļu būvniecībai pašvaldībās"
nesakritiba: "CVK programma sola „stiprināsim … mājokļu pieejamību” reģionos bez konkrēta iznākuma, bet paplašinātā programma — „Turpināsim valsts līdzfinansētu programmu zemas īres maksu mājokļu būvniecībai pašvaldībās”; vērtē pēc šī."
piezimes: "CVK „mājokļu pieejamību” pievienota abiem mājokļu pieejamības punktiem (§4; sk. jv-balsts-programmas-paplasinasana); citēts teikums līdz „pieejamību” (§3). Pārbaudāms: programma turpinās (valsts līdzfinansējums piešķirts) vai nē. Mājokļu politika — EM, VARAM papildu (pašvaldības; pieņēmums, nav pārbaudīts)."
jautajums: ""
