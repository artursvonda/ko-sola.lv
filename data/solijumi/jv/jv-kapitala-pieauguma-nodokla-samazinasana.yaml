    citats: "Samazināsim kapitāla pieauguma nodokli, veicinot investīcijas un uzkrājumus"
nesakritiba: ""
piezimes: "Tas pats saturs nodaļā atkārtojas divos punktos — viens Solījums ar diviem citātiem (§1). Otrajā punktā nav mēra „līdz konkurētspējīgām likmēm reģionā”, bet tas nemaina iznākumu (samazinājums) — Nesakritība nav ierakstīta. „-ot” daļas „veicinot investīcijas un vietējā kapitāla iesaisti ekonomikā” / „veicinot investīcijas un uzkrājumus” — mērķis, nav dalītas; „pakāpeniski palielinot akcīzi …” — atsevišķs Solījums jv-akcize-saldinatiem-dzerieniem. Pārbaudāms pēc tā, vai kapitāla pieauguma nodokļa likme samazināta. Prioritāte „… vietējā kapitāla aktivizēšana …” pārklāta šeit."
