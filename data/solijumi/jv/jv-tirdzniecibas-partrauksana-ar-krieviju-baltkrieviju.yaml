id: jv-tirdzniecibas-partrauksana-ar-krieviju-baltkrieviju
saraksts: jv
nosaukums: Preču un pakalpojumu tirdzniecības ar Krieviju un Baltkrieviju pārtraukšana
parbaudams: true
temas:
  galvena: arpolitika
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: arm
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "pārtrauksim ekonomisko ietekmējamību no Krievijas un Baltkrievijas"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Pārtrauksim preču un pakalpojumu importu un eksportu ar Krieviju un Baltkrieviju"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Pilnībā pārtrauksim preču un pakalpojumu importu un eksportu ar Krieviju un Baltkrieviju"
nesakritiba: "CVK programma sola „pārtrauksim ekonomisko ietekmējamību no Krievijas un Baltkrievijas” bez mēra, bet paplašinātā programma — konkrēti „Pilnībā pārtrauksim preču un pakalpojumu importu un eksportu”; vērtē pēc šī mēra."
piezimes: "CVK teikumā trīs atsevišķi darbības vārdi — dalīts (spiediens — jv-krievijas-atbildiba-un-izolacija, sankcijas — jv-sankciju-pret-krieviju-pastiprinasana). Apvienots (§4): paplašinātā programma CVK apņemšanos konkretizē ar mērāmu iznākumu (pilnīga preču un pakalpojumu tirdzniecības pārtraukšana); cita atbilstoša punkta paplašinātajā programmā nav. Robežgadījums: „ekonomiskā ietekmējamība” var aptvert arī, piem., investīcijas un tranzītu, tomēr vērtē pēc paplašinātās programmas mēra. Pārbaudāms: tirdzniecība pilnībā pārtraukta vai nē. Atbildīgā iestāde neskaidra: ĀM izvēlēta kā sankciju politikas koordinētāja (pieņēmums, nav pārbaudīts), EM (ārējā tirdzniecība) papildu."
jautajums: ""
