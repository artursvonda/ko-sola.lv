avoti:
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Vide, mežsaimniecība, lauksaimniecība"
    citats: "Iestāsimies par Eiropas Savienības finansējuma saglabāšanu mežsaimniecībai vismaz pašreizējā apjomā arī pēc 2027. gada"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. „nodrošinot atbalstu jaunaudžu kopšanai, neproduktīvu audžu nomaiņai un «Natura 2000» maksājumiem” — finansējuma saturs, nav dalīts; „tā veicinot …” — mērķis. Pārbaudāms (§2: „iestāsimies par” + konkrēts X ar mēru): vai ES finansējums mežsaimniecībai pēc 2027. gada saglabāts vismaz pašreizējā apjomā. Nav apvienots ar jv-es-daudzgadu-budzeta-finansejums (tur — lauksaimniecība u. c., bez mēra; mežsaimniecība nav minēta). ES līmeņa solījums — nozares ministrija ZM (§6a)."
jautajums: ""
