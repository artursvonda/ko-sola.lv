    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Panāksim turpmāku Eiropas Savienības aktīvu atbalstu un finansējumu ārējo robežu aizsardzībai un pierobežas reģionu attīstībai"
nesakritiba: ""
piezimes: "Dalīts no jv-es-finansejums-austrumu-robezai (redaktora atliktais lēmums no 1. nodaļas izpildes): vienam darbības vārdam divi atsevišķi mērķi — ārējo robežu aizsardzība un pierobežas reģionu attīstība — ar atšķirīgu iznākumu un Atbildīgo iestādi, statusi var atšķirties (§1). Daļai nav sava darbības vārda — citēts viss punkts (tas pats citāts arī jv-es-finansejums-austrumu-robezai). Pārbaudāms: „Panāksim” + konkrēts objekts (ES finansējums pierobežas reģionu attīstībai). CVK „kohēzijai” (ES daudzgadu budžets) nav uzskatīts par to pašu Solījumu — kohēzija nav vērsta tieši uz pierobežu. 9. nodaļas punkts par rīcības plānu austrumu teritorijām — nacionāls, cits iznākums."
