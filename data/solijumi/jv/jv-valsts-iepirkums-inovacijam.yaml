id: jv-valsts-iepirkums-inovacijam
saraksts: jv
nosaukums: Valsts iepirkums kā instruments jaunu risinājumu testēšanai un inovācijām
parbaudams: false
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: fm
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķēti atbalstīsim eksportspējīgus uzņēmumus, industriālos parkus, zinātņietilpīgus produktus, kapitāla tirgu un valsts pasūtījumu kā instrumentu jaunu risinājumu testēšanai"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Aizsardzības industrija"
    citats: "Pārveidosim valsts iepirkumu sistēmu par stratēģisku instrumentu, kas palīdz Latvijas uzņēmumiem radīt, testēt un eksportēt globāli konkurētspējīgus produktus, attīstot inovāciju iepirkumus"
nesakritiba: ""
piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts viss teikums (§3). Paplašinātās programmas punkts atrodas sadaļā „Aizsardzības industrija”, bet tvērums nav ierobežots ar aizsardzību. „attīstot inovāciju iepirkumus” apraksta veidu bez mēra, nav dalīts. Nepārbaudāms: „atbalstīsim”/„pārveidosim … par stratēģisku instrumentu” bez konkrēta mērāma iznākuma. Publisko iepirkumu politika — FM, EM papildu (inovāciju iepirkumi; pieņēmums, nav pārbaudīts)."
jautajums: ""
