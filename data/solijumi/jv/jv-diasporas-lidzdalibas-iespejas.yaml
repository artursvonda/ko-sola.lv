id: jv-diasporas-lidzdalibas-iespejas
saraksts: jv
nosaukums: Diasporas līdzdalība izglītības sistēmā, darba tirgū un aizsardzības dienestā
parbaudams: false
temas:
  galvena: migracija-un-diaspora
  papildu: [ekonomika-un-darbs, aizsardziba]
iestades:
  galvena: arm
  papildu: [izm, am]
avoti:
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Sabiedrības iesaiste, noturība un atbalsts cilvēkiem; diasporas potenciāla izmantošana"
    citats: "Paplašināsim atbalstu diasporas iesaistei izglītībā, kultūrā un sabiedriskajā dzīvē, attīstīsim līdzdalības iespējas valsts izglītības sistēmā, darba tirgū un valsts aizsardzības dienestā"
nesakritiba: ""
piezimes: "Dalīts no punkta (sk. jv-atbalsts-diasporas-iesaistei); citēts no punkta sākuma, lai citātā būtu redzams, ka runa ir par diasporu. Nepārbaudāms: „attīstīsim” bez mēra. Uzskaitījums (izglītības sistēma, darba tirgus, aizsardzības dienests) zem viena darbības vārda nav dalīts; „veicinot investīcijas Latvijas ekonomikā” — mērķis, nav dalīts. Atbildīgā iestāde — ĀM kā diasporas politikas koordinētāja (pieņēmums)."
jautajums: ""
