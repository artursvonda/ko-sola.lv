id: jv-atbalsta-grozs-vardarbiba-cietusajiem
saraksts: jv
nosaukums: Psiholoģiskā un juridiskā palīdzība vardarbībā cietušajiem atbalsta grozā
parbaudams: true
temas:
  galvena: socialais-atbalsts-un-pensijas
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: lm
