avoti:
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Cilvēktiesību aizsardzība un vardarbības izskaušana"
    citats: "Turpināsim novērst un apkarot vardarbību, īpaši pret bērniem, sievietēm, kā arī jebkuru vardarbību ģimenē un ārpus tās, pilnveidojot atbalsta grozu ar psiholoģisko un juridisko palīdzību cietušajiem"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. „-ot” daļa nosauc konkrētu darbību ar savu iznākumu — atsevišķs Solījums no jv-vardarbibas-noversana-un-apkarosana (§1); citēts viss punkts. Prioritāte „… cietušo atbalsta pakalpojumu pilnveide” pārklāta šeit. Robežgadījums pārbaudāmībai: „pilnveidojot” bez mēra, bet objekts konkrēts — cietušo atbalsta grozs papildināts ar psiholoģisko un juridisko palīdzību vai nē; Pārbaudāms. LM (sociālie pakalpojumi cietušajiem), TM papildu (juridiskā palīdzība; pieņēmums, nav pārbaudīts)."
jautajums: ""
