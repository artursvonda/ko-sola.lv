id: jv-neauglibas-arstesanas-paplasinasana
saraksts: jv
nosaukums: "Neauglības ārstēšanas un reproduktīvā materiāla saglabāšanas paplašināšana"
parbaudams: true
temas:
  galvena: veseliba
  papildu: [gimenes-un-demografija]
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: "5. Veselība, labklājība un demogrāfija"
    citats: "Demogrāfijas politiku veidosim kā rūpes par stiprām ģimenēm, grūtniecību, dzemdībām, bērnu veselību, neauglības ārstēšanu"
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Demogrāfija un ģimeņu veselība"
    citats: "Paplašināsim neauglības ārstēšanu un reproduktīvā materiāla saglabāšanu, īpaši onkoloģijas pacientiem"
nesakritiba: "CVK programmā demogrāfijas politika veidota „kā rūpes par … neauglības ārstēšanu”, bet paplašinātā programma sola „Paplašināsim neauglības ārstēšanu un reproduktīvā materiāla saglabāšanu, īpaši onkoloģijas pacientiem” (stiprāka apņemšanās un plašāks apjoms); vērtē pēc paplašinātās programmas, jo CVK citātā iznākuma nav (§4)."
piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4, sk. jv-demografijas-politika); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Uzskaitījums zem viena darbības vārda („neauglības ārstēšanu un reproduktīvā materiāla saglabāšanu”), nav dalīts (§1). Robežgadījums pārbaudāmībai: CVK „rūpes par” bez iznākuma; paplašinātajā „Paplašināsim” ar konkrētu objektu (valsts apmaksātas neauglības ārstēšanas un reproduktīvā materiāla saglabāšanas pieejamība paplašināta vai nē) — Pārbaudāms pēc paplašinātās programmas (§4). VM."
jautajums: ""
