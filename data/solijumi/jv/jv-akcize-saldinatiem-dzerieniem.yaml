id: jv-akcize-saldinatiem-dzerieniem
saraksts: jv
nosaukums: Akcīzes palielināšana saldinātiem dzērieniem un produktiem ar daudz cukura
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [veseliba]
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Samazināsim kapitāla pieauguma nodokli, veicinot investīcijas un uzkrājumus, pakāpeniski palielinot akcīzi saldinātiem dzērieniem un atsevišķiem produktiem ar augstu cukura saturu"
nesakritiba: ""
piezimes: "„-ot” daļa ar konkrētu darbību un savu iznākumu — atsevišķs Solījums no kapitāla pieauguma nodokļa samazināšanas (jv-kapitala-pieauguma-nodokla-samazinasana), statusi var atšķirties (§1). Citēts viss punkts, kā līdzīgos „-ot” Solījumos. 5. nodaļas punkts „Daļu no alkohola, tabakas, cukura un citu neveselīgo produktu nodokļu ieņēmumiem virzīsim veselības aprūpei …” — cits iznākums (ieņēmumu novirzīšana), atstāts 5. nodaļas izpildei."
jautajums: ""
