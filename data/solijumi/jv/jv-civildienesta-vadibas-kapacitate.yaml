nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Galvenais teikums („Nodrošināsim reformu īstenošanas un plānoto rezultātu sasniegšanu”) ir vispārīgs — Solījums ir „-ot” daļa (§1); citēts punkts līdz tai. Punkta beigas „un reformu ieviešanas procesa progresu” — neskaidrs tās pašas daļas papildinājums, nav dalīts. Nepārbaudāms: „paaugstinot kapacitāti” bez mēra. Nav apvienots ar jv-politiski-neitrals-civildienests (tur — civildienests kopumā). Valsts pārvaldes cilvēkresursu politika — VK (pieņēmums, nav pārbaudīts)."
jautajums: ""
