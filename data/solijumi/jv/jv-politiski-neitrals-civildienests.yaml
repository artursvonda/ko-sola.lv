piezimes: "Tikai paplašinātā programma. Nepārbaudāms: „stiprināsim” bez konkrēta iznākuma. Nav apvienots ar jv-civildienesta-vadibas-kapacitate (tur — vadības un politiku ieviesēju kapacitāte reformu īstenošanai). Prioritāte „Cilvēkcentrēti pakalpojumi, publiska atskaitīšanās un profesionāls, politiski neitrāls civildienests” daļēji pārklāta šeit. Valsts pārvaldes cilvēkresursu politika — VK (pieņēmums, nav pārbaudīts)."
