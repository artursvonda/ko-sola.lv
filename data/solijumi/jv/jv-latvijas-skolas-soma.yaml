avoti:
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Talantu un izcilību attīstība"
    citats: "Turpināsim projektu «Latvijas skolas somas», ieviešot stingrākus piedāvājuma kvalitātes kritērijus"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kultūra"
    citats: "Stiprināsim «Latvijas skolas somas» iniciatīvu, veidojot ciešāku sadarbību starp kultūras un izglītības sektoru"
nesakritiba: "Talantu sadaļā — „Turpināsim projektu …, ieviešot stingrākus piedāvājuma kvalitātes kritērijus”, kultūras sadaļā — „Stiprināsim … iniciatīvu, veidojot ciešāku sadarbību starp kultūras un izglītības sektoru” (kvalitātes kritēriji nav minēti)."
piezimes: "Tikai paplašinātā programma; tas pats projekts divās 8. nodaļas sadaļās — viens Solījums ar diviem citātiem. Kultūras sadaļas punkta pārējie teikumi — jv-bernu-un-jauniesu-kulturpolitika, jv-bernu-gramatu-izdosana. Vērtēšanas avots — pirmais citāts. Pārbaudāms: projekts turpinās un ieviesti stingrāki kvalitātes kritēriji vai nē. KM (pieņēmums, nav pārbaudīts), IZM papildu."
