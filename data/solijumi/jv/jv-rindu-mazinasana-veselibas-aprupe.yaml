piezimes: "Tikai CVK: paplašinātajā programmā atsevišķa punkta par rindām nav. „Mazināsim rindas” ir atsevišķs darbības vārds ar savu iznākumu — atsevišķs Solījums no tā paša teikuma „stiprināsim …” uzskaitījuma (§1). Robežgadījums pārbaudāmībai: mēra nav, bet iznākums izmērāms (gaidīšanas laiki uz valsts apmaksātiem veselības pakalpojumiem samazinās vai nē) — Pārbaudāms. VM."
