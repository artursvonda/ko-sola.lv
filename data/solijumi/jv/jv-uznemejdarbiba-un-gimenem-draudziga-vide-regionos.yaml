id: jv-uznemejdarbiba-un-gimenem-draudziga-vide-regionos
saraksts: jv
nosaukums: "Uzņēmējdarbības un ģimenēm draudzīgas vides veicināšana reģionos"
parbaudams: false
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [ekonomika-un-darbs, gimenes-un-demografija]
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Reģionos stiprināsim pašvaldību spēju attīstīties, skolu, veselības, sociālo pakalpojumu un mājokļu pieejamību, veicināsim uzņēmējdarbību un ģimenēm draudzīgu vidi"
nesakritiba: ""
piezimes: "Daļa no CVK reģionu teikuma (sk. jv-pasvaldibu-kapacitate-un-pakalpojumi); citēts viss teikums, jo „Reģionos” attiecas uz visu teikumu (§3). Viens darbības vārds („veicināsim”) ar uzskaitījumu — nedalīts (§1). Tikai CVK: paplašinātās programmas 9. nodaļā vispārīga atbilstoša punkta nav (konkrētie pierobežas un mobilitātes punkti — atsevišķi Solījumi). Nepārbaudāms. Reģionālā attīstība — VARAM (pieņēmums, nav pārbaudīts). Prioritāte „Pašvaldību finanšu motivācijas instrumenti investīciju piesaistei un jaunu darba vietu radīšanai reģionos” daļēji pārklāta šeit (Prioritātes netiek izrakstītas)."
jautajums: ""
