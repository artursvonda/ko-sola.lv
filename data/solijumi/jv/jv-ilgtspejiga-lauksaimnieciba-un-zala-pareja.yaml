id: jv-ilgtspejiga-lauksaimnieciba-un-zala-pareja
saraksts: jv
nosaukums: "Ilgtspējīga lauksaimniecība, aprites ekonomika un taisnīga zaļā pāreja"
parbaudams: false
temas:
  galvena: vide-un-klimats
  papildu: [lauksaimnieciba-un-zivsaimnieciba]
iestades:
  galvena: kem
  papildu: [zm, varam]
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Uzturēsim dabas kapitālu, zinātnē balstītu mežu, jūras un ūdeņu pārvaldību, ilgtspējīgu lauksaimniecību, aprites ekonomiku, klimatnoturīgu infrastruktūru un taisnīgu zaļo pāreju, tādējādi nodrošinot tiesības ikvienam dzīvot labvēlīgā vidē"
nesakritiba: ""
piezimes: "CVK 1. teikums (viens darbības vārds „Uzturēsim”, uzskaitījums) sadalīts pēc paplašinātās programmas dalījuma (§4): dabas kapitāls (jv-dabas-kapitals-30-procenti-teritorijas), meži (jv-mezsaimniecibas-regulejums-zinatniski), jūras un ūdeņu pārvaldība (jv-zila-ekonomika-akvakultura-zvejnieciba); pārējais uzskaitījums, kam paplašinātajā programmā atsevišķa punkta nav, — jv-ilgtspejiga-lauksaimnieciba-un-zala-pareja. Šis Solījums — uzskaitījuma atlikums („ilgtspējīgu lauksaimniecību, aprites ekonomiku, klimatnoturīgu infrastruktūru un taisnīgu zaļo pāreju”), kam paplašinātās programmas 9. nodaļas „Apņemšanās un uzdevumi” atsevišķa punkta nav; viens darbības vārds bez atsevišķiem mērķiem — nedalīts (§1); citēts viss teikums (§3). „tādējādi nodrošinot tiesības ikvienam dzīvot labvēlīgā vidē” — mērķis. Tikai CVK. Nepārbaudāms: „Uzturēsim” + vispārīgi objekti bez mēra. Klimatnoturīga infrastruktūra nosaukumā nav ietverta garuma dēļ (≤ 80 zīmes). Zaļā pāreja un klimats — KEM, lauksaimniecība — ZM, aprites ekonomika (atkritumi) — VARAM papildu (pieņēmums, nav pārbaudīts). Prioritāte „Klimatneitralitāte kā nacionālās drošības, enerģētiskās neatkarības un mājsaimniecību noturības jautājums” daļēji pārklāta šeit (Prioritātes netiek izrakstītas)."
jautajums: ""
