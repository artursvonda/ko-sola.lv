piezimes: "Robežgadījums pārbaudāmībai: konkrēts pasākums ar nosauktu objektu (prezidentūra notiek vai nē) — Pārbaudāms; „sekmīga” nav mērāma. „izmantojot iespējas Latvijas atpazīstamības stiprināšanai” — mērķis, nav dalīts. Nav pārbaudīts, kad prezidentūra paredzēta un vai tā iekrīt Saeimas pilnvaru laikā. Prezidentūras koordinācija — ĀM (pieņēmums, nav pārbaudīts; iespējams, Valsts kanceleja). Prioritāte „… prezidentūrā Eiropas Savienības Padomē …” pārklāta šeit."
