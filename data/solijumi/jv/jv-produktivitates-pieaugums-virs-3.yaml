id: jv-produktivitates-pieaugums-virs-3
saraksts: jv
nosaukums: Produktivitātes pieaugums virs 3% gadā
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķis ir produktīvākā ekonomika Baltijā: vismaz 3,5% IKP izaugsme gadā, augstākā darba samaksa, investīcijas virs 30% no IKP un pāreja uz augstas pievienotās vērtības ekonomiku"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Panāksim pastāvīgu produktivitātes pieaugumu virs 3% gadā"
nesakritiba: "CVK programmā mērķis ir „pāreja uz augstas pievienotās vērtības ekonomiku” bez mēra, bet paplašinātajā programmā — „Panāksim pastāvīgu produktivitātes pieaugumu virs 3% gadā”; vērtē pēc šī mēra."
piezimes: "CVK teikuma daļai „pāreja uz augstas pievienotās vērtības ekonomiku” nav sava darbības vārda — citēts viss teikums (§3). Tā pievienota paplašinātās programmas Solījumiem, kas to konkretizē ar mēru (§4): šeit un jv-apstrades-rupniecibas-pievienota-vertiba-40 (pēc redaktora lēmumu parauga par „Attīstīsim kapitāla tirgu” — atsevišķu Nepārbaudāmu Solījumu neveidot). Paplašinātās programmas „-ot” daļas ar savu mēru — atsevišķi Solījumi (§1): jv-apstrades-rupniecibas-pievienota-vertiba-40, jv-aizsardzibas-industrijas-eksports-trisreiz. Pārbaudāms: darba ražīguma pieaugums gadā; konkrēts rādītājs avotā nav nosaukts. EM (pieņēmums, nav pārbaudīts). Prioritāte „Pastāvīgs produktivitātes pieaugums virs 3% gadā …” pārklāta šeit."
jautajums: ""
