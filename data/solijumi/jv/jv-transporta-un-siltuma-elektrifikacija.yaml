piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts viss teikums (§3). „nodrošinot regulatīvu un finansiālu atbalstu” apraksta veidu bez konkrēta objekta, „tādējādi mazinot atkarību no importētiem resursiem” — mērķis; nav dalīti. Nepārbaudāms: „attīstīsim”/„veicināsim” bez mēra. KEM, SM papildu (transports)."
