id: jv-iin-sadale-pasvaldibam-80-20
saraksts: jv
nosaukums: "IIN sadale pašvaldībām: 80% pēc dzīvesvietas, 20% pēc darbavietas"
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [nodokli-un-budzets]
iestades:
  galvena: fm
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim taisnīgu un uzņēmējdarbību veicinošu nodokļu ieņēmumu sadali starp pašvaldībām un valsti"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Ieviesīsim līdzsvarotu iedzīvotāju ienākuma nodokļa sadali starp pašvaldībām, novirzot 80% pašvaldības budžetā pēc iedzīvotāja deklarētās dzīvesvietas un 20% atbilstoši darbavietai"
nesakritiba: "CVK programma sola „taisnīgu un uzņēmējdarbību veicinošu nodokļu ieņēmumu sadali starp pašvaldībām un valsti” bez mēra, bet paplašinātā programma — „iedzīvotāju ienākuma nodokļa sadali starp pašvaldībām” (80% pēc dzīvesvietas, 20% pēc darbavietas), t. i., cits apjoms (tikai IIN un sadale starp pašvaldībām, ne starp pašvaldībām un valsti); vērtē pēc paplašinātās programmas mēra."
piezimes: "Apvienots, jo paplašinātās programmas punkts ir šī CVK teikuma izvērsums tajā pašā nodaļā (arī Prioritāte „… līdzsvarots IIN sadales modelis pašvaldībām”, kas pārklāta šeit); „uzņēmējdarbību veicinošu” atbilst daļai „20% atbilstoši darbavietai”. CVK citātā mēra nav — vērtē pēc paplašinātās programmas (§4). Nodokļu ieņēmumu sadale — FM, VARAM papildu (pašvaldību finanses; pieņēmums, nav pārbaudīts). 9. nodaļas „Ieviesīsim jaunu un taisnīgu pašvaldību finanšu izlīdzināšanas modeli …” — cits iznākums, atsevišķs Solījums jv-pasvaldibu-finansu-izlidzinasanas-modelis (9. nodaļas izpilde). Redaktors: apvienot vienā Solījumā ar Nesakritību, CVK teikumu atsevišķi neveidot."
jautajums: ""
