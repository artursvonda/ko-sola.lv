id: jv-primaras-aprupes-un-gimenes-arstu-pieejamiba
saraksts: jv
nosaukums: "Primārās aprūpes un ģimenes ārstu pieejamības uzlabošana"
parbaudams: false
temas:
  galvena: veseliba
  papildu: []
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: "5. Veselība, labklājība un demogrāfija"
    citats: "stiprināsim primāro aprūpi, ģimenes ārstu pieejamību"
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Investīcijas veselībā, pakalpojumu pieejamība un noturība"
    citats: "Uzlabosim primāro aprūpi, nodrošinot pieejamākus ģimenes ārstus, dežūrārstus, mājas vizītes un spēcīgākas kopprakses"
nesakritiba: ""
piezimes: "CVK teikuma „stiprināsim …” uzskaitījums sadalīts pēc paplašinātās programmas dalījuma (§4): primārā aprūpe un ģimenes ārsti (šeit), slimnīcas un zāles (jv-slimnicu-pakalpojumi-un-medikamenti), paliatīvā un hospisa aprūpe (jv-majas-paliativa-hospisa-aprupe); pakalpojumi bez sava paplašinātās programmas punkta — jv-onkologijas-sirds-gariga-veseliba-rehabilitacija. Daļai nav sava darbības vārda — citēts no „stiprināsim” līdz šai daļai (§3). „nodrošinot pieejamākus ģimenes ārstus, dežūrārstus, mājas vizītes un spēcīgākas kopprakses” apraksta veidu (uzskaitījums bez mēra), nav dalīts. Nepārbaudāms: „stiprināsim”/„uzlabosim” bez mēra. VM."
jautajums: ""
