id: jv-dabas-kapitals-30-procenti-teritorijas
saraksts: jv
nosaukums: "Dabas kapitāls: saudzēti vismaz 30% teritorijas, stingri aizsargāti līdz 10%"
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Uzturēsim dabas kapitālu"
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Vide, mežsaimniecība, lauksaimniecība"
    citats: "Nodrošināsim Latvijas dabas kapitāla uzturēšanu, jēgpilni saudzējot ne mazāk kā 30% valsts teritorijas, no tiem stingri aizsargājot līdz 10%"
nesakritiba: "CVK programma sola „Uzturēsim dabas kapitālu” bez mēra, bet paplašinātā programma — „jēgpilni saudzējot ne mazāk kā 30% valsts teritorijas, no tiem stingri aizsargājot līdz 10%”; vērtē pēc šī."
piezimes: "CVK 1. teikums (viens darbības vārds „Uzturēsim”, uzskaitījums) sadalīts pēc paplašinātās programmas dalījuma (§4): dabas kapitāls (jv-dabas-kapitals-30-procenti-teritorijas), meži (jv-mezsaimniecibas-regulejums-zinatniski), jūras un ūdeņu pārvaldība (jv-zila-ekonomika-akvakultura-zvejnieciba); pārējais uzskaitījums, kam paplašinātajā programmā atsevišķa punkta nav, — jv-ilgtspejiga-lauksaimnieciba-un-zala-pareja. Paplašinātās programmas galvenais teikums („Nodrošināsim … dabas kapitāla uzturēšanu”) ir vispārīgs — Solījums ir „-ot” daļa ar mēru (§1); citēts punkts līdz tai. Punkta turpinājums („vienlaikus paredzot … kompensācijas, … sabiedrības līdzdalību un … prognozējamus nosacījumus”) ir CVK 2. teikuma saturs — jv-kompensacijas-lidzdaliba-prognozejami-noteikumi. Pārbaudāms pēc 30% (saudzēti) un 10% (stingri aizsargāti); „līdz 10%” ir augšējā robeža, ne minimums. Dabas aizsardzība — VARAM (pieņēmums, nav pārbaudīts). Prioritāte „Latvijas dabas kapitāla uzturēšana ar prognozējamu pārvaldību …” pārklāta šeit un jv-kompensacijas-lidzdaliba-prognozejami-noteikumi."
