piezimes: "CVK teikuma „-ot” daļa dalīta pēc paplašinātās programmas dalījuma (§4; sk. jv-petniecibai-un-attistibai-3-no-ikp); daļai nav sava darbības vārda — citēts viss teikums (§3). „mazinot zinātnieku finansiālo nenoteiktību” — mērķis, nav dalīts. Nepārbaudāms: „stiprinot”/„pilnveidosim” bez mēra. IZM. Prioritāte „… bāzes finansējums …” pārklāta šeit."
