id: jv-vienots-cilvekkapitala-fonds
saraksts: jv
nosaukums: "Vienots cilvēkkapitāla fonds ar vienu vadošo institūciju"
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: izm
  papildu: [lm, em]
avoti:
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Darba tirgus vajadzībām atbilstoša mūžizglītība"
    citats: "Virzīsim cilvēkkapitāla pāreju no zemas produktivitātes nodarbinātības uz intensīvu izaugsmi, ieviešot vienotu Latvijas cilvēkkapitāla pārvaldību, veidojot pastāvīgu un konstruktīvu dialogu starp izglītības sniedzēju un darba devēju, apvienojot fragmentētās finansēšanas plūsmas vienotā cilvēkkapitāla fondā, ko pārrauga viena vadošā institūcija"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. „apvienojot fragmentētās finansēšanas plūsmas vienotā cilvēkkapitāla fondā” — konkrēta darbība ar savu iznākumu (§1), citēts viss punkts; pārvaldība — jv-vienota-cilvekkapitala-parvaldiba. Pārbaudāms: fonds izveidots, finansēšanas plūsmas apvienotas vai nē. Atbildīgā iestāde neskaidra (kā jv-vienota-cilvekkapitala-parvaldiba); izvēlēta IZM (pieņēmums, nav pārbaudīts)."
jautajums: ""
