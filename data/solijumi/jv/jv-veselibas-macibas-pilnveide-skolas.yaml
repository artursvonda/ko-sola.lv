piezimes: "Tikai paplašinātā programma. „stiprinot zināšanas par …” nosauc mācību saturu, nav dalīts; „balstoties Ziemeļvalstu pieejā …” — pieeja, nav citēta. Robežgadījums pārbaudāmībai: „pilnveidosim” bez mēra, bet objekts konkrēts — veselības mācības saturs skolās papildināts ar nosauktajām tēmām vai nē; Pārbaudāms. Mācību saturs — IZM, VM papildu (pieņēmums, nav pārbaudīts)."
