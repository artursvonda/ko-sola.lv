    citats: "Pilnveidosim mūsdienīgu veselības mācību skolās, stiprinot zināšanas par uzturu, psihisko un reproduktīvo veselību, atkarību riskiem, drošu digitālo vidi, pirmo palīdzību, skrīningu nozīmi un drošību"
