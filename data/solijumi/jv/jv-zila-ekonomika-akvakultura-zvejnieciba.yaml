    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Stiprināsim Latvijas līderību zilajā ekonomikā, pilnveidojot jūras un iekšējo ūdeņu pārvaldību, attīstot inovatīvu akvakultūru un zvejniecību"
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: "Uzturēsim dabas kapitālu, zinātnē balstītu mežu, jūras un ūdeņu pārvaldību"
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Vide, mežsaimniecība, lauksaimniecība"
    citats: "Stiprināsim Latvijas līderību zilajā ekonomikā, ieviešot zinātnē balstītu jūras un iekšzemes ūdeņu pārvaldību, attīstot inovatīvu akvakultūru un zvejniecību"
nesakritiba: ""
piezimes: "CVK zilās ekonomikas teikums un paplašinātās programmas punkts sakrīt. CVK 1. teikuma „jūras un ūdeņu pārvaldību” — tas pats saturs (§1, viens Solījums ar vairākiem citātiem); citēts teikums līdz kopīgajam „pārvaldību” (§3). „-ot” daļas („pilnveidojot”/„ieviešot … ūdeņu pārvaldību”, „attīstot … akvakultūru un zvejniecību”) apraksta veidu bez konkrēta iznākuma — nav dalītas (§1); „izmantojot tehnoloģijas, kas …” — veids. Nepārbaudāms: „stiprināsim līderību” bez mēra. Zivsaimniecība — ZM, jūras vides pārvaldība — VARAM papildu (pieņēmums, nav pārbaudīts). Prioritāte „Zilās ekonomikas attīstība, jūras un iekšzemes ūdeņu pārvaldība, akvakultūra un zvejniecība …” pārklāta šeit."
jautajums: ""
