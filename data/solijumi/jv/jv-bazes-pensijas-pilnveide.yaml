piezimes: "Tikai paplašinātā programma. Punkta otrajā teikumā trīs darbības ar atšķirīgiem iznākumiem — dalīts (§1): bāzes pensija (šeit), piemaksas par darba stāžu (jv-piemaksas-par-darba-stazu), pensiju pirktspēja (jv-pensiju-pirktspejas-saglabasana). Pirmais teikums „Nodrošināsim taisnīgu un ilgtspējīgu finansiālu atbalstu vecumdienās” — ievads, ko konkretizē otrais teikums; nav izrakstīts atsevišķi. Robežgadījums pārbaudāmībai: „pilnveidosim” bez mēra, un avots nenosaka, ko nozīmē „bāzes pensija” — Nepārbaudāms. LM."
