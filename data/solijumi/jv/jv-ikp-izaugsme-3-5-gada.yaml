id: jv-ikp-izaugsme-3-5-gada
saraksts: jv
nosaukums: IKP izaugsme vismaz 3,5% gadā
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: em
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķis ir produktīvākā ekonomika Baltijā: vismaz 3,5% IKP izaugsme gadā"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Sasniegsim ilgtspējīgu 3,5% iekšzemes kopprodukta pieaugumu ik gadu"
nesakritiba: "CVK programmā 3,5% izaugsme ir „Mērķis”, bet paplašinātajā programmā — apņemšanās „Sasniegsim … 3,5% … pieaugumu ik gadu”."
piezimes: "CVK teikuma daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Paplašinātās programmas „-ot” daļa „nodrošinot, ka investīciju apjoms pārsniedz 30% …” — atsevišķs Solījums jv-investicijas-virs-30-no-ikp (cits iznākums, §1). „vismaz 3,5%” ↔ „ilgtspējīgu 3,5%” nav uzskatīts par būtisku Nesakritību. Pārbaudāms: reālā IKP pieaugums katru gadu. Tautsaimniecības attīstība — EM, FM papildu (makroekonomika; pieņēmums, nav pārbaudīts). Prioritāte „Ilgtspējīgs 3,5% iekšzemes kopprodukta pieaugums ik gadu …” pārklāta šeit."
jautajums: ""
