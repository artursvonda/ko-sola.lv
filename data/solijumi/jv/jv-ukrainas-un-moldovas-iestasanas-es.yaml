piezimes: "Atsevišķs no jv-ukrainas-eiroatlantiska-integracija: pievieno citu iznākumu (Moldova; konkrēti iestāšanās ES), kam statuss var atšķirties (§4). „-ot” daļas (iestāšanās kritēriji, reformas, noturība pret hibrīdapdraudējumiem) apraksta kandidātvalstu veicamo, nav dalītas. Robežgadījums pārbaudāmībai: „atbalstīsim X” ar konkrētu X (iestāšanās ES) — Pārbaudāms pēc tā, vai X tika panākts (§2); termiņš nav norādīts."
