    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Ieviesīsim stingru un saistošu namu apsaimniekošanas kvalitātes standartu, nodrošinot iedzīvotājiem vienkāršotu mehānismu vērsties Patērētāju tiesību aizsardzības centrā gadījumos, kad apsaimniekošanas pakalpojums tiek sniegts nekvalitatīvi"
nesakritiba: ""
piezimes: "Dalīts no apsaimniekošanas standarta punkta (sk. jv-namu-apsaimniekosanas-kvalitates-standarts); „-ot” daļa — citēts viss punkts (§1). Pārbaudāms: vienkāršots mehānisms ieviests vai nē. PTAC un dzīvojamo māju pārvaldīšana — EM (pieņēmums, nav pārbaudīts)."
