id: jv-agregatoru-regulejums-uzkrasanai
saraksts: jv
nosaukums: Agregatoru regulējums bateriju un uzkrāšanas jaudu integrācijai tirgū
parbaudams: true
temas:
  galvena: energetika
  papildu: []
iestades:
  galvena: kem
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Attīstīsim pieejamu, drošu un prognozējamu enerģiju, jaunas elektroenerģijas jaudas, tīklus, uzkrāšanas risinājumus"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Enerģētika un klimats"
    citats: "Paātrināsim agregatoru regulējuma izstrādi, mobilizējot un integrējot apjomīgas bateriju un uzkrāšanas sistēmu jaudas tirgū"
nesakritiba: "CVK programma sola „attīstīsim … uzkrāšanas risinājumus” bez konkrēta iznākuma, bet paplašinātā programma — „Paātrināsim agregatoru regulējuma izstrādi”; vērtē pēc šī."
piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). „mobilizējot un integrējot … jaudas tirgū” apraksta regulējuma mērķi, nav dalīts. Pārbaudāms: agregatoru regulējums pieņemts vai nē („paātrināsim” nav mērāms). KEM."
jautajums: ""
