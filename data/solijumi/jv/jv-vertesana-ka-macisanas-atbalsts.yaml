id: jv-vertesana-ka-macisanas-atbalsts
saraksts: jv
nosaukums: "Mācību snieguma vērtēšana kā mācīšanās atbalsts"
parbaudams: false
temas:
  galvena: izglitiba-un-zinatne
  papildu: []
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība"
    citats: "Stiprināsim drošu un iekļaujošu skolas vidi, vardarbības novēršanu, labbūtību un vērtēšanu kā mācīšanās atbalstu"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kvalitatīva, pieejama izglītība katram bērnam"
    citats: "Veidosim iedrošinošu vidi, kurā mācību snieguma vērtēšana skolēnam ir atbalstoša un kļūdīšanās palīdz veidot individualizētu mācīšanos"
nesakritiba: ""
piezimes: "CVK teikums (viens darbības vārds, uzskaitījums ar atšķirīgu iznākumu) dalīts pēc paplašinātās programmas punktiem (§4): skolas vide (jv-drosa-ieklaujosa-skolas-vide), vardarbības novēršana un labbūtība (jv-vardarbibas-noversana-un-labbutiba-skolas), vērtēšana (jv-vertesana-ka-macisanas-atbalsts); citēts teikums līdz attiecīgajai daļai (§3). Nepārbaudāms: bez konkrēta iznākuma (vērtēšanas kārtības maiņa nav nosaukta). IZM."
jautajums: ""
