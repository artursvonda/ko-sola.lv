nesakritiba: ""
piezimes: "Paplašinātā programma CVK teikumu sadala divos punktos — seko tās dalījumam (§4); parāda līmenis — jv-valsts-parads-zem-55-no-ikp. CVK teikuma daļām nav atsevišķa darbības vārda — citēts viss teikums (§3). Robežgadījums pārbaudāmībai: „fiskāli atbildīgu” pats par sevi ir vispārīgs, bet objekts konkrēts — eirozonas (ES) fiskālo noteikumu ievērošana; Pārbaudāms pēc tā, vai budžets atbilst šiem noteikumiem (piem., Eiropas Komisijas vērtējumā). Prioritāte „Fiskāli atbildīga budžeta politika …” pārklāta šeit."
