piezimes: "Tikai paplašinātā programma. Galvenajā teikumā „Atbalstīsim …” ir tikai vispārīgs darbības vārds — Solījums ir „-ot” daļa (§1). Robežgadījums pārbaudāmībai: „prognozējama atbalsta sistēma” nav definēta, bet tās izveide ir pārbaudāma — Pārbaudāms. IZM (pieņēmums, nav pārbaudīts). Prioritāte „Sports cilvēkiem ar invaliditāti un Latvijas paralimpiskā kustība …” pārklāta šeit un jv-sporta-pieejamiba-cilvekiem-ar-invaliditati."
