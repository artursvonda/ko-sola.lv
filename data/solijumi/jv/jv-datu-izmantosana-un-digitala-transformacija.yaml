id: jv-datu-izmantosana-un-digitala-transformacija
saraksts: jv
nosaukums: Datu izmantošana un digitālās transformācijas paātrināšana valsts pārvaldē
parbaudams: false
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: varam
  papildu: [vk]
avoti:
  - veids: cvk
    vieta: "6. Valsts pārvalde"
    citats: "Pāriesim uz rezultātos balstītu budžeta veidošanu, datu un mākslīgā intelekta asistentu izmantošanu publiskajā pārvaldē"
  - veids: paplasinata
    vieta: "6. Valsts pārvalde › Apņemšanās un uzdevumi › Vienotas valdības pārvaldes modelis"
    citats: "Paātrināsim digitālās transformācijas un mākslīgā intelekta izmantošanas procesus, pieņemot datos balstītus lēmumus, automatizējot administratīvos procesus un efektivizējot valsts informācijas sistēmas savietojamību"
  - veids: paplasinata
    vieta: "6. Valsts pārvalde › Apņemšanās un uzdevumi › Mūsdienīga un efektīva valsts pārvalde"
    citats: "Ieviesīsim digitālās inovācijas"
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Turpināsim valsts pārvaldes digitalizāciju un mākslīgā intelekta ieviešanu"
nesakritiba: ""
piezimes: "CVK teikums dalīts (§4): daļa „datu … izmantošanu publiskajā pārvaldē” — šeit (paplašinātās „pieņemot datos balstītus lēmumus”), „mākslīgā intelekta asistentu izmantošanu” — jv-mi-asistenti-valsts-parvalde, budžets — jv-rezultatos-balstita-budzetesana; daļām nav sava darbības vārda — citēts viss teikums (§3). Paplašinātās „-ot” daļas („pieņemot …, automatizējot …, efektivizējot …”) apraksta veidus bez sava mēra — nav dalītas. „Ieviesīsim digitālās inovācijas” (punkta otrā daļa — jv-rezultatos-balstita-budzetesana) un 7. nodaļas punkts „Turpināsim valsts pārvaldes digitalizāciju un mākslīgā intelekta ieviešanu …” (§0.3) — tas pats Solījums; 7. nodaļas punkta „-ot” daļas („atbrīvojot resursus …, uzlabojot … pakalpojumu kvalitāti”) — mērķi. Nepārbaudāms: „pāriesim uz … datu … izmantošanu”, „paātrināsim”, „turpināsim” bez mēra. Nav apvienots ar jv-mi-asistenti-valsts-parvalde (tur — konkrēti MI asistenti nosauktās jomās) un jv-publisko-pakalpojumu-digitalizacija (tur — pakalpojumi iedzīvotājiem). Prioritāte „Digitālās inovācijas, mākslīgais intelekts, datu izmantošana un savietojamas valsts informācijas sistēmas” pārklāta šeit. VARAM (digitālā transformācija), VK papildu (kā jv-mi-asistenti-valsts-parvalde; pieņēmums, nav pārbaudīts)."
jautajums: ""
