id: jv-nato-sabiedroto-pastaviga-klatbutne
saraksts: jv
nosaukums: NATO sabiedroto pastāvīga klātbūtne Latvijā
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [arpolitika]
iestades:
  galvena: am
  papildu: [arm]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "attīstīsim NATO sabiedroto pastāvīgu klātbūtni Latvijā"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Audzēsim NATO sabiedroto klātbūtni Latvijā"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Palielināsim NATO sabiedroto klātbūtni Latvijā"
nesakritiba: "CVK programma sola attīstīt sabiedroto „pastāvīgu klātbūtni”, bet paplašinātā programma — „audzēsim”/„palielināsim” klātbūtni, neminot pastāvīgumu."
piezimes: "Robežgadījums pārbaudāmībai: „attīstīsim” parasti ir virziena deklarācija, bet objekts ir konkrēts (sabiedroto pastāvīga klātbūtne Latvijā) un paplašinātajā programmā ir mērs „palielināsim” — iznākums pārbaudāms pēc sabiedroto spēku apjoma un pastāvīguma Latvijā. „-ot” daļas „paplašinot NATO daudznacionālo brigādi” un „stiprinot alianses klātbūtni Baltijas jūrā un Austrumu flangā” — atsevišķi Solījumi."
jautajums: ""
