avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķēti atbalstīsim eksportspējīgus uzņēmumus, industriālos parkus, zinātņietilpīgus produktus"
nesakritiba: ""
piezimes: "CVK teikuma daļa, kurai paplašinātās programmas 4. nodaļā atbilstoša punkta nav; daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Nepārbaudāms: „atbalstīsim” bez mēra. 7. nodaļas punkti „Stiprināsim Latvijas zinātnes pienesumu tautsaimniecībai, mērķtiecīgi atbalstot pētniecības rezultātu komercializāciju” un „Veidosim ciešu sinerģiju starp universitātēm un industriju, tā radot konkurētspējīgos produktus” — tuvi, bet ar citu tvērumu (komercializācija, universitāšu sadarbība), atstāti 7. nodaļas izpildei; tur izvērtēt apvienošanu. Inovāciju politika — EM, IZM papildu (pieņēmums, nav pārbaudīts)."
jautajums: ""
