piezimes: "Tikai paplašinātā programma. Punktā vairāki darbības vārdi ar atšķirīgu iznākumu — dalīts (§1): specializācija (šeit), finansēšanas modelis (jv-profesionalas-izglitibas-finansesanas-modelis), elastīga, darba vidē balstīta izglītība (jv-elastiga-darba-vide-balstita-profizglitiba). Konteksts (profesionālā izglītība) liek domāt par profesionālās izglītības iestādēm, bet avots to nesaka. Nepārbaudāms: nav nosaukts, kā specializācija mainīsies. IZM."
