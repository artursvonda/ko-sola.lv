piezimes: "CVK uzskaitījums sadalīts pēc paplašinātās programmas dalījuma (§4, sk. jv-primaras-aprupes-un-gimenes-arstu-pieejamiba); daļai nav sava darbības vārda — citēts no „stiprināsim” līdz šai daļai (§3). Slimnīcas un medikamenti paplašinātajā programmā ir viens punkts zem viena darbības vārda — nav dalīts (§1). Nepārbaudāms: „stiprināsim”/„nodrošināsim … atbilstošus, pieejamus” bez mēra; „stiprināsim” ↔ „nodrošināsim” nav uzskatīts par būtisku Nesakritību (abi bez mēra). VM."
