nesakritiba: ""
piezimes: "Vērtēšanas avots — CVK programma (pievienota 2. nodaļas izpildē). CVK daļai („… un Ukrainas eiroatlantiskajai integrācijai”) nav sava darbības vārda — citēts viss teikums (§3; daļa no tā arī jv-visaptveross-atbalsts-ukrainai). Robežgadījums pārbaudāmībai: „integrācija” ir process bez konkrēta iznākuma (nav solīta, piem., iestāšanās ES vai NATO noteiktā laikā) — Nepārbaudāms. Paplašinātās programmas 2. nodaļas punkts „Atbalstīsim Ukrainas un Moldovas iestāšanos Eiropas Savienībā …” pievieno citu iznākumu (Moldova, iestāšanās ES) — atsevišķs Solījums jv-ukrainas-un-moldovas-iestasanas-es."
