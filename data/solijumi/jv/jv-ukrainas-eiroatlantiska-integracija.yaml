piezimes: "Robežgadījums pārbaudāmībai: „integrācija” ir process bez konkrēta iznākuma (nav solīta, piem., iestāšanās ES vai NATO noteiktā laikā) — Nepārbaudāms. CVK nodaļā „2. Ārpolitika un latvieši pasaulē” ir „… līdz taisnīgam mieram un Ukrainas eiroatlantiskajai integrācijai”, paplašinātās programmas 2. nodaļā — „Atbalstīsim Ukrainas un Moldovas iestāšanos Eiropas Savienībā …” (jauns saturs: Moldova, iestāšanās ES); abi atstāti 2. nodaļas izpildei."
