nesakritiba: ""
piezimes: "CVK „-ot” daļa „stiprinot LIAA kā vienas pieturas aģentūru” — atsevišķs Solījums jv-liaa-vienas-pieturas-agentura (§1). „citās stratēģiskās nozarēs” ↔ „citām augstas pievienotās vērtības nozarēm” nav uzskatīts par būtisku Nesakritību. Pārbaudāms: paātrinātas tiesiskās un administratīvās procedūras nosauktajām nozarēm ieviestas vai nē. 10. nodaļas punkts „Uzlabosim uzņēmējdarbības vidi, ieviešot stratēģiskā investora statusu un «investora zaļo koridoru» …” — tuvs, bet ar jaunu saturu (statuss, kontaktpunkts, personīgs konsultants), atstāts 10. nodaļas izpildei; tur izvērtēt apvienošanu. Investīciju vide — EM (pieņēmums)."
jautajums: ""
