id: jv-paatrinati-investiciju-koridori
saraksts: jv
nosaukums: Paātrināti investīciju koridori stratēģiskajās nozarēs
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Veidosim paātrinātus investīciju koridorus enerģētikā, aizsardzībā, mākslīgajā intelektā un citās stratēģiskās nozarēs"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Izveidosim paātrinātus tiesiskos un administratīvos koridorus enerģētikas, aizsardzības, mākslīgā intelekta un citām augstas pievienotās vērtības nozarēm"
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Godīga konkurence un investīciju vides tiesiskā drošība"
    citats: "Tieslietu, vides, būvniecības un nodokļu administrācijas atļaujas stratēģiskiem investoriem, piemēram, aizsardzības jomā izskatīsim paātrināti ar publiski pārbaudāmiem termiņiem"
nesakritiba: "CVK sola „paātrinātus investīciju koridorus” bez termiņu prasības, paplašinātās programmas 10. nodaļā — atļaujas stratēģiskiem investoriem izskatīt paātrināti „ar publiski pārbaudāmiem termiņiem”."
piezimes: "CVK „-ot” daļa „stiprinot LIAA kā vienas pieturas aģentūru” — atsevišķs Solījums jv-liaa-vienas-pieturas-agentura (§1). „citās stratēģiskās nozarēs” ↔ „citām augstas pievienotās vērtības nozarēm” nav uzskatīts par būtisku Nesakritību. Pārbaudāms: paātrinātas tiesiskās un administratīvās procedūras nosauktajām nozarēm ieviestas vai nē. 10. nodaļas izpildē izvērtēts punkts „Uzlabosim uzņēmējdarbības vidi, ieviešot stratēģiskā investora statusu …”: teikums par paātrinātu atļauju izskatīšanu stratēģiskiem investoriem — tas pats iznākums, esošais Solījums papildināts (§0); statuss un kontaktpunkts (jv-strategiska-investora-statuss), personīgs konsultants (jv-personigs-valsts-konsultants-investoriem) un atbalsts piecus gadus (jv-atbalsts-investoriem-piecus-gadus) — jauns saturs, atsevišķi Solījumi. Investīciju vide — EM (pieņēmums)."
jautajums: ""
