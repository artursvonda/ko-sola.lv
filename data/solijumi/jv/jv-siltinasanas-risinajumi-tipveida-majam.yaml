id: jv-siltinasanas-risinajumi-tipveida-majam
saraksts: jv
nosaukums: Standartizēti rūpnieciski siltināšanas risinājumi tipveida daudzīvokļu mājām
parbaudams: true
temas:
  galvena: majokli
  papildu: [energetika]
iestades:
  galvena: em
  papildu: [kem]
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Attīstīsim pieejamu, drošu un prognozējamu enerģiju, jaunas elektroenerģijas jaudas, tīklus, uzkrāšanas risinājumus, energoefektivitāti"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Enerģētika un klimats"
    citats: "Izstrādāsim standartizētus, rūpnieciskus siltināšanas risinājumus tipveida daudzīvokļu mājām lielajās pilsētās"
nesakritiba: "CVK programma sola „attīstīsim … energoefektivitāti” bez konkrēta iznākuma, bet paplašinātā programma — „Izstrādāsim standartizētus, rūpnieciskus siltināšanas risinājumus tipveida daudzīvokļu mājām”; vērtē pēc šī."
piezimes: "CVK „energoefektivitāti” pievienota abiem paplašinātās programmas energoefektivitātes punktiem (§4; arī jv-privatais-finansejums-energoefektivitatei); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Pārbaudāms: risinājumi izstrādāti vai nē. Tēma pēc tā, ko maina lasītājam (daudzīvokļu māju atjaunošana). Mājokļu un ēku atjaunošanas politika — EM, KEM papildu (pieņēmums, nav pārbaudīts). 9. nodaļas punkts par birokrātisko prasību samazināšanu māju renovācijas un energoefektivitātes projektiem — cits iznākums, atstāts 9. nodaļas izpildei."
jautajums: ""
