piezimes: "Vērtēšanas avots — paplašinātā programma (CVK citāta nav). „-ot” daļa ir konkrētais iznākums, ko nozīmē pārvaldības modeļa maiņa, — nav dalīta; „tādējādi nodrošinot starpnozaru politikas pārstāvību” — mērķis. Punkta otrais teikums („Izvērtēsim iespēju veikt … daļēju kotāciju biržā …”) — Solījumā jv-kapitalsabiedribu-akciju-kotacija-birza. Pārbaudāms: atsevišķu kapitālsabiedrību pārvaldība nodota vairākām ministrijām vai nē. Valsts kapitālsabiedrību pārvaldības koordinācija — VK (kā jv-valsts-attistibas-fonds; pieņēmums, nav pārbaudīts). Saistīts: 3. nodaļas jv-valsts-attistibas-fonds (fonds lielo kapitālsabiedrību vienotai pārvaldībai)."
