piezimes: "Tikai CVK programma; paplašinātās programmas 10. nodaļā atbilstoša punkta nav. CVK 1. teikums dalīts pēc paplašinātās programmas punktiem (§4; sk. jv-tiesiskuma-stiprinasana); citēts viss teikums (§3). Nav apvienots ar jv-valsts-iepirkums-inovacijam, jv-latvijas-partikas-prioritate-iepirkumos un jv-kopigi-pakalpojumu-centri (cits iznākums). Nepārbaudāms: „stiprināsim” bez mēra. Publisko iepirkumu regulējums — FM (pieņēmums, nav pārbaudīts)."
