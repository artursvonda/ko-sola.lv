id: jv-valsts-attistibas-fonds
saraksts: jv
nosaukums: Valsts attīstības fonds lielo valsts kapitālsabiedrību vienotai pārvaldībai
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
iestades:
  galvena: vk
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Attīstīsim kapitāla tirgu un valsts attīstības fondu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Veicināsim Latvijas kapitāla tirgus attīstību, dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai"
nesakritiba: "CVK programma sola „attīstīsim … valsts attīstības fondu” bez mērķa un mēra, bet paplašinātā programma — „dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai” (vērtē pēc šī)."
piezimes: "Paplašinātās programmas punkts dalīts trīs Solījumos (§1 piemērs): šis, jv-kapitalsabiedribu-akciju-kotacija-birza, jv-kapitala-tirgus-sasaiste-ar-depozitarijiem. Galvenajā teikumā „Veicināsim Latvijas kapitāla tirgus attīstību” ir tikai vispārīgs darbības vārds — Solījums ir „-ot” daļa (§1). CVK teikuma daļai „valsts attīstības fondu” nav sava darbības vārda — citēts viss teikums (§3). Pārbaudāms: iestādes (fonda) izveide. Valsts kapitālsabiedrību pārvaldības koordinācija — valdības kopējā kompetence (VK), FM papildu (pieņēmums, nav pārbaudīts). 4. nodaļas punkts „Mainīsim valsts kapitālsabiedrību pārvaldības modeli, nododot atsevišķu uzņēmumu pārvaldības uzdevumu vairākām ministrijām” — cits iznākums, atstāts 4. nodaļas izpildei."
jautajums: ""
