    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Demogrāfija un ģimeņu veselība"
    citats: "Attīstīsim Goda ģimenes jeb 3+ karti kā valsts atzinības un praktiska atbalsta instrumentu ģimenēm ar bērniem, paplašinot tās sniegtās priekšrocības un partneru – publiskā un privātā sektora sniegto pakalpojumu – loku visā Latvijā"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Galvenajā teikumā „Attīstīsim … karti” ir tikai vispārīgs darbības vārds — Solījums ir „-ot” daļa (§1). Punkta otrais teikums („Iekļausim atbalsta programmā vecākus, kas audzina bērnus vieni paši”) — atsevišķs Solījums jv-goda-gimene-vientuliem-vecakiem (atšķirīgi statusi). Pārbaudāms: kartes priekšrocību vai partneru loks paplašināts vai nē. Atbildīgā iestāde nav droša — LM (ģimenes politika; pieņēmums, nav pārbaudīts, kuras iestādes pārraudzībā ir programma „Goda ģimene”)."
