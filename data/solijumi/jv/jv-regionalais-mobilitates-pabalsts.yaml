    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Spēcīgi reģioni, droša pierobeža, vienādas iespējas visā Latvijā"
    citats: "Ieviesīsim reģionālo nodarbinātības un mācību mobilitātes pabalstu, kompensējot daļu transporta izdevumu lauku reģionu iedzīvotājiem nokļūšanai uz darbu un vecākiem bērnu nogādāšanai uz izglītības un attīstības centriem"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma; „-ot” daļa definē pabalsta saturu — citēts viss punkts, nav dalīts. Pārbaudāms: pabalsts ieviests vai nē. Iestāde — robežgadījums: nodarbinātības pabalsti — LM, reģionālā politika — VARAM papildu (pieņēmums, nav pārbaudīts). Prioritāte „Mobilitātes atbalsts vecākiem un lauku reģionu iedzīvotājiem” pārklāta šeit."
