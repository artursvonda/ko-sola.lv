    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Tehnoloģijas un mākslīgais intelekts"
    citats: "Ieviesīsim MI asistentus valsts pārvaldes dokumentu apritē, datu analīzē un klientu apkalpošanā, pilnībā automatizējot iesniegumu pārbaudi"
nesakritiba: ""
piezimes: "„-ot” daļa ar konkrētu darbību un savu iznākumu (pilnīga automatizācija) — atsevišķs Solījums no MI asistentu ieviešanas (§1), statusi var atšķirties; citēts punkts līdz šai daļai. Pārbaudāms: iesniegumu pārbaude valsts pārvaldē pilnībā automatizēta vai nē (tvērums — kuri iesniegumi — nav precizēts). VARAM, VK papildu (pieņēmums, nav pārbaudīts)."
