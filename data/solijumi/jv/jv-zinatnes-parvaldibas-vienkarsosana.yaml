  papildu: []
avoti:
  - veids: paplasinata
    vieta: "7. Zinātne, inovācijas un tehnoloģijas › Apņemšanās un uzdevumi"
    citats: "Stiprināsim Latvijas zinātnes neatkarību un vienkāršosim tās pārvaldību"
nesakritiba: ""
piezimes: "Dalīts no jv-zinatnes-neatkariba-un-konkuretspeja (§1): atsevišķs darbības vārds ar citu iznākumu. Citēts no punkta sākuma, lai redzams „tās” attiecinājums. Vērtēšanas avots — paplašinātā programma (CVK citāta nav). Nepārbaudāms: „vienkāršosim” bez konkrēta mēra. Pamatojumā minētā institūtu un augstskolu pārraudzības koncentrēšana „ne vairāk kā trīs ministriju pārziņā pašreizējo astoņu vietā” netiek izrakstīta (Pamatojums, §1) un nav izmantota pārbaudāmības noteikšanai. IZM (zinātnes politika; pieņēmums, nav pārbaudīts)."
jautajums: ""
