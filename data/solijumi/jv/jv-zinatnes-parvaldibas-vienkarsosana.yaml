id: jv-zinatnes-parvaldibas-vienkarsosana
saraksts: jv
nosaukums: Zinātnes pārvaldības vienkāršošana
parbaudams: false
temas:
  galvena: izglitiba-un-zinatne
  papildu: [valsts-parvalde]
iestades:
