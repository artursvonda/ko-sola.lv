avoti:
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Atrisināsim vēsturiskos kopīpašuma tiesiskā regulējuma šķēršļus, panākot, ka publisku investīciju piesaiste privātīpašumā esošos pagalmos var notikt ātri un juridiski droši"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma; „-ot” daļa nosaka iznākumu — citēts viss punkts, nav dalīts. Robežgadījums pārbaudāmībai: Pārbaudāms pēc tā, vai kopīpašuma regulējums grozīts tā, ka publiskas investīcijas privātīpašuma pagalmos ir iespējamas. Iestāde — robežgadījums: kopīpašums (Civillikums) — TM, dzīvojamā vide — EM papildu (pieņēmums, nav pārbaudīts)."
jautajums: ""
