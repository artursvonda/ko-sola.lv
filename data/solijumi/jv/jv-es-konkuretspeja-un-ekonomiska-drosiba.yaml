id: jv-es-konkuretspeja-un-ekonomiska-drosiba
saraksts: jv
nosaukums: ES konkurētspējas un ekonomiskās drošības stiprināšana
parbaudams: false
temas:
  galvena: ekonomika-un-darbs
  papildu: [arpolitika]
iestades:
  galvena: em
  papildu: [arm]
avoti:
  - veids: cvk
    vieta: "2. Ārpolitika un latvieši pasaulē"
    citats: "Veicināsim Latvijas uzņēmēju ieiešanu ārvalstu tirgos, ES konkurētspēju un regulējuma vienkāršošanu"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "audzēsim Eiropas Savienības ekonomisko drošību un konkurētspēju pasaulē"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Latvija Eiropas kodolā: izaugsme un konkurētspēja"
    citats: "Veicināsim Eiropas Savienības spēku un konkurētspēju, pilnveidojot vienoto tirgu, stiprinot rūpniecību un inovāciju ekosistēmu, attīstot Eiropas izcilību jaunajās tehnoloģijās, tai skaitā mākslīgā intelekta un kvantu tehnoloģijās, kā arī vienkāršojot regulējumu, procedūras un mazinot šķēršļus Eiropas Savienības iekšienē"
nesakritiba: ""
piezimes: "CVK teikums dalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts viss teikums (§3). Nepārbaudāms: „veicināsim”/„audzēsim” bez mēra. Paplašinātā programma tajā pašā uzskaitījumā pievieno „ekonomisko drošību” — nav uzskatīts par būtisku Nesakritību (Nepārbaudāms, vērtē pēc CVK). „Veicināsim Eiropas Savienības spēku un konkurētspēju …” „-ot” daļas (vienotais tirgus, rūpniecības un inovāciju ekosistēma, izcilība jaunajās tehnoloģijās) apraksta veidu bez mēra — nav dalītas; „vienkāršojot regulējumu, procedūras un mazinot šķēršļus …” — citāts arī jv-es-regulejuma-vienkarsosana. ES konkurētspējas pozīcija — EM (nozares ministrija), ĀM papildu."
jautajums: ""
