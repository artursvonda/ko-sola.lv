id: jv-privatais-finansejums-energoefektivitatei
saraksts: jv
nosaukums: Jauni finanšu rīki privātā finansējuma piesaistei energoefektivitātei
parbaudams: true
temas:
  galvena: energetika
  papildu: [majokli]
iestades:
  galvena: kem
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Attīstīsim pieejamu, drošu un prognozējamu enerģiju, jaunas elektroenerģijas jaudas, tīklus, uzkrāšanas risinājumus, energoefektivitāti"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Enerģētika un klimats"
    citats: "Piesaistīsim privāto finansējumu energoefektivitātes pasākumiem, radot jaunus finanšu un riska mazināšanas rīkus"
nesakritiba: "CVK programma sola „attīstīsim … energoefektivitāti” bez konkrēta iznākuma, bet paplašinātā programma — privātā finansējuma piesaisti, „radot jaunus finanšu un riska mazināšanas rīkus”; vērtē pēc šī."
piezimes: "CVK teikums sadalīts pēc paplašinātās programmas dalījuma (§4); daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). CVK „energoefektivitāti” pievienota arī jv-siltinasanas-risinajumi-tipveida-majam (abi punkti to konkretizē). „radot jaunus finanšu un riska mazināšanas rīkus” apraksta, kā piesaistīs finansējumu, — nav dalīts, bet ir konkrētais iznākums, pēc kura vērtē; „mazinot atkarību no ES publiskajiem fondiem” un „attīstot energoefektivitātes pakalpojumu sektoru” — mērķis. Robežgadījums pārbaudāmībai: Pārbaudāms pēc tā, vai izveidoti jauni finanšu un riska mazināšanas rīki. Energoefektivitātes politika — KEM, EM papildu (ēku atjaunošana; pieņēmums, nav pārbaudīts)."
jautajums: ""
