piezimes: "CVK teikums (viens darbības vārds, trīs objekti ar atšķirīgu iznākumu) dalīts pēc paplašinātās programmas punktiem (§4): izglītības kvalitāte (jv-kvalitativa-izglitiba-katram-bernam), mācību līdzekļi (jv-macibu-lidzekli-un-gramata-katra-prieksmeta), pedagogu atalgojums (jv-pedagogu-atalgojums-pec-mk-grafika); citēts teikums līdz attiecīgajai daļai (§3). Paplašinātās programmas punkta pirmā daļa („Veidosim ilgtspējīgu un mūsdienīgu izglītības iestāžu ekosistēmu”) — atsevišķs Solījums jv-izglitibas-iestazu-ekosistema; šeit citēta tikai otrā daļa. Nepārbaudāms: bez mēra. Prioritāte „Kvalitatīva, droša un pieejama izglītība katram bērnam un jaunietim neatkarīgi no dzīves vietas” pārklāta šeit. IZM."
