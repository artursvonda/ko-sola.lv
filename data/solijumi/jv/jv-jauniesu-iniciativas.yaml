piezimes: "CVK teikuma galvenā daļa („Ieguldīsim spēcīgas pilsoniskas sabiedrības un noturīgas demokrātijas attīstībā”) — vispārīga; uzskaitījums pēc kola dalīts pēc paplašinātās programmas punktiem (§4): biedrības un nodibinājumi (jv-biedribu-un-nodibinajumu-atbalsts), jauniešu iniciatīvas (jv-jauniesu-iniciativas), pilsoniskais dialogs (jv-pilsoniskais-dialogs), mediju saturs (jv-mediju-saturs-latviesu-valoda); citēta daļa pēc kola līdz attiecīgajam objektam (§3). Tikai CVK: nav apvienots ar jv-jauniesu-lidzdaliba-un-jaunatnes-dialogs (tur — līdzdalības prasmes un Nacionālais Jaunatnes dialogs, cits iznākums); redaktors var izvērtēt. Nepārbaudāms. Jaunatnes politika — IZM."
