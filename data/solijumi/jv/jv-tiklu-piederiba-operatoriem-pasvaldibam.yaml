    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Pieejami mājokļi un kvalitatīva dzīves vide"
    citats: "Mainīsim regulējumu par sabiedrisko pakalpojumu sniegšanas tīkliem, nosakot, ka tie ir operatoru vai pašvaldības atbildībā un bilancē"
nesakritiba: ""
piezimes: "Tikai paplašinātā programma; „-ot” daļa nosaka iznākumu — citēts viss punkts. Saistīts ar jv-inzenierkomunikaciju-piederibas-noteiksana, bet konkrētāks iznākums (§4). Pārbaudāms: regulējums grozīts vai nē. Iestāde — robežgadījums: EM, KEM (siltumapgāde), VARAM (ūdenssaimniecība) papildu (pieņēmums, nav pārbaudīts)."
