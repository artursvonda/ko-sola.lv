piezimes: "Tikai CVK programma. CVK 1. teikums (viens darbības vārds, uzskaitījums ar atšķirīgu iznākumu) dalīts pēc paplašinātās programmas punktiem (§4): tiesiskums (šis), tiesu efektivitāte (jv-tiesu-efektivitate-atraka-lietu-izskatisana), korupcijas apkarošana (jv-pret-korupciju-un-interesu-konfliktiem), publisko iepirkumu caurskatāmība (jv-publisko-iepirkumu-caurskatamiba); citēts teikums līdz attiecīgajai daļai (§3, kā iepriekšējās izpildēs). Paplašinātajā programmā atsevišķa punkta „stiprināsim tiesiskumu” nav (tikai Prioritāte). Nepārbaudāms: „stiprināsim” + vispārīgs objekts. TM (pieņēmums, nav pārbaudīts)."
