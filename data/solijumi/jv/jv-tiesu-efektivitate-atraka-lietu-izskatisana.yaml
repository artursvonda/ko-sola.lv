piezimes: "CVK 1. teikums dalīts pēc paplašinātās programmas punktiem (§4; sk. jv-tiesiskuma-stiprinasana); citēts teikums līdz attiecīgajai daļai (§3). Paplašinātās programmas punkta „-ot” daļa „vienkāršojot un modernizējot procesuālos likumus” nosauc konkrētu darbību ar savu iznākumu — atsevišķs Solījums jv-procesualo-likumu-vienkarsosana (§1); citēts punkts līdz šai daļai. Nepārbaudāms: vērtēšanas avots (CVK) — „stiprināsim tiesu efektivitāti” bez mēra; paplašinātās „ātrāku un efektīvāku” — virziens bez skaitļa (robežgadījums). Prioritāte „Droša sodu izpilde un procesuālais ātrums tieslietās” pārklāta šeit, jv-procesualo-likumu-vienkarsosana un jv-ieslodzijuma-vieta-sievietem. TM (tiesu sistēma; pieņēmums, nav pārbaudīts)."
