id: jv-rail-baltica-pamatsavienojums
saraksts: jv
nosaukums: "«Rail Baltica» pamatsavienojuma ar Eiropu izbūve"
parbaudams: true
temas:
  galvena: transports
  papildu: []
iestades:
  galvena: sm
  papildu: []
avoti:
  - veids: cvk
    vieta: "9. Vide, reģioni un infrastruktūra"
    citats: 'Satiksmē nodrošināsim "Rail Baltica", reģionālo ceļu, dzelzceļa, ostu, sabiedriskā transporta un digitālās infrastruktūras attīstību ar skaidru atbildību, termiņiem un izmaksu kontroli'
  - veids: paplasinata
    vieta: "9. Vide, reģioni un infrastruktūra › Apņemšanās un uzdevumi › Satiksme un pasažieru pārvadājumi"
    citats: "Turpināsim projekta «RailBaltic» īstenošanu, izbūvējot pamatsavienojumu ar Eiropu platuma dzelzceļa sliedēm"
nesakritiba: 'CVK programma sola „nodrošināsim "Rail Baltica" … attīstību ar skaidru atbildību, termiņiem un izmaksu kontroli” bez konkrēta iznākuma, bet paplašinātā programma — „izbūvējot pamatsavienojumu ar Eiropu platuma dzelzceļa sliedēm”; vērtē pēc šī.'
piezimes: "CVK satiksmes teikums (viens darbības vārds, uzskaitījums bez sava darbības vārda katrai daļai) sadalīts pēc paplašinātās programmas dalījuma (§4); citēts viss teikums, jo kopīgais „attīstību” ir teikuma beigās (§3). Daļas: «Rail Baltica» (jv-rail-baltica-pamatsavienojums), reģionālie ceļi (jv-melna-seguma-autocelu-ipatsvars, jv-celu-finansejums-pierobeza, jv-dualas-lietojamibas-celi-un-tilti), dzelzceļš (jv-dzelzcela-pasazieru-parvadajumi), ostas (jv-ostu-konkuretspeja), sabiedriskais transports (jv-sabiedriska-transporta-reforma, jv-vienota-bilesu-sistema), digitālā infrastruktūra (jv-digitalas-infrastrukturas-attistiba). „ar skaidru atbildību, termiņiem un izmaksu kontroli” — veids, nav dalīts. Paplašinātās programmas galvenais teikums („Turpināsim … īstenošanu”) ir vispārīgs — Solījums ir „-ot” daļa (§1). Pārbaudāms: pamatsavienojums izbūvēts vai nē (termiņa nav). ES finansējums «Rail Baltica» — cits Solījums (jv-es-daudzgadu-budzeta-finansejums). SM (pieņēmums, nav pārbaudīts)."
jautajums: ""
