    vieta: "10. Tiesiskums"
    citats: "Aizstāvēsim un stiprināsim cilvēka pamattiesības, demokrātiskās un eiropeiskās vērtības, cilvēktiesības, kā arī Latvijas starptautiskās saistības"
  - veids: cvk
    vieta: "10. Tiesiskums"
    citats: "Iestāsimies par cilvēktiesībām"
  - veids: paplasinata
    vieta: "10. Tiesiskums › Apņemšanās un uzdevumi › Cilvēktiesību aizsardzība un vardarbības izskaušana"
    citats: "Aizstāvēsim un stiprināsim Satversmē nostiprinātās pamattiesības, kā arī cilvēktiesības, demokrātiskās un eiropeiskās vērtības un Latvijas starptautiskās saistības"
nesakritiba: ""
piezimes: "Uzskaitījums zem viena darbības vārda nav dalīts (§1); „kā mūsu drošības pamatu …” — pamatojums, nav citēts. CVK 2. teikums (viens darbības vārds, uzskaitījums) dalīts pēc paplašinātās programmas punktiem (§4): cilvēktiesības (šis — tas pats saturs, kas CVK 4. teikumā, §1), bērnu tiesības (jv-bernu-retraumatizacijas-mazinasana), vardarbības novēršana (jv-vardarbibas-noversana-un-apkarosana); citēts teikums līdz attiecīgajai daļai (§3). „cilvēka pamattiesības” ↔ „Satversmē nostiprinātās pamattiesības” — nav būtiska Nesakritība. Nepārbaudāms: vērtību deklarācija. Atbildīgā iestāde nav droša: TM (cilvēktiesību tiesiskais regulējums; pieņēmums, nav pārbaudīts); starptautiskās saistības — arī ĀM."
jautajums: ""
