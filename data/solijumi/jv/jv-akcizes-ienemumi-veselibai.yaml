nesakritiba: ""
piezimes: "Tikai paplašinātā programma. Punkta otrais teikums — atsevišķs Solījums no profilakses kā prioritātes (jv-profilakse-nacionalas-drosibas-dala). „līdzīgi kā Somijā un Igaunijā …” — pamatojums, nav citēts. Pārbaudāms: šo nodokļu ieņēmumu daļa novirzīta veselībai vai nē (daļas apmērs nav nosaukts). 3. nodaļas jv-akcize-saldinatiem-dzerieniem (akcīzes palielināšana) — cits iznākums. Budžeta sadale — FM, VM papildu (pieņēmums, nav pārbaudīts)."
