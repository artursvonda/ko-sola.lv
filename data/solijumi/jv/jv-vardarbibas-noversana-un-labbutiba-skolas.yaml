id: jv-vardarbibas-noversana-un-labbutiba-skolas
saraksts: jv
nosaukums: "Vardarbības novēršanas un labbūtības programma katrā skolā"
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [gimenes-un-demografija]
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība"
    citats: "Stiprināsim drošu un iekļaujošu skolas vidi, vardarbības novēršanu, labbūtību"
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Kvalitatīva, pieejama izglītība katram bērnam"
    citats: "nodrošināsim vardarbības novēršanas un labbūtības stiprināšanas programmu katrā skolā"
nesakritiba: "CVK sola stiprināt „vardarbības novēršanu, labbūtību” bez mēra, paplašinātā programma — „vardarbības novēršanas un labbūtības stiprināšanas programmu katrā skolā”."
piezimes: "CVK teikums (viens darbības vārds, uzskaitījums ar atšķirīgu iznākumu) dalīts pēc paplašinātās programmas punktiem (§4): skolas vide (jv-drosa-ieklaujosa-skolas-vide), vardarbības novēršana un labbūtība (jv-vardarbibas-noversana-un-labbutiba-skolas), vērtēšana (jv-vertesana-ka-macisanas-atbalsts); citēts teikums līdz attiecīgajai daļai (§3). Paplašinātās programmas punkta otrā daļa ar savu darbības vārdu; pirmā daļa (BAASIK) — jv-baasik-agrina-atbalsta-sistema (tur atstāta šīs nodaļas izpildei). Robežgadījums pārbaudāmībai: CVK citātā mēra nav, paplašinātajā — programma katrā skolā; vērtē pēc šī mēra (§4) — Pārbaudāms. IZM."
jautajums: ""
