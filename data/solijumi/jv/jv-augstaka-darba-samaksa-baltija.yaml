id: jv-augstaka-darba-samaksa-baltija
saraksts: jv
nosaukums: Augstākā darba samaksa Baltijā
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība"
    citats: "Mērķis ir produktīvākā ekonomika Baltijā: vismaz 3,5% IKP izaugsme gadā, augstākā darba samaksa"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Palielināsim vidējo darba algu valstī līdz 2500 eiro"
  - veids: paplasinata
    vieta: "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Labklājība un vecuma pensiju sistēma"
    citats: "Palielināsim vidējo darba algu valstī līdz 2500 eiro"
nesakritiba: "CVK programmā mērķis ir „augstākā darba samaksa” (relatīvs mērs — salīdzinājumā ar Baltijas valstīm), bet paplašinātajā programmā — „Palielināsim vidējo darba algu valstī līdz 2500 eiro” (absolūts mērs, cits rādītājs)."
piezimes: "Apvienots (§4): abi avoti sola to pašu iznākumu — darba samaksas līmeni —, atšķiras rādītājs. CVK teikuma daļai nav sava darbības vārda — citēts teikums līdz šai daļai (§3). Paplašinātās programmas punkts (tas pats teksts 4. un 5. nodaļā, §0.3) dalīts: minimālās algas daļa — jv-minimala-alga-50-videjas, vidējās algas daļa — šeit. „veicinot vispārēju dzīves līmeņa celšanos” — mērķis, nav dalīts. „Baltijā” nosaukumā — interpretācija: CVK teikumā „augstākā darba samaksa” uzskaitīta pēc „produktīvākā ekonomika Baltijā:”. Vērtēšanas avots — CVK (§4). Vidējā alga — tautsaimniecības iznākums, EM (pieņēmums, nav pārbaudīts). Prioritāte „Vidējās darba algas pieaugums līdz 2500 eiro …” pārklāta šeit."
jautajums: "Vai „augstākā darba samaksa” CVK programmā nozīmē augstāko Baltijas valstīs (kā nosaukumā), un vai vērtēt pēc šī relatīvā mēra, nevis pēc paplašinātās programmas „līdz 2500 eiro”? No tā atkarīgs nosaukums un ID."
