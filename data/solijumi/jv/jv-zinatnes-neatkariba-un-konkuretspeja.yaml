    citats: "Stiprināsim Latvijas zinātnes neatkarību un vienkāršosim tās pārvaldību, vienlaikus attīstot Latvijas spēju pašai radīt stratēģiski svarīgas tehnoloģijas un veicinot ciešu sadarbību ar pasaules akadēmisko vidi"
nesakritiba: ""
piezimes: "CVK teikums dalīts pēc paplašinātās programmas dalījuma (§4): neatkarība un starptautiskā konkurētspēja — šeit, komercializācija — jv-petniecibas-rezultatu-komercializacija; daļām nav sava darbības vārda — citēts viss teikums (§3). Paplašinātās programmas punktā citētas visas daļas, jo šī Solījuma saturs („neatkarību”, „sadarbību ar pasaules akadēmisko vidi”) nav nepārtraukts fragments; „vienkāršosim tās pārvaldību” — atsevišķs Solījums jv-zinatnes-parvaldibas-vienkarsosana, „attīstot … stratēģiski svarīgas tehnoloģijas” — jv-prioritaro-tehnologiju-attistiba. „veicinot ciešu sadarbību ar pasaules akadēmisko vidi” — veids, nav dalīts. Nepārbaudāms: „stiprināsim” bez mēra. Prioritāte „Neatkarīga, starptautiski atvērta un vienkāršāk pārvaldīta Latvijas zinātnes sistēma” pārklāta šeit un jv-zinatnes-parvaldibas-vienkarsosana."
jautajums: ""
