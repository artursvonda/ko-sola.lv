avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Nodokļi un fiskālā politika"
    citats: "ES fondus koncentrēsim aizsardzībā un augošos ekonomikas sektoros, nevis patēriņa subsīdijās."
nesakritiba: ""
piezimes: "Robežgadījums: mērķa daļas nav, „augoši ekonomikas sektori” nav definēti, bet iznākums ir izmērāms — vērtējams pēc ES fondu plānošanas/pārdales dokumentiem (aizsardzībai un uzņēmējdarbības sektoriem novirzītā daļa pieaug, patēriņa subsīdijām — samazinās). Aizsardzība un augošie sektori nav dalīti: viens lēmums par ES fondu sadalījumu zem viena darbības vārda (§1). Iestāde: FM — ES fondu vadība (ekstraktors pieņem, ka FM ir vadošā iestāde; nav pārbaudīts); AM papildu."
jautajums: ""
