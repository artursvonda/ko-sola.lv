    vieta: "AUGOŠA LATVIJA › Vide un Latvijas zeme"
    citats: "Klimata un ilgtspējas politikas pasākumus īstenosim, izvērtējot to ietekmi uz sociāli ekonomisko attīstību."
nesakritiba: ""
piezimes: "„Pasākumus īstenosim” ir vispārīgs — Solījums ir „-ot” daļa, citēts viss teikums (§1). Robežgadījums: „izvērtējot” (§2 „izvērtēsim X”), bet X ir visu klimata pasākumu ietekme — pastāvīgs darbības princips bez konkrēta izvērtējuma, tāpēc Nepārbaudāms. Iestāde: KEM — klimata politika."
