id: na-valsts-kapitalsabiedribu-darbibas-raditaji
saraksts: na
nosaukums: "Skaidri darbības rādītāji valsts kapitālsabiedrību padomēm"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
iestades:
  galvena: vk
  papildu: []
avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Efektīva pārvaldība"
    citats: "Veicināsim profesionāļu piesaisti valsts kapitālsabiedrību padomēs, ieviešot skaidrus darbības rādītājus."
nesakritiba: ""
piezimes: "„Veicināsim profesionāļu piesaisti” ir vispārīgs — Solījums ir „-ot” daļa, citēts viss teikums (§1). Robežgadījums: „skaidrus” nav mērāms, bet iznākums konkrēts — vērtējams pēc tā, vai valsts kapitālsabiedrībām (to padomēm) noteikti darbības rādītāji; avots nenosaka, vai rādītāji domāti padomes locekļiem vai kapitālsabiedrībām. Iestāde: VK — valsts kapitālsabiedrību pārvaldības koordinācija valdības centrā (ekstraktors NAV pārliecināts par pašreizējo institucionālo iedalījumu; kapitāla daļu turētāji ir nozaru ministrijas)."
jautajums: ""
