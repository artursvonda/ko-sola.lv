piezimes: "Teikums dalīts (§1): valsts iepirkumi un tirdzniecība — neatkarīgi iznākumi, kas var izpildīties atšķirīgi (otrs — na-latvijas-precu-ipatsvars-tirdznieciba); citēts viss teikums (§3). Robežgadījums: „palielināsim” + konkrēts objekts — Pārbaudāms; mērķa skaitļa nav; ekstraktors nezina, vai šāds īpatsvars tiek oficiāli uzskaitīts. Iestāde: FM — publisko iepirkumu politika."
