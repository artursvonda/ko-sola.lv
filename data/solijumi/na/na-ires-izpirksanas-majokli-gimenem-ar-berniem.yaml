avoti:
  - veids: cvk
    vieta: "LATVIJA ĢIMENĒM › Pieejams mājoklis"
    citats: "Ģimenēm ar bērniem nodrošināsim piekļuvi energoefektīviem zemas īres un nomas-izpirkšanas mājokļiem."
nesakritiba: ""
piezimes: "Robežgadījums (apvienošana, §4): tuvs na-energoefektivu-ires-majoklu-buvniecibas-programma („Izveidosim reģionālo būvniecības programmu energoefektīviem īres mājokļiem ar izpirkuma tiesībām”), bet iznākums cits — ne programmas izveide, bet piekļuve ģimenēm ar bērniem un „zema” īre; statusi var atšķirties — atsevišķs Solījums. Robežgadījums (pārbaudāmība): „nodrošināsim piekļuvi” bez mēra, bet konkrēts mājokļu veids un mērķgrupa — Pārbaudāms; vērtējams pēc tā, vai ģimenēm ar bērniem ir pieejams (vai prioritārs) valsts atbalstīts zemas īres un nomas-izpirkšanas mājokļu fonds. Zemas īres un nomas-izpirkšanas mājokļi — uzskaitījums vienam mērķim, nav dalīts. Iestāde: EM — mājokļu politika."
jautajums: ""
