  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Vide un Latvijas zeme"
    citats: "Stiprināsim enerģētisko drošību un neatkarību, tajā skaitā paātrinot elektroenerģijas pārvades tīkla modernizāciju."
nesakritiba: ""
piezimes: "„Tajā skaitā … -ot” daļa ar konkrētu darbību — atsevišķs Solījums (§1; sal. na-gimenes-veselibas-maciba); citēts viss teikums. Robežgadījums: „paātrināsim” + konkrēts objekts — Pārbaudāms kā „saīsināsim” (NA konvencija); vērtējams pēc pārvades tīkla modernizācijas investīciju tempa vai projektu termiņiem salīdzinājumā ar iepriekšējiem plāniem; mērķa nav. Iestāde: KEM — enerģētika."
