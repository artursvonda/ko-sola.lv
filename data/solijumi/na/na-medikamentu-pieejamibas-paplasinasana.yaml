    vieta: "LATVIJA ĢIMENĒM › Veselības aprūpe"
    citats: "Paplašināsim medikamentu pieejamību un pilnveidosim cenu kompensācijas sistēmu hronisko slimību pacientiem."
nesakritiba: ""
piezimes: "Punkts dalīts (§1): divi darbības vārdi ar atšķirīgiem iznākumiem (otrs — na-kompensacijas-sistema-hronisko-slimibu-pacientiem). Citēts viss teikums, jo nav skaidrs, vai „hronisko slimību pacientiem” attiecas arī uz šo daļu. Robežgadījums: „paplašināsim” + objekts (NA konvencija) — Pārbaudāms, bet „medikamentu pieejamība” ir plašs jēdziens; vērtējams pēc kompensējamo medikamentu klāsta vai tirgū pieejamo medikamentu skaita pieauguma; mērķa nav. Alternatīva — Nepārbaudāms (objekts vispārīgs). Iestāde: VM."
