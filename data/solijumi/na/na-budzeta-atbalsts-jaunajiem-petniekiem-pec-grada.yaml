    vieta: "AUGOŠA LATVIJA › Investīcijas un uzņēmējdarbība"
    citats: "Pārtrauksim jauno talantu aizplūšanu, garantējot paredzamu budžeta atbalstu jaunajiem pētniekiem tūlīt pēc grāda ieguves."
nesakritiba: ""
piezimes: "„Pārtrauksim jauno talantu aizplūšanu” ir mērķis bez mēra — Solījums ir „-ot” daļa, citēts viss teikums (§1). Pārbaudāms: vērtējams pēc tā, vai valsts budžetā ir paredzēts atbalsts (programma) jaunajiem pētniekiem uzreiz pēc grāda ieguves; „paredzamu” nav mērāms. Avots nenosaka, kurš grāds (maģistra vai doktora)."
