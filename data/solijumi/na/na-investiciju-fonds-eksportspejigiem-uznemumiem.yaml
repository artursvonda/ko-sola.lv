  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Investīcijas un uzņēmējdarbība"
    citats: "Investīciju fonda atbalstu sniegsim produktīviem eksportspējīgiem uzņēmumiem, kuros darbinieku atalgojums pārsniedz vidējo valstī."
nesakritiba: ""
piezimes: "Pārbaudāms: atbalsta kritērijs — vērtējams pēc fonda atbalsta noteikumiem (atbalsts paredzēts eksportspējīgiem uzņēmumiem, kuros atalgojums pārsniedz vidējo valstī; sal. na-valsts-atbalsts-latviesu-valodas-medijiem). „Produktīviem” nav mērāms. Avots nenosaka, kurš „Investīciju fonds” domāts (esošs vai jauns). Iestāde: EM — uzņēmējdarbības atbalsta politika; FM papildu (attīstības finanšu institūcijas; ekstraktors nav pārliecināts par kompetenču sadalījumu)."
jautajums: ""
