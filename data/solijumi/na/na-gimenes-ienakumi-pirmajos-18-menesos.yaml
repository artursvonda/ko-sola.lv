nesakritiba: ""
piezimes: "Robežgadījums: Pārbaudāms — konkrēts mērs (ne zemāk par iepriekšējo vidējo līmeni) un termiņš (18 mēneši); vērtējams pēc normatīvā regulējuma (vecāku pabalsta vai cita atbalsta apmērs, kas kompensē iepriekšējos vidējos ienākumus visu 18 mēnešu periodu). Avots nenosaka, vai „ģimenes ienākumi” ir abu vecāku kopējie vai saņēmēja ienākumi, un kā tiek mērīts „iepriekšējais vidējais līmenis”. Iestāde: LM — vecāku pabalsts un sociālā apdrošināšana."
