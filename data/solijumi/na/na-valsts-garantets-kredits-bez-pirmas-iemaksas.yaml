piezimes: "Pārbaudāms: konkrēts instruments — vērtējams pēc tā, vai jaunajām ģimenēm pieejama valsts garantija, kas aizstāj visu pirmo iemaksu. Avots nedefinē „jaunās ģimenes” un nesaka „mājokļa kredīts” (izriet no sadaļas „Pieejams mājoklis”). Ekstraktors nezina pašreizējos mājokļu garantiju programmas nosacījumus. Iestāde: EM — mājokļu politika."
