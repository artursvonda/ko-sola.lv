avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Vide un Latvijas zeme"
    citats: "Veicināsim energoefektivitātes paaugstināšanu, paplašinot atbalstu renovācijai un pārejai uz atjaunīgajiem energoresursiem."
nesakritiba: ""
piezimes: "„Veicināsim energoefektivitātes paaugstināšanu” ir vispārīgs — Solījums ir „-ot” daļa, citēts viss teikums (§1). Atbalsts renovācijai un pārejai uz AER — neatkarīgi iznākumi, kas var izpildīties atšķirīgi — dalīts (otrs — na-atbalsts-parejai-uz-atjaunigajiem-energoresursiem). Pārbaudāms: „paplašināsim atbalstu” + konkrēts objekts — vērtējams pēc renovācijas atbalsta programmu apjoma pieauguma; mērķa skaitļa nav. Iestāde: KEM — energoefektivitāte; EM — mājokļu renovācija (ekstraktors NAV pārliecināts, kura ministrija vada ēku renovācijas atbalstu)."
jautajums: ""
