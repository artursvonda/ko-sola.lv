piezimes: "Teikums dalīts (§1): „ieviešot efektīvāku vides monitoringu un kontroli” nosauc atsevišķu iznākumu (na-efektivaks-vides-monitorings-un-kontrole). Gaiss, ūdens, augsne — uzskaitījums zem viena darbības vārda, nav dalīts. Robežgadījums: „samazināsim” + konkrēti nosaukts objekts — Pārbaudāms pēc oficiālās vides statistikas; mērķa skaitļa nav; iespējama daļēja izpilde (rādītāji var mainīties atšķirīgi). Iestāde: VARAM — vides aizsardzība."
