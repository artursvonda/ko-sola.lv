id: na-ikp-uz-iedzivotaju-80-es-videja
saraksts: na
nosaukums: "IKP uz vienu iedzīvotāju 80% no ES vidējā līdz 2030. gadam"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: []
iestades:
  galvena: em
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA"
    citats: "Mūsu mērķis: IKP uz vienu iedzīvotāju sasniedz 80% no ES vidējā rādītāja līdz 2030. gadam."
nesakritiba: ""
piezimes: "Robežgadījums (§1): teikums ir nodaļas ievadā un formulēts kā „mērķis”, bet tam ir konkrēts mērs (80% no ES vidējā) un termiņš (2030) — tā nav vīzija bez iznākuma, tāpēc izrakstīts kā Pārbaudāms Solījums (§2). Avots nenosaka, vai rādītājs ir pēc pirktspējas paritātes (PPS) vai nominālais — vērtējot jāizvēlas viens un jānorāda. 2030. gada dati, visticamāk, tiks publicēti tikai pēc Vērtēšanas perioda beigām — gala Statuss būs jāvērtē pēc pēdējiem pieejamiem datiem. Iestāde: makroekonomisks iznākums, ko neietekmē viena ministrija; izvēlēta EM (tautsaimniecības politika), FM papildu (fiskālā politika); alternatīva — VK (valdības kopējā kompetence, §6a)."
jautajums: ""
