piezimes: "Pārbaudāms: programma tiek vai netiek ieviesta; skolas un bērnudārzi — viena programma, nav dalīta. „Katram bērnam” — ja programma aptver tikai daļu klašu vai vecumu, Daļēji izpildīts. Avots nenosaka, vai maltīte būs bezmaksas. Iestāde: IZM — izglītības iestādes (ekstraktors nav pārliecināts, kura ministrija pašlaik administrē valsts finansējumu skolēnu ēdināšanai; bērnudārzi ir pašvaldību kompetencē)."
