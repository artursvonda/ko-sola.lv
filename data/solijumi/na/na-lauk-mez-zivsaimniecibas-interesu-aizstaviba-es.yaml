    vieta: "AUGOŠA LATVIJA › Vide un Latvijas zeme"
    citats: "Veicināsim ilgtspējīgas lauksaimniecības, mežsaimniecības un zivsaimniecības attīstību, palielinot investīcijas modernizācijā, efektivitātē un produktu pārstrādē ar augstu pievienoto vērtību, aizstāvot Latvijas intereses un taisnīgu konkurenci ES."
nesakritiba: ""
piezimes: "„-ot” daļa ar atsevišķu iznākumu — atsevišķs Solījums (§1; otrs — na-lauk-mez-zivsaimniecibas-investiciju-palielinasana); citēts viss teikums. Nepārbaudāms: „aizstāvot intereses” bez konkrēta ES lēmuma vai mēra. Iestāde: ES līmeņa solījums — nozares ministrija, ZM (§6a)."
