nesakritiba: ""
piezimes: "„-ot” daļa ar atsevišķu iznākumu (finansēšanas modeļa izmaiņa) — atsevišķs Solījums (§1; otrs — na-rindu-pie-specialistiem-samazinasana); citēts viss teikums (avotā „efekīvākai” — burtiski). Robežgadījums: Nepārbaudāms — nav pateikts, kas ir „konsolidēšana” (piem., kopīgs fonds, obligātā apdrošināšana, privāto pakalpojumu iepirkums); alternatīva — Pārbaudāms, ja redaktors uzskata, ka jebkurš normatīvs mehānisms publiskā un privātā finansējuma apvienošanai ir pietiekami konkrēts. Iestāde: VM."
