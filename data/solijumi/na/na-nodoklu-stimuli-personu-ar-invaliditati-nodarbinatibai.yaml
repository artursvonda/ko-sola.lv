id: na-nodoklu-stimuli-personu-ar-invaliditati-nodarbinatibai
saraksts: na
nosaukums: "Nodokļu stimuli personu ar invaliditāti iesaistei darba tirgū"
parbaudams: true
temas:
  galvena: socialais-atbalsts-un-pensijas
  papildu: [ekonomika-un-darbs, nodokli-un-budzets]
iestades:
  galvena: fm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "LATVIJA ĢIMENĒM › Personas ar invaliditāti"
    citats: "Ar nodokļu stimuliem atbalstīsim sociālo uzņēmējdarbību un personu ar invaliditāti pilnvērtīgu iesaisti darba tirgū."
nesakritiba: ""
piezimes: "Dalīts no punkta par sociālo uzņēmējdarbību (§1; otrs — na-nodoklu-stimuli-socialajai-uznemejdarbibai); citēts viss teikums (§3). Robežgadījums: instruments konkrēts (nodokļu stimuli) — Pārbaudāms; vērtējams pēc jauniem vai paplašinātiem nodokļu atvieglojumiem, kas saistīti ar personu ar invaliditāti nodarbināšanu (darba devējiem vai pašām personām). „Pilnvērtīgu” nav mērāms. Iestāde: FM — nodokļu politika; LM — invaliditātes un nodarbinātības politika."
jautajums: ""
