    vieta: "AUGOŠA LATVIJA › Vide un Latvijas zeme"
    citats: "Veicināsim ilgtspējīgas lauksaimniecības, mežsaimniecības un zivsaimniecības attīstību, palielinot investīcijas modernizācijā, efektivitātē un produktu pārstrādē ar augstu pievienoto vērtību, aizstāvot Latvijas intereses un taisnīgu konkurenci ES."
nesakritiba: ""
piezimes: "„Veicināsim ilgtspējīgas … attīstību” ir vispārīgs — Solījumi ir divas „-ot” daļas ar atsevišķiem iznākumiem (otrs — na-lauk-mez-zivsaimniecibas-interesu-aizstaviba-es); citēts viss teikums (§1, §3). Uzskaitījums (modernizācija, efektivitāte, pārstrāde; trīs nozares) — nav dalīts. Robežgadījums: „palielinot investīcijas” + konkrēts objekts — Pārbaudāms; avots nenosaka, vai domātas valsts/ES atbalsta vai kopējās investīcijas nozarēs. Iestāde: ZM — lauksaimniecība, mežsaimniecība, zivsaimniecība."
