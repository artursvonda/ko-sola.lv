piezimes: "Pārbaudāms: skaitlisks mērs (600 EUR) un normatīva prasība (ikgadēja indeksācija). Robežgadījums (granularitāte): apmērs un indeksācija nav dalīti — viens pabalsts, „ar indeksāciju” raksturo palielināto pabalstu; ja izpildīta tikai viena daļa — Daļēji izpildīts. Avots nenosaka, vai 600 EUR ir mēnesī (visticamāk). Iestāde: LM — valsts sociālie pabalsti. Pašreizējais pabalsta apmērs šeit nav norādīts (ekstraktors to nezina droši)."
