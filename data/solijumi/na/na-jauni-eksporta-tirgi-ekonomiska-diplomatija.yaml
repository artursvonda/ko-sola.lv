nesakritiba: ""
piezimes: "„Stiprināsim ekonomisko diplomātiju” ir vispārīgs — Solījums ir „-ot” daļa, citēts viss teikums (§1). Robežgadījums: „jauni eksporta tirgi” nav definēti un nav mēra — Nepārbaudāms. Iestāde: ĀM — ekonomiskā diplomātija; EM — eksporta veicināšana."
