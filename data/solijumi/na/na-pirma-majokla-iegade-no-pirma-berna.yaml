    vieta: "LATVIJA ĢIMENĒM › Pieejams mājoklis"
    citats: "Atvieglosim pirmā mājokļa iegādi jau no pirmā bērna."
nesakritiba: ""
piezimes: "Robežgadījums: instruments nav nosaukts, bet ir konkrēts nosacījums (atbalsts pieejams jau no pirmā bērna) — Pārbaudāms; vērtējams pēc tā, vai valsts atbalsts pirmā mājokļa iegādei (garantija, grants vai cits) pieejams ģimenēm ar vienu bērnu. Var pārklāties ar na-15000-eur-grants-hipotekara-kredita-dzesanai un na-valsts-garantets-kredits-bez-pirmas-iemaksas, bet tie sola konkrētus instrumentus — atsevišķi Solījumi. Ekstraktors nezina pašreizējos mājokļu atbalsta programmu nosacījumus. Iestāde: EM — mājokļu politika (kā na-energoefektivu-ires-majoklu-buvniecibas-programma)."
jautajums: ""
