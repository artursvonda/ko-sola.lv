avoti:
  - veids: cvk
    vieta: "LATVIJA ĢIMENĒM › Veselības aprūpe"
    citats: "Nodrošināsim ģimenes ārstu pieejamību un integrētu veselības aprūpi visos novados – arī attālinātās konsultācijas."
nesakritiba: ""
piezimes: "Punkts dalīts (§1): ģimenes ārstu pieejamība un integrēta veselības aprūpe — neatkarīgi iznākumi (otrs — na-integreta-veselibas-aprupe-visos-novados); citēts viss teikums, jo daļai nav sava darbības vārda (§3). Nepārbaudāms: „nodrošināsim pieejamību” bez mēra (kā na-kritiskas-infrastrukturas-aizsardziba). Nav tas pats Solījums kā na-lauku-kopienu-pakalpojumu-saglabasana (tur — lauku kopienu pakalpojumu saglabāšana, ģimenes ārsti ir viens no uzskaitījuma). Iestāde: VM."
jautajums: ""
