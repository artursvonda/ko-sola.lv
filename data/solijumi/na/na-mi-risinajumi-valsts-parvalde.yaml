piezimes: "Robežgadījums: „ieviesīsim” ir konkrēts, bet objekts vispārīgs — nav nosaukts, kuri risinājumi, procesi vai iestādes; jebkurš viens MI rīks formāli izpildītu solījumu — Nepārbaudāms. „Samazinot administratīvo slogu” apraksta mērķi — nav dalīts. Iestāde: VARAM — valsts pārvaldes digitalizācija; VK — valsts pārvaldes politika."
