    vieta: "LATVIJA ĢIMENĒM › Remigrācija un diaspora"
    citats: "Radīsim stipendijas un prakses vietas diasporas jauniešiem Latvijā."
nesakritiba: ""
piezimes: "Robežgadījums (granularitāte): stipendijas un prakses vietas — uzskaitījums vienam mērķim (diasporas jauniešu piesaiste Latvijai) — nav dalīts; alternatīva — dalīt, jo tie ir atšķirīgi instrumenti, kas var izpildīties atšķirīgi. Pārbaudāms: instrumenti tiek vai netiek izveidoti; ja tikai viens — Daļēji izpildīts. Nav tas pats Solījums kā na-arvalstu-studenti-no-es-nato-oecd (tur — augstskolu ārvalstu studentu piesaistes prioritātes). Iestāde: IZM — stipendijas (ekstraktors nav pārliecināts; prakses vietas var būt citu iestāžu vai darba devēju kompetencē)."
jautajums: ""
