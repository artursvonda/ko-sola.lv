piezimes: "„Stiprināsim sakaru tīklu pārklājumu” ir vispārīgs — Solījums ir „-ot” daļa, citēts viss teikums (§1). Pārbaudāms: platjoslas interneta pārklājums visā valstī ir izmērāms; avots nenosaka ātrumu. Iestāde: SM — elektronisko sakaru politika; VARAM — digitālā transformācija (ekstraktors nav pilnīgi pārliecināts par pašreizējo kompetenču sadalījumu)."
