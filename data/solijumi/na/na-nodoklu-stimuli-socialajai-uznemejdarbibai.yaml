id: na-nodoklu-stimuli-socialajai-uznemejdarbibai
saraksts: na
nosaukums: "Nodokļu stimuli sociālajai uzņēmējdarbībai"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [nodokli-un-budzets, socialais-atbalsts-un-pensijas]
iestades:
  galvena: fm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "LATVIJA ĢIMENĒM › Personas ar invaliditāti"
    citats: "Ar nodokļu stimuliem atbalstīsim sociālo uzņēmējdarbību un personu ar invaliditāti pilnvērtīgu iesaisti darba tirgū."
nesakritiba: ""
piezimes: "Punkts dalīts (§1): sociālā uzņēmējdarbība un personu ar invaliditāti iesaiste darba tirgū — neatkarīgi iznākumi (otrs — na-nodoklu-stimuli-personu-ar-invaliditati-nodarbinatibai); citēts viss teikums (§3). Robežgadījums: „atbalstīsim” ir virziena vārds, bet instruments konkrēts (nodokļu stimuli) — Pārbaudāms; vērtējams pēc jauniem vai paplašinātiem nodokļu atvieglojumiem sociālajiem uzņēmumiem. Iestāde: FM — nodokļu politika; LM — sociālās uzņēmējdarbības politika (ekstraktors pieņem; nav pārbaudīts)."
jautajums: ""
