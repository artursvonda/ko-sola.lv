avoti:
  - veids: cvk
    vieta: "LATVIJA ĢIMENĒM › Remigrācija un diaspora"
    citats: "Veidosim atgriešanās atbalsta sistēmu mājoklim, darbam un bērnu izglītībai."
nesakritiba: ""
piezimes: "Viena sistēma ar uzskaitītām jomām — nav dalīta. Pārbaudāms: sistēma (programma) izveidota vai nē; ja aptver tikai daļu jomu — Daļēji izpildīts. Ekstraktors nezina, kādi remigrācijas atbalsta pasākumi pastāv pašlaik. Iestāde: ekstraktors NAV pārliecināts — VARAM izvēlēta, jo atceras, ka remigrācijas koordinatoru pasākumi bijuši VARAM un plānošanas reģionu pārziņā; ĀM — diasporas politikas koordinācija; jomas (mājoklis, darbs, izglītība) ir dažādu ministriju kompetencē."
jautajums: ""
