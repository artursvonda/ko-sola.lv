    vieta: "DROŠA LATVIJA › Stingra imigrācijas politika"
    citats: "Panāksim, ka augstskolas ārvalstu studentu piesaistē izvēlas ES, NATO un OECD valstu pilsoņus, kā arī diasporas jauniešus."
nesakritiba: ""
piezimes: "Robežgadījums: mēra nav, bet iznākums konkrēts — vērtējams pēc regulējuma (augstskolu vai imigrācijas), kas ārvalstu studentu piesaisti vērš uz ES, NATO, OECD valstu pilsoņiem un diasporu, vai pēc studentu sastāva izmaiņām. Iestāde: augstskolas ir autonomas — IZM (augstākās izglītības regulējums, §6a); IeM — studentu uzturēšanās atļaujas. Tēma: punkts imigrācijas sadaļā, maina imigrācijas plūsmu — migracija-un-diaspora."
jautajums: ""
