id: na-atraka-procedura-militaras-industrijas-investicijam
saraksts: na
nosaukums: "Ātrākā procedūra reģionā militārās industrijas investīcijām"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: am
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Investīcijas un uzņēmējdarbība"
    citats: "Ieviesīsim ātrāko procedūru reģionā militārās industrijas investīcijām."
nesakritiba: ""
piezimes: "Robežgadījums: „ātrāko reģionā” prasa salīdzinājumu ar kaimiņvalstīm, bet iznākums konkrēts — vērtējams pēc tā, vai ieviesta īpaša paātrināta procedūra militārās industrijas investīcijām (normatīvs) un tās termiņiem. Cits iznākums nekā na-vietejas-militaras-industrijas-attistiba (§4) — atsevišķs Solījums. Iestāde: AM — aizsardzības industrija; EM — investīciju vide (ekstraktors nav pārliecināts, kura iestāde vadītu procedūras izmaiņas)."
jautajums: ""
