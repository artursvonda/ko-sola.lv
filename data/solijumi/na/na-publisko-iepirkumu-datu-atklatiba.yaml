id: na-publisko-iepirkumu-datu-atklatiba
saraksts: na
nosaukums: "Atklātāki publisko iepirkumu dati"
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: fm
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "AUGOŠA LATVIJA › Nodokļi un fiskālā politika"
    citats: "Padarīsim publisko iepirkumu datus atklātākus"
nesakritiba: ""
piezimes: "Punkts dalīts (§1): datu atklātība un MI analīze — divas darbības ar savu darbības vārdu un iznākumu (otrs — na-mi-analize-publiskajos-iepirkumos). Robežgadījums: „atklātākus” bez mēra, bet konkrēts objekts — vērtējams pēc jaunām publiski pieejamām iepirkumu datu kopām vai detalizācijas (kā „palielināsim + konkrēts objekts”). Iestāde: FM — publisko iepirkumu politika; VARAM — e-iepirkumu sistēma (ekstraktors nav pilnīgi pārliecināts par sistēmas turētāju)."
jautajums: ""
