id: na-iestazu-darbinieku-sazina-valsts-valoda
saraksts: na
nosaukums: "Valsts un pašvaldību iestāžu darbinieku savstarpējā saziņa valsts valodā"
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu: [valsts-parvalde]
iestades:
  galvena: izm
  papildu: [vk]
avoti:
  - veids: cvk
    vieta: "LATVISKA LATVIJA › Valsts valoda publiskajā telpā"
    citats: "Noteiksim, ka valsts un pašvaldību iestādēs amatpersonu un darbinieku savstarpējā saziņa notiek valsts valodā."
nesakritiba: ""
piezimes: "Pārbaudāms: normatīva prasība tiek vai netiek noteikta. Iestāde: IZM kā valsts valodas politikas vadošā iestāde; VK — valsts pārvaldes darba organizācija."
jautajums: "Atbildīgā iestāde: IZM (valsts valodas politika) vai VK (valsts pārvaldes iekārta)? Avots nenosaka, kurā normatīvajā aktā prasība tiks noteikta."
