id: na-pateretaju-tiesibas-pakalpojums-latviesu-valoda
saraksts: na
nosaukums: "Patērētāju tiesības saņemt jebkuru pakalpojumu latviešu valodā"
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: izm
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "LATVISKA LATVIJA › Valsts valoda publiskajā telpā"
    citats: "Nodrošināsim patērētāju tiesības saņemt jebkuru pakalpojumu latviešu valodā – gan publiskajā, gan privātajā sektorā."
nesakritiba: ""
piezimes: "Pārbaudāms: konkrētas tiesības, kas tiek vai netiek noteiktas normatīvajā regulējumā (publiskajā un privātajā sektorā). Iestāde: redaktora lēmums — pagaidām IZM (valsts valodas politika), bet atbildīgā iestāde šobrīd nav zināma: avots nenosaka, kurā likumā tiesības tiks noteiktas; alternatīvas — EM (patērētāju tiesību aizsardzība, tāpēc papildu) vai TM (Valsts valodas centrs)."
jautajums: ""
