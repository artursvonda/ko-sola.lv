id: na-pateretaju-tiesibas-pakalpojums-latviesu-valoda
saraksts: na
nosaukums: "Patērētāju tiesības saņemt jebkuru pakalpojumu latviešu valodā"
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: izm
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "LATVISKA LATVIJA › Valsts valoda publiskajā telpā"
    citats: "Nodrošināsim patērētāju tiesības saņemt jebkuru pakalpojumu latviešu valodā – gan publiskajā, gan privātajā sektorā."
nesakritiba: ""
piezimes: "Pārbaudāms: konkrētas tiesības, kas tiek vai netiek noteiktas normatīvajā regulējumā (publiskajā un privātajā sektorā). Iestāde: IZM kā valsts valodas politikas vadošā iestāde; EM — patērētāju tiesību aizsardzība."
jautajums: "Atbildīgā iestāde: IZM (valsts valodas politika), EM (patērētāju tiesības) vai TM (Valsts valodas centrs)? Avots nenosaka, kurā likumā tiesības tiks noteiktas."
