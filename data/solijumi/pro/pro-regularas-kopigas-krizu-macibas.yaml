    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Civilā noturība un koordinēta rīcība krīzes situācijās"
    citats: "Organizēsim regulāras valsts, pašvaldību, uzņēmumu un sabiedrības kopīgas mācības militāru krīžu un hibrīdapdraudējumu scenārijos"
nesakritiba: ""
piezimes: "Pārbaudāms: vai šādas mācības notiek regulāri. Turpinājums („īpašu uzmanību pievēršot … medicīnas jomas gatavībai …”) — mācību saturs, nav dalīts; nav apvienots ar pro-civilmilitaras-apmacibas-un-traumu-standarti (medicīnas apmācības — cits iznākums). Nav apvienots ar CVK „iedzīvotāju sagatavošanu” (pro-iedzivotaju-sagatavosana-krizem — plašāks) — robežgadījums. Atbildīgā: IeM (civilā aizsardzība), AM papildu — nav pārbaudīts."
jautajums: ""
