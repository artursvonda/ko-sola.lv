id: pro-mezizstrades-apjoms-lidzsvarojot-intereses
saraksts: pro
nosaukums: Mežizstrādes apjoms, līdzsvarojot saimnieciskās, dabas un sabiedrības intereses
parbaudams: false
temas:
  galvena: vide-un-klimats
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: zm
  papildu: []
avoti:
  - veids: cvk
    vieta: MEŽI
    citats: Mežizstrādes apjomu noteiksim, līdzsvarojot saimnieciskās, dabas aizsardzības un sabiedrības intereses.
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ilgtspējīga mežsaimniecība un AS "Latvijas valsts meži" pārvaldība sabiedrības interesēs
    citats: Noteiksim mežizstrādes apjomu, līdzsvarojot saimnieciskās, dabas aizsardzības, klimata un sabiedrības intereses, lai meži atkal piesaistītu vairāk oglekļa un saglabātu bioloģisko daudzveidību.
nesakritiba: CVK līdzsvaro "saimnieciskās, dabas aizsardzības un sabiedrības intereses"; paplašinātā programma — arī "klimata" intereses, "lai meži atkal piesaistītu vairāk oglekļa".
piezimes: 'Nepārbaudāms: mežizstrādes apjomu nosaka jebkurā gadījumā; "līdzsvarojot" apraksta veidu, nav mēra (piem., apjoma samazinājuma vai oglekļa piesaistes rādītāja). Paplašinātās "lai meži atkal piesaistītu vairāk oglekļa" — mērķis, nevis apņemšanās mērs. Iestāde: meža nozares politika — ZM (nav pārbaudīts, vai apjomu nosaka arī citas iestādes).'
jautajums: ""
