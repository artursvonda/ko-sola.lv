id: pro-transporta-kompensacijas-pierobezas-gimenem
saraksts: pro
nosaukums: Transporta kompensācija pierobežas ģimenēm 100 eiro mēnesī
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu:
    - gimenes-un-demografija
    - transports
iestades:
  galvena: varam
  papildu:
    - lm
avoti:
  - veids: cvk
    vieta: REĢIONI
    citats: Nodrošināsim transporta kompensācijas ģimenēm pierobežā.
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Darbaspēka piesaiste un tam mērķētais atbalsts reģiona mērķu sasniegšanai
    citats: Ieviesīsim transporta kompensācijas pierobežas ģimenēm ar bērniem, kur abi vai viens vecāks ir nodarbināts un ikdienas pārvietošanās rada papildu slogu (garas distances, ierobežots sabiedriskais transports, augstas izmaksas), tiem piešķirot 100 euro mēnesī uz vienu ģimeni. Finansējums tiks nodrošināts no speciālās ES jaunā daudzgadu budžeta aploksnes pierobežas reģionu attīstībai un drošībai.
nesakritiba: CVK — „transporta kompensācijas ģimenēm pierobežā” bez apmēra un nosacījumiem; paplašinātā — „100 euro mēnesī uz vienu ģimeni”, tikai ģimenēm ar bērniem, kur vecāks nodarbināts, un finansējums „no speciālās ES jaunā daudzgadu budžeta aploksnes”.
piezimes: "CVK citātā nav mēra — vērtē pēc paplašinātās „100 euro mēnesī uz vienu ģimeni” (§4). Finansējuma avots (ES jaunais daudzgadu budžets) var nozīmēt ieviešanu tikai no tā darbības sākuma — nosacījums ierakstīts Nesakritībā. Atbildīgā: ekstraktors nezina, kura iestāde administrētu šādu kompensāciju; VARAM (pierobežas reģionu attīstība), LM papildu (atbalsts ģimenēm) — nav pārbaudīts. 10. nodaļā šāda kompensācija nav minēta."
jautajums: ""
