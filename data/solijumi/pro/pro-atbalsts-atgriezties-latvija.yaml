piezimes: "Pārbaudāms (robežgadījums): vērtē pēc CVK — vai atbalsts pieejams ikvienam atgriezties gribošajam. Atbildīgā: ekstraktors nav drošs — reemigrācijas atbalsts, pēc ekstraktora zināšanām, saistīts ar VARAM (plānošanas reģionu koordinatori), diasporas politika — ĀM; nav pārbaudīts."
