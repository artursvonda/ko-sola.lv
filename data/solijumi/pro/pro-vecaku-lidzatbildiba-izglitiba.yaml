avoti:
  - veids: paplasinata
    vieta: 8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Ģimeņu atbalsta centri un skaidra vecāku līdzatbildība
    citats: "Stiprināsim vecāku līdzatbildību bērna interešu nodrošināšanai izglītības procesā: savlaicīga saziņa ar skolu, informēšana par bērna veselības vai atbalsta vajadzībām, iesaiste problēmu risināšanā un atbildība par sistemātiskiem neattaisnotiem kavējumiem un neinformēšanu par veselības stāvokli, nostiprinot bērna tiesību aizsardzības mehānismus pašvaldību un valsts līmenī."
nesakritiba: ""
piezimes: "Nepārbaudāms: „stiprināsim” bez konkrēta normatīva; ekstraktors nezina, kādā apjomā vecāku atbildība par kavējumiem jau noteikta. „-ot” daļa vispārīga, nav dalīta."
