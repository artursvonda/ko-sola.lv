id: pro-aizsardzibas-industrijas-parku-programma
saraksts: pro
nosaukums: "Aizsardzības industrijas parku programma ar zonām pašvaldību parkos"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: am
  papildu:
    - em
    - varam
avoti:
  - veids: cvk
    vieta: "DROŠĪBA UN ĀRPOLITIKA"
    citats: "Veidosim aizsardzības industrijas parkus ar sakārtotu infrastruktūru, ātrākiem lēmumiem un atbalstu inovācijām un ražošanai atbilstoši NBS vajadzībām."
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Spēcīga un konkurētspējīga aizsardzības industrija"
    citats: "Izveidosim aizsardzības industrijas attīstības parku programmu, attīstot specializētas zonas pašvaldību industriālajos parkos"
nesakritiba: "CVK sola „veidosim aizsardzības industrijas parkus” ar sakārtotu infrastruktūru, ātrākiem lēmumiem un atbalstu inovācijām; paplašinātā programma — „parku programmu” ar specializētām zonām pašvaldību industriālajos parkos."
piezimes: "CVK 4. punkts sadalīts pēc paplašinātās programmas (§4): parku programma (šis), nacionālas nozīmes parks (pro-nacionalas-nozimes-aizsardzibas-industrijas-parks), ātrāki procesi (pro-atrakas-atlaujas-aizsardzibas-razosanai). „atbalstu inovācijām un ražošanai atbilstoši NBS vajadzībām” — parku saturs, ietverts šeit. Atbildīgā: AM, EM un VARAM papildu — nav pārbaudīts."
