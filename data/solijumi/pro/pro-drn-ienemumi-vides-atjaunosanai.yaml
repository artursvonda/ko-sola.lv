id: pro-drn-ienemumi-vides-atjaunosanai
saraksts: pro
nosaukums: Visi DRN ieņēmumi vides atjaunošanai un klimata mērķiem
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: fm
  papildu:
    - varam
avoti:
  - veids: cvk
    vieta: KLIMATS UN VIDE
    citats: Ieviesīsim taisnīgus dabas resursu un klimata nodokļus uzņēmumiem, kas piesārņo vidi, ieņēmumus novirzot vides atjaunošanai.
  - veids: paplasinata
    vieta: 14. Taisnīga un atbildīga nodokļu sistēma › Dabas resursu nodoklis, kuru maksā piesārņotājs
    citats: Visi ieņēmumi no dabas resursu nodokļa tiks novirzīti vides atjaunošanai, piesārņojuma novēršanai, klimatneitralitātes un klimatnoturības sasniegšanai, kā arī taisnīgām kompensācijām privātajiem īpašniekiem par saimnieciskās darbības ierobežojumiem – nevis valsts vispārējam budžetam.
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Taisnīgi vides un klimata nodokļi
    citats: Gūtos ieņēmumus novirzīsim vides atjaunošanai, piesārņojuma mazināšanai, klimatneitralitātes un klimatnoturības stiprināšanai, kā arī kompensācijām par saimnieciskās darbības ierobežojumiem.
nesakritiba: CVK — ieņēmumus novirzīt "vides atjaunošanai"; 14. nodaļa — "visi ieņēmumi" arī piesārņojuma novēršanai, klimatneitralitātei, klimatnoturībai un kompensācijām īpašniekiem, "nevis valsts vispārējam budžetam".
piezimes: 'CVK citāts no nodaļas KLIMATS UN VIDE ("-ot" daļa ar savu iznākumu; sk. pro-drn-likmes-atbilstosi-zaudejumiem). 2. nodaļas punkts pievienots pēc §0.3. Atbildīgā: ieņēmumu piesaiste budžetā — FM.'
jautajums: ""
