id: pro-balsstiesibas-pasvaldibu-velesanas-no-16
saraksts: pro
nosaukums: Balsstiesības pašvaldību vēlēšanās no 16 gadu vecuma
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu:
    - regioni-un-pasvaldibas
iestades:
  galvena: saeima
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Iedzīvotāju iesaiste pašvaldības attīstības veicināšanā
    citats: Ieviesīsim balsstiesības pašvaldību vēlēšanās no 16 gadu vecuma un stiprināsim pilsonisko izglītību skolās, lai nodrošinātu jauniešu aktivitātes pieaugumu un iesaistītu ikdienas lēmumu pieņemšanā
nesakritiba: ""
piezimes: "Punkts dalīts (§1): balsstiesības no 16 gadiem un pilsoniskā izglītība (pro-pilsoniska-izglitiba-skolas) var saņemt atšķirīgus statusus; citē visu teikumu. „lai nodrošinātu …” — mērķis. Atbildīgā: Saeima — iznākums ir vēlēšanu likuma grozījumi; ekstraktors nav pārbaudījis, vai vajadzīgi arī Satversmes grozījumi un vai likumprojektu parasti gatavo ministrija (iespējams, VARAM)."
jautajums: ""
