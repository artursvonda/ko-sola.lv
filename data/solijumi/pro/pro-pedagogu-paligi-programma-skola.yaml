piezimes: "Robežgadījums pārbaudāmībai: mērs ir „Programma skolā” plānotais; ekstraktors nezina, kas ir „Programma skolā” un ko tā paredz. Esošais pro-pedagogu-paligi-un-pielagota-macibu-vide (3. nod., iekļaujoša vide katram bērnam, bez mēra) — atstāts atsevišķi: cits mērķis un mērs; iespējams, redaktors to vērtēs kā to pašu Solījumu. CVK 4. punkts (programma piesaistei reģionos) — pro-atbalsta-personala-programma-regionos."
