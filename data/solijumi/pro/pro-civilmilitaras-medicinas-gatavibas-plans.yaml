id: pro-civilmilitaras-medicinas-gatavibas-plans
saraksts: pro
nosaukums: Kopīgs civilās un militārās medicīnas gatavības plāns
parbaudams: true
temas:
  galvena: veseliba
  papildu:
    - aizsardziba
iestades:
  galvena: vm
  papildu:
    - am
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Balstīsim slimnīcu tīklu uz konkrētiem pacientu pieredzes ceļiem, rezultātiem un gatavību krīzēm, stiprinot civilmilitāro sadarbību.
  - veids: paplasinata
    vieta: "4. Veselīga un ilgi dzīvojoša sabiedrība › Veselības sistēmas gatavība krīzēm: civilās un militārās medicīnas sadarbība"
    citats: Izstrādāsim kopīgu civilās un militārās medicīnas gatavības plānu, skaidri nosakot NBS, NMPD, VADC un slimnīcu lomas.
nesakritiba: CVK sola tikai "stiprinot civilmilitāro sadarbību"; paplašinātā programma — "kopīgu civilās un militārās medicīnas gatavības plānu" ar noteiktām NBS, NMPD, VADC un slimnīcu lomām.
piezimes: 'CVK 6. punkta "-ot" daļa (sk. pro-slimnicu-tikls-pec-akuto-stavoklu-celiem). Vērtē pēc paplašinātās programmas mēra (plāns). Atbildīgā: VM, AM papildu (nav pārbaudīts).'
jautajums: ""
