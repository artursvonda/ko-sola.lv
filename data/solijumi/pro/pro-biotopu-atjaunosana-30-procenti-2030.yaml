piezimes: 'Viens Solījums: 2050. gada mērķis ir pēc Vērtēšanas perioda — nav atsevišķs Solījums; vērtē pēc 2030. gada mēra. Nav apvienots ar pro-nacionalais-dabas-atjaunosanas-plans (plāns ↔ faktiskā atjaunošana — atšķirīgi iznākumi). Ekstraktors nezina, kā tiek uzskaitīti "sliktā stāvoklī esošie biotopi". Iestāde: VARAM (nav pārbaudīts).'
