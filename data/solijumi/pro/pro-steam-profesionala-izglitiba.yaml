id: pro-steam-profesionala-izglitiba
saraksts: pro
nosaukums: Vairāk profesionālās izglītības vietu un finansējuma STEAM specializācijām
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: []
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: IZGLĪTĪBA UN ZINĀTNE
    citats: Ievirzīsim profesionālo izglītību par labu STEAM specializācijām, ar kurām Latvija izceļas pasaulē.
  - veids: paplasinata
    vieta: "8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Profesionālā STEAM izglītība Latvijas izrāvienam: no zinātnes līdz radošajām industrijām"
    citats: "Mainīsim profesionālās ievirzes un profesionālās vidējās izglītības valsts pasūtījumu: vairāk finansējuma un mācību vietu novirzīsim STEAM specializācijām"
nesakritiba: CVK sola „ievirzīsim profesionālo izglītību par labu STEAM specializācijām” bez mēra; paplašinātā programma — mainīt valsts pasūtījumu, novirzot „vairāk finansējuma un mācību vietu”, arī profesionālās ievirzes izglītībā.
piezimes: "Vērtē pēc paplašinātās programmas mēra (§4): vai valsts pasūtījumā palielināts STEAM specializāciju finansējums un mācību vietu skaits."
