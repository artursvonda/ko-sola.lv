avoti:
  - veids: paplasinata
    vieta: 10. Transports, savienojamība un droša mobilitāte › Latvija bez elektronisko sakaru "baltajām zonām"
    citats: Likvidēsim atlikušās elektronisko sakaru "baltās zonas", nodrošinot kvalitatīvu mobilo sakaru un interneta pārklājumu visā Latvijā.
nesakritiba: ""
piezimes: "„-ot” daļa ir tas pats iznākums (pārklājums visā Latvijā) — nav dalīta. Pārbaudāms: vērtē, vai „baltās zonas” (teritorijas bez kvalitatīva mobilo sakaru un interneta pārklājuma) likvidētas; ja samazinātas — daļēja izpilde. Tēma — reģioni (pārklājuma trūkums skar lauku teritorijas). Nav apvienots ar pro-vienoti-digitalie-standarti-pasvaldibu-iestadem (standarti iestādēm — cits iznākums). Atbildīgā: elektronisko sakaru politika — pēc ekstraktora zināšanām SM (nav pārbaudīts)."
jautajums: ""
