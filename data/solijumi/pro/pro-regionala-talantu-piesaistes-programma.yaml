id: pro-regionala-talantu-piesaistes-programma
saraksts: pro
nosaukums: Reģionālā talantu piesaistes programma ar pabalstiem līdz 10 000 eiro
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: varam
  papildu:
    - em
avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Darbaspēka piesaiste un tam mērķētais atbalsts reģiona mērķu sasniegšanai
    citats: Izveidosim reģionālo talantu piesaistes un mobilitātes programmu ar mobilitātes pabalstiem līdz 10 000 euro mājokļa subsīdijām, nodokļu atvieglojumiem 3 gadu periodā un mentoringu.
nesakritiba: ""
piezimes: "Programmas elementi (mobilitātes pabalsti/mājokļa subsīdijas līdz 10 000 euro, nodokļu atvieglojumi 3 gadus, mentorings) — uzskaitījums zem viena darbības vārda, nav dalīti; ja programma izveidota bez kāda elementa — daļēja izpilde. Avota formulējums „mobilitātes pabalstiem līdz 10 000 euro mājokļa subsīdijām” nav viennozīmīgs (vai 10 000 euro attiecas uz pabalstiem vai mājokļa subsīdijām). Atbildīgā: VARAM (reģionālā politika), EM papildu (nav pārbaudīts)."
jautajums: ""
