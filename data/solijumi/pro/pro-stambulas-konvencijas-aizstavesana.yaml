piezimes: "Tikai CVK programmas ievadā („TREŠĀ PRIORITĀTE”); neviena nodaļa (ne CVK, ne paplašinātā) konvenciju nemin (#96). Pārbaudāms („aizstāvēsim X”, X konkrēts — §2): Latvija četru gadu beigās ir konvencijas dalībvalsts vai nē. Atbildīgā iestāde kā jv-stambulas-konvencijas-dalibas-saglabasana: Saeima (pieņēmums, nav pārbaudīts). Pārējās ievada apņemšanās pārklāj nodaļu Solījumi (ES integrācija, vardarbības upuri, mediji, NVO)."
