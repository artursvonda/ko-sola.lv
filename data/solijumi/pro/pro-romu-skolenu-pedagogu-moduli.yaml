id: pro-romu-skolenu-pedagogu-moduli
saraksts: pro
nosaukums: Obligāti pedagogu moduļi par iekļaujošu izglītību romu skolēnu atbalstam
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: []
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 7. Iekļaujoša sabiedrība, kur ikviens jūtas droši › Sabiedrības saliedētība caur klātbūtni un kopīgu pieredzi
    citats: Ieviesīsim romu skolēnu atbalsta pasākumus iesaistei izglītībā, nodrošinot mērķētus obligātos pedagogu profesionālās pilnveides moduļus par iekļaujošu izglītību un kultūru daudzveidību, kā arī sniedzot cilvēcīgs klātbūtnes atbalsts romu tautības skolēniem ar mentoriem un pedagogu palīgiem.
nesakritiba: ""
piezimes: 'Galvenā daļa ("Ieviesīsim romu skolēnu atbalsta pasākumus") bez "-ot" daļām vispārīga — Solījumi ir "-ot" daļas (§1): pedagogu moduļi (šis) un mentori/pedagogu palīgi (pro-romu-skolenu-mentori-pedagogu-paligi); citēts viss teikums. Atbildīgā: IZM (nav pārbaudīts).'
jautajums: ""
