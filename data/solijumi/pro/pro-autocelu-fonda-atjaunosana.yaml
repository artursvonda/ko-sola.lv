id: pro-autocelu-fonda-atjaunosana
saraksts: pro
nosaukums: Plāns atgriezties pie Autoceļu fonda
parbaudams: true
temas:
  galvena: transports
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: sm
  papildu:
    - fm
avoti:
  - veids: paplasinata
    vieta: 14. Taisnīga un atbildīga nodokļu sistēma › Nodokļu piesaiste izdevumiem
    citats: Jāizveido skaidrs plāns, lai atgrieztos pie likumā jau noteiktā, paredzamā budžeta autoceļu fondam
  - veids: paplasinata
    vieta: 10. Transports, savienojamība un droša mobilitāte › Droši un kvalitatīvi ceļi visā Latvijā
    citats: Izveidosim stabilu un prognozējamu autoceļu finansēšanas modeli, pakāpeniski atjaunojot Autoceļu fonda principu.
nesakritiba: 14. nodaļa sola "skaidru plānu, lai atgrieztos" pie autoceļu fonda; 10. nodaļa — izveidot finansēšanas modeli, "pakāpeniski atjaunojot Autoceļu fonda principu".
piezimes: 10. nodaļas punkts pievienots pēc §0.3. Vērtēšanas avots — 14. nodaļa (plāns).
jautajums: ""
