id: pro-lielaks-finansejums-pilsoniskajam-iniciativam
saraksts: pro
nosaukums: Lielāks finansiāls atbalsts vietējo kopienu pilsoniskajām iniciatīvām
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu:
    - regioni-un-pasvaldibas
iestades:
  galvena: km
  papildu:
    - varam
avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Iedzīvotāju iesaiste pašvaldības attīstības veicināšanā
    citats: Atbalstīsim vietējo kopienu iniciatīvas, piešķirot lielāku finansiālu atbalstu pilsoniskajām iniciatīvām valsts un pašvaldību līmenī.
nesakritiba: ""
piezimes: "Solījums ir „-ot” daļa (galvenais teikums vispārīgs, §1). Pārbaudāms (robežgadījums): vērtē, vai valsts un pašvaldību finansējums pilsoniskajām iniciatīvām palielinājies; apjoms nav noteikts. Alternatīva — Nepārbaudāms. Nav apvienots ar pro-atbalsts-kopienu-lidzdalibai (Nepārbaudāms, bez finansējuma) un pro-nvo-fonda-pakapenisks-pieaugums (konkrēti NVO fonds) — citi iznākumi. Atbildīgā: KM (pilsoniskā sabiedrība, kā pro-atbalsts-kopienu-lidzdalibai), VARAM papildu (pašvaldību līmenis) — nav pārbaudīts."
jautajums: ""
