id: pro-skrininga-personalizacija-pec-genetiska-riska
saraksts: pro
nosaukums: Skrīninga personalizācija pēc ģenētiskā riska (t. sk. krūts vēža skrīningā)
parbaudams: true
temas:
  galvena: veseliba
  papildu: []
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Stiprināsim profilaksi ar centralizētu skrīningu pārvaldību un personalizāciju pēc ģenētiskā riska, t.sk. ar valsts apmaksātu BRCA testēšanu.
  - veids: paplasinata
    vieta: "4. Veselīga un ilgi dzīvojoša sabiedrība › Proaktīva veselības aprūpe: profilakse un skrīnings"
    citats: ieviesīsim personalizētu pieeju krūts vēža skrīningam un profilaksei, balstoties uz individuāliem ģenētiskajiem riska faktoriem.
nesakritiba: CVK sola profilakses "personalizāciju pēc ģenētiskā riska" vispārīgi; paplašinātā programma — "personalizētu pieeju krūts vēža skrīningam un profilaksei".
piezimes: CVK citēts viss teikums (daļai nav sava darbības vārda, §3). Vērtē pēc CVK; paplašinātā programma konkretizē krūts vēža skrīningu — tas ir minimālais pārbaudāmais iznākums.
jautajums: ""
