    vieta: 13. Valsts pārvalde, kas sasniedz mērķus › Taisnīga atalgojuma sistēma valsts pārvaldē
    citats: "Atalgojuma sistēmas izmaiņām jāsasniedz sekojošie mērķi: jāsamazina nevienlīdzība starp resoriem un iestādēm. jānodrošina līdzīgs atalgojums starp salīdzināmām amata pozīcijām, kā arī jānodrošina caurskatāma un godīga mainīgā atalgojuma daļas sistēma."
