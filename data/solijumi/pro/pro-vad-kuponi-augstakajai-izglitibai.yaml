id: pro-vad-kuponi-augstakajai-izglitibai
saraksts: pro
nosaukums: "VAD kuponu sistēma bezmaksas augstākajai izglītībai"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu:
    - izglitiba-un-zinatne
iestades:
  galvena: am
  papildu:
    - izm
avoti:
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Kvalitatīvs un pieejams valsts aizsardzības dienests"
    citats: "Izveidosim kuponu sistēmu bezmaksas augstākās izglītības ieguvei, attiecinot to gan uz valsts, gan privātajām augstskolām un koledžām."
nesakritiba: ""
piezimes: "Punkts sadaļā par valsts aizsardzības dienestu; avots tieši nesaka, kam kuponi paredzēti (pēc konteksta — VAD dienējušajiem). Ekstraktors nezina, kāds izglītības atbalsts VAD jau pastāv. Atbildīgā: AM (VAD atbalsta pasākumi), IZM papildu — nav pārbaudīts."
jautajums: ""
