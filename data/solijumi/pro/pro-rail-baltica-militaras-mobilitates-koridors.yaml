    vieta: 10. Transports, savienojamība un droša mobilitāte › Rail Baltica – Latvijas savienojamībai un drošībai
    citats: Attīstīsim Rail Baltica kā stratēģisku militārās mobilitātes koridoru, kas ļauj krīzes situācijās ātri pārvietot cilvēkus, tehniku un kravas.
nesakritiba: ""
piezimes: "Nepārbaudāms: „attīstīsim … kā koridoru” bez konkrētām prasībām vai objektiem (piem., militārās kravu stacijas). Tēma pēc tā, ko maina lasītājam, — aizsardzība (§6). Nav apvienots ar pro-es-budzets-aizsardzibai-un-militarajai-mobilitatei (ES budžeta pozīcija — cits iznākums) un pro-energoefektiva-militara-infrastruktura (militārā infrastruktūra). Atbildīgā: Rail Baltica projekts — SM; militārās mobilitātes prasības — AM papildu (nav pārbaudīts)."
jautajums: ""
