id: pro-stingri-aizsargata-teritorija-10-procenti
saraksts: pro
nosaukums: Stingri aizsargāti vismaz 10% Latvijas teritorijas
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Daba un bioloģiskā daudzveidība
    citats: Nodrošināsim, ka vismaz 10% Latvijas teritorijas ir stingri aizsargāti
nesakritiba: ""
piezimes: 'Teikums dalīts (§1): 10% stingri aizsargāti un 30% dabai draudzīgi (pro-teritorija-dabai-draudziga-apsaimniekosana-30) — atšķirīgi rādītāji. Nav apvienots ar pro-mezu-stingra-aizsardziba-17-procenti (cits rādītājs: mežu platība ↔ visa teritorija). "Stingri aizsargāts" avotā nav definēts; ekstraktors nezina pašreizējo īpatsvaru. Iestāde: īpaši aizsargājamās dabas teritorijas — VARAM (nav pārbaudīts).'
jautajums: ""
