avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Finanšu pašpietiekamība un taisnīga naudas sadale reģioniem
    citats: Ieviesīsim celma nodokli meža izstrādei, kura ieņēmumi pilnībā nonāks to pašvaldību budžetā, kurās mežs atrodas un tiks izmantoti tikai vietējo ceļu uzturēšanai un remontam.
nesakritiba: ""
piezimes: "Ieņēmumu novirzīšana pašvaldībām un izlietojums vietējiem ceļiem nav dalīts — tās ir paša nodokļa iezīmes; ja nodoklis ieviests bez ieņēmumu piesaistes — daļēja izpilde. 2. nodaļas mežsaimniecības sadaļā un CVK „MEŽI” celma nodoklis nav minēts. Atbildīgā: nodokļa ieviešana — FM; ZM (meži) un VARAM (pašvaldību budžeti) papildu."
jautajums: ""
