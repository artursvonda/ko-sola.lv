piezimes: "CVK 5. punkts apvienots ar paplašinātās sadaļas pirmo punktu — birojs ir paplašinātās konkretizētais pārvaldības modelis. Pārējie sadaļas punkti (kolektīvu vadītāju atalgojums, aprīkojums, grafiks, ēdināšana) — atsevišķi Solījumi tikai ar paplašināto avotu (cits iznākums). „lai …” — mērķi, nav dalīti. Ekstraktors nav pārbaudījis, vai šāds birojs jau pastāv. Atbildīgā: KM."
