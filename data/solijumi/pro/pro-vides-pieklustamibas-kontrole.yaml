nesakritiba: ""
piezimes: "CVK DEMOKRĀTIJA UN CILVĒKTIESĪBAS 6. punkts pievienots tās izpildē: sadalīts pēc paplašinātās programmas (vide — šis; darba tirgus — pro-uznemeju-motivacija-nodarbinat-cilvekus-ar-invaliditati), CVK citāts abos (§4). Vērtēšanas avots — CVK (bez mēra). Nav dalīts: abas paplašinātās daļas bez mēra (Nepārbaudāmas). Atbildīgā: invaliditātes politika — LM; būvju piekļūstamības prasības un kontrole — EM (neesmu drošs)."
