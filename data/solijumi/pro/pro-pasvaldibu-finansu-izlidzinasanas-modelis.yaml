    citats: Veidosim taisnīgu un stabilu pašvaldību finanšu izlīdzināšanas modeli.
nesakritiba: ""
piezimes: "Pārbaudāms (robežgadījums): vērtē, vai pieņemts jauns vai būtiski grozīts pašvaldību finanšu izlīdzināšanas modelis (regulējums); „taisnīgu un stabilu” nav mērāms. Alternatīva — Nepārbaudāms. Paplašinātās sadaļas „Finanšu pašpietiekamība un taisnīga naudas sadale reģioniem” punkti (IIN un UIN sadale, celma nodoklis, NĪN) maina pašvaldību ieņēmumu avotus, nevis izlīdzināšanu — atsevišķi Solījumi; sadaļas ievads („taisnīgāks un prognozējamāks finansējuma modelis”) — pamatojums. Atbildīgā: VARAM, FM papildu (nav pārbaudīts, kura ministrija atbild par izlīdzināšanas regulējumu)."
jautajums: ""
