id: pro-slimnicu-tikls-pec-akuto-stavoklu-celiem
saraksts: pro
nosaukums: Slimnīcu tīkls, balstīts uz akūto stāvokļu pacientu ceļiem
parbaudams: true
temas:
  galvena: veseliba
  papildu: []
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Balstīsim slimnīcu tīklu uz konkrētiem pacientu pieredzes ceļiem, rezultātiem un gatavību krīzēm, stiprinot civilmilitāro sadarbību.
  - veids: paplasinata
    vieta: 4. Veselīga un ilgi dzīvojoša sabiedrība › Pārdomāta rindu pārvaldība un slimnīcu tīkls
    citats: Katram akūtajam stāvoklim (insults, infarkts, traumas) skaidri definēsim ceļu no izsaukuma brīža līdz rehabilitācijai. Iedzīvotājiem un mediķiem nodrošināsim skaidrību, kur konkrētā situācijā jānogādā pacients un kādi pakalpojumi šajā slimnīcā tiek nodrošināti.
nesakritiba: CVK sola balstīt "slimnīcu tīklu uz konkrētiem pacientu pieredzes ceļiem, rezultātiem un gatavību krīzēm"; paplašinātā programma — "katram akūtajam stāvoklim (insults, infarkts, traumas)" definēt ceļu un skaidrību, "kādi pakalpojumi šajā slimnīcā tiek nodrošināti".
piezimes: 'CVK 6. punkts sadalīts pēc paplašinātās programmas (§4): slimnīcu tīkls un pacientu ceļi (šis); "-ot" daļa "stiprinot civilmilitāro sadarbību" — pro-civilmilitaras-medicinas-gatavibas-plans un pro-civilmilitaras-apmacibas-un-traumu-standarti. Vērtē pēc paplašinātās programmas mēra (akūto stāvokļu ceļi, slimnīcu uzdevumi).'
jautajums: ""
