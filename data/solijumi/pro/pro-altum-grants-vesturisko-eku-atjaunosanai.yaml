nesakritiba: Paplašinātā papildus CVK paredz „pašvaldību atbildību ilgtermiņa attīstības programmas izstrādē”.
piezimes: "„līdztekus paredzot pašvaldību atbildību …” nav dalīts: avotā nav skaidrs, kādas programmas un vai tā ir granta nosacījums; vērtē pēc CVK (granta ieviešana). Atbildīgā: kultūras mantojums — KM; ALTUM programmas — EM papildu (ekstraktors nav pārbaudījis, kura ministrija veido ALTUM grantu programmas)."
