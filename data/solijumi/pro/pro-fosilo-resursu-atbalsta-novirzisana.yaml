id: pro-fosilo-resursu-atbalsta-novirzisana
saraksts: pro
nosaukums: Fosilo resursu atbalsts novirzīts elektrības cenām un tīrākai enerģijai
parbaudams: true
temas:
  galvena: energetika
  papildu:
    - vide-un-klimats
    - nodokli-un-budzets
iestades:
  galvena: fm
  papildu:
    - kem
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Taisnīgi vides un klimata nodokļi
    citats: Fosilajiem resursiem paredzēto atbalstu novirzīsim elektrības cenu mazināšanai un pārejai uz tīrāku enerģiju.
nesakritiba: ""
piezimes: "Viens Solījums: divi izlietojuma mērķi zem viena darbības vārda (§1). Robežgadījums Pārbaudāms: konkrēts objekts (fosilajiem resursiem paredzētais atbalsts) — vērtē, vai šāds atbalsts samazināts un līdzekļi novirzīti norādītajiem mērķiem. Avotā nav nosaukts, kurš atbalsts domāts; ekstraktors nezina, kāds atbalsts fosilajiem resursiem (piem., nodokļu atvieglojumi) pašlaik pastāv. CVK atbilstoša teikuma nav. Iestāde: atbalsts budžeta vai nodokļu atvieglojumu veidā — FM; enerģētikas mērķi — KEM (nav pārbaudīts)."
jautajums: ""
