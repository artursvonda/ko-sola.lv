piezimes: "Pārbaudāms (robežgadījums): vērtē, vai Vision Zero princips (mērķis — nulle bojāgājušo un smagi ievainoto) noteikts ceļu satiksmes drošības politikā vai plānošanas dokumentā. „virzoties uz nulli” — ilgtermiņa mērķis, nav atsevišķs Solījums. Ekstraktors nezina, vai princips jau iekļauts spēkā esošajos dokumentos. Atbildīgā: SM (satiksmes drošības politika), IeM papildu (satiksmes uzraudzība) — nav pārbaudīts."
