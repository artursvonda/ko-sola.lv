piezimes: 'CVK 6. punkta "-ot" daļa (sk. pro-slimnicu-tikls-pec-akuto-stavoklu-celiem). Nav dalīts: uzskaitījums zem viena darbības vārda (§1); alternatīva — divi Solījumi. 6. nodaļas valsts mēroga kopīgās mācības krīžu scenārijos — plašākas, cits iznākums, atstātas tās nodaļai. Atbildīgā: VM, AM papildu (nav pārbaudīts).'
