    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Diasporas politika"
    citats: "Uzlabosim digitālo pakalpojumu pieejamību, tostarp radot vienotu, funkcionālu digitālu vidi, kas kalpo kā centrāls piekļuves un koordinācijas punkts diasporas investīcijām, kompetenču piesaistei un mentoringam."
nesakritiba: ""
piezimes: "Galvenā teikuma „uzlabosim pieejamību” — vispārīgs; Solījums ir „-ot” daļa (§1), citēts viss teikums. Pārbaudāms: vienotas digitālas vides izveide. Atbildīgā: ĀM (diaspora), VARAM papildu (digitālie pakalpojumi) — nav pārbaudīts."
