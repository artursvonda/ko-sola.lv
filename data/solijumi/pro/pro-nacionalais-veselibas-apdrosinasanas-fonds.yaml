id: pro-nacionalais-veselibas-apdrosinasanas-fonds
saraksts: pro
nosaukums: NVD pārveide par neatkarīgu Nacionālo veselības apdrošināšanas fondu
parbaudams: true
temas:
  galvena: veseliba
  papildu:
    - valsts-parvalde
iestades:
  galvena: vm
  papildu:
    - fm
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Pārveidosim NVD par neatkarīgu, rezultātos balstītu pakalpojumu iepircēju.
  - veids: paplasinata
    vieta: 4. Veselīga un ilgi dzīvojoša sabiedrība › Ilgtspējīga un elastīga veselības finansējuma pārvaldība
    citats: Izveidosim Nacionālo veselības apdrošināšanas fondu kā politiski neatkarīgu atvasinātu publisku personu ar profesionālu padomi.
nesakritiba: CVK sola pārveidot NVD par "neatkarīgu, rezultātos balstītu pakalpojumu iepircēju"; paplašinātā programma — izveidot "Nacionālo veselības apdrošināšanas fondu kā politiski neatkarīgu atvasinātu publisku personu ar profesionālu padomi", bez "rezultātos balstīta" iepirkuma.
piezimes: "Viens Solījums: paplašinātās sadaļas pamatojums runā par NVD kā tiešās pārvaldes iestādes ierobežojumiem — fonds ir NVD neatkarības forma. Vērtē pēc paplašinātās programmas mēra (atvasināta publiska persona ar profesionālu padomi). Otrais teikums (lēmumi nodalīti no politiskā cikla) — skaidrojums, nav citēts. Esošais pro-veselibas-budzeta-formula-likuma atstāja fondu šai nodaļai. Atbildīgā: VM, FM papildu (nav pārbaudīts)."
jautajums: ""
