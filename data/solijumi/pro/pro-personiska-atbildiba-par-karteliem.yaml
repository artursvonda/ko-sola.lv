id: pro-personiska-atbildiba-par-karteliem
saraksts: pro
nosaukums: Personiska atbildība patiesā labuma guvējiem un valdei par karteļiem
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu:
    - iekseja-drosiba-un-tiesiskums
iestades:
  galvena: em
  papildu:
    - tm
avoti:
  - veids: paplasinata
    vieta: 1. Ekonomiskās labklājības un izaugsmes programma › Godīgi, ilgtspējīgi un patiesi izdevīgi publiskie iepirkumi
    citats: Ieviesīsim personisku atbildību uzņēmumu patiesā labuma guvējiem un valdes locekļiem par dalību karteļos, lai no soda nevarētu izvairīties, likvidējot vai pārsaucot uzņēmumu.
nesakritiba: ""
piezimes: "Atbildīgā: konkurences tiesības — EM; ja kriminālatbildība — TM (papildu)."
jautajums: ""
statusa_mainas:
  - datums: 2026-10-07
    statuss: daleji-izpildits
    notikumi: [2026-10-07-kriminallikums-aizliegta-vienosanas-iepirkuma]
    pamatojums: >-
      Izsludināts likums (spēkā no 15.10.2026) ievieš personisku kriminālatbildību par aizliegtu
      vienošanos iepirkumā (Krimināllikuma 211.¹ pants) — daļa no solītā iznākuma: tas aptver tikai
      karteļus liela apmēra vai publiskos iepirkumos, ne dalību karteļos kopumā (vertesana.md: Daļēji izpildīts).
