    citats: Nodrošināsim, lai radošo savienību biedru statuss tiktu iekļauts kā darba stāžs sociālo atbalsta instrumentu aprēķinā.
nesakritiba: ""
piezimes: "Avotā nav norādīts, kuri sociālā atbalsta instrumenti. Nav apvienots ar 3. nodaļas pensiju punktu („atzīstot dažādās nodarbinātību formu ietvarā paveikto”) — cits iznākums. Atbildīgā: sociālā apdrošināšana un atbalsts — LM, KM papildu (radošo personu statuss; nav pārbaudīts)."
