avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Baltijas jūras reģiona sadarbība"
    citats: "Uzņemsimies iniciatīvu padziļināt NB8+ sadarbību civilajā aizsardzībā, krīžu gatavībā, piegāžu drošībā, kritiskās infrastruktūras aizsardzībā un sabiedrības noturībā stiprinot aizsardzības koordināciju un kopīgas mācības ar Baltijas valstīm, Ziemeļvalstīm, Poliju un Lielbritāniju."
nesakritiba: ""
piezimes: "Nepārbaudāms: „uzņemsimies iniciatīvu padziļināt sadarbību” bez konkrēta iznākuma; jomu uzskaitījums zem viena darbības vārda nav dalīts (§1). Tēma — civilā aizsardzība (§6). Atbildīgā: IeM (civilā aizsardzība), AM un ĀM papildu — nav pārbaudīts."
