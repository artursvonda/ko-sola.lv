avoti:
  - veids: cvk
    vieta: EKONOMIKA UN ENERGONEATKARĪBA
    citats: Veidosim valsts atbalsta programmas, mērķtiecīgi atbalstot uzņēmumus, kuri spēj uzrādīt augstu pievienoto vērtību, būtisku eksporta intensitāti apgrozījumā un nozīmīgus ieguldījumus pētniecībā un attīstībā.
  - veids: paplasinata
    vieta: 1. Ekonomiskās labklājības un izaugsmes programma › Ražošanas attīstība, inovācijas un eksports
    citats: Novirzīsim valsts atbalsta programmas (grantus, aizdevumus) eksportspējīgiem uzņēmumiem, kas uzrāda augstu pievienoto vērtību, atbilst ES sociālās atbildības un ilgtspējas standartiem un veic nozīmīgus ieguldījumus pētniecībā un attīstībā.
nesakritiba: Paplašinātā programma papildus prasa, lai uzņēmumi "atbilst ES sociālās atbildības un ilgtspējas standartiem"; CVK šāda nosacījuma nav.
