id: pro-drn-likmes-atbilstosi-zaudejumiem
saraksts: pro
nosaukums: DRN likmes vismaz radīto emisiju un vides zaudējumu apmērā
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: varam
  papildu:
    - fm
avoti:
  - veids: cvk
    vieta: KLIMATS UN VIDE
    citats: Ieviesīsim taisnīgus dabas resursu un klimata nodokļus uzņēmumiem, kas piesārņo vidi, ieņēmumus novirzot vides atjaunošanai.
  - veids: paplasinata
    vieta: 14. Taisnīga un atbildīga nodokļu sistēma › Dabas resursu nodoklis, kuru maksā piesārņotājs
    citats: Atbalstīsim principu "piesārņotājs maksā" – piesārņojošās darbības izmaksas netiek segtas no valsts budžeta, bet gan no tiem, kas rada piesārņojumu.
  - veids: paplasinata
    vieta: 14. Taisnīga un atbildīga nodokļu sistēma › Dabas resursu nodoklis, kuru maksā piesārņotājs
    citats: Dabas resursu nodokļa (DRN) likmēm jābūt vismaz radīto emisiju un vides zaudējumu apmērā, tās sasaistot ar Eiropas Savienības emisiju kvotu cenu līmeni.
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Taisnīgi vides un klimata nodokļi
    citats: Noteiksim dabas resursu nodokļus atbilstoši patiesajām izmaksām, ko piesārņojums rada sabiedrībai.
nesakritiba: CVK sola "taisnīgus dabas resursu un klimata nodokļus uzņēmumiem, kas piesārņo vidi" bez mēra; 14. nodaļa — DRN likmes "vismaz radīto emisiju un vides zaudējumu apmērā", sasaistot ar ES emisiju kvotu cenu; 2. nodaļa — "atbilstoši patiesajām izmaksām".
piezimes: 'CVK citāts no nodaļas KLIMATS UN VIDE: punkts paplašinātajā programmā ir 14. nodaļā (→ šī izpilde); 2. nodaļas punkts pievienots pēc §0.3. CVK teikums sadalīts pēc paplašinātās programmas (likmes; ieņēmumu izlietojums). Princips "piesārņotājs maksā" — tā paša iznākuma vispārīgs formulējums, pievienots kā citāts. Vērtē pēc 14. nodaļas mēra. Atbildīgā: Dabas resursu nodokļa likums — VARAM (neesmu pilnīgi drošs; FM papildu).'
jautajums: ""
