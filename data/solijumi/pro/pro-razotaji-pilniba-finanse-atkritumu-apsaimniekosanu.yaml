id: pro-razotaji-pilniba-finanse-atkritumu-apsaimniekosanu
saraksts: pro
nosaukums: Ražotāji pilnā apjomā finansē savu produktu atkritumu apsaimniekošanu
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ražotāju atbildība un atkritumu apsaimniekošana
    citats: Nodrošināsim, ka ražotāji pilnā apjomā finansē savu produktu radīto atkritumu savākšanu, pārstrādi un atkritumu mazināšanas pasākumus.
nesakritiba: ""
piezimes: "Uzskaitījums (savākšana, pārstrāde, mazināšanas pasākumi) zem viena darbības vārda nav dalīts (§1). Vērtē, vai ražotāju atbildības regulējums paredz pilnu izmaksu segšanu. CVK atbilstoša teikuma nav. Iestāde: VARAM (nav pārbaudīts; iespējams, KEM)."
