piezimes: "„Projekta” — Rail Baltica (sadaļas virsraksts). „-ot” daļa apraksta veidu — nav dalīta. Pārbaudāms: vērtē, vai apstiprināts (piem., valdības lēmums) skaidrs ilgtermiņa finansēšanas modelis. Nav apvienots ar pro-es-budzets-kohezija-cef-rail-baltica: tur — Latvijas pozīcija par ES 2028.–2034. budžetu (Kohēzija, CEF), šeit — paša projekta nacionālais finansēšanas modelis (cits iznākums). Atbildīgā: SM, FM papildu (nav pārbaudīts)."
