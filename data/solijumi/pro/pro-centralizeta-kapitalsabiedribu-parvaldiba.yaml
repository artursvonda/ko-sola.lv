piezimes: 'CVK teikums nav dalīts: "-ot" daļas apraksta mērķi (§1). CVK avotā pirms punkta ir atstarpe — citāts beidzas pirms tās. Vērtē pēc paplašinātās programmas mēra (viena kapitāla daļu turētāja institūcija). Tēma: valsts kapitālsabiedrības — ekonomika-un-darbs (data/temas.yaml). Atbildīgā: valsts kapitālsabiedrību pārvaldības koordinācija — VK (neesmu drošs; nav pārbaudīts).'
