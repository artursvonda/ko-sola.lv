avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Klimatneitralitāte, atjaunīgā enerģija un ēku renovācija
    citats: Mūsu vadībā valsts uzņemsies lielāku lomu ēku renovācijā
nesakritiba: ""
piezimes: 'Teikums dalīts (§1): valsts loma renovācijā un papildu atbalsts ģimenēm ar bērniem un cilvēkiem ar zemiem ienākumiem (pro-renovacijas-atbalsts-gimenem-zemu-ienakumu) — divi darbības vārdi, atšķirīgi iznākumi. Nepārbaudāms: "lielāku lomu" bez mēra vai instrumenta. Nav apvienots ar pro-majoklu-buvniecibas-un-renovacijas-programmas un pro-renovacijas-projektu-vaditaji-majam (konkrētāki, citi iznākumi). Iestāde: ēku renovācija — EM, kā esošajiem renovācijas Solījumiem (nav pārbaudīts).'
jautajums: ""
