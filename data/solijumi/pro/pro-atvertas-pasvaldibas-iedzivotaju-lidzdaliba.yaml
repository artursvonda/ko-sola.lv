  papildu: []
avoti:
  - veids: cvk
    vieta: REĢIONI
    citats: Veidosim atvērtas un pieejamas pašvaldības, stiprinot iedzīvotāju līdzdalību lēmumu pieņemšanā.
nesakritiba: ""
piezimes: "Nepārbaudāms: gan „veidosim atvērtas un pieejamas pašvaldības”, gan „-ot” daļa („stiprinot iedzīvotāju līdzdalību”) — virziena deklarācija bez konkrēta objekta vai mēra; nav dalīts. Paplašinātās sadaļas „Iedzīvotāju iesaiste pašvaldības attīstības veicināšanā” punkti (balsstiesības no 16 gadiem, pilsoniskā izglītība, kopienu loma reģionālajā plānošanā, finansējums pilsoniskajām iniciatīvām) — konkrētāki, citi iznākumi; atsevišķi Solījumi tikai ar paplašināto avotu, CVK citāts tiem nav pievienots. Atbildīgā: VARAM (pašvaldību darbības regulējums; nav pārbaudīts)."
jautajums: ""
