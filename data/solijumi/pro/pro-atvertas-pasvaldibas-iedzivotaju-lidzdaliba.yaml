id: pro-atvertas-pasvaldibas-iedzivotaju-lidzdaliba
saraksts: pro
nosaukums: Atvērtas pašvaldības un iedzīvotāju līdzdalība lēmumu pieņemšanā
parbaudams: false
temas:
