id: pro-veselibas-dati-petniecibai
saraksts: pro
nosaukums: Valsts veselības dati pieejami pētniecībai un komercrisinājumu izstrādei
parbaudams: true
temas:
  galvena: veseliba
  papildu:
    - izglitiba-un-zinatne
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Ieviesīsim digitālās veselības ekosistēmu ar datu standartiem, reāllaika reģistriem, drošu MI un anonimizētiem datiem pētniecībai.
  - veids: paplasinata
    vieta: 4. Veselīga un ilgi dzīvojoša sabiedrība › Vienota digitālās veselības vide un datos balstīta attīstība
    citats: Valstī uzkrātie veselības dati kalpos ne tikai tūlītējām pacientu ārstēšanas vajadzībām, bet arī būs pieejami pētniecībai un komercializējamo risinājumu izstrādei.
nesakritiba: CVK sola "anonimizētiem datiem pētniecībai"; paplašinātā programma — dati "būs pieejami pētniecībai un komercializējamo risinājumu izstrādei" (bez "anonimizētiem").
piezimes: "CVK 4. punkta daļa (sk. pro-digitala-veseliba-valsts-vadiba-un-mi). Tuvs pro-veselibas-datu-sekundaras-izmantosanas-likums (likums ir instruments) — atstāts atsevišķi: likumu var pieņemt, bet piekļuve datiem var nenotikt. Vērtē pēc CVK (anonimizēti dati pētniecībai)."
jautajums: ""
