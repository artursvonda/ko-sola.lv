id: pro-teritorija-dabai-draudziga-apsaimniekosana-30
saraksts: pro
nosaukums: Vismaz 30% Latvijas teritorijas apsaimniekoti dabai draudzīgā veidā
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu:
    - zm
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Daba un bioloģiskā daudzveidība
    citats: Nodrošināsim, ka vismaz 10% Latvijas teritorijas ir stingri aizsargāti un vismaz 30% tiek apsaimniekoti dabai draudzīgā veidā.
nesakritiba: ""
piezimes: 'Teikuma 30% daļa; citēts viss teikums, jo daļai nav sava darbības vārda (§3). "Dabai draudzīgs veids" avotā nav definēts; ekstraktors nezina pašreizējo īpatsvaru. Nav apvienots ar pro-mezu-dabai-draudziga-apsaimniekosana-35 (cits rādītājs). Iestāde: dabas aizsardzība — VARAM; lauksaimniecības un meža zeme — ZM (nav pārbaudīts).'
jautajums: ""
