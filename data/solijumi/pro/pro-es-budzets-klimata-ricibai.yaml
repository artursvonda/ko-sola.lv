avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas:"
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Klimata rīcība un ES globālās līderības nostiprināšana emisiju samazināšanas, zaļo tehnoloģiju un ilgtspējas jomā. Klimata investīcijas aptver gan enerģētisko neatkarību un aprites ekonomiku, gan klimata rīcību, noturību un pielāgošanos, ar sociāli taisnīgiem instrumentiem mājsaimniecībām un mazajiem uzņēmumiem."
nesakritiba: ""
piezimes: "Punkts „Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas: …” sadalīts pa apakšpunktiem — katram cits iznākums un ES līmeņa atbildīgā nozares ministrija (§1, §6a); ievadteikums citēts katrā. Nepārbaudāms: virziena deklarācija bez konkrēta iznākuma vai mēra."
