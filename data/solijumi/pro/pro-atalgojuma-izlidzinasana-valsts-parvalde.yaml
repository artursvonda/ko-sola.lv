avoti:
  - veids: paplasinata
    vieta: 13. Valsts pārvalde, kas sasniedz mērķus › Taisnīga atalgojuma sistēma valsts pārvaldē
    citats: "Atalgojuma sistēmas izmaiņām jāsasniedz sekojošie mērķi: jāsamazina nevienlīdzība starp resoriem un iestādēm. jānodrošina līdzīgs atalgojums starp salīdzināmām amata pozīcijām"
nesakritiba: ""
piezimes: "Robežgadījums pārbaudāmībai: bez mēra, bet konkrēts objekts — atlīdzības sistēmas izmaiņas; vērtē, vai tās izlīdzina atalgojumu salīdzināmiem amatiem starp iestādēm. Nevienlīdzības mazināšana un līdzīgs atalgojums — viens iznākums; mainīgā atalgojuma daļa — atsevišķs Solījums. Atbildīgā: valsts pārvaldes atlīdzības politika — VK, budžets — FM (nav pārbaudīts)."
jautajums: ""
