id: pro-es-budzets-aizsardzibai-un-militarajai-mobilitatei
saraksts: pro
nosaukums: "ES 2028.–2034. budžetā finansējums aizsardzībai un militārajai mobilitātei"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu:
    - arpolitika
iestades:
  galvena: am
  papildu:
    - fm
avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas:"
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Eiropas pašaizsardzības spēju stiprināšana un ar to saistīto pašmāju nozaru attīstība. Tas nozīmē atbalstu militārajai mobilitātei un divējādā pielietojuma infrastruktūrai, kā arī mērķtiecīgu projektu finansējumu R&D, prototipēšanā un ražošanā, t. sk. aizsardzības inovācijās;"
nesakritiba: ""
piezimes: "Punkts „Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas: …” sadalīts pa apakšpunktiem — katram cits iznākums un ES līmeņa atbildīgā nozares ministrija (§1, §6a); ievadteikums citēts katrā. Apakšpunkts zem „pilnvērtīgi kalpos kā pamats jaunai, modernai industriālajai politikai …”. Pārbaudāms (robežgadījums): vērtē Latvijas pozīciju un vai pieņemtajā DFS ir finansējums militārajai mobilitātei, divējāda pielietojuma infrastruktūrai un aizsardzības R&D. Atbildīgā: AM; DFS sarunas kopumā — FM (nav pārbaudīts)."
jautajums: ""
