avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › ES paplašināšanās un konsekvents Ukrainas un Moldovas ceļš uz Eiropas Savienību"
    citats: "Stingri atbalstīsim Ukrainas un Moldovas pilntiesīgu dalību Eiropas Savienībā – nevis deklaratīvi, bet izvirzot konkrētu ceļakarti ar skaidri noteiktiem uzņemšanas termiņiem."
nesakritiba: ""
piezimes: "Galvenā teikuma „atbalstīsim dalību” ir deklarācija; Solījums ir „-ot” daļa ar savu iznākumu (§1). Pārbaudāms: vērtē, vai Latvija izvirzījusi vai atbalstījusi ceļakarti ar termiņiem. Punkta beigu fragments „Ukrainas un Moldovas uzņemšanā.” — acīmredzot redakcijas kļūda avotā, nav citēts. 5. nodaļas ievada „jāpalīdz uzņemt arī Ukrainu” — ievads."
jautajums: ""
