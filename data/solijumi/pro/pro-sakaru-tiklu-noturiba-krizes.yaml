avoti:
  - veids: paplasinata
    vieta: 10. Transports, savienojamība un droša mobilitāte › Latvija bez elektronisko sakaru "baltajām zonām"
    citats: Stiprināsim elektronisko sakaru tīklu noturību un darbības nepārtrauktību krīzes un militāra apdraudējuma situācijās, nodrošinot savienojamību iedzīvotājiem, operatīvajiem dienestiem, valsts institūcijām un aizsardzības vajadzībām.
nesakritiba: ""
piezimes: "Nepārbaudāms: „stiprināsim noturību” bez konkrēta pasākuma vai prasības. „-ot” daļa uzskaita labuma guvējus — nav dalīta. Tēma — civilā aizsardzība un krīžu gatavība (§6), aizsardzība papildu. Atbildīgā: elektroniskie sakari — SM; operatīvie dienesti — IeM, aizsardzības vajadzības — AM papildu (nav pārbaudīts)."
jautajums: ""
