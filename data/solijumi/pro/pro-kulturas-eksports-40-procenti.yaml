id: pro-kulturas-eksports-40-procenti
saraksts: pro
nosaukums: "Kultūras un radošā sektora eksporta sistēma: starptautiskie ieņēmumi +40%"
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - ekonomika-un-darbs
    - arpolitika
iestades:
  galvena: km
  papildu:
    - em
avoti:
  - veids: cvk
    vieta: KULTŪRA, KAS STIPRINA DEMOKRĀTIJU
    citats: Attīstīsim kultūru un radošās industrijas kā stratēģisku instrumentu ārpolitikas un eksporta mērķu sasniegšanai.
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju › Kultūras un radošo industriju starptautiskās redzamības stiprināšana
    citats: Mūsu mērķis trīs gadu laikā ir izveidot skaidru, datos balstītu kultūras un radošā sektora eksporta sistēmu, kas palielina starptautiskos ieņēmumus vismaz par 40%
nesakritiba: CVK — „attīstīsim … kā stratēģisku instrumentu ārpolitikas un eksporta mērķu sasniegšanai” bez mēra; paplašinātā — „mērķis” izveidot eksporta sistēmu, kas „trīs gadu laikā” palielina starptautiskos ieņēmumus „vismaz par 40%”, bez ārpolitikas mērķiem.
piezimes: "Paplašinātās citāts ir sadaļas ievadā („Mūsu mērķis …”), nevis punktā; izmantots kā CVK 4. punkta mērs (§4: CVK bez mēra, vērtē pēc mēra citā avotā). Bez šī mēra CVK punkts būtu Nepārbaudāms. Avotā nav norādīts, no kura brīža skaita „trīs gadus” un pret kuru bāzes gadu — 40%. Atbildīgā: KM, EM papildu (eksports; nav pārbaudīts)."
jautajums: ""
