id: pro-lvm-klimata-biodaudzveidibas-merki
saraksts: pro
nosaukums: Klimata un bioloģiskās daudzveidības mērķi AS "Latvijas valsts meži"
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: zm
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ilgtspējīga mežsaimniecība un AS "Latvijas valsts meži" pārvaldība sabiedrības interesēs
    citats: Uzlabosim AS "Latvijas valsts meži" pārvaldību, tajā iesaistot arī KEM un VARAM un nosakot uzņēmumam skaidrus klimata un bioloģiskās daudzveidības mērķus.
nesakritiba: ""
piezimes: '"-ot" daļa ar savu iznākumu (§1), citēts viss teikums; sk. pro-lvm-parvaldiba-ar-kem-un-varam. Pārbaudāms: vērtē, vai LVM noteikti klimata un bioloģiskās daudzveidības mērķi (piem., akcionāra noteiktajos vidēja termiņa mērķos). "Skaidrus" nav definēts; ekstraktors nezina, vai šādi mērķi jau ir noteikti. Iestāde: LVM kapitāla daļu turētājs — ZM (nav pārbaudīts).'
jautajums: ""
