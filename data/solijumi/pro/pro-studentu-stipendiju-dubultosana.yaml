id: pro-studentu-stipendiju-dubultosana
saraksts: pro
nosaukums: Studentu stipendiju palielināšana — mācību un sociālo stipendiju dubultošana
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: []
iestades:
  galvena: izm
  papildu: []
avoti:
  - veids: cvk
    vieta: IZGLĪTĪBA UN ZINĀTNE
    citats: Palielināsim "Studētgods" stipendijas, finansējumu zinātnei un augstākajai izglītībai.
  - veids: paplasinata
    vieta: 8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Stipendijas, studiju kredīta atmaksa, elastīgāks studenta ceļš un talantu atbalsts
    citats: Dubultosim gan mācību, gan sociālās stipendijas.
nesakritiba: CVK sola „Palielināsim "Studētgods" stipendijas” bez mēra; paplašinātā programma — „Dubultosim gan mācību, gan sociālās stipendijas”.
piezimes: "CVK 7. punkts dalīts (§1): stipendijas (šis) un finansējums zinātnei un augstākajai izglītībai (pro-zinatnes-augstakas-izglitibas-ieguldijumi); daļām nav sava darbības vārda — citēts viss teikums (§3). Ekstraktors nezina, ko apzīmē „Studētgods” (avotos nav skaidrots); pieņemts, ka tās ir studentu stipendijas, ko paplašinātā programma sola dubultot. Ja „Studētgods” ir cita programma (piem., tā paša punkta izvēles stipendija pamatvajadzībām, pro-izveles-stipendija-pamatvajadzibam), CVK citāts jāpārsaista. Vērtē pēc mēra „dubultosim” (§4)."
jautajums: ""
