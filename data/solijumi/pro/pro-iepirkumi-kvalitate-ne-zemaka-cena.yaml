    vieta: PRETKORUPCIJA UN VALSTS PĀRVALDE
    citats: Padarīsim iepirkumus atklātus, ilgtspējīgus un balstītus kvalitātē, nevis zemākajā cenā.
nesakritiba: ""
piezimes: 'Nav dalīts: uzskaitījums zem viena darbības vārda (§1). Nepārbaudāms: virziens bez konkrēta mēra vai normatīva. Paplašinātās programmas 13. nodaļā iepirkumu nav; 1. nodaļas sadaļas "Godīgi, ilgtspējīgi un patiesi izdevīgi publiskie iepirkumi" punkti (pro-iepirkumu-minimalas-kvalitates-prasibas, pro-iepirkumu-dzivescikla-izmaksas, pro-iub-kvalitates-kriteriju-datubaze u. c.) ir konkrētāki, citi iznākumi (§4) — nav apvienoti. 2. nodaļas ievada teikums "Ilgtspējīgu iepirkumu ievieš visas nozares." — ievads, nav pievienots. Atbildīgā: publisko iepirkumu politika — FM, kā esošajiem iepirkumu Solījumiem.'
jautajums: ""
