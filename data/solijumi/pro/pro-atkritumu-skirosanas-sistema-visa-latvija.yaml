id: pro-atkritumu-skirosanas-sistema-visa-latvija
saraksts: pro
nosaukums: Vienota atkritumu šķirošanas sistēma visā Latvijā
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: KLIMATS UN VIDE
    citats: Ieviesīsim visā Latvijā plašu, vienotu un saprotamu atkritumu šķirošanas sistēmu.
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ražotāju atbildība un atkritumu apsaimniekošana
    citats: Visā Latvijā ieviesīsim vienotu un saprotamu atkritumu šķirošanas sistēmu, kas aptvers visas nozīmīgākās atkritumu plūsmas.
nesakritiba: CVK sola "plašu" sistēmu bez mēra; paplašinātā programma — sistēmu, "kas aptvers visas nozīmīgākās atkritumu plūsmas" (vērtē pēc šī mēra, §4).
piezimes: "Robežgadījums Pārbaudāms: konkrēts iznākums — vienota šķirošanas sistēma visā valstī; vērtē, vai ieviesti vienoti šķirošanas noteikumi/sistēma visām pašvaldībām. Ekstraktors nezina, cik vienota sistēma ir šobrīd. Iestāde: atkritumu apsaimniekošanas politika — VARAM (nav pārbaudīts; iespējams, KEM)."
