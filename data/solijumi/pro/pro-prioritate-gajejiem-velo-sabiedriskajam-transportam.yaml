id: pro-prioritate-gajejiem-velo-sabiedriskajam-transportam
saraksts: pro
nosaukums: Prioritāte gājējiem, velobraucējiem, sabiedriskajam transportam un stāvparkiem
parbaudams: false
temas:
  galvena: transports
  papildu:
    - vide-un-klimats
iestades:
  galvena: sm
  papildu:
    - varam
avoti:
  - veids: cvk
    vieta: KLIMATS UN VIDE
    citats: Turpināsim attīstīt drošu un modernu transporta infrastruktūru, prioritarizējot gājējus un velobraucējus, sabiedrisko transportu un stāvparkus.
  - veids: paplasinata
    vieta: 10. Transports, savienojamība un droša mobilitāte › Droši un kvalitatīvi ceļi visā Latvijā
    citats: Attīstīsim drošu gājēju, velo un mikromobilitātes infrastruktūru
nesakritiba: CVK sola prioritāti gājējiem un velobraucējiem, sabiedriskajam transportam un stāvparkiem; 10. nodaļa — tikai "drošu gājēju, velo un mikromobilitātes infrastruktūru".
piezimes: 'Galvenajā teikumā "Turpināsim attīstīt drošu un modernu transporta infrastruktūru" — vispārīgs darbības vārds; Solījums ir "-ot" daļa (§1), citēts viss teikums. Uzskaitījums zem viena darbības vārda nav dalīts. Nepārbaudāms: "prioritarizējot" bez mēra (finansējuma daļa, projekti). 2. nodaļā atbilstoša punkta nav; 10. nodaļas punkts (nodaļa bez CVK atbilsmes) pievienots pēc §0.3 kā tas pats iznākums (gājēju un velo infrastruktūras attīstība); tā paša punkta "veidosim mobilitātes punktus" — cits iznākums: pro-mobilitates-punkti. Iestāde: transporta politika — SM; gājēju un velo infrastruktūra lielākoties pašvaldību kompetencē — VARAM papildu (nav pārbaudīts).'
jautajums: ""
