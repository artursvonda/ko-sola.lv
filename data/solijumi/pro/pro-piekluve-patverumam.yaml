id: pro-piekluve-patverumam
saraksts: pro
nosaukums: "Piekļuves patvērumam nodrošināšana"
parbaudams: true
temas:
  galvena: migracija-un-diaspora
  papildu:
    - demokratija-un-cilvektiesibas
iestades:
  galvena: iem
  papildu: []
avoti:
  - veids: cvk
    vieta: "DROŠĪBA UN ĀRPOLITIKA"
    citats: "Valsts robežai jābūt tehnoloģiski un fiziski drošai, un tās aizsardzībai – tiesiskai un demokrātiskai, lai Latvija spētu reaģēt uz hibrīdapdraudējumiem, nezaudējot cilvēktiesībās balstītu pieeju."
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Starptautiskās normās balstīta ārpolitika un cilvēktiesības"
    citats: "Vērsīsimies pret cilvēktirdziniecību un organizēto noziedzību, kā arī migrācijas instrumentalizāciju, vienlaikus nodrošinot piekļuvi patvērumam"
nesakritiba: "CVK sola tikai robežas aizsardzību „nezaudējot cilvēktiesībās balstītu pieeju”; paplašinātā programma — konkrēti „nodrošinot piekļuvi patvērumam”."
piezimes: "CVK 5. punkts sadalīts pēc paplašinātās programmas (§4): robežas infrastruktūra, piekļuve patvērumam (šis), piekļuve robežzonai. Pārbaudāms (robežgadījums): vērtē, vai patvēruma pieteikumu iesniegšana ir iespējama (t. sk. uz robežas); ekstraktors nepārbaudīja pašreizējo kārtību. Vērtē pēc paplašinātās programmas mēra (§4)."
jautajums: ""
