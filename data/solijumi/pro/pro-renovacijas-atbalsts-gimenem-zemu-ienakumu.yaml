id: pro-renovacijas-atbalsts-gimenem-zemu-ienakumu
saraksts: pro
nosaukums: Papildu ēku renovācijas atbalsts ģimenēm ar bērniem un zemu ienākumu cilvēkiem
parbaudams: true
temas:
  galvena: majokli
  papildu:
    - socialais-atbalsts-un-pensijas
    - gimenes-un-demografija
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Klimatneitralitāte, atjaunīgā enerģija un ēku renovācija
    citats: Mūsu vadībā valsts uzņemsies lielāku lomu ēku renovācijā un nodrošināsim papildu atbalstu ģimenēm ar bērniem un cilvēkiem ar zemiem ienākumiem.
nesakritiba: ""
piezimes: 'Atdalīts no "lielākas valsts lomas" (savs darbības vārds, §1); citēts viss teikums, jo renovācijas konteksts ir pirmajā daļā (§3). Robežgadījums Pārbaudāms: "papildu atbalsts" bez apjoma — vērtē, vai renovācijas atbalstā ieviests papildu atbalsts šīm grupām. Nav apvienots ar pro-socialais-klimata-fonds-granti (Sociālā klimata fonda grantu daļa mazaizsargātām mājsaimniecībām — cits iznākums, var būt instruments). Iestāde: EM (nav pārbaudīts).'
jautajums: ""
