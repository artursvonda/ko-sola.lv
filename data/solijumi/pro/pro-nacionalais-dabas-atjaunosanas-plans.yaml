id: pro-nacionalais-dabas-atjaunosanas-plans
saraksts: pro
nosaukums: Nacionālā dabas atjaunošanas plāna izstrāde un ieviešana
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: KLIMATS UN VIDE
    citats: Īstenosim ES Dabas atjaunošanas regulu, izstrādājot un ieviešot nacionālo dabas atjaunošanas plānu.
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Daba un bioloģiskā daudzveidība
    citats: Ieviesīsim nacionālo dabas atjaunošanas plānu, lai atjaunotu degradētos biotopus un purvu dabisko ūdens režīmu, kā arī pilnveidotu pilsētu zaļās zonas.
nesakritiba: ""
piezimes: 'Viens Solījums: CVK regulas īstenošana notiek caur plānu ("-ot" daļa nosauc to pašu iznākumu), paplašinātā — tas pats plāns ar tā mērķiem (skaidrojums, nemaina iznākumu, §4). Konkrēti mērķi (30% biotopu atjaunošana, upju tecējums) — atsevišķi Solījumi. Ekstraktors nezina plāna pašreizējo izstrādes stadiju. Iestāde: dabas aizsardzība — VARAM (nav pārbaudīts; iespējams, KEM).'
jautajums: ""
