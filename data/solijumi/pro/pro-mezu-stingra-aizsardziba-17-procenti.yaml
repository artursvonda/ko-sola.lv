id: pro-mezu-stingra-aizsardziba-17-procenti
saraksts: pro
nosaukums: Stingri aizsargāti vismaz 17% mežu platības
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: zm
  papildu:
    - varam
avoti:
  - veids: cvk
    vieta: MEŽI
    citats: Palielināsim vecu un bioloģiski vērtīgu mežu aizsardzību
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ilgtspējīga mežsaimniecība un AS "Latvijas valsts meži" pārvaldība sabiedrības interesēs
    citats: Nodrošināsim, ka vismaz 17% mežu platības ir stingri aizsargāti
nesakritiba: CVK sola palielināt "vecu un bioloģiski vērtīgu mežu aizsardzību" bez mēra; paplašinātā programma — "vismaz 17% mežu platības ir stingri aizsargāti" (visu mežu platība, galvenokārt valsts un pašvaldību meži).
piezimes: 'CVK 2. punkts dalīts (§1): aizsardzības palielināšana un kailciršu samazināšana — atšķirīgi iznākumi (sk. pro-kailcirsu-samazinasana-jutigas-teritorijas). Paplašinātās punkta 17% daļa ir tas pats iznākums (mežu aizsardzības palielināšana) ar mēru (§0.3, §4) — vērtē pēc 17% (§4). Tā paša punkta "vismaz 35% tiek apsaimniekoti dabai draudzīgi" ir cits iznākums — nav citēts, atstāts nodaļai KLIMATS UN VIDE. Ekstraktors nezina pašreizējo stingri aizsargāto mežu īpatsvaru. Iestāde: kompetence dalīta — meža politika un valsts meži ZM, īpaši aizsargājamās dabas teritorijas VARAM (nav pārbaudīts).'
