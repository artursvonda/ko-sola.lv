piezimes: "Punkts dalīts pēc darbības vārdiem (§1): infrastruktūras modernizācija (šis) un vilcienu iegāde (pro-bezemisiju-vilcienu-iegade). „-ot” daļa nosaka modernizācijas mēru (ātrums, reisu biežums) — nav dalīta; ātrums un biežums — uzskaitījums zem viena darbības vārda. Pārbaudāms (robežgadījums, bez skaitļa): vērtē, vai pēc infrastruktūras modernizācijas pieaudzis vilcienu kustības ātrums vai reisu biežums."
