avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Finanšu pašpietiekamība un taisnīga naudas sadale reģioniem
    citats: Ieviesīsim pakāpenisku IIN sadali līdz 20% pēc darbavietas, garantēsim, ka nevienai pašvaldībai nav neto ieņēmumu krituma modeļa ieviešanas gadījumā, tādam rodoties valsts radīs trūkstošo finansējumu un piedalīsies modeļa finansēšanā.
nesakritiba: ""
piezimes: "Garantija („nevienai pašvaldībai nav neto ieņēmumu krituma”, valsts sedz trūkumu) nav dalīta: tā ir paša sadales modeļa ieviešanas nosacījums; ja modelis ieviests bez garantijas — daļēja izpilde. „Pakāpenisku … līdz 20%” — vērtē, vai likumā noteikta IIN daļas sadale pēc darbavietas (līdz 20%). Ekstraktors nav pārbaudījis pašreizējo IIN sadales kārtību. Nav apvienots ar CVK „finanšu izlīdzināšanas modeli” (pro-pasvaldibu-finansu-izlidzinasanas-modelis) — cits iznākums."
jautajums: ""
