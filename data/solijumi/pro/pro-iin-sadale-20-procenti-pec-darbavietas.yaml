id: pro-iin-sadale-20-procenti-pec-darbavietas
saraksts: pro
nosaukums: IIN sadale pašvaldībām līdz 20% pēc darbavietas ar ieņēmumu garantiju
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: fm
  papildu:
