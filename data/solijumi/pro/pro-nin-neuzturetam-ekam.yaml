id: pro-nin-neuzturetam-ekam
saraksts: pro
nosaukums: Augstāka NĪN likme neuzturētām un degradētām ēkām
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu:
    - regioni-un-pasvaldibas
iestades:
  galvena: fm
  papildu:
    - varam
avoti:
  - veids: paplasinata
    vieta: 14. Taisnīga un atbildīga nodokļu sistēma › Nekustamā īpašuma nodoklis, kas veicina ekonomikas attīstību
    citats: Paplašināsim pašvaldību iespējas piemērot nekustamā īpašuma nodokļa likmi gadā ēkām, kas ilgstoši nav sakoptas vai nojauktas – vadoties pēc vienotas graustu klasifikācijas metodikas.
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Finanšu pašpietiekamība un taisnīga naudas sadale reģioniem
    citats: Paaugstināsim nekustamā īpašuma nodokli degradētiem īpašumiem līdz 10%, motivējot to sakopšanu vai nojaukšanu.
nesakritiba: 14. nodaļa sola "paplašināsim pašvaldību iespējas piemērot nekustamā īpašuma nodokļa likmi" bez skaitļa; 9. nodaļa — "paaugstināsim ... līdz 10%".
piezimes: 9. nodaļas punkts pievienots pēc §0.3 (tas pats Solījums). Vērtēšanas avots — 14. nodaļa. 14. nodaļas teikumā "likmi gadā" izskatās, ka avotā trūkst skaitļa.
jautajums: ""
