    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Starptautiskās normās balstīta ārpolitika un cilvēktiesības"
    citats: "Atbalstīsim ANO Drošības padomes reformu, tostarp vetotiesību ierobežošanu – it īpaši gadījumos, kad tiek izdarīti masveida cilvēktiesību pārkāpumi vai noziegumi pret cilvēci – un līdzsvarotāku dalībvalstu reģionālo pārstāvniecību."
