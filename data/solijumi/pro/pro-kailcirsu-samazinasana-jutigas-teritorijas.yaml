id: pro-kailcirsu-samazinasana-jutigas-teritorijas
saraksts: pro
nosaukums: Mazāks kailciršu īpatsvars ekoloģiski jutīgās teritorijās
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: zm
  papildu:
    - varam
avoti:
  - veids: cvk
    vieta: MEŽI
    citats: samazināsim kailciršu īpatsvaru ekoloģiski jutīgās teritorijās
nesakritiba: ""
piezimes: 'CVK 2. punkta otrā daļa ar savu darbības vārdu (§1). Robežgadījums Pārbaudāms: konkrēts objekts (kailciršu īpatsvars) un virziens (samazinājums), bet "ekoloģiski jutīgās teritorijas" avotā nav definētas — vērtē pēc koku ciršanas regulējuma izmaiņām vai kailciršu datiem šādās teritorijās. Paplašinātajā programmā atbilstoša punkta nav; "vismaz 35% tiek apsaimniekoti dabai draudzīgi" — cits iznākums (visu mežu apsaimniekošanas veids), nav apvienots. Iestāde: koku ciršanas noteikumi — ZM; aizsargājamās teritorijas — VARAM (nav pārbaudīts).'
jautajums: ""
