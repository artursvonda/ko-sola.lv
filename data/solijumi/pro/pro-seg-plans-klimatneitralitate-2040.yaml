id: pro-seg-plans-klimatneitralitate-2040
saraksts: pro
nosaukums: SEG emisiju samazināšanas plāns klimatneitralitātei līdz 2040. gadam
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu:
    - energetika
iestades:
  galvena: kem
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Klimatneitralitāte, atjaunīgā enerģija un ēku renovācija
    citats: Īstenosim SEG emisiju samazināšanas plānu un veicināsim Latvijas atjaunīgo energoresuru izmantošanu, lai sasniegtu klimatneitralitāti līdz 2040. gadam.
nesakritiba: ""
piezimes: 'Teikums dalīts (§1): plāna īstenošana (šis Solījums) un atjaunīgo energoresursu izmantošanas veicināšana (pro-atjaunigo-energoresursu-izmantosanas-veicinasana); citēts viss teikums, jo mērs (2040) ir teikuma beigās (§3). Robežgadījums Pārbaudāms: plāns nav nosaukts; pats mērķis (2040) ir pēc Vērtēšanas perioda — vērtē, vai pilnvaru laikā pieņemts un īstenots SEG emisiju samazināšanas plāns ar mērķi klimatneitralitāte līdz 2040. gadam. Ekstraktors nezina, kāds klimatneitralitātes gads noteikts pašreizējos plānošanas dokumentos. CVK nodaļas ievads ("Progresīvie iestājas par klimatneitralitāti …") — vīzija bez termiņa, nav citēts (§1).'
jautajums: ""
