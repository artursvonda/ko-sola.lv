avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Integrēta Eiropa un starptautiskajās normās balstīta pasaules kārtība"
    citats: "Atbalstīsim kvalificētā balsu vairākuma plašāku izmantošanu ES lēmumos un sankciju mehānismu ieviešanu pret dalībvalstīm, kas rupji pārkāpj ES pamatvērtības un pienākumus."
nesakritiba: ""
piezimes: "Punkts dalīts: balsošanas kārtība (šis) un sankciju mehānisms (pro-es-sankcijas-pret-pamatvertibu-parkapejiem) — dažādi iznākumi. Pārbaudāms kā „atbalstīsim X” ar konkrētu X (§2); robežgadījums — „plašāku” bez mēra. Atbildīgā: ĀM (ES institucionālie jautājumi)."
jautajums: ""
