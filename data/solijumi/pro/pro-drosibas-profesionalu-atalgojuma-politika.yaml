    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu"
    citats: "Izstrādāsim konkurētspējīgu atalgojuma politiku un nodrošināsim cieņpilnus darba apstākļus un profesionālās izaugsmes iespējas karavīriem, zemessargiem, policistiem, robežsargiem, glābējiem un citiem drošības nozares profesionāļiem"
nesakritiba: ""
piezimes: "Nodaļas ievadā, bet konkrēta apņemšanās, citur nav pārklāta — izrakstīta. Teikums dalīts: atalgojuma politika (šis) un darba apstākļi (pro-drosibas-profesionalu-darba-apstakli). Pārbaudāms (robežgadījums): vērtē, vai izstrādāta un ieviesta atalgojuma politika (t. sk. zemessargiem un citiem drošības nozares profesionāļiem); „konkurētspējīga” bez mēra. Atbildīgā: FM (atlīdzības regulējums), AM un IeM papildu — nav pārbaudīts."
