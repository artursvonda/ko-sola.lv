nesakritiba: ""
piezimes: "„lai …” daļa nosaka mēru (viss brauciens vienuviet) — nav dalīta. Nav apvienots ar pro-vienota-biletu-un-tarifu-sistema: tarifu apvienošana un digitāls plānošanas un apmaksas rīks var tikt īstenoti atsevišķi (cits statuss). Pārbaudāms (robežgadījums): vērtē, vai pieejams risinājums, kurā visu braucienu (arī ar pārsēšanos starp pārvadātājiem) var saplānot un apmaksāt vienuviet. Ekstraktors nav pārbaudījis, kādi risinājumi jau pastāv."
