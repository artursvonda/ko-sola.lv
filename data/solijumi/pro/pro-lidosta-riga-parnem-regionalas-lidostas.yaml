piezimes: "Avotā nenoteiksmes forma („Veidot”) — uztverta kā apņemšanās tāpat kā pārējie punkti. „-ot” daļa ir modeļa saturs (konkrēts iznākums), nav dalīta. Pārbaudāms: vērtē, vai Lidosta Rīga pārņēmusi trīs nosauktās lidostas; ja tikai daļu — daļēja izpilde. Atbildīgā: SM (pēc ekstraktora zināšanām, VAS „Starptautiskā lidosta „Rīga”” kapitāldaļu turētāja). Reģionālo lidostu īpašnieki (pēc ekstraktora zināšanām — pašvaldības vai to kapitālsabiedrības) nav pārbaudīti."
