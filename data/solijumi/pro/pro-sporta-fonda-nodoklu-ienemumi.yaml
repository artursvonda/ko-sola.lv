id: pro-sporta-fonda-nodoklu-ienemumi
saraksts: pro
nosaukums: Sporta fondam noteikta nodokļu ieņēmumu daļa, nesamazinot VKKF finansējumu
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: izm
  papildu:
    - fm
avoti:
  - veids: paplasinata
    vieta: 14. Taisnīga un atbildīga nodokļu sistēma › Nodokļu piesaiste izdevumiem
    citats: Progresīvie atbalsta precīzi noteiktus nodokļu ieņēmumus, kas veido ieguldījumus sporta fondā – taču tie nedrīkst samazināt Valsts kultūrkapitāla fonda finansējumu.
  - veids: paplasinata
    vieta: 8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Sports bērniem, jauniešiem, veselīgai sabiedrībai un Latvijas izcilībai
    citats: Valsts sporta fondam no 2027. gada novirzīsim vismaz 3% no plānotajiem valsts budžeta ieņēmumiem no alkohola, tabakas, izložu un azartspēļu nodokļiem.
nesakritiba: 14. nodaļa — "precīzi noteiktus nodokļu ieņēmumus" bez mēra un ar nosacījumu nesamazināt VKKF finansējumu; 8. nodaļa — "vismaz 3%" no alkohola, tabakas, izložu un azartspēļu nodokļu ieņēmumiem "no 2027. gada", bez VKKF nosacījuma.
piezimes: "8. nodaļas punkts pievienots pēc §0.3. Vērtēšanas avots — 14. nodaļa; mērs (3% no 2027.) — 8. nodaļā. VKKF nosacījums atstāts šajā Solījumā kā nosacījums, ne atsevišķs Solījums. Atbildīgā: sporta politika — IZM."
jautajums: ""
