avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Liela mēroga investīcijas reģionālajos izaugsmes centros
    citats: Jaunajā daudzgadu budžetā izcīnīsim speciālu ES fondu programmu 600-800 milj. euro apmērā lieliem stratēģiskiem projektiem pašvaldībās (>5 milj. euro vienam projektam), kas ir vērsti uz ieguldījuimiem infrastruktūrā, biznesa parkos, izglītības, kultūras un veselības jomā.
nesakritiba: ""
piezimes: "Vērtē, vai jaunajā ES daudzgadu budžetā (pieņemts — 2028.–2034. gadam; avotā gads nav minēts) un tā ieviešanā Latvijā izveidota speciāla programma 600–800 milj. eiro apmērā pašvaldību projektiem virs 5 milj. eiro. Nav apvienots ar pro-es-budzets-kohezija-cef-rail-baltica (vispārīgs atbalsts Kohēzijas politikai) — cits iznākums. Citātā „ieguldījuimiem” — tā avotā. Atbildīgā: ES fondu plānošana — FM, VARAM papildu (nav pārbaudīts)."
jautajums: ""
