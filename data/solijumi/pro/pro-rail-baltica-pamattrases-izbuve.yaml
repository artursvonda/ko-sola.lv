    vieta: 10. Transports, savienojamība un droša mobilitāte › Rail Baltica – Latvijas savienojamībai un drošībai
    citats: Prioritāri nodrošināsim Rail Baltica pamattrases izbūvi un Latvijas savienojumu ar Igauniju, Lietuvu un pārējo Eiropu.
nesakritiba: ""
piezimes: "Savienojums ar Igauniju, Lietuvu un Eiropu ir pamattrases iznākums — nav dalīts. Pārbaudāms: vērtē pamattrases izbūvi Latvijas posmā (pabeigta / daļēji). Ekstraktors nezina projekta pašreizējo grafiku un vai pilna izbūve iespējama Vērtēšanas periodā — redaktoram jāizlemj, vai daļēja izbūve ir „Daļēji izpildīts”."
