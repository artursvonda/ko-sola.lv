id: pro-razotaju-atbildiba-lielgabarita-atkritumiem
saraksts: pro
nosaukums: Ražotāju atbildības sistēmas paplašinātas arī uz lielgabarīta atkritumiem
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ražotāju atbildība un atkritumu apsaimniekošana
    citats: Paplašināsim un regulāri izvērtēsim ražotāju atbildības sistēmas, aptverot arī lielgabarīta un citas atkritumu plūsmas
nesakritiba: ""
piezimes: 'Teikums dalīts (§1): paplašināšana (šis Solījums) un "kā atbalstīsim ilgtspējīgu alternatīvu un uzvedības modeļu attīstību" (pro-ilgtspejigu-alternativu-uzvedibas-modelu-atbalsts). "-ot" daļa nosauc paplašināšanas apjomu (mērs), nav dalīta. "regulāri izvērtēsim" nav atsevišķs Solījums — tās pašas sistēmas uzraudzība bez atsevišķa mērāma iznākuma. Vērtē pēc lielgabarīta atkritumu iekļaušanas ražotāju atbildības sistēmā ("citas atkritumu plūsmas" nav nosauktas). Iestāde: VARAM (nav pārbaudīts; iespējams, KEM).'
jautajums: ""
