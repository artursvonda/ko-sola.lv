id: pro-majokla-kreditu-atbalsts-150000-regionos
saraksts: pro
nosaukums: Mājokļa kredītu atbalsta limits vismaz 150 000 eiro ārpus Rīgas un Pierīgas
parbaudams: true
temas:
  galvena: majokli
  papildu:
    - regioni-un-pasvaldibas
iestades:
  galvena: em
  papildu:
    - fm
avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Liela mēroga investīcijas reģionālajos izaugsmes centros
    citats: Īstenosim mājokļu pieejamības programmu reģionos, palielinot atbalsta limitus hipotekārās kreditēšanas vajadzībām vismaz līdz 150 000 euro ārpus Rīgas un Pierīgas, vērtējumā paļaujoties ne vien uz nodrošinājuma vērtību, bet uz ilgtermiņa maksātspēju, vecumu, ģimenes stāvokli u. tml. kritēriju kopumu.
nesakritiba: ""
piezimes: "Solījums ir „-ot” daļa ar mēru (limits vismaz 150 000 euro); „vērtējumā paļaujoties …” — programmas vērtēšanas kārtība, nav dalīta. Ekstraktors nav pārbaudījis, kāds ir pašreizējais atbalsta limits un kura programma tas ir. Nav apvienots ar pro-majokla-kreditu-pieejamiba-visa-latvija (Nepārbaudāms, bez mēra) — cits iznākums. Atbildīgā: EM, FM papildu — kā pro-majokla-kreditu-pieejamiba-visa-latvija (nav pārbaudīts)."
jautajums: ""
