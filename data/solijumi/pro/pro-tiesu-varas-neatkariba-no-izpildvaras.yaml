avoti:
  - veids: cvk
    vieta: DEMOKRĀTIJA UN CILVĒKTIESĪBAS
    citats: Nodrošināsim tiesu varas institucionālu un finansiālu neatkarību no izpildvaras budžeta veidošanā un tiesu atbalsta funkciju veikšanā.
  - veids: paplasinata
    vieta: 11. Stipra pilsoniskā sabiedrība, neatkarīgi un kvalitatīvi mediji, spēcīga tiesu vara – demokrātijas stūrakmens › Tiesu neatkarība – demokrātijas un brīvības pēdējā aizsardzības līnija
    citats: Nodrošināsim tiesu varas institucionālu un finansiālu neatkarību no izpildvaras budžeta veidošanā un tiesu atbalsta funkciju veikšanā.
nesakritiba: ""
piezimes: "Paplašinātās programmas teksts identisks. Nav dalīts: viena apņemšanās (neatkarība no izpildvaras) divās jomās — budžeta veidošanā un tiesu atbalsta funkcijās; ja izpildīta tikai viena — daļēji izpildīts. Vērtē, vai normatīvi mainīti tā, ka tiesu budžeta veidošana un atbalsta funkcijas nav izpildvaras pārziņā. Atbildīgā: tiesu varas regulējums — TM; budžeta process — FM (nav pārbaudīts)."
