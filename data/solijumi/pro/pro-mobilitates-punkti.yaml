nosaukums: Mobilitātes punkti dažādu transporta veidu savienošanai
parbaudams: true
temas:
  galvena: transports
  papildu: []
iestades:
  galvena: sm
  papildu:
    - varam
avoti:
  - veids: paplasinata
    vieta: 10. Transports, savienojamība un droša mobilitāte › Droši un kvalitatīvi ceļi visā Latvijā
    citats: veidosim mobilitātes punktus ērtai dažādu transporta veidu savienošanai.
nesakritiba: ""
piezimes: "Punkta otrā daļa ar savu darbības vārdu; pirmā daļa (gājēju, velo un mikromobilitātes infrastruktūra) — pro-prioritate-gajejiem-velo-sabiedriskajam-transportam (atlikums no tā faila atrisināts šeit). Nav pievienots CVK KLIMATS UN VIDE 5. punktam („prioritarizējot … stāvparkus”): stāvparki ir viens no pārsēšanās veidiem, bet tas Solījums ir Nepārbaudāma prioritāte, šeit — konkrētu objektu izveide (cits iznākums). Pārbaudāms (robežgadījums, bez skaita): vērtē, vai izveidoti mobilitātes punkti; ekstraktors nezina, vai tādi jau pastāv. Atbildīgā: SM, pašvaldību loma — VARAM papildu (nav pārbaudīts)."
jautajums: ""
