    vieta: 3. Sociālās drošības tīkls un dzīves dārdzības mazināšana › Pieejams mājoklis
    citats: Īstenosim programmas jaunu mājokļu būvniecībai un esošo ēku renovācijai ar uzsvaru uz reģionālo attīstību un energoefektivitāti.
nesakritiba: ""
piezimes: 'Nav dalīts: uzskaitījums zem viena darbības vārda (§1). Robežgadījums pārbaudāmībai: vērtē, vai pilnvaru laikā īstenotas valsts programmas jaunu mājokļu būvniecībai un ēku renovācijai ar reģionālu uzsvaru (mēra nav). 2. nodaļas "valsts uzņemsies lielāku lomu ēku renovācijā" un pro-projekte-un-buve-majokli-regionos — citi iznākumi, nav apvienoti.'
