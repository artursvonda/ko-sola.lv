id: pro-kulturas-instituciju-granti-regionos
saraksts: pro
nosaukums: Grantu projekti reģionālo kultūras institūciju lomai kopienās
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - regioni-un-pasvaldibas
iestades:
  galvena: km
  papildu: []
avoti:
  - veids: cvk
    vieta: KULTŪRA, KAS STIPRINA DEMOKRĀTIJU
    citats: Stiprināsim kultūras institūcijas kā kopienu noturības centrus, īpaši reģionos.
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju › Kultūras mantojuma un infrastruktūras ilgtspējīga attīstība
    citats: Attīstīsim grantu projektus reģionālo kultūras institūciju lomas stiprināšanai kopienu veidošanā un piekļūstamības risinājumu ieviešanai.
nesakritiba: CVK — „stiprināsim kultūras institūcijas kā kopienu noturības centrus” bez instrumenta; paplašinātā — „grantu projektus” reģionālo kultūras institūciju lomai „kopienu veidošanā un piekļūstamības risinājumu ieviešanai”, bez noturības.
piezimes: "CVK 1. punkts apvienots ar paplašinātās grantu punktu (tas pats iznākums — reģionālo kultūras institūciju loma kopienās; paplašinātā nosauc instrumentu). Robežgadījums pārbaudāmībai: CVK bez mēra, tāpēc vērtē pēc paplašinātās (§4) — vai izveidota vai paplašināta grantu programma reģionālajām kultūras institūcijām. „un piekļūstamības risinājumu ieviešanai” — tās pašas grantu programmas mērķis, nav dalīts. Atbildīgā: kultūras politika — KM (nav pārbaudīts)."
