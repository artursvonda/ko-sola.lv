avoti:
  - veids: paplasinata
    vieta: 8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Sports bērniem, jauniešiem, veselīgai sabiedrībai un Latvijas izcilībai
    citats: Iestāsimies pret azartspēļu un “ātro kredītu” reklāmas sasaisti ar sportu.
nesakritiba: ""
piezimes: "Robežgadījums pārbaudāmībai (§2 „iestāsimies par X”, X konkrēts): vērtē, vai noteikti ierobežojumi azartspēļu un ātro kredītu reklāmai sportā. Atbildīgā: azartspēļu regulējums — FM (kā pro-spelu-zalu-ierobezosana), patērētāju kreditēšana — EM papildu (nav pārbaudīts)."
