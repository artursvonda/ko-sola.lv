    citats: Stiprināsim kopienu un nevalstisko organizāciju lomu reģionālajā plānošanā.
nesakritiba: ""
piezimes: "Nepārbaudāms: „stiprināsim … lomu” bez konkrēta mehānisma vai mēra. Nav apvienots ar CVK „stiprinot iedzīvotāju līdzdalību lēmumu pieņemšanā” (pro-atvertas-pasvaldibas-iedzivotaju-lidzdaliba) — cits subjekts (kopienas, NVO) un joma (reģionālā plānošana). Atbildīgā: VARAM (reģionālā plānošana; nav pārbaudīts)."
