id: pro-atrakas-atlaujas-aizsardzibas-razosanai
saraksts: pro
nosaukums: "Vienkāršāki, ātrāki būvniecības un saskaņošanas procesi aizsardzības ražošanai"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: em
  papildu:
    - am
avoti:
  - veids: cvk
    vieta: "DROŠĪBA UN ĀRPOLITIKA"
    citats: "Veidosim aizsardzības industrijas parkus ar sakārtotu infrastruktūru, ātrākiem lēmumiem un atbalstu inovācijām un ražošanai atbilstoši NBS vajadzībām."
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Spēcīga un konkurētspējīga aizsardzības industrija"
    citats: "Vienkāršosim un paātrināsim būvniecības, saskaņošanas un investīciju piesaistes procesus aizsardzības un duālā pielietojuma preču ražošanai."
nesakritiba: "CVK sola „ātrākiem lēmumiem” aizsardzības industrijas parkos; paplašinātā programma — vienkāršot un paātrināt būvniecības, saskaņošanas un investīciju piesaistes procesus visai aizsardzības un duālā pielietojuma preču ražošanai."
piezimes: "Pārbaudāms (robežgadījums): vērtē, vai normatīvi grozīti, lai vienkāršotu un paātrinātu šos procesus; mēra nav. Nav apvienots ar pro-fast-track-atlaujas-30-dienas (visas prioritārās nozares, 30 dienu termiņš — cits iznākums). Atbildīgā: EM (būvniecības regulējums), AM papildu — nav pārbaudīts."
jautajums: ""
