id: pro-psihisko-traucejumu-demences-agrina-atpazisana
saraksts: pro
nosaukums: Psihisko traucējumu un demences agrīnas atpazīšanas un aprūpes kārtība
parbaudams: true
temas:
  galvena: veseliba
  papildu: []
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Nodrošināsim agrīnu palīdzību psihiskās veselības, atkarību, retu slimību, garā kovida un citu sarežģītu diagnožu gadījumā.
  - veids: paplasinata
    vieta: "4. Veselīga un ilgi dzīvojoša sabiedrība › Koordinēta pacienta aprūpe: retās, novārtā atstātās un hroniskās slimības"
    citats: Izveidosim agrīnas atpazīšanas un koordinētas aprūpes kārtību arī psihiskās veselības traucējumu un demences gadījumā, iesaistot ģimenes ārstus un nodrošinot atbalstu tuviniekiem.
nesakritiba: CVK sola "agrīnu palīdzību psihiskās veselības" gadījumā; paplašinātā programma — "agrīnas atpazīšanas un koordinētas aprūpes kārtību" psihiskās veselības traucējumu "un demences gadījumā".
piezimes: CVK 2. punkta daļa (sk. pro-koordinets-aprupes-modelis-retam-diagnozem). "-ot" daļas (ģimenes ārstu iesaiste, atbalsts tuviniekiem) apraksta kārtības saturu, nav dalītas (§1). Vērtē, vai šāda kārtība izveidota.
jautajums: ""
