id: pro-veselibas-it-prasibas-un-datu-standarti
saraksts: pro
nosaukums: Obligātas prasības veselības IT sistēmām un starptautiski datu standarti
parbaudams: true
temas:
  galvena: veseliba
  papildu:
    - valsts-parvalde
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Ieviesīsim digitālās veselības ekosistēmu ar datu standartiem, reāllaika reģistriem, drošu MI un anonimizētiem datiem pētniecībai.
  - veids: paplasinata
    vieta: 4. Veselīga un ilgi dzīvojoša sabiedrība › Vienota digitālās veselības vide un datos balstīta attīstība
    citats: Noteiksim obligātas prasības visiem nozares IT iepirkumiem un jaunajām sistēmām. Nodrošināsim izmantoto un būvējamo sistēmu atbilstību starptautiskiem datu uzkrāšanas, kodēšanas un apmaiņas standartiem.
nesakritiba: CVK sola ekosistēmu "ar datu standartiem"; paplašinātā programma — "obligātas prasības visiem nozares IT iepirkumiem" un esošo un jauno sistēmu atbilstību "starptautiskiem" standartiem.
piezimes: CVK 4. punkta daļa (sk. pro-digitala-veseliba-valsts-vadiba-un-mi). Abi paplašinātās programmas teikumi — viens iznākums (prasības = standarti), nav dalīti. Vērtē pēc paplašinātās programmas mēra.
jautajums: ""
