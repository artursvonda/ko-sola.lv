    vieta: 4. Veselīga un ilgi dzīvojoša sabiedrība › Agrīna palīdzība atkarību gadījumos un zinātniski pamatota narkotiku politika
    citats: Pārskatīsim kriminālatbildību par atkarīgu personu atkārtotu narkotiku lietošanu, priekšroku dodot ārstēšanai, nevis sodīšanai.
