piezimes: 'Pārbaudāms: vērtē, vai Krimināllikums grozīts, dodot priekšroku ārstēšanai ("-ot" daļa nosaka virzienu, nav dalīta). Tēma: kriminālatbildība — iekseja-drosiba-un-tiesiskums. Atbildīgā: Krimināllikums — TM (nav pārbaudīts; VM, IeM var būt iesaistītas).'
