avoti:
  - veids: cvk
    vieta: VESELĪGA SABIEDRĪBA UN PIEEJAMA APRŪPE
    citats: Nodrošināsim agrīnu palīdzību psihiskās veselības, atkarību, retu slimību, garā kovida un citu sarežģītu diagnožu gadījumā.
  - veids: paplasinata
    vieta: "4. Veselīga un ilgi dzīvojoša sabiedrība › Koordinēta pacienta aprūpe: retās, novārtā atstātās un hroniskās slimības"
    citats: Sakārtosim "garā kovida" pacientu aprūpes ceļu
nesakritiba: CVK sola "agrīnu palīdzību" garā kovida gadījumā; paplašinātā programma — "sakārtosim" garā kovida "pacientu aprūpes ceļu".
piezimes: "CVK 2. punkta daļa (sk. pro-koordinets-aprupes-modelis-retam-diagnozem). Punkts sadalīts trīs Solījumos pēc darbības vārdiem (§1). Robežgadījums pārbaudāmībai: vērtē, vai noteikts garā kovida pacientu aprūpes ceļš (piem., normatīvs vai vadlīnijas)."
