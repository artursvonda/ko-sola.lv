id: pro-pensiju-fondi-kapitala-tirgu
saraksts: pro
nosaukums: Pensiju fondu aktīvāka līdzdalība Latvijas kapitāla tirgū
parbaudams: false
temas:
  galvena: ekonomika-un-darbs
  papildu:
    - socialais-atbalsts-un-pensijas
iestades:
  galvena: fm
  papildu:
    - lm
avoti:
  - veids: paplasinata
    vieta: 1. Ekonomiskās labklājības un izaugsmes programma › Ražošanas attīstība, inovācijas un eksports
    citats: Veicināsim pensiju fondu aktīvāku līdzdalību Latvijas kapitāla tirgū.
  - veids: paplasinata
    vieta: 3. Sociālās drošības tīkls un dzīves dārdzības mazināšana › Pensiju sistēma, kas rada drošību
    citats: "Veicot izmaiņas pensiju sistēmā jānodrošina lielākas pensijas nākotnē jeb augstāks aizvietojamības koeficients; lielāka elastība ar uzkrāto pensiju kapitālu, tuvojoties pensionēšanās vecumam; pensiju kapitāla ieguldīšana Latvijas ekonomikā, nezaudējot potenciālos atdeves radītājus un pēc iespējas mazākas izmaksas pensiju kapitāla pārvaldībā."
nesakritiba: 1. nodaļa — "pensiju fondu aktīvāku līdzdalību Latvijas kapitāla tirgū"; 3. nodaļa — "pensiju kapitāla ieguldīšana Latvijas ekonomikā" ar nosacījumu "nezaudējot potenciālos atdeves radītājus".
piezimes: 3. nodaļas pensiju punkta trešais elements ("pensiju kapitāla ieguldīšana Latvijas ekonomikā") pievienots kā tas pats iznākums; citēts viss teikums, jo elementiem nav sava darbības vārda. Pārējie punkta elementi — pro-pensiju-reformas-principi.
