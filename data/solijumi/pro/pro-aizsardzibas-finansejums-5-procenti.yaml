piezimes: "Tikai CVK: paplašinātajā programmā atbilstoša punkta nav. Avots nenorāda, no kā rēķināti 5% (visticamāk no IKP, bet avots to nesaka) — redaktoram vērtējot jāizlemj bāze. „Saglabāsim” — ekstraktors nepārbaudīja, vai šāds līmenis jau sasniegts. Atbildīgā: AM (nozares budžets), FM papildu (budžeta likums)."
