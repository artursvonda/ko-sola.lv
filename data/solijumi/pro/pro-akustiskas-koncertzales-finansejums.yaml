nesakritiba: ""
piezimes: "Punkts dalīts pēc nosauktajiem objektiem („tostarp”): koncertzāle (šis) un Nacionālais arhīvs (pro-nacionala-arhiva-finansejums); vispārīgā daļa par kultūras infrastruktūru — konkretizēta šajos un pro-atminas-instituciju-renovacija. Robežgadījums: „turpināsim cīnīties par finansējumu” — vērtē, vai finansējums piešķirts (§2 „iestāsimies par X”). Atbildīgā: KM."
