id: pro-sabiedriska-medija-finansesanas-depolitizacija
saraksts: pro
nosaukums: Sabiedriskā medija finansēšanas modeļa maiņa un depolitizācija
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - demokratija-un-cilvektiesibas
iestades:
  galvena: km
  papildu: []
avoti:
  - veids: cvk
    vieta: DEMOKRĀTIJA UN CILVĒKTIESĪBAS
    citats: Stiprināsim Latvijas sabiedrisko mediju, depolitizējot tā finansēšanas modeli un nodrošinot plašāku sabiedrības pārstāvniecību pārvaldībā.
  - veids: paplasinata
    vieta: 11. Stipra pilsoniskā sabiedrība, neatkarīgi un kvalitatīvi mediji, spēcīga tiesu vara – demokrātijas stūrakmens › Droši, kvalitatīvi, neatkarīgi un stipri mediji
    citats: Ieviesīsim finansēšanas modeļa maiņu, lai nodrošinātu neatkarību no politiskām spēlēm.
nesakritiba: ""
piezimes: 'CVK 1. punkta galvenā daļa ("Stiprināsim Latvijas sabiedrisko mediju") vispārīga — Solījumi ir "-ot" daļas (§1), citēts viss teikums. Paplašinātā programma punktu sadala: pārvaldība un pārstāvniecība (pro-sabiedriska-medija-parvaldibas-depolitizacija, pro-sabiedriska-medija-sabiedribas-parstavnieciba), finansēšanas modelis (šis), ēka (pro-sabiedrisko-mediju-eka-es-fondi); sekots tās dalījumam (§4). Vērtē, vai pieņemts jauns sabiedriskā medija finansēšanas modelis. Atbildīgā: mediju politika — KM (nav pārbaudīts).'
jautajums: ""
