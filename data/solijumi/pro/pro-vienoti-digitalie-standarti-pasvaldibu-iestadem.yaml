    vieta: 9. Reģioni, kas attīstās › Pieejams un kvalitatīvs pamatfunkciju pakalpojums ikvienā Latvijas pašvaldībā
    citats: Ieviesīsim vienotus digitālos standartus interneta pieejamībai, ātrumam, drošībai un vienotiem (centralizētiem) risinājumiem skolās, bibliotēkās un pašvaldību iestādēs.
nesakritiba: ""
piezimes: "Nākamais teikums („Tas nodrošina vienlīdzīgu piekļuvi …”) — pamatojums. Uzskaitījums (pieejamība, ātrums, drošība, centralizēti risinājumi) zem viena darbības vārda — nav dalīts. 10. nodaļas „baltās zonas” un sakaru tīkli reģionos — cits iznākums (pārklājums): pro-elektronisko-sakaru-balto-zonu-likvidesana, pro-optiskie-un-mobilo-sakaru-tikli-regionos. Atbildīgā: VARAM (digitālā transformācija), IZM papildu (nav pārbaudīts)."
