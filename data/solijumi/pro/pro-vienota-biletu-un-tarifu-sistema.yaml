nesakritiba: ""
piezimes: "Nodaļa bez CVK atbilsmes — vērtēšanas avots ir šis punkts (§4). Nav apvienots ar CVK DZĪVES DĀRDZĪBAS MAZINĀŠANA 5. punktu (pro-vienota-menesbilete-50-atlaide-jauniesiem): vienota mēnešbiļete ar atlaidi jauniešiem ir viens biļetes veids, šeit — visu trīs transporta veidu biļešu un tarifu sistēmas apvienošana (cits iznākums, var būt cits statuss). Ja sistēma ieviesta ne visiem trim veidiem — daļēja izpilde. Atbildīgā: SM; pilsētu sabiedriskais transports — pašvaldību kompetencē, VARAM papildu (nav pārbaudīts)."
