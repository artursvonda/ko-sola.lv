    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Diasporas politika"
    citats: "Sekmēsim īpašu diasporas investīciju instrumentu – decentralizēta diasporas investīciju fondu tīkla – izveidi, kā arī valsts un diasporas partnerības ietvaru, kas nodrošina regulāru koordināciju starp atbildīgajām valsts institūcijām un diasporas investīciju struktūrām."
nesakritiba: ""
piezimes: "Punkts dalīts: fondu tīkls (šis) un valsts un diasporas partnerības ietvars (pro-valsts-un-diasporas-partneribas-ietvars). Pārbaudāms kā „virzīsim X” ar konkrētu X („sekmēsim … izveidi”, §2). Atbildīgā: EM (investīcijas), ĀM papildu — nav pārbaudīts."
