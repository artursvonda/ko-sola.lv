nesakritiba: ""
piezimes: 'Robežgadījums Pārbaudāms: konkrēts objekts (AS "Latvijas valsts meži") un iznākums (uzņēmums attīsta pārstrādi / pievienotās vērtības sektorus) — vērtē pēc akcionāra uzdevumiem, stratēģijas vai faktiskas darbības. Ekstraktors nezina, vai un kādā apjomā LVM jau darbojas pārstrādē. "sekmējot atalgojuma pieaugumu ... un meža vērtības saglabāšanu" — mērķis, nav dalīts (§1). Paplašinātajā programmā tas pats Solījums nav: LVM pārvaldība ar KEM un VARAM, FSC sertifikācija, koksnes eksporta nodoklis, atbalsts koksnes produktu ražošanai — citi iznākumi, atstāti nodaļai KLIMATS UN VIDE. Iestāde: LVM kapitāla daļu turētājs — ZM.'
jautajums: ""
