avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas:"
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "nodrošinās prognozējamu un atsevišķi nodalītu kopējo lauksaimniecības politiku, mazinot finansējuma disbalansu starp dalībvalstīm un īpašu prioritāti dodot kooperatīvu attīstībai, kā arī Kohēzijas politiku un Eiropas infrastruktūras savienošanas instrumentu stratēģiskās infrastruktūras (tostarp Rail Baltica) un nozaru atbalstam;"
nesakritiba: ""
piezimes: "Punkts „Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas: …” sadalīts pa apakšpunktiem — katram cits iznākums un ES līmeņa atbildīgā nozares ministrija (§1, §6a); ievadteikums citēts katrā. Pārbaudāms (robežgadījums): vērtē Latvijas pozīciju un vai DFS paredz Kohēzijas politiku un CEF finansējumu stratēģiskajai infrastruktūrai (t. sk. Rail Baltica). Citēts viss apakšpunkts (darbības vārds „nodrošinās” tā sākumā). Nav apvienots ar 10. nodaļas Rail Baltica finansēšanas modeli (cits iznākums, „Ārpus CVK nodaļām”). Atbildīgā: FM (ES fondi), SM papildu — nav pārbaudīts."
jautajums: ""
