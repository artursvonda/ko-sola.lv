id: pro-militara-eksporta-ierobezojumi
saraksts: pro
nosaukums: "Militārā aprīkojuma eksporta ierobežojumi uz cilvēktiesību pārkāpējvalstīm"
parbaudams: true
temas:
  galvena: arpolitika
  papildu:
    - aizsardziba
iestades:
  galvena: arm
  papildu:
    - am
avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Starptautiskās normās balstīta ārpolitika un cilvēktiesības"
    citats: "noteiksim ierobežojumus militārā aprīkojuma eksportam uz valstīm, kuras sistemātiski pārkāpj cilvēktiesības."
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Spēcīga un konkurētspējīga aizsardzības industrija"
    citats: "Veidosim atbildīgu eksporta politiku"
nesakritiba: "5. nodaļa sola „noteiksim ierobežojumus militārā aprīkojuma eksportam uz valstīm, kuras sistemātiski pārkāpj cilvēktiesības”; 6. nodaļa — tikai „veidosim atbildīgu eksporta politiku” bez konkrēta ierobežojuma."
piezimes: "Apvienots: 6. nodaļas „atbildīga eksporta politika” aizsardzības industrijas sadaļā uzskatīta par to pašu iznākumu (§4) — robežgadījums. Vērtē pēc konkrētākā 5. nodaļas punkta. 6. nodaļas punkta otrā daļa (piegādes ķēdes) — pro-drosas-aizsardzibas-piegades-kedes. Atbildīgā: ĀM (stratēģiskas nozīmes preču eksporta kontrole, pēc ekstraktora zināšanām) — nav pārbaudīts."
jautajums: ""
