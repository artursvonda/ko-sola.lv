id: pro-majoklu-programma-jauniesiem-lidz-30
saraksts: pro
nosaukums: Mājokļu programma jauniešiem līdz 30 gadiem — atbalsts īrei vai iegādei
parbaudams: true
temas:
  galvena: majokli
  papildu:
    - gimenes-un-demografija
iestades:
  galvena: em
  papildu: []
avoti:
  - veids: cvk
    vieta: DZĪVES DĀRDZĪBAS MAZINĀŠANA
    citats: Paplašināsim atbalstu jauniešiem un jaunajām ģimenēm mājokļa iegādei, īrei un pirmajai iemaksai.
  - veids: paplasinata
    vieta: "8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Sāc dzīvi Latvijā: pieejams pirmais mājoklis un jaunieša ceļa karte Latvijai"
    citats: Izveidosim pieejamu mājokļu programmu jauniešiem līdz 30 gadu vecumam, sniedzot atbalstu mājokļa īrei vai iegādei.
nesakritiba: CVK sola "paplašināsim atbalstu jauniešiem un jaunajām ģimenēm"; paplašinātā programma — "izveidosim … programmu jauniešiem līdz 30 gadu vecumam" (vecuma robeža, bez jaunajām ģimenēm).
piezimes: 8. nodaļas punkts pievienots pēc §0.3 kā CVK 7. punkta daļa (sk. pro-pirmas-iemaksas-atbalsts-ari-irei). Vērtē pēc paplašinātās programmas mēra (līdz 30 gadiem). 8. nodaļas nākamais punkts (ALTUM finansēšanas nosacījumi) un 9. nodaļas hipotekārās kreditēšanas limits 150 000 euro — citi iznākumi, atstāti savām nodaļām.
jautajums: ""
