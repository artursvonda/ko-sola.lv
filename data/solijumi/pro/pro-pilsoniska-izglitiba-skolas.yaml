    vieta: 9. Reģioni, kas attīstās › Iedzīvotāju iesaiste pašvaldības attīstības veicināšanā
    citats: Ieviesīsim balsstiesības pašvaldību vēlēšanās no 16 gadu vecuma un stiprināsim pilsonisko izglītību skolās, lai nodrošinātu jauniešu aktivitātes pieaugumu un iesaistītu ikdienas lēmumu pieņemšanā
nesakritiba: ""
piezimes: "Nepārbaudāms: „stiprināsim” bez konkrēta objekta vai mēra. Dalīts no balsstiesībām no 16 gadiem (pro-balsstiesibas-pasvaldibu-velesanas-no-16); citē visu teikumu. Nav apvienots ar pro-lidzdalibas-pieredze-izglitiba (11. nodaļa, konkrēta līdzdalības pieredze izglītības procesā) — cits iznākums."
