id: pro-roku-nost-no-satura-princips
saraksts: pro
nosaukums: Finansējuma „roku nost no satura” princips mākslinieciskajai brīvībai
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - demokratija-un-cilvektiesibas
iestades:
