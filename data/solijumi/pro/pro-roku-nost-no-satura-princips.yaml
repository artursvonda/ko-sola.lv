  papildu: []
avoti:
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju › Mākslinieciskā brīvība stiprai demokrātijai
    citats: Ieviesīsim finansējuma "roku nost no satura" principu, vērtējot finansējuma piešķīrumu tām pašvaldībām, iestādēm un citiem, kas iejaucas mākslinieciskajā brīvībā.
nesakritiba: ""
piezimes: "Vērtē, vai princips ieviests finansējuma piešķiršanas regulējumā vai praksē (piem., kultūras finansējuma nosacījumos). „vērtējot …” — principa saturs, nav dalīts. Atbildīgā: kultūras finansējums — KM (nav pārbaudīts)."
