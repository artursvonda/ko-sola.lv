avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas:"
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "nodrošinās prognozējamu un atsevišķi nodalītu kopējo lauksaimniecības politiku, mazinot finansējuma disbalansu starp dalībvalstīm un īpašu prioritāti dodot kooperatīvu attīstībai"
nesakritiba: ""
piezimes: "Punkts „Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas: …” sadalīts pa apakšpunktiem — katram cits iznākums un ES līmeņa atbildīgā nozares ministrija (§1, §6a); ievadteikums citēts katrā. Nepārbaudāms: „īpaša prioritāte” bez mēra. Nav apvienots ar pro-lauksaimniecibas-subsidijas-ar-ieguvumiem (ES un valsts subsīdiju mērķu pārdefinēšana Latvijā) — cits līmenis (ES DFS)."
jautajums: ""
