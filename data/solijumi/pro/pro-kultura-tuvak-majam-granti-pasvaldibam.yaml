avoti:
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju › Reģionālās kultūras pieejamības programma "Kultūra tuvāk mājām"
    citats: Ieviesīsim speciālus grantus visām pašvaldībām pēc objektīvas formulas (iedzīvotāji + teritoriālās attīstības indekss + attālums), ar nosacījumu, ka vismaz 75% finansējuma nonāk ārpus Rīgas, projekti notiek vietējā teritorijā, iesaista vietējos māksliniekus un ir ar pieejamu ieejas maksu.
nesakritiba: ""
piezimes: "Sadaļas ievada teikums („veidosim mērķprogrammas kultūras norišu … atbalstam pašvaldībās”) konkretizēts šajā punktā — nav atsevišķs Solījums. Nosacījumi (formula, 75%, vietējie mākslinieki, ieejas maksa) — granta nosacījumi, nav dalīti. Atbildīgā: KM, VARAM papildu (pašvaldības; nav pārbaudīts)."
