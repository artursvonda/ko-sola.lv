id: pro-tiesibsarga-pilnvaras-diskriminacijas-lietas
saraksts: pro
nosaukums: Tiesībsarga kapacitāte un pilnvaras diskriminācijas gadījumu izskatīšanā
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu: []
iestades:
  galvena: saeima
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 7. Iekļaujoša sabiedrība, kur ikviens jūtas droši › Piederība Latvijai kā diskriminācijas izskaušanas rezultāts
    citats: Stiprināsim tiesībsarga kapacitāti, pilnvaras un atbildību diskriminācijas gadījumu izskatīšanā un izskaušanā.
nesakritiba: ""
piezimes: 'Robežgadījums pārbaudāmībai: "stiprināsim", bet objekts konkrēts (Tiesībsarga pilnvaras, kapacitāte) — vērtē, vai paplašinātas pilnvaras vai palielināta kapacitāte (finansējums, personāls) diskriminācijas jomā. Atbildīgā: Tiesībsargs ir neatkarīga iestāde; Tiesībsarga likumu groza Saeima (§6a; nav pārbaudīts).'
jautajums: ""
