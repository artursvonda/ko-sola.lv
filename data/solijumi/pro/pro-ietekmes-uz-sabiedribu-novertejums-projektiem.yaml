id: pro-ietekmes-uz-sabiedribu-novertejums-projektiem
saraksts: pro
nosaukums: Obligāts ietekmes uz sabiedrību novērtējums lieliem infrastruktūras projektiem
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu:
    - energetika
    - regioni-un-pasvaldibas
iestades:
  galvena: varam
  papildu:
    - kem
avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Liela mēroga investīcijas reģionālajos izaugsmes centros
    citats: Veicināsim lielus infrastruktūras projektus, tostarp ar obligātu ietekmes uz vidi un sabiedrību novērtējumu, piemēram, vēju parku projektos, kur IVN aptver vien ekoloģijas apsvērumus, bet ignorē dzīves kvalitāti, ainavu un kopienas intereses.
nesakritiba: ""
piezimes: "„Veicināsim lielus infrastruktūras projektus” — vispārīgs darbības vārds; Solījums ir „tostarp” daļa (pēc analoģijas ar §1 „-ot” noteikumu). Pārbaudāms (robežgadījums): vērtē, vai normatīvi noteikts obligāts ietekmes uz sabiedrību (dzīves kvalitāte, ainava, kopienas intereses) novērtējums lieliem projektiem, piem., vēja parkiem. Nākamais teikums („Agrīna iedzīvotāju iesaiste …”) — pamatojums. Atbildīgā: VARAM (nav pārbaudīts; iespējams, KEM) — kā citos pro vides regulējuma Solījumos."
jautajums: ""
