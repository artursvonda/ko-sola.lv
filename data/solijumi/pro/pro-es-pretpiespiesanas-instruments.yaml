id: pro-es-pretpiespiesanas-instruments
saraksts: pro
nosaukums: "Plašāka ES Pretpiespiešanas instrumenta izmantošana"
parbaudams: true
temas:
  galvena: arpolitika
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: em
  papildu:
    - arm
avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "atbalstīsim plašāku ES Pretpiespiešanas instrumentu izmantošanu – kā tirdzniecības aizsardzības mehānismu pret trešo valstu īstenotu ekonomisko spiedienu. Rosināsim solidāru un stingru ES pozīciju, reaģējot uz dalībvalstu interešu apdraudēšanu."
nesakritiba: ""
piezimes: "Otrais teikums („Rosināsim solidāru un stingru ES pozīciju …”) — tā paša iznākuma turpinājums, citēts kopā. Pārbaudāms (robežgadījums): vērtē, vai Latvija atbalstījusi un ES izmantojusi instrumentu; „plašāku” bez mēra. Atbildīgā: EM (tirdzniecības politika, §6a)."
jautajums: ""
