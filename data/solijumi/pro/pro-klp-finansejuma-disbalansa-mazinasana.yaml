nesakritiba: ""
piezimes: "Punkts „Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas: …” sadalīts pa apakšpunktiem — katram cits iznākums un ES līmeņa atbildīgā nozares ministrija (§1, §6a); ievadteikums citēts katrā. „-ot” daļa ar savu iznākumu (§1). Pārbaudāms (robežgadījums): vērtē Latvijas pozīciju un vai DFS mazina atšķirības KLP maksājumos starp dalībvalstīm."
