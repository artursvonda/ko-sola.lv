id: pro-viedas-austrumu-robezas-infrastruktura
saraksts: pro
nosaukums: "Vieda austrumu robežas drošības infrastruktūra ar novērošanas tehnoloģijām"
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu:
    - aizsardziba
iestades:
  galvena: iem
  papildu:
    - am
avoti:
  - veids: cvk
    vieta: "DROŠĪBA UN ĀRPOLITIKA"
    citats: "Valsts robežai jābūt tehnoloģiski un fiziski drošai, un tās aizsardzībai – tiesiskai un demokrātiskai, lai Latvija spētu reaģēt uz hibrīdapdraudējumiem, nezaudējot cilvēktiesībās balstītu pieeju."
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Noturīga militārā infrastruktūra un enerģētiskā drošība"
    citats: "Attīstīsim viedu austrumu robežas drošības infrastruktūru, integrējot zemes, gaisa un digitālās novērošanas tehnoloģijas, kā arī pretmobilitātes risinājumus mūsdienu drošības apdraudējuma novēršanai."
nesakritiba: ""
piezimes: "Nepārbaudāms: CVK „jābūt … drošai” — mērķis; paplašinātā „attīstīsim” bez apjoma vai termiņa. Tēma — robeža (§6). Atbildīgā: IeM (robeža), AM papildu (pretmobilitātes risinājumi) — nav pārbaudīts."
jautajums: ""
