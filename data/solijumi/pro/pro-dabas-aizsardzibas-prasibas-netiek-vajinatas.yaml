id: pro-dabas-aizsardzibas-prasibas-netiek-vajinatas
saraksts: pro
nosaukums: Dabas aizsardzības prasības netiek vājinātas birokrātijas mazināšanas vārdā
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Daba un bioloģiskā daudzveidība
    citats: Nepieļausim dabas aizsardzības prasību vājināšanu birokrātijas mazināšanas vārdā.
nesakritiba: ""
piezimes: 'Atsevišķs teikums ar savu iznākumu tajā pašā punktā kā dabas atjaunošanas plāns — dalīts (§1). Robežgadījums Pārbaudāms: vērtē, vai pilnvaru laikā pieņemti normatīvie akti, kas mazina dabas aizsardzības prasības ar birokrātijas (sloga) mazināšanas pamatojumu; "vājināšana" prasa redaktora vērtējumu. Alternatīva — Nepārbaudāms. Iestāde: VARAM (nav pārbaudīts; iespējams, KEM).'
jautajums: ""
