id: pro-es-integracija-savienibas-un-tirgi
saraksts: pro
nosaukums: "Ciešāka ES integrācija: banku, fiskālā savienība, kapitāla un pakalpojumu tirgus"
parbaudams: false
temas:
  galvena: arpolitika
  papildu:
    - nodokli-un-budzets
    - ekonomika-un-darbs
iestades:
  galvena: fm
  papildu:
    - em
    - am
avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Integrēta Eiropa un starptautiskajās normās balstīta pasaules kārtība"
    citats: "Pastiprināsim Eiropas integrāciju investīciju, pakalpojumu un aizsardzības jomās, tostarp attiecībā uz banku savienības, fiskālās savienības, vienota kapitāla tirgus, pilnvērtīga iekšējā pakalpojumu tirgus izveidi."
nesakritiba: ""
piezimes: "Uzskaitījums zem viena darbības vārda, nav dalīts (§1). Nepārbaudāms: „pastiprināsim integrāciju” bez mēra; elementi ir ES līmeņa procesi. Atbildīgā: FM (banku un fiskālā savienība, kapitāla tirgus — §6a), EM (pakalpojumu tirgus), AM (aizsardzība) — nav pārbaudīts."
jautajums: ""
