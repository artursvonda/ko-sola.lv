id: pro-eiropas-aizsardzibas-savieniba
saraksts: pro
nosaukums: "Eiropas Aizsardzības savienības izveide kā NATO papildinošs instruments"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu:
    - arpolitika
iestades:
  galvena: am
  papildu:
    - arm
avoti:
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Latvija kā aktīvs reģionālās un Eiropas drošības veidotājs"
    citats: "Iestāsimies par ciešāku Eiropas sadarbību aizsardzības jomā. Atbalstīsim Eiropas Aizsardzības savienības izveidi kā NATO papildinošu instrumentu."
nesakritiba: ""
piezimes: "Pārbaudāms kā „iestāsimies par X” ar konkrētu X (§2): vērtē Latvijas pozīciju un vai savienība izveidota. Pirmais teikums („ciešāku Eiropas sadarbību”) — vispārīgs, ietverts šeit. 6. nodaļas ievadā tas pats („Mēs iestājamies par … Eiropas Aizsardzības Savienības izveidi …”) — ievads, nav citēts. ES līmenis → AM kā nozares ministrija (§6a)."
jautajums: ""
