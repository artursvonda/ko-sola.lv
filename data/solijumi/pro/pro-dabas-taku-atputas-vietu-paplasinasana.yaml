    citats: Garantēsim sabiedrības pieeju valsts mežiem rekreācijai un atpūtai, paplašinot dabas taku, atpūtas vietu un izglītības infrastruktūru.
nesakritiba: ""
piezimes: '"-ot" daļa ar konkrētu darbību un savu iznākumu — atsevišķs Solījums (§1); citēts viss teikums, jo daļai nav sava darbības vārda (§3). Uzskaitījums zem viena darbības vārda nav dalīts. Pārbaudāms: infrastruktūras apjoms valsts mežos palielinās vai nē. Paplašinātajā programmā atbilstoša punkta nav. Iestāde: valsts meži (AS "Latvijas valsts meži") — ZM; dabas takas aizsargājamās teritorijās var būt arī VARAM pārziņā (nav pārbaudīts).'
jautajums: ""
