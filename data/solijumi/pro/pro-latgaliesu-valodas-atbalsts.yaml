    citats: Veidosim vai paplašināsim mērķprogrammas Latgales kultūras sektora un mediju atbalstam (t. sk. apraides stiprināšanai), kā arī oriģinālsaturu un atbalstu latgaliešu valodas stiprināšanai.
nesakritiba: ""
piezimes: "Dalīts no Latgales mērķprogrammu punkta; daļai nav sava darbības vārda — citēts viss teikums (§3). Nepārbaudāms (robežgadījums): „atbalstu … stiprināšanai” bez konkrēta instrumenta vai mēra; ja lasa kā mērķprogrammu latgaliešu oriģinālsaturam — Pārbaudāms. Atbildīgā: KM (saturs), IZM papildu (valodas politika; nav pārbaudīts)."
