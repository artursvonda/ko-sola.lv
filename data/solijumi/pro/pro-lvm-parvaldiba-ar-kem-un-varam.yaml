id: pro-lvm-parvaldiba-ar-kem-un-varam
saraksts: pro
nosaukums: KEM un VARAM iesaiste AS "Latvijas valsts meži" pārvaldībā
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: zm
  papildu:
    - kem
    - varam
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ilgtspējīga mežsaimniecība un AS "Latvijas valsts meži" pārvaldība sabiedrības interesēs
    citats: Uzlabosim AS "Latvijas valsts meži" pārvaldību, tajā iesaistot arī KEM un VARAM un nosakot uzņēmumam skaidrus klimata un bioloģiskās daudzveidības mērķus.
nesakritiba: ""
piezimes: '"Uzlabosim … pārvaldību" — vispārīgs darbības vārds; Solījumi ir divas "-ot" daļas ar atšķirīgiem iznākumiem (§1): KEM un VARAM iesaiste (šis) un klimata un bioloģiskās daudzveidības mērķi (pro-lvm-klimata-biodaudzveidibas-merki); citēts viss teikums. Iesaistes forma avotā nav noteikta — vērtē, vai KEM un VARAM ir formāla loma LVM pārvaldībā. Ekstraktors nezina to pašreizējo lomu. Nav tas pats kā pro-lvm-parstrades-kedes-pievienota-vertiba (CVK MEŽI). Iestāde: LVM kapitāla daļu turētājs — ZM; KEM, VARAM — iesaistāmās (nav pārbaudīts).'
jautajums: ""
