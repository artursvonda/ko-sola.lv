    vieta: "DROŠĪBA UN ĀRPOLITIKA"
    citats: "Latvijai jābūt aktīvai NATO austrumu flanga valstij, kas reaģē, paredz un novērš draudus sadarbībā ar NATO, ES, NB8+, Poliju, Lielbritāniju un Ukrainu."
  - veids: paplasinata
