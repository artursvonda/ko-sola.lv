piezimes: "CVK 3. punkts sadalīts pēc paplašinātās programmas (§4): NATO loma (šis) un draudu identificēšana un novēršana (pro-draudu-identificesana-un-noversana); CVK citāts abos. „sadarbībā ar NATO, ES, NB8+, Poliju, Lielbritāniju un Ukrainu” — veids, nav atsevišķs Solījums. Nepārbaudāms: virziena deklarācija bez konkrēta iznākuma vai mēra."
