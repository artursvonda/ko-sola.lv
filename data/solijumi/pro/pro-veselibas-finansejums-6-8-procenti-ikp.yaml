    vieta: 4. Veselīga un ilgi dzīvojoša sabiedrība
    citats: Nodrošināsim pakāpenisku veselības aprūpes finansējuma pieaugumu līdz 6% no IKP līdz 2030. gadam un līdz 8% no IKP līdz 2035. gadam.
nesakritiba: ""
piezimes: "Nodaļas punkts pirms sadaļām (vieta — tikai nodaļa). Nav dalīts: viens pakāpenisks pieaugums ar diviem starpmērķiem; 8% mērķa termiņš (2035) ir pēc Vērtēšanas perioda — vērtē pēc 6% līdz 2030. Esošais pro-veselibas-budzeta-formula-likuma (formula likumā) — cits iznākums, nav apvienots. Atbildīgā: VM, FM papildu (budžets)."
