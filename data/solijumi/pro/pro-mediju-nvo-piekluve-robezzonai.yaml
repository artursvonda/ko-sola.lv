id: pro-mediju-nvo-piekluve-robezzonai
saraksts: pro
nosaukums: "Mediju, NVO un starptautisko novērotāju piekļuve robežzonai"
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu:
    - iekseja-drosiba-un-tiesiskums
iestades:
  galvena: iem
  papildu: []
avoti:
  - veids: cvk
    vieta: "DROŠĪBA UN ĀRPOLITIKA"
    citats: "Valsts robežai jābūt tehnoloģiski un fiziski drošai, un tās aizsardzībai – tiesiskai un demokrātiskai, lai Latvija spētu reaģēt uz hibrīdapdraudējumiem, nezaudējot cilvēktiesībās balstītu pieeju."
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Starptautiskās normās balstīta ārpolitika un cilvēktiesības"
    citats: "garantējot, ka gan medijiem, gan NVO, gan humānās palīdzības organizācijām, gan starptautiskiem novērotājiem ir piekļuve robežzonai"
nesakritiba: "CVK sola robežas aizsardzību, kas ir „tiesiska un demokrātiska”; paplašinātā programma — konkrēti garantēt piekļuvi robežzonai medijiem, NVO, humānās palīdzības organizācijām un starptautiskiem novērotājiem."
piezimes: "Sk. pro-piekluve-patverumam. Pārbaudāms: vērtē, vai normatīvi vai prakse nodrošina šo piekļuvi. Tēma pēc tā, ko maina lasītājam (pārredzamība, cilvēktiesības), robeža — papildu."
jautajums: ""
