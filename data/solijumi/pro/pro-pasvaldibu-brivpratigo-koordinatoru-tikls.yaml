id: pro-pasvaldibu-brivpratigo-koordinatoru-tikls
saraksts: pro
nosaukums: "Pašvaldību brīvprātīgo koordinatoru tīkls civilajam atbalstam"
parbaudams: true
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu:
    - regioni-un-pasvaldibas
iestades:
  galvena: iem
  papildu:
    - varam
avoti:
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Civilā noturība un koordinēta rīcība krīzes situācijās"
    citats: "Veidosim vienotu civilā atbalsta sistēmu, attīstot pašvaldību brīvprātīgo koordinatoru tīklu, stiprinot vietējo kopienu iesaisti un nosakot vienotus apmācību standartus visā Latvijā."
nesakritiba: ""
piezimes: "Galvenā teikuma „veidosim vienotu civilā atbalsta sistēmu” īstenošana nosaukta „-ot” daļās; Solījumi ir tās (§1): brīvprātīgo koordinatoru tīkls (šis) un vienoti apmācību standarti (pro-vienoti-civila-atbalsta-apmacibu-standarti). „stiprinot vietējo kopienu iesaisti” — vispārīgs, nav dalīts. Tēma — civilā aizsardzība (§6). Atbildīgā: IeM, VARAM papildu (pašvaldības) — nav pārbaudīts."
jautajums: ""
