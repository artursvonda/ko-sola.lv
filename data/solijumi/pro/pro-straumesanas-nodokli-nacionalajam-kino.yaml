id: pro-straumesanas-nodokli-nacionalajam-kino
saraksts: pro
nosaukums: Nodokļi no straumēšanas platformām nacionālā kino jaunradei
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: km
  papildu:
    - fm
avoti:
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju › Kultūras un radošo industriju starptautiskās redzamības stiprināšana
    citats: parūpēsimies, ka nodokļi no starptautiskajām straumēšanas platformām nonāktu tieši Latvijas nacionālā kino jaunradei.
nesakritiba: ""
piezimes: "Vērtē, vai straumēšanas platformu maksājumi (nodoklis vai nodeva) novirzīti nacionālā kino jaunradei. Ekstraktors nezina, vai šādi maksājumi Latvijā jau tiek iekasēti. Atbildīgā: KM (kino), FM papildu (nav pārbaudīts)."
jautajums: ""
