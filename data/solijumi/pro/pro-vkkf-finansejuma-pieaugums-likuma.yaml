id: pro-vkkf-finansejuma-pieaugums-likuma
saraksts: pro
nosaukums: Likumā noteiktais VKKF finansējuma pieaugums
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - nodokli-un-budzets
iestades:
  galvena: km
  papildu:
    - fm
avoti:
  - veids: cvk
    vieta: KULTŪRA, KAS STIPRINA DEMOKRĀTIJU
    citats: Nodrošināsim paredzamu finansējumu nozarei, t.sk likumā noteikto VKKF pieaugumu.
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju
    citats: nodrošināsim kultūras nozarei paredzamu finansējumu, t.sk. likumā noteikto Valsts Kultūrkapitāla fonda finansējuma pieaugumu.
nesakritiba: ""
piezimes: "„t.sk.” daļa no CVK 6. punkta (sk. pro-paredzams-kulturas-finansejums). Vērtē, vai VKKF finansējums budžetā pieaug atbilstoši likumā noteiktajam. Avots apgalvo, ka pieaugums ir noteikts likumā; ekstraktors nav pārbaudījis attiecīgo normu un tās apmēru. Saistīts, bet atsevišķs: pro-sporta-fonda-nodoklu-ienemumi (nosacījums nesamazināt VKKF finansējumu). Atbildīgā: KM, FM papildu."
jautajums: ""
