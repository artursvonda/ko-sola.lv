id: pro-mobilitates-atbalsts-latgale-12000
saraksts: pro
nosaukums: Mobilitātes atbalsts Latgalē darbiniekiem ar ienākumiem līdz 12 000 eiro gadā
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: varam
  papildu:
    - lm
avoti:
  - veids: cvk
    vieta: REĢIONI
    citats: Mobilitātes atbalstu Latgalē attiecināsim uz visiem darbiniekiem, kuru ienākumi gadā nepārsniedz 12 tūkstošus eiro.
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Darbaspēka piesaiste un tam mērķētais atbalsts reģiona mērķu sasniegšanai
    citats: Paplašināsim mobilitātes atbalstu Austrumu pierobežā visiem darbiniekiem ar ienākumiem līdz 12 000 euro gadā.
nesakritiba: CVK atbalstu attiecina uz darbiniekiem „Latgalē”; paplašinātā — „Austrumu pierobežā” (cita teritorija).
piezimes: "Vērtē pēc CVK (Latgale). Ekstraktors pieņem, ka mobilitātes atbalsts pastāv ar šaurāku loku (abi avoti runā par paplašināšanu), bet nav pārbaudījis tā pašreizējos nosacījumus. Atbildīgā: ekstraktors nezina, kura iestāde administrē esošo atbalstu; VARAM (reģionālā politika), LM papildu (nodarbinātības atbalsts) — nav pārbaudīts."
