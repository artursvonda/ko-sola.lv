    citats: Garantēsim sabiedrības pieeju valsts mežiem rekreācijai un atpūtai
nesakritiba: ""
piezimes: 'CVK 4. punkts dalīts (§1): pieejas garantija un infrastruktūras paplašināšana ("-ot" daļa ar savu iznākumu) var saņemt atšķirīgus statusus (sk. pro-dabas-taku-atputas-vietu-paplasinasana). Robežgadījums Pārbaudāms: vērtē, vai sabiedrības pieeja valsts mežiem rekreācijai ir nodrošināta un netiek ierobežota. Ekstraktors nezina, kā pieeja valsts mežiem šobrīd regulēta un vai tā ir ierobežota — ja tā jau pilnībā garantēta, redaktors var vērtēt kā Nepārbaudāmu (status quo). Paplašinātajā programmā atbilstoša punkta nav.'
