id: pro-aizsardziba-pret-slapp
saraksts: pro
nosaukums: Aizsardzība pret SLAPP žurnālistiem, medijiem un pilsoniskajiem aktīvistiem
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu:
    - valoda-kultura-un-mediji
iestades:
  galvena: tm
  papildu: []
avoti:
  - veids: paplasinata
    vieta: 11. Stipra pilsoniskā sabiedrība, neatkarīgi un kvalitatīvi mediji, spēcīga tiesu vara – demokrātijas stūrakmens › Droši, kvalitatīvi, neatkarīgi un stipri mediji
    citats: Stiprināsim žurnālistu tiesisko aizsardzību, efektīvāk vēršoties pret naida runu un uzbrukumiem digitālajā vidē, kā arī ierobežojot SLAPP – stratēģiskās tiesvedības pret žurnālistiem un medijiem.
  - veids: paplasinata
    vieta: 11. Stipra pilsoniskā sabiedrība, neatkarīgi un kvalitatīvi mediji, spēcīga tiesu vara – demokrātijas stūrakmens › Stipra pilsoniskā sabiedrība
    citats: Stiprināsim NVO tiesisko aizsardzību, lai novērstu stratēģiskās tiesvedības pret pilsoniskajiem aktīvistiem un pašcenzūru.
nesakritiba: ""
piezimes: "Abi punkti sola to pašu iznākumu — aizsardzību pret stratēģiskām tiesvedībām (SLAPP); atšķiras aizsargājamo loks (žurnālisti un mediji; NVO un aktīvisti), tāpēc apvienoti (§4). Žurnālistu punktā citēts viss teikums; tā daļa par naida runu — pro-zurnalistu-aizsardziba-digitalaja-vide. Vērtē, vai pieņemts regulējums pret SLAPP. Atbildīgā: civilprocesa regulējums — TM (nav pārbaudīts)."
jautajums: ""
