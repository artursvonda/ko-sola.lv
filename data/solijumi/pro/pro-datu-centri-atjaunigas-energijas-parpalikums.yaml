id: pro-datu-centri-atjaunigas-energijas-parpalikums
saraksts: pro
nosaukums: Datu centru būvniecība vērtēta pēc atjaunīgās enerģijas pārpalikuma
parbaudams: true
temas:
  galvena: energetika
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: kem
  papildu:
    - em
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Klimatneitralitāte, atjaunīgā enerģija un ēku renovācija
    citats: Lieljaudas datu centru būvniecību vērtēsim tā, lai to darbībai būtu pieejams pietiekams atjaunīgās enerģijas pārpalikums.
nesakritiba: ""
piezimes: 'Robežgadījums Pārbaudāms ("vērtēsim X", X konkrēts, §2): vērtē, vai ieviests kritērijs vai kārtība, pēc kuras lieljaudas datu centru būvniecību vērtē pēc atjaunīgās enerģijas pārpalikuma pieejamības. "Lieljaudas" un "pietiekams" avotā nav definēti. Iestāde: energoapgāde — KEM; būvniecība un investīcijas — EM (nav pārbaudīts).'
jautajums: ""
