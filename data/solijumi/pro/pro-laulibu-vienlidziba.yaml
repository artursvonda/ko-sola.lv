id: pro-laulibu-vienlidziba
saraksts: pro
nosaukums: Laulību vienlīdzība — iespēja viena dzimuma pāriem slēgt laulību
parbaudams: true
temas:
  galvena: demokratija-un-cilvektiesibas
  papildu:
    - gimenes-un-demografija
iestades:
  galvena: tm
  papildu:
    - saeima
avoti:
  - veids: cvk
    vieta: DEMOKRĀTIJA UN CILVĒKTIESĪBAS
    citats: Atbalstīsim vienlīdzīgas tiesības, t.sk. laulību vienlīdzību un visu ģimeņu aizsardzību.
  - veids: paplasinata
    vieta: 7. Iekļaujoša sabiedrība, kur ikviens jūtas droši › Viena dzimuma pāru veidoto ģimeņu aizsardzība
    citats: Veicināsim laulību vienlīdzību, nodrošinot viena dzimuma pāriem iespēju slēgt laulību ar vienlīdzīgu tiesību apjomu.
nesakritiba: ""
piezimes: 'CVK 2. punkts — uzskaitījums, ko paplašinātā programma sadala trīs punktos; sekots tās dalījumam, CVK citāts pievienots katram (§4): šis, pro-partneribas-tiesibu-paplasinasana, pro-vecaku-bernu-atzisana-viena-dzimuma-gimenes. "Atbalstīsim" + konkrēts X — Pārbaudāms (§2): vērtē, vai viena dzimuma pāri var slēgt laulību. Atbildīgā: laulības regulējums Civillikumā — TM; ja vajadzīgi Satversmes grozījumi — Saeima (nav pārbaudīts).'
jautajums: ""
