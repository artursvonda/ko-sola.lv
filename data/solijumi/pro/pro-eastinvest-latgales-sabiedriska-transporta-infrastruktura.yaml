piezimes: "Vērtē, vai EastInvest fonda līdzekļi novirzīti Latgales pašvaldību sabiedriskā transporta infrastruktūras investīcijām. Paplašinātajā programmā (arī 10. nodaļā) EastInvest fonds nav minēts — tikai CVK avots. Ekstraktors nezina, vai fonds jau pastāv un kura iestāde to pārvalda; VARAM (pašvaldību investīcijas, reģionālā attīstība), SM papildu — nav pārbaudīts."
