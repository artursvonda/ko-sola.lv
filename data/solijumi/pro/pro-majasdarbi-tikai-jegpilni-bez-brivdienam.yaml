    vieta: 8. Izglītoti un daudzpusīgi jaunieši, kuriem ir iespējas › Bez mājasdarbiem brīvdienās un līdzsvarota skolēnu slodze
    citats: Ieviesīsim pieeju, ka mājasdarbu uzdevums ir attīstīt pašvadītu mācīšanos, kas apjoma ziņā var pieaugt bērnam kļūstot vecākam un ievērojot pieeju "bez mājasdarbiem brīvdienās".
