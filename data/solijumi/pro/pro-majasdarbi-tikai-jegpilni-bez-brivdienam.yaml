piezimes: "Robežgadījums pārbaudāmībai: CVK bez mēra, vērtē pēc paplašinātās programmas mēra (§4) — vai normatīvi vai IZM vadlīnijās noteikta pieeja „bez mājasdarbiem brīvdienās”."
