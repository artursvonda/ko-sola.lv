id: pro-aizsardzibas-sadarbiba-ar-uznemejiem-un-akademiju
saraksts: pro
nosaukums: "Aizsardzības nozares sadarbība ar uzņēmējiem un akadēmisko vidi"
parbaudams: false
temas:
  galvena: aizsardziba
  papildu:
    - ekonomika-un-darbs
    - izglitiba-un-zinatne
iestades:
  galvena: am
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Visaptveroša sabiedrības iesaiste valsts aizsardzībā"
    citats: "Stiprināsim sadarbību starp aizsardzības nozari, uzņēmējiem, akadēmisko vidi, kultūras un izglītības organizācijām, attīstot inovācijas, jaunās tehnoloģijas, pilsonisko apziņu un sabiedrības noturību."
  - veids: paplasinata
    vieta: "6. Aizsargāta un droša valsts, kur ikviens apzinās savu lomu › Spēcīga un konkurētspējīga aizsardzības industrija"
    citats: "Veicināsim sadarbību starp aizsardzības nozari, uzņēmējiem un akadēmisko vidi"
nesakritiba: "Sadaļā „Visaptveroša sabiedrības iesaiste …” sadarbība ietver arī „kultūras un izglītības organizācijas” un mērķus „pilsonisko apziņu un sabiedrības noturību”; sadaļā „Spēcīga … aizsardzības industrija” — tikai uzņēmēji un akadēmiskā vide."
piezimes: "Tas pats saturs divās sadaļās — viens Solījums (§1). Nepārbaudāms: virziena deklarācija bez konkrēta iznākuma vai mēra. Industrijas sadaļas punkta otrā daļa (kopuzņēmumi) — pro-kopuznemumi-ar-ukrainas-uznemumiem."
jautajums: ""
