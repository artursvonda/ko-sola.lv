piezimes: "Atsevišķs no pro-elektronisko-sakaru-balto-zonu-likvidesana: nosaukti konkrēti koridori (galvenie autoceļi, dzelzceļa līnijas), statuss var atšķirties no pārklājuma visā Latvijā. Tēma — transports (sakari ceļā). Pārbaudāms: vērtē, vai gar galvenajiem autoceļiem un dzelzceļa līnijām nodrošināts nepārtraukts pārklājums. Atbildīgā: SM (nav pārbaudīts)."
