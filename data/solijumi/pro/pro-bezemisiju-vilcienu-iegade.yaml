    vieta: 10. Transports, savienojamība un droša mobilitāte › Ērts un mūsdienīgs sabiedriskais transports
    citats: turpināsim jaunu elektrovilcienu, bateriju un citu bezemisiju vilcienu iegādi.
nesakritiba: ""
piezimes: "Atsevišķs Solījums no dzelzceļa modernizācijas (pro-dzelzcela-modernizacija-atrums-reisu-biezums) — savs darbības vārds un iznākums (§1). Vilcienu veidi — uzskaitījums zem viena darbības vārda, nav dalīts. Pārbaudāms: vērtē, vai Vērtēšanas periodā iegādāti (vai noslēgti līgumi par) jauni bezemisiju vilcieni. „Turpināsim” norāda uz jau notiekošu iegādi; ekstraktors nav pārbaudījis, kādi iepirkumi jau noslēgti, — redaktoram jāizlemj, vai iepriekš noslēgta līguma piegādes skaitās."
