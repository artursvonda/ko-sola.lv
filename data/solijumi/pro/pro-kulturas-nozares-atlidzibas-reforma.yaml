id: pro-kulturas-nozares-atlidzibas-reforma
saraksts: pro
nosaukums: Kultūras nozares atlīdzības reforma ar likmi, kas aug līdz ar vidējo
parbaudams: true
temas:
  galvena: valoda-kultura-un-mediji
  papildu:
    - ekonomika-un-darbs
iestades:
  galvena: km
  papildu:
    - fm
avoti:
  - veids: cvk
    vieta: KULTŪRA, KAS STIPRINA DEMOKRĀTIJU
    citats: Reformēsim kultūras nozarē strādājošo atlīdzības sistēmu un nostiprināsim autoratlīdzības režīmu.
  - veids: paplasinata
    vieta: 12. Kultūra, kas saliedē un stiprina demokrātiju › Kultūras un radošajos sektoros strādājošie kā vērtīgs un novērtēts cilvēkresurss
    citats: Reformēsim kultūras nozares publiskajā sektorā strādājošo atlīdzības sistēmu, nosakot taisnīgu atalgojuma likmi, kas aug līdz ar vidējo atalgojumu sabiedriskajā sektorā.
nesakritiba: CVK — „kultūras nozarē strādājošo” atlīdzība bez mēra; paplašinātā — tikai „publiskajā sektorā strādājošo”, ar atalgojuma likmi, „kas aug līdz ar vidējo atalgojumu sabiedriskajā sektorā”.
piezimes: "CVK 3. punkts dalīts pēc paplašinātās programmas (§4): atlīdzības reforma (šis) un autoratlīdzības režīms (pro-autoratlidzibas-nodoklu-rezims); CVK citāts abos. CVK bez mēra — vērtē pēc paplašinātās (likme, kas aug līdz ar vidējo atalgojumu sabiedriskajā sektorā). „nosakot … likmi” nav dalīts — tas ir reformas saturs. Atbildīgā: KM, FM papildu (atlīdzības finansējums; nav pārbaudīts)."
jautajums: ""
