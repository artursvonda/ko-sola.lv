id: pro-mezu-dabai-draudziga-apsaimniekosana-35
saraksts: pro
nosaukums: Vismaz 35% mežu platības apsaimniekoti dabai draudzīgi
parbaudams: true
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: zm
  papildu:
    - varam
avoti:
  - veids: paplasinata
    vieta: 2. Zaļa enerģija, aizsargāta vide, un taisnīga klimatrīcība › Ilgtspējīga mežsaimniecība un AS "Latvijas valsts meži" pārvaldība sabiedrības interesēs
    citats: Nodrošināsim, ka vismaz 17% mežu platības ir stingri aizsargāti un vismaz 35% tiek apsaimniekoti dabai draudzīgi, galvenokārt valsts un pašvaldību mežos
nesakritiba: ""
piezimes: 'Punkta 35% daļa (17% daļa — pro-mezu-stingra-aizsardziba-17-procenti, MEŽI izpilde); citēts viss punkts, jo daļai nav sava darbības vārda (§3). Atsevišķs Solījums: cits rādītājs un iznākums nekā stingra aizsardzība un pro-kailcirsu-samazinasana-jutigas-teritorijas. "Dabai draudzīga apsaimniekošana" avotā nav definēta; ekstraktors nezina pašreizējo īpatsvaru. Nav apvienots ar 30% teritorijas mērķi (pro-teritorija-dabai-draudziga-apsaimniekosana-30) — cits rādītājs (mežu platība ↔ visa teritorija). Iestāde: meža politika — ZM; dabas aizsardzība — VARAM (nav pārbaudīts).'
jautajums: ""
