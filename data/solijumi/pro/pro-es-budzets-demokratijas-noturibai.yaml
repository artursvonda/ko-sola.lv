avoti:
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas:"
  - veids: paplasinata
    vieta: "5. Eiropa kā globāli nozīmīgs, taisnīgs spēlētājs un Latvija tās kodolā › Mērķtiecīga industriālā, tirdzniecības, budžeta un ārlietu politika"
    citats: "Pilnvērtīgi investēs arī demokrātijas un cilvēktiesību noturības stiprināšanā (pilsoniskā sabiedrība, medijpratība, kultūra un līdzdalība; tai skaitā, AgoraEU vērtību ietvarā)."
nesakritiba: ""
piezimes: "Punkts „Atbalstīsim tādu ES Daudzgadu budžetu 2028.–2034.gadam, kas: …” sadalīts pa apakšpunktiem — katram cits iznākums un ES līmeņa atbildīgā nozares ministrija (§1, §6a); ievadteikums citēts katrā. Nepārbaudāms: „pilnvērtīgi investēs” bez mēra. Atbildīgā: KM (AgoraEU — kultūras, mediju un vērtību programma) — nav pārbaudīts."
