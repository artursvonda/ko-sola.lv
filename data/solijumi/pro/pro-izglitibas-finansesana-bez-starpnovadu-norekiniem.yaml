nesakritiba: ""
piezimes: "„ļaujot skolām konkurēt …” — mērķis, nav dalīts. Vērtē, vai atcelti pašvaldību savstarpējie norēķini par izglītību un finansēšana centralizēta. Ekstraktors nav pārbaudījis, kurus izglītības izdevumus pašlaik sedz starpnovadu norēķini."
