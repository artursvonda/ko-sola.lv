id: pro-pamatpakalpojumu-minimalie-kvalitates-standarti
saraksts: pro
nosaukums: Vienoti minimālie kvalitātes standarti pamatpakalpojumiem pašvaldībās
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu:
    - izglitiba-un-zinatne
    - veseliba
iestades:
  galvena: varam
  papildu:
    - izm
    - vm
avoti:
  - veids: paplasinata
    vieta: 9. Reģioni, kas attīstās › Pieejams un kvalitatīvs pamatfunkciju pakalpojums ikvienā Latvijas pašvaldībā
    citats: Nodrošināsim vienotus minimālos kvalitātes standartus pamatpakalpojumiem kā piemēram, izglītība, veselība, sociālie pakalpojumi. Tiks sagatavoti skaidri kritēriji un finansēšanas modelis, lai saņemtu cilvēkcienīgu pakalpojumu savā reģionā.
nesakritiba: ""
piezimes: "Otrais teikums (kritēriji un finansēšanas modelis) — standartu ieviešanas veids, nav dalīts. Vērtē, vai noteikti vienoti minimālie kvalitātes standarti pašvaldību pamatpakalpojumiem. Nav apvienots ar pro-socialo-pakalpojumu-groza-prasibas (tikai sociālo pakalpojumu grozs — šaurāks, cits iznākums). Atbildīgā: starpnozaru; VARAM (pašvaldību pakalpojumi), IZM un VM papildu; sociālie pakalpojumi (LM) neietilpst papildu limitā (nav pārbaudīts)."
jautajums: ""
