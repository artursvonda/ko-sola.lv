id: as-budzeta-dati-lidz-rekinu-limenim
saraksts: as
nosaukums: Publiski pieejami budžeta dati līdz rēķinu līmenim
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [nodokli-un-budzets]
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: cvk
    vieta: "Jaunai valsts pārvaldei"
    citats: "nodrošināsim publisku budžeta datu pieejamību līdz rēķinu līmenim"
nesakritiba: ""
piezimes: "Dalīts no teikuma „Vienkāršosim mazos publiskos iepirkumus, …, nodrošināsim publisku budžeta datu pieejamību …” — savs darbības vārds un iznākums (§1). Pārbaudāms: budžeta izdevumu dati publiski pieejami līdz atsevišķu rēķinu līmenim vai nē. Avots nenosaka tvērumu (valsts budžeta iestādes? arī pašvaldības un kapitālsabiedrības?) — jādefinē pirms vērtēšanas; tikai daļai iestāžu — „daļēji izpildīts”. Ekstraktors nezina, kādā detalizācijā budžeta izpildes dati jau tiek publicēti — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: FM — valsts budžeta izpilde un uzskaite (Valsts kase)."
jautajums: ""
