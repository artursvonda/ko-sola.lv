    vieta: "Ekonomikas izrāvienam"
    citats: "Ēnu ekonomiku samazināsim ar motivāciju strādāt legāli, ne sodīšanu"
nesakritiba: ""
piezimes: "„ar motivāciju strādāt legāli, ne sodīšanu” apraksta veidu — nav dalīts (§1). Pārbaudāms robežgadījumā (pēc analoģijas ar „paplašināsim X” — var izmērīt, vai apjoms samazinās): kritērijs „izpildīts” — ēnu ekonomikas īpatsvars (% no IKP) pilnvaru beigās ir mazāks nekā sākumā. Avots nenosaka rādītāju — pirms vērtēšanas jāizvēlas viens ēnu ekonomikas novērtējums. Veidu („ne sodīšanu”) nevērtē. FM — nodokļu administrēšana (VID); iestāde izvēlēta pēc nodokļu nemaksāšanas kā ēnu ekonomikas galvenās daļas."
jautajums: ""
