    vieta: "Atbildīgām investīcijām sabiedrības labumam"
    citats: "Valsts kapitālsabiedrību vadības atalgojumu sasaistīsim ar konkrētiem rezultātiem, investīciju disciplīnu un pakalpojumu kvalitāti"
nesakritiba: ""
piezimes: "Uzskaitījums zem viena darbības vārda — nav dalīts (§1). Pārbaudāms (robežgadījums): iznākums — atalgojuma noteikšanas kārtība, kas sasaista atalgojumu ar rezultātiem, ieviesta vai nē; rādītāji nav nosaukti. Atbildīgā iestāde neskaidra: kapitāla daļu turētājas ir dažādas ministrijas, avots nenosaka, kura iestāde maina regulējumu."
