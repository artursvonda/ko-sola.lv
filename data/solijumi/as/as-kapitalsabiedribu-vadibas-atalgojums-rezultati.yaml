nesakritiba: ""
piezimes: "Uzskaitījums zem viena darbības vārda — nav dalīts (§1). Pārbaudāms: spēkā regulējums, kas valdes atalgojumu sasaista ar visiem trim nosauktajiem rādītājiem (rezultāti, investīciju disciplīna, pakalpojumu kvalitāte). Pirms vērtēšanas pārbaudīt, ko paredz jau spēkā esošais regulējums. VK — valsts kapitālsabiedrību pārvaldības koordinācijas institūcija (kopš 01.03.2023)."
