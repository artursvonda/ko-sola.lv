nesakritiba: ""
piezimes: "Teikums dalīts 2 Solījumos — katrai daļai savs darbības vārds un iznākums (§1). „samazinot birokrātiju ārstiem un gaidīšanas laiku pacientiem” apraksta mērķi — nav dalīts (§1, analoģija ar „mazinot nodokļu slogu”). Pārbaudāms robežgadījumā: konkrēts objekts (kvotu sistēma), bet reformas saturs avotā nav nosaukts. Ieteicamais kritērijs „izpildīts”: normatīvajos aktos būtiski mainīti valsts apmaksāto pakalpojumu apjomu (kvotu) plānošanas un piešķiršanas principi; kas ir „būtiski”, jādefinē pirms vērtēšanas. VM — veselības aprūpes finansēšana."
