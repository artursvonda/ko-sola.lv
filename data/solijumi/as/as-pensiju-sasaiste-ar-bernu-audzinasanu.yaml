avoti:
  - veids: cvk
    vieta: "Demogrāfijas, ģimeņu un sociālās drošības veicināšanai"
    citats: "Fiskāli atbildīgi atbalstīsim pensiju sistēmas sasaisti ar bērnu audzināšanu, atzīstot vecāku ieguldījumu un vienlaikus nesagraujot sistēmas ilgtspēju"
nesakritiba: ""
piezimes: "„atzīstot vecāku ieguldījumu” — mērķis; „Fiskāli atbildīgi” un „nesagraujot sistēmas ilgtspēju” — veids/nosacījums; nav dalīti un netiek vērtēti atsevišķi (§1). Pārbaudāms robežgadījumā („atbalstīsim X”, X — konkrēts objekts, analoģija ar „iestāsimies par X” §2), bet sasaistes veids avotā nav nosaukts (piem., pensijas piemaksa, papildu pensiju kapitāls vai apdrošināšanas stāžs par bērniem). Ieteicamais kritērijs „izpildīts”: pilnvaru laikā pieņemti normatīvie akti, kas ievieš jaunu vai paplašina esošu pensijas apmēra (vai pensiju kapitāla) sasaisti ar audzināto bērnu skaitu. Pirms vērtēšanas pārbaudīt, kāda sasaiste jau pastāv. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: LM — valsts pensiju politika."
jautajums: ""
