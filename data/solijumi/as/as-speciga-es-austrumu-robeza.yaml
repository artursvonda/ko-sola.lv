id: as-speciga-es-austrumu-robeza
saraksts: as
nosaukums: "Latvijas intereses ES: spēcīga ES austrumu robeža"
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: [arpolitika, aizsardziba]
iestades:
  galvena: iem
  papildu: [am]
avoti:
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Eiropas Savienībā konsekventi aizstāvēsim Latvijas intereses – vienlīdzīgus lauksaimniecības maksājumus, konkurētspējīgu enerģētiku, mazāk birokrātijas, investīcijas drošībā un spēcīgu Eiropas Savienības austrumu robežu"
nesakritiba: ""
piezimes: "Teikums „Eiropas Savienībā konsekventi aizstāvēsim Latvijas intereses – …” dalīts 5 Solījumos: viens darbības vārds, bet pieci atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”, kā lauksaimniecības teikums nodaļā „Reģionu, infrastruktūras un lauksaimniecības attīstībai”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Pirmā daļa (vienlīdzīgi lauksaimniecības maksājumi) pievienota esošajam `as-vienlidzigi-es-platibu-maksajumi-2028`. Nepārbaudāms: „spēcīga robeža” bez konkrēta pasākuma vai mēra. Nav apvienots ar `as-austrumu-robezas-drosiba`: tur — konkrēts nacionāls iznākums (pabeigta Latvijas austrumu robežas aizsardzības līnija un novērošanas infrastruktūra), šeit — Latvijas pozīcija ES līmenī; statusi var atšķirties. Tēma pēc §6 (robeža → iekšējā drošība). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: IeM — Latvijas pozīcija ES robežu aizsardzībā (Valsts robežsardze); AM papildu — robežas militārā aizsardzība."
jautajums: ""
