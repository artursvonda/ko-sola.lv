nesakritiba: ""
piezimes: "„sagatavojot augstas kvalifikācijas speciālistus tehnikumos un profesionālās vidējās izglītības iestādēs” apraksta mērķi — nav dalīts (§1), nav citēts. Pārbaudāms: konkrēts objekts (finansēšanas modeļa izstrāde). „konkurētspējīgu” nav mērāms. Ieteicamais kritērijs „izpildīts”: MK apstiprināts vai normatīvajā aktā noteikts jauns profesionālās izglītības finansēšanas modelis; tikai izstrādāts, bet neieviests — „daļēji izpildīts”. IZM — profesionālā izglītība."
jautajums: ""
