    vieta: "Enerģētikas un dabas drošībai"
    citats: "Virzīsim modulāro kodolreaktoru izpēti, atjaunojamo energoresursu attīstību ar skaidriem drošības, vides un pašvaldību līdzdalības noteikumiem, kā arī enerģijas uzkrāšanas un starpsavienojumu projektus"
nesakritiba: ""
piezimes: "Teikums „Virzīsim …” dalīts 3 Solījumos (§1 „Dali”); citēts viss teikums (§3). „uzkrāšanas un starpsavienojumu” — uzskaitījums pie viena lietvārda „projektus”, nav dalīts (§1); alternatīva — dalīt 2 Solījumos. Nepārbaudāms: nav nosaukts neviens konkrēts projekts vai mērs. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — enerģētikas infrastruktūras politika."
