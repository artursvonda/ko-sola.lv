id: as-tirgu-pieejamu-risinajumu-prioritate-ikt
saraksts: as
nosaukums: Tirgū pieejamu risinājumu prioritāte valsts IKT
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: varam
  papildu: []
avoti:
  - veids: cvk
    vieta: "Jaunai valsts pārvaldei"
    citats: "Primāri ieviesīsim tirgū pieejamus risinājumus, stiprinot nozares eksporta potenciālu"
nesakritiba: ""
piezimes: "Teikums dalīts 2 Solījumos — katrai daļai savs darbības vārds („ieviesīsim … risinājumus”, „ieviesīsim MI rīkus”) un iznākums (§1). „stiprinot nozares eksporta potenciālu” apraksta mērķi — nav dalīts (§1). Konteksts (iepriekšējais teikums par valsts IKT pārvaldību) rāda, ka domāti valsts IKT risinājumi. Pārbaudāms robežgadījumā: „primāri” — prioritāte bez mēra. Ieteicamais kritērijs „izpildīts”: normatīvajā aktā vai valsts IKT politikas dokumentā noteikts princips, ka tirgū pieejami risinājumi tiek izvēlēti pirms pasūtījuma izstrādes. Alternatīva — Nepārbaudāms (prakse bez mēra). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VARAM — valsts pārvaldes IKT."
jautajums: ""
