piezimes: "Atsevišķs teikums — virziena deklarācija (§2). Nav apvienots ar nākamo teikumu (kvotu reforma, vienots pieraksts), jo tajā ir divi atsevišķi Solījumi ar savu iznākumu. Nepārbaudāms: „sakārtosim” bez konkrēta objekta vai mēra. VM — veselības nozares pārvaldība."
