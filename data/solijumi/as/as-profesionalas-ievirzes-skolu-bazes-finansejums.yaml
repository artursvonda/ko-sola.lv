id: as-profesionalas-ievirzes-skolu-bazes-finansejums
saraksts: as
nosaukums: Bāzes finansējums profesionālās ievirzes skolām
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [valoda-kultura-un-mediji]
iestades:
  galvena: izm
  papildu: [km]
avoti:
  - veids: cvk
    vieta: "Izglītībai, kultūrai, jaunatnei un sportam"
    citats: "Nodrošināsim profesionālās ievirzes skolu bāzes finansējumu, augstskolu inovāciju klāsterus drošības un ekonomikas jomās"
nesakritiba: ""
piezimes: "Teikums dalīts 2 Solījumos: viens darbības vārds, bet divi atšķirīgi iznākumi (§1 „Dali”); citēts viss teikums (§3). Pārbaudāms robežgadījumā: konkrēts objekts (bāzes finansējums), bet avots nenosaka apjomu un finansētāju (valsts vai pašvaldības); ekstraktors nezina, vai un kādā veidā šāds finansējums jau pastāv. Ieteicamais kritērijs „izpildīts”: normatīvajā aktā vai valsts budžetā noteikts bāzes finansējums profesionālās ievirzes (mūzikas, mākslas, sporta u. c.) izglītības iestādēm. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: IZM — izglītības sistēma un sporta skolas; KM papildu — mūzikas un mākslas profesionālās ievirzes izglītība."
jautajums: ""
