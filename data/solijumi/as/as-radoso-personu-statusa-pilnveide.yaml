nesakritiba: ""
piezimes: "Teikums dalīts 3 Solījumos: viens darbības vārds, bet trīs atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Pārbaudāms robežgadījumā: konkrēts objekts (radošās personas statuss), bet pilnveides saturs avotā nav nosaukts. Ieteicamais kritērijs „izpildīts”: pieņemti grozījumi normatīvajā regulējumā par radošās personas statusu (ekstraktora zināšanas, nav pārbaudīts: to nosaka Radošo personu statusa likums). Papildu tēma — sociālās garantijas radošajām personām (pieņēmums par statusa saturu). KM — kultūras politika."
jautajums: ""
