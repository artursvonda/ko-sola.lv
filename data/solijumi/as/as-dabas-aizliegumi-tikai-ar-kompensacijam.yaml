id: as-dabas-aizliegumi-tikai-ar-kompensacijam
saraksts: as
nosaukums: Dabas aizsardzības aizliegumi tikai ar kompensācijām un saimniecisko līdzsvaru
parbaudams: false
temas:
  galvena: vide-un-klimats
  papildu: []
iestades:
  galvena: varam
  papildu: [zm]
avoti:
  - veids: cvk
    vieta: "Enerģētikas un dabas drošībai"
    citats: "Dabas politikā aizsargāsim mežus, ūdeņus, augsni un bioloģisko daudzveidību, nepieļaujot birokrātisku aizliegumu politiku bez kompensācijām un saimnieciska līdzsvara"
nesakritiba: ""
piezimes: "Dalīts no teikuma „Dabas politikā aizsargāsim …” (§1): „-ot” daļa nosauc atsevišķu iznākumu — aizliegumi (saimnieciskās darbības ierobežojumi) dabas aizsardzībā tikai ar kompensācijām; citēts viss teikums (§1, §3). Alternatīva — nedalīt, uzskatot „nepieļaujot …” par veida aprakstu. Nepārbaudāms robežgadījumā: negatīvs formulējums bez konkrēta pasākuma; „birokrātiska aizliegumu politika” un „saimnieciskais līdzsvars” nav definēti, kompensāciju apjoms vai mehānisms nav nosaukts. Ja redaktors to lasa kā „katram jaunam dabas aizsardzības ierobežojumam paredzēta kompensācija”, var pārvērtēt par Pārbaudāmu. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VARAM — dabas aizsardzība un aizsargājamās teritorijas; ZM papildu — mežu īpašnieku ierobežojumi un kompensācijas."
jautajums: ""
