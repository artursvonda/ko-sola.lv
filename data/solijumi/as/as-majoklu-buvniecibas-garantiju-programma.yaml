avoti:
  - veids: cvk
    vieta: "Ekonomikas izrāvienam"
    citats: "Izveidosim valsts garantiju programmu mājokļu būvniecībai reģionos, lai palielinātu kreditēšanu par 2 miljardiem"
nesakritiba: ""
piezimes: "„lai palielinātu kreditēšanu par 2 miljardiem” — programmas mērķis ar mēru, nav dalīts (§1, „lai” apraksta mērķi), bet mērs ietverts vērtējumā. Kritērijs „izpildīts”: programma izveidota UN kreditēšana palielinājusies par 2 miljardiem; programma izveidota bez šī pieauguma — „daļēji izpildīts”. Avotā nav definēts: valūta (pieņemts — eiro), vai 2 miljardi ir programmas garantēto kredītu apjoms vai kopējās (mājokļu) kreditēšanas pieaugums, termiņš (pieņemts — pilnvaru laiks), „reģioni” (ārpus Rīgas? ārpus Pierīgas?) — jādefinē pirms vērtēšanas. EM — mājokļu politika."
jautajums: ""
