  - veids: cvk
    vieta: "Enerģētikas un dabas drošībai"
    citats: "Pārskatīsim zaļā kursa ieviešanu"
nesakritiba: ""
piezimes: "Nākamais teikums („Klimata mērķiem jābūt savienojamiem ar …”) ir pamatojums/pārskatīšanas virziens — nav atsevišķs Solījums, nav citēts (§1). Nepārbaudāms robežgadījumā: „pārskatīsim” ir līdzīgs „izvērtēsim X” (§2), bet „zaļā kursa ieviešana” ir plašs ES un nacionālo politiku kopums, un avots nenosaka pārskatīšanas iznākumu (dokumentu, lēmumu vai grozāmos mērķus). Ja redaktors piesaista konkrētu dokumentu (piem., Nacionālā enerģētikas un klimata plāna pārskatīšanu), var pārvērtēt par Pārbaudāmu. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — klimata politika; zaļais kurss skar arī citas ministrijas (ZM, SM, EM, VARAM)."
jautajums: ""
