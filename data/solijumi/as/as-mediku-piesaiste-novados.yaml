nesakritiba: ""
piezimes: "Instrumentu uzskaitījums zem viena darbības vārda — nav dalīts (§1). Pārbaudāms robežgadījumā: mediķu skaita mēra nav, bet nosaukti konkrēti instrumenti. Ieteicamais kritērijs „izpildīts”: valsts līmenī ieviestas visas trīs atbalsta formas mediķiem novados (mērķstipendijas, mājokļu atbalsts, prakšu programmas); daļa — „daļēji izpildīts”. Pirms vērtēšanas pārbaudīt jau esošās programmas (arī pašvaldību). „Novadi” avotā nav definēti (ārpus valstspilsētām?). VM — veselības aprūpes cilvēkresursi."
jautajums: ""
