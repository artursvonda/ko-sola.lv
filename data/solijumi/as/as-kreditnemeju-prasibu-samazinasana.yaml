piezimes: "Divi objekti zem viena darbības vārda „samazināsim” — viens Solījums (§1). Nepārbaudāms: „nesamērīgās prasības” un „kapitālā remonta birokrātijas sekas” avotā nav konkretizētas, nav mēra. FM — finanšu sektora politika un regulējums (Latvijas Banka kā neatkarīgs uzraugs — §6a: ministrija, kas var mainīt regulējumu)."
