piezimes: "Teikums dalīts 3 Solījumos: viens darbības vārds, bet trīs atšķirīgi iznākumi ar atšķirīgu pārbaudāmību un iespējami atšķirīgiem statusiem (§1 „Dali”, analoģija ar AS lauksaimniecības teikumu); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Nošķirts no `as-vardarbibas-gimene-samazinasana` (cits teikums, cits objekts — bērni, ne tikai ģimenē). Nepārbaudāms: „veicināsim” + vispārīgs objekts bez mēra (§2). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: LM — bērnu tiesību aizsardzība."
