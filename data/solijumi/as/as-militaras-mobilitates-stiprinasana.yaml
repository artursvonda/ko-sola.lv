id: as-militaras-mobilitates-stiprinasana
saraksts: as
nosaukums: Militārās mobilitātes stiprināšana
parbaudams: false
temas:
  galvena: aizsardziba
  papildu: [transports]
iestades:
  galvena: am
  papildu: [sm]
avoti:
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot Latvijas aizsardzības industriju, militāro mobilitāti un noturību pret Krievijas agresiju un hibrīduzbrukumiem"
nesakritiba: ""
piezimes: "No teikuma „Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot …” (§1): „-ot” daļa nosauc paralēlu darbību ar savu iznākumu, nevis atbalsta Ukrainai veidu; tās trīs objekti (aizsardzības industrija, militārā mobilitāte, noturība) dalīti atsevišķos Solījumos, jo statusi var atšķirties (kā iepriekšējās as izpildēs, piem., `as-jauniesu-pilsoniska-izglitiba`); citēts viss teikums, jo daļām nav sava darbības vārda (§1, §3). Nepārbaudāms: „stiprinot” bez mēra. Saistīts, bet cits iznākums: `as-transportlidzeklu-nodokli-valsts-autoceliem` (nodokļu novirzīšana autoceļiem, t. sk. militārajai mobilitātei). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: AM — militārā mobilitāte kā aizsardzības spēja; SM papildu — transporta infrastruktūra."
jautajums: ""
