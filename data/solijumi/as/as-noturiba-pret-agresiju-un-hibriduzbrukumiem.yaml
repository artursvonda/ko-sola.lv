id: as-noturiba-pret-agresiju-un-hibriduzbrukumiem
saraksts: as
nosaukums: Noturības stiprināšana pret Krievijas agresiju un hibrīduzbrukumiem
parbaudams: false
temas:
  galvena: aizsardziba
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: am
  papildu: [iem, vk]
avoti:
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot Latvijas aizsardzības industriju, militāro mobilitāti un noturību pret Krievijas agresiju un hibrīduzbrukumiem"
nesakritiba: ""
piezimes: "No teikuma „Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot …” (§1): „-ot” daļa nosauc paralēlu darbību ar savu iznākumu, nevis atbalsta Ukrainai veidu; tās trīs objekti (aizsardzības industrija, militārā mobilitāte, noturība) dalīti atsevišķos Solījumos, jo statusi var atšķirties (kā iepriekšējās as izpildēs, piem., `as-jauniesu-pilsoniska-izglitiba`); citēts viss teikums, jo daļām nav sava darbības vārda (§1, §3). Nepārbaudāms: „stiprinot” bez mēra. Nav apvienots ar `as-kritiskas-infrastrukturas-noturiba`: tur tikai kritiskās infrastruktūras noturība, šeit — plašāka noturība pret agresiju un hibrīduzbrukumiem. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: AM — visaptverošā valsts aizsardzība; IeM un VK papildu — iekšējā drošība un valdības koordinācija (hibrīdapdraudējumi ir starpnozaru). Alternatīva — `neskaidrs` (kā `as-kritiskas-infrastrukturas-noturiba`)."
jautajums: ""
