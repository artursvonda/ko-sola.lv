avoti:
  - veids: cvk
    vieta: "Ekonomikas izrāvienam"
    citats: "Kļūsim par vienu no Eiropas līderiem jaunās ekonomikas regulējumu ieviešanā – mākslīgā intelekta, digitālās ekonomikas, kriptoaktīvu un intelektuālā īpašuma jomā"
nesakritiba: ""
piezimes: "Uzskaitījums (MI, digitālā ekonomika, kriptoaktīvi, intelektuālais īpašums) zem viena darbības vārda — nav dalīts (§1). Nepārbaudāms: „viens no Eiropas līderiem” nav definēts, nav salīdzināma rādītāja. Iestāde neskaidra (§6a): četras jomas ir dažādu ministriju kompetencē (piem., digitālā transformācija — VARAM, finanšu tirgus regulējums — FM, intelektuālais īpašums — TM), avots nenosaka vadošo."
jautajums: ""
