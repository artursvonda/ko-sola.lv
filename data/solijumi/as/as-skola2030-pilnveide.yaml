nesakritiba: ""
piezimes: "„sadarbojoties ar pedagogiem, vecākiem un skolām” apraksta veidu — nav dalīts (§1). Pārbaudāms robežgadījumā: konkrēts nosaukts objekts („Skola2030”), bet pilnveides saturs avotā nav nosaukts (analoģija ar `as-kvotu-sistemas-reforma`). „Skola2030” avotā nav definēts; lasīts kā kompetencēs balstītais vispārējās izglītības mācību saturs un pieeja (ekstraktora pieņēmums). Ieteicamais kritērijs „izpildīts”: grozīti valsts vispārējās izglītības standarti vai mācību programmu paraugi, kas veidoti „Skola2030” pieejā; kas ir pietiekama „pilnveide”, jādefinē pirms vērtēšanas. IZM — vispārējās izglītības saturs."
jautajums: ""
statusa_mainas:
  - datums: 2026-10-06
    statuss: procesa
    notikumi: [2026-10-06-mk-visparejas-izglitibas-satura-pilnveide]
    pamatojums: >-
      MK 06.10.2026 protokollēmums (prot. Nr. 57 48. §) ir datēts formāls solis ceļā uz iznākumu:
      atbalsta vispārējās izglītības satura pilnveidi esošo standartu struktūrā un aktualizēto
      programmu paraugu noteikšanu par valsts noteiktajiem no 01.09.2027; standarti un paraugi vēl
      nav grozīti (vertesana.md: Procesā; redaktora lēmums PR #115).
