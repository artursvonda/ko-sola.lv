nesakritiba: ""
piezimes: "Pārbaudāms robežgadījumā: konkrēts objekts (likums), bet reformas saturs avotā nav nosaukts. Pieņēmums: domāts Valsts civildienesta likums (avotā — „Civildienesta likums”). Ieteicamais kritērijs „izpildīts”: Saeima pieņēmusi jaunu likumu vai būtiskus grozījumus (sal. `as-kvotu-sistemas-reforma`); kas ir „būtiski”, jādefinē pirms vērtēšanas. Iespējams saturs — augstāko amatpersonu rādītāji un rotācija tajā pašā rindkopā, bet avots to tieši nesaista, tāpēc atsevišķs Solījums. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VK — valsts pārvaldes politika un civildienests (valdības kopējā kompetence, §6a)."
jautajums: ""
