nesakritiba: ""
piezimes: "Teikums dalīts 3 Solījumos: viens darbības vārds, bet trīs atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). „jauniešu” lasīts kā attiecināts uz visiem trim uzskaitījuma locekļiem. Nepārbaudāms: „stiprināsim finansējumu” bez apjoma; nav nosaukta budžeta programma vai iniciatīvu loks, tāpēc pieaugumu nevar viennozīmīgi izmērīt (robežgadījums — ja redaktors piesaista konkrētu valsts budžeta programmu, var pārvērtēt par Pārbaudāmu). IZM — jaunatnes politika."
jautajums: ""
