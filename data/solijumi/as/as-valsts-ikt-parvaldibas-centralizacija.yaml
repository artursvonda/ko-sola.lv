avoti:
  - veids: cvk
    vieta: "Jaunai valsts pārvaldei"
    citats: "Centralizēsim valsts IKT pārvaldību, lai stiprinātu pasūtītāja kompetenci un celtu pakalpojumu kvalitāti"
nesakritiba: ""
piezimes: "„lai stiprinātu pasūtītāja kompetenci un celtu pakalpojumu kvalitāti” apraksta mērķi — nav dalīts (§1). Pārbaudāms robežgadījumā: konkrēts objekts, bet centralizācijas modelis avotā nav nosaukts. Ieteicamais kritērijs „izpildīts”: ar normatīvo aktu vai MK lēmumu valsts IKT pārvaldība (attīstība, iepirkumi, uzturēšana) koncentrēta vienā iestādē vai vienotā centrālā pārvaldības modelī. Ekstraktors nezina, kāds ir pašreizējais centralizācijas līmenis — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VARAM — valsts pārvaldes digitālā transformācija un IKT; alternatīva — VK (valdības kopējā kompetence)."
jautajums: ""
