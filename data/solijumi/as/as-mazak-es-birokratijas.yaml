id: as-mazak-es-birokratijas
saraksts: as
nosaukums: "Latvijas intereses ES: mazāk birokrātijas"
parbaudams: false
temas:
  galvena: valsts-parvalde
  papildu: [arpolitika, ekonomika-un-darbs]
iestades:
  galvena: vk
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Eiropas Savienībā konsekventi aizstāvēsim Latvijas intereses – vienlīdzīgus lauksaimniecības maksājumus, konkurētspējīgu enerģētiku, mazāk birokrātijas, investīcijas drošībā un spēcīgu Eiropas Savienības austrumu robežu"
nesakritiba: ""
piezimes: "Teikums „Eiropas Savienībā konsekventi aizstāvēsim Latvijas intereses – …” dalīts 5 Solījumos: viens darbības vārds, bet pieci atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”, kā lauksaimniecības teikums nodaļā „Reģionu, infrastruktūras un lauksaimniecības attīstībai”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Pirmā daļa (vienlīdzīgi lauksaimniecības maksājumi) pievienota esošajam `as-vienlidzigi-es-platibu-maksajumi-2028`. Nepārbaudāms: „mazāk birokrātijas” bez konkrēta regulējuma vai mēra. Saistīts, bet cits iznākums: `as-jauna-prasiba-aizstaj-esoso` (nacionāls princips). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: ES regulējuma vienkāršošana ir starpnozaru, tāpēc VK (valdības kopējā kompetence, §6a); EM papildu — administratīvais slogs uzņēmējiem. Alternatīva — EM galvenā."
jautajums: ""
