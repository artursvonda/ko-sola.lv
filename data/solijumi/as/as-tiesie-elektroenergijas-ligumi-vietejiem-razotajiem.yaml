nesakritiba: ""
piezimes: "Pārbaudāms: regulējumā ir vai nav iespēja vietējiem ražotājiem slēgt tiešos elektroenerģijas piegādes līgumus ar uzņēmumiem un kopienām. Ekstraktors nezina, vai šāda iespēja (pilnībā vai daļēji) jau pastāv — pirms vērtēšanas jāpārbauda sākumstāvoklis; avots nedefinē „vietējos ražotājus” un „kopienas”. Uzņēmumi un kopienas — uzskaitījums, nav dalīts (§1). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — elektroenerģijas tirgus regulējums."
jautajums: ""
