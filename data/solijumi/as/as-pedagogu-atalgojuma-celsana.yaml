piezimes: "„sasaistot to ar slodzes sakārtošanu” lasīts kā atalgojuma celšanas veids, nav dalīts (§1); alternatīva — atsevišķs Solījums „pedagogu slodzes sakārtošana” (Nepārbaudāms). Pārbaudāms: virziens bez skaitļa. Ieteicamais kritērijs „izpildīts”: pedagogu darba samaksas zemākā mēneša likme pilnvaru beigās augstāka nekā sākumā un celšana sasaistīta ar slodzes kārtības maiņu; celšana bez slodzes sakārtošanas — „daļēji izpildīts”. Avots nenosaka, vai vērtē nominālo vai reālo pieaugumu — jādefinē pirms vērtēšanas. IZM — pedagogu darba samaksas regulējums (pieņēmums, nav pārbaudīts oficiālā avotā)."
