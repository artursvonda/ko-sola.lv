piezimes: "Atsevišķs teikums ar citu iznākumu nekā valsts atbalsta koncentrēšana — atsevišķs Solījums. Nepārbaudāms: „tiešā iejaukšanās” avotā nav definēta, nav mēra. Atbildīgā iestāde neskaidra: avots nepasaka, kāda iejaukšanās domāta — valsts līdzdalība uzņēmumos (VK) vai valsts atbalsts un regulējums (EM, nozaru ministrijas)."
