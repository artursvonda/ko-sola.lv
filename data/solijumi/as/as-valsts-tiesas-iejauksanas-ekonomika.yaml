nesakritiba: ""
piezimes: "Atsevišķs teikums ar citu iznākumu nekā valsts atbalsta koncentrēšana — atsevišķs Solījums. Nepārbaudāms: „tiešā iejaukšanās” avotā nav definēta, nav mēra. EM — tautsaimniecības politika; VK papildu — valsts kapitālsabiedrību pārvaldības koordinācijas institūcija (kopš 01.03.2023), ja ar „tiešo iejaukšanos” domāta valsts līdzdalība uzņēmumos. Iestāde neskaidra, jo avots nepasaka, kāda iejaukšanās domāta."
