piezimes: "Teikumā divi darbības vārdi ar atsevišķiem iznākumiem — dalīts 2 Solījumos (§1); otrs — `as-sameriga-eksamenu-norise`. „vērtēšanas sistēma” lasīta kā skolēnu mācību sasniegumu vērtēšana (nodaļas konteksts; avots to tieši nenosaka). Nepārbaudāms: „sakārtosim” bez satura vai mēra (analoģija ar `as-veselibas-aprupes-parvaldibas-sakartosana`). IZM — vispārējā izglītība."
