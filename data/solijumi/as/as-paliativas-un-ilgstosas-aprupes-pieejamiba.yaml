id: as-paliativas-un-ilgstosas-aprupes-pieejamiba
saraksts: as
nosaukums: Paliatīvās un ilgstošās aprūpes pieejamības stiprināšana
parbaudams: false
temas:
  galvena: veseliba
  papildu: [socialais-atbalsts-un-pensijas]
iestades:
  galvena: vm
  papildu: [lm]
avoti:
  - veids: cvk
    vieta: "Veselības un sociālajai aprūpei"
    citats: "stiprināsim paliatīvo un ilgstošās aprūpes pieejamību"
nesakritiba: ""
piezimes: "No teikuma „Integrēsim veselības un sociālo aprūpi, stiprināsim …” (§1). Divi aprūpes veidi zem viena darbības vārda — nav dalīts. Nepārbaudāms: „stiprināsim pieejamību” bez mēra. VM — paliatīvā aprūpe; LM papildu — ilgstošā sociālā aprūpe (avots nenosaka, vai „ilgstošā aprūpe” ir veselības vai sociālā)."
jautajums: ""
