id: as-jauna-prasiba-aizstaj-esoso
saraksts: as
nosaukums: Katra jauna birokrātiska prasība aizstāj vai vienkāršo esošo
parbaudams: true
temas:
  galvena: valsts-parvalde
  papildu: []
iestades:
  galvena: vk
  papildu: []
avoti:
  - veids: cvk
    vieta: "Jaunai valsts pārvaldei"
    citats: "Birokrātiju samazināsim pēc vienkārša principa: katrai jaunai prasībai jāaizstāj vai jāvienkāršo esošā"
nesakritiba: ""
piezimes: "Viens Solījums: princips ir pats birokrātijas samazināšanas iznākums (§1). Pārbaudāms: princips noteikts normatīvajā aktā (piem., tiesību aktu projektu izstrādes kārtībā) un piemērots, vai nē. Avots nenosaka tvērumu (tikai MK līmeņa tiesību akti? arī Saeimas likumi? pašvaldības?) — jādefinē pirms vērtēšanas. Ekstraktors nezina, vai līdzīgs princips Latvijā jau ir spēkā — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VK — tiesību aktu izstrādes kārtība un valsts pārvaldes politika (valdības kopējā kompetence, §6a)."
jautajums: ""
