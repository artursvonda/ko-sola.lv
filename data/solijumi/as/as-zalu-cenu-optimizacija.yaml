nesakritiba: ""
piezimes: "Instrumentu uzskaitījums zem viena darbības vārda — nav dalīts (§1). Pārbaudāms robežgadījumā: „optimizēsim zāļu cenas” bez mēra, bet nosaukti konkrēti instrumenti. Ieteicamais kritērijs „izpildīts”: ieviesti apjoma līgumi zāļu iegādē un valsts (iestāde vai kapitālsabiedrība) iesaistīta kompensējamo medikamentu piegādē; tikai daļa — „daļēji izpildīts”. „Caurredzami iepirkumi” nav konkretizēti. Avots nenosaka „valsts lomas” saturu. Pirms vērtēšanas pārbaudīt, kas no šiem instrumentiem jau pastāv. VM — zāļu politika un kompensācijas sistēma."
jautajums: ""
