id: as-darbs-nezaudejot-berna-kopsanas-pabalstu
saraksts: as
nosaukums: Iespēja strādāt bērna kopšanas laikā, nezaudējot bērna kopšanas pabalstu
parbaudams: true
temas:
  galvena: gimenes-un-demografija
  papildu: [socialais-atbalsts-un-pensijas]
iestades:
  galvena: lm
  papildu: []
avoti:
  - veids: cvk
    vieta: "Demogrāfijas, ģimeņu un sociālās drošības veicināšanai"
    citats: "Nodrošināsim iespēju strādāt bērna kopšanas laikā, nezaudējot bērna kopšanas pabalstu"
nesakritiba: ""
piezimes: "„nezaudējot …” ir pats solījuma saturs (nosacījums, kas definē iznākumu), nav dalīts (§1). Pārbaudāms: normatīvajā aktā noteikts, ka vecāks, kas strādā bērna kopšanas laikā, saglabā bērna kopšanas pabalstu, vai nē. Pirms vērtēšanas pārbaudīt, ko paredz spēkā esošais regulējums (vai un kādā apmērā pabalsts jau tiek saglabāts, ja vecāks strādā). Avots nenosaka, vai pabalsts saglabājams pilnā apmērā un vai solījums attiecas tikai uz „bērna kopšanas pabalstu” vai arī uz citiem pabalstiem bērna kopšanas laikā (piem., vecāku pabalstu) — jādefinē pirms vērtēšanas. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: LM — valsts sociālie pabalsti."
jautajums: ""
