id: as-vienota-pieraksta-ieviesana
saraksts: as
nosaukums: Vienota pieraksta ieviešana veselības aprūpē
parbaudams: true
temas:
  galvena: veseliba
  papildu: []
iestades:
  galvena: vm
  papildu: []
avoti:
  - veids: cvk
    vieta: "Veselības un sociālajai aprūpei"
    citats: "ieviesīsim vienotu pierakstu"
nesakritiba: ""
piezimes: "No teikuma „Reformēsim kvotu sistēmu, ieviesīsim vienotu pierakstu, …” (§1). „samazinot birokrātiju ārstiem un gaidīšanas laiku pacientiem” — mērķis, nav dalīts un netiek vērtēts atsevišķi. Pārbaudāms: vienots pieraksts ieviests vai nē. Avots nenosaka tvērumu (visi valsts apmaksātie pakalpojumi? arī privātās iestādes?) — jādefinē pirms vērtēšanas. VM — veselības aprūpes organizācija."
jautajums: ""
