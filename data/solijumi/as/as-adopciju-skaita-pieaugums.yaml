piezimes: "Teikums dalīts 3 Solījumos (§1 „Dali”); citēts viss teikums (§3). „adopciju” lasīts kā daudzskaitļa ģenitīvs („adopciju un audžuģimeņu skaita pieaugumu”), t. i., solīts adopciju skaita pieaugums; iespējams arī lasījums „veicināsim adopciju” (vienskaitļa akuzatīvs) — tad Nepārbaudāms (§2). Pārbaudāms: kritērijs „izpildīts” — adopciju skaits (gadā) pilnvaru beigās lielāks nekā sākumā. Avots nenosaka, vai domātas visas adopcijas vai tikai iekšzemes — jādefinē pirms vērtēšanas. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: LM — bērnu tiesību aizsardzība un ārpusģimenes aprūpe; adopcijas tiesiskais regulējums var būt arī TM kompetencē."
