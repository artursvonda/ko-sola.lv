piezimes: "Otrā daļa no teikuma „Pārskatīsim „Rail Baltica” …” (§1); citēts viss teikums, jo objekts („Rail Baltica”) ir tikai pirmajā daļā. Uzskaitījums zem viena darbības vārda — nav dalīts. Nepārbaudāms (robežgadījums): „pilna finanšu caurredzamība” un „izmaksu kontrole” bez konkrēta mehānisma vai mēra."
