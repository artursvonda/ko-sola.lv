id: as-modularo-kodolreaktoru-izpete
saraksts: as
nosaukums: Modulāro kodolreaktoru izpētes virzīšana
parbaudams: true
temas:
  galvena: energetika
  papildu: []
iestades:
  galvena: kem
  papildu: []
avoti:
  - veids: cvk
    vieta: "Enerģētikas un dabas drošībai"
    citats: "Virzīsim modulāro kodolreaktoru izpēti, atjaunojamo energoresursu attīstību ar skaidriem drošības, vides un pašvaldību līdzdalības noteikumiem, kā arī enerģijas uzkrāšanas un starpsavienojumu projektus"
nesakritiba: ""
piezimes: "Teikums „Virzīsim …” dalīts 3 Solījumos: viens darbības vārds, bet trīs atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Pārbaudāms robežgadījumā („virzīsim X”, X konkrēts — §2). Ieteicamais kritērijs „izpildīts”: ar valsts lēmumu vai finansējumu veikta vai uzsākta modulāro kodolreaktoru izpēte Latvijai (piem., izpēte, priekšizpēte vai tiesiskā regulējuma izvērtējums). Ekstraktors nezina, vai šāda izpēte jau notiek — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — enerģētikas politika."
jautajums: ""
