id: as-bezdeficita-bazes-budzets
saraksts: as
nosaukums: Bezdeficīta bāzes budžets četru gadu laikā
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: cvk
    vieta: "Atbildīgām investīcijām sabiedrības labumam"
    citats: "Mūsu prioritāte ir ieviest kārtību valsts finansēs, lai sasniegtu bezdeficīta bāzes budžetu četru gadu laikā"
nesakritiba: ""
piezimes: "Formulēts kā prioritāte/mērķis („lai sasniegtu”), ne tieša apņemšanās, bet ar konkrētu mēru un termiņu — izrakstīts, ne vīzija (§1). Pārbaudāms: bāzes budžets bez deficīta četru gadu laikā vai nē. „ieviest kārtību valsts finansēs” — vispārīgs, nav atsevišķs Solījums. „Bāzes budžets” avotā nav definēts (bez aizsardzības palielinājuma un ES fondiem? valsts pamatbudžets?) — jādefinē pirms vērtēšanas."
jautajums: ""
