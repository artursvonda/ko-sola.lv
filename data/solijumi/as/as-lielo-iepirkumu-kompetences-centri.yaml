piezimes: "Dalīts no teikuma „Vienkāršosim mazos publiskos iepirkumus, lielajiem izveidosim kompetences centrus, …” — savs darbības vārds un iznākums (§1). Citātā iekļauta arī iepriekšējā daļa, jo „lielajiem” bez tās nenosauc objektu (publiskie iepirkumi) (§3 — īsākais fragments, kas nes visu apņemšanos). Pārbaudāms: izveidots vismaz viens kompetences centrs lielo publisko iepirkumu veikšanai vai atbalstam vai nē; „lielie” iepirkumi un centru skaits avotā nav definēti. Ekstraktors nezina, vai līdzīgas funkcijas jau veic esošas centralizētās iepirkumu institūcijas — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: FM — publisko iepirkumu politika."
jautajums: ""
