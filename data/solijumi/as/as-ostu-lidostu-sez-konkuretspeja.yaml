piezimes: "Uzskaitījums zem viena darbības vārda — nav dalīts (§1). Nepārbaudāms: „stiprināsim konkurētspēju” bez mēra vai konkrēta pasākuma. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: SM — ostas un lidostas; speciālo ekonomisko zonu kompetence (nodokļu atvieglojumi, uzraudzība) nav noskaidrota, tāpēc papildu iestāde nav norādīta."
