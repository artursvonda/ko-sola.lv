    citats: "Radīsim labvēlīgu nodokļu režīmu reemigrantiem uz četriem gadiem"
nesakritiba: ""
piezimes: "Pārbaudāms: likumā ieviests īpašs (labvēlīgāks) nodokļu režīms reemigrantiem uz četriem gadiem vai nē. Avots nenosaka: kuri nodokļi un kāds atvieglojums („labvēlīgu” — vērtējums, ne mērs), kas ir „reemigrants” (prombūtnes ilgums?), un vai „uz četriem gadiem” ir režīma ilgums katram reemigrantam (pieņemts) vai režīma darbības laiks — jādefinē pirms vērtēšanas. Ja režīma ilgums katram reemigrantam ir īsāks par četriem gadiem — „daļēji izpildīts”. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: FM — nodokļu politika; reemigrācijas politikas koordinācija var būt citas ministrijas kompetencē (nav noskaidrots), tāpēc papildu iestāde nav norādīta."
jautajums: ""
