id: as-gazes-un-naftas-rezervju-palielinasana
saraksts: as
nosaukums: Stratēģisko gāzes un naftas produktu rezervju palielināšana
parbaudams: true
temas:
  galvena: energetika
  papildu: []
iestades:
  galvena: kem
  papildu: []
avoti:
  - veids: cvk
    vieta: "Enerģētikas un dabas drošībai"
    citats: "Palielināsim stratēģiskas gāzes un naftas produktu rezerves, ar caurredzamu pārvaldību un efektīvu iepirkumu politiku, samazinot cenu lēcienus apkures sezonā"
nesakritiba: ""
piezimes: "Divu veidu rezerves zem viena darbības vārda — nav dalīts (§1); rezerves palielinātas tikai vienam veidam — „daļēji izpildīts”. „ar caurredzamu pārvaldību un efektīvu iepirkumu politiku” apraksta veidu, „samazinot cenu lēcienus apkures sezonā” — mērķi; nav dalīts (§1). Pārbaudāms: rezervju apjoms palielināts vai nē (mēra nav — jebkurš pieaugums salīdzinājumā ar sākumstāvokli). Nošķirts no `as-valsts-rezervju-audits` (cits iznākums — audits, nevis apjoma palielināšana). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — energoapgādes drošums, t. sk. dabasgāzes un naftas produktu rezerves."
jautajums: ""
