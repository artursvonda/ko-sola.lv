id: as-agrina-bernu-vajadzibu-diagnostika
saraksts: as
nosaukums: Agrīna bērnu vajadzību diagnostika
parbaudams: false
temas:
  galvena: izglitiba-un-zinatne
  papildu: [gimenes-un-demografija]
iestades:
  galvena: izm
  papildu: [vm]
avoti:
  - veids: cvk
    vieta: "Izglītībai, kultūrai, jaunatnei un sportam"
    citats: "Nodrošināsim agrīnu bērnu vajadzību diagnostiku un iespējas studēt visās atbalsta personāla programmās"
nesakritiba: ""
piezimes: "Teikums dalīts 2 Solījumos: viens darbības vārds, bet divi atšķirīgi iznākumi (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Nav apvienots ar `as-bernu-savlaiciga-diagnostika-un-arstesana` (nodaļa „Veselības un sociālajai aprūpei”): tur — medicīniska diagnostika un ārstēšana, šeit — bērnu (attīstības, mācību) vajadzību izvērtēšana izglītības kontekstā, kas teikumā saistīta ar atbalsta personālu; tas ir ekstraktora lasījums, avots „vajadzību” nedefinē. Nepārbaudāms: „agrīnu” bez mēra (vecums, termiņš vai aptvere). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: IZM — izglītojamo speciālo vajadzību izvērtēšana (pedagoģiski medicīniskās komisijas); VM papildu — medicīniskā daļa."
jautajums: ""
