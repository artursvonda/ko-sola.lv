id: as-mun-10-procentu-likme-fiziskam-personam
saraksts: as
nosaukums: Mikrouzņēmumu nodokļa 10% likme fiziskajām personām
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: fm
  papildu: []
avoti:
  - veids: cvk
    vieta: "Ekonomikas izrāvienam"
    citats: "Panāksim Mikrouzņēmumu nodokļa likuma grozījumu pieņemšanu, lai ieviestu 10% likmi fiziskajām personām"
nesakritiba: ""
piezimes: "Grozījumu pieņemšana un 10% likme ir viens iznākums („lai ieviestu” — grozījumu saturs), nav dalīts (§1). Pārbaudāms: pieņemti MUN likuma grozījumi ar 10% likmi fiziskajām personām vai nē. Avots nenosaka, kuras fiziskās personas (piem., MUN maksātāji — individuālie komersanti, saimnieciskās darbības veicēji) un kam piemēro likmi (apgrozījums vai cita bāze) — jādefinē pirms vērtēšanas. FM — nodokļu politika."
jautajums: ""
