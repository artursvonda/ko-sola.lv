nesakritiba: ""
piezimes: "Dalīts no teikuma par profesionālās ievirzes skolu bāzes finansējumu (§1); citēts viss teikums (§3). Pārbaudāms robežgadījumā: „nodrošināsim … klāsterus” — konkrēts objekts, bet avots nenosaka, vai klāsteri jāizveido no jauna, cik to būs un kas tos finansē; ekstraktors nezina, vai šādi klāsteri jau pastāv. Ieteicamais kritērijs „izpildīts”: ar valsts atbalstu darbojas vismaz viens augstskolu inovāciju klāsteris drošības jomā un vismaz viens ekonomikas jomā; tikai vienā jomā — „daļēji izpildīts”. IZM — augstākā izglītība un zinātne; alternatīva — EM vai AM papildu (starpnozaru)."
jautajums: ""
