nesakritiba: ""
piezimes: "No teikuma „Civilajā aizsardzībā ieviesīsim …” (§1). Pārbaudāms: priekšlīgumi noslēgti vai nē; apjoma mēra nav. Atbildīgā iestāde neskaidra: civilā aizsardzība (IeM), bet līgumus var slēgt arī citas ministrijas savās nozarēs."
