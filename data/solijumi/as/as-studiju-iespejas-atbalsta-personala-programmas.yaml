nesakritiba: ""
piezimes: "Dalīts no teikuma par agrīnu bērnu vajadzību diagnostiku (§1); citēts viss teikums (§3). Pārbaudāms robežgadījumā: „visās” dod pārbaudāmu mēru, bet avots nedefinē „atbalsta personāla programmas” (lasīts kā izglītības atbalsta personāla, piem., logopēdu, speciālo pedagogu, izglītības psihologu, studiju programmas) un „iespējas studēt” (programmu pieejamība Latvijā vai valsts finansētas studiju vietas). Ieteicamais kritērijs „izpildīts”: katrā atbalsta personāla profesijā Latvijā pilnvaru laikā notiek uzņemšana studiju programmā; saraksts un tas, vai vajadzīgas budžeta vietas, jādefinē pirms vērtēšanas. IZM — augstākā izglītība."
jautajums: ""
