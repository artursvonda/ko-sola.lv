id: as-aizsardzibas-industrijas-stiprinasana
saraksts: as
nosaukums: Latvijas aizsardzības industrijas stiprināšana
parbaudams: false
temas:
  galvena: aizsardziba
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: am
  papildu: [em]
avoti:
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot Latvijas aizsardzības industriju, militāro mobilitāti un noturību pret Krievijas agresiju un hibrīduzbrukumiem"
nesakritiba: ""
piezimes: "No teikuma „Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot …” (§1): „-ot” daļa nosauc paralēlu darbību ar savu iznākumu, nevis atbalsta Ukrainai veidu; tās trīs objekti (aizsardzības industrija, militārā mobilitāte, noturība) dalīti atsevišķos Solījumos, jo statusi var atšķirties (kā iepriekšējās as izpildēs, piem., `as-jauniesu-pilsoniska-izglitiba`); citēts viss teikums, jo daļām nav sava darbības vārda (§1, §3). Nepārbaudāms: „stiprinot” bez mēra. Saistīts, bet cits iznākums: `as-dronu-un-pretdronu-spejas` („iesaistot vietējos ražotājus”). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: AM — aizsardzības industrijas politika; EM papildu — rūpniecība un eksports."
jautajums: ""
