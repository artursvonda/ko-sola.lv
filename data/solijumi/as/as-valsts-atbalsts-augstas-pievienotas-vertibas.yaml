piezimes: "„prioritizējot …” apraksta veidu (atlases kritērijus) — nav dalīts (§1). Nepārbaudāms: „koncentrēsim” bez mēra (nav īpatsvara vai apjoma), „augstas pievienotās vērtības nozares” avotā nav definētas. EM — tautsaimniecības politika un uzņēmējdarbības atbalsts."
