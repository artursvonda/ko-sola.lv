piezimes: "Teikums dalīts 2 Solījumos: „nepieļaujot … bez kompensācijām” nosauc atsevišķu iznākumu (kompensācijas par ierobežojumiem) — sk. `as-dabas-aizliegumi-tikai-ar-kompensacijam`. Uzskaitījums zem viena darbības vārda — nav dalīts (§1). Nepārbaudāms: „aizsargāsim” bez mēra vai konkrēta pasākuma. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VARAM — vides un dabas aizsardzība; ZM papildu — meži."
