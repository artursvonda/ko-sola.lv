    vieta: "Reģionu, infrastruktūras un lauksaimniecības attīstībai"
    citats: "Lauksaimniecībā iestāsimies par vienlīdzīgiem ES platību maksājumiem no 2028. gada, atbalstu ražojošiem lauksaimniekiem, vietējās pārstrādes attīstību, meliorācijas sakārtošanu, zemes politikas modernizāciju, jauno lauksaimnieku ienākšanu nozarē un lielāku vietējās pārtikas īpatsvaru publiskajā patēriņā"
nesakritiba: ""
piezimes: "Teikums „Lauksaimniecībā iestāsimies par …” dalīts 7 Solījumos: viens darbības vārds, bet septiņi atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Nepārbaudāms: „modernizācija” bez satura vai mēra. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: ZM, jo teikums ir par lauksaimniecību (lauksaimniecības zemes aprite); zemes pārvaldība kopumā var būt arī citu ministriju kompetencē."
