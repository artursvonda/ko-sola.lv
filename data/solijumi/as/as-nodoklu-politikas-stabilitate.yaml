id: as-nodoklu-politikas-stabilitate
saraksts: as
nosaukums: Stabila nodokļu politika bez regulāras nodokļu pārskatīšanas
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [ekonomika-un-darbs]
iestades:
