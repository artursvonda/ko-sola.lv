  papildu: []
avoti:
  - veids: cvk
    vieta: "Ekonomikas izrāvienam"
    citats: "Stabilizēsim nodokļu politiku. Pārtrauksim nodokļu regulāru pārskatīšanu, kas traucē ilgtermiņa investīciju piesaistei"
nesakritiba: ""
piezimes: "„Stabilizēsim nodokļu politiku” ir vispārīgs; konkrētais iznākums ir nākamais teikums — viens Solījums, citēti abi teikumi (§1, §3). Palīgteikums „kas traucē … investīciju piesaistei” — pamatojums, nav dalīts. Pārbaudāms robežgadījumā: „regulāra pārskatīšana” avotā nav definēta — jādefinē pirms vērtēšanas. Ieteicamais kritērijs „izpildīts”: pilnvaru laikā galvenās nodokļu likmes un bāzes (IIN, PVN, UIN, VSAOI, MUN) netiek mainītas ikgadējos budžeta paketēs, izņemot pašā programmā solītās izmaiņas (MUN 10%, IIN no kapitāla pieauguma 17%). FM — nodokļu politika."
jautajums: ""
