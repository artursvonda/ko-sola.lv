id: as-atbalsts-ukrainai
saraksts: as
nosaukums: Nelokāma atbalsta Ukrainai turpināšana
parbaudams: false
temas:
  galvena: arpolitika
  papildu: [aizsardziba]
iestades:
  galvena: arm
  papildu: [am]
avoti:
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Turpināsim nelokāmu atbalstu Ukrainai"
nesakritiba: ""
piezimes: "Teikums „Turpināsim nelokāmu atbalstu Ukrainai, vienlaikus stiprinot …” dalīts 4 Solījumos: atbalsts Ukrainai un trīs „-ot” daļas objekti (§1). Šim Solījumam citēta tikai galvenā daļa, jo tajā ir darbības vārds un objekts (§3). Nepārbaudāms: „atbalsts” bez veida, apjoma vai mēra (kā `as-atbalsts-razojosiem-lauksaimniekiem`); ja redaktors piesaista mēru (piem., militārās palīdzības apjomu), var pārvērtēt. ĀM — ārpolitika; AM papildu — militārā palīdzība (pieņēmums, nav pārbaudīts oficiālā avotā)."
jautajums: ""
