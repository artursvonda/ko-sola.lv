piezimes: "Teikums dalīts 3 Solījumos: viens darbības vārds, bet trīs atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Nepārbaudāms: „stabilu” bez definīcijas (nav norādīts apjoms, pieaugums vai daudzgadu mehānisms); ja redaktors lasa kā „finansējums nesamazinās”, var pārvērtēt par Pārbaudāmu. KM — amatiermāksla (pieņēmums, nav pārbaudīts oficiālā avotā)."
