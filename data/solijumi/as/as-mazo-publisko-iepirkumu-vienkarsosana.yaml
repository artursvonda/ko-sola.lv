nesakritiba: ""
piezimes: "Teikums dalīts 3 Solījumos — katrai daļai savs darbības vārds un iznākums (§1). Pārbaudāms robežgadījumā: konkrēts objekts, bet „mazie” iepirkumi (līgumcenas robeža) un vienkāršošanas veids avotā nav nosaukti. Ieteicamais kritērijs „izpildīts”: grozīts Publisko iepirkumu likums vai MK noteikumi, vienkāršojot procedūru iepirkumiem zem noteiktas līgumcenas (piem., paaugstinātas robežvērtības vai mazāk prasību). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: FM — publisko iepirkumu politika."
