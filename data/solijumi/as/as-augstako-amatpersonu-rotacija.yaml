nesakritiba: ""
piezimes: "Dalīts no teikuma „Ieviesīsim skaidrus augstāko amatpersonu rezultātu rādītājus un rotāciju” (§1 „Dali”, sk. `as-augstako-amatpersonu-rezultatu-raditaji`); citēts viss teikums (§3). Pārbaudāms robežgadījumā: avots nenosaka rotācijas saturu (maksimālais termiņš vienā amatā? obligāta pārcelšana?) un „augstāko amatpersonu” loku. Ieteicamais kritērijs „izpildīts”: normatīvajā aktā noteikta obligāta augstāko valsts pārvaldes amatpersonu rotācija (vai amata termiņa ierobežojums ar pārcelšanu). Ekstraktors nezina, vai un kādi termiņa ierobežojumi jau ir spēkā — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VK — valsts pārvaldes politika un civildienests (valdības kopējā kompetence, §6a)."
jautajums: ""
