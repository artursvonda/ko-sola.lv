id: as-vardarbibas-gimene-samazinasana
saraksts: as
nosaukums: Vardarbības ģimenē samazināšana
parbaudams: true
temas:
  galvena: socialais-atbalsts-un-pensijas
  papildu: [gimenes-un-demografija, iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: lm
  papildu: [iem]
avoti:
  - veids: cvk
    vieta: "Demogrāfijas, ģimeņu un sociālās drošības veicināšanai"
    citats: "Mērķtiecīgi samazināsim vardarbību ģimenē: stiprināsim prevenciju, agrīnu risku atpazīšanu, sociālo dienestu kapacitāti, atbalstu cietušajiem un intervences programmas varmākām"
nesakritiba: ""
piezimes: "Pēc kola uzskaitītie pasākumi („stiprināsim prevenciju, … intervences programmas varmākām”) apraksta samazināšanas veidu — nav dalīti (§1, analoģija ar „-ot” daļu, kas apraksta veidu); arī atsevišķi tie būtu Nepārbaudāmi („stiprināsim” bez mēra). Citēts viss teikums. Pārbaudāms robežgadījumā (analoģija ar `as-enu-ekonomikas-samazinasana`): kritērijs „izpildīts” — vardarbības ģimenē apjoms pilnvaru beigās mazāks nekā sākumā. Avots nenosaka rādītāju; reģistrēto gadījumu skaits var pieaugt tieši labākas atpazīšanas dēļ, tāpēc pirms vērtēšanas jāizvēlas rādītājs (piem., apsekojuma dati, ne tikai reģistrētie gadījumi). Starpnozaru; iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: LM — sociālie dienesti, atbalsts cietušajiem un programmas varmākām; IeM papildu — prevencija un policija. Alternatīva: IeM galvenā vai TM papildu (regulējums)."
jautajums: ""
