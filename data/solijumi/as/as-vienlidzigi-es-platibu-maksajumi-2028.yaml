id: as-vienlidzigi-es-platibu-maksajumi-2028
saraksts: as
nosaukums: Vienlīdzīgi ES platību maksājumi no 2028. gada
parbaudams: true
temas:
  galvena: lauksaimnieciba-un-zivsaimnieciba
  papildu: []
iestades:
  galvena: zm
  papildu: []
avoti:
  - veids: cvk
    vieta: "Reģionu, infrastruktūras un lauksaimniecības attīstībai"
    citats: "Lauksaimniecībā iestāsimies par vienlīdzīgiem ES platību maksājumiem no 2028. gada"
  - veids: cvk
    vieta: "Latvijas vārdam Eiropā un pasaulē"
    citats: "Eiropas Savienībā konsekventi aizstāvēsim Latvijas intereses – vienlīdzīgus lauksaimniecības maksājumus, konkurētspējīgu enerģētiku, mazāk birokrātijas, investīcijas drošībā un spēcīgu Eiropas Savienības austrumu robežu"
nesakritiba: "Viens citāts sola „vienlīdzīgiem ES platību maksājumiem no 2028. gada”, otrs — „vienlīdzīgus lauksaimniecības maksājumus” bez termiņa un plašākā tvērumā (ne tikai platību maksājumi)."
piezimes: "Teikums „Lauksaimniecībā iestāsimies par …” dalīts 7 Solījumos: viens darbības vārds, bet septiņi atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”). Šim Solījumam citēta tikai pirmā daļa, jo tajā ir darbības vārds, objekts un termiņš (§3); pārējiem — viss teikums. Pārbaudāms („iestāsimies par X”, X konkrēts — §2): vērtē iznākumu — vai no 2028. gada Latvijas lauksaimnieki saņem vienlīdzīgus ES platību maksājumus. „Vienlīdzīgi” avotā nav definēts (vienādi ar ES vidējo uz hektāru? vienādi visās dalībvalstīs?) — jādefinē pirms vērtēšanas. ZM — Latvijas pozīcija ES lauksaimniecības politikā (§6a: nozares ministrija). Nodaļas „Latvijas vārdam Eiropā un pasaulē” teikuma daļa „vienlīdzīgus lauksaimniecības maksājumus” ir tas pats iznākums (§0, §4) — pievienota kā otrs CVK citāts; citēts viss teikums, jo daļām nav sava darbības vārda (§3). Vērtē pēc pirmā citāta mēra (platību maksājumi, no 2028. gada) (§4); atšķirība — `nesakritiba`."
