    citats: "Personiskai atbildībai par pieņemtajiem lēmumiem jākļūst par valsts pārvaldes normu"
nesakritiba: ""
piezimes: "Formulēts kā mērķis („jākļūst”), ne tieša apņemšanās; izrakstīts, jo tas ir atsevišķs saturs (personiskā atbildība), ko neaptver ne rezultātu rādītāji, ne rotācija, ne Civildienesta likuma reforma (alternatīva — uzskatīt par vīziju/pamatojumu un neizrakstīt, §1; sal. `as-zala-kursa-ieviesanas-parskatisana`, kur „…jābūt…” teikums netika izrakstīts, jo tas skaidroja iepriekšējo teikumu). Nepārbaudāms: nav nosaukts mehānisms (piem., disciplinārā vai materiālā atbildība) vai mērs. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VK — valsts pārvaldes politika un civildienests (valdības kopējā kompetence, §6a)."
jautajums: ""
