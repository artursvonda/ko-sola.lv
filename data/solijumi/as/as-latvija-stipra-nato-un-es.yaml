nesakritiba: ""
piezimes: "Tagadnes forma („Iestājamies”) — ārpolitikas pamatnostādne; izrakstīta kā Nepārbaudāma (§2: virziena deklarācija bez konkrēta iznākuma vai mēra). Alternatīva — Neizrakstīts kā nodaļas ievads/vīzija (§1). Sabiedroto uzskaitījums zem viena darbības vārda — nav dalīts (§1). ĀM — ārpolitika, dalība NATO un ES."
