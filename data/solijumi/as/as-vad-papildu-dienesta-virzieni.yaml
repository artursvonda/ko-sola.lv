piezimes: "„-ot” daļa („piedāvājot papildu dienesta virzienus”) apraksta paplašināšanas veidu — nav dalīts (§1). Pārbaudāms (robežgadījums): konkrēts iznākums — VAD ieviesti papildu dienesta virzieni vai nē; skaita mēra nav."
