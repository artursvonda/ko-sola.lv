nesakritiba: ""
piezimes: "Teikums dalīts 2 Solījumos — katrai daļai savs darbības vārds un iznākums (§1). Nepārbaudāms: „integrēsim” bez konkrēta mehānisma vai mēra. Starpnozaru: VM galvenā (pirmā nosauktā joma), LM papildu — sociālā aprūpe; avots vadošo nenosaka, LM kā galvenā arī iespējama."
