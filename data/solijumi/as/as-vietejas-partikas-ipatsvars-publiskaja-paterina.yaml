avoti:
  - veids: cvk
    vieta: "Reģionu, infrastruktūras un lauksaimniecības attīstībai"
    citats: "Lauksaimniecībā iestāsimies par vienlīdzīgiem ES platību maksājumiem no 2028. gada, atbalstu ražojošiem lauksaimniekiem, vietējās pārstrādes attīstību, meliorācijas sakārtošanu, zemes politikas modernizāciju, jauno lauksaimnieku ienākšanu nozarē un lielāku vietējās pārtikas īpatsvaru publiskajā patēriņā"
nesakritiba: ""
piezimes: "Teikums „Lauksaimniecībā iestāsimies par …” dalīts 7 Solījumos: viens darbības vārds, bet septiņi atšķirīgi iznākumi, kuriem statusi var atšķirties (§1 „Dali”); citēts viss teikums, jo daļām nav sava darbības vārda (§3). Pārbaudāms robežgadījumā („iestāsimies par X” — §2; virziens ar izmērāmu objektu, analoģija ar „Ēnu ekonomiku samazināsim”): kritērijs „izpildīts” — vietējās pārtikas īpatsvars publiskajā patēriņā (piem., valsts un pašvaldību iestāžu pārtikas iepirkumos) pilnvaru beigās lielāks nekā sākumā. Avots nedefinē „vietējo pārtiku” (Latvijā ražota?), „publisko patēriņu” un rādītāju; nav pārbaudīts, vai šāds rādītājs tiek uzskaitīts — jādefinē pirms vērtēšanas. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: ZM — pārtikas politika; publiskie iepirkumi var būt arī FM kompetencē."
jautajums: ""
