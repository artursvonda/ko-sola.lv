id: as-elektribas-cenas-energoietilpigiem-uznemumiem
saraksts: as
nosaukums: Elektrības cenas samazināšana energoietilpīgiem uzņēmumiem
parbaudams: true
temas:
  galvena: energetika
  papildu: [ekonomika-un-darbs]
iestades:
  galvena: kem
  papildu: []
avoti:
  - veids: cvk
    vieta: "Enerģētikas un dabas drošībai"
    citats: "Kopā ar enerģētikas industriju meklēsim risinājumus elektrības cenas samazināšanai energoietilpīgiem uzņēmumiem"
nesakritiba: ""
piezimes: "Pārbaudāms robežgadījumā: „meklēsim risinājumus” ir vājš formulējums, bet objekts konkrēts (elektrības cena energoietilpīgiem uzņēmumiem) un virziens noteikts (samazināšana). Ieteicamais kritērijs „izpildīts”: pieņemts un ieviests vismaz viens valsts pasākums, kas samazina elektrības izmaksas energoietilpīgiem uzņēmumiem (piem., atlaide maksājumu komponentēs); tikai izstrādāts vai apspriests — „procesā”. Ekstraktors nezina, vai šādi atbalsta mehānismi jau pastāv — pirms vērtēšanas jāpārbauda sākumstāvoklis. „Kopā ar enerģētikas industriju” apraksta veidu — nav dalīts (§1). Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — enerģētikas politika."
jautajums: ""
