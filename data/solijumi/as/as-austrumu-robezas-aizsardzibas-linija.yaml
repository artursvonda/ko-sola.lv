id: as-austrumu-robezas-aizsardzibas-linija
saraksts: as
nosaukums: Austrumu robežas aizsardzības līnijas pabeigšana
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [iekseja-drosiba-un-tiesiskums]
iestades:
  galvena: am
  papildu: []
avoti:
  - veids: cvk
    vieta: "Iekšējai un ārējai drošībai"
    citats: "Pabeigsim austrumu robežas aizsardzības līniju un robežas novērošanas infrastruktūru"
nesakritiba: ""
piezimes: "Teikums dalīts (§1): aizsardzības līnija un robežas novērošanas infrastruktūra ir atsevišķi objekti ar atšķirīgām atbildīgajām iestādēm, statuss var atšķirties (otrs — as-robezas-noverosanas-infrastruktura); daļām nav sava darbības vārda — citēts viss teikums (§3). Pārbaudāms: pabeigta vai nē. AM — aizsardzības līnija (militāra pretmobilitātes infrastruktūra)."
jautajums: ""
