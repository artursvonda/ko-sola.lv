id: as-pasvaldibu-finansu-modelis
saraksts: as
nosaukums: Jauns pašvaldību finanšu modelis ar stimuliem darba vietām un investīcijām
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [nodokli-un-budzets]
iestades:
  galvena: varam
  papildu: [fm]
avoti:
  - veids: cvk
    vieta: "Reģionu, infrastruktūras un lauksaimniecības attīstībai"
    citats: "Izveidosim taisnīgāku pašvaldību finanšu modeli, kas motivēs radīt darba vietas, piesaistīt investīcijas un palielināt pašu ieņēmumus"
nesakritiba: ""
piezimes: "Palīgteikums „kas motivēs …” apraksta modeli — nav dalīts (§1). Pārbaudāms robežgadījumā: „taisnīgāku” — vērtējums, ne mērs, un modeļa saturs avotā nav nosaukts. Ieteicamais kritērijs „izpildīts”: pieņemti normatīvie akti, kas maina pašvaldību finansēšanas modeli (nodokļu ieņēmumu sadali un/vai finanšu izlīdzināšanu) un ievieš stimulus darba vietu radīšanai, investīciju piesaistei un pašu ieņēmumu palielināšanai; „taisnīgumu” nevērtē. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: VARAM — pašvaldību finanšu izlīdzināšana; FM papildu — nodokļu ieņēmumu sadale starp valsts un pašvaldību budžetiem."
jautajums: ""
