id: as-atjaunojamas-energijas-noteikumi
saraksts: as
nosaukums: Atjaunojamās enerģijas drošības, vides un pašvaldību līdzdalības noteikumi
parbaudams: true
temas:
  galvena: energetika
  papildu: [regioni-un-pasvaldibas]
iestades:
  galvena: kem
  papildu: [varam]
avoti:
  - veids: cvk
    vieta: "Enerģētikas un dabas drošībai"
    citats: "Virzīsim modulāro kodolreaktoru izpēti, atjaunojamo energoresursu attīstību ar skaidriem drošības, vides un pašvaldību līdzdalības noteikumiem, kā arī enerģijas uzkrāšanas un starpsavienojumu projektus"
nesakritiba: ""
piezimes: "Teikums „Virzīsim …” dalīts 3 Solījumos (§1 „Dali”); citēts viss teikums (§3). Solījums ir „ar skaidriem drošības, vides un pašvaldību līdzdalības noteikumiem” daļa, jo „virzīsim … attīstību” bez tās ir tikai vispārīgs virziens (§1, analoģija ar „-ot” daļu). Pārbaudāms robežgadījumā: „skaidri” nav mērāms. Ieteicamais kritērijs „izpildīts”: normatīvajos aktos noteiktas vai precizētas prasības atjaunojamo energoresursu projektiem par drošību, vidi un pašvaldību līdzdalību; tikai daļai no trim jomām — „daļēji izpildīts”. Ekstraktors nezina, kādas prasības jau pastāv — pirms vērtēšanas jāpārbauda sākumstāvoklis. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: KEM — atjaunojamo energoresursu politika; VARAM papildu — vides aizsardzība un pašvaldības."
jautajums: ""
