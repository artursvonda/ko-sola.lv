avoti:
  - veids: cvk
    vieta: "Atbildīgām investīcijām sabiedrības labumam"
    citats: "Izveidosim Latvijas Attīstības fondu, kas pārvaldītu valsts aktīvus caurredzamā veidā, bez politiķu iejaukšanās, lai celtu aktīvu vērtību"
nesakritiba: ""
piezimes: "Palīgteikums („kas pārvaldītu … caurredzamā veidā, bez politiķu iejaukšanās”) un mērķis („lai celtu aktīvu vērtību”) apraksta fondu — nav dalīts (§1). Pārbaudāms: fonds izveidots vai nē. VK — valsts kapitālsabiedrību pārvaldības koordinācijas institūcija (kopš 01.03.2023, pārņemtas PKC funkcijas); FM papildu — tās turētās kapitāla daļas un ietekme uz budžetu. Avots iestādi nenosaka; ja fonda izveidi uzdos citai iestādei, mainīt pēc Notikuma."
jautajums: ""
