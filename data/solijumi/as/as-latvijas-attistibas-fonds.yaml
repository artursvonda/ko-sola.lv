    vieta: "Atbildīgām investīcijām sabiedrības labumam"
    citats: "Izveidosim Latvijas Attīstības fondu, kas pārvaldītu valsts aktīvus caurredzamā veidā, bez politiķu iejaukšanās, lai celtu aktīvu vērtību"
nesakritiba: ""
piezimes: "Palīgteikums („kas pārvaldītu … caurredzamā veidā, bez politiķu iejaukšanās”) un mērķis („lai celtu aktīvu vērtību”) apraksta fondu — nav dalīts (§1). Pārbaudāms: fonds izveidots vai nē. Atbildīgā iestāde neskaidra: avots nenosaka; valsts aktīvi (kapitāla daļas) ir dažādu ministriju turējumā, fonda izveide ir starpnozaru (FM/EM/VK?)."
