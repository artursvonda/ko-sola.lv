avoti:
  - veids: cvk
    vieta: "Veselības un sociālajai aprūpei"
    citats: "Pakāpeniski samazināsim līdzmaksājumus bērniem, senioriem un hronisku slimību pacientiem"
nesakritiba: ""
piezimes: "Trīs grupas zem viena darbības vārda — nav dalīts (§1). Pārbaudāms: līdzmaksājumi samazināti vai nē; „pakāpeniski” — bez gala mēra, tāpēc jebkurš samazinājums visām trim grupām = „izpildīts”, daļai grupu — „daļēji izpildīts”. Avots nenosaka, kuri līdzmaksājumi domāti (kompensējamo zāļu līdzmaksājumi — teikums seko zāļu cenu teikumam — vai arī pacienta iemaksas par pakalpojumiem), nedz „senioru” vecuma robežu — jādefinē pirms vērtēšanas. VM — zāļu kompensācijas sistēma un pacientu iemaksas."
jautajums: ""
