    vieta: "Demogrāfijas, ģimeņu un sociālās drošības veicināšanai"
    citats: "Imigrāciju īstenosim kontrolēti, uzturēšanās sasaistot uzturēšanās atļaujas ar tiesisku nodarbinātību, integrāciju un latviešu valodas apguvi"
nesakritiba: ""
piezimes: "„Imigrāciju īstenosim kontrolēti” — vispārīgs; Solījums ir „-ot” daļa, citēts viss teikums (§1). Avota tekstā „uzturēšanās” atkārtojas („uzturēšanās sasaistot uzturēšanās atļaujas”) — citēts burtiski. Trīs nosacījumi zem viena darbības vārda — nav dalīti (§1). Pārbaudāms: normatīvajos aktos uzturēšanās atļauju izsniegšana/saglabāšana sasaistīta ar tiesisku nodarbinātību, integrāciju un latviešu valodas apguvi; visi trīs — „izpildīts”, daļa — „daļēji izpildīts”. Pirms vērtēšanas pārbaudīt jau spēkā esošās prasības; avots nenosaka, uz kurām uzturēšanās atļaujām (termiņuzturēšanās, pastāvīgās) attiecas, un „integrācijas” saturu — jādefinē pirms vērtēšanas. Iestāde — pieņēmums, nav pārbaudīts oficiālā avotā: IeM — imigrācijas politika un uzturēšanās atļaujas."
jautajums: ""
