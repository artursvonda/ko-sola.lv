id: jv-aizsardzibas-finansejums-5-no-ikp
saraksts: jv
nosaukums: "Aizsardzības finansējums 5% no IKP"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [nodokli-un-budzets]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Nodrošināsim aizsardzības finansējumu 5% no IKP"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "ik gadu ieguldot aizsardzībā 5% no iekšzemes kopprodukta"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Ieguldīsim 5% no iekšzemes kopprodukta valsts aizsardzībā"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nodrošināsim finansējumu iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta"
nesakritiba: "CVK: „aizsardzības finansējumu 5% no IKP“; paplašinātā 1. nodaļā pievieno „ik gadu“; 3. nodaļā cits, plašāks rādītājs un mērs: „iekšējās un ārējās drošības investīcijām vismaz 5%“."
piezimes: "Prioritāšu punkti (1. nod. „Aizsardzības spēju finansējums 5% apmērā“, 3. nod. „Iekšējās un ārējās drošības investīciju finansēšana vismaz 5%“) atkārto, nav citēti. Vērtē pēc CVK: aizsardzības finansējums 5% no IKP."
jautajums: "Vai 3. nodaļas punktu (iekšējās UN ārējās drošības investīcijas vismaz 5%) apvienot šeit kā Nesakritību, vai atstāt atsevišķam Solījumam 3. nodaļas izpildē (CVK 3. nod. „drošību finansēsim atbildīgi“)?"
