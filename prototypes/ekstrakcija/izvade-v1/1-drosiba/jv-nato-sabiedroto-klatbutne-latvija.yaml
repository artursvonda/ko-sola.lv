id: jv-nato-sabiedroto-klatbutne-latvija
saraksts: jv
nosaukums: "NATO sabiedroto pastāvīgās klātbūtnes palielināšana Latvijā"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [arpolitika]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "attīstīsim NATO sabiedroto pastāvīgu klātbūtni Latvijā"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Audzēsim NATO sabiedroto klātbūtni Latvijā"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Palielināsim NATO sabiedroto klātbūtni Latvijā"
nesakritiba: "CVK: „attīstīsim NATO sabiedroto pastāvīgu klātbūtni“ (bez mēra); paplašinātā: „Audzēsim“ / „Palielināsim“ klātbūtni (mērs — pieaugums), bez vārda „pastāvīgu“. Vērtē pēc pieauguma."
piezimes: "Robežgadījums: CVK „attīstīsim“ bez mēra, bet objekts konkrēts; mērs (pieaugums) ņemts no paplašinātās programmas (§4). Prioritāte „NATO sabiedroto klātbūtnes palielināšana Latvijā“ atkārto."
jautajums: ""
