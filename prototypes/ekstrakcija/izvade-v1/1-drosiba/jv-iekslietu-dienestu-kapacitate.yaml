id: jv-iekslietu-dienestu-kapacitate
saraksts: jv
nosaukums: "Ugunsdzēsēju, policijas un robežsardzes kapacitātes stiprināšana"
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: []
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Stiprināsim civilās aizsardzības sistēmu un iekšlietu dienestu – ugunsdzēsēju, policijas, robežsardzes kapacitāti."
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība"
    citats: "Turpināsim iekšlietu dienestu infrastruktūras modernizāciju"
nesakritiba: "CVK: „iekšlietu dienestu – ugunsdzēsēju, policijas, robežsardzes kapacitāti“; paplašinātā: „iekšlietu dienestu infrastruktūras modernizāciju“ (infrastruktūra, ne kapacitāte)."
piezimes: "Apvienots kā tas pats nodoms (iekšlietu dienestu stiprināšana). Iekšējās drošības akadēmija izdalīta atsevišķi. Prioritāte „Iekšējās drošības dienestu kapacitāte, infrastruktūra …“ atkārto."
jautajums: ""
