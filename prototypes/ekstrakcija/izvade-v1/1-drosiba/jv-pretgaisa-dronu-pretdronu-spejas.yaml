id: jv-pretgaisa-dronu-pretdronu-spejas
saraksts: jv
nosaukums: "Pretgaisa, dronu un pretdronu spēju stiprināšana, izmantojot Ukrainas pieredzi"
parbaudams: false
temas:
  galvena: aizsardziba
  papildu: []
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Stiprināsim pretgaisa, dronu un pretdronu, un citas mūsdienīgas aizsardzības spējas, izmantojot Ukrainas pieredzi"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība"
    citats: "Pārņemsim Ukrainas kaujās gūto pieredzi, attīstot pretdronu spējas un nodrošinot Latvijas iedzīvotāju un kritiskās infrastruktūras aizsardzību no bezpilota gaisa kuģu apdraudējuma"
nesakritiba: "CVK: „pretgaisa, dronu un pretdronu, un citas mūsdienīgas aizsardzības spējas“; paplašinātā: tikai „pretdronu spējas“ un pievieno „iedzīvotāju un kritiskās infrastruktūras aizsardzību no bezpilota gaisa kuģu apdraudējuma“."
piezimes: "Uzskaitījums zem viena darbības vārda — nedala (§1). „Stiprināsim“ + spējas bez mēra → nepārbaudāms. Prioritāte „Ukrainas kara pieredzē balstītas pretdronu spējas…“ atkārto."
jautajums: ""
