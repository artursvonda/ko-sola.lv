<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekstrakcijas pārskats</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#dde2e8;--acc:#2a4a70;--hi:#fff1b8;--hi2:#ffd94d;--bad:#c8372d;--ok:#2f7d4f;--nv:#8a5a00}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header b{font-size:15px}.proto{background:#ffe3e0;color:var(--bad);font-weight:600;padding:2px 8px;border-radius:4px;font-size:12px}
.stat{color:var(--mut)}.stat strong{color:var(--ink)}
.f{display:flex;gap:6px;flex-wrap:wrap}.f button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}.f button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 54px)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}.col{height:auto!important}}
.col{overflow:auto;height:100%;padding:12px 16px}.col+.col{border-left:1px solid var(--line)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 0 6px}
.u{padding:4px 8px;margin:2px 0;border-left:3px solid transparent;border-radius:2px;cursor:pointer}
.u.h{font-weight:600;margin-top:10px;cursor:default}.u.b::before{content:"• ";color:var(--mut)}
.u.miss{border-left-color:var(--bad);background:#fff5f4}.u.skip{color:var(--mut)}
.u.cov{border-left-color:var(--ok)}.u.act{background:var(--hi)}
mark{background:var(--hi);padding:0 1px}.u.act mark.me{background:var(--hi2)}
.chips{display:inline-flex;gap:3px;margin-left:4px}.chip{font:11px ui-monospace,monospace;background:#e9eef5;color:var(--acc);border-radius:3px;padding:0 4px}
.s{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 10px}
.s.act{outline:2px solid var(--hi2)}
.s .t{font-weight:600;font-size:15px}.s .id{font:11px ui-monospace,monospace;color:var(--mut)}
.tag{display:inline-block;font-size:11px;border-radius:3px;padding:1px 6px;margin-right:4px;border:1px solid var(--line)}
.tag.p{color:var(--ok);border-color:#b8dcc6}.tag.np{color:var(--nv);border-color:#e8d2a6;background:#fff8ea}
.tag.gal{background:#e9eef5;border-color:#e9eef5;color:var(--acc)}
.q{margin:6px 0 0;padding-left:8px;border-left:2px solid var(--line);font-size:13px}.q .src{font-size:11px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:6px}.ask{font-size:12px;color:var(--bad);margin-top:6px}
.fb{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}.fb button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:2px 6px;cursor:pointer}
.fb button.on{background:var(--ink);color:#fff}.fb input{flex:1;min-width:120px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 6px}
details{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px}pre{white-space:pre-wrap;font-size:12px}
.bad{background:#ffe3e0;color:var(--bad);padding:6px 10px;border-radius:6px;margin-bottom:10px}
#copy{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:4px;padding:5px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="proto">PROTOTIPS</span><b id="ttl"></b>
  <span class="stat" id="stats"></span>
  <div class="f" id="filt"></div>
  <button id="copy">Kopēt atsauksmi</button>
</header>
<main>
  <section class="col" id="src"></section>
  <section class="col" id="list"></section>
</main>
<script>
const D={"title": "JV · 3. Finanses", "sol": [{"id": "jv-akcize-saldinatiem-dzerieniem", "saraksts": "jv", "nosaukums": "Augstāka akcīze saldinātiem dzērieniem un produktiem ar augstu cukura saturu", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["veseliba"]}, "avoti": [{"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "pakāpeniski palielinot akcīzi saldinātiem dzērieniem un atsevišķiem produktiem ar augstu cukura saturu"}], "nesakritiba": "", "piezimes": "Tikai paplašinātā programma. Palīgteikums ar «-ot» nosauc konkrētu darbību ar savu iznākumu → atsevišķs Solījums (§1). 5. nodaļas punkts par akcīzes ieņēmumu daļas novirzīšanu veselībai ir cita darbība (CVK 5. nodaļa), nav apvienots.", "jautajums": ""}, {"id": "jv-budzets-eirozonas-fiskalie-noteikumi", "saraksts": "jv", "nosaukums": "Budžets atbilstoši eirozonas fiskālajiem noteikumiem", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": []}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Veidosim fiskāli atbildīgu valsts budžeta politiku saskaņā ar eirozonas ekonomiskās pārvaldības un fiskālās politikas noteikumiem"}], "nesakritiba": "CVK «fiskāli atbildīgu budžetu … ievērojot eirozonas fiskālos noteikumus»; paplašinātā «budžeta politiku saskaņā ar eirozonas ekonomiskās pārvaldības un fiskālās politikas noteikumiem» (plašāks noteikumu loks).", "piezimes": "Robežgadījums: «fiskāli atbildīgs» pats par sevi nav mērs, bet atbilstība eirozonas fiskālajiem noteikumiem ir pārbaudāma (noteikumi ievēroti vai nē). Citēts viss CVK teikums (sk. jv-valsts-arejais-parads-zem-55-ikp). Prioritāte par fiskāli atbildīgu budžeta politiku atkārto apņemšanos.", "jautajums": ""}, {"id": "jv-drosibas-finansejums-5-no-ikp", "saraksts": "jv", "nosaukums": "Iekšējās un ārējās drošības investīcijas vismaz 5% no IKP", "parbaudams": true, "temas": {"galvena": "aizsardziba", "papildu": ["iekseja-drosiba-un-tiesiskums", "nodokli-un-budzets"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Rūpējoties par valsts nākotni, drošību finansēsim atbildīgi"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Nodrošināsim finansējumu iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta"}], "nesakritiba": "CVK bez mēra («drošību finansēsim atbildīgi»); paplašinātā «iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta». Vērtē pēc paplašinātās mēra (5% no IKP).", "piezimes": "CVK teikumā nav mēra, tāpēc pēc §4 vērtē pēc paplašinātās programmas mēra; līdz ar to pārbaudāms. Prioritāte «Iekšējās un ārējās drošības investīciju finansēšana vismaz 5%» atkārto apņemšanos.", "jautajums": "CVK 1. nodaļā ir «Nodrošināsim aizsardzības finansējumu 5% no IKP» (paplašinātā 1. un 2. nodaļā — «ieguldot aizsardzībā 5%», «Ieguldīsim 5% … valsts aizsardzībā»). Vai šis (iekšējā + ārējā drošība, 5%) ir tas pats nodoms un 1. nodaļas izpildē jāapvieno, vai atsevišķs Solījums ar citu rādītāju?"}, {"id": "jv-iin-sadale-pasvaldibam-80-20", "saraksts": "jv", "nosaukums": "IIN sadale pašvaldībām: 80% pēc dzīvesvietas, 20% pēc darbavietas", "parbaudams": true, "temas": {"galvena": "regioni-un-pasvaldibas", "papildu": ["nodokli-un-budzets"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Veidosim taisnīgu un uzņēmējdarbību veicinošu nodokļu ieņēmumu sadali starp pašvaldībām un valsti"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Ieviesīsim līdzsvarotu iedzīvotāju ienākuma nodokļa sadali starp pašvaldībām, novirzot 80% pašvaldības budžetā pēc iedzīvotāja deklarētās dzīvesvietas un 20% atbilstoši darbavietai"}], "nesakritiba": "Cits objekts: CVK — «nodokļu ieņēmumu sadali starp pašvaldībām un valsti» (bez mēra); paplašinātā — IIN sadale «starp pašvaldībām», «80% … pēc … dzīvesvietas un 20% atbilstoši darbavietai». Vērtē pēc paplašinātās mēra (80/20).", "piezimes": "Apvienots, jo paplašinātās prioritāte («līdzsvarots IIN sadales modelis pašvaldībām») un CVK «uzņēmējdarbību veicinošu» norāda uz to pašu nodomu (darbavietas daļa). Prioritāte atkārto apņemšanos.", "jautajums": "CVK runā par sadali starp pašvaldībām un valsti (vertikāli), paplašinātā — par IIN sadali starp pašvaldībām (horizontāli, dzīvesvieta/darbavieta). Vai tas tiešām ir viens nodoms, vai CVK teikums jāizraksta kā atsevišķs Nepārbaudāms Solījums?"}, {"id": "jv-kapitala-pieauguma-nodokla-samazinasana", "saraksts": "jv", "nosaukums": "Kapitāla pieauguma nodokļa samazināšana", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["ekonomika-un-darbs"]}, "avoti": [{"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Samazināsim kapitāla pieauguma nodokli līdz konkurētspējīgām likmēm reģionā"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Samazināsim kapitāla pieauguma nodokli, veicinot investīcijas un uzkrājumus"}], "nesakritiba": "Pirmajā punktā «līdz konkurētspējīgām likmēm reģionā»; otrajā punktā bez mēra.", "piezimes": "Tikai paplašinātā programma; tas pats saturs atkārtojas divos 3. nodaļas punktos → viens Solījums ar 2 citātiem (§1). Pārbaudāms: likme samazināta vai nē («konkurētspējīgas likmes reģionā» nav skaitlisks mērs). Otrā punkta palīgteikums par akcīzi izrakstīts atsevišķi (jv-akcize-saldinatiem-dzerieniem).", "jautajums": ""}, {"id": "jv-kapitala-tirgus-attistiba", "saraksts": "jv", "nosaukums": "Kapitāla tirgus attīstība", "parbaudams": false, "temas": {"galvena": "ekonomika-un-darbs", "papildu": []}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Attīstīsim kapitāla tirgu un valsts attīstības fondu"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Veicināsim Latvijas kapitāla tirgus attīstību"}], "nesakritiba": "CVK «Attīstīsim kapitāla tirgu»; paplašinātā vājāk — «Veicināsim … kapitāla tirgus attīstību».", "piezimes": "Virziena deklarācija bez mēra. Konkrētās darbības no tā paša paplašinātās punkta izrakstītas atsevišķi: jv-valsts-attistibas-fonds, jv-kapitalsabiedribu-akciju-kotacija-birza, jv-kapitala-tirgus-sasaiste-depozitarijiem. CVK teikumā «valsts attīstības fondu» nav sava darbības vārda — citēts viss teikums. Prioritāte «Kapitāla tirgus attīstība, vietējā kapitāla aktivizēšana» atkārto apņemšanās.", "jautajums": ""}, {"id": "jv-kapitala-tirgus-sasaiste-depozitarijiem", "saraksts": "jv", "nosaukums": "Baltijas kapitāla tirgus sasaiste ar Eiropas depozitārijiem", "parbaudams": true, "temas": {"galvena": "ekonomika-un-darbs", "papildu": []}, "avoti": [{"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "nodrošināsim Baltijas kapitāla tirgus sasaisti ar Eiropas depozitārijiem"}], "nesakritiba": "", "piezimes": "Tikai paplašinātā programma — jauna, atsevišķi izvērtējama darbība (§4).", "jautajums": ""}, {"id": "jv-kapitalsabiedribu-akciju-kotacija-birza", "saraksts": "jv", "nosaukums": "Valsts kapitālsabiedrību akciju kotācija biržā (līdz 25%)", "parbaudams": true, "temas": {"galvena": "ekonomika-un-darbs", "papildu": ["valsts-parvalde"]}, "avoti": [{"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "virzīsim valsts kapitālsabiedrību akciju kotāciju biržā (līdz 25%)"}, {"veids": "paplasinata", "vieta": "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas", "citats": "Izvērtēsim iespēju veikt valsts kapitālsabiedrību daļēju kotāciju biržā, saglabājot valsts kontroli"}], "nesakritiba": "3. nodaļā «virzīsim … akciju kotāciju biržā (līdz 25%)»; 4. nodaļā vājāk — «Izvērtēsim iespēju veikt … daļēju kotāciju biržā, saglabājot valsts kontroli» (tikai izvērtējums, bez 25% mēra).", "piezimes": "Tikai paplašinātā programma — jauna, atsevišķi izvērtējama darbība, ko CVK neatsevišķo (§4). Abas vietas ir viens nodoms; CVK citāta nav, tāpēc kā vērtēšanas mērs pieņemts 3. (Finanšu) nodaļas formulējums ar 25%.", "jautajums": ""}, {"id": "jv-minimala-alga-50-videjas", "saraksts": "jv", "nosaukums": "Minimālā alga 50% no vidējās bruto darba samaksas", "parbaudams": true, "temas": {"galvena": "ekonomika-un-darbs", "papildu": ["nodokli-un-budzets"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Celsim minimālo algu līdz 50% no vidējās bruto darba samaksas"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Paaugstināsim minimālās darba algas līmeni, virzoties uz mērķi sasniegt 50% no vidējās bruto darba samaksas valstī"}, {"veids": "paplasinata", "vieta": "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas", "citats": "Palielināsim vidējo darba algu valstī līdz 2500 eiro un minimālo algu līdz 1250 eiro"}, {"veids": "paplasinata", "vieta": "5. Veselība, labklājība un demogrāfija › Apņemšanās un uzdevumi › Labklājība un vecuma pensiju sistēma", "citats": "Palielināsim vidējo darba algu valstī līdz 2500 eiro un minimālo algu līdz 1250 eiro"}], "nesakritiba": "CVK sola celt līdz 50%; paplašinātās 3. nodaļā — tikai «virzoties uz mērķi sasniegt 50%»; 4. un 5. nodaļā cits rādītājs — «minimālo algu līdz 1250 eiro» (absolūta summa). Vērtē pēc CVK (50% no vidējās).", "piezimes": "Paplašinātās 4. un 5. nodaļas punkts atkārtojas vārds vārdā; tā vidējās algas daļa (2500 eiro) ir atsevišķs Solījums, kas pieder CVK 4. nodaļai — šeit izmantota tikai minimālās algas daļa. 4. nodaļas prioritāte «minimālās algas pieaugums līdz 1250 eiro» atkārto apņemšanos.", "jautajums": ""}, {"id": "jv-neapliekamais-minimums-80-minimalas-algas", "saraksts": "jv", "nosaukums": "Neapliekamais minimums 80% no minimālās algas", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["ekonomika-un-darbs"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "palielināsim fiksēto neapliekamo minimumu līdz 80% no minimālās algas"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Palielināsim fiksēto neapliekamo minimumu līdz 80% no minimālās darba algas"}], "nesakritiba": "Mērs sakrīt; atšķiras tikai mērķa palīgteikums: CVK «mazinot darbaspēka nodokļu slogu», paplašinātā «būtiski samazinot darbaspēka nodokļu slogu».", "piezimes": "Palīgteikums «mazinot darbaspēka nodokļu slogu zemāko ienākumu saņēmējiem» apraksta mērķi, nav atsevišķs Solījums (§1). Prioritāte par darbaspēka nodokļu sloga mazināšanu, ceļot minimālo algu un neapliekamo minimumu, atkārto apņemšanās.", "jautajums": ""}, {"id": "jv-nin-pilnvertigs-pasvaldibu-nodoklis", "saraksts": "jv", "nosaukums": "Nekustamā īpašuma nodoklis kā pilnvērtīgs pašvaldību nodoklis", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["regioni-un-pasvaldibas", "majokli"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Padarīsim nekustamā īpašuma nodokli par pilnvērtīgu pašvaldību nodokli ar prognozējamību un sociālo taisnīgumu"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Pārveidosim nekustamā īpašuma nodokli kā pilnvērtīgu pašvaldību nodokli, paplašinot pašvaldību tiesības lemt par nodokļa likmēm"}], "nesakritiba": "CVK nepasaka, ko nozīmē «pilnvērtīgs pašvaldību nodoklis»; paplašinātā precizē — «paplašinot pašvaldību tiesības lemt par nodokļa likmēm». Vērtē pēc šī mēra.", "piezimes": "Robežgadījums granularitātē: «paplašinot pašvaldību tiesības lemt par nodokļa likmēm» nosauc konkrētu darbību, bet tā ir pati «pilnvērtīga pašvaldību nodokļa» būtība, tāpēc nav dalīts — izmantots kā mērs (§4). «Prognozējamība un sociālais taisnīgums» ir nemērāmi pavadošie nosacījumi.", "jautajums": ""}, {"id": "jv-pvn-izvertejums-edinasanas-nozarei", "saraksts": "jv", "nosaukums": "Samazinātas PVN likmes izvērtējums restorānu un ēdināšanas nozarei", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["ekonomika-un-darbs"]}, "avoti": [{"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Izvērtēsim samazinātu pievienotās vērtības nodokļa likmi restorānu un ēdināšanas nozarei"}], "nesakritiba": "", "piezimes": "Tikai paplašinātā programma. Pārbaudāms kā izvērtējums (notika vai nē), ne kā likmes samazinājums (§2).", "jautajums": ""}, {"id": "jv-valsts-arejais-parads-zem-55-ikp", "saraksts": "jv", "nosaukums": "Valsts ārējā parāda līmenis zem 55% no IKP", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": []}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Nepārsniegsim valsts parāda līmeni virs 55% no iekšzemes kopprodukta"}], "nesakritiba": "Cits rādītājs: CVK «valsts ārējā parāda līmeni zem 55% no IKP», paplašinātā «valsts parāda līmeni virs 55%» (kopējais valsts parāds, ne ārējais). Vērtē pēc CVK (ārējais parāds).", "piezimes": "CVK teikums aptver 2 Solījumus (parāda līmenis; eirozonas fiskālie noteikumi) bez atsevišķa darbības vārda, tāpēc citēts viss teikums. Paplašinātā tos sadala 2 punktos (§4). Prioritāte «Valsts parāda līmeņa nepalienāšana virs 55%» atkārto apņemšanos.", "jautajums": ""}, {"id": "jv-valsts-attistibas-fonds", "saraksts": "jv", "nosaukums": "Valsts attīstības fonds lielo valsts kapitālsabiedrību pārvaldībai", "parbaudams": true, "temas": {"galvena": "ekonomika-un-darbs", "papildu": ["valsts-parvalde"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Attīstīsim kapitāla tirgu un valsts attīstības fondu"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai"}], "nesakritiba": "CVK «Attīstīsim … valsts attīstības fondu» (bez funkcijas un bez izveides apņemšanās); paplašinātā «dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai». Vērtē pēc paplašinātās (fonda izveide ar šo funkciju).", "piezimes": "Pārbaudāms: iestādes izveide. Palīgteikums ar «dibinot» nosauc konkrētu darbību ar savu iznākumu → atsevišķs Solījums (§1).", "jautajums": "Paplašinātās 4. nodaļā: «Mainīsim valsts kapitālsabiedrību pārvaldības modeli, nododot atsevišķu uzņēmumu pārvaldības uzdevumu vairākām ministrijām» — tas šķiet pretējs «vienotai pārvaldībai» fondā. Vai tas ir tas pats nodoms (VKS pārvaldības reforma) un jāpievieno kā avots ar nesakritību, vai atsevišķs Solījums 4. nodaļas izpildē?"}], "cvk": [{"k": "h", "t": "3. Finanses", "ids": []}, {"k": "s", "t": "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus.", "ids": ["jv-budzets-eirozonas-fiskalie-noteikumi", "jv-valsts-arejais-parads-zem-55-ikp"], "q": [[0, 120, "jv-budzets-eirozonas-fiskalie-noteikumi"], [0, 120, "jv-valsts-arejais-parads-zem-55-ikp"]]}, {"k": "s", "t": "Rūpējoties par valsts nākotni, drošību finansēsim atbildīgi.", "ids": ["jv-drosibas-finansejums-5-no-ikp"], "q": [[0, 59, "jv-drosibas-finansejums-5-no-ikp"]]}, {"k": "s", "t": "Celsim minimālo algu līdz 50% no vidējās bruto darba samaksas, palielināsim fiksēto neapliekamo minimumu līdz 80% no minimālās algas, mazinot darbaspēka nodokļu slogu zemāko ienākumu saņēmējiem.", "ids": ["jv-minimala-alga-50-videjas", "jv-neapliekamais-minimums-80-minimalas-algas"], "q": [[0, 61, "jv-minimala-alga-50-videjas"], [63, 132, "jv-neapliekamais-minimums-80-minimalas-algas"]]}, {"k": "s", "t": "Padarīsim nekustamā īpašuma nodokli par pilnvērtīgu pašvaldību nodokli ar prognozējamību un sociālo taisnīgumu.", "ids": ["jv-nin-pilnvertigs-pasvaldibu-nodoklis"], "q": [[0, 110, "jv-ni b", "t": "Turpināsim visaptverošu atbalstu Ukrainai, tostarp militāro atbalstu vismaz 0,25% no iekšzemes kopprodukta gadā, un atbalstīsim Ukrainas eiroatlantisko integrāciju", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Konsekventi uzturēsim prasību, lai agresors maksātu pilnu cenu par pastrādātajiem noziegumiem – iestājoties par Krievijas vājināšanu un izolāciju, starptautisko taisnīgumu, pastiprinot starptautisko spiedienu un Eiropas Savienības un nacionālās sankcijas", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim tehnoloģisko pārākumu, Latviju kā inovāciju laboratoriju ar pieejamu valsts, ES, NATO un citu finansējumu, īpašu uzmanību pievēršot autonomo sistēmu tehnoloģijām, 5G un 6G risinājumiem, elektroniskajai karadarbībai un pretgaisa aizsardzības sistēmām", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim starptautisko tiesisko kārtību atbilstoši ANO Statūtiem, īstenojot mūsu vērtības un intereses rīcībā ANO, tās Drošības padomē, citās starptautiskajās organizācijās un divpusējās attiecībās, veicinot globālās drošības stiprināšanu, iestājoties par taisnīga un ilgtspējīga miera panākšanu Ukrainā, Tuvajos Austrumos un citviet", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "h", "t": "Iekšējā drošība un civilā aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim civilās aizsardzības pilnveidi visā Latvijā. Pielāgosim esošās un veidosim jaunas patvertnes, stiprināsim iedzīvotāju un pašvaldību iesaisti civilās aizsardzības mācībās un informācijas apritē, kā arī pilnveidosim sirēnu tīkla attīstību", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Pārņemsim Ukrainas kaujās gūto pieredzi, attīstot pretdronu spējas un nodrošinot Latvijas iedzīvotāju un kritiskās infrastruktūras aizsardzību no bezpilota gaisa kuģu apdraudējuma", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim jaunu valsts materiālo rezervju sistēmu, balstītu uz vienas aģentūras principu", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim stingrākus noteikumus trešo valstu pilsoņu uzturēšanās atļauju izsniegšanai un uzturēšanās procesam Latvijā, īpaši studiju un nodarbinātības jomā", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Iestāsimies par lielāka Eiropas Savienības finansējuma pieejamību austrumu robežas un reģiona drošībai", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim robežas drošību, veidojot sinhronu Nacionālo bruņoto spēku un Valsts robežsardzes spēju attīstību", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Nacionālos bruņotos spēkus un Zemessardzi. Palielināsim apmaksāto brīvdienu skaitu zemessargiem", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim iekšlietu dienestu infrastruktūras modernizāciju, attīstīsim Iekšējās drošības akadēmijas kapacitāti, motivējot jauniešus uzsākt un turpināt dienestu iekšlietu sistēmā", "sect": "Apņemšanās un uzdevumi", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Stipras valsts pirmais pienākums ir sargāt savus cilvēkus, teritoriju, demokrātisko iekārtu un spēju rīkoties krīzes brīdī. Latvija atrodas Eiropas un NATO austrumu robežā, tādēļ mūsu drošību nosaka gan ticama militārā atturēšana un sabiedroto klātbūtne, gan valsts institūciju, pašvaldību, uzņēmumu un iedzīvotāju kopēja gatavība. Aizsardzības finansējums, pretdronu un pretgaisa spējas, droša robeža, patvertnes, materiālās rezerves un spēcīgi iekšējās drošības dienesti veido vienotu sistēmu, kurā katram posmam ir skaidra atbildība.", "sect": "Pamatojums", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "p", "t": "Ukrainas pieredze apliecina tehnoloģiju, ātras mācīšanās un sabiedrības noturības izšķirošo nozīmi. Tādēļ drošības ieguldījumi vienlaikus jāizmanto Latvijas zinātnes, militārās industrijas, kritiskās infrastruktūras un cilvēkresursu attīstībai. Mums vajadzīga Latvija, kas nevis baidās no krīzēm, bet ir tām soli priekšā, stiprina NATO un pati dod reālu ieguldījumu Eiropas kopējai drošībai.", "sect": "Pamatojums", "ch": "1. Drošība un aizsardzība", "ids": [], "scope": false}, {"k": "h", "t": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Nostiprināsim Latviju Eiropas un NATO kodolā kā drošu, brīvu un konkurētspējīgu valsti. Turpināsim visaptverošu politisku, militāru un diplomātisku atbalstu Ukrainai līdz taisnīgam mieram un Ukrainas eiroatlantiskajai integrācijai. Uzturēsim starptautisko spiedienu pret Krieviju, stiprināsim sankcijas un pārtrauksim ekonomisko ietekmējamību no Krievijas un Baltkrievijas. ES daudzgadu budžeta sarunās aizstāvēsim finansējumu drošībai, robežai, kohēzijai, lauksaimniecībai, «Rail Baltica», pētniecībai un inovācijām. Veicināsim Latvijas uzņēmēju ieiešanu ārvalstu tirgos, ES konkurētspēju un regulējuma vienkāršošanu. Stiprināsim diasporas saikni ar Latviju, veicināsim pilsoņu atgriešanos Latvijā, latviešu valodas un kultūras saglabāšanu, diasporas iesaisti ekonomiskajā diplomātijā.", "sect": "10 000 zīmju programmas apsolījums", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Latvija Eiropas kodolā: droša, brīva, eiropeiska, moderna un konkurētspējīga valsts, kuras pamatā ir latviešu valoda, kultūra, demokrātiskās vērtības un aktīva sabiedrības līdzdalība", "sect": "Prioritātes", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Visaptverošs atbalsts Ukrainai, Krievijas vājināšana, izolācija un starptautiskā tiesiskuma stiprināšana", "sect": "Prioritātes", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "ES ekonomiskās drošības, konkurētspējas un Latvijas uzņēmēju ieiešanas ārējos tirgos veicināšana", "sect": "Prioritātes", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Latvijas interešu aizstāvība Eiropas Savienības daudzgadu budžetā, prezidentūrā Eiropas Savienības Padomē un starptautiskajās organizācijās", "sect": "Prioritātes", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Pasaules latviešu ilgtermiņa saikne ar Latviju, remigrācija, latviešu valoda, kultūra un ekonomiskā diplomātija", "sect": "Prioritātes", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "h", "t": "Apņemšanās un uzdevumi", "ids": [], "scope": false}, {"k": "h", "t": "Ārējā drošība", "ids": [], "scope": false}, {"k": "b", "t": "Ieguldīsim 5% no iekšzemes kopprodukta valsts aizsardzībā, attīstot pašmāju militāro industriju un tehnoloģijas kopā ar tuvākajiem sabiedrotajiem", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim NATO sabiedroto klātbūtni Latvijā", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim visaptverošu atbalstu Ukrainai, tostarp Krievijas vājināšanu un izolāciju, pastiprinot starptautisko spiedienu, Eiropas Savienības un nacionālās sankcijas", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Nostiprināsim Latviju Eiropas kodolā, audzēsim Eiropas Savienības ekonomisko drošību un konkurētspēju pasaulē", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Gādāsim par Latvijas uzņēmēju mērķtiecīgu ieiešanu ārvalstu tirgos, sekmējot Eiropas Savienības brīvās tirdzniecības līgumu iespēju izmantošanu un jaunu līgumu slēgšanu", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Pārtrauksim preču un pakalpojumu importu un eksportu ar Krieviju un Baltkrieviju", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim iestāties par Latvijas interesēm un konkurētspēju Eiropas Savienības daudzgadu budžeta sarunās, nodrošinot nepieciešamo finansējumu drošībai un aizsardzībai, kohēzijai, lauksaimniecībai, «Rail Baltica», rūpniecības, tehnoloģiju, inovāciju un pētniecības attīstībai", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Īstenosim sekmīgu Latvijas prezidentūru Eiropas Savienības Padomē, izmantojot iespējas Latvijas atpazīstamības stiprināšanai", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim aktīvu sabiedrības iesaisti un līdzdalību ārpolitikā", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Sekmēsim diasporas ilgtermiņa saikni ar Latviju, remigrāciju, stiprinot latviešu valodu un kultūru kā vienojošu pamatu", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Aizstāvēsim Latvijas vērtības un latviešu valodu, cīnoties pret Krievijas dezinformāciju un apmelojumiem starptautiskajās organizācijās un tiesās", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "h", "t": "Latvija Eiropas kodolā: izaugsme un konkurētspēja", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim Eiropas Savienības spēku un konkurētspēju, pilnveidojot vienoto tirgu, stiprinot rūpniecību un inovāciju ekosistēmu, attīstot Eiropas izcilību jaunajās tehnoloģijās, tai skaitā mākslīgā intelekta un kvantu tehnoloģijās, kā arī vienkāršojot regulējumu, procedūras un mazinot šķēršļus Eiropas Savienības iekšienē", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Eiropas Savienības un Latvijas ekonomisko drošību, dažādojot eksporta tirgus, slēdzot jaunus brīvās tirdzniecības līgumus un veidojot jaunas ekonomiskās un izejvielu partnerības; veicināsim straujāku Eiropas enerģētisko neatkarību", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim atbalstīt Latvijas eksportējošos uzņēmējus, veicinot ārvalstu investīciju piesaisti un sekmējot ieiešanu perspektīvajos tirgos, īpaši Āzijā, Līča reģionā, Āfrikā un Dienvidamerikā", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Pilnībā pārtrauksim preču un pakalpojumu importu un eksportu ar Krieviju un Baltkrieviju", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Paātrināsim Eiropas Savienības tiesiskā regulējuma vienkāršošanu, atbrīvojot mūsu uzņēmumu potenciālu, uzlabojot uzņēmējdarbības vidi un veicinot konkurētspēju, samazinot administratīvo slogu vismaz par 25%, īpaši mazajiem un vidējiem uzņēmumiem", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim iestāties par Latvijas interesēm un konkurētspēju Eiropas Savienības daudzgadu budžeta sarunās, nodrošinot nepieciešamo finansējumu drošībai un aizsardzībai, kohēzijai, lauksaimniecībai, «Rail Baltica», rūpniecības, tehnoloģiju, inovāciju un pētniecības attīstībai", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Panāksim turpmāku Eiropas Savienības aktīvu atbalstu un finansējumu ārējo robežu aizsardzībai un pierobežas reģionu attīstībai", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Atbalstīsim Ukrainas un Moldovas iestāšanos Eiropas Savienībā, izpildot iestāšanās kritērijus, īstenojot Eiropas Savienības integrācijai nepieciešamās reformas un stiprinot noturību pret Krievijas hibrīdapdraudējumiem", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "p", "t": "Sabiedrības iesaiste, noturība un atbalsts cilvēkiem; diasporas potenciāla izmantošana", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim sabiedrības noturību un līdzdalību cīņā pret Krievijas un citu totalitāru valstu īstenotu informācijas manipulāciju un iejaukšanos demokrātiskajos procesos", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Nelokāmi aizstāvēsim Latvijas valsti, vērtības un latviešu valodu, cīnoties pret Krievijas dezinformāciju un apmelojumiem starptautiskajās organizācijās un tiesās", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim diasporas ilgtermiņa saikni ar Latviju, stiprinot latviešu valodu, kultūru un nacionālo identitāti kā vienojošu pamatu", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Sekmēsim remigrāciju, mobilitāti un iekļaušanos izglītības sistēmā, turpinot mērķtiecīgu sadarbību ar diasporas kopienām, attīstot pilsoniskās līdzdalības iespējas un vienkāršojot procesus valsts un pašvaldību līmenī", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Paplašināsim atbalstu diasporas iesaistei izglītībā, kultūrā un sabiedriskajā dzīvē, attīstīsim līdzdalības iespējas valsts izglītības sistēmā, darba tirgū un valsts aizsardzības dienestā, veicinot investīcijas Latvijas ekonomikā", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Latvijas klātbūtni pasaulē, veicinot diasporas iesaisti ekonomiskajā diplomātijā, paplašinot diplomātisko pārstāvniecību tīklu un paaugstinot ārlietu dienesta profesionālo kapacitāti", "sect": "Apņemšanās un uzdevumi", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Latvijas drošība, labklājība un starptautiskā ietekme ir cieši saistīta ar mūsu spēju būt aktīvai Eiropas Savienības un NATO kodola valstij. Ārpolitikai jāpanāk, lai Latvijas intereses būtu savlaicīgi pārstāvētas lēmumos par drošību, Eiropas budžetu, enerģētiku, konkurētspēju, ārējo robežu un paplašināšanos. Konsekvents atbalsts Ukrainai, spiediens pret agresorvalsti un starptautiskās tiesiskās kārtības aizsardzība stiprina arī Latvijas pašas drošības garantijas.", "sect": "Pamatojums", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "p", "t": "Vienlaikus ārpolitika ir praktisks izaugsmes instruments. Ekonomiskā diplomātija, jauni eksporta tirgi, investīciju piesaiste un Latvijas uzņēmēju klātbūtne pasaulē palielina valsts noturību. Diaspora šajā darbā ir Latvijas zināšanu, kontaktu, valodas un kultūras tīkls pasaulē. Mēs gribam uzturēt dzīvu saikni ar tautiešiem ārvalstīs, atvieglot remigrāciju un izmantot diasporas pieredzi Latvijas attīstībai, veidojot stipru Latviju stiprā Eiropā.", "sect": "Pamatojums", "ch": "2. Ārpolitika un latvieši pasaulē", "ids": [], "scope": false}, {"k": "h", "t": "3. Finanses", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus. Rūpējoties par valsts nākotni, drošību finansēsim atbildīgi. Celsim minimālo algu līdz 50% no vidējās bruto darba samaksas, palielināsim fiksēto neapliekamo minimumu līdz 80% no minimālās algas, mazinot darbaspēka nodokļu slogu zemāko ienākumu saņēmējiem. Padarīsim nekustamā īpašuma nodokli par pilnvērtīgu pašvaldību nodokli ar prognozējamību un sociālo taisnīgumu. Attīstīsim kapitāla tirgu un valsts attīstības fondu. Veidosim taisnīgu un uzņēmējdarbību veicinošu nodokļu ieņēmumu sadali starp pašvaldībām un valsti.", "sect": "10 000 zīmju programmas apsolījums", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Fiskāli atbildīga budžeta politika, ievērojot eirozonas ekonomiskās pārvaldības un fiskālās politikas noteikumus", "sect": "Prioritātes", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "b", "t": "Iekšējās un ārējās drošības investīciju finansēšana vismaz 5% no iekšzemes kopprodukta", "sect": "Prioritātes", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "b", "t": "Valsts parāda līmeņa nepalienāšana virs 55% no iekšzemes kopprodukta", "sect": "Prioritātes", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "b", "t": "Darbaspēka nodokļu sloga mazināšana zemāko ienākumu saņēmējiem, ceļot minimālo algu un neapliekamo minimumu", "sect": "Prioritātes", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "b", "t": "Kapitāla tirgus attīstība, vietējā kapitāla aktivizēšana un līdzsvarots IIN sadales duktiem ar augstu cukura saturu", "sect": "Apņemšanās un uzdevumi", "ch": "3. Finanses", "ids": ["jv-akcize-saldinatiem-dzerieniem", "jv-kapitala-pieauguma-nodokla-samazinasana"], "q": [[77, 179, "jv-akcize-saldinatiem-dzerieniem"], [0, 75, "jv-kapitala-pieauguma-nodokla-samazinasana"]], "scope": true}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Atbildīga finanšu politika ir valsts rīcībspējas un sabiedrības uzticēšanās pamats. Latvijai jāspēj ilgstoši finansēt drošību, veselību, izglītību, infrastruktūru un izaugsmi, saglabājot stabilu parāda līmeni un spēju reaģēt uz nākamajām krīzēm. Budžeta disciplīna šajā programmā nozīmē skaidras prioritātes, pārbaudāmus rezultātus un publisko līdzekļu novirzīšanu jomām, kas palielina valsts drošību, produktivitāti un cilvēku dzīves kvalitāti.", "sect": "Pamatojums", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "p", "t": "Nodokļu sistēmai jābūt prognozējamai, sociāli taisnīgai un izaugsmi veicinošai. Darbaspēka nodokļu sloga mazināšana zemāko ienākumu saņēmējiem stiprina strādājošo labklājību, savukārt kapitāla tirgus attīstība un vietējā kapitāla aktivizēšana dod uzņēmumiem iespēju augt Latvijā. Līdzsvarotāks ieņēmumu sadalījums pašvaldībām palīdz sasaistīt nodokļu politiku ar darbavietu, mājokļu un pakalpojumu attīstību visā valstī.", "sect": "Pamatojums", "ch": "3. Finanses", "ids": [], "scope": true}, {"k": "h", "t": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Mērķis ir produktīvākā ekonomika Baltijā: vismaz 3,5% IKP izaugsme gadā, augstākā darba samaksa, investīcijas virs 30% no IKP un pāreja uz augstas pievienotās vērtības ekonomiku. Attīstīsim pieejamu, drošu un prognozējamu enerģiju, jaunas elektroenerģijas jaudas, tīklus, uzkrāšanas risinājumus, energoefektivitāti, satiksmes un siltuma elektrifikāciju. Veidosim paātrinātus investīciju koridorus enerģētikā, aizsardzībā, mākslīgajā intelektā un citās stratēģiskās nozarēs, stiprinot LIAA kā vienas pieturas aģentūru. Mērķēti atbalstīsim eksportspējīgus uzņēmumus, industriālos parkus, zinātņietilpīgus produktus, kapitāla tirgu un valsts pasūtījumu kā instrumentu jaunu risinājumu testēšanai. Samazināsim administratīvo slogu, īpaši mazajiem uzņēmumiem. Ieviesīsim nacionālu mākslīgā intelekta attīstības plānu un uzticamus Latvijas tehnoloģiskos risinājumus.", "sect": "10 000 zīmju programmas apsolījums", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "llgtspējīgs 3,5% iekšzemes kopprodukta pieaugums ik gadu, nodrošinot, ka investīciju apjoms pārsniedz 30% no iekšzemes kopprodukta", "sect": "Prioritātes", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Vidējās darba algas pieaugums līdz 2500 eiro un minimālās algas pieaugums līdz 1250 eiro", "sect": "Prioritātes", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Pastāvīgs produktivitātes pieaugums virs 3% gadā, palielinot apstrādes rūpniecības pievienoto vērtību par 40% un trīskāršojot Latvijas aizsardzības industrijas eksporta apjomus", "sect": "Prioritātes", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "STEM (zinātnes, tehnoloģiju, inženierzinātņu un matemātikas) jomu absolventu skaita palielinājums par 50%", "sect": "Prioritātes", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Latvija kā viena no Eiropas Savienības līderiem mākslīgā intelekta pielietošanā", "sect": "Prioritātes", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Mākslīgais intelekts un robotika kā prioritāri attīstības virzieni un radikāli birokrātijas samazināšanas pasākumi valsts pārvaldē", "sect": "Pri ], "q": [[0, 84, "jv-minimala-alga-50-videjas"]], "scope": false}, {"k": "b", "t": "Izveidosim paātrinātus tiesiskos un administratīvos koridorus enerģētikas, aizsardzības, mākslīgā intelekta un citām augstas pievienotās vērtības nozarēm", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Latvijas Investīciju un attīstības aģentūru un paplašināsim tās sniegtos pakalpojumus, pārveidojot to par vienas pieturas aģentūru investoriem, eksportētājiem un jaunuzņēmumiem", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Novirzīsim 100 miljonus eiro gadā lielo investīciju aizdevumiem ar kapitāla atlaidi, tādējādi piedāvājot skaidru un prognozējamu atbalstu lielo uzņēmumu straujākai mērogošanai", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Izveidosim elastīgu finanšu instrumentu sistēmu, mērķtiecīgi atbalstot uzņēmumus ar vislielāko izaugsmes potenciālu, sistemātiski mazinot administratīvo slogu mazajiem un vidējiem uzņēmumiem", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Sekmēsim pensiju kapitāla novirzīšanu vietējos uzņēmumos, izmantojot augstāka riska finanšu instrumentus un vēlīnās stadijas riska kapitālu", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Koordinēsim industriālo parku attīstību valsts līmenī, nodrošinot ciešu sadarbību starp pašvaldībām un valsts kapitālsabiedrībām ceļu, dzelzceļa un elektrotīklu izbūvē", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Mainīsim valsts kapitālsabiedrību pārvaldības modeli, nododot atsevišķu uzņēmumu pārvaldības uzdevumu vairākām ministrijām, tādējādi nodrošinot starpnozaru politikas pārstāvību. Izvērtēsim iespēju veikt valsts kapitālsabiedrību daļēju kotāciju biržā, saglabājot valsts kontroli", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": ["jv-kapitalsabiedribu-akciju-kotacija-birza"], "q": [[178, 277, "jv-kapitalsabiedribu-akciju-kotacija-birza"]], "scope": false}, {"k": "h", "t": "Aizsardzības industrija", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim vietējo aizsardzības industriju kā galveno drošības, inovāciju un tehnoloģiju dzinēju", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim vietējo militāro un divējāda lietojuma preču ražošanu, veidojot sinerģiju starp valsti, Nacionālajiem bruņotajiem spēkiem, zinātni un privāto sektoru", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Pārveidosim valsts iepirkumu sistēmu par stratēģisku instrumentu, kas palīdz Latvijas uzņēmumiem radīt, testēt un eksportēt globāli konkurētspējīgus produktus, attīstot inovāciju iepirkumus", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "h", "t": "Enerģētika un klimats", "ids": [], "scope": false}, {"k": "b", "t": "Garantēsim pilnīgu valsts enerģētisko drošību. Attīstīsim jaunas, uz komerciāliem principiem balstītas elektroenerģijas ražošanas jaudas un stiprināsim enerģijas tīklu pārvaldību, nodrošinot nepieciešamo finansējumu infrastruktūras modernizācijai", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Paātrināsim agregatoru regulējuma izstrādi, mobilizējot un integrējot apjomīgas bateriju un uzkrāšanas sistēmu jaudas tirgū", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim transporta un siltumapgādes sistēmu elektrifikāciju, nodrošinot regulatīvu un finansiālu atbalstu, tādējādi mazinot atkarību no importētiem resursiem", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Piesaistīsim privāto finansējumu energoefektivitātes pasākumiem, radot jaunus finanšu un riska mazināšanas rīkus un mazinot atkarību no Eiropas Savienības publiskajiem fondiem, tādējādi attīstot energoefektivitātes pakalpojumu sektoru", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Izstrādāsim standartizētus, rūpnieciskus siltināšanas risinājumus tipveida daudzīvokļu mājām lielajās pilsētās", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "h", "t": "Tehnoloģijas un mākslīgais intelekts", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim STEM – dabaszinātņu, tehnoloģiju, inženierzinātņu un matemātikas – jomu absolventu skaitu par 50%", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Izstrādāsim nacionālo mākslīgā intelekta (MI) attīstības plānu un izveidosim drošus, uz vietējiem tehnoloģiskajiem risinājumiem balstītus MI rīkus", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Paplašināsim jaunizveidotā MI centra pilnvaras un palielināsim tā finansējumu līdz vairākiem miljoniem eiro gadā, sekmējot pētniecību un privātā sektora iesaisti", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim MI asistentus valsts pārvaldes dokumentu apritē, datu analīzē un klientu apkalpošanā, pilnībā automatizējot iesniegumu pārbaudi un likvidējot birokrātiju starp iestādēm", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim vienu platformu uzņēmumu saziņai un darījumu kārtošanai ar visām valsts iestādēm", "sect": "Apņemšanās un uzdevumi", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Latvijas labklājību ilgtermiņā nevar nodrošināt tikai ar esošo resursu pārdali. Tā ir tiešā veidā atkarīga no mūsu spējas palielināt produktivitāti, radīt augstas pievienotās vērtības preces un pārvērst zināšanas eksportspējīgos uzņēmumos. Mēs tiecamies uz ekonomikas modeli, kurā iedzīvotāju ienākumu kāpums ir cieši saistīts ar uzņēmumu tehnoloģisko jaudu, privātajām investīcijām un spēju konkurēt globālajā tirgū. Lai to sasniegtu, valstij ir jānodrošina droša un pieejama enerģija, attīstīta industriālā infrastruktūra un kvalificēts darbaspēks.", "sect": "Pamatojums", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "p", "t": "Enerģētika, aizsardzības industrija, mākslīgais intelekts un robotika ir ne tikai ekonomikas, bet arī nacionālās drošības jautājums. Pāreja no ekonomiskās stabilizācijas uz reālu izrāvienu ir iespējama tikai tad, ja valsts pārvalde kļūst dinamiska un adaptīva.", "sect": "Pamatojums", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "p", "t": "Starptautiskās institūcijas, tostarp Ekonomiskās sadarbības un attīstības organizācija, savā ziņojumā par Latviju stingri iesaka integrēt visas reģistrācijas un licencēšanas procedūras vienas pieturas aģentūrā (platformā business.gov.lv), kas radikāli samazinātu administratīvo slogu. Pieredze ar būvniecības normatīvu grozīšanu rāda, ka regulārs dialogs ar nozarēm sniedz reālu rezultātu, tāpēc šāda pieeja – obligāta regulējuma pārvērtēšana – ir jāievieš katrā ministrijā.", "sect": "Pamatojums", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "p", "t": "Tāpat enerģētikā un mājokļu siltināšanā līdzšinējā pārlieku lielā atkarība no publiskajiem Eiropas Savienības fondiem nav ilgtspējīga, tādēļ ir kritiski jāpiesaista privātais kapitāls un jāizmanto zemāku elektroenerģijas cenu sniegtās priekšrocības, piemēram, siltumsūkņu ieviešana centralizētajā apkurē, kas palielinātu visas tautsaimniecības noturību. Mērķtiecīga finansējuma palielināšana Mākslīgā intelekta centram un skaidra atbalsta politika nodrošinās to, ka Latvija līdz 2030. gadam kļūst par reģionālo līderi un digitāli autonomu un drošu valsti.", "sect": "Pamatojums", "ch": "4. Ekonomika, enerģētika un uzņēmējdarbība", "ids": [], "scope": false}, {"k": "h", "t": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Veidosim prognozējamu veselības finansējumu ne mazāk kā 6% no IKP un izveidosim Nacionālo veselības un apdrošināšanas fondu efektīvākai pārvaldībai. Mazināsim rindas, stiprināsim primāro aprūpi, ģimenes ārstu pieejamību, slimnīcu pakalpojumus, zāļu pieejamību, onkoloģijas, sirds un asinsvadu, garīgās veselības, rehabilitācijas, paliatīvās aprūpes un hospisa pakalpojumus. Attīstīsim digitālu veselības sistēmu ar vienotu pacientu portālu, pierakstiem, atgādinājumiem un ārstniecības kvalitātes datiem. Stiprināsim mediķu izglītību, cieņpilnu atalgojumu un krīzes gatavību. Demogrāfijas politiku veidosim kā rūpes par stiprām ģimenēm, grūtniecību,", "sect": "10 000 zīmju programmas apsolījums", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "p", "t": "dzemdībām, bērnu veselību, neauglības ārstēšanu, vecāku psihisko veselību, tēvu iesaisti, bērnu aprūpi, darba un privātās dzīves līdzsvaru. Profilaksi un veselībpratību padarīsim par nacionālās drošības daļu. Bērnu agrīnās attīstības vajadzību noteikšana un nepiecieš
