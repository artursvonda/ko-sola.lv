": [], "scope": false}, {"k": "b", "t": "Iestāsimies par kustīgu un veselīgu dzīvesveidu, veidojot veselīgu un sociāli aktīvu sabiedrību, īpaši rūpējoties par bērniem un jauniešiem", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Noteiksim iespēju iedzīvotājiem brīvprātīgi novirzīt līdz vienam procentam no samaksātā iedzīvotāju ienākuma nodokļa sporta organizācijām, sporta klubiem, federācijām vai biedrībām", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Iekļausim sporta izdevumus, piemēram, sporta zāļu abonementus, slidotavas apmeklējumus, peldēšanas nodarbības, attaisnotajos izdevumos, par kuriem var atgūt iedzīvotāju ienākuma nodokļa pārmaksu", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim finansējumu sporta izglītības programmām un infrastruktūras attīstībai, īpaši reģionos", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Atbalstīsim Latvijas paralimpiešus un viņu trenerus, radot prognozējamu atbalsta sistēmu sportam un paralimpiskās kustības attīstībai", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Uzlabosim vides piekļūstamību, veicinot cilvēku ar invaliditāti iesaisti sportā un fiziskajās aktivitātēs", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Solidarizēsimies ar Ukrainu pozīcijā pret agresorvalstīm sportā", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "h", "t": "Labklājība un vecuma pensiju sistēma", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim vidējo darba algu valstī līdz 2500 eiro un minimālo algu līdz 1250 eiro, veicinot vispārēju dzīves līmeņa celšanos", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim nodarbinātības politiku, mainot akcentus uz ieguldījumu cilvēkkapitālā, nodrošinot pārkvalifikāciju , rehabilitāciju un īpaši atbalstot cilvēkus ar invaliditāti, ilgstošos bezdarbniekus un seniorus", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim vienotu cilvēkcentrētu atbalsta sistēmu cilvēkiem ar invaliditāti un funkcionāliem traucējumiem, savlaicīgi nodrošinot tehniskos palīglīdzekļus, medicīnisko un sociālo rehabilitāciju, asistenta un aprūpes pakalpojumus", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim taisnīgu un ilgtspējīgu finansiālu atbalstu vecumdienās. Pakāpeniski pilnveidosim bāzes pensiju, palielināsim piemaksas par darba stāžu un saglabāsim pensiju pirktspēju, īpaši atbalstot seniorus ar mazām pensijām", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim valsts atbildību par cieņpilnām vecumdienām un sociālo drošību. Garantēsim, ka 2. pensiju līmeņa līdzekļus izmanto tikai pensiju nodrošināšanai, nenovirzot to citiem mērķiem", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim 3. pensiju līmeni, radot pievilcīgus stimulus iedzīvotājiem un darba devējiem regulāri veidot uzkrājumus vecumdienām", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Atbalstīsim un veicināsim senioriem pieejamu mūžizglītības sistēmu, arī senioru skolas, digitālās un veselībpratības programmas", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim senioru neatkarību un dzīves kvalitāti, lai cilvēki pēc iespējas ilgāk varētu dzīvot savās mājās un kopienā. Stiprināsim mājas aprūpi un atbalstu ģimenēm, kuras uzņemas senioru un citu aprūpējamu ģimenes locekļu aprūpi", "sect": "Apņemšanās un uzdevumi", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Cilvēku veselība ir Latvijas cilvēkkapitāla, ekonomiskās izaugsmes un sabiedrības noturības pamats. Stipra valsts nodrošina, ka palīdzība ir pieejama savlaicīgi, neatkarīgi no cilvēka ienākumiem vai dzīvesvietas un ka veselības sistēma spēj turpināt darbu arī krīzes apstākļos. Prognozējams finansējums, efektīva pārvaldība, pieejama primārā un slimnīcu aprūpe, medikamenti, kvalificēti mediķi un mūsdienīga digitālā veselība veido sistēmu, kuras centrā ir ārstēšanas rezultāts un cilvēka dzīves kvalitāte.", "sect": "Pamatojums", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "p", "t": "Demogrāfijas politika sākas ar drošības sajūtu ģimenē: pieejamu veselības aprūpi, atbalstu grūtniecības un bērna attīstības laikā, vecāku psihisko veselību, darba iespējām un savlaicīgu palīdzību grūtībās. Profilakse, veselībpratība un veselības un sociālo pakalpojumu integrācija palīdz saglabāt veselīgus dzīves gadus un mazina nevienlīdzību. Šādi ieguldījumi stiprina ģimenes, darba tirgu un Latvijas spēju augt ilgākā laika posmā.", "sect": "Pamatojums", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "p", "t": "Sporta attīstība un iedzīvotāju iesaiste fiziskajās aktivitātēs ir būtisks priekšnoteikums veselīgai, aktīvai un stiprai sabiedrībai. Nepietiekams finansējums sporta organizācijām, novecojusi infrastruktūra un sporta pakalpojumu pieejamības ierobežojumi mazina iespējas bērniem, jauniešiem un pieaugušajiem regulāri nodarboties ar sportu.", "sect": "Pamatojums", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "p", "t": "Papildu atbalsts sporta nozarei, tostarp iespēja iedzīvotājiem novirzīt daļu nodokļu sporta organizācijām un saņemt atvieglojumus par sporta izdevumiem, veicinātu sabiedrības līdzdalību un aktīvāku dzīvesveidu. Tas palīdzētu uzlabot iedzīvotāju veselību, mazināt veselības aprūpes izmaksas, stiprināt sporta organizāciju ilgtspēju un nodrošināt vienlīdzīgākas iespējas nodarboties ar sportu visā Latvijā neatkarīgi no finansiālajām iespējām.", "sect": "Pamatojums", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "p", "t": "Sabiedrības novecošanās ir demogrāfiska realitāte, kurai jāpielāgo valsts politika. Vienlaikus sabiedrības novecošana uzlūkojama nevis kā problēma, bet pārmaiņas, kurām jāpielāgo politika, uztverot seniorus kā resursu, nevis slogu. Labu vecumdienu trīs galvenie balsti ir senioru veselības programma, nodarbinātība un mūžizglītība.", "sect": "Pamatojums", "ch": "5. Veselība, labklājība un demogrāfija", "ids": [], "scope": false}, {"k": "h", "t": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Modernizēsim valsts pārvaldi, mainot fokusu no procesa uz rezultātu. Katrā nozarē noteiksim galvenos attīstības rādītājus, ministrus un iestāžu vadītājus vērtēsim pēc rezultātiem. Publiskosim šo attīstības rādītāju datus. Ieviesīsim vienotas valdības pieeju, kopīgus pakalpojumu centrus, funkciju nepārklāšanos un īpašas pārmaiņu īstenošanas komandas lielajām reformām. Veidosim pakalpojumus cilvēka dzīves situācijām – ar skaidru atbildību, digitālu pieejamību, lietotāja pieredzes mērījumiem un caurskatāmām izmaksām. Pāriesim uz rezultātos balstītu budžeta veidošanu, datu un mākslīgā intelekta asistentu izmantošanu publiskajā pārvaldē.", "sect": "10 000 zīmju programmas apsolījums", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Pāreja no procesu orientētas uz rezultātos balstītu publisko pārvaldību", "sect": "Prioritātes", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Vienotas valdības pieeja, gudra publiskā sektora «saraušanās» un iestāžu pārvaldes uzdevumu nedublēšanās", "sect": "Prioritātes", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Digitālās inovācijas, mākslīgais intelekts, datu izmantošana un savietojamas valsts informācijas sistēmas", "sect": "Prioritātes", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Rezultātos balstīta budžetēšana un caurskatāma publisko līdzekļu pārvaldība", "sect": "Prioritātes", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Cilvēkcentrēti pakalpojumi, publiska atskaitīšanās un profesionāls, politiski neitrāls civildienests", "sect": "Prioritātes", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Latvija kā viena no efektīvāk pārvaldītajām valstīm Eiropā", "sect": "Prioritātes", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "Apņemšanās un uzdevumi", "ids": [], "scope": false}, {"k": "h", "t": "Mūsdienīga un efektīva valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Modernizēsim publisko pārvaldi, veidojot to vienotu, efektīvu un orientētu uz sasniedzamiem rezultātiem", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Balstīsim pārmaiņu procesu uz iedzīvotāju vajadzībām atbilstošu valsts un pašvaldību sniegto pakalpojumu kvalitāti", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim digitālās inovācijas un pāriesim uz rezultātos balstītu budžeta plānošanu, tā panākot daudz efektīvākus valsts un pašvaldību pakalpojumus", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Noteiksim par sekmīgu modernizācijas rezultātu politiski atbildīgo amatpersonu", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim vienu platformu uzņēmumu saziņai un lietu kārtošanai ar visām valsts iestādēm", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Mazināsim sadrumstalotību un uzlabosim atbildību par rezultātu, pārskatot ministriju funkciju sadalījumu", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "Vienotas valdības pārvaldes modelis", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim rezultātos balstītu pārvaldību, katrā nozarē nosakot trīs līdz piecus galvenos attīstības rādītājus, ministru un iestāžu vadītāju sniegumu vērtējot pēc sasniegtajiem rezultātiem, regulāri publiskojot valsts pārvaldes snieguma datus", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim publiskā sektora «gudro saraušanos», vienkāršojot administratīvos procesus un ieviešot vienotas valdības konceptu", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Valsts kancelejas lomu un ieviesīsim vienotas valdības pārvaldības modeli", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim kopīgus pakalpojuma centrus grāmatvedībai, personālvadībai, iepirkumiem, IT atbalstam, nekustamā īpašuma pārvaldībai", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Apvienosim institūcijas ar līdzīgām vai savietojamām funkcijām", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Iestāsimies pret korupciju un interešu konfliktiem", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim reformu īstenošanas un plānoto rezultātu sasniegšanu, paaugstinot civildienesta vadības un politiku ieviesēju kapacitāti un reformu ieviešanas procesa progresu", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim profesionālu augstākā līmeņa vadītāju atlasi, attīstību, novērtējumu un motivāciju, veicinot līderību", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim ierēdņu rotāciju starp resoriem, tādējādi veidojot plašu un motivējošu karjeras sistēmu ierēdņiem un augsti kvalificētu speciālistu izaugsmi valsts funkciju izpildei. Ierēdņu amatu rotācijas pienesumu kvalifikācijas izaugsmei un institūcijas pārvaldes uzdevumu izpildei apliecina gan Ārlietu ministrijas pieredze, gan virknes Eiropas valstu civildienestu prakse", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim īpašas ieviešanas vienības lielajām reformām, stiprinot projektu vadības prasmes", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Paātrināsim digitālās transformācijas un mākslīgā intelekta izmantošanas procesus, pieņemot datos balstītus lēmumus, automatizējot administratīvos procesus un efektivizējot valsts informācijas sistēmas savietojamību", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Realizēsim pāreju uz rezultātos balstītu budžetēšanas un finansēšanas procesu, definējot valsts prioritātes un veidojot vienotu rezultātu sistēmu. Atteiksimies no līdzšinējās inkrementālās (budžeta bāze) budžetēšanas sistēmas, veidosim jaunus līdzekļu piešķiršanas principus, ieviešot digitalizētu un caurspīdīgu budžeta pārvaldību, par to ziņojot parlamentam", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim publiskā sektora darbības uzticamību un atbildību sabiedrībai par sasniegtajiem rezultātiem, attīstot pieeju, ka valsts lemj kopā ar sabiedrību", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Publiskosim valsts institūciju snieguma rezultātus un pakalpojumu kvalitātes rādītājus, ieviesīsim regulāru valdības atskaitīšanos par sasniegtajiem rezultātiem", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim lojālu, profesionālu, politiski neitrālu un uz rezultātu orientētu valsts civildienestu", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "Publiskie pakalpojumi", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim vienotu un efektīvu publisko pakalpojumu sniegšanas konceptu valsts un pašvaldību sniegtajiem pakalpojumiem", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim cilvēkcentrētu pakalpojumu sniegšanas modeli, pakalpojumam nosakot «vienu īpašnieku», kvalitāti mērot pēc lietotāja pieredzes, sasniegtā rezultāta un izmaksām.", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim jēgpilnu publisko pakalpojumu digitalizāciju, to izmaksas un efektivitāti salīdzinot ar privātā sektora praksi", "sect": "Apņemšanās un uzdevumi", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Latvijas attīstību arvien vairāk nosaka valsts spēja pieņemt lēmumus un tos konsekventi īstenot. Drošības, veselības, izglītības, infrastruktūras un ekonomikas mērķi paliks nodomi, ja institūcijām nebūs skaidras atbildības, profesionālas vadības, kvalitatīvu datu un spējas sadarboties pāri nozaru robežām. Tādēļ publiskās pārvaldes modernizācija ir visas programmas izpildes pamats, kas sasaista politiskos solījumus ar izmērāmu rezultātu cilvēkam.", "sect": "Pamatojums", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "p", "t": "Vienotas valdības pieeja, rezultātos balstīta budžetēšana, kopīgi pakalpojumu centri, digitāli risinājumi un mākslīgais intelekts ļauj mazināt dublēšanos un novirzīt resursus svarīgākajiem uzdevumiem. Vienlaikus nepieciešams profesionāls, politiski neitrāls un motivēts civildienests, kas spēj vadīt lielas reform as un atklāti atskaitīties sabiedrībai. Mēs gribam valsti, kas cilvēkam ir saprotama, uzņēmējam paredzama un krīzes situācijā rīcībspējīga.", "sect": "Pamatojums", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "p", "t": "Valsts pārvaldei jābūt skaidrai, kompaktai un ar atbildībām, kas nepārklājas. Pārskatīsim ministriju funkciju sadalījumu, lai digitālā transformācija būtu ciešāk sasaistīta ar ekonomikas attīstību, vides politika – ar enerģētiku un klimatu, bet pašvaldību jautājumi – ar skaidru pārvaldības loģiku. Šo reformu veiksim ar mērķi paātrināt lēmumus, mazināt sadrumstalotību un uzlabot atbildību par rezultātu.", "sect": "Pamatojums", "ch": "6. Valsts pārvalde", "ids": [], "scope": false}, {"k": "h", "t": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Stiprināsim Latvijas zinātnes neatkarību, starptautisko konkurētspēju un komercializāciju. Virzīsimies uz ieguldījumiem pētniecībā un attīstībā 3% no IKP, stiprinot valsts pētījumu programmas, bāzes finansējumu, nepārtrauktu pēcdoktorantūras finansējumu un industriālo doktorantūru. Prioritāri attīstīsim aizsardzības tehnoloģijas, kvantu drošību, sensorus, autonomās sistēmas, 5G un 6G, biomedicīnu, enerģētiku, klimata tehnoloģijas un mākslīgo intelektu. Izstrādāsim jaunu Zinātniskās darbības likumu, kas sekmēs patentēšanu, licencēšanu, komercializāciju, jaunuzņēmumus un universitāšu sadarbību ar industriju. Stiprināsim jauno zinātnieku lomu zinātne s politikas, kvalitātes un ētikas lēmumos", "sect": "10 000 zīmju programmas apsolījums", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Neatkarīga, starptautiski atvērta un vienkāršāk pārvaldīta Latvijas zinātnes sistēma", "sect": "Prioritātes", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Stratēģiski svarīgu tehnoloģiju radīšana Latvijā, tostarp militārā pētniecība, kvantu drošība, sensori un autonomās sistēmas", "sect": "Prioritātes", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Jauno zinātnieku iesaiste zinātnes politikas, kvalitātes un ētikas lēmumos", "sect": "Prioritātes", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Nepārtraukts pēcdoktorantūras finansējums, bāzes finansējums un virzība uz 3% no iekšzemes kopprodukta ieguldījumiem pētniecībā un attīstībā", "sect": "Prioritātes", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Pētniecības rezultātu komercializācija, patentēšana, industriālā doktorantūra un jaunuzņēmumu ekosistēma", "sect": "Prioritātes", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "h", "t": "Apņemšanās un uzdevumi", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Latvijas zinātnes neatkarību un vienkāršosim tās pārvaldību, vienlaikus attīstot Latvijas spēju pašai radīt stratēģiski svarīgas tehnoloģijas un veicinot ciešu sadarbību ar pasaules akadēmisko vidi", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim finansējumu zinātnei, pētniecībai un attīstībai kā nozīmīgam ekonomikas un izaugsmes virzītājam", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Virzīsimies uz 3% no iekšzemes kopprodukta ieguldījumu pētniecībā un attīstībā, tajā skaitā 1,5% no publiskā un 1,5% no privātā sektora", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim jauno zinātnieku lomu lēmumu pieņemšanā, ieviešot Jauno zinātnieku akadēmiju kā partneri zinātnes politikas, kvalitātes un ētikas jautājumu veidošanā, kā arī attīstot nacionālu akadēmiskās ētikas un pētnieciskās integritātes atbalsta sistēmu", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim nepārtrauktu pēcdoktorantūras finansējumu un attīstīsim zinātnē balstītu inovāciju ekonomiku kā vienu no valsts attīstības prioritātēm", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Pilnveidosim bāzes finansējumu kā drošības spilvenu, mazinot zinātnieku finansiālo nenoteiktību", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim valsts pārvaldes digitalizāciju un mākslīgā intelekta ieviešanu, atbrīvojot resursus augstākas pievienotās vērtības uzdevumiem un uzlabojot valsts pārvaldes pakalpojumu kvalitāti iedzīvotājiem", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Latvijas zinātnes pienesumu tautsaimniecībai, mērķtiecīgi atbalstot pētniecības rezultātu komercializāciju", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim ciešu sinerģiju starp universitātēm un industriju, tā radot konkurētspējīgos produktus. Ar efektīvu atbalstu patentēšanai un jaunuzņēmumu ekosistēmai radīsim augsti apmaksātas darba vietas un stiprināsim Latvijas kā augsto tehnoloģiju valsts pozīcijas", "sect": "Apņemšanās un uzdevumi", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Zināšanas un spēja pašiem radīt tehnoloģijas ir Latvijas ekonomiskās un drošības suverenitātes pamats. Ieguldījumi pētniecībā ļauj ātrāk pielāgoties globālajām pārmaiņām, risināt klimata un veselības izaicinājumus un attīstīt aizsardzībai kritiskas spējas. Neatkarīga, starptautiski atvērta zinātne nodrošina uzticamus datus lēmumu pieņemšanai un veido pievilcīgu vidi talantu piesaistei un noturēšanai Latvijā.", "sect": "Pamatojums", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "p", "t": "Jauns Zinātniskās darbības likums ir nepieciešams, lai laboratorijās radītie atklājumi nepaliktu tikai zinātniskās publikācijās, bet pārtaptu reālos produktos un pakalpojumos, kas uzlabo cilvēku dzīvi. Jauno zinātnieku ciešāka iesaiste lēmumu pieņemšanā veicinās efektīvu paaudžu maiņu, mazinās intelektuālā darbaspēka aizplūšanu un nostiprinās augstus ētikas un caurredzamības standartus visas sistēmas ilgtermiņa attīstībai. Efektīvākai zinātnes pārvaldībai pārkārtot institūtu un augstskolu pārraudzību, koncentrējot to ne vairāk kā trīs ministriju pārziņā pašreizējo astoņu vietā. Tas veidos neatkarīgu zinātnes vidi, kas iekļaujas starptautiskajā akadēmiskajā vidē un būs līdzsvarā ar valsts interesēm.", "sect": "Pamatojums", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "p", "t": "Digitalizācija ir horizontāla politika, kas caurvij visas nozares. Mākslīgais intelekts un automatizācija ir galvenie rīki produktivitātes celšanai un darbaspēka trūkuma risināšanai. Latvijas digitālajai noturībai un drošībai izšķiroša ir kritiskās infrastruktūras kontrole kopā ar ES un NATO partneriem, investīcijas kiberdrošībā, kvantu tehnoloģijās un 6G. Nākotnes vīzija ietver arī personalizētu izglītību ar «MI skolotāju katram skolēnam» (līdz 2035. gadam) un proaktīvu, pilnībā digitalizētu valsts pārvaldi.", "sect": "Pamatojums", "ch": "7. Zinātne, inovācijas un tehnoloģijas", "ids": [], "scope": false}, {"k": "h", "t": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Nodrošināsim kvalitatīvu, drošu un iekļaujošu izglītību katram bērnam, mūsdienīgus, pieejamus mācību līdzekļus un taisnīgu, konkurētspējīgu atalgojumu visiem pedagogiem. Noteiksim vidējo vispārējo vai profesionālo izglītību obligātu, veidosim nacionālu talantu attīstības sistēmu. Stiprināsim drošu un iekļaujošu skolas vidi, vardarbības novēršanu, labbūtību un vērtēšanu kā mācīšanās atbalstu. Veidosim elastīgu, darba vidē balstītu profesionālo izglītību un augstskolas kā reģionālus un nacionālus zināšanu un inovāciju centrus. Pārejai uz augstas produktivitātes ekonomiku nodrošināsim vienotu Latvijas cilvēkkapitāla pārvaldību un programmu darba tirgum nepieciešamo kompetenču apguvei.", "sect": "10 000 zīmju programmas apsolījums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "p", "t": "Stingri iestāsimies par kvalitatīvu un atbildīgu valsts valodas lietojumu visās jomās. Paplašināsim latviešu valodas apguves iespējas un pētniecību. Veidosim latvisku kultūrvidi, atbalstīsim kultūras mantojuma saglabāšanu un pieejamību, izcilu un daudzveidīgu laikmetīgo kultūru un starptautiski konkurētspējīgu kultūras un radošo industriju. Ieguldīsim spēcīgas pilsoniskas sabiedrības un noturīgas demokrātijas attīstībā: atbalstīsim biedrību un nodibinājumu darbu, jauniešu iniciatīvas, pilsonisko dialogu, kvalitatīvu un daudzveidīgu mediju saturu latviešu valodā.", "sect": "10 000 zīmju programmas apsolījums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Gudra, noturīga un radoša Latvijas sabiedrība, kas spēj kopā radīt un pielietot zināšanas un elastīgi pielāgojas pārmaiņām, krīzēm un ģeopolitiskai nestabilitātei", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Kvalitatīva, droša un pieejama izglītība katram bērnam un jaunietim neatkarīgi no dzīves vietas", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Visā Latvijā labvēlīgi apstākļi agrīnai talanta atraisīšanai un visaptverošs, individualizēts atbalsts jaunajiem talantiem un izcilībām turpmākās profesionālās karjeras veidošanai", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Kvalitatīvs un atbildīgs valsts valodas lietojums visās jomās publiskajā telpā un saziņā", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Bagāta un ilgtspējīga latviešu valoda kā konstitucionāla vērtība un nacionālās identitātes pamats", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Latviska un kultūrā liela Latvija ar kvalitatīvi saglabātu un pieejamu kultūras mantojumu un plaukstošu latvisko dzīvesziņu, izcilu un daudzveidīgu māksliniecisko jaunradi un starptautiski konkurētspējīgu kultūras un radošo industriju", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Noturīga demokrātija un augsta sabiedrības uzticēšanās publiskai pārvaldībai. Spēcīga pilsoniskā sabiedrība kā valsts drošības garants", "sect": "Prioritātes", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Apņemšanās un uzdevumi", "ids": [], "scope": false}, {"k": "h", "t": "Kvalitatīva, pieejama izglītība katram bērnam", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim ilgtspējīgu un mūsdienīgu izglītības iestāžu ekosistēmu un uzraudzīsim, stiprināsim izglītības kvalitāti visos izglītības līmeņos", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Īstenosim pilnā apjomā jauno finansēšanas modeli «Programma skolā»", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim ieguldīt mūsdienīgas, radošas vides veidošanā izglītības iestādēs, arī izveidojot jaunus finanšu instrumentus izglītības inovāciju atbalstam", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim obligātu vispārējo vidējo vai profesionālo vidējo izglītību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Pārveidosim izglītības standartu vidējam izglītības posmam, novēršot padziļināto kursu dublēšanos ar studijām augstskolās un panākot, ka Latvijas jaunieši vidējo izglītību iegūst līdz ar pilngadības iestāšanos līdzīgi kā citās Eiropas valstīs", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim daudzveidīgus mācību līdzekļus, tajā skaitā mācību grāmatu kā pamatlīdzekli satura apguvei katrā mācību priekšmetā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim drošu un iekļaujošu skolas vidi, stiprinot partnerību starp skolu, ģimeni un atbildīgajām institūcijām", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Noteiksim stingrākus ierobežojumus sociālo tīklu regulējumā bērniem, ierobežojot piekļuvi sociālo tīklu platformām un bērniem kaitīgam saturam internetā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Uzsāksim agrīnās attīstības skrīninga instrumenta ieviešanu (BAASIK), sākot ar pirmsskolu, un nodrošināsim vardarbības novēršanas un labbūtības stiprināšanas programmu katrā skolā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim pedagogu motivāciju, autonomiju un profesijas prestižu, nodrošinot konkurētspējīgu atalgojumu, atbilstoši Evikas Siliņas vadītā Ministru kabineta pieņemtajam atalgojuma paaugstināšanas grafikam", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Īstenosim mērķtiecīgu un sistēmisku pedagogu sagatavošanu un profesionālo pilnveidi, veidojot darba tirgus vajadzībās balstītu valsts pasūtījumu augstskolām un aktīvi iesaistot darba devējus", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim līderību izglītībā un veidosim radošu vidi sabiedrības līdzdalībai izglītības inovāciju radīšanā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Pārveidosim speciālās izglītības iestāžu uzturēšanas izdevumu normatīvu. Sadarbībā ar pašvaldībām nodrošināsim atbilstošus resursus skolēnu un pedagogu labbūtības un kvalitatīva izglītības procesa uzlabošanai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim iedrošinošu vidi, kurā mācību snieguma vērtēšana skolēnam ir atbalstoša un kļūdīšanās palīdz veidot individualizētu mācīšanos", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Darba tirgus vajadzībām atbilstoša mūžizglītība", "ids": [], "scope": false}, {"k": "b", "t": "Pārveidosim skolu specializāciju un ieviesīsim jaunu, uz sasniedzamo rezultātu orientētu finansēšanas modeli profesionālajā izglītībā. Veidosim elastīgu, modulāru pieeju izglītības programmu īstenošanā. Sadarbībā ar uzņēmējiem attīstīsim darba vidē balstītu izglītības procesu", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Virzīsim cilvēkkapitāla pāreju no zemas produktivitātes nodarbinātības uz intensīvu izaugsmi, ieviešot vienotu Latvijas cilvēkkapitāla pārvaldību, veidojot pastāvīgu un konstruktīvu dialogu starp izglītības sniedzēju un darba devēju, apvienojot fragmentētās finansēšanas plūsmas vienotā cilvēkkapitāla fondā, ko pārrauga viena vadošā institūcija", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim kvalitātes kritērijos un uz rezultātiem orientētu finansēšanas pieeju visās valsts augstskolās. Sadarbībā ar pašvaldībām un darba devējiem veidosim augstskolas par zināšanu un inovāciju centriem", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Panāksim, ka Latvija kļūst par labās prakses valsti jēgpilna un vērtībās balstīta mākslīgā intelekta pielietošanai izglītībā, piemēram, personalizēta mācīšanās ceļa veidošanai, daudzveidīgu datu pārvaldībai, administratīvā sloga mazināšanai, salāgojot to ar intensīvu pamatprasmju apguvi analogās mācīšanās formās, īpaši lasīšanā, rakstīšanā, matemātikā un dabaszinātnēs", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim atbalstīt individuālo mācīšanās kontu izveidi un paplašināsim mācīšanās iespējas pieaugušo izglītības platformā stars.gov.lv, ņemot vērā darba tirgus attīstības prognozes nacionālā un reģionālā līmenī. Ieguldīsim digitālo prasmju un mākslīgā intelekta pratības apgūšanā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Rūpējoties par sudraba ekonomikas attīstību, veidosim īpaši mērķētu piedāvājumu senioriem", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Slēgsim tādas augstākās izglītības institūcijas, kas īsteno Latvijas drošību un izglītības kvalitāti apdraudošu praksi vai taisa simulatīvus darījumus imigrācijas normu apiešanai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Talantu un izcilību attīstība", "ids": [], "scope": false}, {"k": "b", "t": "Izveidosim nacionālu talantu un izcilību attīstības sistēmu, kas mērķtiecīgi atklāj, izglīto un atbalsta augsta potenciāla individualitātes, sākot ar pamatizglītību līdz akadēmiskai vai profesionālai karjerai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Izkopsim bērnu un jauniešu māksliniecisko un tehnisko jaunradi, organizējot mērķtiecīgu mijiedarbību starp formālo un neformālo izglītību un stiprinot interešu un profesionālās ievirzes izglītības programmas", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim STEM – dabaszinātņu, tehnoloģiju, inženierzinātņu un matemātikas – jomu absolventu skaitu par 50%", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Izglītības iestādēs nodrošināsim mērķētu atbalstu izcilībām, veidojot partnerības jauno talantu izglītošanā ar nozaru profesionāļiem, īpaši STEM un uzņēmējdarbības prasmju attīstībā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim Latviju kā starptautiski atzītu radošuma un radošās izglītības ekselences centru. Attīstīsim starpnozaru saiknes starp radošumu, STEM un labbūtību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Pilnveidosim profesionālās karjeras izglītību, iedrošinot katru jaunieti laicīgi izvēlēties izsvērtu savu nākotnes attīstības ceļu", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim projektu «Latvijas skolas somas», ieviešot stingrākus piedāvājuma kvalitātes kritērijus", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Valsts valoda", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim tiesisko regulējumu latviešu tautas lingvistisko pamattiesību nodrošināšanai uz latviešu valodas kā vienīgās valsts valodas un vienīgās oficiālās valodas lietošanu. Stingrāk uzraudzīsim valsts valodas politikā pieņemto likumu izpildi", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim latvisku vidi un pozitīvu, apliecinošu latviešu valodas lietošanu visās sabiedrības darbības jomās, pastiprinot mijiedarbību starp izglītības un kultūras jomu. Attīstīsim latviešu valodas apguves rīkus pašmācībai dažādām vecuma un mērķa grupām", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Izveidosim vienotu latviešu valodas apguves programmu pieaugušajiem, tajā skaitā lietotājam ērtu digitālo platformu", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim darbu pie vienotas skolas pieejas visās Latvijas izglītības iestādēs. Nodrošināsim katram izglītojamajam iespējas apgūt valsts valodu augstā līmenī. Veidosim latvisku skolu vidi un asi vērsīsimies pret izglītības iestāžu vadītājiem un izglītības darbiniekiem, kas demonstrē nelojālu attieksmi pret Latvijas valsts vērtībām", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim latgaliešu rakstu valodas kā vēsturiska latviešu valodas paveida saglabāšanu, aizsardzību un attīstību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim latviešu valodas konkurētspēju Eiropas lingvistiskās daudzveidības telpā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Bagātināsim latviešu valodas korpusu digitālajā vidē, ieguldīsim kvalitatīvos mašīntulkošanas un valodas tehnoloģiju rīkos", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim ieguldījumu iedzīvotāju lasītprasmes un lasītprieka stiprināšanā, atbalstot kvalitatīvas literatūras latviešu valodā izdošanu un pieejamību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Kultūra", "ids": [], "scope": false}, {"k": "b", "t": "Kopsim Dziesmu un deju svētku tradīciju un Latvijas nemateriālā kultūras mantojumu kā mūsu latviskās identitātes un vērtību pamatu, stiprinot tā galvenos ilgtspējas faktorus: kultūrizglītību, lokālo kultūru savdabību un dzīvotspēju, sabiedrības līdzdalību un organizatorisko profesionalitāti", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Aizsargāsim un atbalstīsim cilvēka radošo brīvību un radošo izpausmju daudzveidību, nostiprinot nacionālo kultūras un kultūrizglītības institūciju, Valsts kultūrkapitāla fonda darbību un to neatkarību, aizsargājot radošo darbu no autoritāriem lēmumiem un politiskas iejaukšanās. Valsts kultūrkapitāla fonda projektu konkursos mazināsim sadrumstalotību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Strādāsim pie labākas autortiesību un blakustiesību aizsardzības digitālajā telpā. Saglabāsim autoratlīdzības nodokļu režīmu radošo profesiju pārstāvjiem", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Paplašināsim kultūras, kultūrizglītības un kultūras mantojuma pieejamību un sabiedrības līdzdalību kultūrā, tajā skaitā veidojot mērķētu kultūras piedāvājumu mazāk aktīvām sabiedrības grupām, piemēram, senioriem", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim un atbalstīsim bibliotēku un muzeju nozari", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Izveidosim bērnu un jauniešu kultūrpolitiku. Atbalstīsim kvalitatīvu bērnu grāmatu izdošanu un pieejamību. Stiprināsim «Latvijas skolas somas» iniciatīvu, veidojot ciešāku sadarbību starp kultūras un izglītības sektoru", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Atbalstīsim radošo partnerību veidošanos kultūras un mākslas potenciāla pārnesei pievienotās vērtības radīšanai tautsaimniecībā un sabiedrības pārvaldībā. Atbalstīsim Latvijas kultūras un radošo industriju eksportu", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim ilgtspējīgu Latvijas kino un audiovizuālās mākslas ekosistēmu un stiprināsim to pievilcību un konkurētspēju pasaulē. Palielināsim atbalstu nacionālā kino veidošanai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Paplašināsim profesionālās mākslas pieejamību reģionos. Daudzveidojot finanšu avotus, ieguldīsim Latvijas kultūras pieminekļu saglabāšanā un jaunu kultūrvietu veidošanā, iekļaujot tās reģionu attīstības stratēģijās, tajā skaitā stiprināsim lībiešu, suitu, latgaliešu un citas unikālās kultūrtelpas", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim Latgales koncertzāli «GORS» kā nacionālas nozīmes kultūras centru unikālās latgaliešu kultūras kopšanai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Stabilizēsim valsts un pašvaldību kultūras institūciju bāzes finansējumu, tajā skaitā sadarbībā ar pašvaldībām pārskatot minimālo kultūras pakalpojumu grozu reģionos", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim risinājumus taisnīga un vienlīdzīga atalgojuma noteikšanai kultūras un radošajā sektorā. Ierosināsim Latvijas pašvaldībām «Labās gribas memorandu» līdzsvarota atalgojuma noteikšanai kultūras jomā nodarbinātajiem visā Latvijā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Iedzīvināsim «Jaunā Eiropas Bauhaus» principus un iestāsimies par augstas kvalitātes arhitektūras un dizaina risinājumiem kultūrvides veidošanā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Pabeigsim nacionālās koncertzāles «Rīgas Filharmonija» būvniecību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Veidosim izstāžu zāli «Arsenāls» par mūsdienīgu laikmetīgās mākslas centru", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Atbalstīsim Rīgu Laikmetīgās mākslas muzeja izveidē", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Sagatavosim plānu turpmākās nacionālās kultūras infrastruktūras attīstībai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b ": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim sabiedrības noturību sadarbībā ar NVO sektoru un plašsaziņas līdzekļiem, mērķtiecīgi ieguldot kompetencēs, kas attīsta rīcībspēju krīzes situācijās, palīdz orientēties informācijas telpā un atmasko dezinformāciju", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Atbalstīsim kvalitatīvu un daudzveidīgu mediju saturu latviešu valodā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim Latvijas sabiedriskā medija kvalitatīvu uztveramību un pieejamību visā Latvijā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Aizsargāsim žurnālistu darbības neatkarību", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Izveidosim mērķtiecīgu un ilgtermiņa sabiedrības saliedētības politiku, kas aptver visas sabiedrības grupas un Latvijas reģionus un nodrošināsim politikas īstenošanai stabilu finansējumu", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Strādāsim ar Latvijas mantojuma un publiskās atmiņas institūcijām, sniedzot atbalstu vēstures pētniecībai, iedzīvotāju vēstures zināšanu un izpratnes padziļināšanai kā būtiskam priekšnoteikumam vienotas nācijas veidošanā", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Radīsim jaunus instrumentus privātā sektora un privātpersonu iesaistei kultūras, sporta un pilsoniskās sabiedrības līdzdalības iniciatīvu atbalstīšanā, dodot jaunus impulsus mecenātismam un sponsorēšanai", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "b", "t": "Noteiksim pienākumu valsts kapitālsabiedrībām katru gadu īstenot plānu kultūras, sporta un pilsoniskās sabiedrības atbalstam ar mērķi stiprināt nacionālo identitāti, sabiedrības saliedētību un Latvijas tēlu un reputāciju pasaulē", "sect": "Apņemšanās un uzdevumi", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Izglītība, latviešu valoda un kultūra veido Latvijas ilgtermiņa drošības, demokrātijas un konkurētspējas pamatu. Kvalitatīvai izglītībai jābūt pieejamai katram bērnam un jaunietim neatkarīgi no dzīvesvietas, savlaicīgi atklājot gan mācīšanās grūtības, gan talantu un izcilību. Pedagogu profesionālā kapacitāte, droša skolas vide, pamatprasmju apguve, profesionālā izglītība un augstskolu saikne ar reģioniem un darba tirgu nosaka Latvijas spēju attīstīt cilvēkkapitālu. Starptautiskie OECD dati apliecina, ka valstis, kas sistemātiski iegulda cilvēkkapitālā, sasniedz augstāku ekonomisko izaugsmi un sabiedrības labklājību. Mūsdienās kvalitatīva izglītība stiprina sabiedrības noturību un drošību.", "sect": "Pamatojums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "p", "t": "Latvijas demogrāfiskās prognozes liecina par būtisku skolēnu skaita samazināšanos nākamajās desmitgadēs – līdz 2040. gadam vispārējā izglītībā skolēnu skaits var samazināties gandrīz par 50%, bet atsevišķos reģionos pat par 61%. OECD aprēķini rāda, ka darbspējas vecuma iedzīvotāju skaits Latvijā samazinās apmēram par 1% gadā. Katrs jaunietis kļūst arvien nozīmīgāks darba tirgum, tādēļ pieaug nepieciešamība ieguldīt izglītības kvalitātē un prasmju attīstībā, kā arī svarīgi visā Latvijā radīt labvēlīgus apstākļus agrīnai talantu atklāšanai un atraisīšanai.", "sect": "Pamatojums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "p", "t": "Lielas pārmaiņas izglītībā pēdējos gados izraisa digitālā pārveide un mākslīgais intelekts (MI), tas maina gan to, ko māca, gan kā māca, gan kā tiek pārvaldīta izglītības sistēma. Atbilstoši starptautisko organizāciju rekomendācijām - tai jāveido sistēma, kas sagatavo sabiedrību dzīvei un darbam MI laikmetā.", "sect": "Pamatojums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "p", "t": "Kultūras loma un vērtība globālajā pasaulē pēdējos gados paplašinās. Kultūra joprojām ir būtisks sabiedrības identitātes, demokrātijas un ekonomiskās attīstības resurss. Vienlaikus kultūras aizvien vairāk tiek skatīta kā sociālās infrastruktūras sastāvdaļa, kas palīdz cilvēkiem pārvarēt vientulību un atsvešinātības sajūtu pārmērīgas tehnoloģiju lietošanas dēļ, palīdz attīstīt empātiju, emociju un sajūtu dažādību, palīdz veidot sociālās prasmes un saites un iesaistīties pilsoniskas sabiedrības aktivitātēs. Tāpat aizvien ievērojamāku lomu kultūra spēlē veselības jomā.", "sect": "Pamatojums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "p", "t": "Latvijā digitālā transformācija, demogrāfiskās pārmaiņas un ģeopolitiskā situācija rada nepieciešamību mērķtiecīgi ieguldīt kultūras nozarē nodarbinātajos, kultūras pieejamībā, cilvēkkapitāla kultūrizglītībā un infrastruktūrā.", "sect": "Pamatojums", "ch": "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība", "ids": [], "scope": false}, {"k": "h", "t": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Uzturēsim dabas kapitālu, zinātnē balstītu mežu, jūras un ūdeņu pārvaldību, ilgtspējīgu lauksaimniecību, aprites ekonomiku, klimatnoturīgu infrastruktūru un taisnīgu zaļo pāreju, tādējādi nodrošinot tiesības ikvienam dzīvot labvēlīgā vidē. Šo mērķu sasniegšanai garantēsim taisnīgas kompensācijas, kopienu līdzdalību un prognozējamus noteikumus uzņēmējiem, kāpinot nozaru eksportspēju. Pieprasīsim ES tiešmaksājumu pieaugumu mūsu lauksaimniekiem līdz ES vidējam līmenim. Noteiksim publiskajos iepirkumos prioritāti Latvijas pārtikai. Veicināsim kooperāciju, lai ar kopīgām investīcijām kāpinātu produktivitāti. Stiprināsim Latvijas līderību zilajā ekonomikā, pilnveidojo t jūras un iekšējo ūdeņu pārvaldību, attīstot inovatīvu akvakultūru un zvejniecību.", "sect": "10 000 zīmju programmas apsolījums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "p", "t": "Satiksmē nodrošināsim «Rail Baltica», reģionālo ceļu, dzelzceļa, ostu, sabiedriskā transporta un digitālās infrastruktūras attīstību ar skaidru atbildību, termiņiem un izmaksu kontroli. Reģionos stiprināsim pašvaldību spēju attīstīties, skolu, veselības, sociālo pakalpojumu un mājokļu pieejamību, veicināsim uzņēmējdarbību un ģimenēm draudzīgu vidi.", "sect": "10 000 zīmju programmas apsolījums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Latvijas dabas kapitāla uzturēšana ar prognozējamu pārvaldību, kompensācijām un skaidriem nosacījumiem saimnieciskajai darbībai", "sect": "Prioritātes", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Klimatneitralitāte kā nacionālās drošības, enerģētiskās neatkarības un mājsaimniecību noturības jautājums", "sect": "Prioritātes", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Zinātnē balstīta mežsaimniecība, Eiropas Savienības atbalsts un meža nozares konkurētspēja eksporta tirgos", "sect": "Prioritātes", "ch": "9. Vide,
