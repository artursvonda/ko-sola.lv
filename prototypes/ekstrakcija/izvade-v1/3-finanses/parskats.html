 būvniecībai vai iegādei reģionos, attiecinot to arī uz divu bērnu ģimenēm", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim valsts līdzfinansētu programmu zemas īres maksu mājokļu būvniecībai pašvaldībās", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Samazināsim birokrātiskās prasības un saskaņošanas procedūras māju renovācijas un energoefektivitātes projektiem, nodrošinot paplašinātu atbalstu ēku atjaunošanai", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim valsts mērķdotāciju programmu daudzīvokļu māju liftu modernizācijai, nomaiņai un jaunu liftu vai pandusu izbūvei, nodrošinot vides pieejamību senioriem un vecākiem ar bērnu ratiņiem", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim stingru un saistošu namu apsaimniekošanas kvalitātes standartu, nodrošinot iedzīvotājiem vienkāršotu mehānismu vērsties Patērētāju tiesību aizsardzības centrā gadījumos, kad apsaimniekošanas pakalpojums tiek sniegts nekvalitatīvi", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Noteiksim pienākumu pašvaldībām līdzdarboties daudzīvokļu māju iekškvartālu ceļu seguma uzturēšanā, ar nosacījumu, ka ceļi ir publiski pieejami", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Atrisināsim vēsturiskos kopīpašuma tiesiskā regulējuma šķēršļus, panākot, ka publisku investīciju piesaiste privātīpašumā esošos pagalmos var notikt ātri un juridiski droši", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Likvidēsim administratīvos un tiesiskos šķēršļus ēku inženierkomunikāciju sakārtošanai, normatīvajos aktos nosakot siltumtīklu un ūdensvada piederību, tajā skaitā atrisinot tranzīttīklu problēmu", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Mainīsim regulējumu par sabiedrisko pakalpojumu sniegšanas tīkliem, nosakot, ka tie ir operatoru vai pašvaldības atbildībā un bilancē", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "h", "t": "Civilā aizsardzība un vietējā drošība", "ids": [], "scope": false}, {"k": "b", "t": "Aprīkosim autonomus krīzes vadības centrus katrā novada centrā līdz 2028. gadam, nodrošinot tos ar neatkarīgu elektroapgādi, satelītsakariem un pirmās nepieciešamības preču rezervēm", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim mērķtiecīgu patvertņu ierīkošanu pašvaldību publiskajās ēkās, piemēram, skolās un slimnīcās, piesaistot Eiropas Savienības fondu finansējumu", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim pašvaldības policiju, integrējot to vienotā digitālā sakaru un video novērošanas tīklā ar Valsts policiju un Valsts robežsardzi tūlītējai reakcijai hibrīdapdraudējumu gadījumā", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim «pierobežas modrības piemaksu» valsts un pašvaldību funkcijām kritiski svarīgajiem speciālistiem – policistiem, ugunsdzēsējiem, ārstniecības personālam un pedagogiem – , garantējot sabiedrisko pakalpojumu nepārtrauktību un pieejamību", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "h", "t": "Satiksme un pasažieru pārvadājumi", "ids": [], "scope": false}, {"k": "b", "t": "Palielināsim iekšzemes dzelzceļa kravu pārvadājumus par 20% līdz 2030. gadam", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim projekta «RailBaltic» īstenošanu, izbūvējot pamatsavienojumu ar Eiropu platuma dzelzceļa sliedēm", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim Latvijas ostu konkurētspēju, modernizējot infrastruktūru, diversificējot kravas, nodrošinot tālāku industrializāciju, kā arī pielāgojot to militārās mobilitātes prasībām", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Ieviesīsim modernu un attīstību veicinošu ostu pārvaldības modeli, sabalansējot valsts, pašvaldības un privātā sektora intereses", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim reģionālos loģistikas centrus jeb „sausās ostas” ar speciālo ekonomisko zonu priekšrocībām, tādējādi kāpinot iekšzemes dzelzceļa kravu apgrozījumu", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim aviokompāniju «AirBaltic» kā Latvijas un Baltijas lidsabiedrību, nodrošinot tiešos savienojumus uz ekonomiski nozīmīgiem galamērķiem", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim Rīgu kā reģionālu aviācijas centru Baltijā, paplašinot tiešo starptautisko savienojamību kā būtisku ekonomikas izaugsmes un investīciju piesaistes faktoru", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Izbūvēsim ātrgaitas autoceļus: «VIA Baltica», Rīgas un Bauskas apvedceļus", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Atjaunosim un palielināsim melnā seguma autoceļu īpatsvaru reģionos, nodrošinot pagastu centru, skolu un uzņēmumu savienojumus ar novada centriem", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim duālas lietojamības ceļu un tiltu infrastruktūru reģionos", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Veiksim ieguldījumus ceļu satiksmes drošībā, tajā skaitā attīstīsim mikromobilitātes infrastruktūru", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Attīstīsim modernus un ātrus pasažieru pārvadājumus pa dzelzceļu, modernizējot vilcienu sastāvus un staciju piegulošo infrastruktūru, piemēram, auto un velo stāvvietas, gājēju infrastruktūru u.c.", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "b", "t": "Īstenosim sabiedriskā transporta plānošanas un pārvaldības reformu, nodrošinot pakalpojuma pieejamību reģionos, vienotu biļešu sistēmu un koordinētu kustības grafiku starp dažādiem transporta veidiem", "sect": "Apņemšanās un uzdevumi", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Latvijas daba, meži, zeme un ūdeņi ir nacionāls kapitāls, kas nodrošina pārtiku, enerģiju, eksportu, darba vietas un dzīves kvalitāti. Šo resursu pārvaldībai jābalstās zinātnē, skaidros ilgtermiņa noteikumos un taisnīgā atbildības sadalījumā. Prognozējams zonējums, sabiedrības līdzdalība un atbilstošas kompensācijas ļauj vienlaikus saglabāt dabas vērtības un dot saimnieciskās darbības veicējiem drošību ieguldīt un attīstīties.", "sect": "Pamatojums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "p", "t": "Klimatnoturīga infrastruktūra, energoefektivitāte, aprites ekonomika, zilā ekonomika un ilgtspējīga lauksaimniecība stiprina Latvijas enerģētisko un ekonomisko neatkarību. Taisnīgi Eiropas Savienības maksājumi, kooperācija un Latvijā ražotas pārtikas izmantošana publiskajos iepirkumos palīdz veidot dzīvotspējīgus reģionus un drošu pārtikas apgādi. Mēs gribam vides politiku, kas rada skaidrību, veicina inovācijas un saglabā Latvijas dabas kapitālu nākamajām paaudzēm.", "sect": "Pamatojums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "p", "t": "Savienojamība nosaka Latvijas ekonomikas ātrumu, reģionu pieejamību un valsts spēju rīkoties drošības krīzē. Kvalitatīvi ceļi, dzelzceļš, ostas, aviācija un sabiedriskais transports savieno cilvēkus ar darbu un pakalpojumiem, bet", "sect": "Pamatojums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "p", "t": "uzņēmumus ar Eiropas un pasaules tirgiem. Tādēļ transporta infrastruktūra jāplāno kā vienota sistēma ar skaidru atbildību, termiņiem, izmaksu kontroli un militārās mobilitātes prasībām.", "sect": "Pamatojums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "p", "t": "Latvija ir stipra tad, ja cilvēki var veidot drošu un pilnvērtīgu dzīvi visos reģionos. Iedzīvotāju un saimnieciskās aktivitātes saglabāšana pierobežā ir nacionālās drošības jautājums, jo apdzīvotas kopienas, pieejami pakalpojumi, darbavietas un kvalitatīva infrastruktūra veido valsts klātbūtni ikdienā. Policentriska attīstība ļauj izmantot katra reģiona priekšrocības un mazina pārmērīgu cilvēku un iespēju koncentrēšanos vienā centrā. Nodokļu stimuli, mājokļu pieejamība, mobilitātes atbalsts, digitāli un klātienē saņemami pakalpojumi palīdz ģimenēm palikt reģionos un piesaista nepieciešamos speciālistus. Mēs gribam reģionus, kas ir ekonomiski aktīvi, ģimenēm pievilcīgi un gatavi aizsargāt Latviju kā vienotu valsti.", "sect": "Pamatojums", "ch": "9. Vide, reģioni un infrastruktūra", "ids": [], "scope": false}, {"k": "h", "t": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "10 000 zīmju programmas apsolījums", "ids": [], "scope": false}, {"k": "p", "t": "Stiprināsim tiesiskumu, tiesu efektivitāti, korupcijas apkarošanu, publisko iepirkumu caurskatāmību. Iestāsimies par cilvēktiesībām, bērnu tiesībām un vardarbības novēršanu ģimenē, skolā un darba vidē. Lai vairotu taisnīgumu visā sabiedrībā, stiprināsim tiesu neatkarību un spēju spriest tiesiski un taisnīgi atbilstoši likuma garam. Aizstāvēsim un stiprināsim cilvēka pamattiesības, demokrātiskās un eiropeiskās vērtības, cilvēktiesības, kā arī Latvijas starptautiskās saistības kā mūsu drošības pamatu Latvijas demokrātijas un tiesiskuma noturībai.", "sect": "10 000 zīmju programmas apsolījums", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "Prioritātes", "ids": [], "scope": false}, {"k": "b", "t": "Tiesiskums, taisnīgums, cilvēktiesību aizsardzība un tiesu varas neatkarība", "sect": "Prioritātes", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Tiesiskā noturība pret hibrīdapdraudējumiem, ārvalstu ietekmes operācijām un dezinformāciju", "sect": "Prioritātes", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Vardarbības, īpaši vardarbības ģimenē un pret bērniem un sievietēm, apkarošana un cietušo atbalsta pakalpojumu pilnveide", "sect": "Prioritātes", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Bērniem draudzīga tiesiskā vide un retraumatizācijas mazināšana ģimenes strīdu un laulības šķiršanas procesos", "sect": "Prioritātes", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Godīga konkurence uzņēmējdarbībā un investīciju vides tiesiskā drošība, korupcijas apkarošana", "sect": "Prioritātes", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Droša sodu izpilde un procesuālais ātrums tieslietās", "sect": "Prioritātes", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "Apņemšanās un uzdevumi", "ids": [], "scope": false}, {"k": "h", "t": "Tiesu varas neatkarība un pārvaldība", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim tiesu varas neatkarību un spēju spriest tiesu tiesiski un taisnīgi atbilstoši likuma garam", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Pilnveidosim tiesisko regulējumu un uzraudzības mehānismus korupcijas, konkurences tiesību pārkāpumu un finanšu noziedzīgo nodarījumu apkarošanai, tādējādi uzlabojot komercdarbības vidi un veicinot sabiedrības uzticēšanos valstij", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Nodrošināsim ātrāku un efektīvāku lietu izskatīšanu tiesā, vienkāršojot un modernizējot procesuālos likumus", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim darbu, novēršot negodprātīgu procesuālo tiesību izmantošanu ar mērķi vilcināt tiesvedību un spriedumu izpildi", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "Cilvēktiesību aizsardzība un vardarbības izskaušana", "ids": [], "scope": false}, {"k": "b", "t": "Aizstāvēsim un stiprināsim Satversmē nostiprinātās pamattiesības, kā arī cilvēktiesības, demokrātiskās un eiropeiskās vērtības un Latvijas starptautiskās saistības kā mūsu drošības garantu un pamatu Latvijas demokrātijas un tiesiskuma noturībai", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim stingri iestāties par Latvijas dalību Eiropas Padomes Konvencijā par vardarbības pret sievietēm un vardarbības ģimenē novēršanu un apkarošanu", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Mazināsim bērna retraumatizāciju un institucionālo vardarbību, lai neiesaistītu bērnu atkārtotos procesos un procesuālajās darbībās ģimenes strīdu un laulības šķiršanas lietās", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim novērst un apkarot vardarbību, īpaši pret bērniem, sievietēm, kā arī jebkuru vardarbību ģimenē un ārpus tās, pilnveidojot atbalsta grozu ar psiholoģisko un juridisko palīdzību cietušajiem", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Izveidosim mūsdienīgu un drošu ieslodzījuma vietu sievietēm, kas sekmē uzvedības maiņu un nodrošina pilnvērtīgu vidi bērniem, kuri līdz četru gadu vecumam uzturas ieslodzījuma vietā kopā ar mammu", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "Valsts aizsardzība pret ārējiem riskiem (hibrīdkarš, dezinformācija)", "ids": [], "scope": false}, {"k": "b", "t": "Turpināsim stiprināt valsts un sabiedrības drošību, stingri vēršoties pret Krievijas īstenotajiem hibrīdapdraudējumiem, dezinformācijas kampaņām, jebkāda veida atbalsta sniegšanu Krievijai un starptautisko sankciju apiešanu", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim tiesisko noturību pret hibrīdapdraudējumiem – ārvalstu ietekmes operācijām un tiesību sistēmas ļaunprātīgu izmantošanu, nodrošinot ātru tiesisko reakciju, ciešu valsts institūciju sadarbību un sabiedrības kritiskās domāšanas attīstību", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "Godīga konkurence un investīciju vides tiesiskā drošība", "ids": [], "scope": false}, {"k": "b", "t": "Veicināsim godīgu konkurenci, mazinot administratīvo slogu uzņēmējdarbībā un atsakoties no lieka birokrātiskā regulējuma, kas sadārdzina preces un pakalpojumus", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Uzlabosim uzņēmējdarbības vidi, ieviešot stratēģiskā investora statusu un «investora zaļo koridoru» – vienotu valdības kontaktpunktu, kas pārstāv investoru visās ministrijās un iestādēs. Katram investoram piešķirsim personīgu valsts konsultantu ar mandātu pieprasīt atbildes no jebkuras valsts iestādes pakalpojuma līmeņa līgumā noteiktajos termiņos. Tiesl ietu, vides, būvniecības un nodokļu administrācijas atļaujas stratēģiskiem investoriem, piemēram, aizsardzības jomā izskatīsim paātrināti ar publiski pārbaudāmiem termiņiem. Turpināsim atbalstu vismaz piecus gadus pēc projekta uzsākšanas", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Stiprināsim ekonomisko noziegumu procesuālo izmeklēšanas un iztiesāšanas operativitāti izmeklēšanas iestādēs, prokuratūrā un tiesā", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Paplašināsim Ekonomisko lietu tiesas kompetenci kriminālprocesā un komercstrīdos", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "b", "t": "Pilnveidosim tiesisko regulējumu un kontroles mehānismus, novēršot un atklājot slēptās korupcijas izpausmes – tirgošanos ar ietekmi un amatpersonu slēptu materiālo stimulēšanu («piebarošanu»)", "sect": "Apņemšanās un uzdevumi", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "h", "t": "Pamatojums", "ids": [], "scope": false}, {"k": "p", "t": "Tiesiska valsts ir drošas demokrātijas un sabiedrības uzticēšanās pamats. Ikvienam cilvēkam, uzņēmējam un investoram jābūt pārliecībai, ka likumu piemēro taisnīgi, tiesas darbojas neatkarīgi un lietas tiek izskatītas saprātīgā termiņā. Korupcijas, interešu konfliktu, ekonomisko noziegumu un agresorvalstu ietekmes apkarošana aizsargā publiskos resursus, godīgu konkurenci un valsts lēmumu neatkarību.", "sect": "Pamatojums", "ch": "10. Tiesiskums", "ids": [], "scope": false}, {"k": "p", "t": "Tiesiskuma kvalitāti raksturo arī valsts spēja aizsargāt cilvēka cieņu un palīdzēt ikvienam, kurš nonācis bezpalīdzīgā situācijā. Bērniem draudzīgi procesi, vardarbības novēršana, cietušo atbalsts un ikviena cilvēktiesību ievērošana stiprina sabiedrības drošību ikdienā. Mēs gribam tiesību sistēmu, kas spēj ātri reaģēt, labot pārkāpumu radītās sekas un uzturēt demokrātiskas, eiropeiskas Latvijas noturību.", "sect": "Pamatojums", "ch": "10. Tiesiskums", "ids": [], "scope": false}], "bad": [], "summary": "# jv — 3. Finanses\n\n- Solījumi: 14\n- Nepārbaudāmi: 1 (jv-kapitala-tirgus-attistiba)\n- Ar abiem avotiem (CVK + paplašinātā): 9\n- Ar `nesakritiba`: 11 (9 CVK+paplašinātā; 2 tikai paplašinātā, kur tas pats punkts atkārtojas ar atšķirību — kotācija biržā, kapitāla pieauguma nodoklis)\n\n## Jautājumi\n\n- **jv-drosibas-finansejums-5-no-ikp**: CVK 1. nodaļā ir «Nodrošināsim aizsardzības finansējumu 5% no IKP». Vai šis (iekšējā + ārējā drošība, 5%) ir tas pats nodoms un 1. nodaļas izpildē jāapvieno, vai atsevišķs Solījums ar citu rādītāju?\n- **jv-valsts-attistibas-fonds**: paplašinātās 4. nodaļā «Mainīsim valsts kapitālsabiedrību pārvaldības modeli, nododot atsevišķu uzņēmumu pārvaldības uzdevumu vairākām ministrijām» šķiet pretējs «vienotai pārvaldībai» fondā. Tas pats nodoms (avots ar nesakritību) vai atsevišķs Solījums 4. nodaļā?\n- **jv-iin-sadale-pasvaldibam-80-20**: CVK — sadale starp pašvaldībām un valsti; paplašinātā — IIN sadale starp pašvaldībām (dzīvesvieta/darbavieta). Viens nodoms vai CVK teikums jāizraksta kā atsevišķs Nepārbaudāms Solījums?\n\n## Neizrakstītais\n\nCVK 3. nodaļa — visi 6 teikumi izrakstīti. Daļēji neizrakstīts:\n- «mazinot darbaspēka nodokļu slogu zemāko ienākumu saņēmējiem» — mērķa palīgteikums, nav atsevišķs Solījums (§1).\n\nPaplašinātā, 3. nodaļa:\n- «10 000 zīmju programmas apsolījums» — CVK teksta kopija, ignorēta (§0).\n- Prioritāte «Fiskāli atbildīga budžeta politika, ievērojot eirozonas … noteikumus» — atkārto apņemšanos.\n- Prioritāte «Iekšējās un ārējās drošības investīciju finansēšana vismaz 5% …» — atkārto apņemšanos.\n- Prioritāte «Valsts parāda līmeņa nepalienāšana virs 55% …» — atkārto apņemšanos.\n- Prioritāte «Darbaspēka nodokļu sloga mazināšana zemāko ienākumu saņēmējiem, ceļot minimālo algu un neapliekamo minimumu» — atkārto apņemšanās.\n- Prioritāte «Kapitāla tirgus attīstība, vietējā kapitāla aktivizēšana un līdzsvarots IIN sadales modelis pašvaldībām» — atkārto apņemšanās.\n- «Pamatojums» (2 rindkopas) — neizraksta (§1).\n\nPaplašinātā, citas nodaļas (saistīti, bet atstāti attiecīgās CVK nodaļas izpildei):\n- 4. nod. prioritāte «Vidējās darba algas pieaugums līdz 2500 eiro un minimālās algas pieaugums līdz 1250 eiro» — atkārto apņemšanos (min. algas daļa izmantota jv-minimala-alga-50-videjas); vidējā alga 2500 eiro → CVK 4. nodaļa.\n- 4. nod. «Mainīsim valsts kapitālsabiedrību pārvaldības modeli, nododot … vairākām ministrijām» — sk. jautājumu; atstāts 4. nodaļai.\n- 4. nod. «Sekmēsim pensiju kapitāla novirzīšanu vietējos uzņēmumos …» un prioritāte «… mobilizējot Latvijas iekšējo kapitāla tirgu» — CVK 4. nodaļa («Mērķēti atbalstīsim … kapitāla tirgu»).\n- 1. un 2. nod. aizsardzības finansējums 5% no IKP — CVK 1. nodaļa (sk. jautājumu).\n- 5. nod. «Daļu no alkohola, tabakas, cukura un citu neveselīgo produktu nodokļu ieņēmumiem virzīsim veselības aprūpei …» — CVK 5. nodaļa (profilakse).\n- 5. nod. IIN līdz 1% novirzīšana sporta organizācijām; sporta izdevumi attaisnotajos izdevumos — CVK 5. nodaļa (sports).\n- 6. nod. rezultātos balstīta budžetēšana — CVK 6. nodaļa.\n- 8. nod. «Saglabāsim autoratlīdzības nodokļu režīmu radošo profesiju pārstāvjiem» — CVK 8. nodaļa (kultūra).\n- 9. nod. «Ieviesīsim jaunu un taisnīgu pašvaldību finanšu izlīdzināšanas modeli …», nodokļu atlaides līdz 100 km no ES ārējās robežas, prioritāte «Pašvaldību finanšu motivācijas instrumenti …» — CVK 9. nodaļa (reģioni).\n"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const byId=Object.fromEntries(D.sol.map(s=>[s.id,s]));
const fb={};let filter="visi",active=null;
const kinds=s=>{const v=new Set((s.avoti||[]).map(a=>a.veids));return v.has("cvk")&&v.has("paplasinata")?"abi":v.has("cvk")?"cvk":"pap"};
const F={visi:["Visi",()=>1],p:["Pārbaudāmi",s=>s.parbaudams],np:["Nepārbaudāmi",s=>!s.parbaudams],abi:["Abos avotos",s=>kinds(s)=="abi"],ns:["Nesakritība",s=>(s.nesakritiba||"").trim()],cvk:["Tikai CVK",s=>kinds(s)=="cvk"],pap:["Tikai paplaš.",s=>kinds(s)=="pap"],j:["Ar jautājumu",s=>(s.jautajums||"").trim()],fb:["Ar atsauksmi",s=>fb[s.id]]};
function stats(){const n=D.sol.length,np=D.sol.filter(s=>!s.parbaudams).length,abi=D.sol.filter(s=>kinds(s)=="abi").length;
 const miss=[...D.cvk,...D.pap].filter(isMiss).length;
 document.getElementById("stats").innerHTML=`<strong>${n}</strong> Solījumi · <strong>${np}</strong> nepārbaudāmi · <strong>${abi}</strong> abos avotos · <strong style="color:var(--bad)">${miss}</strong> neizrakstīti avota punkti`}
// Pamatojums, Prioritātes un CVK atkārtojums paplašinātajā nav jāizraksta — tie ir pelēki, ne sarkani
function isMiss(u){return u.k!="h"&&!u.ids.length&&u.scope!==false&&!["Pamatojums","Prioritātes","10 000 zīmju programmas apsolījums"].includes(u.sect)}
function unitHTML(u,i,src){if(u.k=="h")return `<div class="u h">${esc(u.t)}</div>`;
 let t=u.t,out="",pos=0;const qs=(u.q||[]).slice().sort((a,b)=>a[0]-b[0]);
 for(const [a,b,id] of qs){if(a<pos)continue;out+=esc(t.slice(pos,a))+`<mark data-id="${id}">`+esc(t.slice(a,b))+"</mark>";pos=b}
 out+=esc(t.slice(pos));
 const cls=["u",u.k,u.ids.length?"cov":isMiss(u)?"miss":"skip"].join(" ");
 const ch=u.ids.map(id=>`<span class="chip">${esc(id.replace(/^jv-/,""))}</span>`).join("");
 return `<div class="${cls}" data-ids="${u.ids.join(" ")}">${out}${ch?`<span class="chips">${ch}</span>`:""}</div>`}
function renderSrc(){const el=document.getElementById("src");
 el.innerHTML=(D.bad.length?`<div class="bad"><b>${D.bad.length} citāti nav atrasti avotā:</b><br>${D.bad.map(b=>esc(b[0]+": "+b[1])).join("<br>")}</div>`:"")+
 `<h2>CVK programma</h2>`+D.cvk.map((u,i)=>unitHTML(u,i,"cvk")).join("")+`<h2>Paplašinātā programma</h2>`+D.pap.map((u,i)=>unitHTML(u,i,"pap")).join("");
 el.querySelectorAll(".u[data-ids]").forEach(u=>u.onclick=()=>{const ids=u.dataset.ids.split(" ").filter(Boolean);if(ids[0])activate(ids[0],true)})}
function card(s){const f=fb[s.id]||{};
 const tags=`<span class="tag ${s.parbaudams?"p":"np"}">${s.parbaudams?"Pārbaudāms":"Nepārbaudāms"}</span><span class="tag gal">${esc(s.temas?.galvena)}</span>${(s.temas?.papildu||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}`;
 const q=(s.avoti||[]).map(a=>`<div class="q"><div class="src">${a.veids=="cvk"?"CVK":"Paplašinātā"} · ${esc(a.vieta)}</div>„${esc(a.citats)}”</div>`).join("");
 const btn=(k,l)=>`<button data-k="${k}" class="${f.k==k?"on":""}">${l}</button>`;
 return `<div class="s${active==s.id?" act":""}" id="s-${s.id}"><div class="id">${esc(s.id)}</div><div class="t">${esc(s.nosaukums)}</div><div>${tags}</div>${q}
 ${s.nesakritiba?`<div class="ask" style="color:#8a5a00">Nesakritība: ${esc(s.nesakritiba)}</div>`:""}${s.piezimes?`<div class="note">Piezīmes: ${esc(s.piezimes)}</div>`:""}${(s.jautajums||"").trim()?`<div class="ask">Jautājums: ${esc(s.jautajums)}</div>`:""}
 <div class="fb" data-id="${s.id}">${btn("ok","OK")}${btn("dalit","Dalīt")}${btn("apvienot","Apvienot ar…")}${btn("parbaudamiba","Pārbaudāmība nepareiza")}${btn("tema","Tēma")}${btn("nosaukums","Nosaukums")}${btn("izmest","Nav solījums")}<input placeholder="komentārs" value="${esc(f.c||"")}"></div></div>`}
function renderList(){const el=document.getElementById("list");const fn=F[filter][1];
 el.innerHTML=`<details><summary>Ekstraktora kopsavilkums</summary><pre>${esc(D.summary)}</pre></details>`+D.sol.filter(fn).map(card).join("");
 el.querySelectorAll(".s").forEach(c=>c.onmouseenter=()=>activate(c.id.slice(2),false));
 el.querySelectorAll(".fb").forEach(b=>{const id=b.dataset.id;
  b.querySelectorAll("button").forEach(x=>x.onclick=()=>{const f=fb[id]||(fb[id]={});f.k=f.k==x.dataset.k?null:x.dataset.k;if(!f.k&&!f.c)delete fb[id];renderList()});
  b.querySelector("input").onchange=e=>{const f=fb[id]||(fb[id]={});f.c=e.target.value;if(!f.k&&!f.c)delete fb[id]}})}
function activate(id,scroll){active=id;document.querySelectorAll(".u.act,.s.act").forEach(e=>e.classList.remove("act"));document.querySelectorAll("mark.me").forEach(m=>m.classList.remove("me"));
 let first=null;document.querySelectorAll(".u[data-ids]").forEach(u=>{if(u.dataset.ids.split(" ").includes(id)){u.classList.add("act");first??=u}});
 document.querySelectorAll(`mark[data-id="${id}"]`).forEach(m=>m.classList.add("me"));
 const c=document.getElementById("s-"+id);c?.classList.add("act");
 if(scroll){c?.scrollIntoView({block:"center",behavior:"smooth"})}else{first?.scrollIntoView({block:"nearest",behavior:"smooth"})}}
function renderFilt(){document.getElementById("filt").innerHTML=Object.entries(F).map(([k,[l,fn]])=>`<button data-k="${k}" class="${filter==k?"on":""}">${l} (${D.sol.filter(fn).length})</button>`).join("");
 document.querySelectorAll("#filt button").forEach(b=>b.onclick=()=>{filter=b.dataset.k;renderFilt();renderList()})}
document.getElementById("copy").onclick=()=>{const L={ok:"OK",dalit:"Dalīt",apvienot:"Apvienot",parbaudamiba:"Pārbaudāmība nepareiza",tema:"Tēma",nosaukums:"Nosaukums",izmest:"Nav solījums"};
 const t=Object.entries(fb).map(([id,f])=>`- \`${id}\` — ${f.k?L[f.k]:""}${f.c?": "+f.c:""}`).join("\n")||"(nav atsauksmju)";
 navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById("copy");b.textContent="Nokopēts";setTimeout(()=>b.textContent="Kopēt atsauksmi",1500)})};
document.getElementById("ttl").textContent=D.title||"";stats();renderFilt();renderSrc();renderList();
</script>
</body>
</html>
