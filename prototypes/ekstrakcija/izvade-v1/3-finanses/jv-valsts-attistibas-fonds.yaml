id: jv-valsts-attistibas-fonds
saraksts: jv
nosaukums: Valsts attīstības fonds lielo valsts kapitālsabiedrību pārvaldībai
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Attīstīsim kapitāla tirgu un valsts attīstības fondu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai"
nesakritiba: "CVK «Attīstīsim … valsts attīstības fondu» (bez funkcijas un bez izveides apņemšanās); paplašinātā «dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai». Vērtē pēc paplašinātās (fonda izveide ar šo funkciju)."
piezimes: "Pārbaudāms: iestādes izveide. Palīgteikums ar «dibinot» nosauc konkrētu darbību ar savu iznākumu → atsevišķs Solījums (§1)."
jautajums: "Paplašinātās 4. nodaļā: «Mainīsim valsts kapitālsabiedrību pārvaldības modeli, nododot atsevišķu uzņēmumu pārvaldības uzdevumu vairākām ministrijām» — tas šķiet pretējs «vienotai pārvaldībai» fondā. Vai tas ir tas pats nodoms (VKS pārvaldības reforma) un jāpievieno kā avots ar nesakritību, vai atsevišķs Solījums 4. nodaļas izpildē?"
