id: jv-iin-sadale-pasvaldibam-80-20
saraksts: jv
nosaukums: "IIN sadale pašvaldībām: 80% pēc dzīvesvietas, 20% pēc darbavietas"
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [nodokli-un-budzets]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim taisnīgu un uzņēmējdarbību veicinošu nodokļu ieņēmumu sadali starp pašvaldībām un valsti"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Ieviesīsim līdzsvarotu iedzīvotāju ienākuma nodokļa sadali starp pašvaldībām, novirzot 80% pašvaldības budžetā pēc iedzīvotāja deklarētās dzīvesvietas un 20% atbilstoši darbavietai"
nesakritiba: "Cits objekts: CVK — «nodokļu ieņēmumu sadali starp pašvaldībām un valsti» (bez mēra); paplašinātā — IIN sadale «starp pašvaldībām», «80% … pēc … dzīvesvietas un 20% atbilstoši darbavietai». Vērtē pēc paplašinātās mēra (80/20)."
piezimes: "Apvienots, jo paplašinātās prioritāte («līdzsvarots IIN sadales modelis pašvaldībām») un CVK «uzņēmējdarbību veicinošu» norāda uz to pašu nodomu (darbavietas daļa). Prioritāte atkārto apņemšanos."
jautajums: "CVK runā par sadali starp pašvaldībām un valsti (vertikāli), paplašinātā — par IIN sadali starp pašvaldībām (horizontāli, dzīvesvieta/darbavieta). Vai tas tiešām ir viens nodoms, vai CVK teikums jāizraksta kā atsevišķs Nepārbaudāms Solījums?"
