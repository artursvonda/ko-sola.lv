id: jv-nin-pilnvertigs-pasvaldibu-nodoklis
saraksts: jv
nosaukums: Nekustamā īpašuma nodoklis kā pilnvērtīgs pašvaldību nodoklis
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [regioni-un-pasvaldibas, majokli]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Padarīsim nekustamā īpašuma nodokli par pilnvērtīgu pašvaldību nodokli ar prognozējamību un sociālo taisnīgumu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Pārveidosim nekustamā īpašuma nodokli kā pilnvērtīgu pašvaldību nodokli, paplašinot pašvaldību tiesības lemt par nodokļa likmēm"
nesakritiba: "CVK nepasaka, ko nozīmē «pilnvērtīgs pašvaldību nodoklis»; paplašinātā precizē — «paplašinot pašvaldību tiesības lemt par nodokļa likmēm». Vērtē pēc šī mēra."
piezimes: "Robežgadījums granularitātē: «paplašinot pašvaldību tiesības lemt par nodokļa likmēm» nosauc konkrētu darbību, bet tā ir pati «pilnvērtīga pašvaldību nodokļa» būtība, tāpēc nav dalīts — izmantots kā mērs (§4). «Prognozējamība un sociālais taisnīgums» ir nemērāmi pavadošie nosacījumi."
jautajums: ""
