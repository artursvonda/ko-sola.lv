id: jv-kapitalsabiedribu-akciju-kotacija-birza
saraksts: jv
nosaukums: Valsts kapitālsabiedrību akciju kotācija biržā (līdz 25%)
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
avoti:
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "virzīsim valsts kapitālsabiedrību akciju kotāciju biržā (līdz 25%)"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Izvērtēsim iespēju veikt valsts kapitālsabiedrību daļēju kotāciju biržā, saglabājot valsts kontroli"
nesakritiba: "3. nodaļā «virzīsim … akciju kotāciju biržā (līdz 25%)»; 4. nodaļā vājāk — «Izvērtēsim iespēju veikt … daļēju kotāciju biržā, saglabājot valsts kontroli» (tikai izvērtējums, bez 25% mēra)."
piezimes: "Tikai paplašinātā programma — jauna, atsevišķi izvērtējama darbība, ko CVK neatsevišķo (§4). Abas vietas ir viens nodoms; CVK citāta nav, tāpēc kā vērtēšanas mērs pieņemts 3. (Finanšu) nodaļas formulējums ar 25%."
