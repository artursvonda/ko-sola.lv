id: jv-neapliekamais-minimums-80-minimalas-algas
saraksts: jv
nosaukums: Neapliekamais minimums 80% no minimālās algas
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [ekonomika-un-darbs]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "palielināsim fiksēto neapliekamo minimumu līdz 80% no minimālās algas"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Palielināsim fiksēto neapliekamo minimumu līdz 80% no minimālās darba algas"
nesakritiba: "Mērs sakrīt; atšķiras tikai mērķa palīgteikums: CVK «mazinot darbaspēka nodokļu slogu», paplašinātā «būtiski samazinot darbaspēka nodokļu slogu»."
piezimes: "Palīgteikums «mazinot darbaspēka nodokļu slogu zemāko ienākumu saņēmējiem» apraksta mērķi, nav atsevišķs Solījums (§1). Prioritāte par darbaspēka nodokļu sloga mazināšanu, ceļot minimālo algu un neapliekamo minimumu, atkārto apņemšanās."
jautajums: ""
