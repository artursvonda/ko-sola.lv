id: jv-valsts-arejais-parads-zem-55-ikp
saraksts: jv
nosaukums: Valsts ārējā parāda līmenis zem 55% no IKP
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nepārsniegsim valsts parāda līmeni virs 55% no iekšzemes kopprodukta"
nesakritiba: "Cits rādītājs: CVK «valsts ārējā parāda līmeni zem 55% no IKP», paplašinātā «valsts parāda līmeni virs 55%» (kopējais valsts parāds, ne ārējais). Vērtē pēc CVK (ārējais parāds)."
piezimes: "CVK teikums aptver 2 Solījumus (parāda līmenis; eirozonas fiskālie noteikumi) bez atsevišķa darbības vārda, tāpēc citēts viss teikums. Paplašinātā tos sadala 2 punktos (§4). Prioritāte «Valsts parāda līmeņa nepalienāšana virs 55%» atkārto apņemšanos."
jautajums: ""
