id: jv-budzets-eirozonas-fiskalie-noteikumi
saraksts: jv
nosaukums: Budžets atbilstoši eirozonas fiskālajiem noteikumiem
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Veidosim fiskāli atbildīgu valsts budžeta politiku saskaņā ar eirozonas ekonomiskās pārvaldības un fiskālās politikas noteikumiem"
nesakritiba: "CVK «fiskāli atbildīgu budžetu … ievērojot eirozonas fiskālos noteikumus»; paplašinātā «budžeta politiku saskaņā ar eirozonas ekonomiskās pārvaldības un fiskālās politikas noteikumiem» (plašāks noteikumu loks)."
piezimes: "Robežgadījums: «fiskāli atbildīgs» pats par sevi nav mērs, bet atbilstība eirozonas fiskālajiem noteikumiem ir pārbaudāma (noteikumi ievēroti vai nē). Citēts viss CVK teikums (sk. jv-valsts-arejais-parads-zem-55-ikp). Prioritāte par fiskāli atbildīgu budžeta politiku atkārto apņemšanos."
jautajums: ""
