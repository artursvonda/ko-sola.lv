id: jv-drosibas-finansejums-5-no-ikp
saraksts: jv
nosaukums: Iekšējās un ārējās drošības investīcijas vismaz 5% no IKP
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [iekseja-drosiba-un-tiesiskums, nodokli-un-budzets]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Rūpējoties par valsts nākotni, drošību finansēsim atbildīgi"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nodrošināsim finansējumu iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta"
nesakritiba: "CVK bez mēra («drošību finansēsim atbildīgi»); paplašinātā «iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta». Vērtē pēc paplašinātās mēra (5% no IKP)."
piezimes: "CVK teikumā nav mēra, tāpēc pēc §4 vērtē pēc paplašinātās programmas mēra; līdz ar to pārbaudāms. Prioritāte «Iekšējās un ārējās drošības investīciju finansēšana vismaz 5%» atkārto apņemšanos."
jautajums: "CVK 1. nodaļā ir «Nodrošināsim aizsardzības finansējumu 5% no IKP» (paplašinātā 1. un 2. nodaļā — «ieguldot aizsardzībā 5%», «Ieguldīsim 5% … valsts aizsardzībā»). Vai šis (iekšējā + ārējā drošība, 5%) ir tas pats nodoms un 1. nodaļas izpildē jāapvieno, vai atsevišķs Solījums ar citu rādītāju?"
