id: jv-spiediens-un-sankcijas-pret-krieviju
saraksts: jv
nosaukums: "Starptautiskā spiediena un sankciju pret Krieviju pastiprināšana"
parbaudams: false
temas:
  galvena: arpolitika
  papildu: []
avoti:
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Konsekventi uzturēsim prasību, lai agresors maksātu pilnu cenu par pastrādātajiem noziegumiem – iestājoties par Krievijas vājināšanu un izolāciju, starptautisko taisnīgumu, pastiprinot starptautisko spiedienu un Eiropas Savienības un nacionālās sankcijas"
piezimes: "Nepārbaudāms: 'iestājoties par', 'pastiprinot' bez konkrēta mēra. Nacionālo sankciju pastiprināšana teorētiski novērojama, bet nav atdalīta kā atsevišķa apņemšanās. CVK programmas 2. nodaļā (ārpus šī ekstrakcijas apjoma) ir līdzīgs teikums par atbalstu Ukrainai — apvienojot visas nodaļas, jāpārbauda apvienošana."
