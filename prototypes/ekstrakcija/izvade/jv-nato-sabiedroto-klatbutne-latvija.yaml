id: jv-nato-sabiedroto-klatbutne-latvija
saraksts: jv
nosaukums: "NATO sabiedroto pastāvīgas klātbūtnes Latvijā palielināšana"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [arpolitika]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "attīstīsim NATO sabiedroto pastāvīgu klātbūtni Latvijā"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "Audzēsim NATO sabiedroto klātbūtni Latvijā"
piezimes: "Apvienots: abi avoti sola sabiedroto klātbūtnes pieaugumu Latvijā. CVK 'pastāvīgu', paplašinātā 'audzēsim' — CVK formulējums nosaukumā. Pārbaudāms, jo sabiedroto spēku skaits/pastāvīga izvietošana ir novērojama, lai gan mērķa skaitļa nav."
jautajums: "Robežgadījums: 'attīstīsim' ir starp Nepārbaudāmo darbības vārdiem, bet objekts (sabiedroto spēku klātbūtne) ir izmērāms. Atzīmēts kā pārbaudāms — lūdzu apstiprināt."
statusi: []
