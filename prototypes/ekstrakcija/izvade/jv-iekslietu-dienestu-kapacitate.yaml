id: jv-iekslietu-dienestu-kapacitate
saraksts: jv
nosaukums: "Iekšlietu dienestu kapacitātes un infrastruktūras stiprināšana"
parbaudams: false
temas:
  galvena: iekseja-drosiba-un-tiesiskums
  papildu: []
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Stiprināsim civilās aizsardzības sistēmu un iekšlietu dienestu – ugunsdzēsēju, policijas, robežsardzes kapacitāti"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība"
    citats: "Turpināsim iekšlietu dienestu infrastruktūras modernizāciju"
piezimes: "CVK citāts ir viss teikums, jo daļa par iekšlietu dienestiem bez sākuma darbības vārda nav patstāvīga. Apvienots ar paplašinātās infrastruktūras modernizāciju, jo abi attiecas uz iekšlietu dienestu spēju. Nepārbaudāms ('stiprināsim', 'turpināsim' bez mēra)."
jautajums: "Vai CVK 'iekšlietu dienestu kapacitāte' un paplašinātās 'infrastruktūras modernizācija' ir viens iznākums? Alternatīva — atsevišķi Solījumi."
