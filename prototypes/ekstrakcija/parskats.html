<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekstrakcijas pārskats</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#dde2e8;--acc:#2a4a70;--hi:#fff1b8;--hi2:#ffd94d;--bad:#c8372d;--ok:#2f7d4f;--nv:#8a5a00}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header b{font-size:15px}.proto{background:#ffe3e0;color:var(--bad);font-weight:600;padding:2px 8px;border-radius:4px;font-size:12px}
.stat{color:var(--mut)}.stat strong{color:var(--ink)}
.f{display:flex;gap:6px;flex-wrap:wrap}.f button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}.f button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 54px)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}.col{height:auto!important}}
.col{overflow:auto;height:100%;padding:12px 16px}.col+.col{border-left:1px solid var(--line)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 0 6px}
.u{padding:4px 8px;margin:2px 0;border-left:3px solid transparent;border-radius:2px;cursor:pointer}
.u.h{font-weight:600;margin-top:10px;cursor:default}.u.b::before{content:"• ";color:var(--mut)}
.u.miss{border-left-color:var(--bad);background:#fff5f4}.u.skip{color:var(--mut)}
.u.cov{border-left-color:var(--ok)}.u.act{background:var(--hi)}
mark{background:var(--hi);padding:0 1px}.u.act mark.me{background:var(--hi2)}
.chips{display:inline-flex;gap:3px;margin-left:4px}.chip{font:11px ui-monospace,monospace;background:#e9eef5;color:var(--acc);border-radius:3px;padding:0 4px}
.s{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 10px}
.s.act{outline:2px solid var(--hi2)}
.s .t{font-weight:600;font-size:15px}.s .id{font:11px ui-monospace,monospace;color:var(--mut)}
.tag{display:inline-block;font-size:11px;border-radius:3px;padding:1px 6px;margin-right:4px;border:1px solid var(--line)}
.tag.p{color:var(--ok);border-color:#b8dcc6}.tag.np{color:var(--nv);border-color:#e8d2a6;background:#fff8ea}
.tag.gal{background:#e9eef5;border-color:#e9eef5;color:var(--acc)}
.q{margin:6px 0 0;padding-left:8px;border-left:2px solid var(--line);font-size:13px}.q .src{font-size:11px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:6px}.ask{font-size:12px;color:var(--bad);margin-top:6px}
.fb{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}.fb button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:2px 6px;cursor:pointer}
.fb button.on{background:var(--ink);color:#fff}.fb input{flex:1;min-width:120px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 6px}
details{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px}pre{white-space:pre-wrap;font-size:12px}
.bad{background:#ffe3e0;color:var(--bad);padding:6px 10px;border-radius:6px;margin-bottom:10px}
#copy{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:4px;padding:5px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="proto">PROTOTIPS</span><b>JV · 1. un 3. nodaļa</b>
  <span class="stat" id="stats"></span>
  <div class="f" id="filt"></div>
  <button id="copy">Kopēt atsauksmi</button>
</header>
<main>
  <section class="col" id="src"></section>
  <section class="col" id="list"></section>
</main>

const D={"sol": [{"id": "jv-aizsardzibas-finansejums-5-ikp", "saraksts": "jv", "nosaukums": "Aizsardzības finansējums 5% no IKP", "parbaudams": true, "temas": {"galvena": "aizsardziba", "papildu": ["nodokli-un-budzets"]}, "avoti": [{"veids": "cvk", "vieta": "1. Drošība un aizsardzība", "citats": "Nodrošināsim aizsardzības finansējumu 5% no IKP"}, {"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība", "citats": "ik gadu ieguldot aizsardzībā 5% no iekšzemes kopprodukta"}], "piezimes": "Apvienots: CVK un paplašinātā sola to pašu mēru. Paplašinātā piebilst 'ik gadu', CVK ne — nosaukumā CVK mērs.", "jautajums": "Vai šis jāapvieno ar jv-drosibas-investicijas-5-ikp (3. nodaļa: 'iekšējās un ārējās drošības investīcijām vismaz 5%')? Joma atšķiras (aizsardzība vs iekšējā+ārējā drošība), tāpēc atstāts atsevišķi.", "statusi": []}, {"id": "jv-aizsardzibas-tehnologiju-attistiba", "saraksts": "jv", "nosaukums": "Aizsardzības tehnoloģiju attīstība (autonomās sistēmas, 5G/6G, pretgaisa u.c.)", "parbaudams": false, "temas": {"galvena": "aizsardziba", "papildu": ["izglitiba-un-zinatne"]}, "avoti": [{"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība", "citats": "Attīstīsim tehnoloģisko pārākumu, Latviju kā inovāciju laboratoriju ar pieejamu valsts, ES, NATO un citu finansējumu, īpašu uzmanību pievēršot autonomo sistēmu tehnoloģijām, 5G un 6G risinājumiem, elektroniskajai karadarbībai un pretgaisa aizsardzības sistēmām"}], "piezimes": "Uzskaitījums zem viena darbības vārda — nedalīts. Nepārbaudāms ('attīstīsim' bez mēra).", "jautajums": "", "statusi": []}, {"id": "jv-akcize-saldinatiem-dzerieniem", "saraksts": "jv", "nosaukums": "Akcīzes palielināšana saldinātiem dzērieniem un produktiem ar daudz cukura", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["veseliba"]}, "avoti": [{"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "pakāpeniski palielinot akcīzi saldinātiem dzērieniem un atsevišķiem produktiem ar augstu cukura saturu"}], "piezimes": "Atdalīts no kapitāla pieauguma nodokļa samazināšanas — atsevišķi izvērtējama darbība. Pārbaudāms: akcīzes likmju izmaiņas.", "jautajums": "", "statusi": []}, {"id": "jv-alianses-klatbutne-baltijas-jura-flanga", "saraksts": "jv", "nosaukums": "Alianses klātbūtnes stiprināšana Baltijas jūrā un austrumu flangā", "parbaudams": false, "temas": {"galvena": "aizsardziba", "papildu": ["arpolitika"]}, "avoti": [{"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība", "citats": "stiprinot alianses klātbūtni Baltijas jūrā un Austrumu flangā – uz zemes, jūrā un gaisā"}], "piezimes": "Atdalīts no NATO klātbūtnes Latvijā, jo attiecas uz citu teritoriju. 'Stiprinot' bez mēra — Nepārbaudāms.", "jautajums": "", "statusi": []}, {"id": "jv-austrumu-robezas-stiprinasana", "saraksts": "jv", "nosaukums": "Austrumu robežas stiprināšana", "parbaudams": false, "temas": {"galvena": "iekseja-drosiba-un-tiesiskums", "papildu": ["aizsardziba"]}, "avoti": [{"veids": "cvk", "vieta": "1. Drošība un aizsardzība", "citats": "Stiprināsim austrumu robežu"}, {"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība", "citats": "Stiprināsim robežas drošību, veidojot sinhronu Nacionālo bruņoto spēku un Valsts robežsardzes spēju attīstību"}], "piezimes": "Apvienots. Paplašinātā precizē līdzekli (NBS un VRS sinhrona attīstība), CVK — 'austrumu robežu'. Nepārbaudāms.", "jautajums": "", "statusi": []}, {"id": "jv-civilas-aizsardzibas-sistema", "saraksts": "jv", "nosaukums": "Civilās aizsardzības sistēmas stiprināšana", "parbaudams": false, "temas": {"galvena": "iekseja-drosiba-un-tiesiskums", "papildu": ["aizsardziba"]}, "avoti": [{"veids": "cvk", "vieta": "1. Drošība un aizsardzība", "citats": "Stiprināsim civilās aizsardzības sistēmu"}, {"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība", "citats": "Turpināsim civilās aizsardzības pilnveidi visā Latvijā"}], "piezimes": "CVK teikums par civilo aizsardzību un iekšlietu dienestiem sadalīts pēc paplašinātās programmas punktiem. Konkrētās darbības (patvertnes, mācības, sirēnas) izdalītas atsevišķi. Nepārbaudāms.", "jautajums": "", "statusi": []}, {"id": "jv-drosibas-investicijas-5-ikp", "saraksts": "jv", "nosaukums": "Iekšējās un ārējās drošības investīcijas vismaz 5% no IKP", "parbaudams": true, "temas": {"galvena": "aizsardziba", "papildu": ["nodokli-un-budzets", "iekseja-drosiba-un-tiesiskums"]}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Rūpējoties par valsts nākotni, drošību finansēsim atbildīgi"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Nodrošināsim finansējumu iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta"}], "piezimes": "Apvienots: CVK teikums atbilst paplašinātās programmas punktam (tāda pati secība Prioritātēs). CVK formulējumam mēra nav, tāpēc nosaukumā paplašinātās programmas mērs. Pārbaudāmība no paplašinātās (5%).", "jautajums": "CVK 'drošību finansēsim atbildīgi' pats par sevi ir Nepārbaudāms; vai pareizi to apvienot ar paplašinātās 5% punktu? Un vai šis nedublē jv-aizsardzibas-finansejums-5-ikp?", "statusi": []}, {"id": "jv-eirozonas-fiskalie-noteikumi", "saraksts": "jv", "nosaukums": "Budžeta politika atbilstoši eirozonas fiskālajiem noteikumiem", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": []}, "avoti": [{"veids": "cvk", "vieta": "3. Finanses", "citats": "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus"}, {"veids": "paplasinata", "vieta": "3. Finanses › Apņemšanās un uzdevumi", "citats": "Veidosim fiskāli atbildīgu valsts budžeta politiku saskaņā ar eirozonas ekonomiskās pārvaldības un fiskālās politikas noteikumiem"}], "piezimes": "Apvienots; CVK teikums sadalīts pēc paplašinātās programmas punktiem (CVK citātam vajadzīgs viss teikums). Robežgadījums: 'fiskāli atbildīgs' nav mērs, bet atbilstība eirozonas noteikumiem ir konstatējama (EK vērtējumi) — Pārbaudāms.", "jautajums": "", "statusi": []}, {"id": "jv-es-finansejums-austrumu-robezai", "saraksts": "jv", "nosaukums": "Lielāka ES finansējuma piesaiste austrumu robežas un reģiona drošībai", "parbaudams": false, "temas": {"galvena": "arpolitika", "papildu": ["iekseja-drosiba-un-tiesiskums"]}, "avoti": [{"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība", "citats": "Iestāsimies par lielāka Eiropas Savienības finansējuma pieejamību austrumu robežas un reģiona drošībai"}], "piezimes": "Nepārbaudāms: 'iestāsimies par' — iznākumu nosaka ES lēmums.", "jautajums": "", "statusi": []}, {"id": "jv-iedzivotaju-iesaiste-civilas-aizsardzibas-macibas", "saraksts": "jv", "nosaukums": "Iedzīvotāju un pašvaldību iesaiste civilās aizsardzības mācībās", "parbaudams": false, "temas": {"galvena": "iekseja-drosiba-un-tiesiskums", "papildu": ["regioni-un-pasvaldibas"]}, "avoti": [{"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība", "citats": "stiprināsim iedzīvotāju un pašvaldību iesaisti civilās aizsardzības mācībās un informācijas apritē"}], "piezimes": "Nepārbaudāms ('stiprināsim' bez mēra).", "jautajums": "", "statusi": []}, {"id": "jv-iekslietu-akademijas-kapacitate", "saraksts": "jv", "nosaukums": "Iekšējās drošības akadēmijas attīstība un jauniešu piesaiste dienestam", "parbaudams": false, "temas": {"galvena": "iekseja-drosiba-un-tiesiskums", "papildu": ["izglitiba-un-zinatne"]}, "avoti": [{"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā : abi avoti sola sabiedroto klātbūtnes pieaugumu Latvijā. CVK 'pastāvīgu', paplašinātā 'audzēsim' — CVK formulējums nosaukumā. Pārbaudāms, jo sabiedroto spēku skaits/pastāvīga izvietošana ir novērojama, lai gan mērķa skaitļa nav.", "jautajums": "Robežgadījums: 'attīstīsim' ir starp Nepārbaudāmo darbības vārdiem, bet objekts (sabiedroto spēku klātbūtne) ir izmērāms. Atzīmēts kā pārbaudāms — lūdzu apstiprināt.", "statusi": []}, {"id": "jv-nato-sadarbiba-ar-asv-un-kanadu", "saraksts": "jv", "nosaukums": "Militārā, ekonomiskā un tehnoloģiskā sadarbība ar ASV un Kanādu", "parbaudams": false, "temas": {"galvena": "arpolitika", "papildu": ["aizsardziba"]}, "avoti": [{"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība", "citats": "Strādāsim spēcīgai un vienotai NATO aliansei, padziļinot militāro, ekonomisko un tehnoloģisko sadarbību ar transatlantiskajiem stratēģiskajiem partneriem – Kanādu un Amerikas Savienotajām Valstīm"}], "piezimes": "Virziena deklarācija bez izmērāma iznākuma.", "jautajums": "", "statusi": []}, {"id": "jv-nbs-un-zemessardzes-stiprinasana", "saraksts": "jv", "nosaukums": "Nacionālo bruņoto spēku un Zemessardzes stiprināšana", "parbaudams": false, "temas": {"galvena": "aizsardziba", "papildu": []}, "avoti": [{"veids": "cvk", "vieta": "1. Drošība un aizsardzība", "citats": "Stiprināsim Nacionālos bruņotos spēkus un Zemessardzi"}, {"veids": "paplasinata", "vieta": "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Iekšējā drošība un civilā aizsardzība", "citats": "Stiprināsim Nacionālos bruņotos spēkus un Zemessardzi"}], "piezimes": "Apvienots (identisks teksts). Nepārbaudāms ('stiprināsim' bez mēra).", "jautajums": "", "statusi": []}, {"id": "jv-neapliekamais-minimums-80-minimalas-algas", "saraksts": "jv", "nosaukums": "Fiksētais neapliekamais minimums 80% no minimālās algas", "parbaudams": true, "temas": {"galvena": "nodokli-un-budzets", "papildu": ["ekonomika-un-darbs  document.getElementById("stats").innerHTML=`<strong>${n}</strong> Solījumi · <strong>${np}</strong> nepārbaudāmi · <strong>${abi}</strong> abos avotos · <strong style="color:var(--bad)">${miss}</strong> neizrakstīti avota punkti`}
// Pamatojums, Prioritātes un CVK atkārtojums paplašinātajā nav jāizraksta — tie ir pelēki, ne sarkani
function isMiss(u){return u.k!="h"&&!u.ids.length&&!["Pamatojums","Prioritātes","10 000 zīmju programmas apsolījums"].includes(u.sect)}
function unitHTML(u,i,src){if(u.k=="h")return `<div class="u h">${esc(u.t)}</div>`;
 let t=u.t,out="",pos=0;const qs=(u.q||[]).slice().sort((a,b)=>a[0]-b[0]);
 for(const [a,b,id] of qs){if(a<pos)continue;out+=esc(t.slice(pos,a))+`<mark data-id="${id}">`+esc(t.slice(a,b))+"</mark>";pos=b}
 out+=esc(t.slice(pos));
 const cls=["u",u.k,u.ids.length?"cov":isMiss(u)?"miss":"skip"].join(" ");
 const ch=u.ids.map(id=>`<span class="chip">${esc(id.replace(/^jv-/,""))}</span>`).join("");
 return `<div class="${cls}" data-ids="${u.ids.join(" ")}">${out}${ch?`<span class="chips">${ch}</span>`:""}</div>`}
function renderSrc(){const el=document.getElementById("src");
 el.innerHTML=(D.bad.length?`<div class="bad"><b>${D.bad.length} citāti nav atrasti avotā:</b><br>${D.bad.map(b=>esc(b[0]+": "+b[1])).join("<br>")}</div>`:"")+
 `<h2>CVK programma</h2>`+D.cvk.map((u,i)=>unitHTML(u,i,"cvk")).join("")+`<h2>Paplašinātā programma</h2>`+D.pap.map((u,i)=>unitHTML(u,i,"pap")).join("");
 el.querySelectorAll(".u[data-ids]").forEach(u=>u.onclick=()=>{const ids=u.dataset.ids.split(" ").filter(Boolean);if(ids[0])activate(ids[0],true)})}
function card(s){const f=fb[s.id]||{};
 const tags=`<span class="tag ${s.parbaudams?"p":"np"}">${s.parbaudams?"Pārbaudāms":"Nepārbaudāms"}</span><span class="tag gal">${esc(s.temas?.galvena)}</span>${(s.temas?.papildu||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}`;
 const q=(s.avoti||[]).map(a=>`<div class="q"><div class="src">${a.veids=="cvk"?"CVK":"Paplašinātā"} · ${esc(a.vieta)}</div>„${esc(a.citats)}”</div>`).join("");
 const btn=(k,l)=>`<button data-k="${k}" class="${f.k==k?"on":""}">${l}</button>`;
 return `<div class="s${active==s.id?" act":""}" id="s-${s.id}"><div class="id">${esc(s.id)}</div><div class="t">${esc(s.nosaukums)}</div><div>${tags}</div>${q}
 ${s.piezimes?`<div class="note">Piezīmes: ${esc(s.piezimes)}</div>`:""}${(s.jautajums||"").trim()?`<div class="ask">Jautājums: ${esc(s.jautajums)}</div>`:""}
 <div class="fb" data-id="${s.id}">${btn("ok","OK")}${btn("dalit","Dalīt")}${btn("apvienot","Apvienot ar…")}${btn("parbaudamiba","Pārbaudāmība nepareiza")}${btn("tema","Tēma")}${btn("nosaukums","Nosaukums")}${btn("izmest","Nav solījums")}<input placeholder="komentārs" value="${esc(f.c||"")}"></div></div>`}
function renderList(){const el=document.getElementById("list");const fn=F[filter][1];
 el.innerHTML=`<details><summary>Ekstraktora kopsavilkums</summary><pre>${esc(D.summary)}</pre></details>`+D.sol.filter(fn).map(card).join("");
 el.querySelectorAll(".s").forEach(c=>c.onmouseenter=()=>activate(c.id.slice(2),false));
 el.querySelectorAll(".fb").forEach(b=>{const id=b.dataset.id;
  b.querySelectorAll("button").forEach(x=>x.onclick=()=>{const f=fb[id]||(fb[id]={});f.k=f.k==x.dataset.k?null:x.dataset.k;if(!f.k&&!f.c)delete fb[id];renderList()});
  b.querySelector("input").onchange=e=>{const f=fb[id]||(fb[id]={});f.c=e.target.value;if(!f.k&&!f.c)delete fb[id]}})}
function activate(id,scroll){active=id;document.querySelectorAll(".u.act,.s.act").forEach(e=>e.classList.remove("act"));document.querySelectorAll("mark.me").forEach(m=>m.classList.remove("me"));
 let first=null;document.querySelectorAll(".u[data-ids]").forEach(u=>{if(u.dataset.ids.split(" ").includes(id)){u.classList.add("act");first??=u}});
 document.querySelectorAll(`mark[data-id="${id}"]`).forEach(m=>m.classList.add("me"));
 const c=document.getElementById("s-"+id);c?.classList.add("act");
 if(scroll){c?.scrollIntoView({block:"center",behavior:"smooth"})}else{first?.scrollIntoView({block:"nearest",behavior:"smooth"})}}
function renderFilt(){document.getElementById("filt").innerHTML=Object.entries(F).map(([k,[l,fn]])=>`<button data-k="${k}" class="${filter==k?"on":""}">${l} (${D.sol.filter(fn).length})</button>`).join("");
 document.querySelectorAll("#filt button").forEach(b=>b.onclick=()=>{filter=b.dataset.k;renderFilt();renderList()})}
document.getElementById("copy").onclick=()=>{const L={ok:"OK",dalit:"Dalīt",apvienot:"Apvienot",parbaudamiba:"Pārbaudāmība nepareiza",tema:"Tēma",nosaukums:"Nosaukums",izmest:"Nav solījums"};
 const t=Object.entries(fb).map(([id,f])=>`- \`${id}\` — ${f.k?L[f.k]:""}${f.c?": "+f.c:""}`).join("\n")||"(nav atsauksmju)";
 navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById("copy");b.textContent="Nokopēts";setTimeout(()=>b.textContent="Kopēt atsauksmi",1500)})};
stats();renderFilt();renderSrc();renderList();
</script>
</body>
</html>
