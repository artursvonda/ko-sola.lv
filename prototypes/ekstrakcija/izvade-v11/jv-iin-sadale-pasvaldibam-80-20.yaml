id: jv-iin-sadale-pasvaldibam-80-20
saraksts: jv
nosaukums: "IIN sadale pašvaldībām: 80% pēc dzīvesvietas, 20% pēc darbavietas"
parbaudams: true
temas:
  galvena: regioni-un-pasvaldibas
  papildu: [nodokli-un-budzets]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim taisnīgu un uzņēmējdarbību veicinošu nodokļu ieņēmumu sadali starp pašvaldībām un valsti"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Ieviesīsim līdzsvarotu iedzīvotāju ienākuma nodokļa sadali starp pašvaldībām, novirzot 80% pašvaldības budžetā pēc iedzīvotāja deklarētās dzīvesvietas un 20% atbilstoši darbavietai"
nesakritiba: "CVK sola „nodokļu ieņēmumu sadali starp pašvaldībām un valsti“ bez mēra, paplašinātā — cits apjoms: „iedzīvotāju ienākuma nodokļa sadali starp pašvaldībām“ ar mēru 80% pēc dzīvesvietas un 20% pēc darbavietas."
piezimes: "Apvienots, jo paplašinātās 3. nodaļā tas ir vienīgais punkts par ieņēmumu sadali („uzņēmējdarbību veicinošu“ ↔ 20% pēc darbavietas); CVK bez mēra → vērtē pēc 80/20. 9. nodaļas „pašvaldību finanšu izlīdzināšanas modelis“ ir cits iznākums — atstāts 9. nodaļai. Prioritāte „līdzsvarots IIN sadales modelis pašvaldībām“ atkārto."
jautajums: "CVK runā par sadali starp pašvaldībām UN valsti (vertikāli), paplašinātā — starp pašvaldībām (horizontāli, 80/20). Vai tas ir viens Solījums (kā tagad), vai CVK teikums jāizdala atsevišķā nepārbaudāmā Solījumā?"
