id: jv-aizsardzibas-industrijas-eksporta-triskarsosana
saraksts: jv
nosaukums: "Aizsardzības industrijas eksporta apjoma trīskāršošana"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [aizsardziba]
avoti:
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "trīskāršojot Latvijas aizsardzības industrijas eksporta apjomu"
nesakritiba: ""
piezimes: "„-ot“ palīgteikums ar konkrētu mēru 4. nodaļas punktā „Panāksim pastāvīgu produktivitātes pieaugumu virs 3% gadā…“; pārējās punkta daļas — 4. nodaļas izpildei. Piesaistīts CVK 1. nod. teikumam par militāro industriju un eksportu. Prioritāte (4. nod.) atkārto."
jautajums: "Vai šis ir CVK „Attīstīsim vietējo militāro … industriju, lai … stiprinātu … eksportu“ mērs (tad apvienot ar jv-vietejas-militaras-industrijas-attistiba un vērtēt pēc trīskāršošanas, §4), vai jauna atsevišķi izvērtējama darbība (kā tagad)?"
