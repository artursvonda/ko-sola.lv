id: jv-valsts-kapitalsabiedribu-akciju-kotacija-birza
saraksts: jv
nosaukums: "Valsts kapitālsabiedrību akciju kotācija biržā (līdz 25%)"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Attīstīsim kapitāla tirgu un valsts attīstības fondu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "virzīsim valsts kapitālsabiedrību akciju kotāciju biržā (līdz 25%)"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Uzņēmējdarbība un investīcijas"
    citats: "Izvērtēsim iespēju veikt valsts kapitālsabiedrību daļēju kotāciju biržā, saglabājot valsts kontroli"
nesakritiba: "CVK tikai „Attīstīsim kapitāla tirgu“ bez mēra; paplašinātā 3. nodaļā „virzīsim … akciju kotāciju biržā (līdz 25%)“, bet 4. nodaļā vājāk — „Izvērtēsim iespēju veikt … daļēju kotāciju biržā, saglabājot valsts kontroli“."
piezimes: "CVK citāts piesaistīts, jo kotācija ir paplašinātās programmas „kapitāla tirgus attīstības“ konkretizācija (§4 pēdējais punkts). CVK bez mēra → vērtē pēc 3. nodaļas punkta (līdz 25%). 4. nodaļas punkta pirmais teikums (kapitālsabiedrību pārvaldības modelis) — 4. nodaļas izpildei."
jautajums: ""
