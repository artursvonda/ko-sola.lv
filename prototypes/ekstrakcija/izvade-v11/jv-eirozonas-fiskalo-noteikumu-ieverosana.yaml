nesakritiba: ""
piezimes: "CVK citēts viss teikums, jo „ievērojot …“ bez „Veidosim … budžetu“ nenes apņemšanos; tas pats teikums arī jv-arejais-parads-zem-55-no-ikp. Robežgadījums pārbaudāmībā: „fiskāli atbildīgu“ ir vispārīgs, bet eirozonas fiskālie noteikumi ir konkrēts normatīvs (ievēroti vai nē). „ekonomiskās pārvaldības un fiskālās politikas noteikumiem“ uzskatīts par to pašu ietvaru, ne Nesakritību. Prioritāte atkārto."
jautajums: ""
