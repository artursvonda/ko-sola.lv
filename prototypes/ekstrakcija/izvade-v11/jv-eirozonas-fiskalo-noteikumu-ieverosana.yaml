id: jv-eirozonas-fiskalo-noteikumu-ieverosana
saraksts: jv
nosaukums: "Valsts budžets atbilstoši eirozonas fiskālajiem noteikumiem"
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP, ievērojot eirozonas fiskālos noteikumus"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
