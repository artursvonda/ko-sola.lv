id: jv-vietejas-militaras-industrijas-attistiba
saraksts: jv
nosaukums: "Vietējās militārās un divējāda lietojuma industrijas attīstība"
parbaudams: false
temas:
  galvena: aizsardziba
  papildu: [ekonomika-un-darbs]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Attīstīsim vietējo militāro un divējāda lietojuma industriju"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "mērķtiecīgi attīstīsim pašmāju militāro industriju, tai skaitā izmantojot Eiropas Savienības finanšu instrumentus"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "attīstot pašmāju militāro industriju un tehnoloģijas kopā ar tuvākajiem sabiedrotajiem"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Aizsardzības industrija"
    citats: "Attīstīsim vietējo aizsardzības industriju kā galveno drošības, inovāciju un tehnoloģiju dzinēju"
  - veids: paplasinata
    vieta: "4. Ekonomika, enerģētika un uzņēmējdarbība › Apņemšanās un uzdevumi › Aizsardzības industrija"
    citats: "Stiprināsim vietējo militāro un divējāda lietojuma preču ražošanu, veidojot sinerģiju starp valsti, Nacionālajiem bruņotajiem spēkiem, zinātni un privāto sektoru"
nesakritiba: "CVK mērķis: „lai ieguldījumi vienlaikus stiprinātu arī Latvijas ražošanu, zinātni un eksportu“; paplašinātā nemin šo mērķi, bet pievieno „izmantojot Eiropas Savienības finanšu instrumentus“, „kopā ar tuvākajiem sabiedrotajiem“, „kā galveno drošības, inovāciju un tehnoloģiju dzinēju“."
piezimes: "Nav mēra → nepārbaudāms. Eksporta trīskāršošana (4. nod.) izdalīta atsevišķi. Prioritāte „vietējās aizsardzības industrija kā galvenā … dzinējs“ (4. nod.) atkārto."
jautajums: ""
