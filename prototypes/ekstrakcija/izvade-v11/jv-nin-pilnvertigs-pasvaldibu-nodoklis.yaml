id: jv-nin-pilnvertigs-pasvaldibu-nodoklis
saraksts: jv
nosaukums: "NĪN kā pilnvērtīgs pašvaldību nodoklis ar plašākām tiesībām lemt par likmēm"
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: [regioni-un-pasvaldibas, majokli]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Padarīsim nekustamā īpašuma nodokli par pilnvērtīgu pašvaldību nodokli ar prognozējamību un sociālo taisnīgumu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Pārveidosim nekustamā īpašuma nodokli kā pilnvērtīgu pašvaldību nodokli, paplašinot pašvaldību tiesības lemt par nodokļa likmēm"
nesakritiba: "CVK sola „pilnvērtīgu pašvaldību nodokli“ bez mēra, paplašinātā to konkretizē: „paplašinot pašvaldību tiesības lemt par nodokļa likmēm“."
piezimes: "„-ot“ daļa „paplašinot pašvaldību tiesības lemt par nodokļa likmēm“ nav dalīta: tā izsaka, ko nozīmē „pilnvērtīgs pašvaldību nodoklis“, nevis citu iznākumu. CVK citātā nav mēra → vērtē pēc paplašinātās (§4), tāpēc pārbaudāms. „vienlaikus nodrošinot … prognozējamību un sociālo taisnīgumu“ — mērķis, nav dalīts."
jautajums: ""
