id: jv-valsts-attistibas-fonda-dibinasana
saraksts: jv
nosaukums: "Valsts attīstības fonda dibināšana lielo valsts kapitālsabiedrību pārvaldībai"
parbaudams: true
temas:
  galvena: ekonomika-un-darbs
  papildu: [valsts-parvalde]
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Attīstīsim kapitāla tirgu un valsts attīstības fondu"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Veicināsim Latvijas kapitāla tirgus attīstību, dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai"
nesakritiba: "CVK: „Attīstīsim … valsts attīstības fondu“ bez mēra un mērķa; paplašinātā: „dibinot valsts attīstības fondu valsts lielo kapitālsabiedrību vienotai pārvaldībai“."
piezimes: "Paplašinātās punkts dalīts 3 Solījumos (§1 piemērs); galvenais teikums „Veicināsim … kapitāla tirgus attīstību“ ir vispārīgs → Solījums ir „-ot“ daļa. CVK teikumam daļām nav sava darbības vārda → citēts viss un pievienots visiem trim (§3, §4). Pārbaudāms: iestādes izveide."
jautajums: ""
