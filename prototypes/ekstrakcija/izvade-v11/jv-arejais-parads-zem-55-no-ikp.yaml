id: jv-arejais-parads-zem-55-no-ikp
saraksts: jv
nosaukums: "Valsts ārējā parāda līmenis zem 55% no IKP"
parbaudams: true
temas:
  galvena: nodokli-un-budzets
  papildu: []
avoti:
  - veids: cvk
    vieta: "3. Finanses"
    citats: "Veidosim fiskāli atbildīgu budžetu ar valsts ārējā parāda līmeni zem 55% no IKP"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nepārsniegsim valsts parāda līmeni virs 55% no iekšzemes kopprodukta"
nesakritiba: "CVK sola „valsts ārējā parāda līmeni zem 55%“, paplašinātā — cits rādītājs: „valsts parāda līmeni“ nepārsniegt 55%."
piezimes: "CVK teikums dalīts sekojot paplašinātās programmas dalījumam (§4): parāda līmenis un eirozonas fiskālie noteikumi — atsevišķi Solījumi. Prioritāte „Valsts parāda līmeņa nepalienāšana virs 55%“ atkārto, nav citēta. Vērtē pēc CVK: ārējais parāds."
