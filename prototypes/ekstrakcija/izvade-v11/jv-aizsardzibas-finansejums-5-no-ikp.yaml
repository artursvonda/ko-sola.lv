id: jv-aizsardzibas-finansejums-5-no-ikp
saraksts: jv
nosaukums: "Aizsardzības finansējums 5% no IKP"
parbaudams: true
temas:
  galvena: aizsardziba
  papildu: [nodokli-un-budzets]
avoti:
  - veids: cvk
    vieta: "1. Drošība un aizsardzība"
    citats: "Nodrošināsim aizsardzības finansējumu 5% no IKP"
  - veids: cvk
    vieta: "3. Finanses"
    citats: "drošību finansēsim atbildīgi"
  - veids: paplasinata
    vieta: "1. Drošība un aizsardzība › Apņemšanās un uzdevumi › Latvijas aizsardzība, inovācijas un partnerība"
    citats: "ik gadu ieguldot aizsardzībā 5% no iekšzemes kopprodukta"
  - veids: paplasinata
    vieta: "2. Ārpolitika un latvieši pasaulē › Apņemšanās un uzdevumi › Ārējā drošība"
    citats: "Ieguldīsim 5% no iekšzemes kopprodukta valsts aizsardzībā"
  - veids: paplasinata
    vieta: "3. Finanses › Apņemšanās un uzdevumi"
    citats: "Nodrošināsim finansējumu iekšējās un ārējās drošības investīcijām vismaz 5% apmērā no iekšzemes kopprodukta"
nesakritiba: "CVK 1. nodaļā „aizsardzības finansējumu 5% no IKP“, CVK 3. nodaļā tikai „drošību finansēsim atbildīgi“ bez mēra, paplašinātā 1. nodaļā pievieno „ik gadu“, bet 3. nodaļā cits, plašāks rādītājs un mērs — „iekšējās un ārējās drošības investīcijām vismaz 5%“."
piezimes: "Prioritāšu punkti (1. nod. „Aizsardzības spēju finansējums 5% apmērā“, 3. nod. „Iekšējās un ārējās drošības investīciju finansēšana vismaz 5%“) atkārto, nav citēti. Vērtē pēc CVK: aizsardzības finansējums 5% no IKP. 3. nodaļas izpildē: paplašinātās 3. nod. punkts paliek šeit, jo §4 „aizsardzība ↔ iekšējā un ārējā drošība“ ir Nesakritības (rādītāja), ne atsevišķa Solījuma piemērs; CVK 3. nod. „drošību finansēsim atbildīgi“ ir šī paplašinātā punkta CVK atbilsme, tāpēc pievienots kā citāts."
jautajums: "Vai CVK 3. nod. „Rūpējoties par valsts nākotni, drošību finansēsim atbildīgi“ ir šis Solījums (kā tagad), vai atsevišķs nepārbaudāms Solījums (vārds „atbildīgi“ var nozīmēt arī ierobežotu, ne 5% finansējumu)?"
