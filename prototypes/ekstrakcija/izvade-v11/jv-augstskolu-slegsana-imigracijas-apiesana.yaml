id: jv-augstskolu-slegsana-imigracijas-apiesana
saraksts: jv
nosaukums: "Augstskolu slēgšana par drošību apdraudošu praksi vai imigrācijas normu apiešanu"
parbaudams: true
temas:
  galvena: izglitiba-un-zinatne
  papildu: [migracija-un-diaspora]
avoti:
  - veids: paplasinata
    vieta: "8. Izglītība, latviešu valoda, kultūra un pilsoniskā sabiedrība › Apņemšanās un uzdevumi › Darba tirgus vajadzībām atbilstoša mūžizglītība"
    citats: "Slēgsim tādas augstākās izglītības institūcijas, kas īsteno Latvijas drošību un izglītības kvalitāti apdraudošu praksi vai taisa simulatīvus darījumus imigrācijas normu apiešanai"
nesakritiba: ""
piezimes: "8. nodaļas punkts; CVK 8. nodaļā atbilstoša teikuma nav, piesaistīts CVK 1. nod. „stingrākus nosacījumus trešo valstu pilsoņu … studiju … jomā“. Pārbaudāms (iestāžu slēgšana), bet nosacīts — ja šādu iestāžu nav, izpildi grūti vērtēt."
jautajums: "Vai šo punktu atstāt 1. nodaļas izpildē (saite ar studiju imigrācijas nosacījumiem) vai pārcelt uz „Ārpus CVK nodaļām“?"
